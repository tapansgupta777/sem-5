nverter cross-section\" style=\"display:block;width:100%;height:auto;max-width:700px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>n-well CMOS inverter cross-section\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"699\" height=\"239\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"47\" y=\"122\" width=\"606\" height=\"91\" fill=\"#34283c\" stroke=\"#a78bfa\" rx=\"2\"/>\u003crect x=\"62\" y=\"122\" width=\"318\" height=\"71\" fill=\"#1c3455\" stroke=\"#60a5fa\" rx=\"2\"/>\u003crect x=\"79\" y=\"124\" width=\"44\" height=\"30\" fill=\"#1c4962\" stroke=\"#60a5fa\" rx=\"2\"/>\u003crect x=\"151\" y=\"124\" width=\"46\" height=\"30\" fill=\"#473821\" stroke=\"#fbbf24\" rx=\"2\"/>\u003crect x=\"278\" y=\"124\" width=\"46\" height=\"30\" fill=\"#473821\" stroke=\"#fbbf24\" rx=\"2\"/>\u003crect x=\"416\" y=\"124\" width=\"46\" height=\"30\" fill=\"#14513a\" stroke=\"#4ade80\" rx=\"2\"/>\u003crect x=\"538\" y=\"124\" width=\"46\" height=\"30\" fill=\"#14513a\" stroke=\"#4ade80\" rx=\"2\"/>\u003crect x=\"600\" y=\"124\" width=\"40\" height=\"30\" fill=\"#473821\" stroke=\"#fbbf24\" rx=\"2\"/>\u003crect x=\"200\" y=\"119\" width=\"73\" height=\"5\" fill=\"#165464\" stroke=\"#5eead4\" rx=\"2\"/>\u003crect x=\"465\" y=\"119\" width=\"70\" height=\"5\" fill=\"#165464\" stroke=\"#5eead4\" rx=\"2\"/>\u003crect x=\"200\" y=\"103\" width=\"73\" height=\"16\" fill=\"#482638\" stroke=\"#fb7185\" rx=\"2\"/>\u003crect x=\"465\" y=\"103\" width=\"70\" height=\"16\" fill=\"#482638\" stroke=\"#fb7185\" rx=\"2\"/>\u003cpath d=\"M101 124 V49 H174 V124 M561 124 V49 H620 V124 M301 124 V69 H439 V124\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M236 103 V88 H500 V103\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ctext x=\"137\" y=\"43\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"591\" y=\"43\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"370\" y=\"62\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"367\" y=\"83\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">VIN\u003c/text>\u003ctext x=\"101\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"174\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"301\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"440\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"561\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"620\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"220\" y=\"179\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n-well · PMOS\u003c/text>\u003ctext x=\"510\" y=\"194\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p substrate · NMOS\u003c/text>\u003ctext x=\"101\" y=\"170\" fill=\"#60a5fa\" font-size=\"10\" text-anchor=\"middle\">well tap\u003c/text>\u003ctext x=\"620\" y=\"170\" fill=\"#fbbf24\" font-size=\"10\" text-anchor=\"middle\">body tap\u003c/text>\u003ctext x=\"350\" y=\"229\" fill=\"#94a3b8\" font-size=\"11\" text-anchor=\"middle\">Gate oxide separates the polysilicon and silicon\u003c/text>\u003c/svg>"}},{"id":"cmos-u4-q13","subject":"cmos","unit":4,"number":13,"q":"Explain the λ-based design rules for n-well, contacts and metal layers. Compare λ-based and micron-based design rules.","ans":{"s":"λ rules use kλ, micron rules state process-specific dimensions.","m":"Check well size/spacing/enclosure, contact size/spacing/overlap, and metal width/spacing/via enclosure. A teaching example uses 2λ contacts and 3λ Metal1 width.","d":"For n-well specify minimum width, adjacent-well spacing and enclosure of PMOS active and well taps. For contacts specify cut dimensions/spacing and overlap by active or poly below and Metal1 above. For metal specify widths, spaces and via enclosure. λ-based multiples are convenient for scalable first-order layouts. Micron-based rules state absolute process-specific dimensions and cover additional manufacturing cases. The actual PDK is authoritative."}},{"id":"cmos-u4-q14","subject":"cmos","unit":4,"number":14,"q":"Draw the stick diagram of a CMOS 2:1 multiplexer implemented using transmission gates.","ans":{"s":"Y=S̄D0+SD1. Two transmission gates share Y. An inverter generates S̄.","m":"Put a complementary MOS pass pair between each data input and Y. TG0 is enabled by S̄ and TG1 by S. Use metal to tie corresponding p and n channel endpoints.","d":"On the D0 side draw p-active with gate S and n-active with gate S̄. Contact and tie the corresponding data ends together as D0 and the opposite ends as Y. On the D1 side use S̄ on p and S on n. Tie those endpoints to D1 and the same Y. Put a static inverter beside the select net. Use separate amber p-active and green n-active, red poly controls, blue metal and white contacts. Add ordinary body and well connections. Since one device carries each extreme strongly, both data paths pass a full-swing signal.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 242\" role=\"img\" aria-label=\"Transmission gate mux stick diagram\" style=\"display:block;width:100%;height:auto;max-width:680px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Transmission gate mux stick diagram\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"679\" height=\"241\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M65 68 H246 M425 68 H606\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 165 H246 M425 165 H606\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M67 68 V165 M604 68 V165 M245 68 V165 M427 68 V165 M245 115 H427 M337 115 V206\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M153 53 V83 M153 149 V181 M515 53 V83 M515 149 V181\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"67\" cy=\"68\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"67\" cy=\"165\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"245\" cy=\"68\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"245\" cy=\"165\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"427\" cy=\"68\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"427\" cy=\"165\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"604\" cy=\"68\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"604\" cy=\"165\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"245\" cy=\"115\" r=\"4\" fill=\"#60a5fa\"/>\u003ccircle cx=\"427\" cy=\"115\" r=\"4\" fill=\"#60a5fa\"/>\u003ccircle cx=\"337\" cy=\"115\" r=\"4\" fill=\"#60a5fa\"/>\u003ctext x=\"45\" y=\"119\" fill=\"#60a5fa\" font-size=\"13\" text-anchor=\"middle\">D0\u003c/text>\u003ctext x=\"627\" y=\"119\" fill=\"#60a5fa\" font-size=\"13\" text-anchor=\"middle\">D1\u003c/text>\u003ctext x=\"337\" y=\"225\" fill=\"#60a5fa\" font-size=\"13\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"153\" y=\"45\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">S to p\u003c/text>\u003ctext x=\"153\" y=\"203\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">S̄ to n\u003c/text>\u003ctext x=\"515\" y=\"45\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">S̄ to p\u003c/text>\u003ctext x=\"515\" y=\"203\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">S to n\u003c/text>\u003ctext x=\"336\" y=\"30\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG0 on for S=0  ·  TG1 on for S=1\u003c/text>\u003ctext x=\"336\" y=\"61\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\">p-active\u003c/text>\u003ctext x=\"336\" y=\"169\" fill=\"#4ade80\" font-size=\"11\" text-anchor=\"middle\">n-active\u003c/text>\u003c/svg>"}}]},{"title":"Delay, Power & Interconnect in CMOS","questions":[{"id":"cmos-u5-q1","subject":"cmos","unit":5,"number":1,"q":"Explain the RC delay model. Show how the delay of a gate is estimated using equivalent resistance and capacitance.","ans":{"s":"Gate ≈ effective Ron driving CL. Delay at 50%≈0.69RonCL. Series paths use Elmore sum.","m":"Use pull-up or pull-down on-resistance with the total output capacitance. A first-order response reaches the 50% threshold in ln(2)RC. For a tree, sum the product of each path resistance and the downstream capacitance seen by it.","d":"Replace the conducting MOS network by an effective resistance and add its output diffusion, interconnect and fanout capacitance to get CL. Following a low-to-high step, VOUT=VDD(1−e^(−t/RpCL)). For discharge VOUT=VDDe^(−t/RnCL). At 50% these give tpLH≈0.69RpCL and tpHL≈0.69RnCL. In a distributed RC tree, the Elmore time constant at a sink is ∑RiCdown,i over edges on the driver-to-sink path. Nodes off that path add capacitance when they share a relevant upstream resistance. Relation to 50% delay is approximate in a multipole system. Transistor nonlinearity, input slew and wire coupling limit accuracy.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 670 192\" role=\"img\" aria-label=\"Distributed wire RC ladder driven through effective output resistance\" style=\"display:block;width:100%;height:auto;max-width:670px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Distributed wire RC ladder driven through effective output resistance\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"669\" height=\"191\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"60\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"190\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"325\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"460\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M34 61 H60 M137 61 H190 M267 61 H325 M402 61 H460 M537 61 H626\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M167 61 V109 M304 61 V109 M438 61 V109 M580 61 V109 M155 109 H179 M155 118 H179 M292 109 H316 M292 118 H316 M426 109 H450 M426 118 H450 M568 109 H592 M568 118 H592 M167 118 V143 M304 118 V143 M438 118 V143 M580 118 V143 M144 143 H602\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"167\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"304\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"438\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"580\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"99\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rdriver\u003c/text>\u003ctext x=\"229\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"364\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"497\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"169\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/6\u003c/text>\u003ctext x=\"304\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/3\u003c/text>\u003ctext x=\"438\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/3\u003c/text>\u003ctext x=\"580\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/6 + CL\u003c/text>\u003ctext x=\"606\" y=\"48\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Receiver\u003c/text>\u003ctext x=\"376\" y=\"166\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">Each wire resistance sees the capacitances downstream from it.\u003c/text>\u003c/svg>"}},{"id":"cmos-u5-q2","subject":"cmos","unit":5,"number":2,"q":"Explain the linear delay model. Define logical effort, electrical effort, branching effort and parasitic delay. Calculate the logical effort of an inverter, 2-input NAND and 2-input NOR gate.","ans":{"s":"d=gh+p. h=Cout/Cin. gINV=1, gNAND2=4/3, gNOR2=5/3. b=Ctotal/Con-path.","m":"Logical effort g is the per-input capacitance ratio versus an equally strong inverter. Electrical effort h is load/input capacitance, b is total fanout/on-path fanout and p is intrinsic normalized delay. Gate widths for equal drive give 1, 4/3 and 5/3.","d":"The normalized delay is d=gh+p when h uses the total load. When h_on counts the on-path load, write d=g·h_on·b+p, with b equal to total load divided by on-path load. Let a reference inverter have n width 1 and p width 2, with input capacitance proportional to width. The inverter input has 3 units, giving g=1. NAND2 needs each stacked n device width 2 and each p width 2 for equal worst-case drive, giving per-input 4 units and g=4/3. NOR2 needs each stacked p width 4 while each n width is 1, giving 5 units and g=5/3. Parasitic p captures unloaded delay from diffusion and internal capacitance. Typical normalized illustrations use p≈1 for an inverter and p≈2 for NAND2/NOR2."}},{"id":"cmos-u5-q3","subject":"cmos","unit":5,"number":3,"q":"Explain delay in a multistage logic network. How is the optimum number of stages found?","ans":{"s":"Path effort F=GBH. For N stages size for f=F^(1/N); D≈Nf+P. Evaluate feasible N.","m":"Compute path logical effort G, branching effort B and electrical effort H. Equal stage effort minimizes delay for a fixed stage count. Compare nearby feasible counts and choose the smallest delay with parasitics included.","d":"For a path with N stages use G=∏gᵢ, B=∏bᵢ and H=CL/Cin,first. Then F=GBH and D≈∑(gᵢhᵢ+pᵢ) with hᵢ using total load, or use bᵢ explicitly if hᵢ uses on-path load. Minimum for fixed N occurs when all fᵢ=F^(1/N), so Dmin≈N·F^(1/N)+P, where P=∑pᵢ. Work backward to size gate input loads, respecting any fixed side loads, stage polarity and available cells. With inverter-like parasitic p≈1, an effort about 3–4 per stage often minimizes buffer delay. Try nearby integer stage counts and recompute F and P if gates change. More stages reduce per-stage effort but add parasitic delay."}},{"id":"cmos-u5-q4","subject":"cmos","unit":5,"number":4,"q":"Explain gate diffusion capacitance and its effect on delay.","ans":{"s":"Junction capacitance has area and sidewall terms. Cdiff slows each charged/discharged node. Share diffusion to reduce it.","m":"Source/drain diffusion forms a reverse-biased junction with the body. Its bottom and sidewall capacitances contribute to output and internal-node load. Larger diffusion or junction perimeter usually increases delay.","d":"The phrase gate diffusion capacitance refers to the source/drain diffusion capacitance associated with a logic gate. Reverse bias across each diffusion-body junction gives Cdiff≈A·Cj(V)+P·Cjsw(V), with area A, junction perimeter P and bias-dependent per-area/per-length parameters. Output-connected drains add to the gate's load and intrinsic p. Shared internal stack nodes add transient delay or charge-sharing effects. Gate overlap and wire capacitance are further contributions, separate from the diffusion junction. Diffusion sharing, compact contacts and deliberate transistor sizing reduce switched parasitics."}},{"id":"cmos-u5-q5","subject":"cmos","unit":5,"number":5,"q":"Explain dynamic power dissipation in CMOS circuits with its expression. How can it be reduced?","ans":{"s":"Psw=αCVDD²f. Reduce voltage, capacitance, activity or frequency. Overlap current also costs dynamic power.","m":"Every 0→1 transition draws CVDD² from the supply. Multiply by switching rate αf. Lower VDD is especially effective because it appears squared, while clock gating and reduced glitching cut activity.","d":"Each full charge of a load C draws CVDD² from VDD. Half is stored and half dissipated during charging, and discharge dissipates the other half. Hence Psw=∑αᵢCᵢVDD²f for average low-to-high activities αᵢ. Short-circuit dynamic power adds when both devices conduct during input transitions. Use voltage scaling, safe clock gating, operand isolation, glitch reduction, smaller interconnect loads and appropriately sized gates. Reduce f for workloads that can run slower, and manage input slew to limit short-circuit current. Validate timing when lowering voltage or drive."}},{"id":"cmos-u5-q6","subject":"cmos","unit":5,"number":6,"q":"Explain static (leakage) power. Name the different leakage components.","ans":{"s":"Pstatic≈VDDIleak. Leakage comes from subthreshold conduction, gate tunneling, reverse-biased junctions and GIDL.","m":"Static CMOS still draws leakage with unchanged logic inputs. The main terms are weak inversion through off devices, gate-oxide tunneling and reverse-biased diffusion-to-body leakage, with field-induced mechanisms also possible.","d":"Even with no intentional DC path through a stable logic gate, leakage produces Pstatic≈VDD∑Ileak from the supply. Subthreshold current flows through an off channel and depends exponentially on threshold and temperature. Gate leakage comes from tunneling through the dielectric. Reverse junction leakage includes depletion generation and band-to-band tunneling. High drain-to-gate fields can produce gate-induced drain leakage (GIDL). Device geometry, process, supply, temperature, body bias and input state change the leakage mix. High-VT cells, power gating, stack effects and body bias can reduce it subject to timing and wakeup constraints."}},{"id":"cmos-u5-q7","subject":"cmos","unit":5,"number":7,"q":"Explain the power-delay trade-off. Define the power-delay product (PDP).","ans":{"s":"PDP=Pavg·tp, in joules. Increasing drive or VDD may improve speed while raising energy or power.","m":"Larger devices or increased VDD can improve delay but generally increase switched energy or leakage. PDP multiplies average power by propagation delay, combining power and speed in a single metric.","d":"For a tight timing target one can use wider pull devices, lower-VT cells or higher VDD, thereby often increasing switched C, dynamic power or leakage. Lower VDD reduces capacitive energy ∝CVDD² but reduces gate overdrive and increases delay. Define PDP=Pavg·tp, in joules, and specify the activity and measurement conditions used for Pavg. For a consistent switching event or operation, separately define E=∫P(t)dt over that event. Optimization requires the same loading, activity, supply and workload assumptions for all alternatives."}},{"id":"cmos-u5-q8","subject":"cmos","unit":5,"number":8,"q":"Explain wire capacitance and wire resistance. Explain the impact of interconnect on circuit delay.","ans":{"s":"R≈RsheetL/W, C≈cL. Distributed wire-only RC delay scales roughly with L². Coupling changes effective C.","m":"A wire has distributed resistance, capacitance to adjacent layers and capacitance to neighboring wires. Far-end transitions slow as metal length increases. Width, material, layer and spacing influence the delay.","d":"For uniform wire Rw=ρL/(Wt)=RsheetL/W and Cw≈cL with contributions from area, fringe and neighbor coupling. In a distributed RC model far-end Elmore time constant is approximately Rdriver(Cw+CL)+Rw(Cw/2+CL) plus other driver parasitics. Wire self-delay term RwCw/2 scales with L². Adjacent nets switching in opposite directions can raise effective coupling load compared with same-direction transitions. Long upper-layer routes can have lower resistance, but via cost, spacing, crosstalk and routing constraints matter. Use extracted parasitics for signoff.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 670 192\" role=\"img\" aria-label=\"Distributed wire RC ladder driven through effective output resistance\" style=\"display:block;width:100%;height:auto;max-width:670px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Distributed wire RC ladder driven through effective output resistance\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"669\" height=\"191\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"60\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"190\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"325\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"460\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M34 61 H60 M137 61 H190 M267 61 H325 M402 61 H460 M537 61 H626\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M167 61 V109 M304 61 V109 M438 61 V109 M580 61 V109 M155 109 H179 M155 118 H179 M292 109 H316 M292 118 H316 M426 109 H450 M426 118 H450 M568 109 H592 M568 118 H592 M167 118 V143 M304 118 V143 M438 118 V143 M580 118 V143 M144 143 H602\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"167\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"304\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"438\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"580\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"99\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rdriver\u003c/text>\u003ctext x=\"229\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"364\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"497\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"169\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/6\u003c/text>\u003ctext x=\"304\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/3\u003c/text>\u003ctext x=\"438\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/3\u003c/text>\u003ctext x=\"580\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/6 + CL\u003c/text>\u003ctext x=\"606\" y=\"48\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Receiver\u003c/text>\u003ctext x=\"376\" y=\"166\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">Each wire resistance sees the capacitances downstream from it.\u003c/text>\u003c/svg>"}},{"id":"cmos-u5-q9","subject":"cmos","unit":5,"number":9,"q":"Explain interconnect engineering methods (wire sizing, repeaters, layer selection). Explain logical effort with wires.","ans":{"s":"Widen or use upper layers to lower R, add repeaters, space neighbors. Include wire C in effort and separately account for distributed R.","m":"Wire sizing and layer choice trade metal resistance against area and capacitance. Repeaters make a long RC run into shorter segments. Logical effort includes wire capacitance in the load, but distributed resistance requires its own delay model.","d":"Widen timing-critical metal or use a lower-resistance layer, checking how increased width affects C and area. Increase spacing or use shields where coupling dominates. Split a long route into buffered sections, so the quadratic wire delay is reduced at the cost of buffer delay, power and area. In simple logical-effort sizing, use h=(Cnext+Cwire+Cside)/Cin, or count off-path C separately with b. Distributed wire resistance adds delay beyond d=gh+p, so estimate each wire segment with RC or use extracted parasitics and iterate gate and repeater sizing. Short routes can often be treated as capacitive, while long routes require the distributed model.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 670 192\" role=\"img\" aria-label=\"Distributed wire RC ladder driven through effective output resistance\" style=\"display:block;width:100%;height:auto;max-width:670px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Distributed wire RC ladder driven through effective output resistance\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"669\" height=\"191\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"60\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"190\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"325\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"460\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M34 61 H60 M137 61 H190 M267 61 H325 M402 61 H460 M537 61 H626\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M167 61 V109 M304 61 V109 M438 61 V109 M580 61 V109 M155 109 H179 M155 118 H179 M292 109 H316 M292 118 H316 M426 109 H450 M426 118 H450 M568 109 H592 M568 118 H592 M167 118 V143 M304 118 V143 M438 118 V143 M580 118 V143 M144 143 H602\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"167\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"304\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"438\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"580\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"99\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rdriver\u003c/text>\u003ctext x=\"229\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"364\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"497\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"169\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/6\u003c/text>\u003ctext x=\"304\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/3\u003c/text>\u003ctext x=\"438\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/3\u003c/text>\u003ctext x=\"580\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/6 + CL\u003c/text>\u003ctext x=\"606\" y=\"48\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Receiver\u003c/text>\u003ctext x=\"376\" y=\"166\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">Each wire resistance sees the capacitances downstream from it.\u003c/text>\u003c/svg>"}},{"id":"cmos-u5-q10","subject":"cmos","unit":5,"number":10,"q":"Write short notes on scaling challenges, CAD and manufacturing concerns, and pitfalls in CMOS design.","ans":{"s":"Scaling stresses leakage, variation, wire RC and reliability. Use PDK-aware CAD and signoff across corners.","m":"Smaller geometry increases the importance of leakage, variation and parasitics. CAD constraints and verification must match the foundry's manufacturing process. Common pitfalls include wrong units, missing taps and ignored coupling or corners.","d":"Scaling raises concerns about short-channel effects, leakage, device variation, interconnect RC, IR drop, EM, self-heating and yield. Manufacturing adds lithography, minimum spacing, pattern density, antenna and via reliability requirements. Use PDK models and rule decks, robust constraint files, parasitic extraction, STA, DRC/LVS, reliability and power-integrity checks. Typical design pitfalls include assuming schematic results survive routing, floating wells or internal nodes, assuming ideal clocks and supplies, and optimizing a typical corner while missing slow setup or fast hold. Verify actual PVT, switching activity and load."}},{"id":"cmos-u5-q11","subject":"cmos","unit":5,"number":11,"q":"Define logical effort, electrical effort and parasitic delay. Write the delay equation of a logic gate in terms of these quantities.","ans":{"s":"d=gh+p. g=relative input cost for equal drive. h=Cload/Cin. p=intrinsic normalized delay.","m":"Normalize delay to a technology time constant. Multiply logical effort g by electrical effort h, then add parasitic delay p. For an inverter g=1 by definition.","d":"Logical effort g compares the input capacitance of a gate to the per-input capacitance of a reference inverter with equal output drive. Electrical effort h=Cload/Cin is the capacitance driven divided by gate input capacitance. Parasitic p is normalized unloaded delay from internal and diffusion capacitances. The linear model is d=gh+p, physical delay t≈τd with process normalization τ. If h includes only on-path load, include a branch multiplier b so d=g·b·h+p."}},{"id":"cmos-u5-q12","subject":"cmos","unit":5,"number":12,"q":"Differentiate between dynamic and static power dissipation in CMOS circuits. Write the expression for dynamic power.","ans":{"s":"Dynamic: switching plus short circuit. Static: leakage at steady logic. Psw=αCVDD²f, Pstatic≈VDDIleak.","m":"Capacitive switching power depends on activity and frequency. Short-circuit power accompanies transitions. Leakage power persists without switching and depends strongly on process, input state and temperature.","d":"For activity α counting mean 0→1 events per cycle, switching power is αCVDD²f. During finite input edges both MOS networks can briefly conduct, adding dynamic short-circuit power. Static dissipation is Pstatic≈VDDIleak under stable input conditions. Leakage arises from subthreshold conduction, oxide tunneling, reverse junction currents and field-induced mechanisms. Reducing rail voltage and activity targets switching energy, while high threshold, power gating and body bias primarily target leakage."}},{"id":"cmos-u5-q13","subject":"cmos","unit":5,"number":13,"q":"Explain the effect of interconnect resistance and capacitance on circuit delay. List any two interconnect engineering techniques.","ans":{"s":"Wire R and C slow switching, with self-delay ∝L². Use repeaters and lower-resistance layers.","m":"Copper or other metal has distributed R; coupling and substrate/fringe fields create C. Resistance charges the distributed load, delaying the far end. Repeaters and a lower-resistance layer reduce delay.","d":"For a uniform wire Rw=RsheetL/W and Cw≈cL. A first estimate for far-end Elmore time constant is Rdriver(Cw+CL)+Rw(Cw/2+CL). The distributed wire self term grows roughly as L². Adjacent transitions alter the effective coupling capacitance and therefore delay. Two common remedies are repeater insertion, which shortens each RC segment, and wider or upper-layer routing to lower R. Check increased capacitance, vias, area and power before selecting the remedy.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 670 192\" role=\"img\" aria-label=\"Distributed wire RC ladder driven through effective output resistance\" style=\"display:block;width:100%;height:auto;max-width:670px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Distributed wire RC ladder driven through effective output resistance\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"669\" height=\"191\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"60\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"190\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"325\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"460\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M34 61 H60 M137 61 H190 M267 61 H325 M402 61 H460 M537 61 H626\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M167 61 V109 M304 61 V109 M438 61 V109 M580 61 V109 M155 109 H179 M155 118 H179 M292 109 H316 M292 118 H316 M426 109 H450 M426 118 H450 M568 109 H592 M568 118 H592 M167 118 V143 M304 118 V143 M438 118 V143 M580 118 V143 M144 143 H602\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"167\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"304\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"438\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"580\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"99\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rdriver\u003c/text>\u003ctext x=\"229\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"364\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"497\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"169\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/6\u003c/text>\u003ctext x=\"304\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/3\u003c/text>\u003ctext x=\"438\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/3\u003c/text>\u003ctext x=\"580\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/6 + CL\u003c/text>\u003ctext x=\"606\" y=\"48\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Receiver\u003c/text>\u003ctext x=\"376\" y=\"166\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">Each wire resistance sees the capacitances downstream from it.\u003c/text>\u003c/svg>"}},{"id":"cmos-u5-q14","subject":"cmos","unit":5,"number":14,"q":"Explain the power–delay trade-off in CMOS circuits. Define power–delay product (PDP) and energy–delay product (EDP).","ans":{"s":"PDP=Pavg·tp [J]. EDP=Eop·tp [J·s]. Higher drive or VDD often speeds logic at higher energy.","m":"At lower VDD the switching energy drops but delay generally rises. PDP multiplies average power by delay. EDP multiplies the energy per defined operation by its delay, explicitly penalizing slow execution.","d":"Increasing transistor width can lower on-resistance while increasing switched capacitance. Raising VDD generally reduces propagation delay through increased overdrive and raises dynamic energy ∝CVDD². Define PDP=Pavg·tp, in joules, with the averaging conditions stated. Define EDP=Eop·tp, in joule-seconds, where Eop=∫P(t)dt for a defined operation. If energy is evaluated as Pavg·tp over the same interval, EDP=Pavg·tp². The metrics distinguish small, low-power but slow implementations from high-performance alternatives when measured consistently."}}]}]},{"id":"asic","name":"ASIC Design","code":"PCC-303-ECV","color":"#9cbfff","source":"https://chatgpt.com/library?account_id=personal&file_id=libfile_cff9ab80dc608191a3fd5bce53afd84e","count":58,"units":[{"title":"Introduction to ASIC","questions":[{"id":"asic-u1-q1","subject":"asic","unit":1,"number":1,"q":"Illustrate / draw and explain the ASIC design flow with a neat block diagram, stating the function of each step.","ans":{"s":"Specification → RTL → verification → synthesis and DFT → physical implementation → signoff → tape-out → silicon test.","m":"Define performance, power, area and interfaces. Design and verify RTL, synthesize it into library cells, insert test structures, then floorplan, place, build the clock tree and route. Run extracted STA, DRC and LVS, stream out layout, fabricate, package and test.","d":"1. Specify functions, interfaces, clocks and power/performance/area targets. Partition the architecture into datapath, control, memories and IP.\n2. Implement synthesizable RTL and constraints. Verify behaviour with simulation and formal methods as appropriate. Check clock and reset crossings.\n3. Synthesize to a technology-mapped gate netlist using timing libraries and constraints. Insert scan or other DFT logic, check logic equivalence and generate test patterns.\n4. Floorplan the die, place macros and create the power grid. Place and legalize cells, synthesize the clock tree and route signals.\n5. Extract parasitics and close timing and power over relevant corners. Run DRC, LVS, electrical and reliability checks and iterate ECOs until clean.\n6. Deliver GDSII/OASIS for masks and fabrication. Package dies, test them with ATE and validate initial silicon in the target system.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"ASIC design flow\" viewBox=\"0 0 740 154\">\u003crect width=\"740\" height=\"154\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003crect x=\"20\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"90\" y=\"47\" text-anchor=\"middle\">Specification\u003c/text>\u003cpath d=\"M161 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"195\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"265\" y=\"47\" text-anchor=\"middle\">Architecture and RTL\u003c/text>\u003cpath d=\"M336 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"370\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"440\" y=\"47\" text-anchor=\"middle\">Functional verification\u003c/text>\u003cpath d=\"M511 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"545\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"615\" y=\"47\" text-anchor=\"middle\">Synthesis and DFT\u003c/text>\u003cpath d=\"M615 67v19m-4-5 4 5 4-5\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"545\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"615\" y=\"117\" text-anchor=\"middle\">Floorplan and placement\u003c/text>\u003cpath d=\"M543 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"370\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"440\" y=\"117\" text-anchor=\"middle\">CTS and routing\u003c/text>\u003cpath d=\"M368 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"195\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"265\" y=\"117\" text-anchor=\"middle\">Extraction and signoff\u003c/text>\u003cpath d=\"M193 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"20\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"90\" y=\"117\" text-anchor=\"middle\">Tape-out and test\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u1-q2","subject":"asic","unit":1,"number":2,"q":"Explain different types of ASICs in detail.","ans":{"s":"Full-custom uses custom layout. Semi-custom uses standard cells or gate arrays. Programmable devices are configured after fabrication.","m":"Full-custom designs optimize devices and layout. Standard-cell semi-custom designs assemble foundry-qualified cells. Gate arrays wire a prefabricated base using customized metal. FPGAs and CPLDs implement customer logic through field-programmable resources.","d":"Full-custom ASIC: design transistor sizes, topology and mask layout for the application. This enables dense, fast or low-power critical circuits, including SRAM bitcells and analog blocks, with substantial design and mask effort.\nStandard-cell ASIC: map RTL to precharacterized gates and flip-flops, then perform placement, CTS and routing. Hard macros can coexist with standard cells. A custom chip layout and mask set are still manufactured.\nGate-array ASIC: start from prefabricated transistors or base cells and customize upper interconnect masks. Some arrays reserve dedicated wiring channels, while channel-less arrays route above a sea of gates.\nProgrammable logic: a manufactured FPGA or CPLD provides configurable function blocks and routing. Configuration selects a circuit after fabrication. Course taxonomies group these as programmable ASICs, while industry commonly distinguishes FPGAs from mask-programmed ASICs."}},{"id":"asic-u1-q3","subject":"asic","unit":1,"number":3,"q":"Compare Full-Custom, Semi-Custom and Programmable ASICs with respect to design time / complexity, flexibility, cost, performance and density.","ans":{"s":"Full-custom maximizes optimization. Semi-custom trades some optimization for reusable cells. Programmable logic minimizes up-front cost and lead time.","m":"Full-custom has the largest design effort and NRE with high achievable performance/density. Semi-custom reuses cells or base arrays and balances effort with performance. Programmable logic has low NRE, short design cycles and field flexibility, with programmable-routing area and power overhead.","d":"Design time and complexity: full-custom requires transistor and layout work. Semi-custom automates synthesis and physical implementation using characterized cells or a fixed base array. Programmable logic maps into an existing device and usually reaches hardware fastest.\nFlexibility: full-custom offers the greatest transistor/layout freedom before fabrication, while a reprogrammable FPGA is easiest to revise after manufacture. Semi-custom is constrained by the cell library or base array.\nCost: mask and development NRE is generally highest in full-custom and lower in semi-custom. An FPGA avoids custom mask NRE, but programmable fabric typically increases per-unit cost at volume for comparable logic.\nPerformance and density: optimized full-custom has the highest potential. Standard-cell implementations usually pack and switch logic more efficiently than equivalent LUT-and-routing implementations, while FPGA hard DSP/RAM blocks can narrow the gap for supported functions."}},{"id":"asic-u1-q4","subject":"asic","unit":1,"number":4,"q":"Explain Programmable Logic Devices (PLDs) and FPGA architecture with a neat block diagram.","ans":{"s":"A PLD realizes programmed logic. CPLDs use macrocells. FPGAs use LUT/flip-flop blocks, I/O blocks and programmable routing.","m":"Simple PLDs use programmable AND/OR structures. CPLDs connect several macrocell groups. An FPGA uses an array of LUT-based CLBs, I/O blocks and programmable routing, often with memory, DSP, clock and serial interface blocks.","d":"PLD is the family name for devices whose logic is programmed by the user. A PLA commonly has programmable AND and OR planes. A PAL commonly has a programmable AND plane and a fixed OR plane. A CPLD joins multiple macrocells through programmable interconnect.\nAn FPGA maps combinational logic into LUT truth tables and sequential logic into flip-flops inside configurable logic blocks. I/O blocks connect the internal netlist to package pins and support selected standards and directions. Switch and connection boxes connect blocks via programmable wire segments. Clock networks distribute clocks to the logic and hard blocks with controlled skew. BRAM, DSP, PLLs and other hard functions accelerate common operations.\nImplementation compiles HDL, maps it to fabric resources, places and routes instances, then programs the generated configuration.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"FPGA architecture with input output blocks, connection boxes, switch matrices and logic blocks\" viewBox=\"0 0 760 226\">\u003crect width=\"760\" height=\"226\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cpath d=\"M95 67H664M95 117H664M95 167H664M152 33V193M332 33V193M512 33V193M644 33V193\" fill=\"none\" stroke=\"#8066b5\" stroke-width=\"2\"/>\u003crect x=\"175\" y=\"55\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"210\" y=\"71\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"148\" y=\"63\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"355\" y=\"55\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"390\" y=\"71\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"328\" y=\"63\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"535\" y=\"55\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"570\" y=\"71\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"508\" y=\"63\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"175\" y=\"105\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"210\" y=\"121\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"148\" y=\"113\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"355\" y=\"105\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"390\" y=\"121\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"328\" y=\"113\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"535\" y=\"105\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"570\" y=\"121\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"508\" y=\"113\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"175\" y=\"155\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"210\" y=\"171\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"148\" y=\"163\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"355\" y=\"155\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"390\" y=\"171\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"328\" y=\"163\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"535\" y=\"155\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"570\" y=\"171\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"508\" y=\"163\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\n\u003cg fill=\"#334258\" stroke=\"#a8b9dd\">\u003crect x=\"42\" y=\"54\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"42\" y=\"104\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"42\" y=\"154\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"664\" y=\"54\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"664\" y=\"104\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"664\" y=\"154\" width=\"53\" height=\"26\" rx=\"4\"/>\u003c/g>\u003ctext x=\"55\" y=\"71\">IOB\u003c/text>\u003ctext x=\"55\" y=\"121\">IOB\u003c/text>\u003ctext x=\"55\" y=\"171\">IOB\u003c/text>\u003ctext x=\"677\" y=\"71\">IOB\u003c/text>\u003ctext x=\"677\" y=\"121\">IOB\u003c/text>\u003ctext x=\"677\" y=\"171\">IOB\u003c/text>\u003ctext x=\"93\" y=\"211\">Teal: programmable switch\u003c/text>\u003ctext x=\"473\" y=\"211\">Purple: routing track\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u1-q5","subject":"asic","unit":1,"number":5,"q":"Explain the architecture of an FPGA (CLB, IOB and programmable interconnect) with a neat diagram.","ans":{"s":"CLB = LUTs and registers. IOB = pin interface. Switch matrices and tracks join internal blocks and IOBs.","m":"CLBs compute LUT functions and register them. IOBs provide configurable input/output buffers and may include registers. Programmable switch matrices connect routing tracks to each other and to logic-block pins. Dedicated networks distribute clocks.","d":"A k-input LUT stores up to 2ᵏ truth-table bits addressed by its inputs. Several LUTs, multiplexers, flip-flops and often carry chain resources form a slice or configurable logic block. Fast carry chains favor counters and adders.\nAn IOB implements input sampling, output driving or bidirectional pin access under a selected electrical standard. It can provide tri-state control and may contain input/output registers.\nConnection boxes attach logic pins to nearby segments. Switch matrices selectively join horizontal and vertical tracks and long-distance wires. Configuration bits control LUT contents, connections and I/O modes. Clock networks are specialized resources for low-skew signals.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"FPGA architecture with input output blocks, connection boxes, switch matrices and logic blocks\" viewBox=\"0 0 760 226\">\u003crect width=\"760\" height=\"226\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cpath d=\"M95 67H664M95 117H664M95 167H664M152 33V193M332 33V193M512 33V193M644 33V193\" fill=\"none\" stroke=\"#8066b5\" stroke-width=\"2\"/>\u003crect x=\"175\" y=\"55\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"210\" y=\"71\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"148\" y=\"63\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"355\" y=\"55\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"390\" y=\"71\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"328\" y=\"63\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"535\" y=\"55\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"570\" y=\"71\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"508\" y=\"63\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"175\" y=\"105\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"210\" y=\"121\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"148\" y=\"113\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"355\" y=\"105\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"390\" y=\"121\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"328\" y=\"113\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"535\" y=\"105\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"570\" y=\"121\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"508\" y=\"113\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"175\" y=\"155\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"210\" y=\"171\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"148\" y=\"163\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"355\" y=\"155\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"390\" y=\"171\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"328\" y=\"163\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"535\" y=\"155\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"570\" y=\"171\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"508\" y=\"163\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\n\u003cg fill=\"#334258\" stroke=\"#a8b9dd\">\u003crect x=\"42\" y=\"54\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"42\" y=\"104\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"42\" y=\"154\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"664\" y=\"54\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"664\" y=\"104\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"664\" y=\"154\" width=\"53\" height=\"26\" rx=\"4\"/>\u003c/g>\u003ctext x=\"55\" y=\"71\">IOB\u003c/text>\u003ctext x=\"55\" y=\"121\">IOB\u003c/text>\u003ctext x=\"55\" y=\"171\">IOB\u003c/text>\u003ctext x=\"677\" y=\"71\">IOB\u003c/text>\u003ctext x=\"677\" y=\"121\">IOB\u003c/text>\u003ctext x=\"677\" y=\"171\">IOB\u003c/text>\u003ctext x=\"93\" y=\"211\">Teal: programmable switch\u003c/text>\u003ctext x=\"473\" y=\"211\">Purple: routing track\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u1-q6","subject":"asic","unit":1,"number":6,"q":"Explain the programming technologies used in programmable ASICs.","ans":{"s":"SRAM is volatile and reprogrammable. Flash/EEPROM is nonvolatile and rewritable. Antifuse permanently forms a conductive link.","m":"SRAM configuration controls pass gates or multiplexers and reloads at power-up. Floating-gate flash/EEPROM stores settings without power and can be erased. An antifuse becomes conducting after one-time programming. Historical fuse links become open when programmed.","d":"SRAM: each volatile cell stores a route or logic configuration bit and controls a transistor switch or multiplexer. It offers fast reconfiguration and flexible processes, at the expense of boot storage or a controller, configuration area and susceptibility to bit upsets.\nFlash/EEPROM: stored charge changes threshold and retains the state when unpowered. Configuration can start directly from stored bits where supported. Erase/program operations need suitable voltages and have finite endurance.\nAntifuse: normally insulating structure becomes a permanent low-resistance connection after a controlled programming pulse. It is nonvolatile and compact, but cannot be erased. A conventional fuse starts conductive and is opened irreversibly. Technology choice depends on boot, reconfiguration, retention, radiation and area requirements."}},{"id":"asic-u1-q7","subject":"asic","unit":1,"number":7,"q":"Write short notes on: (i) Gate Array based ASIC (ii) Channelled gate array (iii) Channel-less gate array","ans":{"s":"Gate arrays customize wires on a prefabricated base. Channelled reserves gaps. Channel-less routes over the gate fabric.","m":"A gate array reuses prefabricated base transistor patterns and customizes selected upper interconnect layers. Channelled arrays have dedicated routes between rows. In channel-less arrays metal can cross above unused or used base cells subject to the routing rules.","d":"Gate-array ASIC: base wafers already contain a regular set of uncommitted transistors or basic cells. The customer's design defines the connections through selected metal and via masks, reducing turnaround and mask customization compared with a fully custom base.\nChannelled: cells are grouped in rows with fixed routing channels between them. This yields a regular routing model, but fixed channel area can limit density or routing capacity.\nChannel-less: a sea-of-gates fills the base array. Over-the-cell routing uses available metal layers across the fabric. It can achieve better logic utilization, though congested areas may force some sites to remain unavailable for logic."}},{"id":"asic-u1-q8","subject":"asic","unit":1,"number":8,"q":"Numerical: A 100 K-gate IC contains the equivalent of 100,000 two-input NAND gates, each made of 4 transistors. Calculate: (i) Total number of two-input NAND gate equivalents. (ii) Total number of transistors required to implement the IC. (iii) Number of transistors if the capacity is increased to 250 K gates. (iv) Number of transistors for a 500 K gate IC.","ans":{"s":"100,000 NAND2 equivalents → 400,000 transistors. 250 K → 1,000,000. 500 K → 2,000,000.","m":"Use Nₜ = 4 × NAND2 gate equivalents. 100 K = 100,000 NAND2 equivalents and 400,000 transistors. The 250 K and 500 K values are 1,000,000 and 2,000,000 transistors respectively.","d":"(i) 100 K = 100 × 1,000 = 100,000 two-input NAND equivalents.\n(ii) 100,000 × 4 = 400,000 transistors.\n(iii) 250,000 × 4 = 1,000,000 transistors.\n(iv) 500,000 × 4 = 2,000,000 transistors.\nEach static CMOS NAND2 has two series NMOS pull-down devices and two parallel PMOS pull-up devices. The result uses the NAND-equivalent assumption in the question. A real IC with macros, buffers and different cells has a different physical transistor count."}},{"id":"asic-u1-q9","subject":"asic","unit":1,"number":9,"q":"Compare Programmable, Semi-Custom and Full Custom ASIC.","ans":{"s":"Full-custom maximizes optimization. Semi-custom trades some optimization for reusable cells. Programmable logic minimizes up-front cost and lead time.","m":"Full-custom has the largest design effort and NRE with high achievable performance/density. Semi-custom reuses cells or base arrays and balances effort with performance. Programmable logic has low NRE, short design cycles and field flexibility, with programmable-routing area and power overhead.","d":"Design time and complexity: full-custom requires transistor and layout work. Semi-custom automates synthesis and physical implementation using characterized cells or a fixed base array. Programmable logic maps into an existing device and usually reaches hardware fastest.\nFlexibility: full-custom offers the greatest transistor/layout freedom before fabrication, while a reprogrammable FPGA is easiest to revise after manufacture. Semi-custom is constrained by the cell library or base array.\nCost: mask and development NRE is generally highest in full-custom and lower in semi-custom. An FPGA avoids custom mask NRE, but programmable fabric typically increases per-unit cost at volume for comparable logic.\nPerformance and density: optimized full-custom has the highest potential. Standard-cell implementations usually pack and switch logic more efficiently than equivalent LUT-and-routing implementations, while FPGA hard DSP/RAM blocks can narrow the gap for supported functions."}},{"id":"asic-u1-q10","subject":"asic","unit":1,"number":10,"q":"Explain different types of ASICs. Compare Full-Custom, Semi-Custom and Programmable ASICs with respect to design complexity, flexibility, cost and performance.","ans":{"s":"Full-custom optimizes devices, semi-custom builds from library or base cells, and programmable logic configures prefabricated LUT or macrocell fabrics.","m":"Full-custom gives transistor/layout freedom and typically the highest NRE and achievable density. Semi-custom uses standard cells or programmable-metal gate arrays with moderate effort. Programmable devices avoid mask NRE and are field configurable, with larger area/power per synthesized function in many designs.","d":"Full-custom designs implement the transistor circuit and layout specifically for the application, offering high performance and density but high non-recurring engineering cost and long turnaround. Semi-custom designs reuse precharacterized standard cells or a prefabricated gate-array base. They preserve a custom mask-programmed result with less engineering and greater automation. Programmable devices such as FPGAs use existing LUTs, registers and configurable routing. They offer rapid hardware bring-up and often field updates with little mask NRE, but routing switches, LUTs and configuration storage add area and delay.\nDesign freedom before manufacture is greatest in full-custom. Ability to revise deployed devices is greatest with rewritable programmable logic. At high volume, mask-programmed production can amortize development cost and reduce unit cost."}},{"id":"asic-u1-q11","subject":"asic","unit":1,"number":11,"q":"Draw and explain the ASIC design flow stating function of each step.","ans":{"s":"Specification → RTL → verification → synthesis and DFT → physical implementation → signoff → tape-out → silicon test.","m":"Define performance, power, area and interfaces. Design and verify RTL, synthesize it into library cells, insert test structures, then floorplan, place, build the clock tree and route. Run extracted STA, DRC and LVS, stream out layout, fabricate, package and test.","d":"1. Specify functions, interfaces, clocks and power/performance/area targets. Partition the architecture into datapath, control, memories and IP.\n2. Implement synthesizable RTL and constraints. Verify behaviour with simulation and formal methods as appropriate. Check clock and reset crossings.\n3. Synthesize to a technology-mapped gate netlist using timing libraries and constraints. Insert scan or other DFT logic, check logic equivalence and generate test patterns.\n4. Floorplan the die, place macros and create the power grid. Place and legalize cells, synthesize the clock tree and route signals.\n5. Extract parasitics and close timing and power over relevant corners. Run DRC, LVS, electrical and reliability checks and iterate ECOs until clean.\n6. Deliver GDSII/OASIS for masks and fabrication. Package dies, test them with ATE and validate initial silicon in the target system.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"ASIC design flow\" viewBox=\"0 0 740 154\">\u003crect width=\"740\" height=\"154\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003crect x=\"20\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"90\" y=\"47\" text-anchor=\"middle\">Specification\u003c/text>\u003cpath d=\"M161 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"195\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"265\" y=\"47\" text-anchor=\"middle\">Architecture and RTL\u003c/text>\u003cpath d=\"M336 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"370\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"440\" y=\"47\" text-anchor=\"middle\">Functional verification\u003c/text>\u003cpath d=\"M511 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"545\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"615\" y=\"47\" text-anchor=\"middle\">Synthesis and DFT\u003c/text>\u003cpath d=\"M615 67v19m-4-5 4 5 4-5\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"545\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"615\" y=\"117\" text-anchor=\"middle\">Floorplan and placement\u003c/text>\u003cpath d=\"M543 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"370\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"440\" y=\"117\" text-anchor=\"middle\">CTS and routing\u003c/text>\u003cpath d=\"M368 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"195\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"265\" y=\"117\" text-anchor=\"middle\">Extraction and signoff\u003c/text>\u003cpath d=\"M193 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"20\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"90\" y=\"117\" text-anchor=\"middle\">Tape-out and test\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u1-q12","subject":"asic","unit":1,"number":12,"q":"Explain the programming technologies used in programmable ASICs.","ans":{"s":"SRAM is volatile and reprogrammable. Flash/EEPROM is nonvolatile and rewritable. Antifuse permanently forms a conductive link.","m":"SRAM configuration controls pass gates or multiplexers and reloads at power-up. Floating-gate flash/EEPROM stores settings without power and can be erased. An antifuse becomes conducting after one-time programming. Historical fuse links become open when programmed.","d":"SRAM: each volatile cell stores a route or logic configuration bit and controls a transistor switch or multiplexer. It offers fast reconfiguration and flexible processes, at the expense of boot storage or a controller, configuration area and susceptibility to bit upsets.\nFlash/EEPROM: stored charge changes threshold and retains the state when unpowered. Configuration can start directly from stored bits where supported. Erase/program operations need suitable voltages and have finite endurance.\nAntifuse: normally insulating structure becomes a permanent low-resistance connection after a controlled programming pulse. It is nonvolatile and compact, but cannot be erased. A conventional fuse starts conductive and is opened irreversibly. Technology choice depends on boot, reconfiguration, retention, radiation and area requirements."}}]},{"title":"Partitioning, Floor Planning and Placement","questions":[{"id":"asic-u2-q1","subject":"asic","unit":2,"number":1,"q":"Explain partitioning at system, board and chip levels with suitable examples. State the need, goals and objectives of partitioning.","ans":{"s":"Hierarchy: system → boards → chip blocks. Balance resources and keep interpartition traffic low.","m":"At system level split work across major subsystems or devices. At board level assign components or circuits to PCBs. At chip level group cells/IP into regions or design blocks. Aim for balanced area and power, low cut cost, locality and predictable timing.","d":"Partitioning divides a complex design into manageable units with explicit boundaries. At system level, assign major functions to hardware/software, processors, chiplets or boards, for example an image pipeline in an accelerator with supervisory work on a CPU. At board level, distribute chips and modules across PCBs, for example putting the ADC and front-end on an analog acquisition board and compute on a digital board. At chip level, divide a netlist across logical or physical blocks, for example CPU, SRAM, DMA and I/O regions.\nUse a weighted graph or hypergraph whose vertices represent components and whose edges represent connections. Minimize weighted connections crossing boundaries, particularly critical/high-bandwidth nets, while meeting balance, pin, size, area, power, clock and physical constraints. Good boundaries improve independent verification and implementation, limit congestion and simplify timing budgeting."}},{"id":"asic-u2-q2","subject":"asic","unit":2,"number":2,"q":"Explain the K-L (Kernighan–Lin) algorithm with a neat diagram.","ans":{"s":"Compute D = external − internal. Swap unlocked a,b with maximum g = D(a)+D(b)−2w(a,b). Commit the best positive prefix.","m":"Kernighan–Lin improves an initial balanced bipartition. Compute D for each vertex and select the unlocked cross-pair with greatest gain. Tentatively exchange and lock each pair, updating remaining gains. Commit the prefix having maximum positive cumulative gain, then repeat.","d":"Model the circuit as a weighted graph and initialize equally sized sets A and B. For v, compute D(v)=E(v)−I(v), where E is its total edge weight across the cut and I is its internal weight. Swapping a∈A and b∈B saves g=D(a)+D(b)−2w(a,b). The edge a–b remains across the cut, so subtract its double count.\nIn one pass, choose the highest-gain unlocked pair, tentatively exchange and lock it, then recompute or incrementally update D values. Collect the gains g₁, g₂, … even if some are negative. Find k that maximizes Gₖ=Σᵢ₌₁ᵏgᵢ. Apply only that prefix if Gₖ>0. Unlock and iterate. If no positive prefix exists, stop. Pair exchange preserves cardinality. The algorithm gives a locally improved cut and may depend on initialization.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Kernighan–Lin swap across two equal-sized blocks\" viewBox=\"0 0 760 180\">\u003crect width=\"760\" height=\"180\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003crect x=\"43\" y=\"31\" width=\"193\" height=\"106\" rx=\"12\" fill=\"#26344b\" stroke=\"#8db1fa\"/>\u003crect x=\"521\" y=\"31\" width=\"193\" height=\"106\" rx=\"12\" fill=\"#314138\" stroke=\"#7ee0b1\"/>\n\u003ctext x=\"74\" y=\"58\">Partition A\u003c/text>\u003ctext x=\"545\" y=\"58\">Partition B\u003c/text>\u003ctext x=\"73\" y=\"113\">a₂, a₃, …\u003c/text>\u003ctext x=\"627\" y=\"113\">b₂, b₃, …\u003c/text>\n\u003cg fill=\"#10131b\" stroke=\"#9baad1\">\u003ccircle cx=\"199\" cy=\"94\" r=\"19\"/>\u003ccircle cx=\"557\" cy=\"94\" r=\"19\"/>\u003c/g>\u003ctext x=\"199\" y=\"99\" text-anchor=\"middle\">a\u003c/text>\u003ctext x=\"557\" y=\"99\" text-anchor=\"middle\">b\u003c/text>\n\u003cpath d=\"M220 86h313m-7-5 7 5-7 5M536 102H222m7-5-7 5 7 5\" fill=\"none\" stroke=\"#8be3d2\" stroke-width=\"2\"/>\n\u003ctext x=\"378\" y=\"69\" text-anchor=\"middle\">g(a,b) = D(a) + D(b) − 2w(a,b)\u003c/text>\u003ctext x=\"378\" y=\"155\" text-anchor=\"middle\">Lock each trial pair. Commit the best positive cumulative swap prefix.\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u2-q3","subject":"asic","unit":2,"number":3,"q":"Compare constructive and iterative improvement partitioning techniques.","ans":{"s":"Constructive methods build a partition from scratch. Iterative methods improve one through moves or swaps.","m":"Constructive methods assign unplaced vertices by connectivity, seeds or clustering and produce an initial partition quickly. Iterative methods start with a full partition and reduce cut cost through feasible moves or exchanges. A common workflow uses both.","d":"Constructive partitioning starts with empty sets, selected seeds or coarse clusters and assigns unplaced vertices using connectivity and capacity heuristics. Greedy region growing and clustering are examples. It tends to be quick and yields a feasible start, though early decisions can limit cut quality.\nIterative improvement begins with a complete solution and repeatedly evaluates gains for moving vertices or exchanging them. Kernighan–Lin swaps pairs, and Fiduccia–Mattheyses uses individual moves with balance checks. Pass-based methods can examine temporary negative moves and retain a best improving prefix. Quality can depend on the starting partition and stopping rule. Modern multilevel methods coarsen first, compute an initial solution, then refine it at increasing resolution."}},{"id":"asic-u2-q4","subject":"asic","unit":2,"number":4,"q":"What do you mean by Placement? List the algorithms used for placement and explain any one in detail.","ans":{"s":"Placement assigns legal cell sites. Algorithms include analytical, recursive partitioning, annealing and force-directed methods.","m":"Placement locates cells to reduce wirelength, timing cost and congestion. Global placement estimates coordinates, legalization fits cells into legal sites and detailed placement refines local positions. Analytical methods optimize smooth wirelength and density objectives.","d":"In ASIC placement, choose x–y coordinates and allowed orientations for cells while respecting rows, sites, blockages, cell overlaps, region and technology rules. Representative algorithms are analytical/quadratic, electrostatic, min-cut recursive partitioning, simulated annealing and force-directed placement.\nAnalytical placement minimizes a continuous approximation to wirelength plus a density penalty. A solver moves instances toward connected pins while spreading cells out of overfull bins. Timing weights and congestion estimates can be added. Global placement may permit overlap temporarily. Legalization snaps cells into valid unoccupied sites with limited displacement. Detailed placement applies local shifts or swaps to improve the cost while maintaining legality."}},{"id":"asic-u2-q5","subject":"asic","unit":2,"number":5,"q":"Explain the simulated annealing algorithm for placement of cells.","ans":{"s":"Random move → cost change Δ. Accept Δ≤0. Accept uphill with probability exp(−Δ/T). Cool and repeat.","m":"Simulated annealing evaluates swaps, shifts or rotations against a cost such as wirelength plus congestion and timing penalties. It accepts all improvements and may accept worse placements early. Cooling progressively favors improvements.","d":"Start with a feasible placement and a high temperature T. Define a cost C as weighted wirelength (often HPWL), density, congestion, timing and constraints. Randomly choose a legal or penalized move such as swapping two cells, translating a macro or rotating it. Calculate Δ=Cnew−Cold, preferably using only affected connections. Accept Δ≤0 and accept Δ>0 when a uniform random number is below exp(−Δ/T).\nPerform multiple trials per temperature. Reduce T, for example T←0.9T, and stop at a low temperature or negligible progress. Keep the best feasible solution encountered. Early uphill moves can escape local minima. Slow cooling increases runtime and often improves quality. Final legalization or refinement may be needed if overlaps were penalized during search."}},{"id":"asic-u2-q6","subject":"asic","unit":2,"number":6,"q":"Explain Floor Planning. List the algorithms used for floor planning and explain any one in detail.","ans":{"s":"Floorplanning shapes the die/core and locates macros, pins, reserved regions and power resources.","m":"Floorplanning sets core dimensions and major block relationships before fine cell placement. Algorithms include slicing trees, sequence pairs, B*-trees, constraint-graph methods and annealing. A slicing tree recursively separates blocks with horizontal or vertical cuts.","d":"Floorplanning establishes the die/core outline and high-level arrangement of macros, I/O and logical regions with channels, keep-outs, row sites and power delivery provisions. It seeks acceptable area, aspect ratio, connections, congestion and timing. Common approaches include slicing floorplans, sequence-pair packing, B*-trees and graph-based methods. Simulated annealing can optimize the representation.\nIn a slicing floorplan, leaves denote blocks and internal nodes denote cuts. With a vertical cut placing blocks side by side, combined width is w₁+w₂ and height is max(h₁,h₂). With a horizontal cut, height is h₁+h₂ and width is max(w₁,w₂). Use bottom-up dimensions or shape curves, then assign positions top-down. Explore changes in block order, rotation and cut orientation. Slicing is simple but restricts the arrangements that can be represented.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Slicing tree and its floorplan\" viewBox=\"0 0 740 170\">\u003crect width=\"740\" height=\"170\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003ctext x=\"67\" y=\"21\">Slicing tree\u003c/text>\u003ctext x=\"440\" y=\"21\">One realized arrangement\u003c/text>\u003cpath d=\"M151 47L96 84M151 47l64 37m0 0-30 35m30-35 30 35\" fill=\"none\" stroke=\"#91acdc\" stroke-width=\"2\"/>\u003cg fill=\"#293952\" stroke=\"#91acdc\">\u003ccircle cx=\"151\" cy=\"47\" r=\"14\"/>\u003ccircle cx=\"96\" cy=\"84\" r=\"14\"/>\u003ccircle cx=\"215\" cy=\"84\" r=\"14\"/>\u003ccircle cx=\"185\" cy=\"119\" r=\"14\"/>\u003ccircle cx=\"245\" cy=\"119\" r=\"14\"/>\u003crect x=\"430\" y=\"34\" width=\"86\" height=\"101\"/>\u003crect x=\"516\" y=\"34\" width=\"145\" height=\"51\"/>\u003crect x=\"516\" y=\"85\" width=\"145\" height=\"50\"/>\u003c/g>\u003cg text-anchor=\"middle\">\u003ctext x=\"151\" y=\"52\">V\u003c/text>\u003ctext x=\"96\" y=\"89\">A\u003c/text>\u003ctext x=\"215\" y=\"89\">H\u003c/text>\u003ctext x=\"185\" y=\"124\">B\u003c/text>\u003ctext x=\"245\" y=\"124\">C\u003c/text>\u003ctext x=\"475\" y=\"88\">A\u003c/text>\u003ctext x=\"587\" y=\"63\">B\u003c/text>\u003ctext x=\"587\" y=\"114\">C\u003c/text>\u003c/g>\u003ctext x=\"93\" y=\"154\">V divides left/right. H divides top/bottom.\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u2-q7","subject":"asic","unit":2,"number":7,"q":"State the goals and objectives of floor planning. Explain the measures used to judge the quality of a floorplan.","ans":{"s":"Judge floorplans by area/utilization, aspect ratio, congestion, timing, wirelength, power and physical feasibility.","m":"Provide feasible macro positions and pin access with low dead space and routing pressure. Compare die/core area, utilization, aspect ratio, macro blockages and channels, HPWL, congestion overflow, timing estimates and IR/thermal margins.","d":"An effective floorplan fits the die/package, gives cells and macros legal sites, reserves room for routing, clock/power structures and ECOs, and places timing-critical blocks close together. Report die/core area, aspect ratio W/H, standard-cell utilization against available placement area and dead space. Estimate interconnect with HPWL=(xmax−xmin)+(ymax−ymin) per net, and check early timing such as WNS/TNS. Use routing demand versus capacity to identify overflow and inspect pin access, macro channel width and alignment. Check power/ground access, estimated IR drop, current density and hotspot risk. A smaller floorplan can raise congestion or power density, so score the metrics together."}},{"id":"asic-u2-q8","subject":"asic","unit":2,"number":8,"q":"Differentiate between Floor Planning and Placement.","ans":{"s":"Floorplan fixes the outline and major resources. Placement assigns individual standard-cell locations inside those bounds.","m":"Floorplanning arranges the core, macros, pins, channels, keep-outs and power delivery. Placement uses those constraints to assign cells to rows and sites through global placement, legalization and detailed improvement.","d":"Floorplanning operates mainly at macro or block granularity. Its inputs include netlist, macro abstracts, technology, package/pin constraints and target utilization. Outputs include die/core outline, rows, fixed macros, I/O positions or constraints, placement/routing blockages and power planning assumptions.\nPlacement acts primarily on standard cells. It uses the floorplan, net connectivity and timing libraries to choose coordinates and orientations. It optimizes wirelength, density, congestion and timing, then legalizes overlaps and site violations. Final cell positions and an updated physical database feed CTS and routing. The process can iterate if placement exposes a poor floorplan."}},{"id":"asic-u2-q9","subject":"asic","unit":2,"number":9,"q":"Discuss the design-style-specific issues considered during floor planning and placement.","ans":{"s":"Standard cells need rows and routing access. Gate arrays have fixed sites. Full-custom adds device and matching constraints. FPGAs have fixed resource columns.","m":"Design style controls what may move and which routing choices exist. Standard cells need legal rows, compatible power rails and macro channels. Gate arrays use fixed base sites. Full-custom circuits have custom geometry or matching needs. FPGAs map to fixed CLB, I/O, RAM and DSP locations.","d":"For a standard-cell ASIC, choose die/core size, row structure, legal orientations, macro locations, halos and pin access. Provide rows and power rails for multi-height cells, taps and fillers. Reserve domain boundaries and congestion headroom.\nIn channelled gate arrays, rows are fixed and channels have fixed capacity. In channel-less arrays, metal can cross above the sea of gates subject to access and blockage limits. In full-custom/mixed-signal layouts, symmetry, matching, shielding, guard rings, isolation and current density may dominate transistor or macro positions. For FPGAs, the silicon and specialized sites are fixed, so placement maps functions into feasible CLB, clock-region, I/O, DSP and RAM locations while respecting dedicated paths."}},{"id":"asic-u2-q10","subject":"asic","unit":2,"number":10,"q":"Explain the different floor-planning and placement algorithms used in ASIC design. Discuss their objectives and importance in physical design.","ans":{"s":"Floorplan using slicing or nonslicing representations. Place cells using analytical, min-cut, force-directed or annealing methods.","m":"Floorplanning selects a feasible die geometry and packs large blocks. Slicing trees encode recursive cuts. Sequence pairs and B*-trees represent nonslicing arrangements. Placement uses analytical optimization, recursive cut minimization or annealing, followed by legalization and detailed refinement.","d":"Floorplanning algorithms represent candidate packings. A slicing tree recursively makes horizontal or vertical cuts. A sequence pair uses two permutations to encode horizontal or vertical relations, then a constraint graph reconstructs coordinates. B*-trees encode neighborhood relations and can pack nonslicing layouts. Annealing can expl
