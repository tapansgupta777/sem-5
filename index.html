ish with 1023. The last riser is 63 codes. Wrap to zero after holding 1023, making a periodic staircase with 17 samples and period 850 µs. Observe the buffered or lightly loaded AOUT with an oscilloscope.","code":{"s":"for each timer tick: send next staircase level; after full scale, restart at zero","m":"PINSEL1 = (PINSEL1 & ~(3u \u003c\u003c 18)) | (2u \u003c\u003c 18);\nfor (;;) {\n    for (i = 0; i \u003c= 960; i += 64) sample(i);\n        sample(1023);\n}\n/* sample(code) waits for a tick, then writes DACR = (unsigned)code \u003c\u003c 6. */","d":"#include \u003cLPC214x.h>\n\nstatic void timer0_start(unsigned us)\n{\n    PCONP |= (1u \u003c\u003c 1);          /* Timer 0 peripheral clock */\n    T0TCR = 2;                   /* Reset timer and prescaler */\n    T0CTCR = 0;                  /* Timer mode */\n    T0PR = 11;                   /* PCLK = 12 MHz, TC ticks at 1 MHz */\n    T0MR0 = us;\n    T0MCR = 3;                   /* Set match flag and reset TC on MR0 */\n    T0IR = 1;                    /* Clear stale MR0 flag */\n    T0TCR = 1;\n}\n\nstatic void wait_tick(void)\n{\n    while (!(T0IR & 1u)) { }\n    T0IR = 1;                    /* Write one to clear */\n}\n\nstatic void sample(unsigned code)\n{\n    wait_tick();\n    DACR = (code & 1023u) \u003c\u003c 6;\n}\n\nint main(void)\n{\n    int i;\n    VPBDIV = 1;                   /* 12 MHz CCLK, no PLL */\n    PINSEL1 = (PINSEL1 & ~(3u \u003c\u003c 18)) | (2u \u003c\u003c 18);\n    timer0_start(50);\n    for (;;) {\n        for (i = 0; i \u003c= 960; i += 64) sample(i);\n        sample(1023);\n    }\n}","lang":"c"}}},{"id":"mca-u5-q7","subject":"mca","unit":5,"number":7,"q":"Write an Embedded C program utilizing the LPC2148's internal DAC to generate a triangular waveform.","ans":{"s":"P0.25 = AOUT. Send 10-bit values to DACR[15:6], ramp up then ramp down.","m":"Select AOUT at P0.25 with PINSEL1[19:18] = 10. DACR = code \u003c\u003c 6 for 10-bit codes. Update every 50 µs using the timer; count 0 to 1023 then back without repeating endpoints.","d":"P0.25 is multiplexed as AOUT when PINSEL1[19:18] is set to 10. DACR VALUE occupies bits 15:6 and the BIAS bit is 16. BIAS = 0 is used here. The ideal output is code × VREF/1024, so even 1023 is slightly below VREF. With 12 MHz processor and peripheral clocks, Timer 0 PR = 11 and MR0 = 50 provide 50 µs update spacing. Send 0…1023 and then 1022…1. The repeated sequence omits duplicate endpoints, uses 2046 samples, and has period 102.3 ms. Observe the buffered or lightly loaded AOUT with an oscilloscope.","code":{"s":"for each timer tick: send next code up, then down","m":"PINSEL1 = (PINSEL1 & ~(3u \u003c\u003c 18)) | (2u \u003c\u003c 18);\nfor (;;) {\n    for (i = 0; i \u003c= 1023; ++i) sample(i);\n        for (i = 1022; i >= 1; --i) sample(i);\n}\n/* sample(code) waits for a tick, then writes DACR = (unsigned)code \u003c\u003c 6. */","d":"#include \u003cLPC214x.h>\n\nstatic void timer0_start(unsigned us)\n{\n    PCONP |= (1u \u003c\u003c 1);          /* Timer 0 peripheral clock */\n    T0TCR = 2;                   /* Reset timer and prescaler */\n    T0CTCR = 0;                  /* Timer mode */\n    T0PR = 11;                   /* PCLK = 12 MHz, TC ticks at 1 MHz */\n    T0MR0 = us;\n    T0MCR = 3;                   /* Set match flag and reset TC on MR0 */\n    T0IR = 1;                    /* Clear stale MR0 flag */\n    T0TCR = 1;\n}\n\nstatic void wait_tick(void)\n{\n    while (!(T0IR & 1u)) { }\n    T0IR = 1;                    /* Write one to clear */\n}\n\nstatic void sample(unsigned code)\n{\n    wait_tick();\n    DACR = (code & 1023u) \u003c\u003c 6;\n}\n\nint main(void)\n{\n    int i;\n    VPBDIV = 1;                   /* 12 MHz CCLK, no PLL */\n    PINSEL1 = (PINSEL1 & ~(3u \u003c\u003c 18)) | (2u \u003c\u003c 18);\n    timer0_start(50);\n    for (;;) {\n        for (i = 0; i \u003c= 1023; ++i) sample(i);\n        for (i = 1022; i >= 1; --i) sample(i);\n    }\n}","lang":"c"}}},{"id":"mca-u5-q8","subject":"mca","unit":5,"number":8,"q":"Explain how an external EEPROM is interfaced with the LPC2148 over the I²C bus, detailing the step- by-step sequence for read and write operations.","ans":{"s":"I²C EEPROM uses open-drain SDA/SCL with pull-ups. Write: address and data, STOP, ACK poll. Random read: address write then repeated START and read, final NACK/STOP.","m":"For a 24LC256, connect SDA/SCL plus pull-ups and ground, strap hardware address pins and configure WP. Send START, device+W, two word-address bytes and write data, then STOP and ACK-poll. To read, write the word address and issue repeated START, device+R, receive bytes and NACK the final byte.","d":"Example LPC2148 I²C0 on P0.2/SCL0 and P0.3/SDA0: assign both pins to I²C, connect corresponding EEPROM lines with pull-ups to the compatible rail, share ground, tie A0–A2 to choose the device address (0x50 with all low), and set WP low if writes are needed. Configure bus timing. For 24LC256 write: START → address+W → word address high byte → low byte → data byte(s) with ACK checks → STOP → ACK polling until the internal write cycle ends. Split page writes at its 64-byte boundaries. Random read: START → address+W → word address high/low → repeated START → address+R → receive bytes; master ACKs intermediate bytes and NACKs the last before STOP. Controller APIs may accept a 7-bit address; wire frames append the separate R/W bit."}},{"id":"mca-u5-q9","subject":"mca","unit":5,"number":9,"q":"Describe how a GSM module interfaces with a microcontroller, write an algorithm to send an SMS using the LPC2148, and explain any two AT commands.","ans":{"s":"UART TX/RX cross with common ground. AT tests the link, AT+CMGF=1 selects text mode, AT+CMGS sends SMS after `>` and Ctrl+Z.","m":"Power the modem from its specified supply, connect level-compatible UART with common ground and wait for network registration. Get OK for AT and AT+CMGF=1. Send AT+CMGS with the destination number, wait for `>`, send message plus byte 0x1A, then check +CMGS and OK.","d":"Connect LPC2148 UART TX→modem RX and UART RX←modem TX, share ground, and match logic standards via level translation where needed. Choose the baud/framing specified by the module and a modem supply sized for its transmit-current bursts. Install SIM/antenna and confirm network registration. `AT` checks communication. `AT+CMGF=1` selects SMS text mode. `AT+CMGS=\"+\u003cnumber>\"` enters message submission; wait for `>` then send the text plus Ctrl+Z (0x1A). Treat `+CMGS` followed by `OK` as modem acceptance and handle `ERROR`, `+CMS ERROR` and timeouts. Poll registration where supported or process modem unsolicited registration responses.","code":{"lang":"pseudocode","s":"Check modem → select text mode → CMGS → wait for > → text + Ctrl+Z → check response","m":"Send AT; expect OK\nSend AT+CMGF=1; expect OK\nSend AT+CMGS with the recipient; wait for >\nSend text and Ctrl+Z\nWait for confirmation or error","d":"Set UART to the modem's configured baud and format\nSend \"AT\\r\"; require OK before timeout\nWait for network registration\nSend \"AT+CMGF=1\\r\"; require OK before timeout\nSend \"AT+CMGS=\\\"\" + number + \"\\\"\\r\"\nWait for the > prompt or an error/timeout\nSend message bytes followed by byte 0x1A\nWait for +CMGS and OK, or report +CMS ERROR/timeout"}}},{"id":"mca-u5-q10","subject":"mca","unit":5,"number":10,"q":"Explain the hardware and communication interface between a GPS receiver module and a microcontroller.","ans":{"s":"GPS TX → MCU UART RX with compatible levels and shared ground. Parse NMEA RMC/GGA and validate checksum plus fix status.","m":"Connect power and antenna as specified, then capture GPS serial output at its configured baud and framing. NMEA sentences often carry position, UTC and fix information. Verify checksum, ignore invalid fixes and convert degrees-plus-minutes to decimal degrees.","d":"Connect GPS UART TX to MCU RX, optional GPS RX to MCU TX for configuration, and common ground. Match voltages and select the module-configured serial baud/framing. Buffer complete lines beginning with `$` and ending CR/LF; NMEA checksum is XOR of characters between `$` and `*`. Parse talker variants of RMC for UTC, validity, latitude, longitude and speed, or GGA for fix quality, satellite count and altitude. For latitude ddmm.mmmm or longitude dddmm.mmmm, convert decimal degrees = degrees + minutes/60, negating south and west. Use valid status/fix-quality flags before displaying or logging data, and handle missing fields, timeouts and UART overrun."}}]}]},{"id":"soc","name":"System on Chip","code":"PEC-321A-ECV","color":"#d5b4ff","source":"https://chatgpt.com/library?account_id=personal&file_id=libfile_0125e4ac99b08191b5e630fb1d1e7c12","count":40,"units":[{"title":"Introduction to System on Chip","questions":[{"id":"soc-u1-q1","subject":"soc","unit":1,"number":1,"q":"Explain evolution from IC to SOC.","ans":{"s":"SSI/MSI gates → LSI/VLSI processors → MCU and reusable IP → SoC integrates compute, memory, interfaces and accelerators.","m":"Early ICs packaged a few gates. Increasing density allowed datapaths, then microprocessors and on-chip memory. Reusable IP and standard on-chip links made it practical to put most of a system on one die. A phone SoC integrates CPU, GPU, image processing and interfaces.","d":"SSI/MSI devices integrated small gate networks or simple functions such as counters. LSI/VLSI put complete processors and memories on individual ICs. A board then combined processor, RAM and peripheral chips. A microcontroller combined a CPU, program/data memory and control-oriented I/O. With continued scaling and reusable IP, a System on Chip combines several system functions on a die, often including multiple processors, caches/SRAM, controllers, accelerators, fabric and mixed-signal functions. Short on-chip paths reduce external I/O switching and board area. Large memories, sensors or high-power radios may still remain external."}},{"id":"soc-u1-q2","subject":"soc","unit":1,"number":2,"q":"Difference between ASIC, FPGA & SoC.","ans":{"s":"ASIC describes application-specific silicon. FPGA describes field-programmable fabric. SoC describes system integration. A SoC may be ASIC-based or FPGA-based.","m":"An ASIC is fabricated for a defined function. It offers strong performance, power and area at volume, with up-front design and masks. An FPGA is configured after fabrication and trades some efficiency for flexibility. SoC is the integration of a system’s major functions onto one chip, as in an ASIC phone chip or an FPGA-SoC with hard CPU and programmable logic.","d":"Compare by implementation, cost and flexibility. A fixed-function ASIC implements chosen logic with custom or standard-cell layout. New functionality usually requires a new implementation and mask set. Its high non-recurring engineering cost is amortized by volume, and purpose-built logic generally gives better power, performance and area. An FPGA contains lookup tables, registers, programmable interconnect and often hard memories/DSPs/transceivers. Configuration can change in the field, masks are shared across many users and routing/programming overhead consumes area and energy. A SoC bundles computation, memory/interfaces and peripherals. SoC indicates integration scope and can describe either a fixed ASIC or a device with FPGA fabric, such as a processing system plus programmable logic."}},{"id":"soc-u1-q3","subject":"soc","unit":1,"number":3,"q":"Draw & Explain Architecture of SOC.","ans":{"s":"CPU/cache and accelerators share AXI/NoC. A DDR controller reaches memory, an APB bridge reaches peripherals, and control logic manages reset, clock, power and interrupts.","m":"CPU clusters, DMA and accelerators initiate transfers over an interconnect to SRAM, DDR and I/O controllers. A bridge connects low-speed UART, SPI and timers. Clock/reset, power and interrupt controllers coordinate operation. A typical SoC also has debug, security and external interfaces.","d":"The CPU executes firmware or an OS and often has private L1 caches with a shared last-level cache. The interconnect decodes addresses, arbitrates traffic and connects bus initiators and targets. DMA copies data without per-word CPU work. Graphics, AI or DSP engines accelerate suitable workloads. An on-chip ROM bootstraps the system, SRAM holds low-latency data and a DDR controller manages external DRAM. A low-power bridge attaches register-oriented UART, SPI, I²C, GPIO and timers. Interrupt controller, PLLs, reset and power management coordinate distributed subsystems. Security, debug, test logic and high-speed PHYs complete the architecture as needed.","fig":"\u003csvg role=\"img\" aria-label=\"SoC architecture\" viewBox=\"0 0 740 235\" xmlns=\"http://www.w3.org/2000/svg\">\u003cg fill=\"#142635\" stroke=\"#5f85aa\">\u003crect x=\"35\" y=\"18\" width=\"190\" height=\"45\" rx=\"7\"/>\u003crect x=\"275\" y=\"18\" width=\"190\" height=\"45\" rx=\"7\"/>\u003crect x=\"515\" y=\"18\" width=\"190\" height=\"45\" rx=\"7\"/>\u003crect x=\"35\" y=\"96\" width=\"670\" height=\"42\" rx=\"7\"/>\u003crect x=\"35\" y=\"169\" width=\"190\" height=\"45\" rx=\"7\"/>\u003crect x=\"275\" y=\"169\" width=\"190\" height=\"45\" rx=\"7\"/>\u003crect x=\"515\" y=\"169\" width=\"190\" height=\"45\" rx=\"7\"/>\u003c/g>\u003cpath d=\"M130 63v33m240-33v33m240-33v33M130 138v31m240-31v31m240-31v31\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003cg fill=\"#e9f5ff\" text-anchor=\"middle\" font-size=\"16\">\u003ctext x=\"130\" y=\"46\">CPU + caches\u003c/text>\u003ctext x=\"370\" y=\"46\">Accelerators / DMA\u003c/text>\u003ctext x=\"610\" y=\"46\">Clock, reset, IRQ\u003c/text>\u003ctext x=\"370\" y=\"123\">AXI interconnect / Network on Chip\u003c/text>\u003ctext x=\"130\" y=\"196\">ROM / SRAM\u003c/text>\u003ctext x=\"370\" y=\"196\">DDR / high-speed I/O\u003c/text>\u003ctext x=\"610\" y=\"196\">APB → UART / GPIO\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"soc-u1-q4","subject":"soc","unit":1,"number":4,"q":"Explain Architecture SOC Design & Fabrication Complexity.","ans":{"s":"Design complexity comes from heterogeneous IP and many interfaces. Fabrication complexity comes from masks, process options, variation, yield, package and test.","m":"Choose IP, interconnect, memories and domains around workload, bandwidth, latency and power constraints. Verify interfaces, clocks, resets, power states and software. Foundry constraints, analog process options, routing density, yield, packaging and production test make fabrication a separate challenge.","d":"Architecture must satisfy compute throughput and bandwidth while controlling area and energy. Integrate IP with compatible widths, protocols, clock ratios, reset requirements and security properties. Analyze coherency, contention, CDC/RDC, interrupt delivery, voltage crossing and system software. Physical design adds macro placement, congestion, parasitics, timing closure, IR drop and EM. Fabrication introduces mask count, process corners, lithography and density rules, defect-driven yield and variation. Analog/RF and memories can need special process options. Package parasitics, power delivery, thermal behavior and production test affect cost and reliability. DFT, built-in self-test and robust sign-off reduce manufacture and bring-up risk."}},{"id":"soc-u1-q5","subject":"soc","unit":1,"number":5,"q":"Explain Different Components of the SOC.","ans":{"s":"Typical blocks are CPU, memory, interconnect, accelerators, I/O, DMA, interrupt, power/clock/reset, security, debug and DFT.","m":"A CPU controls software execution, memories store program and data, and interconnect carries traffic. Accelerators handle specialized computation, DMA transfers blocks, I/O connects external devices, and management blocks handle interrupts, clock/reset, power, security and testing.","d":"Compute comprises CPU cores and application-dependent GPU, DSP, NPU or codec blocks. ROM holds the boot path, SRAM serves predictable low-latency access, caches exploit locality and a DDR controller accesses main memory. AXI or a NoC moves commands/data, and APB attaches peripheral registers. External interfaces use controllers and PHYs, while DMA initiates transfers for them. System support includes interrupt routing, watchdogs, PLLs and dividers, reset sequencing, voltage and power control, debug ports and DFT. Security may add boot verification, key storage, access control and a hardware root of trust."}},{"id":"soc-u1-q6","subject":"soc","unit":1,"number":6,"q":"Draw & Explain SOC Design Flow.","ans":{"s":"Requirements → architecture/IP → RTL/integration → verification/DFT → synthesis → physical design → sign-off → fabrication/bring-up.","m":"Specify workload and PPA, choose IP and interconnect, implement RTL and verify with software and testbenches. Synthesize a mapped netlist, insert test features, place, clock and route. Check timing, power and physical rules before tapeout, then test and bring up silicon.","d":"Specify functions, throughput, latency, voltage, area and testability. Partition hardware/software, define clock and power domains, select IP and build a memory map. Develop or integrate RTL, verify with simulation/formal checks and emulate or prototype software-facing behavior. Synthesize to a technology-mapped netlist and integrate scan/BIST according to the DFT plan. Floorplan, place, synthesize the clock tree and route. Extract parasitics, close timing and power integrity, and run DRC/LVS before streaming out GDSII/OASIS. Fabricate, package, test and characterize silicon, then run hardware/software bring-up.","fig":"\u003csvg role=\"img\" aria-label=\"Requirements / PPA targets then Architecture, IP selection and HW/SW partition then RTL integration and verification then Technology mapping and DFT then Floorplan, placement, clock tree and routing then Extraction, sign-off and stream-out then Fabrication, packaging, test and bring-up\" viewBox=\"0 0 620 294\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect x=\"45\" y=\"0\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"19\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Requirements / PPA targets\u003c/text>\u003cpath d=\"M310 29 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"42\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"61\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Architecture, IP selection and HW/SW partition\u003c/text>\u003cpath d=\"M310 71 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"84\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"103\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">RTL integration and verification\u003c/text>\u003cpath d=\"M310 113 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"126\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"145\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Technology mapping and DFT\u003c/text>\u003cpath d=\"M310 155 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"168\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"187\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Floorplan, placement, clock tree and routing\u003c/text>\u003cpath d=\"M310 197 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"210\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"229\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Extraction, sign-off and stream-out\u003c/text>\u003cpath d=\"M310 239 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"252\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"271\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Fabrication, packaging, test and bring-up\u003c/text>\u003c/svg>"}},{"id":"soc-u1-q7","subject":"soc","unit":1,"number":7,"q":"Explain Advantages and challenges of SoC.","ans":{"s":"Benefits: size, energy, bandwidth, fewer board parts. Challenges: up-front cost, verification, thermal/power integrity, IP integration, yield and reduced replaceability.","m":"On-chip integration reduces pin transfers, PCB footprint, part count and often energy. Shorter links increase bandwidth and reduce latency. Trade-offs include development cost, complex IP and software verification, thermal and power management, and dependence on one die’s yield.","d":"Integrated blocks communicate without driving separate chip I/O, reducing energy and board area and potentially improving system throughput. Fewer discrete parts can improve assembly cost and reliability at volume. SoC integration also creates large fixed engineering and mask costs. Shared buses/memory cause contention. Asynchronous clocks, multiple supplies and low-power states enlarge verification. Thermal hotspots, power integrity and mixed-signal noise require co-design. A respin or die defect can affect all integrated functions. Reuse, standardized interfaces, modular verification, DFT and strong physical sign-off help manage these costs."}},{"id":"soc-u1-q8","subject":"soc","unit":1,"number":8,"q":"Explain Applications of SoC in mobiles & Automobiles.","ans":{"s":"Mobile: CPU/GPU/NPU/ISP/modem. Automotive: ADAS perception, vehicle networking, infotainment and safety control.","m":"A phone SoC combines application processing, graphics, imaging, AI and often modem processing under a battery budget. Automotive SoCs combine sensor processing, AI and vehicle connectivity for ADAS or infotainment, with stronger fault handling and temperature requirements.","d":"In a smartphone, CPU cores run the OS, GPU renders the UI, ISP handles camera streams, NPU runs inference, and modem subsystem manages cellular data. DVFS, power islands and dedicated codecs save battery power. In a vehicle, automotive SoCs fuse cameras/radar and run perception and driver assistance, drive instrument/display pipelines or aggregate vehicle networking. Safety-oriented designs add measures such as ECC, watchdogs, monitor cores or lockstep processing and diagnostics, as dictated by system safety requirements. Long service life, wide temperature range and deterministic response matter more in vehicle control than in many consumer workloads."}}]},{"title":"SoC Architecture and IP Design","questions":[{"id":"soc-u2-q1","subject":"soc","unit":2,"number":1,"q":"Explain processor architecture with its microarchitecture.","ans":{"s":"ISA is the software contract. Microarchitecture implements it with a datapath, control, registers, pipeline and memory hierarchy.","m":"The ISA defines instructions, visible registers, addressing and exception behavior. Microarchitecture chooses how hardware executes that contract. A simple in-order and an out-of-order design can execute the same ISA using different datapaths and schedules.","d":"Processor architecture from the programmer’s perspective specifies instructions, architectural registers, memory access, privilege and exceptions. Microarchitecture provides a PC and fetch path, decoder/control, register file, ALU and load/store path, plus caches, branch prediction and, where required, issue/retirement structures. A five-stage example uses instruction fetch, decode/register read, execute, data memory and write-back. Forwarding and stalls manage data hazards. Prediction and flushing handle branches. A wider or out-of-order core may use register renaming and a reorder buffer while preserving architecturally correct results. Embedded designs select pipeline depth, cache and issue width for power, timing, area and workload."}},{"id":"soc-u2-q2","subject":"soc","unit":2,"number":2,"q":"Compare ARM , RISC-V and DSP for processor core selection.","ans":{"s":"Arm: mature cores and tools. RISC-V: open modular ISA. DSP: MAC/SIMD and deterministic streaming. Select for workload, ecosystem, cost and PPA.","m":"Arm offers mature processor IP and software for many product classes. RISC-V is an open ISA with standard extensions and varied core implementations. A DSP specializes in multiply-accumulate, vector and streaming workloads. Many SoCs pair a CPU with a DSP.","d":"Arm supplies licensed ISA/core IP and has mature compiler, OS, debug and commercial support. Cortex-M suits control workloads, Cortex-A rich operating systems and Cortex-R many real-time use cases. RISC-V is an open standard ISA with modular extensions. Core implementations may be open-source or commercially licensed. Check extension compatibility, software maturity and any custom instruction toolchain cost. DSP describes a processor class optimized for real-time signal processing, often offering fast MAC, saturation arithmetic, packed SIMD, circular addressing or vector throughput. Benchmark tasks such as control, OS management, filter/FFT and codecs. Compare worst-case latency, code portability, verification ecosystem, PPA, IP/licensing and integration effort."}},{"id":"soc-u2-q3","subject":"soc","unit":2,"number":3,"q":"Explain different basic elements in Instruction Handling.","ans":{"s":"Fetch → decode → read operands → execute → memory → write-back/retire. Handle stalls, forwarding, branches and precise exceptions.","m":"Fetch uses the PC and instruction memory/cache. Decode generates control and identifies operands. Execute performs arithmetic, address calculation or branch decisions. Loads/stores access data memory. Register results commit at write-back. Hazard logic stalls or forwards values and flushes wrong-path work.","d":"The PC selects an instruction via the instruction cache or memory. Fetch updates the predicted next PC. Decode identifies the opcode, immediate, source/destination registers and generates controls. Operand read obtains register data and may forward recent results. Execution performs ALU work, branch comparison or effective address generation. A load/store unit performs data accesses. Write-back updates the destination, with in-order retirement used where needed to make exceptions precise. Dependencies can require interlocks or forwarding, resource conflicts require arbitration, and branches require redirected fetching and a pipeline flush after misprediction. Interrupt/exception handling records the required architectural state and transfers to a handler."}},{"id":"soc-u2-q4","subject":"soc","unit":2,"number":4,"q":"Explain in brief different Intellectual Property cores (IP Cores) like Hard IP, Soft IP, Reusable IP and Firm IP.","ans":{"s":"Soft = synthesizable RTL. Firm = partly implemented/technology constrained. Hard = fixed physical macro. Reusable = designed and packaged for multiple integrations.","m":"Soft IP can be synthesized across targets and offers flexibility. Firm IP usually ships as a synthesized netlist or implementation-constrained design. Hard IP is delivered as a physical macro targeted to a process. Reusable IP includes documentation, interface contracts and verification deliverables.","d":"Soft IP is typically synthesizable RTL plus constraints and verification material. It offers portability and configuration at the expense of integration and PPA effort. Firm IP arrives in an intermediate form, often as a technology-mapped or optimized gate netlist, sometimes with placement guidance. Its exact format depends on the supplier and portability is limited by library assumptions. Hard IP delivers an already implemented layout/macro, often with LEF, GDSII and timing/power views for a specific process. SRAM, PLL and PHY macros frequently take this form. Reusability is orthogonal to delivery form. It requires well-defined interfaces, configurable parameters where useful, supported verification models and versioned documentation."}},{"id":"soc-u2-q5","subject":"soc","unit":2,"number":5,"q":"Explain in brief different bus architecture like AMBA, AXI, AHB and APB.","ans":{"s":"AMBA is the family. AXI serves high-performance masters, AHB supports pipelined system transfers, APB serves low-bandwidth register access.","m":"AXI separates read-address, read-data, write-address, write-data and write-response channels and supports bursts and outstanding transactions. AHB pipelines address/control and data phases. APB uses simple setup and access phases, typically behind a bridge for peripherals.","d":"AMBA is Arm’s family of interconnect specifications. AXI uses five independent VALID/READY channels and supports burst transfers and multiple outstanding requests where implemented. AXI suits CPU, DMA and memory bandwidth. AHB uses pipelined address/control and data phases with transfer completion via HREADY. AHB-Lite systems have one master per bus segment. APB omits burst and pipelining complexity. An APB transfer has setup with PSEL, then access with PENABLE, extended while PREADY is low. A typical architecture places a memory controller on AXI and UART/timer configuration behind an AXI/AHB-to-APB bridge."}},{"id":"soc-u2-q6","subject":"soc","unit":2,"number":6,"q":"Explain Network on Chip (NOC) basics.","ans":{"s":"NoC = packetized links between routers and endpoints. Choose topology, routing, buffering, flow control and deadlock avoidance.","m":"A network interface packages transactions into packets/flits. Routers forward them along mesh, ring or other topology. Flow control prevents buffer overflow. NoCs can scale aggregate bandwidth on large chips but add hops, buffers and verification complexity.","d":"A NoC maps initiators and targets to network interfaces, routers and point-to-point links. Interfaces adapt transactions into packets and break them into flits as needed. Routers select output directions, arbitrate competing inputs and apply flow control, such as credits to track downstream capacity. Topologies include rings and meshes. A 2-D mesh can use deterministic XY routing. Virtual channels or routing restrictions mitigate blocking/deadlock depending on design. Quality-of-service policies can reserve bandwidth or prioritize traffic. Evaluate hop count, accepted throughput, backpressure, area, energy and latency under realistic workloads. Clock/power domain crossing, ordering and coherency protocols still need explicit integration."}},{"id":"soc-u2-q7","subject":"soc","unit":2,"number":7,"q":"Explain in brief different memory subsystem in processors Like L1, L2, L3 cache memory etc.","ans":{"s":"L1 is small and fast, often split I/D. L2 is larger, L3 is often shared, and DRAM is largest/slowest. Hits exploit locality. Misses fetch the next level.","m":"L1 usually sits by each core with separate instruction and data caches. L2 trades latency for capacity and may be private or shared. L3 is commonly shared, followed by external DRAM. Tags, lines, replacement and write policy determine cache behavior. Coherence handles shared writable data.","d":"Registers and L1 provide the shortest access. A core often uses separate L1 instruction and data caches. L2 can be unified and private or shared. L3 is typically a larger shared last-level cache. Main DRAM provides much higher capacity through a memory controller. A cache line holds adjacent bytes to exploit spatial locality and a tag identifies its address. Recently used lines exploit temporal locality. A miss fetches from the next level and may evict a victim. Associativity, replacement, write-through/write-back and allocation policies change performance. A simplified one-level average access time is hit time + miss rate × miss penalty. Coherence ensures shared writable data is kept consistent among coherent caches. Scratchpad SRAM can provide predictable software-managed access."}},{"id":"soc-u2-q8","subject":"soc","unit":2,"number":8,"q":"Explain different robust processor like Vector, VLIW and superscalar.","ans":{"s":"Vector: one operation over multiple lanes. VLIW: compiler packs independent operations. Superscalar: hardware issues several instructions in a cycle.","m":"Vector engines exploit data-level parallelism, VLIW relies on compile-time scheduling of operations in a long instruction, and superscalar uses multiple execution units with issue decisions in hardware. These techniques can coexist.","d":"A vector instruction operates over many elements, such as adding arrays in parallel on multiple lanes. Performance depends on vector length, memory bandwidth and access pattern. VLIW encodes several independent operations into a single wide word and delegates scheduling to the compiler, reducing scheduling hardware but raising compiler dependence and code-compatibility concerns. Superscalar cores fetch/decode/issue more than one instruction per cycle using multiple functional units, handling dependencies in hardware. They may execute in order or dynamically schedule out of order. Vector suits data-parallel DSP/ML, VLIW suits predictable compiler-scheduled kernels and superscalar suits irregular general-purpose instruction-level parallelism."}}]},{"title":"RTL Design and Integration","questions":[{"id":"soc-u3-q1","subject":"soc","unit":3,"number":1,"q":"Write Verilog code for UART Transmitter.","ans":{"s":"UART 8N1 = idle 1, start 0, eight data bits LSB first, stop 1. Hold each bit for CLKS_PER_BIT. Accept only when ready.","m":"On a valid/ready handshake, load the 10-bit 8N1 frame and start at bit 0. A clock divider advances the bit index after one bit period. Output stays high during idle and throughout the stop bit.","d":"This synthesizable Verilog transmitter uses 8 data bits, no parity and one stop bit. Set CLKS_PER_BIT ≈ fclk / baud, rounded to minimize baud error. At 50 MHz and 9600 baud, 5208 ticks gives about 9600.61 baud. The packed register stores stop, data, start from MSB to LSB, and the index reads it from bit 0 upward. Accept tx_valid only while tx_ready is high and keep tx_data stable until that handshake. The initial index sends start for exactly the configured interval. After index 9 completes, busy clears and idle stays high. Verify the ten bit periods, transfer order, ignored requests while busy and reset during transmission.","code":{"lang":"verilog","s":"IDLE: TX = 1\nOn valid AND ready: record data, enter START\nSend 0, then data[0] through data[7], then 1\nHold each bit for CLKS_PER_BIT ticks\nReturn to IDLE after the stop bit","m":"// Core sequence inside a clocked process.\n// Reset clears busy, tick and bit_no. TX is busy ? frame[bit_no] : 1'b1.\nif (!busy && tx_valid) begin\n  frame \u003c= {1'b1, tx_data, 1'b0};\n  busy \u003c= 1'b1;\n  tick \u003c= 0;\n  bit_no \u003c= 0;\nend else if (busy) begin\n  if (tick == CLKS_PER_BIT - 1) begin\n    tick \u003c= 0;\n    if (bit_no == 9) busy \u003c= 1'b0;\n    else bit_no \u003c= bit_no + 1'b1;\n  end else tick \u003c= tick + 1;\nend","d":"module uart_tx #(\n  parameter integer CLKS_PER_BIT = 5208 // Must be >= 1.\n)(\n  input wire clk,\n  input wire rst_n,\n  input wire tx_valid,\n  input wire [7:0] tx_data,\n  output wire tx_ready,\n  output wire tx\n);\n  reg busy;\n  reg [9:0] frame;\n  reg [3:0] bit_no;\n  integer tick;\n\n  assign tx_ready = !busy;\n  assign tx = busy ? frame[bit_no] : 1'b1;\n\n  always @(posedge clk or negedge rst_n) begin\n    if (!rst_n) begin\n      busy   \u003c= 1'b0;\n      frame  \u003c= 10'h3ff;\n      bit_no \u003c= 4'd0;\n      tick   \u003c= 0;\n    end else if (!busy) begin\n      if (tx_valid) begin\n        frame  \u003c= {1'b1, tx_data, 1'b0};\n        bit_no \u003c= 4'd0;\n        tick   \u003c= 0;\n        busy   \u003c= 1'b1;\n      end\n    end else if (tick == CLKS_PER_BIT - 1) begin\n      tick \u003c= 0;\n      if (bit_no == 4'd9)\n        busy \u003c= 1'b0;\n      else\n        bit_no \u003c= bit_no + 1'b1;\n    end else begin\n      tick \u003c= tick + 1;\n    end\n  end\nendmodule"}}},{"id":"soc-u3-q2","subject":"soc","unit":3,"number":2,"q":"Write Verilog code for SPI Controller.","ans":{"s":"SPI mode 0 idles SCLK low. Select slave, present MOSI MSB first, sample MISO on each rising edge and advance MOSI on falling edges.","m":"A mode-0 master lowers CS, preloads MOSI with the most significant bit and toggles SCLK every half-period. The master samples MISO on rising edges and changes MOSI on falling edges. After eight samples and the final falling edge, it deasserts CS and signals done.","d":"This single-byte full-duplex master uses CPOL=0 and CPHA=0. A start strobe while idle asserts active-low CS and places bit 7 of the transmit byte on MOSI before the first rising SCLK edge. Each half-period lasts HALF_DIV system clocks, so fSCLK=fclk/(2×HALF_DIV). When SCLK is about to rise, shift in MISO and increment the sample count. When SCLK falls, advance MOSI unless all eight bits were sampled. On the final falling edge latch the receive byte, then keep CS low for one half-period to provide hold time. Raise CS and pulse done when the receive byte is available. For a particular slave, verify setup/hold and require the controller to wait for idle before asserting start again.","code":{"lang":"verilog","s":"When idle and start: CS low, SCLK low, MOSI = TX bit 7\nEvery half-period: toggle SCLK\nRising edge: capture MISO\nFalling edge: advance MOSI or finish after eight samples\nAfter the final CS hold interval: CS high and done","m":"// Mode 0 transfer tick. Start logic already lowered CS and preloaded MOSI.\nif (busy && half_tick) begin\n  if (ending) begin\n    cs_n \u003c= 1'b1; busy \u003c= 1'b0; done \u003c= 1'b1;\n  end else if (!sclk) begin\n    sclk \u003c= 1'b1;\n    rx_shift \u003c= {rx_shift[6:0], miso};\n    samples \u003c= samples + 1'b1;\n  end else begin\n    sclk \u003c= 1'b0;\n    if (samples == 8) begin\n      rx_data \u003c= rx_shift;\n      ending \u003c= 1'b1;\n    end else begin\n      tx_shift \u003c= {tx_shift[6:0], 1'b0};\n      mosi \u003c= tx_shift[6];\n    end\n  end\nend","d":"module spi_master_mode0 #(\n  parameter integer HALF_DIV = 4 // Must be >= 1.\n)(\n  input wire clk,\n  input wire rst_n,\n  input wire start,\n  input wire [7:0] tx_data,\n  input wire miso,\n  output reg cs_n,\n  output reg sclk,\n  output reg mosi,\n  output reg busy,\n  output reg done,\n  output reg [7:0] rx_data\n);\n  reg [7:0] tx_shift, rx_shift;\n  reg [3:0] samples;\n  reg ending;\n  integer half_count;\n\n  always @(posedge clk or negedge rst_n) begin\n    if (!rst_n) begin\n      cs_n \u003c= 1'b1;\n      sclk \u003c= 1'b0;\n      mosi \u003c= 1'b0;\n      busy \u003c= 1'b0;\n      done \u003c= 1'b0;\n      ending \u003c= 1'b0;\n      tx_shift \u003c= 8'd0;\n      rx_shift \u003c= 8'd0;\n      rx_data \u003c= 8'd0;\n      samples \u003c= 4'd0;\n      half_count \u003c= 0;\n    end else begin\n      done \u003c= 1'b0;\n      if (!busy) begin\n        if (start) begin\n          cs_n \u003c= 1'b0;\n          busy \u003c= 1'b1;\n          ending \u003c= 1'b0;\n          tx_shift \u003c= tx_data;\n          rx_shift \u003c= 8'd0;\n          mosi \u003c= tx_data[7];\n          samples \u003c= 4'd0;\n          half_count \u003c= 0;\n        end\n      end else if (half_count == HALF_DIV - 1) begin\n        half_count \u003c= 0;\n        if (ending) begin\n          cs_n \u003c= 1'b1;\n          busy \u003c= 1'b0;\n          done \u003c= 1'b1;\n        end else if (!sclk) begin\n          sclk \u003c= 1'b1;\n          rx_shift \u003c= {rx_shift[6:0], miso};\n          samples \u003c= samples + 1'b1;\n        end else begin\n          sclk \u003c= 1'b0;\n          if (samples == 4'd8) begin\n            rx_data \u003c= rx_shift;\n            ending \u003c= 1'b1;\n          end else begin\n            tx_shift \u003c= {tx_shift[6:0], 1'b0};\n            mosi \u003c= tx_shift[6];\n          end\n        end\n      end else begin\n        half_count \u003c= half_count + 1;\n      end\n    end\n  end\nendmodule"}}},{"id":"soc-u3-q3","subject":"soc","unit":3,"number":3,"q":"Write Verilog for Clocking and Timing Peripheral.","ans":{"s":"Prescale the clock into a synchronous enable. Count enable ticks, emit a one-clock match pulse and reload.","m":"An enabled prescaler generates a tick every PRESCALE source clocks. A timer counter advances only on that tick and pulses IRQ when its period is reached, then restarts from zero. Use a synchronous enable to keep all logic in one clock domain.","d":"The peripheral implements an enabled prescaler and auto-reloading timer, both clocked by the same source. The prescaler produces a one-clock tick every PRESCALE active source cycles. The timer increments only when the prescaler expires, and pulses irq when PERIOD_TICKS ticks have elapsed. Its repeat rate is fclk/(PRESCALE×PERIOD_TICKS). At 50 MHz, PRESCALE=50 and PERIOD_TICKS=1000 yield a 1 ms interval. While enable is low both counters freeze and the pulses clear. Reset returns both counters and pulses to zero. A memory-mapped design can replace constants with registers, add a sticky status bit for firmware polling, and synchronize interrupt delivery if it crosses clocks.","code":{"lang":"verilog","s":"On reset: clear prescaler and timer\nWhile enabled: increment prescaler\nAt prescaler terminal count: issue tick and clear it\nOn each tick: increment timer\nAt timer terminal count: issue IRQ and clear timer","m":"// In the clocked process, tick and irq default low each cycle.\nif (enable) begin\n  if (pre == PRESCALE - 1) begin\n    pre \u003c= 0;\n    tick \u003c= 1'b1;\n    if (elapsed == PERIOD_TICKS - 1) begin\n      elapsed \u003c= 0;\n      irq \u003c= 1'b1;\n    end else elapsed \u003c= elapsed + 1;\n  end else pre \u003c= pre + 1;\nend","d":"module periodic_timer #(\n  parameter integer PRESCALE = 50,       // >= 1\n  parameter integer PERIOD_TICKS = 1000  // >= 1\n)(\n  input wire clk,\n  input wire rst_n,\n  input wire enable,\n  output reg tick,\n  output reg irq\n);\n  integer pre;\n  integer elapsed;\n\n  always @(posedge clk or negedge rst_n) begin\n    if (!rst_n) begin\n      pre \u003c= 0;\n      elapsed \u003c= 0;\n      tick \u003c= 1'b0;\n      irq \u003c= 1'b0;\n    end else begin\n      tick \u003c= 1'b0;\n      irq \u003c= 1'b0;\n      if (enable) begin\n        if (pre == PRESCALE - 1) begin\n          pre \u003c= 0;\n          tick \u003c= 1'b1;\n          if (elapsed == PERIOD_TICKS - 1) begin\n            elapsed \u003c= 0;\n            irq \u003c= 1'b1;\n          end else begin\n            elapsed \u003c= elapsed + 1;\n          end\n        end else begin\n          pre \u003c= pre + 1;\n        end\n      end\n    end\n  end\nendmodule"}}},{"id":"soc-u3-q4","subject":"soc","unit":3,"number":4,"q":"Write assertion based verification code for FSM based Traffic Light controller.","ans":{"s":"SVA checks reset, legal states, conflict-free lamps, correct sequence and hold-until-timeout. Cover one full state cycle.","m":"Bind a checker to the traffic FSM. For each state, a sampled timer expiration requires the next legal state on the next clock, while an unexpired timer requires a self-loop. Also assert that both directions cannot display green or yellow at once, and cover the full cycle.","d":"The example checker assumes an active-low reset and sequence NS green → NS yellow → all red → EW green → EW yellow → all red → NS green. The two all-red states have distinct codes to preserve direction. timeout is sampled as true in the cycle when the controller should advance. Nonoverlapping implication |=> checks the successor on the following sample. Assertions check legal state encoding, safe one-hot lamp vectors, exact output decoding, competing directions and correct reset, advancement and hold behavior. A cover property exercises the complete cycle. Bind the checker or instantiate it in a SystemVerilog testbench, matching state codes and signal names to the DUT. Use an SVA-capable simulator or formal tool.","code":{"lang":"systemverilog","s":"Assert reset drives the default state\nAssert legal states and exactly one lamp per direction\nAssert each lamp output matches the state\nAssert two directions never show green/yellow simultaneously\nAssert timeout advances to the legal successor, otherwise hold\nCover one full traffic-light cycle","m":"// Requires default clocking and reset disable in the checker.\nassert property (state == NS_G && timeout |=> state == NS_Y);\nassert property (state == NS_Y && timeout |=> state == AR_NE);\nassert property (state == AR_NE && timeout |=> state == EW_G);\nassert property (!timeout |=> $stable(state));\nassert property (!(ns_lamp[1:0] != 2'b00 &&\n                   ew_lamp[1:0] != 2'b00));","d":"module traffic_light_sva (\n  input logic clk, rst_n, timeout,\n  input logic [2:0] state,\n  input logic [2:0] ns_lamp, ew_lamp // {red, yellow, green}\n);\n  localparam logic [2:0] NS_G  = 3'd0, NS_Y  = 3'd1,\n                         AR_NE = 3'd2, EW_G  = 3'd3,\n                         EW_Y  = 3'd4, AR_EN = 3'd5;\n  localparam logic [2:0] R = 3'b100, Y = 3'b010, G = 3'b001;\n\n  default clocking cb @(posedge clk);\n  endclocking\n\n  assert property (!rst_n |=> state == NS_G);\n\n  assert property (disable iff (!rst_n)\n    state inside {NS_G, NS_Y, AR_NE, EW_G, EW_Y, AR_EN});\n  assert property (disable iff (!rst_n)\n    !$isunknown({ns_lamp, ew_lamp}) &&\n    $onehot(ns_lamp) && $onehot(ew_lamp));\n  assert property (disable iff (!rst_n)\n    !(ns_lamp[1:0] != 2'b00 && ew_lamp[1:0] != 2'b00));\n\n  assert property (disable iff (!rst_n)\n    state == NS_G |-> ns_lamp == G && ew_lamp == R);\n  assert property (disable iff (!rst_n)\n    state == NS_Y |-> ns_lamp == Y && ew_lamp == R);\n  assert property (disable iff (!rst_n)\n    state == EW_G |-> ns_lamp == R && ew_lamp == G);\n  assert property (disable iff (!rst_n)\n    state == EW_Y |-> ns_lamp == R && ew_lamp == Y);\n  assert property (disable iff (!rst_n)\n    (state == AR_NE || state == AR_EN) |->\n      ns_lamp == R && ew_lamp == R);\n\n  assert property (disable iff (!rst_n) !timeout |=> $stable(state));\n  assert property (disable iff (!rst_n)\n    state == NS_G && timeout |=> state == NS_Y);\n  assert property (disable iff (!rst_n)\n    state == NS_Y && timeout |=> state == AR_NE);\n  assert property (disable iff (!rst_n)\n    state == AR_NE && timeout |=> state == EW_G);\n  assert property (disable iff (!rst_n)\n    state == EW_G && timeout |=> state == EW_Y);\n  assert property (disable iff (!rst_n)\n    state == EW_Y && timeout |=> state == AR_EN);\n  assert property (disable iff (!rst_n)\n    state == AR_EN && timeout |=> state == NS_G);\n\n  cover property (disable iff (!rst_n)\n    (state == NS_G && timeout) ##1\n    (state == NS_Y) ##[0:1000] (state == NS_Y && timeout) ##1\n    (state == AR_NE) ##[0:1000] (state == AR_NE && timeout) ##1\n    (state == EW_G) ##[0:1000] (state == EW_G && timeout) ##1\n    (state == EW_Y) ##[0:1000] (state == EW_Y && timeout) ##1\n    (state == AR_EN) ##[0:1000] (state == AR_EN && timeout) ##1\n    (state == NS_G));\nendmodule"}}},{"id":"soc-u3-q5","subject":"soc","unit":3,"number":5,"q":"Explain BIST concept for testing.","ans":{"s":"BIST generates stimulus and checks responses on chip. Logic BIST uses PRPG, scan and MISR. Memory BIST uses read/write sequences such as March tests.","m":"BIST runs tests with hardware built into the chip. Logic BIST uses a pseudorandom pattern generator and signature register. Memory BIST writes and reads memory using structured address and data sequences and compares expected values.","d":"A BIST controller selects test mode, initializes generators, runs patterns and reports pass/fail. In logic BIST, a linear-feedback shift register can generate pseudorandom scan patterns, then a multiple-input signature register compresses captured responses. The resulting signature is compared with the fault-free signature. Aliasing and random-pattern-resistant faults limit coverage. In memory BIST, a controller applies a March sequence with read/write operations in specified ascending and descending address sweeps. It compares observations to expected data to detect stuck-at, transition and coupling faults targeted by the chosen sequence. BIST reduces external data volume and supports at-speed or in-field tests. It costs area, can increase test power and needs a safe way to enter and leave test mode."}},{"id":"soc-u3-q6","subject":"soc","unit":3,"number":6,"q":"Explain different challenges in SOC testing and verification.","ans":{"s":"Verify intended behavior and test manufactured silicon. Use simulation/formal/CDC, then scan/ATPG, MBIST, boundary scan and silicon diagnostics.","m":"SoC verification faces enormous state spaces, reused IP, clock and power crossings, and hardware/firmware interaction. Manufacturing test adds controllability and observability challenges for buried logic, memories and hard macros. Combine verification coverage with DFT and fault coverage.","d":"Functional verification checks that the RTL and integrated system meet their specification. Challenge areas include interconnect concurrency, reused IP assumptions, shared memory ordering, CDC/RDC, power isolation/retention and hardware/software boot. Combine directed and constrained-random simulation, assertions, formal checks and emulation, tracking functional/code coverage and CDC results. Manufacturing test detects physical defects. Scan chains improve controllability/observability, ATPG targets fault models such as stuck-at and transition, MBIST tests embedded RAM and boundary scan tests board-level connections. Analog/hard IP may require dedicated test modes. Test compression, at-speed clocks, IR-drop control and debug access help balance test coverage, diagnosis, time and power."}}]},{"title":"Floor Planning","questions":[{"id":"soc-u4-q1","subject":"soc","unit":4,"number":1,"q":"Compare Abutted and Non-abutted floorplan techniques.","ans":{"s":"Abutted blocks touch and align terminals, which supports dense layouts. Non-abutted blocks reserve channels for routing, buffers and access.","m":"Abutted blocks share boundaries and may connect aligned pins directly, reducing channel area. Non-abutted blocks are separated by routing channels and easier to connect or change. Leave appropriate halos for pin access, power structures and design rules.","d":"In an abutted floorplan, neighboring macro/block boundaries coincide, or nearly coincide under required spacing rules. Facing pins can align for direct connectivity, and over-the-block upper-metal routing may supplement boundary connections where allowed. This saves area and can aid repeated tiles, but incorrect pin alignment, poor pin access, and local congestion are hard to fix. Non-abutted blocks reserve channels between boundaries for routes, power straps, feedthroughs, repeaters and engineering changes. They simplify top-level access and spacing at the cost of greater area and possibly longer interconnect. Choose based on net crossing count, pin alignment, macro routing restrictions, design rules and track capacity.","fig":"\u003csvg role=\"img\" aria-label=\"Abutted and non-abutted floorplans\" viewBox=\"0 0 620 130\" xmlns=\"http://www.w3.org/2000/svg\">\u003cg fill=\"#152637\" stroke=\"#547697\">\u003crect x=\"30\" y=\"25\" width=\"110\" height=\"56\"/>\u003crect x=\"140\" y=\"25\" width=\"110\" height=\"56\"/>\u003crect x=\"330\" y=\"25\" width=\"110\" height=\"56\"/>\u003crect x=\"490\" y=\"25\" width=\"110\" height=\"56\"/>\u003c/g>\u003cg text-anchor=\"middle\" fill=\"#e9f5ff\" font-size=\"14\">\u003ctext x=\"85\" y=\"57\">Block A\u003c/text>\u003ctext x=\"195\" y=\"57\">Block B\u003c/text>\u003ctext x=\"385\" y=\"57\">Block A\u003c/text>\u003ctext x=\"545\" y=\"57\">Block B\u003c/text>\u003ctext x=\"140\" y=\"111\">Abutted: shared edge\u003c/text>\u003ctext x=\"465\" y=\"111\">Non-abutted: channel\u003c/text>\u003c/g>\u003cpath d=\"M440 52h50m-43-5l-7 5 7 5m36-10 7 5-7 5\" fill=\"none\" stroke=\"#8ed5ff\"/>\u003c/svg>"}},{"id":"soc-u4-q2","subject":"soc","unit":4,"number":2,"q":"Explain different floorplan control parameters.","ans":{"s":"Control die/core size, aspect ratio, utilization, rows/tracks, macro locations, I/O pins, halos, blockages, channels and power grid.","m":"Set the die/core boundaries, core utilization and aspect ratio. Establish rows/tracks, macro positions/orientations, keep-outs and I/O pin locations. Plan power rings/straps and route channels. Iterate using wire length, congestion and timing estimates.","d":"Physical controls include die outline, core setback and margins, aspect ratio and target utilization. Standard-cell rows and routing tracks snap logic to manufacturing/legal sites. Macro location, allowable orientation, channels, pin-facing order and halo spacing determine accessibility and routing capacity. I/O pad and pin placement supports package/board needs. Placement blockages reserve cell-free areas. Routing blockages reserve tracks or protect sensitive regions. Power domains need appropriate alignments, rails and voltage areas. Evaluate candidate floorplans for area, estimated wire length, timing feasibility, track overflow, pin access and IR drop before freezing constraints."}},{"id":"soc-u4-q3","subject":"soc","unit":4,"number":3,"q":"What is Partitioning? Explain need of partitioning & briefly explain rules of partitioning","ans":{"s":"Partition into manageable blocks with balanced resources and few cross-block nets. Keep related/critical logic together, define clear interfaces and respect hierarchy, timing and power.","m":"Partitioning divides logic into implementable subblocks. It reduces design complexity and enables parallel design and verification. Seek balanced area, minimal critical cut nets, clean interfaces and boundaries that respect clocks, voltage domains and test constraints.","d":"Represent instances as vertices and nets as hyperedges. Aim to minimize the number and weighted cost of nets crossing partitions while meeting block capacity, pin, timing and power constraints. Group tightly connected logic and keep critical paths together when possible. Respect hard macros, voltage islands, clock domains, hierarchy and test boundaries. Balance area and pin count so no block becomes congested. Register interfaces when the architecture allows, budget interblock timing and document clocks, reset, protocols and ownership. Use connectivity-aware algorithms followed by refinement and verify connectivity, timing, power and physical feasibility at the top level."}},{"id":"soc-u4-q4","subject":"soc","unit":4,"number":4,"q":"Explain different Inputs and Outputs of Floorplan.","ans":{"s":"Inputs: netlist, constraints, tech/cell LEF, macro shapes and connectivity, package/I/O and power constraints. Outputs: die/core, rows, macro/pin coordinates, blockages and power plan.","m":"The floorplanner uses mapped connectivity, library sizes and layer rules, timing and power intent, and package constraints. It produces a physical starting database with core/die boundaries, rows/tracks, macro and I/O locations, blockages and the initial power plan.","d":"Inputs include the gate netlist and hierarchy, technology LEF (layers/vias/sites), cell and macro LEF (sizes, pins, obstructions), timing libraries/SDC, UPF or voltage assignments, package pad/bump rules and utilization/area targets. Outputs include die and core outlines, standard-cell rows, track grids, fixed macro positions and orientations, I/O pin or pad coordinates, keep-outs, placement/routing blockages, voltage-area boundaries and a preliminary power network. A tool can export DEF plus reports on utilization, area and estimated congestion. Placement and routing refine the resulting database."}},{"id":"soc-u4-q5","subject":"soc","unit":4,"number":5,"q":"Explain different placement aspects in brief like Die size estimation, Core area calculation and Aspect ratio determination.","ans":{"s":"Estimate core ≈ usable cell area budget / target utilization + fixed exclusions. With r=W/H, W=√(rA), H=√(A/r). Add edge/pad margins for die size.","m":"Sum standard-cell area and reserve room for growth and whitespace. If utilization is defined over placeable core area, divide the cell area by target utilization and add fixed macro/blocked area. Choose W/H and add edge and package margins to estimate die dimensions.","d":"Start with mapped standard-cell area Astd, predicted buffer/spare growth, hard-macro footprints and obstructions. If target utilization U applies only to the placeable area, use Acore ≈ Astd/U + Amacro + Ablocked, with disjoint exclusion terms to avoid double counting. For Astd=0.60 mm², U=0.60 and 0.25 mm² of excluded area, Acore≈1.25 mm². For r=W/H, calculate W=√(rAcore) and H=√(Acore/r). R=1 gives about 1.118 mm on each side. Add core-to-die setbacks and verify I/O ring/bump, package, seal-ring and reticle needs. Snap dimensions to permitted grids and iterate if routing or power capacity is inadequate. Some tools define utilization differently, so state the convention."}},{"id":"soc-u4-q6","subject":"soc","unit":4,"number":6,"q":"Explain different placement aspects in brief like coarse placement, I/O pad placement, legalization, placement blockage and keep-out margin.","ans":{"s":"Coarse placement optimizes approximate positions. Legalization aligns cells without overlaps. I/O pads connect package, blockages reserve areas and halos keep macro edges clear.","m":"Global placement balances estimated wire length, density and timing with provisional cell coordinates. Legalization moves cells to valid nonoverlapping sites. I/O pads/pins consider package order and ESD. Blockages reserve defined regions, and keep-out margins establish clearance near critical objects.","d":"Coarse/global placement chooses approximate cell positions using wire-length, timing, density and congestion estimates. Tentative cells may overlap or sit off-site. Legalization resolves overlaps, snaps standard cells to rows/sites, enforces compatible orientation and respects fixed objects. Detailed placement then improves local wire length and timing under legality. I/O pads or bumps follow package, power/ground and signal grouping constraints. A placement blockage can be hard, soft or partial depending on the tool. A keep-out margin or halo attached to a macro keeps cells away for routing access, spacing, power or noise reasons. Analyze congestion and timing after each major adjustment."}},{"id":"soc-u4-q7","subject":"soc","unit":4,"number":7,"q":"Explain fixed-die routing and variable-die routing and Pin Planning.","ans":{"s":"Fixed-die routing fits within known outlines. Variable-die routing can grow channels/die. Pin planning sets layer, side, order, spacing and alignment.","m":"A fixed-die router must work within given geometry and routing capacity, rerouting or adding permitted layers/vias when congested. Variable-die routing can widen channels or enlarge the outline. Assign accessible pins near connected blocks, preserving bus order and package needs.","d":"Fixed-die routing fixes die/core and block outlines before routing. The tool must route through available layers/tracks around obstructions and satisfy DRC without moving boundaries. If capacity is inadequate, placement changes or authorized layer resources may be needed. Variable-die or area-expanding routing can change channel width, block separation or final die dimensions, trading die area for routability. Pin planning specifies each signal’s boundary/side, routing layer, coordinate and legal spacing. Align neighboring pins for short direct paths and order buses coherently to reduce crossings. Honor macro access, ESD/package constraints, power pin needs and timing-critical signal paths. Review congestion and revise pin placement before detailed routing."}}]},{"title":"Physical Design and Implementation","questions":[{"id":"soc-u5-q1","subject":"soc","unit":5,"number":1,"q":"Draw and explain in brief Synthesis flow.","ans":{"s":"RTL + libraries + constraints → elaborate → derive and optimize logic → map to cells → verify → netlist/reports.","m":"Parse and elaborate RTL and constraints. Infer registers, arithmetic and combinational logic. Optimize and map the design to library gates for timing/area/power, then verify equivalence and review reports.","d":"Feed synthesizable RTL, the top module and parameters, Liberty timing/power libraries and SDC constraints into the synthesizer. Elaboration resolves hierarchy, widths, generate logic and bindings. Generic synthesis infers registers, muxes, arithmetic and state machines. Technology mapping replaces generic logic with legal library cells. Optimization sizes or restructures logic using timing, area and power objectives and may integrate scan depending on the flow. Inspect unresolved references, unconstrained paths, timing, area and power reports, and use logical equivalence checking under intended assumptions. Export a technology-mapped netlist and implementation constraints.","fig":"\u003csvg role=\"img\" aria-label=\"RTL + Liberty + SDC then Read / elaborate design then Infer registers, arithmetic and logic then Technology mapping and optimization then Equivalence, timing and area checks then Mapped netlist and implementation constraints\" viewBox=\"0 0 620 252\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect x=\"45\" y=\"0\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"19\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">RTL + Liberty + SDC\u003c/text>\u003cpath d=\"M310 29 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"42\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"61\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Read / elaborate design\u003c/text>\u003cpath d=\"M310 71 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"84\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"103\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Infer registers, arithmetic and logic\u003c/text>\u003cpath d=\"M310 113 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"126\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"145\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Technology mapping and optimization\u003c/text>\u003cpath d=\"M310 155 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"168\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"187\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Equivalence, timing and area checks\u003c/text>\u003cpath d=\"M310 197 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"210\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"229\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Mapped netlist and implementation constraints\u003c/text>\u003c/svg>"}},{"id":"soc-u5-q2","subject":"soc","unit":5,"number":2,"q":"Draw and explain overview of backend VLSI Design Flow.","ans":{"s":"Backend: floorplan/PG → place → CTS → route → extraction → timing, power and layout sign-off → GDSII.","m":"The backend takes a mapped netlist and physical libraries. Establish the floorplan and power grid, place and legalize cells, then build the clock network. Route nets and use extracted RC and physical checks to close the design.","d":"The backend realizes logical design as manufacturable geometry. Import hierarchical netlist, physical and timing views, SDC and power intent. Set die/core, macros, I/O and power structures. Place cells and optimize path timing/routability. Build buffered clocks in CTS and analyze propagated skew and insertion delay. Global routing plans paths and detailed routing assigns legal shapes/vias. Extract parasitic RC, run multi-corner multi-mode timing and fix violations. Verify IR, EM, DRC, LVS, antenna and applicable density constraints. Stream out the signed-off GDSII or OASIS layout and related deliverables.","fig":"\u003csvg role=\"img\" aria-label=\"Mapped netlist + libraries + constraints then Floorplan, I/O, macros and power grid then Global placement, legalization and refinement then Clock Tree Synthesis then Global and detailed signal routing then Parasitic extraction, timing and physical checks then GDSII / OASIS and sign-off reports\" viewBox=\"0 0 620 294\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect x=\"45\" y=\"0\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"19\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Mapped netlist + libraries + constraints\u003c/text>\u003cpath d=\"M310 29 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"42\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"61\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Floorplan, I/O, macros and power grid\u003c/text>\u003cpath d=\"M310 71 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"84\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"103\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Global placement, legalization and refinement\u003c/text>\u003cpath d=\"M310 113 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"126\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"145\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Clock Tree Synthesis\u003c/text>\u003cpath d=\"M310 155 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"168\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"187\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Global and detailed signal routing\u003c/text>\u003cpath d=\"M310 197 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"210\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"229\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Parasitic extraction, timing and physical checks\u003c/text>\u003cpath d=\"M310 239 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"252\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"271\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">GDSII / OASIS and sign-off reports\u003c/text>\u003c/svg>"}},{"id":"soc-u5-q3","subject":"soc","unit":5,"number":3,"q":"Compare Frontend & Backend SOC design.","ans":{"s":"Frontend specifies and verifies logical behavior. Backend meets timing/routing/power and creates physical mask geometry. Both iterate around constraints.","m":"Frontend focuses on architecture, RTL, IP integration, verification and mapping to a gate netlist. Backend focuses on floorplanning, timing-driven placement, CTS, routing, extraction and sign-off. Constraints and equivalence bind the two.","d":"Frontend work begins with requirements, hardware/software partitioning and interfaces. Designers develop/integrate RTL and run simulation, formal, CDC and functional coverage checks. Logical synthesis produces the mapped gate-level netlist, with DFT usually integrated around synthesis according to methodology. Backend imports that netlist and constraints, plans core/IO/power, places cells and macros, synthesizes clocks, routes and extracts RC. It verifies timing and power integrity, checks DRC/LVS and exports manufacturing data. A synthesis or floorplan issue can cause iterations across the boundary. Typical frontend outputs are RTL, verification results and a logical netlist. Backend outputs are the final layout, extracted parasitics and sign-off reports."}},{"id":"soc-u5-q4","subject":"soc","unit":5,"number":4,"q":"Draw and explain in brief Netlist to GDSII layout flow.","ans":{"s":"Netlist + LEF/Liberty/SDC → floorplan → placement → CTS → global/detailed routing → sign-off → GDSII.","m":"Import the mapped netlist, libraries and technology rules. Define macro/IO positions and the power network, then place cells and route clocks and signals. Extract RC, close STA and power, run DRC/LVS, then stream out merged mask polygons.","d":"Load the netlist, Liberty, LEF, process rules, parasitic technology and constraints. Floorplan die/core, macros, I/O and power network. Perform global placement, legalization and detail placement. Insert clock buffers/inverters and balance sinks during CTS. Plan global route guides, build detailed wire/via shapes and repair antenna/DRC issues. Extract resistances/capacitances and close setup/hold under required modes/corners. Run IR drop/electromigration, density/fill, DRC and LVS checks. Merge approved standard-cell/macro layout views using the correct process layer map and stream out final GDSII or OASIS for the foundry. GDSII carries layout geometry. Sign-off reports and netlists are separate deliverables.","fig":"\u003csvg role=\"img\" aria-label=\"Mapped netlist + libraries + constraints then Floorplan, I/O, macros and power grid then Global placement, legalization and refinement then Clock Tree Synthesis then Global and detailed signal routing then Parasitic extraction, timing and physical checks then GDSII / OASIS and sign-off reports\" viewBox=\"0 0 620 294\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect x=\"45\" y=\"0\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"19\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Mapped netlist + libraries + constraints\u003c/text>\u003cpath d=\"M310 29 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"42\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"61\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Floorplan, I/O, macros and power grid\u003c/text>\u003cpath d=\"M310 71 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"84\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"103\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Global placement, legalization and refinement\u003c/text>\u003cpath d=\"M310 113 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"126\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"145\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Clock Tree Synthesis\u003c/text>\u003cpath d=\"M310 155 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"168\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"187\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Global and detailed signal routing\u003c/text>\u003cpath d=\"M310 197 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"210\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"229\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Parasitic extraction, timing and physical checks\u003c/text>\u003cpath d=\"M310 239 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"252\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"271\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">GDSII / OASIS and sign-off reports\u003c/text>\u003c/svg>"}},{"id":"soc-u5-q5","subject":"soc","unit":5,"number":5,"q":"What are the different roles of Physical design engineer?","ans":{"s":"Physical design engineers own floorplan, placement/CTS/routing, PPA closure, sign-off, ECOs and handoff.","m":"The engineer converts a mapped netlist to layout, plans the floorplan and power grid, analyzes timing and congestion, and fixes physical violations. They coordinate with RTL, STA, DFT, package and foundry teams and sign off the final database.","d":"Typical responsibilities include maintaining P&R inputs and scripts, defining die/core and block budgets, macro/IO planning, power-grid design, timing/congestion-driven placement, CTS and routing. Analyze setup/hold, clock skew and insertion delay, DRC/LVS, antenna, parasitic extraction, IR drop and electromigration. Carry out timing, power or logic engineering change orders (ECOs) and verify equivalence and sign-off after each revision. Coordinate constraint questions and integration with RTL, DFT, IP, STA, packaging and manufacturing teams. Own reproducible runs, implementation reports and tapeout handoff for the assigned design scope."}},{"id":"soc-u5-q6","subject":"soc","unit":5,"number":6,"q":"Enlist and explain different Synopsys Design Constraints(SDC).","ans":{"s":"SDC defines clocks, I/O timing, clock uncertainty, design limits and timing exceptions. Validate timing coverage and every exception.","m":"Typical SDC commands define primary/generated clocks and their uncertainty, input/output delays, loads and operating limits. False paths, multicycle paths and clock groups alter analysis and must follow the interface intent.","d":"Synopsys Design Constraints (SDC) is a Tcl-based timing/implementation constraint format. create_clock supplies period and waveform. create_generated_clock relates derived clocks to their source. set_clock_uncertainty reserves margin. Set_input_delay and set_output_delay describe external timing relative to a clock. set_input_transition and set_load model edge rate and external capacitance. set_max_transition, set_max_capacitance and set_max_fanout set design limits where supported. set_clock_groups, set_false_path and set_multicycle_path change path analysis. Apply these exceptions only where the timing architecture justifies the exception. Different modes can have separate SDC files. Report clocks, exceptions, timing and unconstrained paths to validate coverage.","code":{"lang":"tcl","s":"Define the primary and derived clocks\nSet the external input and output timing budgets\nApply only justified path exceptions\nReview coverage and slack","m":"# Time units follow the timing tool / library environment.\ncreate_clock -name sys -period 10 [get_ports clk]\nset_input_delay -clock [get_clocks sys] -max 2.0 [get_ports din]\nset_output_delay -clock [get_clocks sys] -max 2.0 [get_ports dout]","d":"# Example with nanosecond time units and 100 MHz primary clock.\ncreate_clock -name sys -period 10.0 -waveform {0.0 5.0} [get_ports clk]\ncreate_generated_clock -name sys_div2 -source [get_ports clk] \\\n    -divide_by 2 [get_pins u_div/q]\nset_clock_uncertainty 0.10 [get_clocks sys]\n\n# The external interface budget determines both max and min.\nset_input_delay  -clock [get_clocks sys] -max 2.00 [get_ports din]\nset_input_delay  -clock [get_clocks sys] -min 0.50 [get_ports din]\nset_output_delay -clock [get_clocks sys] -max 2.00 [get_ports dout]\nset_output_delay -clock [get_clocks sys] -min -0.20 [get_ports dout]\n\n# Confirm the objects exist and review timing coverage after loading.\n# Apply false paths or multicycle paths only per interface intent."}}},{"id":"soc-u5-q7","subject":"soc","unit":5,"number":7,"q":"Discuss different inputs for Physical Design.","ans":{"s":"Inputs include netlist, SDC, Liberty, tech/cell/macro LEF, GDS/OASIS views, UPF, RC tech, package data and sign-off rule decks.","m":"The mapped netlist gives connectivity, SDC gives constraints, Liberty gives timing/power, and LEF gives physical abstracts. Add power intent, extraction data, package and IO requirements, and physical rule decks and layout views for sign-off.","d":"Inputs fall into logical, timing, physical and process views. Structural netlist gives connectivity and hierarchy. SDC defines clocks, IO and exceptions. Characterized Liberty views provide cell timing/power and variations for selected PVT corners. Technology LEF supplies layers, vias/sites and abstract rules. Cell and macro LEF define placement geometry, pins and obstructions. Detailed GDSII/OASIS views supply final polygons. RC tables/technology models support extraction, and DRC/LVS/antenna/fill decks support sign-off. UPF and power/ground connectivity define voltage domains. IO assignment, macro positions, bump map and package limits constrain floorplanning. Consistency of library names, units, corners and pin definitions is essential."}},{"id":"soc-u5-q8","subject":"soc","unit":5,"number":8,"q":"Explain different file in brief like Technology Library Files (.lib), LEF and DEF Files.","ans":{"s":"Liberty = timing/power/function. LEF = library/technology physical abstracts. DEF = actual design floorplan, placements, pins and routing.","m":"A .lib file describes cells functionally and electrically, including timing arcs/capacitance and power. LEF describes abstract objects and technology layers. DEF records the particular implemented design’s geometry and connectivity.","d":"Liberty (.lib) stores characterized timing arcs, pin directions and capacitances, functional descriptions, leakage/internal power and operating conditions. A timing engine uses its delay/slew/load models at relevant process, voltage and temperature corners. LEF (Library Exchange Format) is the abstract physical library: technology LEF defines layers, tracks/pitch-related rules, vias and sites, and cell/macro LEF gives outlines, pins and routing obstructions. DEF (Design Exchange Format) represents a specific chip/block instance database: die outline, rows, component placements/orientations, pins, nets, special nets and routes, depending on the current stage. Together LEF and DEF support P&R exchange. Detailed GDSII supplies actual mask geometry."}},{"id":"soc-u5-q9","subject":"soc","unit":5,"number":9,"q":"Explain in brief Power Planning: Power Mesh/Grid, VDD and VSS Routing","ans":{"s":"Pads/bumps → rings/upper straps → lower rails → cells. Use VDD and VSS grids with robust vias. Verify voltage drop and current density.","m":"Create block and domain supply grids from pad or bump entries. Use wide upper metal straps and lower standard-cell rails connected through via arrays. Check worst-case static/dynamic IR drop, electromigration, return paths and routing congestion.","d":"Identify voltage domains, pad/bump supply entries and current demand. Reserve upper metal for a low-resistance VDD/VSS mesh or straps and use rings where suitable. Connect macro power pins, then tie the grid through stacked via arrays to lower-layer standard-cell rails. Choose widths, pitches and via counts for IR drop and electromigration without leaving insufficient signal routing capacity. Connect both VDD and return VSS and keep independent domains separate where required. Use decaps or reinforce local grid where transient load demands it. Re-run static/dynamic IR and EM analysis using realistic or worst-case activity and package resistance, then fix hot spots using extra straps, vias, supply connections or placement changes."}},{"id":"soc-u5-q10","subject":"soc","unit":5,"number":10,"q":"Explain FPGA Prototyping of SoC before actual physical design.","ans":{"s":"FPGA prototype maps SoC logic to reconfigurable hardware for early boot/software/system tests. Substitute ASIC macros/clocking. ASIC PPA needs its own sign-off.","m":"Re-map RTL to FPGA resources, replacing memories, PLLs or hard macros with equivalent FPGA models. Compile the FPGA design, connect board peripherals and run firmware and workloads. Use it to check functional integration and bring-up before tapeout.","d":"Partition or adapt the RTL to fit FPGA LUTs, memories, DSPs and clocks. Substitute technology-specific RAM, PLL/clock
