-height cells and allow well taps and fillers. Provide macro halos and pin access. High utilization can make detailed routing difficult even when placement is legal.\nChannelled gate arrays: Cell sites and wiring channels are fixed. Placement has to respect route track capacity between rows, as the design cannot create extra channel area by spreading fixed sites.\nChannel-less gate arrays: Over-the-cell routing makes a sea-of-gates more flexible. Evaluate layer capacities and access to available base sites. Routing congestion can constrain logic utilization even if many base gates are empty.\nFull-custom and mixed-signal: Device orientation, matching, symmetry, thermal gradients and noise isolation may drive the layout. For example, place matched mirror devices close together, use appropriate symmetry and guard rings, and keep analog reference wiring away from switching digital nets.\nProgrammable logic: The die and resource locations are fixed. Place functions into compatible CLB, memory, DSP, I/O and clock regions. Honor carry chains and dedicated clock paths.\nCommon objective: Select constraints that reflect each implementation fabric. The appropriate metric combines timing, physical legality, power and routability with style-specific requirements."}},{"id":"asic-u2-q10","subject":"asic","unit":2,"number":10,"q":"Explain the different floor-planning and placement algorithms used in ASIC design. Discuss their objectives and importance in physical design.","ans":{"s":"Floorplan using slicing or nonslicing representations. Place cells using analytical, min-cut, force-directed or annealing methods.","m":"Floorplanning methods: A slicing tree represents recursive cuts. Sequence pairs and B*-trees cover nonslicing arrangements. Optimize area, aspect ratio, congestion and macro connectivity.\nPlacement methods: Min-cut recursively partitions cells. Analytical methods minimize smooth wirelength plus density. Force-directed and annealing methods explore positions differently.\nImportance: Floorplanning makes enough routing and power capacity available. Placement uses it efficiently, then legalizes cells and refines local timing and wirelength.","d":"Floorplanning objectives: Choose the core outline and pack major blocks subject to area, aspect ratio, routing capacity, power access and timing. Plan pins, corridors and fixed regions before placing most small cells.\nSlicing method: Represent macro leaves and horizontal or vertical cuts in a tree. A cut combines child dimensional bounds. This makes cost evaluation simple but limits the supported geometric arrangements.\nNonslicing methods: A sequence pair uses two block orderings to encode relative horizontal or vertical placement. A B*-tree encodes block neighborhood relationships for packing. Constraint graphs convert relative constraints into coordinates, and annealing can search alternative packings and orientations.\nPlacement objectives: Assign exact cell positions with short critical nets, manageable local density and legal orientations/sites. Minimize wirelength, congestion and timing cost within the floorplan.\nPlacement algorithms: Min-cut recursively maps connected groups into smaller physical regions. Analytical methods optimize continuous wirelength and density, then legalize cells. Force-directed placement balances attraction between connected modules against distributing forces. Annealing explores swaps/shifts and accepts some uphill moves early.\nImportance: Macro channel decisions determine whether capacity exists in the first place. Fine placement determines how intensely local tracks and cell pins are used. Trial routing and timing can drive changes in both stages."}},{"id":"asic-u2-q11","subject":"asic","unit":2,"number":11,"q":"Compare constructive and iterative improvement partitioning techniques.","ans":{"s":"Constructive methods build a partition from scratch. Iterative methods improve one through moves or swaps.","m":"Constructive: Grow groups from seeds or coarsened clusters by assigning unplaced vertices within capacity. This is efficient for finding a starting partition, though early choices can constrain cut quality.\nIterative improvement: Begin with a partition and reduce cut cost using feasible moves or swaps. Kernighan–Lin swaps pairs and Fiduccia–Mattheyses moves single vertices.\nCombined workflow: Construct a balanced solution quickly, then refine it at one or more resolutions.","d":"Starting point: Constructive partitioning starts from unassigned vertices, seeds or small graph clusters. Iterative improvement requires a complete candidate partition, which can come from a constructive method.\nConstructive workflow: Select a seed and add nearby vertices based on connectivity and available capacity. Greedy region growing and connectivity clustering are examples. Early choices are inexpensive, but can strand highly connected logic or create an unbalanced residual region. Apply capacity checks during assignments.\nIterative workflow: Evaluate the cut gain of moving a vertex or exchanging a pair, while maintaining or restoring balance. Kernighan–Lin uses pair swaps and Fiduccia–Mattheyses uses individual moves. Lock tentative changes during a pass and retain the best improving prefix where supported.\nTime and solution quality: Constructive heuristics usually create a feasible starting solution quickly. Improvement can reduce expensive crossings, but often costs more work and can stall near a local optimum. Temporary non-improving moves help the procedure investigate alternative arrangements.\nExample and combination: Group a strongly connected controller and registers during construction. During refinement, move a decode node from a crossing-heavy partition if this reduces the weighted cut and fits area. Multilevel partitioning uses coarsening, an initial solution and refinement together."}},{"id":"asic-u2-q12","subject":"asic","unit":2,"number":12,"q":"Explain the differences between floor planning and placement. Also discuss design-style-specific issues in floor planning and placement.","ans":{"s":"Floorplanning places major blocks and reserves resources. Placement fits small cells to that structure. The movable elements depend on the design style.","m":"Floorplanning versus placement: Floorplanning establishes outline, macro blocks, pins and power reservations. Placement optimizes precise row/site assignments for cells under those constraints.\nStandard cells and gate arrays: Standard cells need row legality, rails and macro channels. Fixed gate arrays constrain sites, and channelled parts constrain tracks.\nOther styles: Full-custom layouts may require matched, oriented devices and isolation. FPGA placement is limited by fixed CLB, DSP, RAM, pin and clock resources.","d":"Stage comparison: Floorplanning chooses the chip/core scale and the positions of macros, I/O regions, rows and power reservations. Placement uses this structure to assign small cells to specific legal locations and orientations.\nFloorplanning quality: Check aspect ratio, macro channels, pin access, domain boundaries and engineering-change space. Detect early long macro-to-macro paths and congested corridors.\nPlacement quality: Optimize wirelength, timing and density. Perform global placement, legalization and detailed refinement, allowing feedback from timing and routing to influence the floorplan when needed.\nStandard cells and arrays: Standard-cell placement obeys cell rows, compatible supply rails and macro keep-outs. In channelled gate arrays the base and routing channels are fixed. Channel-less arrays can route across base sites, but layer and pin capacity still limit placement.\nFull-custom and mixed signal: Matching, symmetry, shielding and device orientation can dictate positions. For example, a sensitive analog macro needs quiet supply access and a suitable keep-out from noisy switching.\nField-programmable designs: CLBs, I/O pins, clock regions, memories and DSP units occupy predetermined sites. The algorithm chooses legal capable sites and dedicated resources, within a physically fixed die."}},{"id":"asic-u2-q13","subject":"asic","unit":2,"number":13,"q":"What do you mean by Placement? List the algorithm used for the Placement. Explain any one in detail.","ans":{"s":"Placement assigns legal cell sites. Algorithms include analytical, recursive partitioning, annealing and force-directed methods.","m":"Definition: Place standard cells at coordinates and allowed orientations, keeping rows, blockages and density constraints in view. Typical methods include analytical, force-directed, min-cut and annealing.\nAnalytical placement: Minimize a smooth wirelength model plus a penalty for overfilled bins. Optionally emphasize timing-critical nets.\nFinalization: Legalize overlapped cells into valid row sites and refine by local moves or swaps. Check congestion and estimated timing before clock-tree synthesis.","d":"Definition: Placement assigns legal positions and orientations to netlist cells after the die, core, macro arrangement and technology sites have been defined. Inputs include cell dimensions, nets, timing constraints, rows, region boundaries and blockages.\nObjectives: Minimize estimated wirelength and congestion, improve timing and meet density goals. Preserve fixed objects, spacing and power-rail compatibility. One net estimate is HPWL = (xmax − xmin) + (ymax − ymin).\nAlgorithm families: Analytical or quadratic placement, electrostatic placement, recursive min-cut partitioning, force-directed placement and simulated annealing are representative examples. Modern flows commonly combine global optimization, legalization and local search.\nAnalytical global placement: Approximate wirelength as a continuous cost and divide available area into bins. Minimize wirelength plus a density penalty so short connections and spreading compete. Give critical nets higher weights when timing matters. Global cells may temporarily overlap.\nLegalization: Move standard cells to nonoverlapping legal row sites with compatible orientations and limited displacement. Honor fixed blockages and region constraints. Detailed placement then applies small shifts or swaps to improve the cost while preserving legality.\nValidation: Check timing estimates, local density, pin access and routability. For example, placing a driver closer to several sinks can shorten wires, but packing all cells too close may overfill the local routing channels."}}]},{"title":"Routing and Clocking","questions":[{"id":"asic-u3-q1","subject":"asic","unit":3,"number":1,"q":"Explain Static Timing Analysis (STA). Describe setup and hold checks, timing paths and the concept of slack. Discuss the steps involved in timing closure.","ans":{"s":"STA propagates path delay without test vectors. Setup checks latest arrival. Hold checks earliest arrival. Positive slack meets the constraint.","m":"Method: STA propagates earliest and latest path delays from a timing graph, constraints and parasitics. Check input, output and register path combinations.\nSetup: Slack is latest allowed time minus latest arrival. Hold slack is earliest arrival minus earliest allowed time. Negative slack violates the constraint.\nClosure: Audit clocks, I/O and exceptions. Fix setup by shortening critical delays, and hold by increasing minimum delay. Re-extract and verify both across signoff modes and corners.","d":"STA inputs: Build a timing graph from the mapped netlist. Use Liberty timing arcs, clock and I/O constraints, and routed or estimated parasitics. Propagate earliest and latest transitions without requiring functional test vectors.\nPath classes: Check input→register, register→register, register→output and input→output paths. Clearly identify the launch edge, capture edge, clock paths and any valid false or multicycle exceptions.\nSetup equation: For one synchronous period T, define S = capture clock arrival − launch clock arrival. Setup slack ≈ T + S − tsetup − Usetup − (tCQ,max + tdata,max). A positive value means data reaches before the latest requirement.\nHold equation: Hold slack ≈ tCQ,min + tdata,min − (thold + S + Uhold). A positive value means new data reaches after the earliest allowed time. Positive S helps setup and hurts hold under these assumptions.\nClosure process: Constrain clocks and I/O and audit unconstrained endpoints. Use worst negative slack and total negative slack to prioritize failing paths. Shorten critical data paths for setup using sizing, buffering or logic/placement changes. Add targeted minimum delay to repair hold.\nSignoff: Re-extract after engineering change orders and verify both checks across all modes and relevant process, voltage and temperature corners. Audit clock uncertainty and timing exceptions."}},{"id":"asic-u3-q2","subject":"asic","unit":3,"number":2,"q":"Define Clock Skew, Jitter, Setup Time, Hold Time and Clock-to-Q delay. Explain their causes and impact on circuit performance.","ans":{"s":"Skew is edge time difference across sinks. Jitter is variation over successive edges. Setup/hold straddle capture. tCQ is launch clock-to-output delay.","m":"Clock effects: Skew is the edge arrival difference across sinks. Jitter is an edge's temporal deviation due to clock noise or source variation. Positive capture-minus-launch skew helps setup and hurts hold in the usual one-cycle case.\nData stability: Setup is the required stable time before capture. Hold is the required stable time after capture.\nLaunch delay: Clock-to-Q is the launching register's response time. Use maximum tCQ for setup and minimum tCQ for hold analysis.","d":"Clock skew: The arrival-time difference of related clock edges at two sinks arises from differences in wire, buffer and loading delay or local variation. With skew defined as capture minus launch arrival, positive skew helps setup and hurts hold for a single-cycle register path.\nClock jitter: A clock edge departs from its nominal time due to oscillator or PLL phase noise, coupling and supply variation. Account for appropriate edge correlation when translating jitter into clock uncertainty. Uncertainty consumes setup or hold margin.\nSetup time: Data must be stable for a minimum interval before the capture edge. A violation can cause wrong capture or metastability. Setup limits maximum path delay and achievable frequency.\nHold time: Data must remain stable for a minimum interval after capture. A newly launched value can arrive too early on a very short path. Fix it by adding minimum data delay or revising clock paths as appropriate.\nClock-to-Q: The launch register changes output after its active clock edge by tCQ. Maximum tCQ contributes to the latest data arrival for setup, and minimum tCQ contributes to earliest arrival for hold.\nCharacterization: Check library timing over transition, load and operating conditions, then evaluate setup and hold with extracted clock routing."}},{"id":"asic-u3-q3","subject":"asic","unit":3,"number":3,"q":"Explain the different types of routing used in ASIC design. Describe the grid models used for routing.","ans":{"s":"Global routing allocates coarse corridors. Detailed routing assigns tracks and vias. Use uniform, nonuniform or gridless geometry on routing layers.","m":"Global and detailed: Global routing assigns coarse corridors and estimates track/via demand. Detailed routing creates exact tracks, pin connections and rule-compliant vias.\nOther classifications: Clock and power use special constraints. Channels mainly expose two boundaries, while switchboxes can expose four. Upper metal may allow over-the-cell routing.\nGrid models: A uniform grid has regular pitch. Nonuniform lines may align to pins or obstacles. A 3-D model adds layer and via edges.","d":"Global routing: Divide the layout into coarse global cells and represent the connections between cells as graph edges. Capacity captures available tracks or vias after blockages. Assign route corridors, approximate layer changes and estimate congestion without committing exact shapes.\nDetailed routing: Select exact pin access, tracks, wire segments and vias. Respect width, spacing, via enclosure and preferred direction. Search or rip up and reroute conflicts. The output contains actual connected geometry.\nRouting classes: Signal routing connects logic nets. Clock networks may use dedicated layers, width/spacing and matched delays. Power and ground use rings, straps, via arrays and rails designed for current and resistance.\nRouting regions: Channel routing commonly places pins along opposite channel boundaries. Switchboxes can have terminals on four sides. Over-the-cell routing uses metal tracks above devices where permitted.\nGrid models: A uniform grid uses equal pitch, while a nonuniform grid can align routing lines with pins or blockages. A layered grid adds legal via edges between layers. Gridless approaches reason over geometric positions and process rules without using one regular grid.\nExample: Global routing guides a net around a macro and allocates capacity. Detailed routing chooses precise tracks and two via transitions and checks neighboring spacing."}},{"id":"asic-u3-q4","subject":"asic","unit":3,"number":4,"q":"Explain Lee's maze routing algorithm (wave propagation and back-trace). State its advantages and limitations.","ans":{"s":"Lee = BFS wavefront from source. Backtrace from target through decreasing distances. Finds a shortest equal-cost grid route.","m":"Wave: Start at source distance 0 and use a FIFO breadth-first queue. Label each new legal neighbor with its parent's distance plus one.\nBack-trace: Stop on reaching the target, then walk through decreasing distances or stored parents to the source. An empty queue means no route.\nTrade-off: Lee finds a shortest equal-cost route and is complete on its grid. It can need substantial memory or runtime, especially when many nets need rerouting.","d":"Initialization: Model horizontal and vertical steps on a regular routing grid. Mark obstacles and keep-outs as blocked, label the source S with distance 0, and put it in a FIFO queue.\nWave propagation: Remove each queued cell and visit its legal unmarked neighbors. Assign each the current distance plus 1, save its parent and enqueue it. The distance layers are the breadth-first wavefront.\nTermination: Stop when the target is visited or the queue empties. The first target label is the minimum number of unit moves. If the wave cannot reach the target, no legal route exists for the model.\nBack-trace: Starting at a target label k, follow the parent links or choose adjacent cells with labels k−1, k−2 and so on until reaching S. Reverse that sequence to obtain the route. The shown example needs seven moves and may have alternative shortest routes.\nAdvantages: Complete and shortest for equal-cost grid moves. It handles irregular blockages and is easy to explain or implement.\nLimitations: Work and memory scale with the explored grid, which can be large on realistic chips. Unequal via or segment costs call for weighted routing such as Dijkstra. Earlier nets can block later nets, requiring rip-up and reroute.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Lee router example showing wave distances and shortest backtrace\" viewBox=\"0 0 720 200\">\u003crect width=\"720\" height=\"200\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cpath d=\"M233 20h200v160H233z M273 20v160 M313 20v160 M353 20v160 M393 20v160 M233 60h200 M233 100h200 M233 140h200\" stroke=\"#697f9f\" fill=\"none\"/>\n\u003cpath d=\"M253 40H333V80H413V160\" stroke=\"#78e4cf\" fill=\"none\" stroke-width=\"3\"/>\u003cpath d=\"M273 60h40v40h-40z M273 100h40v40h-40z M353 100h40v40h-40z\" fill=\"#563344\"/>\n\u003cg text-anchor=\"middle\" fill=\"#e2ebff\">\n\u003ctext x=\"253\" y=\"45\">S\u003c/text>\u003ctext x=\"293\" y=\"45\">1\u003c/text>\u003ctext x=\"333\" y=\"45\">2\u003c/text>\u003ctext x=\"373\" y=\"45\">3\u003c/text>\u003ctext x=\"413\" y=\"45\">4\u003c/text>\n\u003ctext x=\"253\" y=\"85\">1\u003c/text>\u003ctext x=\"293\" y=\"85\">×\u003c/text>\u003ctext x=\"333\" y=\"85\">3\u003c/text>\u003ctext x=\"373\" y=\"85\">4\u003c/text>\u003ctext x=\"413\" y=\"85\">5\u003c/text>\n\u003ctext x=\"253\" y=\"125\">2\u003c/text>\u003ctext x=\"293\" y=\"125\">×\u003c/text>\u003ctext x=\"333\" y=\"125\">4\u003c/text>\u003ctext x=\"373\" y=\"125\">×\u003c/text>\u003ctext x=\"413\" y=\"125\">6\u003c/text>\n\u003ctext x=\"253\" y=\"165\">3\u003c/text>\u003ctext x=\"293\" y=\"165\">4\u003c/text>\u003ctext x=\"333\" y=\"165\">5\u003c/text>\u003ctext x=\"373\" y=\"165\">6\u003c/text>\u003ctext x=\"413\" y=\"165\">T\u003c/text>\u003c/g>\n\u003ctext x=\"26\" y=\"51\">S = source at distance 0\u003c/text>\u003ctext x=\"26\" y=\"74\">T = target at distance 7\u003c/text>\u003ctext x=\"26\" y=\"97\">× = blocked cell\u003c/text>\u003ctext x=\"462\" y=\"51\">Trace 7 → 6 → … → 0.\u003c/text>\u003ctext x=\"462\" y=\"74\">Multiple shortest paths can exist.\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u3-q5","subject":"asic","unit":3,"number":5,"q":"Explain Clock Design and Clock Routing in ASIC design, with the importance of clock distribution.","ans":{"s":"Select topology and clock targets, build buffered paths, route using controlled layers, then verify skew, latency, slew and timing.","m":"Clock design: Specify clock relationships, sink groups, skew, latency, transition, pulse-width and load limits.\nCTS and routing: Cluster sinks, select a suitable topology and insert buffers. Route critical trunks on suitable layers with spacing or shielding where warranted, and provide reliable via connections.\nValidation: Extract clock RC and verify skew, insertion delay, slew and path timing across corners. Balance lower skew and sharper edges against added capacitance and clock power.","d":"Purpose: Distribute clock edges from a root like a PLL or input port to geographically dispersed registers, gated branches and macros. Uneven clock arrival modifies both setup and hold margins. Large capacitive loads can degrade clock slew and power.\nClock definition: Specify period, waveform, generated clocks, sink groups and uncertainty. Set limits for skew, insertion delay, pulse width, fanout, slew and capacitance. Include clock gates, test clocks and macro timing budgets.\nClock tree synthesis: Cluster sinks by location and load. Choose H-tree, buffered tree, spine, mesh or a hybrid based on topology and performance. Insert and size buffers to distribute load and shape propagation delay.\nClock routing: Choose low-resistance suitable metal layers for trunks and short connections at leaves. Use wider tracks, increased spacing or shielding where needed. Provide adequate vias and avoid route restrictions and coupling hotspots.\nPost-route analysis: Extract parasitics and verify skew, latency, duty cycle and pulse width along with setup/hold under all relevant corners. Verify clock gate checks and transitions.\nTrade-off: Matching paths can lower skew but add wiring, capacitance and insertion delay. Additional buffering improves slew but raises clock power. Optimize for the actual endpoint timing and clock budgets."}},{"id":"asic-u3-q6","subject":"asic","unit":3,"number":6,"q":"Explain H-tree, balanced tree, clock mesh/grid and spine clock distribution topologies with proper diagrams.","ans":{"s":"H-tree uses symmetric equal lengths. Balanced buffered tree adapts to sink/load distribution. Mesh averages via multiple paths. Spine feeds branches from a trunk.","m":"H-tree and balanced tree: An H-tree uses symmetric equal-length paths. A balanced tree tunes buffer and wire delays to actual sink positions and loads.\nMesh: Multiple routes through interconnected tracks reduce local skew variation, at the cost of wiring, capacitance and power.\nSpine: A main trunk supplies local taps along an elongated region. Control loading and trunk delay to prevent an arrival gradient.\nChoice: Use the structure best suited to geometry and the skew/power budget.","d":"Shared objective: All four structures carry a high-fanout clock to distributed sinks. Compare skew, load balancing, silicon resources, wiring capacitance and tolerance of physical variation. In the diagrams, a dot indicates a clock source or branching point.\nH-tree: From the central root, branch symmetrically into equal-length paths, then repeat the H pattern for more sinks. Equal geometric lengths simplify nominal balance for a regular arrangement. Mismatched loads and obstacles can still introduce skew.\nBalanced buffered tree: Group actual sinks and choose branches and buffer stages to match propagation delays. Different path lengths can be made close in delay using buffering, sizing and routing. It adapts well to irregular layouts.\nMesh or grid: Drive an interconnected grid through multiple matched drivers. Nearby grid taps supply sinks and multiple current paths reduce sensitivity to local variation. Grid metal and frequently switched capacitance increase area and power.\nSpine: Drive a straight backbone and attach local branches along it. This is useful for elongated floorplans and can simplify routing. Delay can accumulate along the spine, so distributed loading, repeaters and branch timing matter.\nChoice: Select a symmetric tree for regular sinks, a tuned tree for irregular distribution, a mesh when low variation justifies power, or a spine for a long localized region.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"H-tree, balanced buffered tree, clock mesh and spine\" viewBox=\"0 0 760 180\">\u003crect width=\"760\" height=\"180\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cg fill=\"#1b2234\" stroke=\"#5b7195\">\u003crect x=\"16\" y=\"17\" width=\"169\" height=\"147\" rx=\"6\"/>\u003crect x=\"201\" y=\"17\" width=\"169\" height=\"147\" rx=\"6\"/>\u003crect x=\"386\" y=\"17\" width=\"169\" height=\"147\" rx=\"6\"/>\u003crect x=\"571\" y=\"17\" width=\"169\" height=\"147\" rx=\"6\"/>\u003c/g>\n\u003cg text-anchor=\"middle\">\u003ctext x=\"100\" y=\"145\">H-tree\u003c/text>\u003ctext x=\"285\" y=\"145\">Balanced tree\u003c/text>\u003ctext x=\"470\" y=\"145\">Mesh / grid\u003c/text>\u003ctext x=\"655\" y=\"145\">Spine\u003c/text>\u003c/g>\n\u003cg fill=\"none\" stroke=\"#83ead4\" stroke-width=\"2\">\u003cpath d=\"M49 56v59M151 56v59M49 86h102\"/>\u003cpath d=\"M285 44v14m-34 0h68m-68 0v24m68-24v24m-50 0h-36m66 0h40m-106 0v29m36-29v29m30-29v29m40-29v29\"/>\u003cpath d=\"M425 54h90m-90 28h90m-90 28h90m-80-65v74m35-74v74m35-74v74\"/>\u003cpath d=\"M598 83h114m-95 0V49m20 34v32m22-32V49m20 34v32m19-32V49\"/>\u003c/g>\u003cg fill=\"#f4d894\">\u003ccircle cx=\"100\" cy=\"86\" r=\"4\"/>\u003ccircle cx=\"49\" cy=\"56\" r=\"3\"/>\u003ccircle cx=\"151\" cy=\"56\" r=\"3\"/>\u003ccircle cx=\"49\" cy=\"115\" r=\"3\"/>\u003ccircle cx=\"151\" cy=\"115\" r=\"3\"/>\u003ccircle cx=\"285\" cy=\"44\" r=\"4\"/>\u003ccircle cx=\"251\" cy=\"58\" r=\"3\"/>\u003ccircle cx=\"319\" cy=\"58\" r=\"3\"/>\u003ccircle cx=\"470\" cy=\"82\" r=\"4\"/>\u003ccircle cx=\"598\" cy=\"83\" r=\"4\"/>\u003c/g>\u003c/g>\u003c/svg>"}},{"id":"asic-u3-q7","subject":"asic","unit":3,"number":7,"q":"Explain Power and Ground Routing in ASIC design.","ans":{"s":"Pads/bumps → upper metal rings and straps/mesh → vias → local rails. Check IR drop, EM and connectivity.","m":"Path: Distribute VDD and VSS from bumps or pads through upper-metal rings and straps. Use mesh connections and multi-cut via stacks to reach local rails and macro power pins.\nDesign: Budget current and voltage drop by domain. Choose layers, width, pitch and via counts. Keep always-on and switched supplies separate.\nCheck: Verify connectivity, static and dynamic IR drop and electromigration. Add feeds, straps or vias where needed and recheck physical rules.","d":"Objective: Deliver the supply voltage and a low-impedance return to standard cells and macros while controlling static voltage drop, transient droop and current density. Allocate acceptable limits per power domain based on functionality and timing.\nPower feeds: Plan package bumps or pads and reserve top-level VDD/VSS rings or trunks. Use thick, wide upper metal when appropriate to lower resistance. Choose sufficiently distributed feed points to avoid excessive path resistance.\nDistribution: Add orthogonal straps to form a mesh and connect upper and lower metal using via arrays. Tie standard-cell row rails and macro power pins to the appropriate grid. Preserve always-on, switched and multiple-voltage domain connections. Use switches and decoupling where the design specifies them.\nSizing: Estimate average and peak current for each region. Resistance scales with length and inversely with metal cross-section. Drop scales with current and resistance. Adjust stripe width, pitch, metal layer and via counts to limit drop and electromigration.\nVerification: Check supply/ground opens, shorts and domain connectivity, then run static and dynamic IR analysis and electromigration checks using realistic loads and package supply models where available.\nIteration: Add straps, alternate feeds, vias or decoupling to address hotspots, then recheck routing space and DRC."}},{"id":"asic-u3-q8","subject":"asic","unit":3,"number":8,"q":"Explain layout compaction and its types in detail with necessary diagrams.","ans":{"s":"Compaction closes unused spacing while preserving connectivity and design rules. 1-D moves on one axis. 2-D couples or alternates x/y moves.","m":"Purpose: Reduce layout area while maintaining geometry rules and connectivity.\nOne dimension: Fix one coordinate direction and move along the other. Build a graph where edge i→j of weight d enforces xⱼ ≥ xᵢ+d. Longest-path distances give earliest feasible positions in a DAG.\nTwo dimensions: Compact both axes using alternating passes or simultaneous optimization. Coupled separation choices make it harder. Verify enclosures, spacing, fixed pins and connectivity afterward.","d":"Definition: Layout compaction reduces unused spacing and the total width, height or area of existing layout geometry. It preserves required widths, enclosure, contacts, connectivity and the layout topology selected by the designer.\nOne-dimensional compaction: Hold y fixed and move shapes or edges in x, or hold x fixed and move in y. Build minimum-width and spacing inequalities for geometries that can interact along that direction. The shown before/after sketch illustrates moving features closer without shrinking their required separation.\nConstraint graph: A directed edge i→j with weight d represents xⱼ ≥ xᵢ + d. With A at 0, A→B of 4 and B→C of 3 force earliest B=4 and C=7. In an acyclic ordering graph, longest distances from the source produce the earliest feasible coordinates for all nodes.\nTwo-dimensional compaction: Optimize area by moving along both axes. An implementation may alternate x/y one-dimensional passes or solve a larger coupled problem. Two objects can sometimes be separated along either axis, so simultaneous optimization needs more complex decisions.\nValidation: Preserve fixed pins or reference points, check DRC and verify connectivity. Tighter placement can reduce area while increasing coupling or pin-access constraints.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Horizontal layout compaction preserves spacing and feature width\" viewBox=\"0 0 740 165\">\u003crect width=\"740\" height=\"165\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cg fill=\"#293a54\" stroke=\"#93b5ed\">\u003crect x=\"50\" y=\"60\" width=\"70\" height=\"40\"/>\u003crect x=\"168\" y=\"60\" width=\"57\" height=\"40\"/>\u003crect x=\"275\" y=\"60\" width=\"72\" height=\"40\"/>\u003crect x=\"464\" y=\"60\" width=\"70\" height=\"40\"/>\u003crect x=\"543\" y=\"60\" width=\"57\" height=\"40\"/>\u003crect x=\"609\" y=\"60\" width=\"72\" height=\"40\"/>\u003c/g>\n\u003cg text-anchor=\"middle\">\u003ctext x=\"200\" y=\"43\">Before x compaction\u003c/text>\u003ctext x=\"574\" y=\"43\">After x compaction\u003c/text>\u003ctext x=\"85\" y=\"85\">A\u003c/text>\u003ctext x=\"196\" y=\"85\">B\u003c/text>\u003ctext x=\"311\" y=\"85\">C\u003c/text>\u003ctext x=\"498\" y=\"85\">A\u003c/text>\u003ctext x=\"571\" y=\"85\">B\u003c/text>\u003ctext x=\"645\" y=\"85\">C\u003c/text>\u003c/g>\n\u003cpath d=\"M371 80h62m-8-5 8 5-8 5m109 23v11m9-11v11m-9-4h9m57-7v11m9-11v11m-9-4h9\" stroke=\"#83ead4\" fill=\"none\" stroke-width=\"2\"/>\n\u003ctext x=\"464\" y=\"144\">Gaps retain the required minimum spacing.\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u3-q9","subject":"asic","unit":3,"number":9,"q":"Write short notes on: (i) 1-D and 2-D compaction (ii) Constraint graph method in layout compaction iii. Constraint graph method in layout compaction","ans":{"s":"Graph edges enforce xⱼ−xᵢ≥dᵢⱼ. Longest-path coordinates compact one axis. Apply both axes for iterative 2-D compaction.","m":"1-D and 2-D: One-dimensional compaction moves along one axis with the other fixed. Two-dimensional compaction reduces area by moving on both axes using alternating passes or a coupled solution.\nConstraint graph: Add a weighted edge i→j for xⱼ ≥ xᵢ+d, representing width, spacing or enclosure. Anchor a source and use longest paths on the ordering DAG.\nChecks: Preserve connectivity, fixed positions and design-rule legality after compaction.","d":"One-dimensional note: Compact only x or y while retaining the perpendicular coordinates. Encode minimum width, spacing and enclosure for affected shapes. It is relatively simple and preserves the chosen ordering, but can leave avoidable area in the orthogonal direction.\nTwo-dimensional note: Move shapes in both directions to reduce area. Repeated horizontal and vertical compaction is a practical approximation. Simultaneous methods must decide whether interacting shapes should clear horizontally or vertically, which introduces coupled constraints.\nConstraint graph note: Use nodes for chosen edges or rigid-object coordinates. An edge i→j of weight d encodes a lower bound xⱼ ≥ xᵢ+d. A fixed source anchors the geometry. If a feature width is 4 and the next legal separation is 3, an anchored chain of edge weights 4 and 3 forces the later coordinate to be at least 7.\nSolution: With an acyclic ordering graph, propagate longest source-to-node distances to obtain the smallest feasible coordinates. When cycles are allowed, a positive-weight cycle implies infeasible lower bounds. Fixed features and geometric equalities need explicit treatment.\nCheck: Confirm ground rules and preserved connectivity on the compacted result. Both repeated constraint-graph entries in the question refer to this same method.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Horizontal layout compaction preserves spacing and feature width\" viewBox=\"0 0 740 165\">\u003crect width=\"740\" height=\"165\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cg fill=\"#293a54\" stroke=\"#93b5ed\">\u003crect x=\"50\" y=\"60\" width=\"70\" height=\"40\"/>\u003crect x=\"168\" y=\"60\" width=\"57\" height=\"40\"/>\u003crect x=\"275\" y=\"60\" width=\"72\" height=\"40\"/>\u003crect x=\"464\" y=\"60\" width=\"70\" height=\"40\"/>\u003crect x=\"543\" y=\"60\" width=\"57\" height=\"40\"/>\u003crect x=\"609\" y=\"60\" width=\"72\" height=\"40\"/>\u003c/g>\n\u003cg text-anchor=\"middle\">\u003ctext x=\"200\" y=\"43\">Before x compaction\u003c/text>\u003ctext x=\"574\" y=\"43\">After x compaction\u003c/text>\u003ctext x=\"85\" y=\"85\">A\u003c/text>\u003ctext x=\"196\" y=\"85\">B\u003c/text>\u003ctext x=\"311\" y=\"85\">C\u003c/text>\u003ctext x=\"498\" y=\"85\">A\u003c/text>\u003ctext x=\"571\" y=\"85\">B\u003c/text>\u003ctext x=\"645\" y=\"85\">C\u003c/text>\u003c/g>\n\u003cpath d=\"M371 80h62m-8-5 8 5-8 5m109 23v11m9-11v11m-9-4h9m57-7v11m9-11v11m-9-4h9\" stroke=\"#83ead4\" fill=\"none\" stroke-width=\"2\"/>\n\u003ctext x=\"464\" y=\"144\">Gaps retain the required minimum spacing.\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u3-q10","subject":"asic","unit":3,"number":10,"q":"Explain Interconnect Modeling in detail.","ans":{"s":"Short wires may use lumped C/RC. Long on-chip wires require distributed RC and coupling. Use RLC/transmission lines when inductance or flight time matters.","m":"Parameters: Extract wire/via R and ground/coupling C using geometry and process data. Wire resistance scales with L/w for fixed sheet resistance.\nModels: Use lumped C or RC on short wires and distributed RC or π sections on longer routes. Elmore delay sums upstream resistance times downstream capacitance.\nEffects: Coupling changes delay and can induce noise. Long, fast nets can need RLC or transmission-line analysis. Send extracted parasitics to timing, commonly in SPEF.","d":"Physical origin: Wire resistance is approximately ρL/(wt), or R□(L/w), with added via resistance at transitions. Capacitance includes coupling to adjacent wires and capacitance to reference layers or substrate. Extraction uses layer geometry, spacing and an approved process model.\nLumped approximations: A short wire with negligible resistance may be treated as a single load C. A lumped RC model adds total R. A π model splits capacitance over both ends of the resistive path and improves waveform delay estimates.\nDistributed RC: Long routes store and dissipate energy along their length, so use cascaded RC sections or an extracted network. For an RC tree, the Elmore moment at a sink sums RₑCdownstream,ₑ along its source path. A uniform line with no terminal load contributes approximately RwireCwire/2, proportional to L² under fixed cross-section and spacing.\nCoupling and inductance: A neighboring transition can speed or slow a switching net or induce a noise pulse. For long, fast and low-resistance nets, inductance and transmission-line flight time may require RLC or transmission-line models.\nDesign use: Export extracted R and C in formats such as SPEF for static timing and signal-integrity analysis. Evaluate layer choice, spacing, shielding, routing length or repeaters using estimated delays and power."}},{"id":"asic-u3-q11","subject":"asic","unit":3,"number":11,"q":"Explain layout compaction and its type in detail with necessary diagram","ans":{"s":"Compaction closes unused spacing while preserving connectivity and design rules. 1-D moves on one axis. 2-D couples or alternates x/y moves.","m":"Purpose: Reduce layout area while maintaining geometry rules and connectivity.\nOne dimension: Fix one coordinate direction and move along the other. Build a graph where edge i→j of weight d enforces xⱼ ≥ xᵢ+d. Longest-path distances give earliest feasible positions in a DAG.\nTwo dimensions: Compact both axes using alternating passes or simultaneous optimization. Coupled separation choices make it harder. Verify enclosures, spacing, fixed pins and connectivity afterward.","d":"Definition: Layout compaction reduces unused spacing and the total width, height or area of existing layout geometry. It preserves required widths, enclosure, contacts, connectivity and the layout topology selected by the designer.\nOne-dimensional compaction: Hold y fixed and move shapes or edges in x, or hold x fixed and move in y. Build minimum-width and spacing inequalities for geometries that can interact along that direction. The shown before/after sketch illustrates moving features closer without shrinking their required separation.\nConstraint graph: A directed edge i→j with weight d represents xⱼ ≥ xᵢ + d. With A at 0, A→B of 4 and B→C of 3 force earliest B=4 and C=7. In an acyclic ordering graph, longest distances from the source produce the earliest feasible coordinates for all nodes.\nTwo-dimensional compaction: Optimize area by moving along both axes. An implementation may alternate x/y one-dimensional passes or solve a larger coupled problem. Two objects can sometimes be separated along either axis, so simultaneous optimization needs more complex decisions.\nValidation: Preserve fixed pins or reference points, check DRC and verify connectivity. Tighter placement can reduce area while increasing coupling or pin-access constraints.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Horizontal layout compaction preserves spacing and feature width\" viewBox=\"0 0 740 165\">\u003crect width=\"740\" height=\"165\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cg fill=\"#293a54\" stroke=\"#93b5ed\">\u003crect x=\"50\" y=\"60\" width=\"70\" height=\"40\"/>\u003crect x=\"168\" y=\"60\" width=\"57\" height=\"40\"/>\u003crect x=\"275\" y=\"60\" width=\"72\" height=\"40\"/>\u003crect x=\"464\" y=\"60\" width=\"70\" height=\"40\"/>\u003crect x=\"543\" y=\"60\" width=\"57\" height=\"40\"/>\u003crect x=\"609\" y=\"60\" width=\"72\" height=\"40\"/>\u003c/g>\n\u003cg text-anchor=\"middle\">\u003ctext x=\"200\" y=\"43\">Before x compaction\u003c/text>\u003ctext x=\"574\" y=\"43\">After x compaction\u003c/text>\u003ctext x=\"85\" y=\"85\">A\u003c/text>\u003ctext x=\"196\" y=\"85\">B\u003c/text>\u003ctext x=\"311\" y=\"85\">C\u003c/text>\u003ctext x=\"498\" y=\"85\">A\u003c/text>\u003ctext x=\"571\" y=\"85\">B\u003c/text>\u003ctext x=\"645\" y=\"85\">C\u003c/text>\u003c/g>\n\u003cpath d=\"M371 80h62m-8-5 8 5-8 5m109 23v11m9-11v11m-9-4h9m57-7v11m9-11v11m-9-4h9\" stroke=\"#83ead4\" fill=\"none\" stroke-width=\"2\"/>\n\u003ctext x=\"464\" y=\"144\">Gaps retain the required minimum spacing.\u003c/text>\u003c/g>\u003c/svg>"}}]},{"title":"Low Power Design Techniques","questions":[{"id":"asic-u4-q1","subject":"asic","unit":4,"number":1,"q":"Explain Clock Gating as a technique for dynamic power reduction.","ans":{"s":"Clock gating lowers clock switching activity. An ICG holds enable stable through the active clock phase.","m":"Mechanism: An integrated gate suppresses clock transitions in an idle register bank, saving clock-tree and clock-pin power.\nGlitch prevention: A low-phase latch captures the enable, then holds it stable through the high phase while an AND gate passes full pulses.\nImplementation: Use the library gating cell with the required test override. Verify timing and pulse width. Target coherent idle groups so the power saved exceeds the gate’s overhead.","d":"Why gating saves power: The clock network switches every active cycle even when a bank keeps the same state. Since switching power is proportional to activity, suppressing clock edges cuts energy in the downstream clock wiring and register clock pins. Logic driven by the bank may also settle.\nCircuit operation: For a positive-edge clock, pass the functional enable through a low-level transparent latch and AND its output with the parent clock. While the parent clock is low, the latch can update. While the parent clock is high, the latch holds the enable and prevents glitches or shortened pulses.\nRTL and test: Infer or instantiate a library integrated clock-gating cell. Combine a test override into the enable as required by the cell so scan shift and capture can reach the registers. A data-path enable alone can stop state changes while the clock network still switches.\nDesign checks: Place the gate upstream of a useful cluster and check that savings exceed gating overhead. During CTS and STA, check gating setup/hold, pulse width and clock timing. Verify that freezing the bank during idle preserves its expected state.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Glitch-free clock gating using a low-level transparent latch and an AND gate\" viewBox=\"0 0 760 167\">\u003crect width=\"760\" height=\"167\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cpath d=\"M52 52h191 M52 123h509m-389 0v-33h71m151-38h129v28h38m99 19h70\" fill=\"none\" stroke=\"#86a7dc\" stroke-width=\"2\"/>\n\u003crect x=\"243\" y=\"30\" width=\"151\" height=\"81\" rx=\"6\" fill=\"#26334a\" stroke=\"#7a93bd\"/>\u003crect x=\"561\" y=\"68\" width=\"99\" height=\"62\" rx=\"6\" fill=\"#26334a\" stroke=\"#7a93bd\"/>\n\u003ctext x=\"68\" y=\"45\">en | test_en\u003c/text>\u003ctext x=\"80\" y=\"142\">clk\u003c/text>\u003ctext x=\"318\" y=\"57\" text-anchor=\"middle\">Latch enable\u003c/text>\u003ctext x=\"318\" y=\"78\" text-anchor=\"middle\">while clk = 0\u003c/text>\u003ctext x=\"610\" y=\"103\" text-anchor=\"middle\">AND\u003c/text>\u003ctext x=\"672\" y=\"89\">gclk\u003c/text>\u003ccircle cx=\"172\" cy=\"123\" r=\"4\" fill=\"#8be3d2\"/>\u003c/g>\u003c/svg>"}},{"id":"asic-u4-q2","subject":"asic","unit":4,"number":2,"q":"Explain supply voltage reduction as a power-reduction technique. Discuss its effect on delay and the limits to voltage scaling.","ans":{"s":"Psw∝VDD². Lower voltage saves switching energy but reduces drive and increases delay. Check timing and minimum functional voltage.","m":"Switching power: It scales approximately with VDD² at fixed activity, capacitance and frequency. Reducing 1.0 V to 0.8 V saves 36% of that component.\nTiming: Lower overdrive cuts drive current and raises propagation delay, so the circuit may need a lower frequency.\nLower limit: Use characterized voltage–frequency points. Check worst-case timing and droop, functional margins, SRAM operation, and the energy impact of longer execution.","d":"Voltage dependence: At fixed switching activity, effective capacitance and frequency, Psw = αCLVDD²f. Lowering VDD from 1.0 V to 0.8 V gives 0.8² = 0.64 of the original switching power, a 36% reduction. The energy per charging event falls by the same ratio.\nDelay dependence: A useful first estimate is tp ≈ CLVDD/Idrive. Lower voltage reduces required output swing, but it also reduces transistor overdrive and available current. Near threshold the current reduction dominates, so delay grows rapidly and the maximum safe clock frequency decreases.\nPractical limit: Characterize worst-case timing across process, voltage and temperature, including droop. Check noise margins, variation, SRAM reads and writes, and retention where required. The limiting block may be a memory or another hard macro.\nOperating point: Lower the clock to a characterized value before reducing voltage. If unchanged throughput is required, consider parallelism or pipelining and include their area and switching costs. Evaluate energy per task, since longer execution can increase the energy spent on leakage and other fixed loads."}},{"id":"asic-u4-q3","subject":"asic","unit":4,"number":3,"q":"Explain gate-level and architecture-level techniques for low-power VLSI design with suitable examples.","ans":{"s":"Gate level: size, multi-VT, suppress glitches and gate idle clocks. Architecture: gate power, scale V/f, change datapath/memory activity.","m":"Activity control: Gate idle clocks, isolate operands to unused units, and reduce glitches on reconverging logic paths.\nCell choice: Right-size cells to reduce capacitance and use high-VT variants where slack allows.\nArchitecture: Use domain gating for independently idle blocks, DVFS for changing workloads and local memories to reduce data movement.\nExample: A DSP can suppress multiplier input changes between valid samples and switch off the accelerator between sufficiently long batches.","d":"Gate-level activity: Clock gating stops unnecessary edges in idle register banks. Operand isolation prevents unused inputs from toggling a multiplier or ALU. Balanced logic paths can reduce hazards that would otherwise charge and discharge nodes without contributing to the final result.\nGate-level capacitance: Use smaller cells where timing permits and avoid excessive buffering or long high-fanout wires. A large cell can speed a critical path while increasing the load on its predecessor. Check both stages in STA.\nGate-level leakage: Assign high-threshold cells to paths with slack and reserve low-threshold cells for paths that need their drive strength. Compare leakage and timing across corners after assignment.\nArchitecture-level power: Partition independently idle functions into clock or power domains. A switched domain needs isolation and may need retention. Use DVFS for workload-dependent performance and raise voltage before increasing frequency.\nArchitecture-level energy per task: Keep data local to avoid expensive memory transfers, eliminate unnecessary operations, and use appropriate word widths. Parallel lanes can preserve throughput at a lower frequency and voltage when their extra capacitance and leakage are justified.\nExample: A DSP can latch operands only for valid samples, buffer samples in nearby SRAM and power down the accelerator between long batches."}},{"id":"asic-u4-q4","subject":"asic","unit":4,"number":4,"q":"Explain static and dynamic power dissipation with their sources in a CMOS circuit, with mathematical equations.","ans":{"s":"Ptotal≈αCLVDD²f + Pshort-circuit + VDDIleak. Switching and short circuit are dynamic; leakage is static.","m":"Switching: Psw = αCLVDD²f with α defined as 0-to-1 transitions per cycle. A complete charge–discharge cycle dissipates CLVDD².\nOverlap: Both devices may conduct during an input transition. Average short-circuit power equals VDD times the average overlap current.\nLeakage: Static CMOS can draw steady current through subthreshold, gate and junction paths. Pstatic ≈ VDDIleak.\nExample: A 10 pF node at 1 V, 100 MHz and α = 0.1 dissipates 100 µW from capacitive switching.","d":"Total power: In a CMOS block, average dissipation is the sum of capacitive switching, short-circuit current during transitions and leakage during steady operation. Each term responds to different controls.\nCapacitive switching: A 0-to-1 transition of CL from an ideal VDD supply draws CLVDD² from the supply. Half is initially stored on the capacitor and half is dissipated during charging. The stored half is dissipated during discharge. Thus Psw = αCLVDD²f when α counts 0-to-1 events per clock cycle. Sum this term over switching nodes, including clock loads and glitches.\nShort-circuit power: As the input passes through the transition region, PMOS and NMOS can conduct together, creating a brief path from VDD to ground. Psc = VDD × average Isc. Input slew, output load and device sizing affect the overlap current.\nStatic power: Even with a stable input and no charging events, subthreshold conduction, gate-oxide tunneling and reverse-biased junction leakage can draw current. Pstatic ≈ VDDIleak, where Ileak is the aggregate supply leakage for the operating state.\nExample: With CL = 10 pF, VDD = 1 V, f = 100 MHz and α = 0.1, Psw = 100 µW. Add the short-circuit and leakage terms separately."}},{"id":"asic-u4-q5","subject":"asic","unit":4,"number":5,"q":"Explain the need for low power design in detail, with the techniques used.","ans":{"s":"Low power extends battery life, reduces heat/droop and improves reliability. Reduce activity, capacitance, voltage, frequency and leakage.","m":"Motivation: Power affects battery life, die temperature, supply droop, package current, cooling cost and reliability.\nActive operation: Reduce activity with gating, reduce capacitance with sizing and data locality, and use DVFS to match compute demand.\nIdle operation: Use high-VT cells and power gating with retention as needed.\nEvaluation: Compare energy per task and examine leakage, peak current, wake-up delay and temperature under representative workloads.","d":"Battery and supply constraints: Lower energy per task extends runtime in portable systems. Peak and average current must also stay within the supply, package and board limits. A high transient demand can cause voltage droop and timing failures.\nThermal and reliability constraints: Power becomes heat. Higher temperature can raise leakage and aggravate reliability limits such as electromigration. Cooling and packaging may dominate cost or allowable sustained performance.\nActive-power techniques: Gate idle clocks, isolate unused operands, reduce memory and interconnect switching, right-size cells and use voltage–frequency operating points appropriate to the workload. Choose the mechanism according to whether activity, capacitance, voltage or frequency dominates.\nStandby techniques: Use high-VT cells on paths with slack. Power gate blocks for long idle intervals and implement isolation and retention where needed. Verify that wake-up time and energy meet the product budget.\nEvaluation: Measure switching and leakage by operating mode. Check power density, average energy per workload, peak current, timing corners and the entry/exit cost of each low-power state. A lower instantaneous power can still consume more energy if execution lasts much longer."}},{"id":"asic-u4-q6","subject":"asic","unit":4,"number":6,"q":"Explain different techniques used to reduce dynamic power and static power in ASIC design.","ans":{"s":"Dynamic: clock/operand gating, sizing, DVFS, glitch and wire reduction. Static: high-VT, power-gating, body-bias or stacking.","m":"Dynamic reduction: Cut activity with clock gating, operand isolation and glitch control. Reduce capacitance with right-sizing and locality. Use DVFS for energy savings when timing permits.\nStatic reduction: Assign high-VT cells where slack permits, power gate sufficiently idle domains and use body bias where supported.\nTrade-off: Account for area, timing, wake-up and isolation. Use the activity profile to choose whether a short pause needs clock gating or a longer pause justifies shutdown.","d":"Dynamic-power target: For capacitive switching, Psw = αCLVDD²f. Clock gating and operand isolation reduce α. Right-sizing and locality reduce CL. DVFS reduces VDD and f when the workload can tolerate it.\nDynamic implementation details: Fix unnecessary glitches on reconverging paths where the savings justify it. Use sensible edge rates to limit short-circuit current and verify that extra buffers do not add more switching capacitance than they remove.\nStatic-power target: Pstatic ≈ VDDIleak. Apply high-VT cells on paths with adequate timing slack and use lower-VT cells sparingly where speed demands them. Reverse body bias may raise effective VT in technologies that support it.\nIdle-domain shutdown: Use a header or footer switch to disconnect the inactive block from a supply rail. Clamp outputs into live domains, retain required state and stage the wake-up current. Clock gating alone leaves the block powered and leaking.\nDesign decision: Report switching and leakage by block and operating mode. For a bursty accelerator, gating on short gaps avoids wake-up costs, while power gating over long gaps can recover enough leakage energy to justify the transition."}},{"id":"asic-u4-q7","subject":"asic","unit":4,"number":7,"q":"Explain different leakage reduction techniques.","ans":{"s":"Use high-VT cells, power gating, reverse body bias where supported, and leakage-conscious sizing or input states.","m":"Cell-level methods: Use high-VT cells on paths with slack, use reverse body bias where supported, and exploit low-leakage standby states and the stack effect.\nDomain-level method: Supply switches suppress idle-block leakage. Add isolation, optional retention and staged wake-up.\nTrade-off: Higher threshold can slow paths. Power gating adds switch drop and latency. Check timing and leakage over corners and temperatures.\nMeasurement: Compare standby leakage at the actual operating temperature and verify state retention before applying a deeper sleep mode.","d":"Leakage mechanisms: Steady supply current includes subthreshold conduction through nominally off transistors, gate leakage and reverse-biased junction leakage. The dominant term depends on technology, bias, operating temperature and cell state.\nMulti-threshold mapping: Use high-VT cells where timing slack exists to reduce subthreshold leakage. Keep faster low-VT cells for paths that need them. Re-run timing across corners after replacing cells.\nPower gating: Disconnect an idle domain using header or footer switches. This attacks leakage across the entire gated domain but adds switch resistance, area, wake latency and inrush current. Use isolation at dependent outputs and retention for state that must survive.\nBody bias: In suitable processes, reverse body bias can increase effective threshold and lower subthreshold current. Check achievable bias range, junction leakage and the slowdown.\nStack effect and input state: Multiple off devices in series can leak less than one off device. A legal standby input pattern may favor low-leakage internal states. Preserve interfaces and required outputs.\nValidation: Compare leakage over the intended states and temperatures. Check timing, retention and wake-up. Long idle windows often favor domain shutdown, whereas frequently active paths favor cell-level changes."}},{"id":"asic-u4-q8","subject":"asic","unit":4,"number":8,"q":"Discuss the Dynamic Voltage and Frequency Scaling (DVFS) technique for low power ASIC design.","ans":{"s":"DVFS selects characterized voltage/frequency points. Increase voltage before frequency; lower frequency before voltage.","m":"Purpose: DVFS selects a characterized voltage–frequency pair based on workload and thermal/power policy. A lower voltage reduces energy per switching event.\nSafe transition: Raise and settle voltage before raising frequency. Lower frequency before lowering voltage.\nDesign considerations: Validate timing and functional margins at every point. Include regulator and clock settling, deadlines and leakage accrued over longer execution when comparing energy per task.","d":"Principle: DVFS changes supply voltage and clock frequency together according to workload. Reducing frequency creates timing margin for lowering voltage. Since Psw = αCLVDD²f, the voltage change cuts switching energy per cycle, while the frequency change spreads cycles over more time.\nOperating points: Characterize approved voltage/frequency pairs for timing, droop, temperature and functional limits. A power controller can select among them based on utilization, latency requirements and thermal headroom.\nTransition ordering: To increase performance, command a higher regulator voltage, wait for it to settle, then increase the clock rate. To decrease performance, lower frequency first and then lower voltage. Check clock switching and regulator/PLL settling before releasing dependent logic.\nExample: A CPU decoding steady audio can run at a lower point between bursts. A sustained compute-intensive workload can increase the point when deadlines require it. Avoid rapidly toggling between points by including transition overhead in the policy.\nEnergy trade-off: A slower task can accumulate more leakage or platform energy, and a transition costs time and energy. Compare total energy per completed task with latency and thermal limits."}},{"id":"asic-u4-q9","subject":"asic","unit":4,"number":9,"q":"What is Unified Power Format (UPF)? Explain its role and key commands used in low power synthesis.","ans":{"s":"UPF (IEEE 1801) specifies domains, supplies, switches, voltage states, isolation, retention and level shifting.","m":"Power intent: UPF defines voltage domains, supplies, switches, legal states and how domains interact.\nKey commands: create_power_domain groups instances, create_power_switch models a switched supply, set_isolation defines clamping, set_level_shifter specifies voltage translation, and set_retention protects selected state.\nFlow use: Power-aware synthesis and implementation map these requirements to suitable library cells. Verification checks shutdown, isolation, restoration and domain crossings against the specified power states.","d":"Purpose: Unified Power Format expresses the power architecture alongside RTL. Synthesis and physical implementation use it to identify domains, supply connections and required interface or state cells. Power-aware verification can model legal power states and corruption when a domain loses power.\nDomain and supply: Use create_power_domain to group instances, and create_supply_port, create_supply_net and supply connection commands to represent rails. A create_power_switch strategy describes a controllable supply path to a switched domain where applicable.\nDomain crossings: Use set_isolation to clamp signals from an unsafe or powered-off source before they reach a live receiver. Use set_level_shifter to describe where crossings between different voltage domains need translation.\nState retention: Use set_retention to describe which registers keep state on a retention supply. Describe save/restore controls and legal supply states according to the UPF version and tool flow.\nExample: The included Tcl-style example declares a switched DSP domain and output isolation. A complete intent also specifies level shifting and retained state as needed. During shutdown, secure state and isolate outputs before removing power. On wake-up, restore power and valid state before releasing isolation. Check that mapped library cells match the stated strategy.","fig":null,"code":{"lang":"UPF / Tcl","s":"Define switchable domain → bind its supplies\nDefine legal power states → provide switch control\nClamp outgoing signals while off → retain selected state\nShift voltage levels at domain crossings","m":"create_power_domain PD_DSP -elements {u_dsp}\nset_isolation ISO_DSP -domain PD_DSP -applies_to outputs \\\n    -clamp_value 0 -isolation_signal iso_dsp \\\n    -isolation_sense high -location parent","d":"# Example strategy fragment. The parent supply and controls\n# are provided by the enclosing SoC power intent.\ncreate_power_domain PD_DSP -elements {u_dsp}\ncreate_supply_net VDD_DSP_SW -domain PD_DSP\ncreate_power_switch SW_DSP -domain PD_DSP \\\n    -input_supply_port {VIN VDD_AON} \\\n    -output_supply_port {VOUT VDD_DSP_SW} \\\n    -control_port {EN dsp_on} \\\n    -on_state {ON VIN {EN}}\n\n# A high iso_dsp clamps this domain's outputs to 0.\nset_isolation ISO_DSP -domain PD_DSP -applies_to outputs \\\n    -clamp_value 0 -isolation_signal iso_dsp \\\n    -isolation_sense high -location parent\n\n# Complete intent with supply-set associations, retention,\n# voltage crossing strategies and legal power states."}}},{"id":"asic-u4-q10","subject":"asic","unit":4,"number":10,"q":"Explain clock gating and supply voltage reduction techniques in detail. How do these techniques help in reducing power consumption in ASIC circuits?","ans":{"s":"Clock gating reduces activity α in idle branches. Voltage scaling reduces energy per toggle by VDD² and costs timing margin.","m":"Clock gating: Reduce switching activity in an idle clock branch. A low-phase latch and AND gate pass full clock pulses, and a test override preserves scan operation.\nSupply reduction: At fixed activity and frequency, switching power scales with VDD². Dropping 1.0 V to 0.8 V saves 36% of that component.\nTiming check: Lower voltage increases delay. Confirm SRAM and timing limits and lower the clock first if necessary.","d":"Clock gating target: A register bank can be idle even though its clock edges still charge clock-tree and clock-pin capacitance. Gate the clock when the bank can safely hold state. The downstream clock activity factor falls.\nGlitch-free implementation: For a positive-edge system, a low-phase latch captures the functional or test enable. The latch holds while the clock is high, so the AND gate passes full pulses. Use an integrated cell and check enable timing and pulse width.\nSupply reduction target: Reducing VDD lowers energy per capacitive switching event. At equal activity, load and frequency, moving from 1.0 V to 0.8 V makes Psw 64% of its old value.\nTiming limit: Lower supply reduces drive current and increases gate delay. A safe point must meet worst-case timing and functional margins, including memory voltage limits and droop. Lower frequency first when the reduced voltage cannot support the old clock.\nCombined use: Gate idle functional units independently and lower voltage/frequency for sustained light demand. The methods change different factors in Psw = αCLVDD²f. Verify energy, wake-up behavior and timing in representative modes.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Glitch-free clock gating using a low-level transparent latch and an AND gate\" viewBox=\"0 0 760 167\">\u003crect width=\"760\" height=\"167\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cpath d=\"M52 52h191 M52 123h509m-389 0v-33h71m151-38h129v28h38m99 19h70\" fill=\"none\" stroke=\"#86a7dc\" stroke-width=\"2\"/>\n\u003crect x=\"243\" y=\"30\" width=\"151\" height=\"81\" rx=\"6\" fill=\"#26334a\" stroke=\"#7a93bd\"/>\u003crect x=\"561\" y=\"68\" width=\"99\" height=\"62\" rx=\"6\" fill=\"#26334a\" stroke=\"#7a93bd\"/>\n\u003ctext x=\"68\" y=\"45\">en | test_en\u003c/text>\u003ctext x=\"80\" y=\"142\">clk\u003c/text>\u003ctext x=\"318\" y=\"57\" text-anchor=\"middle\">Latch enable\u003c/text>\u003ctext x=\"318\" y=\"78\" text-anchor=\"middle\">while clk = 0\u003c/text>\u003ctext x=\"610\" y=\"103\" text-anchor=\"middle\">AND\u003c/text>\u003ctext x=\"672\" y=\"89\">gclk\u003c/text>\u003ccircle cx=\"172\" cy=\"123\" r=\"4\" fill=\"#8be3d2\"/>\u003c/g>\u003c/svg>"}},{"id":"asic-u4-q11","subject":"asic","unit":4,"number":11,"q":"Explain gate-level and architecture-level techniques for low-power VLSI design with suitable examples.","ans":{"s":"Gate level: size, multi-VT, suppress glitches and gate idle clocks. Architecture: gate power, scale V/f, change datapath/memory activity.","m":"Activity control: Gate idle clocks, isolate operands to unused units, and reduce glitches on reconverging logic paths.\nCell choice: Right-size cells to reduce capacitance and use high-VT variants where slack allows.\nArchitecture: Use domain gating for independently idle blocks, DVFS for changing workloads and local memories to reduce data movement.\nExample: A DSP can suppress multiplier input changes between valid samples and switch off the accelerator between sufficiently long batches.","d":"Gate-level activity: Clock gating stops unnecessary edges in idle register banks. Operand isolation prevents unused inputs from toggling a multiplier or ALU. Balanced logic paths can reduce hazards that would otherwise charge and discharge nodes without contributing to the final result.\nGate-level capacitance: Use smaller cells where timing permits and avoid excessive buffering or long high-fanout wires. A large cell can speed a critical path while increasing the load on its predecessor. Check both stages in STA.\nGate-level leakage: Assign high-threshold cells to paths with slack and reserve low-threshold cells for paths that need their drive strength. Compare leakage and timing across corners after assignment.\nArchitecture-level power: Partition independently idle functions into clock or power domains. A switched domain needs isolation and may need retention. Use DVFS for workload-dependent performance and raise voltage before increasing frequency.\nArchitecture-level energy per task: Keep data local to avoid expensive memory transfers, eliminate unnecessary operations, and use appropriate word widths. Parallel lanes can preserve throughput at a lower frequency and voltage when their extra capacitance and leakage are justified.\nExample: A DSP can latch operands only for valid samples, buffer samples in nearby SRAM and power down the accelerator between long batches."}},{"id":"asic-u4-q12","subject":"asic","unit":4,"number":12,"q":"Explain architecture level low power techniques.","ans":{"s":"Architecture techniques include DVFS, power/clock domains, locality, memory banking, parallelism and right-sized datapaths.","m":"Domains: Partition independently idle blocks for clock gating and longer power-gated idle periods.\nWorkload: Apply DVFS with characterized frequency–voltage points and include transition cost.\nDataflow: Improve locality, reduce memory traffic and choose the required datapath width.\nThroughput: Consider parallelism or pipelining for the same throughput at lower voltage, and weigh extra area, clocking and leakage against energy savings.\nExample: Reusing weights in local memory reduces repeated transfers for a batch of accelerator operations.","d":"Partitioning: Separate blocks that work and idle independently. Clock gate brief idle periods and power gate longer ones. Budget isolation, state retention, regulator load and wake-up latency when selecting the domain boundaries.\nWorkload control: DVFS matches a characterized performance level to current demand. Lower the supply with a sufficiently low clock rate. For real-time tasks, include regulator and clock-transition time in the deadline calculation.\nLocality and data movement: Reuse operands or coefficients in registers and nearby SRAM. Schedule batches and bursts to reduce external-memory transactions. Eliminate redundant reads/writes, since interconnect and memory can dominate energy.\nParallelism and pipelining: Several lanes can meet the same throughput at a lower frequency and potentially lower voltage. Pipeline stages can shorten critical paths. Additional registers, lanes, clock loads and leakage can offset the gain.\nAlgorithm and data width: Use only the precision required and skip unnecessary operations when the application permits it. For example, a narrow fixed-point accelerator can avoid high-order multiplier toggles and reduce stored data width.\nEvaluation: Compare energy per task for actual workloads. Account for occupancy, latency, memory traffic and standby behavior."}},{"id":"asic-u4-q13","subject":"asic","unit":4,"number":13,"q":"Explain supply voltage reduction as a technique for power reduction. Discuss its effect on delay and the limits to voltage scaling.","ans":{"s":"Psw∝VDD². Lower voltage saves switching energy but reduces drive and increases delay. Check timing and minimum functional voltage.","m":"Switching power: It scales approximately with VDD² at fixed activity, capacitance and frequency. Reducing 1.0 V to 0.8 V saves 36% of that component.\nTiming: Lower overdrive cuts drive current and raises propagation delay, so the circuit may need a lower frequency.\nLower limit: Use characterized voltage–frequency points. Check worst-case timing and droop, functional margins, SRAM operation, and the energy impact of longer execution.","d":"Voltage dependence: At fixed switching activity, effective capacitance and frequency, Psw = αCLVDD²f. Lowering VDD from 1.0 V to 0.8 V gives 0.8² = 0.64 of the original switching power, a 36% reduction. The energy per charging event falls by the same ratio.\nDelay dependence: A useful first estimate is tp ≈ CLVDD/Idrive. Lower voltage reduces required output swing, but it also reduces transistor overdrive and available current. Near threshold the current reduction dominates, so delay grows rapidly and the maximum safe clock frequency decreases.\nPractical limit: Characterize worst-case timing across process, voltage and temperature, including droop. Check noise margins, variation, SRAM reads and writes, and retention where required. The limiting block may be a memory or another hard macro.\nOperating point: Lower the clock to a characterized value before reducing voltage. If unchanged throughput is required, consider parallelism or pipelining and include their area and switching costs. Evaluate energy per task, since longer execution can increase the energy spent on leakage and other fixed loads."}}]},{"title":"Physical Design of a Digital Block","questions":[{"id":"asic-u5-q1","subject":"asic","unit":5,"number":1,"q":"Explain the complete physical design flow from Netlist to CIF / layout (GDSII) in detail.","ans":{"s":"Netlist + technology inputs → floorplan/PDN → placement → CTS → route → extraction and signoff → stream-out.","m":"Input to layout: Read the mapped netlist, libraries, physical abstracts, SDC and power intent. Floorplan die/core, macros and supplies.\nImplementation: Place and legalize cells, build the clock tree, then run global and detailed routing.\nSignoff: Extract RC, close timing and power integrity, and verify geometry and connectivity with DRC and LVS.\nExport: Stream out verified layer geometry as GDSII or translate to CIF if the flow requires legacy text layout.","d":"Inputs: Import the mapped gate netlist, timing and power libraries, cell/macro abstracts and technology layers, SDC constraints, and power intent. Check that top ports, cell references, clocks, supplies and units agree before placement.\nFloorplan and power: Set die and core dimensions, cell rows, I/O locations and macro positions. Reserve routing channels, pin access and blockages. Build the power grid from supply feeds through straps, vias and local rails.\nPlacement and clocking: Global placement optimizes wirelength, congestion and timing estimates. Legalization snaps cells to legal rows/sites. CTS inserts clock buffers and selects routes to meet skew, latency and slew targets.\nRouting: Global routing assigns coarse corridors and layer resources. Detailed routing creates exact legal tracks, vias and connections. Implement ECOs to repair timing, congestion, antenna or geometry violations and recheck affected paths.\nExtraction and signoff: Extract routed resistance and capacitance, run multi-corner multi-mode timing and check IR drop and electromigration. Run DRC for geometry and LVS for connectivity against the intended netlist.\nStream-out: Export the verified hierarchy and layer polygons using the required layer map. GDSII is a common binary layout format. CIF is a legacy text format describing geometry, layers and cell definitions/calls. Check the exported database against the layout before handoff.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gate netlist to layout physical design flow\" viewBox=\"0 0 740 154\">\u003crect width=\"740\" height=\"154\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003crect x=\"20\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"90\" y=\"38\" text-anchor=\"middle\">Gate netlist and\u003c/text>\u003ctext x=\"90\" y=\"53\" text-anchor=\"middle\">PDK/library inputs\u003c/text>\u003cpath d=\"M161 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"195\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"265\" y=\"38\" text-anchor=\"middle\">Floorplan and\u003c/text>\u003ctext x=\"265\" y=\"53\" text-anchor=\"middle\">power grid\u003c/text>\u003cpath d=\"M336 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"370\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"440\" y=\"38\" text-anchor=\"middle\">Place and\u003c/text>\u003ctext x=\"440\" y=\"53\" text-anchor=\"middle\">legalize\u003c/text>\u003cpath d=\"M511 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"545\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"615\" y=\"38\" text-anchor=\"middle\">Clock tree\u003c/text>\u003ctext x=\"615\" y=\"53\" text-anchor=\"middle\">synthesis\u003c/text>\u003cpath d=\"M615 67v19m-4-5 4 5 4-5\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"545\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"615\" y=\"108\" text-anchor=\"middle\">Global and\u003c/text>\u003ctext x=\"615\" y=\"123\" text-anchor=\"middle\">detailed route\u003c/text>\u003cpath d=\"M543 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"370\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"440\" y=\"108\" text-anchor=\"middle\">Extract RC and\u003c/text>\u003ctext x=\"440\" y=\"123\" text-anchor=\"middle\">timing closure\u003c/text>\u003cpath d=\"M368 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"195\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"265\" y=\"108\" text-anchor=\"middle\">DRC, LVS and\u003c/text>\u003ctext x=\"265\" y=\"123\" text-anchor=\"middle\">reliability checks\u003c/text>\u003cpath d=\"M193 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"20\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"90\" y=\"108\" text-anchor=\"middle\">GDSII/OASIS\u003c/text>\u003ctext x=\"90\" y=\"123\" text-anchor=\"middle\">or legacy CIF\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u5-q2","subject":"asic","unit":5,"number":2,"q":"Explain Clock Tree Synthesis (CTS) and Buffering in detail, including the goals of CTS.","ans":{"s":"CTS builds the physical clock distribution. Size and place buffers to control skew, insertion delay, slew and load.","m":"CTS objective: Build a physical clock network with controlled skew, latency, slew, fanout and pulse width.\nMethod: Cluster sinks, route clock branches and balance their loads and arrival times using sized buffers or inverter pairs.\nBuffering trade-off: Stages isolate capacitance and restore edge rate, but consume area and power and add delay.\nSignoff: Use propagated clock timing and recheck both setup and hold after extraction.","d":"Inputs and objectives: Start from placed cells, clock definitions, clock sinks and cell library limits. Deliver clock edges with bounded skew, insertion delay and transition time while controlling fanout, pulse width, power and routing resources.\nTree construction: Cluster sinks by location and load. Connect clusters through branches and insert buffers or inverter pairs where needed. Size drivers and select routing layers, widths and spacing to limit RC and unwanted coupling.\nWhy buffers help: A buffer divides a large capacitive tree into smaller electrical loads. It restores edge rate and isolates its upstream driver. Buffers add intrinsic delay, area and switching power, so manage levels and sizes instead of inserting them indiscriminately.\nBalancing: Equal wire length alone cannot ensure equal arrival time. Include fanout, wire resistance and capacitance, driver delay and variation. Some flows use purposeful skew to improve selected setup paths, subject to hold checks.\nValidation: Propagate real clock delays after CTS and again after extraction. Check setup and hold, skew, latency, maximum transition, pulse width and gated/generated clocks. Verify test clocks and clock-domain boundaries as applicable."}},{"id":"asic-u5-q3","subject":"asic","unit":5,"number":3,"q":"Explain placement, CTS and buffering techniques in ASIC design.","ans":{"s":"Place and legalize cells. Build and buffer the clock tree. Buffer long or high-fanout nets while verifying both maximum and minimum timing.","m":"Placement: Place cells for timing, wirelength and congestion, then legalize by row and site. Refine locally while respecting blockages.\nCTS: Cluster clock sinks and insert clock drivers to meet skew, latency, slew and pulse-width constraints.\nBuffering: Split high loads or long wires to restore slew, or add controlled delay to a fast data path for hold. Recheck timing, area, congestion and power after changes.","d":"Global placement: Estimate cell coordinates from net c
