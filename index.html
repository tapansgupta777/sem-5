03cpath d=\"M226 91 V40 H337 M337 30 V50 M345 30 V50 M345 40 H462 V91\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"226\" cy=\"91\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"462\" cy=\"91\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"112\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Differential stage\u003c/text>\u003ctext x=\"344\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Inverting stage\u003c/text>\u003ctext x=\"545\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Load CL\u003c/text>\u003ctext x=\"341\" y=\"24\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">Miller CC\u003c/text>\u003ctext x=\"226\" y=\"127\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VX\u003c/text>\u003ctext x=\"462\" y=\"127\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"307\" y=\"152\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">CC bridges the high-impedance first-stage node and output\u003c/text>\u003c/svg>"}}]},{"title":"Digital CMOS Logic & Circuit Design","questions":[{"id":"cmos-u3-q1","subject":"cmos","unit":3,"number":1,"q":"Explain the structure and operation of a CMOS inverter with a neat diagram.","ans":{"s":"PMOS up, NMOS down. Gates share VIN and drains share VOUT. 0→1, 1→0.","m":"Put PMOS between VDD and output, and NMOS between output and ground. A low input turns on PMOS and charges the load to VDD. A high input turns on NMOS and discharges the load to ground.","d":"Tie the PMOS source and n-well to VDD and the NMOS source and p-substrate or p-well to GND. Both gates receive VIN and both drains meet at VOUT. For VIN=0, NMOS is off and PMOS pulls VOUT to VDD. For VIN=VDD, PMOS is off and NMOS pulls VOUT to GND. During a transition both may conduct briefly, producing short-circuit current alongside charging or discharging of CL. Ideal DC rail states have no direct DC path from VDD to GND. Real devices still leak.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 550 205\" role=\"img\" aria-label=\"Static CMOS inverter\" style=\"display:block;width:100%;height:auto;max-width:550px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Static CMOS inverter\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"549\" height=\"204\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"254\" y=\"46\" width=\"67\" height=\"30\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"254\" y=\"121\" width=\"67\" height=\"30\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M287 24 V46 M287 76 V121 M287 151 V177 M264 177 H311 M272 184 H303 M279 191 H296 M128 100 H214 M214 61 V136 M214 61 H245 M214 136 H254 M287 100 H426\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"214\" cy=\"100\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"287\" cy=\"100\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"249\" cy=\"61\" r=\"4\" fill=\"#fb7185\"/>\u003ctext x=\"287\" y=\"19\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"287\" y=\"66\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">PMOS\u003c/text>\u003ctext x=\"287\" y=\"141\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">NMOS\u003c/text>\u003ctext x=\"105\" y=\"105\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN\u003c/text>\u003ctext x=\"449\" y=\"104\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"399\" y=\"149\" fill=\"#94a3b8\" font-size=\"11\" text-anchor=\"middle\">Body ties: PMOS→VDD\u003c/text>\u003ctext x=\"402\" y=\"166\" fill=\"#94a3b8\" font-size=\"11\" text-anchor=\"middle\">NMOS→GND\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q2","subject":"cmos","unit":3,"number":2,"q":"Explain the voltage transfer characteristic (VTC) of a CMOS inverter. Define the switching threshold (VM).","ans":{"s":"VTC is DC VOUT vs VIN. VM is the intersection VOUT=VIN. Matched devices center it near VDD/2.","m":"The inverter VTC is nearly flat at VDD and 0, with a steep negative slope in between. The switching threshold VM satisfies VIN=VOUT. At VM both on-transistors can be treated as saturated in the long-channel inverter model.","d":"Sweep VIN slowly from 0 to VDD and plot settled VOUT. In the transition the pull-up and pull-down currents balance. VM is defined by VOUT=VIN=VM, distinct from each MOS threshold. Neglect channel-length modulation and assume both saturated with VDD>VTn+|VTp|. Equate βn(VM−VTn)²/2 and βp(VDD−VM−|VTp|)²/2. Let r=√(βp/βn). Then VM=[VTn+r(VDD−|VTp|)]/(1+r). Equal β and threshold magnitudes give VM≈VDD/2. In typical CMOS, increasing PMOS width offsets lower hole mobility and adjusts the switching threshold.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 580 285\" role=\"img\" aria-label=\"CMOS inverter voltage transfer characteristic and switching/noise points\" style=\"display:block;width:100%;height:auto;max-width:580px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>CMOS inverter voltage transfer characteristic and switching/noise points\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"579\" height=\"284\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M73 226 H530 l-7 -4 m7 4 -7 4 M73 226 V33 l-4 7 m4 -7 4 7\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M73 48 H203 Q245 48 262 83 Q275 114 287 142 Q310 204 369 218 H508\" fill=\"none\" stroke=\"#5eead4\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M73 226 L507 47\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/>\u003cpath d=\"M247 69 V226 M322 191 V226 M286 140 V226\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"4 5\"/>\u003ccircle cx=\"247\" cy=\"68\" r=\"4\" fill=\"#fb7185\"/>\u003ccircle cx=\"322\" cy=\"192\" r=\"4\" fill=\"#fb7185\"/>\u003ccircle cx=\"286\" cy=\"140\" r=\"4\" fill=\"#93c5fd\"/>\u003ctext x=\"49\" y=\"32\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"528\" y=\"250\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN\u003c/text>\u003ctext x=\"123\" y=\"35\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOH≈VDD\u003c/text>\u003ctext x=\"461\" y=\"207\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOL≈0\u003c/text>\u003ctext x=\"246\" y=\"249\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIL\u003c/text>\u003ctext x=\"287\" y=\"248\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VM\u003c/text>\u003ctext x=\"325\" y=\"249\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIH\u003c/text>\u003ctext x=\"487\" y=\"68\" fill=\"#94a3b8\" font-size=\"13\" text-anchor=\"middle\">VOUT = VIN\u003c/text>\u003ctext x=\"246\" y=\"269\" fill=\"#fb7185\" font-size=\"10\" text-anchor=\"middle\">slope = −1\u003c/text>\u003ctext x=\"326\" y=\"269\" fill=\"#fb7185\" font-size=\"10\" text-anchor=\"middle\">slope = −1\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q3","subject":"cmos","unit":3,"number":3,"q":"Define noise margins NML and NMH. Explain how they are obtained from the VTC.","ans":{"s":"NML=VIL−VOL, NMH=VOH−VIH. VIL and VIH are VTC points with slope −1.","m":"Read the high and low output levels from the VTC. Find VIL and VIH at the lower and upper input values where slope is −1. The voltage gaps to the corresponding output levels are the tolerable low and high noise.","d":"VIL is the upper limit for a valid low input and VIH is the lower limit for a valid high input. In the textbook graphical definition these are the lower- and higher-VIN roots of dVOUT/dVIN=−1 on the DC VTC. Define guaranteed low output VOL,max and high output VOH,min. The margins are NML=VIL,max−VOL,max and NMH=VOH,min−VIH,min when VIL,max and VIH,min denote the input specification limits. Use worst-case output guarantees for design, or rail values VOH≈VDD and VOL≈0 for ideal static CMOS. Both margins must remain positive over noise, load and PVT. Balanced sizing often makes NML and NMH comparable.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 580 285\" role=\"img\" aria-label=\"CMOS inverter voltage transfer characteristic and switching/noise points\" style=\"display:block;width:100%;height:auto;max-width:580px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>CMOS inverter voltage transfer characteristic and switching/noise points\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"579\" height=\"284\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M73 226 H530 l-7 -4 m7 4 -7 4 M73 226 V33 l-4 7 m4 -7 4 7\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M73 48 H203 Q245 48 262 83 Q275 114 287 142 Q310 204 369 218 H508\" fill=\"none\" stroke=\"#5eead4\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M73 226 L507 47\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/>\u003cpath d=\"M247 69 V226 M322 191 V226 M286 140 V226\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"4 5\"/>\u003ccircle cx=\"247\" cy=\"68\" r=\"4\" fill=\"#fb7185\"/>\u003ccircle cx=\"322\" cy=\"192\" r=\"4\" fill=\"#fb7185\"/>\u003ccircle cx=\"286\" cy=\"140\" r=\"4\" fill=\"#93c5fd\"/>\u003ctext x=\"49\" y=\"32\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"528\" y=\"250\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN\u003c/text>\u003ctext x=\"123\" y=\"35\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOH≈VDD\u003c/text>\u003ctext x=\"461\" y=\"207\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOL≈0\u003c/text>\u003ctext x=\"246\" y=\"249\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIL\u003c/text>\u003ctext x=\"287\" y=\"248\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VM\u003c/text>\u003ctext x=\"325\" y=\"249\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIH\u003c/text>\u003ctext x=\"487\" y=\"68\" fill=\"#94a3b8\" font-size=\"13\" text-anchor=\"middle\">VOUT = VIN\u003c/text>\u003ctext x=\"246\" y=\"269\" fill=\"#fb7185\" font-size=\"10\" text-anchor=\"middle\">slope = −1\u003c/text>\u003ctext x=\"326\" y=\"269\" fill=\"#fb7185\" font-size=\"10\" text-anchor=\"middle\">slope = −1\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q4","subject":"cmos","unit":3,"number":4,"q":"Explain static and dynamic power dissipation in a CMOS inverter. Write the expression for dynamic power.","ans":{"s":"Psw=αCLVDD²f. Transition overlap adds short-circuit power. Static power≈VDDIleak.","m":"Dynamic power includes charging output capacitance and brief overlap current when both MOSFETs conduct. Static power is due to leakage at stable input. α is the average number of 0→1 events per clock cycle.","d":"On a full 0→1 transition the supply delivers CLVDD². One half is stored in CL and one half dissipates in the pull-up. Discharge dissipates the stored half in the pull-down. Therefore Psw=αCLVDD²f for α low-to-high events per reference cycle. If activity counts both edges of balanced data, use half that rate. Short-circuit power equals VDD times the time-average direct overlap current. Static CMOS also dissipates Pstatic≈VDDIleak from subthreshold, gate tunneling and junction leakage, even when VIN is held. Reduce dynamic power with lower VDD, lower load or activity and sensible transition times."}},{"id":"cmos-u3-q5","subject":"cmos","unit":3,"number":5,"q":"Explain delay analysis of a CMOS inverter. Define propagation delays tpHL and tpLH.","ans":{"s":"tpHL and tpLH are input/output 50% delays. First-order estimates: 0.69RnCL and 0.69RpCL.","m":"After a rising input, NMOS discharges CL, giving high-to-low propagation delay tpHL. After a falling input, PMOS charges CL, giving tpLH. Measure between the corresponding 50% input and output crossings.","d":"Use CL=Cjunction+Cfanout+Cwire and an effective resistance for the conducting device. With a step input, discharge is VOUT(t)=VDDe^(−t/RnCL), giving tpHL≈ln(2)RnCL. Charge is VOUT(t)=VDD[1−e^(−t/RpCL)], giving tpLH≈ln(2)RpCL. A common mean delay is tp=(tpHL+tpLH)/2. Distinguish propagation delay from rise and fall time, which typically measure 10%–90% or 90%–10% output excursion. Finite input slew and nonlinear MOS resistance change the numbers. PMOS sizing can balance the rise and fall delays."}},{"id":"cmos-u3-q6","subject":"cmos","unit":3,"number":6,"q":"Design 2-input CMOS NAND and NOR gates with truth tables. Explain pull-up and pull-down network duality.","ans":{"s":"NAND: n series, p parallel. NOR: n parallel, p series. 00/01/10/11 gives NAND 1110 and NOR 1000.","m":"The NMOS pull-down network implements the input combinations for a low output. The PMOS pull-up is the complementary dual obtained by swapping series and parallel and replacing NMOS with PMOS.","d":"For NAND, connect nA and nB in series from Y to GND and pA and pB in parallel from VDD to Y. Only A=B=1 discharges the output. For NOR, put nA and nB in parallel and pA and pB in series. Any high input pulls output low. Truth table (A,B → NAND,NOR): 00→11, 01→10, 10→10, 11→00. Each input controls the same-named NMOS and PMOS. By De Morgan duality the pull-up conducts exactly when the pull-down is off for valid DC inputs. Transistor sizing compensates for the larger resistance of devices stacked in a conducting path.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 650 193\" role=\"img\" aria-label=\"Complementary CMOS networks for NAND and NOR\" style=\"display:block;width:100%;height:auto;max-width:650px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Complementary CMOS networks for NAND and NOR\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"649\" height=\"192\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"61\" y=\"49\" width=\"228\" height=\"35\" fill=\"#3a2b19\" stroke=\"#d69d47\" rx=\"2\"/>\u003crect x=\"61\" y=\"116\" width=\"228\" height=\"35\" fill=\"#103329\" stroke=\"#62bc91\" rx=\"2\"/>\u003crect x=\"361\" y=\"49\" width=\"228\" height=\"35\" fill=\"#3a2b19\" stroke=\"#d69d47\" rx=\"2\"/>\u003crect x=\"361\" y=\"116\" width=\"228\" height=\"35\" fill=\"#103329\" stroke=\"#62bc91\" rx=\"2\"/>\u003cpath d=\"M175 35 V49 M175 84 V116 M175 151 V168 M175 100 H268\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M475 35 V49 M475 84 V116 M475 151 V168 M475 100 H568\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"175\" cy=\"100\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"475\" cy=\"100\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"175\" y=\"22\" fill=\"#dbeafe\" font-size=\"14\" text-anchor=\"middle\">NAND\u003c/text>\u003ctext x=\"175\" y=\"34\" fill=\"#fbbf24\" font-size=\"10\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"175\" y=\"71\" fill=\"#fde8bc\" font-size=\"13\" text-anchor=\"middle\">PUN: pA ∥ pB\u003c/text>\u003ctext x=\"175\" y=\"138\" fill=\"#d1fae5\" font-size=\"13\" text-anchor=\"middle\">PDN: nA — nB\u003c/text>\u003ctext x=\"287\" y=\"105\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"175\" y=\"179\" fill=\"#86efac\" font-size=\"10\" text-anchor=\"middle\">GND\u003c/text>\u003ctext x=\"475\" y=\"22\" fill=\"#dbeafe\" font-size=\"14\" text-anchor=\"middle\">NOR\u003c/text>\u003ctext x=\"475\" y=\"34\" fill=\"#fbbf24\" font-size=\"10\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"475\" y=\"71\" fill=\"#fde8bc\" font-size=\"13\" text-anchor=\"middle\">PUN: pA — pB\u003c/text>\u003ctext x=\"475\" y=\"138\" fill=\"#d1fae5\" font-size=\"13\" text-anchor=\"middle\">PDN: nA ∥ nB\u003c/text>\u003ctext x=\"587\" y=\"105\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"475\" y=\"179\" fill=\"#86efac\" font-size=\"10\" text-anchor=\"middle\">GND\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q7","subject":"cmos","unit":3,"number":7,"q":"Realize the Boolean function F = (A·B + C)' using static CMOS logic. Draw the pull-up and pull-down networks.","ans":{"s":"AOI21: PDN=(nA series nB) ∥ nC. PUN=(pA ∥ pB) series pC.","m":"For F=¬(AB+C), F is low when both A and B are high or C is high. Put nA and nB in series and place nC across the series path. The dual PMOS arrangement gives F high for C=0 and at least one of A or B low.","d":"Form the pull-down from A·B+C. From F to GND place one branch containing nA then nB, in parallel with a second branch containing nC alone. Form the pull-up from VDD to F as pC in series with the parallel pair pA and pB. PMOS conducts for a low gate value, so its network implements ¬C·(¬A+¬B). Connect each p/n gate pair to its named input and use normal bulk ties. Test C=1: nC conducts and pC cuts off. Test C=0: F is low only for A=B=1. The gate uses six MOS transistors.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 650 193\" role=\"img\" aria-label=\"AOI21 complementary CMOS network\" style=\"display:block;width:100%;height:auto;max-width:650px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>AOI21 complementary CMOS network\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"649\" height=\"192\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"211\" y=\"49\" width=\"228\" height=\"35\" fill=\"#3a2b19\" stroke=\"#d69d47\" rx=\"2\"/>\u003crect x=\"211\" y=\"116\" width=\"228\" height=\"35\" fill=\"#103329\" stroke=\"#62bc91\" rx=\"2\"/>\u003cpath d=\"M325 35 V49 M325 84 V116 M325 151 V168 M325 100 H418\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"325\" cy=\"100\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"325\" y=\"22\" fill=\"#dbeafe\" font-size=\"14\" text-anchor=\"middle\">AOI21\u003c/text>\u003ctext x=\"325\" y=\"34\" fill=\"#fbbf24\" font-size=\"10\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"325\" y=\"71\" fill=\"#fde8bc\" font-size=\"13\" text-anchor=\"middle\">PUN: (pA ∥ pB) — pC\u003c/text>\u003ctext x=\"325\" y=\"138\" fill=\"#d1fae5\" font-size=\"13\" text-anchor=\"middle\">PDN: (nA — nB) ∥ nC\u003c/text>\u003ctext x=\"437\" y=\"105\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"325\" y=\"179\" fill=\"#86efac\" font-size=\"10\" text-anchor=\"middle\">GND\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q8","subject":"cmos","unit":3,"number":8,"q":"Explain pass transistor logic. What is the problem of threshold voltage drop?","ans":{"s":"A pass NMOS passes a good 0 and a weak 1 ≈VDD−VT. A PMOS does the reverse. A parallel TG restores both rails.","m":"Pass-transistor logic steers the input signal through a controlled channel. NMOS conduction weakens as a passed high raises the receiving node and reduces VGS. A PMOS has the complementary weak-low behavior.","d":"Connect the data to one channel terminal and use the gate as enable. An NMOS enabled by VDD drives a low strongly. For a high, the receiving node rises until VGS approaches VTn, giving about VDD−VTn, often lower with body effect. A PMOS with gate low passes a high strongly but cannot readily pass a full low. Degraded levels lower noise margin and can cause DC overlap current in a following inverter. Floating internal nodes, charge sharing and accumulated delay are additional risks. Use a restoring stage or a CMOS transmission gate with complementary controls for full swing."}},{"id":"cmos-u3-q9","subject":"cmos","unit":3,"number":9,"q":"Explain the transmission gate. Implement a 2:1 multiplexer using transmission gates.","ans":{"s":"Two TGs share Y. TG0 enabled by S̄, TG1 by S. Y=D0S̄+D1S.","m":"Each transmission gate is a parallel NMOS/PMOS pair with complementary control gates. Drive TG0 with enable S̄ and TG1 with S, join their outputs, and generate S̄ with an inverter.","d":"Connect D0 through TG0 and D1 through TG1 to a shared Y. TG0: NMOS gate S̄, PMOS gate S. TG1: NMOS gate S, PMOS gate S̄. For S=0 only TG0 is on, so Y=D0. For S=1 only TG1 is on, so Y=D1. The parallel MOS pair provides strong transmission to both rails. Use an inverter for complementary select, giving six total devices for two TGs and select inverter. Select path skew can briefly isolate the output or overlap branches. Buffer a heavily loaded output when required.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 590 203\" role=\"img\" aria-label=\"Two-input multiplexer using two CMOS transmission gates\" style=\"display:block;width:100%;height:auto;max-width:590px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Two-input multiplexer using two CMOS transmission gates\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"589\" height=\"202\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"153\" y=\"48\" width=\"132\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"153\" y=\"120\" width=\"132\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M89 65 H153 M89 137 H153 M285 65 H383 V137 H285 M383 101 H482\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M219 48 V28 M219 120 V99\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"383\" cy=\"101\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"68\" y=\"70\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">D0\u003c/text>\u003ctext x=\"68\" y=\"142\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">D1\u003c/text>\u003ctext x=\"219\" y=\"70\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG0: N ∥ P\u003c/text>\u003ctext x=\"219\" y=\"142\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG1: N ∥ P\u003c/text>\u003ctext x=\"219\" y=\"23\" fill=\"#fda4af\" font-size=\"13\" text-anchor=\"middle\">N: S̄  ·  P: S\u003c/text>\u003ctext x=\"219\" y=\"96\" fill=\"#fda4af\" font-size=\"13\" text-anchor=\"middle\">N: S  ·  P: S̄\u003c/text>\u003ctext x=\"503\" y=\"107\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"293\" y=\"181\" fill=\"#94a3b8\" font-size=\"13\" text-anchor=\"middle\">S = 0 selects D0.   S = 1 selects D1.\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q10","subject":"cmos","unit":3,"number":10,"q":"Design an XOR gate using CMOS logic and explain its working.","ans":{"s":"XOR high on 01 and 10. Build PDN for AB+ĀB̄, dual PUN for XOR. Invert A and B locally.","m":"Generate Ā and B̄. In the NMOS network connect an A–B series branch in parallel with an Ā–B̄ series branch. The dual PMOS network pulls up for unequal inputs.","d":"XOR Y=ĀB+AB̄, so the NMOS pull-down must implement Ȳ=AB+ĀB̄. Put nA series nB in one branch and nĀ series nB̄ in the other. Their branches are parallel. The pull-up is (pA∥pB) in series with (pĀ∥pB̄). Connect gate inputs and their complements from two inverters. For 00 and 11 exactly one pull-down branch conducts and Y=0. For 01 and 10 neither pull-down branch conducts and both pull-up groups have a conducting path, so Y=1. Eight core devices plus four for complements give a 12-transistor realization.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 650 193\" role=\"img\" aria-label=\"Static CMOS XOR complementary networks\" style=\"display:block;width:100%;height:auto;max-width:650px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Static CMOS XOR complementary networks\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"649\" height=\"192\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"211\" y=\"49\" width=\"228\" height=\"35\" fill=\"#3a2b19\" stroke=\"#d69d47\" rx=\"2\"/>\u003crect x=\"211\" y=\"116\" width=\"228\" height=\"35\" fill=\"#103329\" stroke=\"#62bc91\" rx=\"2\"/>\u003cpath d=\"M325 35 V49 M325 84 V116 M325 151 V168 M325 100 H418\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"325\" cy=\"100\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"325\" y=\"22\" fill=\"#dbeafe\" font-size=\"14\" text-anchor=\"middle\">XOR\u003c/text>\u003ctext x=\"325\" y=\"34\" fill=\"#fbbf24\" font-size=\"10\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"325\" y=\"71\" fill=\"#fde8bc\" font-size=\"13\" text-anchor=\"middle\">PUN: (pA ∥ pB) — (pĀ ∥ pB̄)\u003c/text>\u003ctext x=\"325\" y=\"138\" fill=\"#d1fae5\" font-size=\"13\" text-anchor=\"middle\">PDN: (nA — nB) ∥ (nĀ — nB̄)\u003c/text>\u003ctext x=\"437\" y=\"105\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"325\" y=\"179\" fill=\"#86efac\" font-size=\"10\" text-anchor=\"middle\">GND\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q11","subject":"cmos","unit":3,"number":11,"q":"Explain the DC transfer characteristics of a CMOS inverter. Describe the regions of operation of the nMOS and pMOS transistors with a neat voltage transfer characteristic (VTC).","ans":{"s":"Typical VTC: NMOS off/PMOS triode → N sat/P triode → both sat → N triode/P sat → N triode/P off.","m":"At low input the PMOS pulls output high. Increasing input turns on NMOS and creates the steep transition as both devices conduct. At high input PMOS turns off and NMOS pulls the output low. Test regions using the instantaneous output voltage.","d":"Start from VOUT≈VDD at low VIN, where NMOS is cut off and the on PMOS has VSD≈0. As VIN exceeds VTn, NMOS first operates in saturation at high VOUT while PMOS is in triode. Through the central transition both may be saturated. As VOUT drops further, NMOS enters triode while PMOS, still on, remains in saturation until VSGp≤|VTp|. At high VIN the NMOS remains on in triode with VDS≈0. For exact boundaries compare VOUT to VIN−VTn for NMOS saturation and compare VDD−VOUT to (VDD−VIN)−|VTp| for PMOS saturation. This sequence assumes an ordinary long-channel inverter with sufficient VDD for simultaneous conduction and both saturation conditions.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 580 285\" role=\"img\" aria-label=\"CMOS inverter voltage transfer characteristic and switching/noise points\" style=\"display:block;width:100%;height:auto;max-width:580px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>CMOS inverter voltage transfer characteristic and switching/noise points\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"579\" height=\"284\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M73 226 H530 l-7 -4 m7 4 -7 4 M73 226 V33 l-4 7 m4 -7 4 7\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M73 48 H203 Q245 48 262 83 Q275 114 287 142 Q310 204 369 218 H508\" fill=\"none\" stroke=\"#5eead4\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M73 226 L507 47\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/>\u003cpath d=\"M247 69 V226 M322 191 V226 M286 140 V226\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"4 5\"/>\u003ccircle cx=\"247\" cy=\"68\" r=\"4\" fill=\"#fb7185\"/>\u003ccircle cx=\"322\" cy=\"192\" r=\"4\" fill=\"#fb7185\"/>\u003ccircle cx=\"286\" cy=\"140\" r=\"4\" fill=\"#93c5fd\"/>\u003ctext x=\"49\" y=\"32\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"528\" y=\"250\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN\u003c/text>\u003ctext x=\"123\" y=\"35\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOH≈VDD\u003c/text>\u003ctext x=\"461\" y=\"207\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOL≈0\u003c/text>\u003ctext x=\"246\" y=\"249\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIL\u003c/text>\u003ctext x=\"287\" y=\"248\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VM\u003c/text>\u003ctext x=\"325\" y=\"249\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIH\u003c/text>\u003ctext x=\"487\" y=\"68\" fill=\"#94a3b8\" font-size=\"13\" text-anchor=\"middle\">VOUT = VIN\u003c/text>\u003ctext x=\"246\" y=\"269\" fill=\"#fb7185\" font-size=\"10\" text-anchor=\"middle\">slope = −1\u003c/text>\u003ctext x=\"326\" y=\"269\" fill=\"#fb7185\" font-size=\"10\" text-anchor=\"middle\">slope = −1\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q12","subject":"cmos","unit":3,"number":12,"q":"Design a static CMOS gate for the Boolean function Y = [(A + B)·C]. Draw the pull-up and pull-down networks.","ans":{"s":"Make OAI21 node X=¬[(A+B)C], then invert X for Y. PDN=(nA∥nB)–nC. PUN=(pA–pB)∥pC.","m":"A static complementary gate controlled by the true inputs first makes the inverting function X=¬[(A+B)C]. Its PDN puts parallel A/B NMOS in series with C. Its dual PUN puts series A/B PMOS in parallel with C. An inverter produces Y=(A+B)C.","d":"Because the specified Y=(A+B)·C is non-inverting, implement an OAI21 core and a restoring inverter. For X=¬Y, connect nA and nB in parallel and place their pair in series with nC from X to GND. From VDD to X connect pA and pB in series as one branch, with pC as a parallel branch. Thus if C=0, pC forces X=1; if C=1 and either A or B=1, the pull-down forces X=0. Add a CMOS inverter from X to Y. The two stages use eight transistors, and the output inverter guarantees the requested polarity.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 650 193\" role=\"img\" aria-label=\"OAI21 internal complementary CMOS network feeding an inverter\" style=\"display:block;width:100%;height:auto;max-width:650px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>OAI21 internal complementary CMOS network feeding an inverter\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"649\" height=\"192\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"211\" y=\"49\" width=\"228\" height=\"35\" fill=\"#3a2b19\" stroke=\"#d69d47\" rx=\"2\"/>\u003crect x=\"211\" y=\"116\" width=\"228\" height=\"35\" fill=\"#103329\" stroke=\"#62bc91\" rx=\"2\"/>\u003cpath d=\"M325 35 V49 M325 84 V116 M325 151 V168 M325 100 H418\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"325\" cy=\"100\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"325\" y=\"22\" fill=\"#dbeafe\" font-size=\"14\" text-anchor=\"middle\">OAI21: X = (A+B)C complemented\u003c/text>\u003ctext x=\"325\" y=\"34\" fill=\"#fbbf24\" font-size=\"10\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"325\" y=\"71\" fill=\"#fde8bc\" font-size=\"13\" text-anchor=\"middle\">PUN: (pA — pB) ∥ pC\u003c/text>\u003ctext x=\"325\" y=\"138\" fill=\"#d1fae5\" font-size=\"13\" text-anchor=\"middle\">PDN: (nA ∥ nB) — nC\u003c/text>\u003ctext x=\"437\" y=\"105\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">X → INV → Y\u003c/text>\u003ctext x=\"325\" y=\"179\" fill=\"#86efac\" font-size=\"10\" text-anchor=\"middle\">GND\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q13","subject":"cmos","unit":3,"number":13,"q":"Explain the transmission gate and implement a 2:1 multiplexer using transmission gates.","ans":{"s":"Two TGs share Y. TG0 enabled by S̄, TG1 by S. Y=D0S̄+D1S.","m":"Each transmission gate is a parallel NMOS/PMOS pair with complementary control gates. Drive TG0 with enable S̄ and TG1 with S, join their outputs, and generate S̄ with an inverter.","d":"Connect D0 through TG0 and D1 through TG1 to a shared Y. TG0: NMOS gate S̄, PMOS gate S. TG1: NMOS gate S, PMOS gate S̄. For S=0 only TG0 is on, so Y=D0. For S=1 only TG1 is on, so Y=D1. The parallel MOS pair provides strong transmission to both rails. Use an inverter for complementary select, giving six total devices for two TGs and select inverter. Select path skew can briefly isolate the output or overlap branches. Buffer a heavily loaded output when required.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 590 203\" role=\"img\" aria-label=\"Two-input multiplexer using two CMOS transmission gates\" style=\"display:block;width:100%;height:auto;max-width:590px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Two-input multiplexer using two CMOS transmission gates\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"589\" height=\"202\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"153\" y=\"48\" width=\"132\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"153\" y=\"120\" width=\"132\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M89 65 H153 M89 137 H153 M285 65 H383 V137 H285 M383 101 H482\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M219 48 V28 M219 120 V99\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"383\" cy=\"101\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"68\" y=\"70\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">D0\u003c/text>\u003ctext x=\"68\" y=\"142\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">D1\u003c/text>\u003ctext x=\"219\" y=\"70\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG0: N ∥ P\u003c/text>\u003ctext x=\"219\" y=\"142\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG1: N ∥ P\u003c/text>\u003ctext x=\"219\" y=\"23\" fill=\"#fda4af\" font-size=\"13\" text-anchor=\"middle\">N: S̄  ·  P: S\u003c/text>\u003ctext x=\"219\" y=\"96\" fill=\"#fda4af\" font-size=\"13\" text-anchor=\"middle\">N: S  ·  P: S̄\u003c/text>\u003ctext x=\"503\" y=\"107\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"293\" y=\"181\" fill=\"#94a3b8\" font-size=\"13\" text-anchor=\"middle\">S = 0 selects D0.   S = 1 selects D1.\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q14","subject":"cmos","unit":3,"number":14,"q":"Explain pass-transistor logic. What are its drawbacks? How does a transmission gate overcome them?","ans":{"s":"A pass NMOS passes a good 0 and a weak 1 ≈VDD−VT. A PMOS does the reverse. A parallel TG restores both rails.","m":"Pass-transistor logic steers the input signal through a controlled channel. NMOS conduction weakens as a passed high raises the receiving node and reduces VGS. A PMOS has the complementary weak-low behavior.","d":"Connect the data to one channel terminal and use the gate as enable. An NMOS enabled by VDD drives a low strongly. For a high, the receiving node rises until VGS approaches VTn, giving about VDD−VTn, often lower with body effect. A PMOS with gate low passes a high strongly but cannot readily pass a full low. Degraded levels lower noise margin and can cause DC overlap current in a following inverter. Floating internal nodes, charge sharing and accumulated delay are additional risks. Use a restoring stage or a CMOS transmission gate with complementary controls for full swing."}}]},{"title":"CMOS Technologies and CMOS Design Rules","questions":[{"id":"cmos-u4-q1","subject":"cmos","unit":4,"number":1,"q":"Explain the n-well CMOS fabrication process step by step with neat diagrams.","ans":{"s":"p wafer → n-well/isolation → gate oxide/poly → implants → contacts, metal, passivation.","m":"Place PMOS inside an n-well and NMOS in p material. Define active areas and gates, implant self-aligned n+ and p+ junctions, then connect devices through contacts and metals.","d":"Use an n-well mask on the p wafer, implant donors and anneal to form the PMOS well. Define isolated active areas with STI or field oxide. Grow thin dielectric and pattern polysilicon. Mask and implant n+ NMOS source/drain and well taps, then p+ PMOS source/drain and substrate taps. Gate edges self-align the junctions. Add spacers, activation and silicide per the process. Deposit dielectric, open contacts and pattern metal. Repeat via/metal layers, finish with passivation and pad openings. Tie n-well to VDD and p body to VSS.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 95\" role=\"img\" aria-label=\"Planar CMOS fabrication sequence\" style=\"display:block;width:100%;height:auto;max-width:680px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Planar CMOS fabrication sequence\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"679\" height=\"94\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"13\" y=\"32\" width=\"143\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"182\" y=\"32\" width=\"143\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"351\" y=\"32\" width=\"143\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"520\" y=\"32\" width=\"146\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M156 49 H182 l-6 -4 m6 4 -6 4 M325 49 H351 l-6 -4 m6 4 -6 4 M494 49 H520 l-6 -4 m6 4 -6 4\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ctext x=\"84\" y=\"53\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Well &amp; isolation\u003c/text>\u003ctext x=\"252\" y=\"53\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Gate oxide &amp; poly\u003c/text>\u003ctext x=\"421\" y=\"53\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+ and n+ implants\u003c/text>\u003ctext x=\"594\" y=\"53\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Contacts &amp; metal\u003c/text>\u003c/svg>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 700 240\" role=\"img\" aria-label=\"n-well CMOS inverter cross-section\" style=\"display:block;width:100%;height:auto;max-width:700px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>n-well CMOS inverter cross-section\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"699\" height=\"239\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"47\" y=\"122\" width=\"606\" height=\"91\" fill=\"#34283c\" stroke=\"#a78bfa\" rx=\"2\"/>\u003crect x=\"62\" y=\"122\" width=\"318\" height=\"71\" fill=\"#1c3455\" stroke=\"#60a5fa\" rx=\"2\"/>\u003crect x=\"79\" y=\"124\" width=\"44\" height=\"30\" fill=\"#1c4962\" stroke=\"#60a5fa\" rx=\"2\"/>\u003crect x=\"151\" y=\"124\" width=\"46\" height=\"30\" fill=\"#473821\" stroke=\"#fbbf24\" rx=\"2\"/>\u003crect x=\"278\" y=\"124\" width=\"46\" height=\"30\" fill=\"#473821\" stroke=\"#fbbf24\" rx=\"2\"/>\u003crect x=\"416\" y=\"124\" width=\"46\" height=\"30\" fill=\"#14513a\" stroke=\"#4ade80\" rx=\"2\"/>\u003crect x=\"538\" y=\"124\" width=\"46\" height=\"30\" fill=\"#14513a\" stroke=\"#4ade80\" rx=\"2\"/>\u003crect x=\"600\" y=\"124\" width=\"40\" height=\"30\" fill=\"#473821\" stroke=\"#fbbf24\" rx=\"2\"/>\u003crect x=\"200\" y=\"119\" width=\"73\" height=\"5\" fill=\"#165464\" stroke=\"#5eead4\" rx=\"2\"/>\u003crect x=\"465\" y=\"119\" width=\"70\" height=\"5\" fill=\"#165464\" stroke=\"#5eead4\" rx=\"2\"/>\u003crect x=\"200\" y=\"103\" width=\"73\" height=\"16\" fill=\"#482638\" stroke=\"#fb7185\" rx=\"2\"/>\u003crect x=\"465\" y=\"103\" width=\"70\" height=\"16\" fill=\"#482638\" stroke=\"#fb7185\" rx=\"2\"/>\u003cpath d=\"M101 124 V49 H174 V124 M561 124 V49 H620 V124 M301 124 V69 H439 V124\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M236 103 V88 H500 V103\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ctext x=\"137\" y=\"43\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"591\" y=\"43\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"370\" y=\"62\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"367\" y=\"83\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">VIN\u003c/text>\u003ctext x=\"101\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"174\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"301\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"440\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"561\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"620\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"220\" y=\"179\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n-well · PMOS\u003c/text>\u003ctext x=\"510\" y=\"194\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p substrate · NMOS\u003c/text>\u003ctext x=\"101\" y=\"170\" fill=\"#60a5fa\" font-size=\"10\" text-anchor=\"middle\">well tap\u003c/text>\u003ctext x=\"620\" y=\"170\" fill=\"#fbbf24\" font-size=\"10\" text-anchor=\"middle\">body tap\u003c/text>\u003ctext x=\"350\" y=\"229\" fill=\"#94a3b8\" font-size=\"11\" text-anchor=\"middle\">Gate oxide separates the polysilicon and silicon\u003c/text>\u003c/svg>"}},{"id":"cmos-u4-q2","subject":"cmos","unit":4,"number":2,"q":"Draw and explain the cross-section of a CMOS inverter.","ans":{"s":"PMOS p+ in n-well at VDD. NMOS n+ in p substrate at VSS. Gates common, drains common.","m":"Draw the p+ PMOS junctions inside n-well and n+ NMOS junctions outside it. Show thin oxide under each gate. Connect gates to VIN and drains to VOUT.","d":"The p-type substrate contains an n-well around the PMOS. Draw each gate between its source and drain above a thin gate dielectric. Tie PMOS source and n+ well tap to VDD. Tie NMOS source and p+ body tap to VSS. Contact the two drains and join them by metal as VOUT. Connect the polysilicon gates as VIN. Show isolated active regions and interlayer dielectric between metal and silicon except at each cut.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 700 240\" role=\"img\" aria-label=\"n-well CMOS inverter cross-section\" style=\"display:block;width:100%;height:auto;max-width:700px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>n-well CMOS inverter cross-section\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"699\" height=\"239\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"47\" y=\"122\" width=\"606\" height=\"91\" fill=\"#34283c\" stroke=\"#a78bfa\" rx=\"2\"/>\u003crect x=\"62\" y=\"122\" width=\"318\" height=\"71\" fill=\"#1c3455\" stroke=\"#60a5fa\" rx=\"2\"/>\u003crect x=\"79\" y=\"124\" width=\"44\" height=\"30\" fill=\"#1c4962\" stroke=\"#60a5fa\" rx=\"2\"/>\u003crect x=\"151\" y=\"124\" width=\"46\" height=\"30\" fill=\"#473821\" stroke=\"#fbbf24\" rx=\"2\"/>\u003crect x=\"278\" y=\"124\" width=\"46\" height=\"30\" fill=\"#473821\" stroke=\"#fbbf24\" rx=\"2\"/>\u003crect x=\"416\" y=\"124\" width=\"46\" height=\"30\" fill=\"#14513a\" stroke=\"#4ade80\" rx=\"2\"/>\u003crect x=\"538\" y=\"124\" width=\"46\" height=\"30\" fill=\"#14513a\" stroke=\"#4ade80\" rx=\"2\"/>\u003crect x=\"600\" y=\"124\" width=\"40\" height=\"30\" fill=\"#473821\" stroke=\"#fbbf24\" rx=\"2\"/>\u003crect x=\"200\" y=\"119\" width=\"73\" height=\"5\" fill=\"#165464\" stroke=\"#5eead4\" rx=\"2\"/>\u003crect x=\"465\" y=\"119\" width=\"70\" height=\"5\" fill=\"#165464\" stroke=\"#5eead4\" rx=\"2\"/>\u003crect x=\"200\" y=\"103\" width=\"73\" height=\"16\" fill=\"#482638\" stroke=\"#fb7185\" rx=\"2\"/>\u003crect x=\"465\" y=\"103\" width=\"70\" height=\"16\" fill=\"#482638\" stroke=\"#fb7185\" rx=\"2\"/>\u003cpath d=\"M101 124 V49 H174 V124 M561 124 V49 H620 V124 M301 124 V69 H439 V124\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M236 103 V88 H500 V103\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ctext x=\"137\" y=\"43\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"591\" y=\"43\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"370\" y=\"62\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"367\" y=\"83\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">VIN\u003c/text>\u003ctext x=\"101\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"174\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"301\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"440\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"561\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"620\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"220\" y=\"179\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n-well · PMOS\u003c/text>\u003ctext x=\"510\" y=\"194\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p substrate · NMOS\u003c/text>\u003ctext x=\"101\" y=\"170\" fill=\"#60a5fa\" font-size=\"10\" text-anchor=\"middle\">well tap\u003c/text>\u003ctext x=\"620\" y=\"170\" fill=\"#fbbf24\" font-size=\"10\" text-anchor=\"middle\">body tap\u003c/text>\u003ctext x=\"350\" y=\"229\" fill=\"#94a3b8\" font-size=\"11\" text-anchor=\"middle\">Gate oxide separates the polysilicon and silicon\u003c/text>\u003c/svg>"}},{"id":"cmos-u4-q3","subject":"cmos","unit":4,"number":3,"q":"Explain the lambda-based layout design rules for a CMOS process.","ans":{"s":"Lambda rules use kλ for widths, spacings and enclosures. Check DRC.","m":"Use the deck-defined λ, often half a representative minimum gate length. Express minimum widths, layer spacing, contact overlap, well enclosure and extensions as multiples of λ.","d":"Set λ from the technology or teaching deck. Dimension poly/active/metal widths and spacing, poly extension beyond active, well enclosure and contact/via enclosure. A poly-over-active crossing defines a transistor, and metal connects to active only through a cut. A common example uses a 2λ contact cut and 3λ Metal1 minimum width. Use actual foundry rules for fabrication. DRC verifies geometry and LVS verifies netlist connectivity."}},{"id":"cmos-u4-q4","subject":"cmos","unit":4,"number":4,"q":"Draw the layout of a CMOS inverter and a 2-input NAND and NOR gate. Explain the layers used.","ans":{"s":"PMOS above NMOS, metal rails, common poly inputs. NAND shares series n-active; NOR shares series p-active.","m":"Draw top and bottom supply rails, p-active inside n-well, n-active below, and vertical poly inputs. Route shared active nodes with contacts and metal to create the series and parallel branches.","d":"Draw VDD and VSS in Metal1 and enclose p-active in an n-well. Each poly/active crossing forms a gate. Inverter: connect sources to rails and drains to Y. NAND2: leave the middle n diffusion uncontacted for the series node; connect both p ends to VDD and center to Y. NOR2: leave middle p diffusion uncontacted for series; connect n outer nodes to VSS and center to Y. Add well/body taps and size every layer and cut enclosure per process rules. Check DRC and LVS.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 202\" role=\"img\" aria-label=\"INV stick diagram\" style=\"display:block;width:100%;height:auto;max-width:300px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>INV stick diagram\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"299\" height=\"201\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"50\" y=\"40\" width=\"170\" height=\"48\" fill=\"#22203a\" stroke=\"#a78bfa\" rx=\"2\"/>\u003cpath d=\"M37 24 H258 M37 181 H258\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 62 H215\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 143 H215\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M135 47 V159\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M70 24 V62 M70 143 V181 M200 62 V143 M200 102 H250\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"70\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"70\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ctext x=\"252\" y=\"18\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"252\" y=\"196\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"33\" y=\"65\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"33\" y=\"147\" fill=\"#4ade80\" font-size=\"11\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"135\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"166\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">\u003c/text>\u003ctext x=\"272\" y=\"105\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"142\" y=\"18\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">INV\u003c/text>\u003c/svg>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 202\" role=\"img\" aria-label=\"NAND2 stick diagram\" style=\"display:block;width:100%;height:auto;max-width:300px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>NAND2 stick diagram\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"299\" height=\"201\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"50\" y=\"40\" width=\"170\" height=\"48\" fill=\"#22203a\" stroke=\"#a78bfa\" rx=\"2\"/>\u003cpath d=\"M37 24 H258 M37 181 H258\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 62 H215\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 143 H215\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M104 47 V159 M166 47 V159\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M70 24 V62 M200 24 V62 M135 62 V101 H70 V143 M70 101 H250 M200 143 V181\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"70\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"135\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"70\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ctext x=\"252\" y=\"18\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"252\" y=\"196\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"33\" y=\"65\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"33\" y=\"147\" fill=\"#4ade80\" font-size=\"11\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"104\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"166\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">B\u003c/text>\u003ctext x=\"272\" y=\"105\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"142\" y=\"18\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">NAND2\u003c/text>\u003c/svg>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 202\" role=\"img\" aria-label=\"NOR2 stick diagram\" style=\"display:block;width:100%;height:auto;max-width:300px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>NOR2 stick diagram\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"299\" height=\"201\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"50\" y=\"40\" width=\"170\" height=\"48\" fill=\"#22203a\" stroke=\"#a78bfa\" rx=\"2\"/>\u003cpath d=\"M37 24 H258 M37 181 H258\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 62 H215\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 143 H215\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M104 47 V159 M166 47 V159\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M70 24 V62 M200 62 V101 H135 V143 M200 101 H250 M70 143 V181 M200 143 V181\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"70\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"70\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"135\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ctext x=\"252\" y=\"18\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"252\" y=\"196\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"33\" y=\"65\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"33\" y=\"147\" fill=\"#4ade80\" font-size=\"11\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"104\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"166\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">B\u003c/text>\u003ctext x=\"272\" y=\"105\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"142\" y=\"18\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">NOR2\u003c/text>\u003c/svg>"}},{"id":"cmos-u4-q5","subject":"cmos","unit":4,"number":5,"q":"Explain stick diagrams with the colour code. Draw the stick diagrams of a CMOS inverter, 2-input NAND and 2-input NOR gate.","ans":{"s":"Blue metal, red poly, amber p-active, green n-active, violet n-well, white contacts.","m":"Sticks show connectivity instead of exact dimensions. A red poly crossing of active produces a transistor. A white contact connects blue metal to active.","d":"Draw the two blue rails and p-active inside n-well above n-active. Cross both with red poly. Inverter joins its two drains at Y. NAND2 has series n devices with shared uncontacted diffusion and parallel p devices with two rail-connected ends. NOR2 has series p devices and parallel n devices. Different-layer crossings are unconnected except where a relevant contact is drawn. Add the color legend because conventions vary.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 202\" role=\"img\" aria-label=\"INV stick diagram\" style=\"display:block;width:100%;height:auto;max-width:300px;margin:8px auto;font-family:system-ui,sans-serif\" 003c/text>\u003c/svg>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 202\" role=\"img\" aria-label=\"NAND2 stick diagram\" style=\"display:block;width:100%;height:auto;max-width:300px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>NAND2 stick diagram\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"299\" height=\"201\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"50\" y=\"40\" width=\"170\" height=\"48\" fill=\"#22203a\" stroke=\"#a78bfa\" rx=\"2\"/>\u003cpath d=\"M37 24 H258 M37 181 H258\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 62 H215\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 143 H215\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M104 47 V159 M166 47 V159\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M70 24 V62 M200 24 V62 M135 62 V101 H70 V143 M70 101 H250 M200 143 V181\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"70\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"135\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"70\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ctext x=\"252\" y=\"18\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"252\" y=\"196\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"33\" y=\"65\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"33\" y=\"147\" fill=\"#4ade80\" font-size=\"11\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"104\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"166\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">B\u003c/text>\u003ctext x=\"272\" y=\"105\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"142\" y=\"18\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">NAND2\u003c/text>\u003c/svg>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 202\" role=\"img\" aria-label=\"NOR2 stick diagram\" style=\"display:block;width:100%;height:auto;max-width:300px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>NOR2 stick diagram\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"299\" height=\"201\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"50\" y=\"40\" width=\"170\" height=\"48\" fill=\"#22203a\" stroke=\"#a78bfa\" rx=\"2\"/>\u003cpath d=\"M37 24 H258 M37 181 H258\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 62 H215\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 143 H215\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M104 47 V159 M166 47 V159\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M70 24 V62 M200 62 V101 H135 V143 M200 101 H250 M70 143 V181 M200 143 V181\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"70\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"70\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"135\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ctext x=\"252\" y=\"18\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"252\" y=\"196\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"33\" y=\"65\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"33\" y=\"147\" fill=\"#4ade80\" font-size=\"11\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"104\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"166\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">B\u003c/text>\u003ctext x=\"272\" y=\"105\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"142\" y=\"18\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">NOR2\u003c/text>\u003c/svg>"}},{"id":"cmos-u4-q6","subject":"cmos","unit":4,"number":6,"q":"Explain the basic subsystem design for a Boolean expression with one example.","ans":{"s":"Simplify logic, choose cells, derive dual networks, size and verify.","m":"For Z=(AB+C)D make X=¬(AB+C) with AOI21, then use NOR on X and ¬D. Plan shared diffusion and label the interconnects.","d":"Begin from the Boolean function or truth table and simplify. Pick gate decomposition, accounting for output polarity, fanout and library. For Z=(AB+C)D first form X=¬(AB+C) with AOI21, then Z=¬(X+¬D) with inverter and NOR. For each static inverting gate build the NMOS network for output 0 and build the PMOS dual by exchanging series/parallel and device type. Size devices for load and stack resistance, sketch sticks, verify function/timing, and check DRC/LVS."}},{"id":"cmos-u4-q7","subject":"cmos","unit":4,"number":7,"q":"Explain the design of a 2:1 multiplexer as a subsystem and draw its stick diagram.","ans":{"s":"Y=S̄D0+SD1. Two transmission gates share Y. An inverter generates S̄.","m":"Put a complementary MOS pass pair between each data input and Y. TG0 is enabled by S̄ and TG1 by S. Use metal to tie corresponding p and n channel endpoints.","d":"On the D0 side draw p-active with gate S and n-active with gate S̄. Contact and tie the corresponding data ends together as D0 and the opposite ends as Y. On the D1 side use S̄ on p and S on n. Tie those endpoints to D1 and the same Y. Put a static inverter beside the select net. Use separate amber p-active and green n-active, red poly controls, blue metal and white contacts. Add ordinary body and well connections. Since one device carries each extreme strongly, both data paths pass a full-swing signal.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 242\" role=\"img\" aria-label=\"Transmission gate mux stick diagram\" style=\"display:block;width:100%;height:auto;max-width:680px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Transmission gate mux stick diagram\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"679\" height=\"241\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M65 68 H246 M425 68 H606\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 165 H246 M425 165 H606\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M67 68 V165 M604 68 V165 M245 68 V165 M427 68 V165 M245 115 H427 M337 115 V206\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M153 53 V83 M153 149 V181 M515 53 V83 M515 149 V181\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"67\" cy=\"68\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"67\" cy=\"165\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"245\" cy=\"68\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"245\" cy=\"165\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"427\" cy=\"68\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"427\" cy=\"165\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"604\" cy=\"68\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"604\" cy=\"165\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"245\" cy=\"115\" r=\"4\" fill=\"#60a5fa\"/>\u003ccircle cx=\"427\" cy=\"115\" r=\"4\" fill=\"#60a5fa\"/>\u003ccircle cx=\"337\" cy=\"115\" r=\"4\" fill=\"#60a5fa\"/>\u003ctext x=\"45\" y=\"119\" fill=\"#60a5fa\" font-size=\"13\" text-anchor=\"middle\">D0\u003c/text>\u003ctext x=\"627\" y=\"119\" fill=\"#60a5fa\" font-size=\"13\" text-anchor=\"middle\">D1\u003c/text>\u003ctext x=\"337\" y=\"225\" fill=\"#60a5fa\" font-size=\"13\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"153\" y=\"45\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">S to p\u003c/text>\u003ctext x=\"153\" y=\"203\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">S̄ to n\u003c/text>\u003ctext x=\"515\" y=\"45\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">S̄ to p\u003c/text>\u003ctext x=\"515\" y=\"203\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">S to n\u003c/text>\u003ctext x=\"336\" y=\"30\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG0 on for S=0  ·  TG1 on for S=1\u003c/text>\u003ctext x=\"336\" y=\"61\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\">p-active\u003c/text>\u003ctext x=\"336\" y=\"169\" fill=\"#4ade80\" font-size=\"11\" text-anchor=\"middle\">n-active\u003c/text>\u003c/svg>"}},{"id":"cmos-u4-q8","subject":"cmos","unit":4,"number":8,"q":"Explain the design of half adder, full adder and ripple-carry adder. Draw the stick diagram of a CMOS full adder.","ans":{"s":"HA: S=A⊕B, C=AB. FA: P=A⊕B, S=P⊕Cin, Cout=AB+PCin. Chain carry between stages.","m":"Use two half-adders and an OR, or two XORs and a carry MUX. The ripple adder connects each COUT to the next CIN. Worst-case propagation travels through every stage.","d":"A half-adder generates S=A⊕B and C=AB. A full-adder sets P=A⊕B, SUM=P⊕Cin, and COUT=AB+PCin. When P=0, A=B and COUT=A. When P=1, COUT=Cin, so implement carry with a TG MUX selected by P. For a hierarchical stick schematic place two static XOR cells and a TG MUX along shared VDD/VSS rails. Route A and B to XOR1, P and Cin to XOR2, and P, A and Cin to the MUX. Expand each cell using poly crossings of n/p active and contacts to metal. Repeat at each bit and tie COUT of stage i to CIN of stage i+1, starting at the least-significant bit.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 711 238\" role=\"img\" aria-label=\"Hierarchical CMOS full adder stick-routing plan\" style=\"display:block;width:100%;height:auto;max-width:711px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Hierarchical CMOS full adder stick-routing plan\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"710\" height=\"237\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"116\" y=\"46\" width=\"143\" height=\"40\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"346\" y=\"46\" width=\"141\" height=\"40\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"346\" y=\"132\" width=\"141\" height=\"40\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M48 57 H116 M48 76 H116 M259 66 H346 M48 102 H307 V78 H346 M487 66 H614 M281 66 V140 H346 M48 102 V153 H346 M48 57 V190 H319 V164 H346 M487 151 H614\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"281\" cy=\"66\" r=\"4\" fill=\"#60a5fa\"/>\u003ccircle cx=\"48\" cy=\"57\" r=\"4\" fill=\"#60a5fa\"/>\u003ccircle cx=\"48\" cy=\"102\" r=\"4\" fill=\"#60a5fa\"/>\u003ctext x=\"33\" y=\"61\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"33\" y=\"80\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">B\u003c/text>\u003ctext x=\"24\" y=\"106\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Cin\u003c/text>\u003ctext x=\"188\" y=\"70\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Static XOR cell\u003c/text>\u003ctext x=\"417\" y=\"70\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Static XOR cell\u003c/text>\u003ctext x=\"417\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG MUX cell\u003c/text>\u003ctext x=\"278\" y=\"55\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">P\u003c/text>\u003ctext x=\"644\" y=\"70\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">SUM\u003c/text>\u003ctext x=\"644\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">COUT\u003c/text>\u003ctext x=\"358\" y=\"217\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">COUT selects Cin when P=1 and A when P=0\u003c/text>\u003c/svg>"}},{"id":"cmos-u4-q9","subject":"cmos","unit":4,"number":9,"q":"Explain the design of a shift register using CMOS. Draw the stick diagram of a D flip- flop.","ans":{"s":"Positive-edge DFF = low-transparent master + high-transparent slave. Chain Q→D to shift.","m":"Use a pair of opposite-phase transmission-gate latches. The master tracks D while CLK is low. On the rising edge master holds and slave passes the stored value to Q.","d":"Each latch contains an input TG, two cascaded inverters and a feedback TG from the latch output to the first inverter input. For the master, enable input on CLK=0 and feedback on CLK=1. For the slave, enable input on CLK=1 and feedback on CLK=0. Draw each TG as parallel p/n active channels with complementary clock poly. Use aligned power rails for the inverters and metal for local feedback and latch-to-latch nets. Tie each flip-flop's Q to the next D. On a rising edge the register moves all stored bits one position, subject to setup, hold and clock skew.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 735 255\" role=\"img\" aria-label=\"Master–slave transmission gate flip-flop stick-routing plan\" style=\"display:block;width:100%;height:auto;max-width:735px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Master–slave transmission gate flip-flop stick-routing plan\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"734\" height=\"254\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"66\" y=\"74\" width=\"65\" height=\"35\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"167\" y=\"74\" width=\"67\" height=\"35\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"272\" y=\"74\" width=\"67\" height=\"35\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"376\" y=\"74\" width=\"65\" height=\"35\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"474\" y=\"74\" width=\"66\" height=\"35\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"578\" y=\"74\" width=\"66\" height=\"35\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"174\" y=\"162\" width=\"65\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"481\" y=\"162\" width=\"65\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M43 91 H66 M131 91 H167 M234 91 H272 M339 91 H376 M441 91 H474 M540 91 H578 M644 91 H688 M145 91 V178 H174 M239 178 H354 V91 M454 91 V178 H481 M546 178 H660 V91\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"145\" cy=\"91\" r=\"4\" fill=\"#60a5fa\"/>\u003ccircle cx=\"354\" cy=\"91\" r=\"4\" fill=\"#60a5fa\"/>\u003ccircle cx=\"454\" cy=\"91\" r=\"4\" fill=\"#60a5fa\"/>\u003ccircle cx=\"660\" cy=\"91\" r=\"4\" fill=\"#60a5fa\"/>\u003ctext x=\"29\" y=\"95\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">D\u003c/text>\u003ctext x=\"704\" y=\"95\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Q\u003c/text>\u003ctext x=\"99\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG\u003c/text>\u003ctext x=\"200\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">INV\u003c/text>\u003ctext x=\"306\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">INV\u003c/text>\u003ctext x=\"407\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG\u003c/text>\u003ctext x=\"507\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">INV\u003c/text>\u003ctext x=\"612\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">INV\u003c/text>\u003ctext x=\"207\" y=\"183\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG\u003c/text>\u003ctext x=\"513\" y=\"183\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG\u003c/text>\u003ctext x=\"99\" y=\"59\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">CLK̄\u003c/text>\u003ctext x=\"407\" y=\"59\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">CLK\u003c/text>\u003ctext x=\"209\" y=\"214\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">FB on CLK\u003c/text>\u003ctext x=\"516\" y=\"214\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">FB on CLK̄\u003c/text>\u003ctext x=\"211\" y=\"29\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Master latch\u003c/text>\u003ctext x=\"525\" y=\"29\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Slave latch\u003c/text>\u003ctext x=\"364\" y=\"238\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">The p gate in each TG takes the complement of its enable.\u003c/text>\u003c/svg>"}},{"id":"cmos-u4-q10","subject":"cmos","unit":4,"number":10,"q":"Explain the CMOS enhancement process (twin-tub, SOI). Compare it with the conventional CMOS process.","ans":{"s":"Bulk n-well engineers PMOS well. Twin-tub engineers both wells. SOI has a buried oxide.","m":"Twin-tub separately dopes n-well and p-well to adjust both device types. SOI places transistors in a thin silicon layer above an insulating oxide, reducing junction capacitance and substrate interaction.","d":"Conventional n-well CMOS builds NMOS in a p substrate and PMOS in n-well. A twin-tub process creates independently engineered n and p tubs, often in an epitaxial layer, permitting separate optimization of thresholds, body behavior and latch-up-related parameters at extra process complexity. SOI places the active silicon film on buried oxide, reducing parasitic junction capacitance, substrate coupling and conventional bulk latch-up paths. Partially depleted SOI may exhibit floating-body effects. Fully depleted SOI offers stronger electrostatics and can support back bias. SOI wafer cost and self-heating also matter."}},{"id":"cmos-u4-q11","subject":"cmos","unit":4,"number":11,"q":"Draw the stick diagram of a 2-input CMOS NAND gate and explain the colour-coding convention used.","ans":{"s":"NAND stick: n-active in series, p-active with both ends VDD and center Y.","m":"Two red poly inputs cross both active strips. The n row is series Y-to-VSS. The p row creates two parallel pull-ups between center Y and rail-tied ends.","d":"Draw blue power rails, p-active inside the violet n-well and n-active below. Cross both with A/B red poly. Tie outer p contacts to VDD, center p contact to Y, and the n terminal contacts to Y and VSS. Leave the n center uncontacted. White contacts connect metal and active. Use well and substrate taps in finished layout.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 202\" role=\"img\" aria-label=\"NAND2 stick diagram\" style=\"display:block;width:100%;height:auto;max-width:300px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>NAND2 stick diagram\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"299\" height=\"201\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"50\" y=\"40\" width=\"170\" height=\"48\" fill=\"#22203a\" stroke=\"#a78bfa\" rx=\"2\"/>\u003cpath d=\"M37 24 H258 M37 181 H258\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 62 H215\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 143 H215\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M104 47 V159 M166 47 V159\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M70 24 V62 M200 24 V62 M135 62 V101 H70 V143 M70 101 H250 M200 143 V181\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"70\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"135\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"70\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ctext x=\"252\" y=\"18\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"252\" y=\"196\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"33\" y=\"65\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"33\" y=\"147\" fill=\"#4ade80\" font-size=\"11\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"104\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"166\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">B\u003c/text>\u003ctext x=\"272\" y=\"105\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"142\" y=\"18\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">NAND2\u003c/text>\u003c/svg>"}},{"id":"cmos-u4-q12","subject":"cmos","unit":4,"number":12,"q":"Explain the n-well CMOS fabrication process step by step with neat cross-sectional diagrams.","ans":{"s":"p wafer → n-well/isolation → gate oxide/poly → implants → contacts, metal, passivation.","m":"Place PMOS inside an n-well and NMOS in p material. Define active areas and gates, implant self-aligned n+ and p+ junctions, then connect devices through contacts and metals.","d":"Use an n-well mask on the p wafer, implant donors and anneal to form the PMOS well. Define isolated active areas with STI or field oxide. Grow thin dielectric and pattern polysilicon. Mask and implant n+ NMOS source/drain and well taps, then p+ PMOS source/drain and substrate taps. Gate edges self-align the junctions. Add spacers, activation and silicide per the process. Deposit dielectric, open contacts and pattern metal. Repeat via/metal layers, finish with passivation and pad openings. Tie n-well to VDD and p body to VSS.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 95\" role=\"img\" aria-label=\"Planar CMOS fabrication sequence\" style=\"display:block;width:100%;height:auto;max-width:680px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Planar CMOS fabrication sequence\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"679\" height=\"94\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"13\" y=\"32\" width=\"143\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"182\" y=\"32\" width=\"143\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"351\" y=\"32\" width=\"143\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"520\" y=\"32\" width=\"146\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M156 49 H182 l-6 -4 m6 4 -6 4 M325 49 H351 l-6 -4 m6 4 -6 4 M494 49 H520 l-6 -4 m6 4 -6 4\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ctext x=\"84\" y=\"53\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Well &amp; isolation\u003c/text>\u003ctext x=\"252\" y=\"53\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Gate oxide &amp; poly\u003c/text>\u003ctext x=\"421\" y=\"53\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+ and n+ implants\u003c/text>\u003ctext x=\"594\" y=\"53\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Contacts &amp; metal\u003c/text>\u003c/svg>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 700 240\" role=\"img\" aria-label=\"n-well CMOS i
