facturing teams. Release reproducible layout, constraints and sign-off results for the assigned block or die. Verify timing again after every late change.","d":"Setup and coordination: Maintain the design database, constraints, technology views and tool scripts. Resolve inconsistent pins, library versions and clock or power definitions with RTL, STA, DFT and IP teams.\nFloorplanning: Estimate die area, core utilization and shape. Place hard macros and I/O, check pin access and reserve channels, halos and metal for power delivery.\nPlace, clock and route: Optimize cell placement for timing and congestion, legalize it and build a robust clock tree. Guide global routing and fix detailed routing violations.\nClosure: Analyze setup/hold at required corners and check clock skew, timing transitions and fanout limits. Diagnose parasitic effects, IR drop and electromigration.\nECOs: Choose targeted sizing, buffering, topology or logic changes and verify equivalence where required. Recheck masks, parasitics and power after changes.\nVerification and handoff: Run DRC/LVS, antenna, density and other applicable checks. Produce reproducible runs, explain trade-offs in review and release the approved layout and reports.\nAccountability: Work with package and foundry teams to resolve integration limits, timing budgets, release criteria and tapeout issues."}},{"id":"soc-u5-q6","subject":"soc","unit":5,"number":6,"q":"Enlist and explain different Synopsys Design Constraints(SDC).","ans":{"s":"SDC defines clocks, I/O timing, clock uncertainty, design limits and timing exceptions. Validate timing coverage and every exception.","m":"Clocks: create_clock defines a waveform and period. create_generated_clock describes derived clocks. set_clock_uncertainty adds margin.\nInterfaces: set_input_delay and set_output_delay describe external timing. Specify minimum and maximum where applicable. Input transition and output load model electrical conditions.\nExceptions: Apply false paths, multicycle paths and clock groups only with functional justification.\nValidation: Check clock reports, endpoints and exceptions in every mode. At 100 MHz, the primary period is 10 ns.","d":"Purpose: Synopsys Design Constraints is a Tcl-based format for describing timing assumptions and implementation limits. Full constraints identify clocks, external budgets, exceptions and environment information.\nClock definition: create_clock sets period and waveform for a source. create_generated_clock relates a divided or otherwise derived clock to its parent. set_clock_uncertainty reserves margin for variation or jitter.\nI/O timing: set_input_delay gives external launch/arrival bounds and set_output_delay models timing required by external capture circuitry. Define both minimum and maximum where applicable.\nElectrical context: set_input_transition and set_load describe incoming slew and external capacitance. Design limits such as set_max_transition and set_max_capacitance can guide optimization and validation.\nExceptions: set_clock_groups defines relationships such as asynchronous clock families. set_false_path excludes a justified path from normal timing checks. set_multicycle_path changes cycle assumptions. Review setup and hold implications together.\nExample: A 100 MHz input clock has a 10 ns period, and a divide-by-two derived clock has a 20 ns period. The board/peripheral budget supplies independent I/O timing values.\nValidation: Report clocks, exceptions and unconstrained endpoints in each mode. Confirm that named ports and pins resolve to the intended design objects.","code":{"lang":"tcl","s":"Define the primary and derived clocks\nSet the external input and output timing budgets\nApply only justified path exceptions\nReview coverage and slack","m":"# Time units follow the timing tool / library environment.\ncreate_clock -name sys -period 10 [get_ports clk]\nset_input_delay -clock [get_clocks sys] -max 2.0 [get_ports din]\nset_output_delay -clock [get_clocks sys] -max 2.0 [get_ports dout]","d":"# Example with nanosecond time units and 100 MHz primary clock.\ncreate_clock -name sys -period 10.0 -waveform {0.0 5.0} [get_ports clk]\ncreate_generated_clock -name sys_div2 -source [get_ports clk] \\\n    -divide_by 2 [get_pins u_div/q]\nset_clock_uncertainty 0.10 [get_clocks sys]\n\n# The external interface budget determines both max and min.\nset_input_delay  -clock [get_clocks sys] -max 2.00 [get_ports din]\nset_input_delay  -clock [get_clocks sys] -min 0.50 [get_ports din]\nset_output_delay -clock [get_clocks sys] -max 2.00 [get_ports dout]\nset_output_delay -clock [get_clocks sys] -min -0.20 [get_ports dout]\n\n# Confirm the objects exist and review timing coverage after loading.\n# Apply false paths or multicycle paths only per interface intent."}}},{"id":"soc-u5-q7","subject":"soc","unit":5,"number":7,"q":"Discuss different inputs for Physical Design.","ans":{"s":"Inputs include netlist, SDC, Liberty, tech/cell/macro LEF, GDS/OASIS views, UPF, RC tech, package data and sign-off rule decks.","m":"Logical/timing: Gate netlist supplies connectivity. SDC supplies timing intent and Liberty provides cell characteristics at relevant corners.\nPhysical: Technology LEF covers layers, vias and sites. Cell/macro LEF covers geometry, pins and obstructions. Package/bump data guide I/O.\nProcess and power: Load UPF, extraction technology, layout views and foundry physical-check decks. Confirm library, netlist, units and pin consistency before implementation. Include foundry-approved macro layouts for final stream-out.","d":"Connectivity: A structural gate-level netlist defines hierarchy, instances and nets. Include test structures and explicit power/ground connectivity as required by implementation methodology.\nTiming and constraints: Liberty views characterize functions, timing, power and loads at PVT corners. SDC specifies clocks, I/O assumptions, limits and valid exceptions. Multiple operating modes may have distinct constraints.\nPhysical abstracts: Technology LEF describes layers, vias and sites. Standard-cell and macro LEF describe outlines, routing pins and obstructions. Fixed placements and package data constrain geometry.\nPower intent: UPF or equivalent data identifies domains, supplies, isolation, retention and level shifting. Current estimates and bump/pad constraints guide grid design.\nExtraction and physical checks: RC technology supports parasitic extraction. Foundry DRC, LVS, density and fill data support manufacturing sign-off. GDSII/OASIS macro views supply actual mask geometry for final assembly.\nPackage and system context: Ball/bump assignments, pad requirements and board timing assumptions constrain IO and power. Include applicable die and layer maps.\nConsistency: Check cell and pin names, database units, voltages and corners across views before doing placement or timing work."}},{"id":"soc-u5-q8","subject":"soc","unit":5,"number":8,"q":"Explain different file in brief like Technology Library Files (.lib), LEF and DEF Files.","ans":{"s":"Liberty = timing/power/function. LEF = library/technology physical abstracts. DEF = actual design floorplan, placements, pins and routing.","m":"Liberty (.lib): Electrical/functional view with pin loads, timing arcs, power and corners. Synthesis and STA use it.\nLEF: Technology data define layers, vias and sites. Macro or cell abstracts define outline, pins and obstructions.\nDEF: Design-specific die, rows, instances, pins, nets and current route geometry.\nExample: Liberty describes an inverter’s delay, LEF its footprint and pin access, and DEF the placement and nets of a particular instance.","d":"Liberty purpose: A .lib file describes standard cells and macros functionally and electrically. It includes pins, Boolean functions, capacitances, timing arcs, leakage and internal power information.\nLiberty use: Timing and power tools use characterized tables for output pin delay and slew as functions of input slew and load, with models for relevant process, voltage and temperature. A library may include setup/hold constraints for sequential cells.\nTechnology LEF: Defines routing layer names, directions, geometry rules, vias and standard-cell sites. It gives physical tools the technology-level abstract vocabulary.\nCell or macro LEF: Describes cell size, placement origin, pin polygons and geometric obstructions. The placement and routing tool uses these abstracts to assess fit and pin access.\nDEF: Describes a specific design's die area, rows, components and orientations, pins, regular nets, special nets and routing information according to implementation stage.\nExample: Liberty gives an inverter’s propagation delay, LEF shows its pin access and boundary, and DEF says where a particular inverter instance sits and what nets connect to it.\nRelationship: Detailed layout views supply actual final polygons for stream-out."}},{"id":"soc-u5-q9","subject":"soc","unit":5,"number":9,"q":"Explain in brief Power Planning: Power Mesh/Grid, VDD and VSS Routing","ans":{"s":"Pads/bumps → rings/upper straps → lower rails → cells. Use VDD and VSS grids with robust vias. Verify voltage drop and current density.","m":"Topology: Pads or bumps feed thick VDD/VSS straps, rings or a mesh. Via arrays connect lower cell rails and macro supply pins.\nDesign: Choose width, layer and pitch from current, voltage drop and electromigration limits. Provide a short return network and keep domains separate where required.\nVerify: Use static and dynamic IR/EM analysis with package and activity assumptions. Reinforce hot spots through straps, vias, supply entries or decoupling.","d":"Plan domains: List supply voltages, switched domains, estimated currents, peak activity and available power pads or bumps. Identify paths to both VDD and VSS for each region.\nTop-level distribution: Use wide low-resistance upper metal for straps or a mesh. Rings around a core or macro can offer additional connections. Choose metal layers and pitch based on routing and current budgets.\nLocal connections: Connect vertical and horizontal straps through via arrays. Bring VDD and VSS to lower standard-cell rails and macro pins. Ensure continuity for both supply and return.\nSizing: Evaluate DC voltage drop with ΔV≈IR where applicable and use dynamic simulations for switching droop. Estimate current density in metal and vias against EM limits.\nRefinement: Add supply entries, wider straps, more vias or local decoupling as warranted by analysis. Check hot spots, package resistance and switching current distribution.\nTrade-off: Grid reinforcement reduces available signal tracks and can raise congestion. Reserve physical resources before detailed routing and recheck after ECOs.\nSign-off: Verify domain isolation, connectivity and static/dynamic IR and EM with realistic workloads or worst-case activity."}},{"id":"soc-u5-q10","subject":"soc","unit":5,"number":10,"q":"Explain FPGA Prototyping of SoC before actual physical design.","ans":{"s":"FPGA prototype maps SoC logic to reconfigurable hardware for early boot/software/system tests. Substitute ASIC macros/clocking. ASIC PPA needs its own sign-off.","m":"Port: Map SoC RTL to FPGA LUTs, memories, DSPs and clocks. Replace ASIC-specific macros with suitable models or FPGA resources while preserving firmware-visible interfaces.\nBuild and test: Synthesize, route and program the board. Exercise boot, drivers, peripherals and long workloads and inspect failures with on-chip FPGA debug.\nBenefit and limit: Rapid reprogramming supports early integration and software development. ASIC physical timing, power, area and analog behavior still require sign-off.","d":"Goal: FPGA prototyping runs a functional SoC model in real hardware before ASIC physical design is complete. It allows early firmware, driver, boot and system integration checks.\nPorting: Replace or adapt ASIC SRAM, PLLs, clock gates and hard IP using FPGA resources or functional models while preserving software-visible interfaces and address maps.\nCapacity: Estimate utilization of LUTs, RAMs, DSPs and clock networks. Split across devices or lower clock rates if the full design exceeds resources. Ensure any memory/peripheral bridges preserve the intended protocol.\nBuild: Synthesize the adapted RTL, apply FPGA timing/pin constraints, place and route, generate the bitstream and program the board. Connect required peripherals and external memory.\nDebug: Run boot and workloads, monitor transactions with FPGA debug logic and reproduce failures using targeted RTL simulation when needed.\nAdvantages: Faster execution than many RTL simulations supports extended software tests and real I/O. The reprogrammable platform reduces turnaround after logical fixes.\nLimits: FPGA timing, power, area and analog properties do not substitute for ASIC sign-off. Document adaptation differences and validate final silicon independently."}},{"id":"soc-u5-q11","subject":"soc","unit":5,"number":11,"q":"Discuss in brief various Low Power SOC Techniques.","ans":{"s":"Dynamic: clock gating, activity reduction and DVFS. Leakage: power gating, multi-Vt and memory sleep. UPF describes isolation, retention and level shifting.","m":"Dynamic: P≈αCV²f. Clock gating and operand isolation reduce toggles. DVFS lowers voltage and/or frequency when workload allows.\nLeakage: Power gating turns off idle domains, while high-Vt cells lower leakage on paths with timing slack. SRAM may offer standby states.\nIntegration: Isolation, level shifters and retention handle voltage and power boundaries. Capture intent in UPF and verify shutdown and wake-up sequencing across operating modes. Check worst-case wake-up latency and inrush.","d":"Power components: Dynamic switching power is approximately αCV²f with α the fraction of charging events per cycle. Leakage produces static power in standby and can grow with temperature and process variation.\nClock and activity: Integrated clock gates suppress toggles in idle register banks while maintaining safe clock edges. Operand isolation prevents unnecessary downstream combinational switching.\nDVFS: Lower frequency or supply when workload allows. Separate characterized performance states ensure each chosen voltage supports its clock frequency and required response time.\nLeakage reduction: Power-gate idle domains through sleep switches or select high-threshold cells on noncritical paths. Memory standby options and threshold choices trade leakage against delay and wake-up requirements.\nDomain interfaces: Level shifters connect incompatible voltages, isolation clamps signals from a shut-down domain, and retention flops hold selected state.\nSequencing: For shutdown, safely stop traffic, save state if needed and assert isolation before removing supply. Restore stable power, clocks and state before releasing isolation and resuming operation.\nVerification: Define power domains and strategies in UPF and run low-power simulation and timing analyses across supported modes. Check inrush and wake-up latency."}}]}]}],"figures":{"cmos-u1-q1":"\u003cfigure class=\"study external-fig\">\u003cimg loading=\"lazy\" referrerpolicy=\"no-referrer\" src=\"https://upload.wikimedia.org/wikipedia/commons/1/1c/MOSFET_Structure.svg\" alt=\"MOSFET structure\">\u003cfigcaption>MOSFET structure · Brews ohare and BentSm · \u003ca href=\"https://commons.wikimedia.org/wiki/File:MOSFET_Structure.svg\" target=\"_blank\" rel=\"noopener\">Wikimedia Commons\u003c/a> · \u003ca href=\"https://creativecommons.org/licenses/by-sa/3.0/\" target=\"_blank\" rel=\"noopener\">CC BY-SA 3.0\u003c/a>\u003c/figcaption>\u003c/figure>","cmos-u1-q3":"\u003cfigure class=\"study external-fig\">\u003cimg loading=\"lazy\" referrerpolicy=\"no-referrer\" src=\"https://upload.wikimedia.org/wikipedia/commons/8/8c/MOSFET_enhancement-mode_n-channel.svg\" alt=\"Enhancement NMOS transfer and output characteristics\">\u003cfigcaption>Enhancement NMOS transfer and output characteristics · Phirosiberia · \u003ca href=\"https://commons.wikimedia.org/wiki/File:MOSFET_enhancement-mode_n-channel.svg\" target=\"_blank\" rel=\"noopener\">Wikimedia Commons\u003c/a> · \u003ca href=\"https://creativecommons.org/licenses/by-sa/3.0/\" target=\"_blank\" rel=\"noopener\">CC BY-SA 3.0\u003c/a>\u003c/figcaption>\u003c/figure>","mca-u2-q2":"\u003cfigure class=\"study\">\u003cdiv class=\"diagram\">\u003csvg viewBox=\"0 0 622 170\" role=\"img\" aria-label=\"Multiplexed external bus and address latch\">\u003crect x=\"10\" y=\"12\" width=\"126\" height=\"146\" rx=\"6\" fill=\"#141d22\" stroke=\"#4b6570\"/>\u003ctext x=\"73.0\" y=\"89.0\" text-anchor=\"middle\" fill=\"#b7d6ff\" font-size=\"12\">\u003ctspan x=\"73.0\" dy=\"0\">8051\u003c/tspan>\u003c/text>\u003crect x=\"486\" y=\"12\" width=\"126\" height=\"146\" rx=\"6\" fill=\"#141d22\" stroke=\"#4b6570\"/>\u003ctext x=\"549.0\" y=\"81.0\" text-anchor=\"middle\" fill=\"#b7d6ff\" font-size=\"12\">\u003ctspan x=\"549.0\" dy=\"0\">External memory\u003c/tspan>\u003ctspan x=\"549.0\" dy=\"17\">and latch\u003c/tspan>\u003c/text>\u003ctext x=\"311\" y=\"27\" text-anchor=\"middle\" fill=\"#dce9dc\" font-size=\"11\">\u003ctspan x=\"311\" dy=\"0\">P0 AD[7:0] ↔ data, also to latch D\u003c/tspan>\u003c/text>\u003cpath d=\"M136,32 L486,32\" fill=\"none\" stroke=\"#8eb09e\" stroke-width=\"1.5\"/>\u003cpath d=\"M480.03,28.34 L486,32 L480.03,35.66\" fill=\"none\" stroke=\"#8eb09e\" stroke-width=\"1.5\"/>\u003cpath d=\"M486,32 L136,32\" fill=\"none\" stroke=\"#8eb09e\" stroke-width=\"1.5\"/>\u003cpath d=\"M141.97,35.66 L136,32 L141.97,28.34\" fill=\"none\" stroke=\"#8eb09e\" stroke-width=\"1.5\"/>\u003ctext x=\"311\" y=\"59\" text-anchor=\"middle\" fill=\"#dce9dc\" font-size=\"11\">\u003ctspan x=\"311\" dy=\"0\">ALE → latch enable, latch Q → A[7:0]\u003c/tspan>\u003c/text>\u003cpath d=\"M136,64 L486,64\" fill=\"none\" stroke=\"#8eb09e\" stroke-width=\"1.5\"/>\u003cpath d=\"M480.03,60.34 L486,64 L480.03,67.66\" fill=\"none\" stroke=\"#8eb09e\" stroke-width=\"1.5\"/>\u003ctex hin outline","Can resize or reshape subject to constraints"],["Pin planning","Work within existing edges and keep-outs","Recheck pin access and package constraints when shape changes"]],"truth":false},"soc-u5-q3":{"caption":"SoC front-end and back-end","header":["Aspect","Front-end","Back-end"],"rows":[["Main concern","Functional behavior and logical design","Physical realization and signoff"],["Typical tasks","Specification, RTL, verification, synthesis and logical checks","Floorplan, power, placement, CTS, routing and extraction"],["Handoff","Mapped netlist and design intent/constraints","Verified layout database and signoff deliverables"],["Quality checks","Function, coverage, equivalence and constraint completeness","Timing, power integrity, DRC and LVS"]],"truth":false},"soc-u5-q8":{"caption":"Physical-design file formats","header":["File","Contents","Use"],"rows":[["Liberty (.lib)","Cell functions, timing, power and operating conditions","Synthesis and timing/power analysis"],["LEF","Technology routing layers and/or cell and macro abstracts","Placement and routing models"],["DEF","Design-specific floorplan, placement, nets and routing","Exchange physical state of a particular design"]],"truth":false}}}</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById("study-data").textContent);
const subjects=data.subjects;
const modes={d:"Detailed",m:"Medium",s:"Abstracted"};
const localModes={d:["D","Detailed"],m:["M","Medium"],s:["A","Abstracted"]};
let focusMode=false;
let globalMode="m";
const overrides=new Map();
const items=subjects.flatMap(subject=>subject.units.flatMap(unit=>unit.questions));
const byId=new Map(items.map(item=>[item.id,item]));
const subjectById=new Map(subjects.map(subject=>[subject.id,subject]));
const app=document.getElementById("app");
const global=document.getElementById("global");
const query=document.getElementById("search");
const clear=document.getElementById("clear");
const results=document.getElementById("results");
const resultCount=document.getElementById("result-count");
const list=document.getElementById("search-list");
const jump=document.getElementById("jump");
const focusToggle=document.getElementById("focus-toggle");
const themePicker=document.getElementById("theme-picker");
const themeStorageKey="sem5-spotlight";
const spotlightChoices=new Set(["amber","teal","indigo","rose","slate"]);
function applySpotlight(value,save=false){
 const theme=spotlightChoices.has(value)?value:"amber";
 document.documentElement.dataset.spotlight=theme;
 for(const radio of themePicker.querySelectorAll('input[name="spotlight"]'))radio.checked=radio.value===theme;
 if(save){
  try{localStorage.setItem(themeStorageKey,theme);}catch{}
 }
}
let savedSpotlight;
try{savedSpotlight=localStorage.getItem(themeStorageKey);}catch{}
applySpotlight(savedSpotlight);
themePicker.addEventListener("change",event=>{
 if(event.target.matches('input[name="spotlight"]'))applySpotlight(event.target.value,true);
});
const unitNav=document.getElementById("unit-nav");
const topBar=document.querySelector(".top");
if(typeof ResizeObserver!=="undefined"){
 const syncNavHeight=()=>document.documentElement.style.setProperty("--nav-height",topBar.offsetHeight+"px");
 new ResizeObserver(syncNavHeight).observe(topBar);
 syncNavHeight();
}
let visibleSubject="", matches=[], activeMatch=-1;
const icon={cmos:'<path d="M2 13h5l2-6 4 12 2-6h7"/>',asic:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 1v5m6-5v5M9 18v5m6-5v5M1 9h5m-5 6h5m12-6h5m-5 6h5"/>',mca:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m7 9 3 3-3 3m6 0h4"/>',soc:'<rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M9 6h6M6 9v6m12-6v6m-9 3h6"/>'};
const esc=value=>String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const symbols={
 VGS:["V","GS"], vgs:["v","gs"], VDS:["V","DS"], vds:["v","ds"], VSB:["V","SB"], VBS:["V","BS"],
 VT:["V","T"], VTH:["V","TH"], VOV:["V","OV"], VDD:["V","DD"], VSS:["V","SS"],
 VIN:["V","IN"], VOUT:["V","OUT"], VM:["V","M"], VIL:["V","IL"], VIH:["V","IH"], VOL:["V","OL"], VOH:["V","OH"],
 NML:["NM","L"], NMH:["NM","H"], ID:["I","D"], IS:["I","S"], IREF:["I","REF"],
 Iref:["I","ref"], Iout:["I","out"], Ileak:["I","leak"], ISS:["I","SS"], Itail:["I","tail"],
 CL:["C","L"], Cc:["C","c"], Cox:["C","ox"], Cin:["C","in"], Cout:["C","out"], Cload:["C","load"],
 Ctotal:["C","total"], RL:["R","L"], RS:["R","S"], RD:["R","D"],
 gm:["g","m"], gmb:["g","mb"], gds:["g","ds"], gm1:["g","m1"], gm2:["g","m2"], gmn:["g","mn"], gmp:["g","mp"],
 ro:["r","o"], ro1:["r","o1"], ro2:["r","o2"], ron:["r","on"], rop:["r","op"], rout:["r","out"],
 Av:["A","v"], Ad:["A","d"], Acm:["A","cm"], Asupply:["A","supply"], vcm:["v","cm"], vid:["v","id"],
 Psw:["P","sw"], Pstatic:["P","static"], Pdyn:["P","dyn"], Pavg:["P","avg"],
 tp:["t","p"], tpLH:["t","pLH"], tpHL:["t","pHL"], tsetup:["t","setup"], thold:["t","hold"], tCQ:["t","CQ"],
 tdata:["t","data"], Usetup:["U","setup"], Uhold:["U","hold"], Fosc:["F","osc"], FCCO:["F","CCO"],
 gINV:["g","INV"], gNAND2:["g","NAND2"], gNOR2:["g","NOR2"]
};
const compoundSymbols={
 CLVDD:["CL","VDD"], VDDIleak:["VDD","Ileak"], CVDD:["C","VDD"], PCin:["P","Cin"],
 dVOUT:["d","VOUT"], dVIN:["d","VIN"], vgs0:["vgs","0"]
};
function renderSymbol(value){
 const pieces=symbols[value];
 return pieces?'<span class="symbol"><var>'+pieces[0]+'</var><sub>'+pieces[1]+'</sub></span>':esc(value);
}
function inlineSymbols(value){
 let out="",start=0;
 for(const match of value.matchAll(/[A-Za-z][A-Za-z0-9_]*/g)){
  const word=match[0];
  if(!Object.hasOwn(symbols,word)&&!Object.hasOwn(compoundSymbols,word))continue;
  out+=esc(value.slice(start,match.index));
  out+=Object.hasOwn(compoundSymbols,word)?compoundSymbols[word].map(renderSymbol).join(""):renderSymbol(word);
  start=match.index+word.length;
 }
 return out+esc(value.slice(start));
}
const normalize=value=>String(value).normalize("NFKD").toLowerCase().replace(/[\u0300-\u036f]/g,"").replace(/[–—−]/g,"-");
const searchIndex=items.map(item=>{
 const subject=subjectById.get(item.subject);
 const unit=subject.units[item.unit-1];
 const question=normalize(item.q);
 return {item, question, text:normalize([item.q,item.number,item.id,subject.name,subject.code,subject.id,unit.title,item.ans.s,item.ans.m,item.ans.d,...Object.values(item.ans.code||{})].join(" "))};
});
function buttons(mode,label,scope){
 return '<div class="modes" role="group" aria-label="'+esc(label)+'">'+Object.entries(modes).map(([key,name])=>'<button type="button" data-'+scope+'="'+key+'" aria-pressed="'+(key===mode)+'">'+name+'</button>').join("")+'</div>';
}
function questionButtons(item){
 const level=getMode(item);
 return '<div class="modes" role="group" aria-label="Reading level for Unit '+item.unit+' Question '+item.number+'">'+
  Object.entries(localModes).map(([key,[letter,label]])=>{
   const hint=label;
   return '<button type="button" data-local="'+key+'" title="'+hint+'" aria-label="'+label+'" aria-pressed="'+(key===level)+'">'+letter+'</button>';
  }).join("")+'</div>';
}
function updateButtons(element,key,scope){
 element.querySelectorAll("[data-"+scope+"]").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset[scope]===key)));
}
const keywords=new Set("auto bit break case char const continue default do else enum extern for goto if inline int long register return sbit short signed sizeof static struct switch typedef union unsigned void volatile while always assign begin end endmodule module parameter localparam input output inout integer wire reg logic posedge negedge endcase generate endgenerate initial property endproperty assert disable iff sequence endsequence repeat forever wait task endtask function endfunction set create_clock set_input_delay set_output_delay set_false_path set_multicycle_path set_clock_uncertainty setup hold then send read write loop until configure when repeat".split(" "));
const tokenPattern=/(\/\*[\s\S]*?\*\/|\/\/[^\n]*|^[ \t]*#[ \t]*(?:include|define|ifdef|ifndef|endif)[^\n]*|"(?:\\.|[^"\\])*"|(?:\d+)?'[sS]?[bBdDhHoO][\da-fA-FxXzZ?_]+|'(?:\\.|[^'\\])*'|\b(?:0[xX][\da-fA-F]+|\d+(?:\.\d+)?)[uUlL]*\b|\b[a-zA-Z_][\w$]*\b)/gm;
function highlight(raw){
 let out="",start=0;
 for(const token of raw.matchAll(tokenPattern)){
  const value=token[0];
  out+=esc(raw.slice(start,token.index));
  const cls=/^\/[/*]/.test(value)?"c":value.trimStart().startsWith("#")?"p":/^\d|^'[sS]?[bBdDhHoO]/.test(value)?"n":/^['"]/.test(value)?"s":keywords.has(value.toLowerCase())?"k":"";
  out+=cls?'<span class="tok-'+cls+'">'+esc(value)+'</span>':esc(value);
  start=token.index+value.length;
 }
 return out+esc(raw.slice(start));
}
const sentenceSegmenter=typeof Intl.Segmenter==="function"?new Intl.Segmenter("en",{granularity:"sentence"}):null;
const orderedPrefix=/^(\d{1,2})[.)]\s+/;
const bulletPrefix=/^[-•]\s+/;
const subheadPattern=/^([\p{L}\d][\p{L}\d /,&'’()–+-]{1,66})(?:\s·|:)\s+(?=\S)/u;
function formatPoint(value){
 const prefix=value.match(/^(?:\d{1,2}[.)]|\([ivx]+\))\s+/i)?.[0]||"";
 const body=value.slice(prefix.length);
 const heading=body.match(subheadPattern);
 if(!heading||heading[1].split(/\s+/).length>8)return inlineSymbols(value);
 const separator=heading[0].trimEnd().endsWith('·')?' ·':':';
 return esc(prefix)+'<strong class="subhead">'+inlineSymbols(heading[1])+separator+'</strong> '+inlineSymbols(body.slice(heading[0].length));
}
function splitParagraph(paragraph){
 if(!sentenceSegmenter)return [paragraph];
 const sentences=[...sentenceSegmenter.segment(paragraph)].map(({segment})=>segment.trim()).filter(Boolean);
 const hasNewHeading=sentences.slice(1).some(sentence=>subheadPattern.test(sentence));
 if(!hasNewHeading&&(paragraph.length<325||sentences.length<3))return [paragraph];
 const groups=[];
 let current="";
 for(const sentence of sentences){
  if(current && (subheadPattern.test(sentence)||current.length>155||current.length+sentence.length>275)){
   groups.push(current);
   current=sentence;
  }else current+= (current?" ":"")+sentence;
 }
 if(current)groups.push(current);
 return groups;
}
function pointList(points,tag="ul"){
 return '<'+tag+' class="answer-points">'+points.map(point=>'<li>'+formatPoint(point)+'</li>').join("")+'</'+tag+'>';
}
function formatText(value,mode){
 return value.trim().split(/\n\s*\n/).map(paragraph=>{
  const lines=paragraph.split("\n").map(line=>line.trim()).filter(Boolean);
  if(lines.length>1){
   const allOrdered=lines.every(line=>orderedPrefix.test(line));
   if(allOrdered)return '<ol class="answer-points">'+lines.map(line=>{
    const prefix=line.match(orderedPrefix);
    return '<li value="'+Number(prefix[1])+'">'+formatPoint(line.slice(prefix[0].length))+'</li>';
   }).join("")+'</ol>';
   // Keep line-based diagrams and tables aligned and preserve their original line breaks.
   if(lines.some(line=>/[│─┌┐└┘├┤┬┴┼]/.test(line))||lines.every(line=>line.includes("|")))return '<p>'+inlineSymbols(paragraph)+'</p>';
   return pointList(lines.map(line=>line.replace(bulletPrefix,"")));
  }
  const points=splitParagraph(paragraph);
  if(points.length>1&&(mode==="d"||points.slice(1).some(point=>subheadPattern.test(point))))return pointList(points);
  return '<p>'+formatPoint(paragraph)+'</p>';
 }).join("");
}
function getMode(item){return overrides.get(item.id)||globalMode;}
const mathSymbol=(name,sub)=>sub?'<msub><mi>'+name+'</mi><mtext>'+sub+'</mtext></msub>':'<mi>'+name+'</mi>';
const mi=mathSymbol, op=value=>'<mo>'+value+'</mo>', num=value=>'<mn>'+value+'</mn>';
const row=(...parts)=>'<mrow>'+parts.join("")+'</mrow>';
const fraction=(top,bottom)=>'<mfrac>'+top+bottom+'</mfrac>';
const squared=value=>'<msup>'+value+num(2)+'</msup>';
const equals=op("="), approx=op("≈"), minus=op("−"), times=op("×"), plus=op("+");
const equation=(...parts)=>'<math xmlns="http://www.w3.org/1998/Math/MathML" display="block">'+row(...parts)+'</math>';
const switching=equation(mi("P","sw"),equals,mi("α"),times,mi("C","L"),times,squared(mi("V","DD")),times,mi("f"));
const leakage=equation(mi("P","static"),approx,mi("V","DD"),times,mi("I","leak"));
const effort=equation(mi("d"),equals,mi("g"),mi("h"),plus,mi("p"));
const delay=equation(mi("t","p"),approx,num(0.69),times,mi("R","eq"),times,mi("C","L"));
const product=equation(mi("PDP"),equals,mi("P","avg"),times,mi("t","p"));
const noise=[
 equation(mi("NM","L"),equals,mi("V","IL"),minus,mi("V","OL")),
 equation(mi("NM","H"),equals,mi("V","OH"),minus,mi("V","IH"))
];
const mathLines={
 "cmos-u1-q2":[equation(mi("V","OV"),equals,mi("V","GS"),minus,mi("V","T"))],
 "cmos-u1-q7":[equation(mi("r"),approx,fraction(num(1),row(mi("g","m"),plus,mi("g","ds"))),approx,fraction(num(1),mi("g","m")))],
 "cmos-u1-q11":[equation(mi("V","OV"),equals,mi("V","GS"),minus,mi("V","T"))],
 "cmos-u3-q3":noise, "cmos-u3-q4":[switching,leakage], "cmos-u5-q1":[delay],
 "cmos-u5-q2":[effort,equation(mi("h"),equals,fraction(mi("C","load"),mi("C","in")))],
 "cmos-u5-q5":[switching], "cmos-u5-q7":[product],
 "cmos-u5-q11":[effort], "cmos-u5-q12":[switching,leakage],
 "cmos-u5-q14":[product,equation(mi("EDP"),equals,mi("E","op"),times,mi("t","p"))],
 "asic-u4-q4":[switching,leakage], "asic-u4-q6":[switching,leakage],
 "mca-u4-q2":[equation(mi("CCLK"),equals,mi("M"),times,mi("F","osc")),equation(mi("F","CCO"),equals,num(2),times,mi("P"),times,mi("CCLK"))],
 "mca-u4-q6":[equation(mi("t","half"),equals,fraction(num(1),row(num(2),times,mi("f"))),equals,num(250),'<mtext> µs</mtext>')]
};
function renderEquations(item,mode){
 const lines=mathLines[item.id];
 return lines&&(mode==="d"||mode==="m")?'<div class="math-line">'+lines.join("")+'</div>':"";
}
function comparisonTable(item,mode){
 const table=data.tables[item.id];
 if(!table||(mode==="s"&&!table.truth))return "";
 const label=item.id+"-table-caption";
 const headings=table.header.map(value=>'<th scope="col">'+inlineSymbols(value)+'</th>').join("");
 const rows=table.rows.map(row=>'<tr>'+row.map((value,index)=>
  index===0&&!table.truth?'<th scope="row">'+inlineSymbols(value)+'</th>':'<td>'+inlineSymbols(value)+'</td>'
 ).join("")+'</tr>').join("");
 const klass="answer-table"+(table.truth?" is-truth":"");
 return '<div class="answer-table-wrap" role="region" aria-labelledby="'+label+'" tabindex="0"><table class="'+klass+'"><caption id="'+label+'">'+esc(table.caption)+'</caption><thead><tr>'+headings+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function renderAnswer(item){
 const mode=getMode(item);
 const ans=item.ans;
 const lang=mode==="s"?"Pseudocode":({c:"Embedded C",verilog:"Verilog",systemverilog:"SystemVerilog",tcl:"Tcl / SDC",upf:"UPF",text:"Algorithm",pseudo:"Algorithm"}[String(ans.code?.lang).toLowerCase()]||ans.code?.lang||"Code");
 const raw=ans.code?.[mode];
 const figures=mode==="s"?"":((ans.fig?'<figure class="study"><div class="diagram">'+ans.fig+'</div></figure>':"")+(data.figures[item.id]||''));
 return comparisonTable(item,mode)+formatText(ans[mode],mode)+renderEquations(item,mode)+(raw?'<div class="codebox"><div class="codebar"><span>'+esc(lang)+'</span><button type="button" class="copy" data-copy>Copy</button></div><pre><code>'+highlight(raw)+'</code></pre></div>':"")+figures;
}
function tile(subject){
 return '<a class="tile" style="--subject:'+subject.color+'" href="#'+subject.id+'"><span class="tile-icon"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">'+icon[subject.id]+'</svg></span><span><span class="tile-name">'+esc(subject.name)+'</span><span class="tile-meta">'+subject.units.length+' units · '+subject.count+' questions</span></span><span class="tile-arrow" aria-hidden="true">→</span></a>';
}
function home(){
 app.innerHTML='<section class="home"><h1>Sem 5 study guide</h1><p class="subtitle">'+items.length+' questions across '+subjects.length+' subjects. Choose a subject to begin.</p><div class="subject-grid">'+subjects.map(tile).join("")+'</div><p class="syllabus">SPPU · 2024 pattern · <a href="'+esc(data.syllabus)+'" target="_blank" rel="noopener">View syllabus ↗</a></p></section>';
}
function card(item){
 return '<article class="question" id="'+item.id+'" tabindex="-1"><div class="q-top"><div class="q-tools"><a class="q-id" href="#'+item.id+'" aria-label="Link to Unit '+item.unit+' Question '+item.number+'">U'+item.unit+' · Q'+item.number+'</a><div class="local">'+questionButtons(item)+'</div></div><h3 class="q-title">'+inlineSymbols(item.q)+'</h3></div><div class="answer">'+renderAnswer(item)+'</div></article>';
}
function subjectPage(subject){
 app.innerHTML='<div style="--subject:'+subject.color+'"><a class="crumb" href="#home">← All subjects</a><section class="subject-head"><p class="course">'+esc(subject.code)+'</p><h1>'+esc(subject.name)+'</h1><p class="subtitle">'+subject.units.length+' syllabus units · '+subject.count+' question-bank entries</p><a class="bank-link" href="'+esc(subject.source)+'" target="_blank" rel="noopener">Original question bank ↗</a></section><div class="reader">'+subject.units.map((unit,index)=>'<section class="unit" id="'+subject.id+'-u'+(index+1)+'"><h2 class="unit-head"><span>UNIT '+(index+1)+'</span>'+esc(unit.title)+'</h2>'+unit.questions.map(card).join("")+'</section>').join("")+'</div></div>';
 unitNav.style.setProperty("--subject",subject.color);
 unitNav.innerHTML=subject.units.map((unit,index)=>{
  const number=index+1;
  const title="Unit "+number+" · "+unit.title;
  return '<a class="unit-chip" href="#'+subject.id+'-u'+number+'" title="'+esc(title)+'" aria-label="'+esc(title)+'" data-unit="'+number+'">U'+number+'</a>';
 }).join("");
 unitNav.hidden=false;
}
function markUnit(unit){
 for(const link of unitNav.querySelectorAll("[data-unit]")){
  if(Number(link.dataset.unit)===unit)link.setAttribute("aria-current","location");
  else link.removeAttribute("aria-current");
 }
}
function route(){
 const hash=location.hash.slice(1);
 if(hash==="top"){if(!visibleSubject){home();visibleSubject="home";}window.scrollTo(0,0);return;}
 const id=hash.split("-")[0];
 const subject=subjectById.get(id);
 if(!subject){
  if(visibleSubject!=="home"){home();visibleSubject="home";unitNav.hidden=true;updateFocus(false,false);}
  window.scrollTo(0,0);return;
 }
 if(visibleSubject!==id){subjectPage(subject);visibleSubject=id;focusToggle.hidden=false;}
 markUnit(Number(hash.match(/-u(\d+)/)?.[1])||1);
 if(hash===id){window.scrollTo(0,0);return;}
 const target=document.getElementById(hash);
 if(target){
  target.scrollIntoView({block:"start"});
  if(byId.has(hash))target.focus({preventScroll:true});
 }
}
function updateFocus(enabled, preservePosition=true){
 const card = preservePosition ? Array.from(app.querySelectorAll(".question")).find(node=>node.getBoundingClientRect().bottom>topBar.offsetHeight) : null;
 const top = card?.getBoundingClientRect().top;
 focusMode=enabled;
 document.body.classList.toggle("focus-mode",enabled);
 focusToggle.hidden=visibleSubject==="home";
 focusToggle.setAttribute("aria-pressed",String(enabled));
 const label=enabled?"Exit focus view":"Enter focus view";
 focusToggle.setAttribute("aria-label",label);
 focusToggle.title=label;
 if(card&&top!==undefined)window.scrollBy(0,card.getBoundingClientRect().top-top);
}
focusToggle.addEventListener("click",()=>updateFocus(!focusMode));
function swap(cardEl,item){
 updateButtons(cardEl,getMode(item),"local");
 cardEl.querySelector(".answer").innerHTML=renderAnswer(item);
}
function setGlobal(mode){
 globalMode=mode;
 overrides.clear();
 updateButtons(global,mode,"global");
 for(const cardEl of app.querySelectorAll(".question"))swap(cardEl,byId.get(cardEl.id));
}
function closeSearch(){results.hidden=true;query.setAttribute("aria-expanded","false");query.removeAttribute("aria-activedescendant");activeMatch=-1;}
function runSearch(){
 const typed=normalize(query.value).trim();
 clear.hidden=!typed;
 if(!typed){matches=[];closeSearch();return;}
 const terms=typed.split(/\s+/);
 const hits=searchIndex.filter(entry=>terms.every(term=>entry.text.includes(term)));
 const rank=entry=>entry.question.includes(typed)?2:terms.every(term=>entry.question.includes(term))?1:0;
 hits.sort((a,b)=>rank(b)-rank(a)||Number(b.item.subject===visibleSubject)-Number(a.item.subject===visibleSubject));
 matches=hits;
 activeMatch=-1;
 query.removeAttribute("aria-activedescendant");
 resultCount.textContent=hits.length?hits.length+" "+(hits.length===1?"match":"matches"):"No questions found";
 list.innerHTML=matches.map(({item},index)=>'<button class="result" type="button" tabindex="-1" role="option" aria-selected="false" id="result-'+index+'" data-result="'+index+'"><small>'+esc(subjectById.get(item.subject).code)+' · U'+item.unit+' Q'+item.number+'</small>'+esc(item.q)+'</button>').join("");
 results.hidden=false;
 query.setAttribute("aria-expanded","true");
}
function choose(index){
 const item=matches[index]?.item;
 if(!item)return;
 query.value="";
 clear.hidden=true;
 closeSearch();
 query.blur();
 if(location.hash==="#"+item.id)route();
 else location.hash="#"+item.id;
}
function navigateResults(delta){
 if(!matches.length)return;
 activeMatch=activeMatch<0?(delta>0?0:matches.length-1):(activeMatch+delta+matches.length)%matches.length;
 const current=list.children[activeMatch];
 for(const element of list.children)element.setAttribute("aria-selected",String(element===current));
 query.setAttribute("aria-activedescendant",current.id);
 current.scrollIntoView({block:"nearest"});
}
async function copyCode(button,raw){
 try {
  if(!navigator.clipboard)throw new Error("Clipboard API unavailable");
  await navigator.clipboard.writeText(raw);
 } catch {
  const field=document.createElement("textarea");
  field.value=raw;field.style.position="fixed";field.style.opacity="0";document.body.append(field);field.select();
  const ok=document.execCommand("copy");field.remove();button.focus();
  if(!ok){button.textContent="Select code to copy";return;}
 }
 button.textContent="Copied";
 setTimeout(()=>button.textContent="Copy",1200);
}
global.innerHTML=buttons(globalMode,"Answer level for all questions","global");
global.addEventListener("click",event=>{const mode=event.target.closest("[data-global]")?.dataset.global;if(mode)setGlobal(mode);});
app.addEventListener("click",event=>{
 const local=event.target.closest("[data-local]");
 if(local){
  const cardEl=local.closest(".question");
  const mode=local.dataset.local;
  overrides.set(cardEl.id,mode);
  swap(cardEl,byId.get(cardEl.id));
 }
 const copy=event.target.closest("[data-copy]");
 if(copy){const item=byId.get(copy.closest(".question").id);const mode=getMode(item);copyCode(copy,item.ans.code[mode]);}
});
app.addEventListener("error",event=>{if(event.target.matches(".external-fig img"))event.target.hidden=true;},true);
query.addEventListener("input",runSearch);
query.addEventListener("focus",()=>{if(query.value.trim())runSearch();});
query.addEventListener("keydown",event=>{
 if(event.key==="Escape"){closeSearch();return;}
 if(event.key==="ArrowDown"||event.key==="ArrowUp"){
  event.preventDefault();if(results.hidden)runSearch();navigateResults(event.key==="ArrowDown"?1:-1);
 }
 if(event.key==="Enter"&&!results.hidden){event.preventDefault();choose(Math.max(0,activeMatch));}
});
clear.addEventListener("click",()=>{query.value="";runSearch();query.focus();});
list.addEventListener("mousedown",event=>event.preventDefault());
list.addEventListener("click",event=>{const hit=event.target.closest("[data-result]");if(hit)choose(Number(hit.dataset.result));});
document.addEventListener("click",event=>{
 if(!event.target.closest("#search-area"))closeSearch();
 if(themePicker.open&&!event.target.closest("#theme-picker"))themePicker.open=false;
});
document.addEventListener("focusin",event=>{if(!event.target.closest("#search-area"))closeSearch();});
document.addEventListener("keydown",event=>{
 if(event.key==="Escape"&&themePicker.open){
  themePicker.open=false;
  themePicker.querySelector("summary").focus();
  return;
 }
 if(event.key==="Escape"&&focusMode&&!event.defaultPrevented){updateFocus(false);return;}
 if(event.key==="/"&&!focusMode&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&!event.target.closest("input,textarea,[contenteditable]")){event.preventDefault();query.focus();}
});
jump.addEventListener("click",event=>{event.preventDefault();window.scrollTo(0,0);});
window.addEventListener("scroll",()=>{jump.hidden=scrollY<700;},{passive:true});
window.addEventListener("hashchange",route);
document.getElementById("refs").innerHTML=data.refs.map(([name,link])=>'<li><a href="'+esc(link)+'" target="_blank" rel="noopener">'+esc(name)+'</a></li>').join("");
route();
</script>
</body>
</html>
