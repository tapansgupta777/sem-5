 tap go to VDD, while NMOS source and p+ body tap go to VSS. Draw gate oxide, isolation dielectric and contact cuts clearly.","d":"Body regions: Draw a p-type substrate under the NMOS and an n-well inside it under the PMOS. Separate the active areas with isolation. The NMOS uses n+ source and drain, while the PMOS uses p+ source and drain.\nGates and channels: Place a gate electrode above a thin dielectric in each device. The channel forms at the silicon surface between the two heavily doped regions. Both gate electrodes connect to VIN.\nPower and body contacts: Connect the PMOS source and a separate n+ n-well tap to VDD. Connect the NMOS source and a separate p+ substrate or p-well tap to VSS. The taps fix the body potentials and help keep the source/body and drain/body junctions from forward bias in normal operation.\nOutput and routing: Open contacts above both drains and join them with the VOUT metal line. Mark the contact cuts through the interlayer dielectric. At a crossing with dielectric and no contact cut, the layers remain electrically isolated.\nRead the cross-section: A low VIN forms a PMOS channel and charges the output high. A high VIN forms the NMOS channel and discharges the output low. Label VIN, VOUT, VDD, VSS and both well contacts.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 700 240\" role=\"img\" aria-label=\"n-well CMOS inverter cross-section\" style=\"display:block;width:100%;height:auto;max-width:700px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>n-well CMOS inverter cross-section\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"699\" height=\"239\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"47\" y=\"122\" width=\"606\" height=\"91\" fill=\"#34283c\" stroke=\"#a78bfa\" rx=\"2\"/>\u003crect x=\"62\" y=\"122\" width=\"318\" height=\"71\" fill=\"#1c3455\" stroke=\"#60a5fa\" rx=\"2\"/>\u003crect x=\"79\" y=\"124\" width=\"44\" height=\"30\" fill=\"#1c4962\" stroke=\"#60a5fa\" rx=\"2\"/>\u003crect x=\"151\" y=\"124\" width=\"46\" height=\"30\" fill=\"#473821\" stroke=\"#fbbf24\" rx=\"2\"/>\u003crect x=\"278\" y=\"124\" width=\"46\" height=\"30\" fill=\"#473821\" stroke=\"#fbbf24\" rx=\"2\"/>\u003crect x=\"416\" y=\"124\" width=\"46\" height=\"30\" fill=\"#14513a\" stroke=\"#4ade80\" rx=\"2\"/>\u003crect x=\"538\" y=\"124\" width=\"46\" height=\"30\" fill=\"#14513a\" stroke=\"#4ade80\" rx=\"2\"/>\u003crect x=\"600\" y=\"124\" width=\"40\" height=\"30\" fill=\"#473821\" stroke=\"#fbbf24\" rx=\"2\"/>\u003crect x=\"200\" y=\"119\" width=\"73\" height=\"5\" fill=\"#165464\" stroke=\"#5eead4\" rx=\"2\"/>\u003crect x=\"465\" y=\"119\" width=\"70\" height=\"5\" fill=\"#165464\" stroke=\"#5eead4\" rx=\"2\"/>\u003crect x=\"200\" y=\"103\" width=\"73\" height=\"16\" fill=\"#482638\" stroke=\"#fb7185\" rx=\"2\"/>\u003crect x=\"465\" y=\"103\" width=\"70\" height=\"16\" fill=\"#482638\" stroke=\"#fb7185\" rx=\"2\"/>\u003cpath d=\"M101 124 V49 H174 V124 M561 124 V49 H620 V124 M301 124 V69 H439 V124\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M236 103 V88 H500 V103\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ctext x=\"137\" y=\"43\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"591\" y=\"43\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"370\" y=\"62\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"367\" y=\"83\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">VIN\u003c/text>\u003ctext x=\"101\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"174\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"301\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"440\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"561\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"620\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"220\" y=\"179\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n-well · PMOS\u003c/text>\u003ctext x=\"510\" y=\"194\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p substrate · NMOS\u003c/text>\u003ctext x=\"101\" y=\"170\" fill=\"#60a5fa\" font-size=\"10\" text-anchor=\"middle\">well tap\u003c/text>\u003ctext x=\"620\" y=\"170\" fill=\"#fbbf24\" font-size=\"10\" text-anchor=\"middle\">body tap\u003c/text>\u003ctext x=\"350\" y=\"229\" fill=\"#94a3b8\" font-size=\"11\" text-anchor=\"middle\">Gate oxide separates the polysilicon and silicon\u003c/text>\u003c/svg>"}},{"id":"cmos-u4-q3","subject":"cmos","unit":4,"number":3,"q":"Explain the lambda-based layout design rules for a CMOS process.","ans":{"s":"Lambda rules use kλ for widths, spacings and enclosures. Check DRC.","m":"Scale: Express widths, spacings and enclosures in multiples of λ taken from the chosen rule deck.\nDevice and wells: Poly over diffusion forms a gate. Extend poly far enough beyond active, keep contact-to-gate space and enclose PMOS active in the well.\nContact example: A 2λ cut with 1λ enclosure on both sides needs a 4λ landing width.\nChecks: DRC checks geometry and LVS checks connectivity. Use the foundry deck for real fabrication.","d":"Purpose: Lambda rules express geometry in multiples of one design unit λ. A teaching process often defines λ as half its nominal minimum gate length. A drawing can be rescaled within a compatible rule family, but the numerical factors still come from the selected technology deck.\nWidth and spacing: Enforce minimum width for polysilicon, diffusion, metal and wells, and minimum spacing between distinct shapes. A common teaching example uses a 3λ Metal1 minimum width, but this is an example and differs by process.\nTransistor geometry: A poly crossing over active defines a gate. Keep the minimum poly extension beyond active and enough source/drain diffusion beside the gate to satisfy contact and spacing rules. Enclose PMOS active inside the n-well with the specified well margin.\nContacts and vias: A contact cut may be drawn 2λ by 2λ in a teaching deck. A 1λ enclosure on each side would require the enclosing feature to span 4λ across the cut. A via joins metal layers and has its own spacing and enclosure limits.\nVerification: Use DRC to test dimensions and overlaps and LVS to verify circuit connectivity. Include body taps. Fabricate only against the actual foundry rules because a simple λ table may omit density or process-specific cases."}},{"id":"cmos-u4-q4","subject":"cmos","unit":4,"number":4,"q":"Draw the layout of a CMOS inverter and a 2-input NAND and NOR gate. Explain the layers used.","ans":{"s":"PMOS above NMOS, metal rails, common poly inputs. NAND shares series n-active; NOR shares series p-active.","m":"Layers: Draw Metal1 rails, p-active in the n-well, n-active near VSS, and poly gates crossing both. Connect layers with cuts only where intended.\nInverter: One common gate crosses both rows. Join drains at Y and sources to their rails.\nNAND2: The n row is series with an uncontacted center. Parallel p devices use two VDD ends and Y at the center.\nNOR2: Use the dual arrangement with series p devices and parallel n devices. Include both body taps.","d":"Common layout: Draw Metal1 VDD and VSS rails. Place the p-active row inside the n-well near VDD and the n-active row near VSS. Poly crossing active creates the devices, and contact cuts join poly or diffusion to metal where required.\nInverter: Cross the two active strips with one vertical input poly. Contact the PMOS source to VDD and NMOS source to VSS. Join the other two diffusion terminals by metal and label the joined node Y.\nNAND2: Cross both active strips with poly A and B. Use the uncontacted center n diffusion as the series connection and tie n endpoints to Y and VSS. In p active, contact both outer regions to VDD and the center to Y, giving two parallel pull-up paths.\nNOR2: Reverse the series/parallel roles. Tie the p endpoints to VDD and Y and leave its shared center uncontacted. Contact the two outer n regions to VSS and the center to Y, giving two parallel pull-down paths.\nPhysical details: Add an n+ well tap to VDD and a p+ substrate tap to VSS. Include contact/via enclosures, well spacing and minimum widths. Check DRC and LVS after laying out and labeling the nets.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 202\" role=\"img\" aria-label=\"INV stick diagram\" style=\"display:block;width:100%;height:auto;max-width:300px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>INV stick diagram\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"299\" height=\"201\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"50\" y=\"40\" width=\"170\" height=\"48\" fill=\"#22203a\" stroke=\"#a78bfa\" rx=\"2\"/>\u003cpath d=\"M37 24 H258 M37 181 H258\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 62 H215\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 143 H215\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M135 47 V159\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M70 24 V62 M70 143 V181 M200 62 V143 M200 102 H250\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"70\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"70\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ctext x=\"252\" y=\"18\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"252\" y=\"196\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"33\" y=\"65\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"33\" y=\"147\" fill=\"#4ade80\" font-size=\"11\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"135\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"166\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">\u003c/text>\u003ctext x=\"272\" y=\"105\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"142\" y=\"18\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">INV\u003c/text>\u003c/svg>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 202\" role=\"img\" aria-label=\"NAND2 stick diagram\" style=\"display:block;width:100%;height:auto;max-width:300px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>NAND2 stick diagram\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"299\" height=\"201\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"50\" y=\"40\" width=\"170\" height=\"48\" fill=\"#22203a\" stroke=\"#a78bfa\" rx=\"2\"/>\u003cpath d=\"M37 24 H258 M37 181 H258\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 62 H215\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 143 H215\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M104 47 V159 M166 47 V159\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M70 24 V62 M200 24 V62 M135 62 V101 H70 V143 M70 101 H250 M200 143 V181\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"70\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"135\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"70\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ctext x=\"252\" y=\"18\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"252\" y=\"196\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"33\" y=\"65\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"33\" y=\"147\" fill=\"#4ade80\" font-size=\"11\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"104\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"166\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">B\u003c/text>\u003ctext x=\"272\" y=\"105\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"142\" y=\"18\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">NAND2\u003c/text>\u003c/svg>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 202\" role=\"img\" aria-label=\"NOR2 stick diagram\" style=\"display:block;width:100%;height:auto;max-width:300px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>NOR2 stick diagram\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"299\" height=\"201\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"50\" y=\"40\" width=\"170\" height=\"48\" fill=\"#22203a\" stroke=\"#a78bfa\" rx=\"2\"/>\u003cpath d=\"M37 24 H258 M37 181 H258\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 62 H215\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 143 H215\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M104 47 V159 M166 47 V159\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M70 24 V62 M200 62 V101 H135 V143 M200 101 H250 M70 143 V181 M200 143 V181\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"70\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"70\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"135\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ctext x=\"252\" y=\"18\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"252\" y=\"196\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"33\" y=\"65\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"33\" y=\"147\" fill=\"#4ade80\" font-size=\"11\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"104\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"166\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">B\u003c/text>\u003ctext x=\"272\" y=\"105\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"142\" y=\"18\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">NOR2\u003c/text>\u003c/svg>"}},{"id":"cmos-u4-q5","subject":"cmos","unit":4,"number":5,"q":"Explain stick diagrams with the colour code. Draw the stick diagrams of a CMOS inverter, 2-input NAND and 2-input NOR gate.","ans":{"s":"Blue metal, red poly, amber p-active, green n-active, violet n-well, white contacts.","m":"What it shows: Stick diagrams express layers and connections without geometric dimensions. Label poly, n/p active, Metal1, well and contact symbols with colors.\nInverter: Cross both active rows with VIN, then join drains at Y and sources to rails.\nNAND2: Draw series n-active with an uncontacted center and parallel p-active with the two outer regions at VDD.\nNOR2: Draw series p-active with an uncontacted center and parallel n-active with two outer regions at VSS. Mark contact cuts where layers join.","d":"Purpose: A stick diagram shows relative layer positions and connectivity using colored strokes. It omits exact dimensions. Use a legend before drawing because course and foundry conventions vary.\nLegend: A typical convention is red for polysilicon, green for n-active, amber for p-active, blue for Metal1, violet for n-well and filled marks for contact cuts. Show VDD over the p row and VSS below the n row.\nReading a crossing: Poly crossing active makes a MOS gate, and its channel type follows the active region. Metal crossing another layer does not connect electrically unless the proper contact or via is marked.\nInverter: Cross both rows with VIN poly. Join the drains to Y using metal and contacts. Tie the p source to VDD and the n source to VSS.\nNAND2: Draw two poly stripes for A and B. Leave the central n diffusion uncontacted to give the series path. In the p row connect outer ends to VDD and the center to Y for the parallel paths.\nNOR2: Swap the series and parallel arrangements. Leave the p center as a series junction and use the n center as Y with both ends to VSS. Mark the well and substrate taps.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 202\" role=\"img\" aria-label=\"INV stick diagram\" style=\"display:block;width:100%;height:auto;max-width:300px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>INV stick diagram\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"299\" height=\"201\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"50\" y=\"40\" width=\"170\" height=\"48\" fill=\"#22203a\" stroke=\"#a78bfa\" rx=\"2\"/>\u003cpath d=\"M37 24 H258 M37 181 H258\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 62 H215\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 143 H215\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M135 47 V159\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M70 24 V62 M70 143 V181 M200 62 V143 M200 102 H250\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"70\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"70\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ctext x=\"252\" y=\"18\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"252\" y=\"196\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"33\" y=\"65\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"33\" y=\"147\" fill=\"#4ade80\" font-size=\"11\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"135\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"166\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">\u003c/text>\u003ctext x=\"272\" y=\"105\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"142\" y=\"18\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">INV\u003c/text>\u003c/svg>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 202\" role=\"img\" aria-label=\"NAND2 stick diagram\" style=\"display:block;width:100%;height:auto;max-width:300px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>NAND2 stick diagram\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"299\" height=\"201\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"50\" y=\"40\" width=\"170\" height=\"48\" fill=\"#22203a\" stroke=\"#a78bfa\" rx=\"2\"/>\u003cpath d=\"M37 24 H258 M37 181 H258\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 62 H215\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 143 H215\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M104 47 V159 M166 47 V159\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M70 24 V62 M200 24 V62 M135 62 V101 H70 V143 M70 101 H250 M200 143 V181\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"70\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"135\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"70\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ctext x=\"252\" y=\"18\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"252\" y=\"196\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"33\" y=\"65\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"33\" y=\"147\" fill=\"#4ade80\" font-size=\"11\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"104\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"166\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">B\u003c/text>\u003ctext x=\"272\" y=\"105\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"142\" y=\"18\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">NAND2\u003c/text>\u003c/svg>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 202\" role=\"img\" aria-label=\"NOR2 stick diagram\" style=\"display:block;width:100%;height:auto;max-width:300px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>NOR2 stick diagram\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"299\" height=\"201\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"50\" y=\"40\" width=\"170\" height=\"48\" fill=\"#22203a\" stroke=\"#a78bfa\" rx=\"2\"/>\u003cpath d=\"M37 24 H258 M37 181 H258\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 62 H215\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 143 H215\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M104 47 V159 M166 47 V159\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M70 24 V62 M200 62 V101 H135 V143 M200 101 H250 M70 143 V181 M200 143 V181\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"70\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"70\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"135\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ctext x=\"252\" y=\"18\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"252\" y=\"196\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"33\" y=\"65\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"33\" y=\"147\" fill=\"#4ade80\" font-size=\"11\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"104\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"166\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">B\u003c/text>\u003ctext x=\"272\" y=\"105\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"142\" y=\"18\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">NOR2\u003c/text>\u003c/svg>"}},{"id":"cmos-u4-q6","subject":"cmos","unit":4,"number":6,"q":"Explain the basic subsystem design for a Boolean expression with one example.","ans":{"s":"Simplify logic, choose cells, derive dual networks, size and verify.","m":"Decompose: For Z=(AB+C)D, build X=¬(AB+C) as AOI21, E=¬D as an inverter and Z=¬(X+E) as NOR2.\nTransistors: The AOI21 uses series nA–nB in parallel with nC and the dual p-network. NOR uses parallel n devices and series p devices.\nCheck: D=0 forces Z=0. D=1 gives Z=AB+C. Size the paths for loading and verify function and physical layout.\nValidation: Compare the final circuit output with the original expression for every input combination.","d":"Specification: Write the Boolean function or truth table, list interfaces, and determine expected load and output polarity. Minimize the expression only when it produces a practical cell decomposition.\nExample: For Z=(AB+C)D define X=¬(AB+C). X is naturally realized by a six-transistor AOI21. Also generate E=¬D with a CMOS inverter. Then Z=¬(X+E), so the last stage is a two-input NOR.\nAOI21 construction: From X to ground, place series nA–nB in parallel with nC. From VDD to X place pC in series with parallel pA,pB. This makes X high only if C=0 and at least one of A or B is 0.\nNOR construction: From Z to ground draw parallel NMOS branches driven by X and E. From VDD to Z draw series PMOS devices with those inputs. Check D=0 gives E=1 and Z=0. D=1 gives E=0 and Z=¬X=AB+C.\nImplementation: Size series devices for drive and node capacitance, draw the transistor connections and a stick plan, then perform truth-table and timing checks. At layout verify rail ties, DRC and LVS. Compare alternatives if a particular library has an equivalent compound cell."}},{"id":"cmos-u4-q7","subject":"cmos","unit":4,"number":7,"q":"Explain the design of a 2:1 multiplexer as a subsystem and draw its stick diagram.","ans":{"s":"Y=S̄D0+SD1. Two transmission gates share Y. An inverter generates S̄.","m":"Function: S=0 selects D0 and S=1 selects D1. Both transmission gates meet at Y.\nStick paths: D0 uses p-gate S and n-gate S̄. D1 uses p-gate S̄ and n-gate S. Join the p/n channel terminals for each data path with metal contacts.\nControls: Draw an inverter to create S̄. Use separate active regions for the two data inputs, label rails and taps, and run a single common Y metal connection.","d":"Behavior: The MUX selects D0 when S=0 and D1 when S=1. Its Boolean function is Y=S̄D0+SD1. Two CMOS transmission gates implement the selectable paths, and an inverter generates S̄.\nD0 path: Draw a p-active strip controlled by S and an n-active strip controlled by S̄. Join the two data-side terminals with Metal1 and label D0. Join their opposite terminals to the common output metal Y.\nD1 path: Draw a second p-active strip controlled by S̄ and n-active controlled by S. Contact the two data-side terminals at D1 and join their opposite ends to Y. Keep the D0 and D1 regions separate except through the selected switches.\nStick legend: Mark n-well around p-active, poly for S/S̄, active for the switch channels, Metal1 for data and output straps, and contacts at intended connections. Add the select inverter and standard taps.\nOperation and limits: When S=0, TG0 has its NMOS gate high and PMOS gate low. TG1 is off. S=1 reverses the states. Both signal rails can be passed by the parallel devices. Check select skew and loading if this cell drives long wiring or another MUX.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 242\" role=\"img\" aria-label=\"Transmission gate mux stick diagram\" style=\"display:block;width:100%;height:auto;max-width:680px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Transmission gate mux stick diagram\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"679\" height=\"241\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M65 68 H246 M425 68 H606\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 165 H246 M425 165 H606\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M67 68 V165 M604 68 V165 M245 68 V165 M427 68 V165 M245 115 H427 M337 115 V206\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M153 53 V83 M153 149 V181 M515 53 V83 M515 149 V181\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"67\" cy=\"68\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"67\" cy=\"165\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"245\" cy=\"68\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"245\" cy=\"165\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"427\" cy=\"68\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"427\" cy=\"165\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"604\" cy=\"68\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"604\" cy=\"165\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"245\" cy=\"115\" r=\"4\" fill=\"#60a5fa\"/>\u003ccircle cx=\"427\" cy=\"115\" r=\"4\" fill=\"#60a5fa\"/>\u003ccircle cx=\"337\" cy=\"115\" r=\"4\" fill=\"#60a5fa\"/>\u003ctext x=\"45\" y=\"119\" fill=\"#60a5fa\" font-size=\"13\" text-anchor=\"middle\">D0\u003c/text>\u003ctext x=\"627\" y=\"119\" fill=\"#60a5fa\" font-size=\"13\" text-anchor=\"middle\">D1\u003c/text>\u003ctext x=\"337\" y=\"225\" fill=\"#60a5fa\" font-size=\"13\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"153\" y=\"45\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">S to p\u003c/text>\u003ctext x=\"153\" y=\"203\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">S̄ to n\u003c/text>\u003ctext x=\"515\" y=\"45\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">S̄ to p\u003c/text>\u003ctext x=\"515\" y=\"203\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">S to n\u003c/text>\u003ctext x=\"336\" y=\"30\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG0 on for S=0  ·  TG1 on for S=1\u003c/text>\u003ctext x=\"336\" y=\"61\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\">p-active\u003c/text>\u003ctext x=\"336\" y=\"169\" fill=\"#4ade80\" font-size=\"11\" text-anchor=\"middle\">n-active\u003c/text>\u003c/svg>"}},{"id":"cmos-u4-q8","subject":"cmos","unit":4,"number":8,"q":"Explain the design of half adder, full adder and ripple-carry adder. Draw the stick diagram of a CMOS full adder.","ans":{"s":"HA: S=A⊕B, C=AB. FA: P=A⊕B, S=P⊕Cin, Cout=AB+PCin. Chain carry between stages.","m":"Half adder: S=A⊕B and C=AB.\nFull adder: With P=A⊕B, SUM=P⊕Cin and COUT=AB+P·Cin. A carry MUX selects A for P=0 and Cin for P=1.\nStick plan: Place two XORs and a TG MUX along VDD/VSS. Route P into the second XOR and to the MUX select. Draw both complementary switch controls and label SUM and COUT.\nRipple carry: Connect each bit's COUT to the next Cin, producing a worst-case carry path through the word.","d":"Half adder: Two inputs A and B produce S=A⊕B and C=AB. XOR marks unequal bits; AND gives the carry when both bits are one.\nFull adder: Add carry input Cin. Define P=A⊕B and G=AB, so SUM=P⊕Cin and COUT=G+P·Cin. This follows by using two half adders and ORing their carries. If P=0 then A=B and carry equals A; if P=1 carry equals Cin.\nStick plan: Place two CMOS XOR cells and a transmission-gate MUX between common VDD and VSS rails. Route A and B into XOR1, route P and Cin into XOR2, and label the second XOR output SUM. Connect a TG from A to COUT enabled by P̄ and another TG from Cin to COUT enabled by P. The MUX therefore implements the carry equation.\nLayer detail: Expand each XOR into complementary n/p devices. Mark poly at gate crossings, active switch channels, Metal1 straps for signals and contacts at intentional joints. Use an inverter for any missing complement and include body taps.\nRipple-carry chain: Use an adder per bit and drive the next bit's Cin from the current COUT. Carry starts at the least-significant stage and may propagate across all N bits, making worst-case carry delay grow with N.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 711 238\" role=\"img\" aria-label=\"Hierarchical CMOS full adder stick-routing plan\" style=\"display:block;width:100%;height:auto;max-width:711px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Hierarchical CMOS full adder stick-routing plan\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"710\" height=\"237\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"116\" y=\"46\" width=\"143\" height=\"40\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"346\" y=\"46\" width=\"141\" height=\"40\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"346\" y=\"132\" width=\"141\" height=\"40\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M48 57 H116 M48 76 H116 M259 66 H346 M48 102 H307 V78 H346 M487 66 H614 M281 66 V140 H346 M48 102 V153 H346 M48 57 V190 H319 V164 H346 M487 151 H614\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"281\" cy=\"66\" r=\"4\" fill=\"#60a5fa\"/>\u003ccircle cx=\"48\" cy=\"57\" r=\"4\" fill=\"#60a5fa\"/>\u003ccircle cx=\"48\" cy=\"102\" r=\"4\" fill=\"#60a5fa\"/>\u003ctext x=\"33\" y=\"61\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"33\" y=\"80\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">B\u003c/text>\u003ctext x=\"24\" y=\"106\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Cin\u003c/text>\u003ctext x=\"188\" y=\"70\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Static XOR cell\u003c/text>\u003ctext x=\"417\" y=\"70\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Static XOR cell\u003c/text>\u003ctext x=\"417\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG MUX cell\u003c/text>\u003ctext x=\"278\" y=\"55\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">P\u003c/text>\u003ctext x=\"644\" y=\"70\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">SUM\u003c/text>\u003ctext x=\"644\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">COUT\u003c/text>\u003ctext x=\"358\" y=\"217\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">COUT selects Cin when P=1 and A when P=0\u003c/text>\u003c/svg>"}},{"id":"cmos-u4-q9","subject":"cmos","unit":4,"number":9,"q":"Explain the design of a shift register using CMOS. Draw the stick diagram of a D flip- flop.","ans":{"s":"Positive-edge DFF = low-transparent master + high-transparent slave. Chain Q→D to shift.","m":"D flip-flop: Cascade two static TG latches. The master is transparent on CLK=0 and the slave on CLK=1, transferring D to Q on a rising edge.\nStick plan: Each latch uses input and feedback TGs, two inverters and complementary clocks. Draw poly gates over p/n active and use metal straps for feedback and the intermediate node.\nShift register: Connect each Q to the next D and share CLK. At each edge every bit moves one stage.","d":"Latch structure: A static CMOS latch uses an input transmission gate into a two-inverter loop and a feedback transmission gate from the second inverter's output to the first inverter's input. During transparency enable the input gate and open the feedback gate. During hold open the input gate and close the feedback gate.\nMaster latch: For a positive-edge D flip-flop, the master accepts D while CLK=0. Drive its input TG with CLK̄ and its feedback TG with CLK in the usual enable convention.\nSlave latch: The slave accepts the master's output while CLK=1, so its input TG is enabled by CLK and its feedback TG by CLK̄. A rising edge closes the master and opens the slave, transferring the stored bit to Q.\nStick construction: Draw shared VDD/VSS rails, two inverter pairs and adjacent n/p active stripes for each transmission gate. Mark CLK and CLK̄ gate crossings and contact cuts. Use metal straps for the master-to-slave connection and each local feedback loop.\nShift register: Cascade flip-flops with Q of each stage connected to D of the next and use a common clock. Each rising edge shifts the serial input one place. For example, with initial 000 and serial input sequence 1,0,1, the states ordered newest first are 100, 010, 101.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 735 255\" role=\"img\" aria-label=\"Master–slave transmission gate flip-flop stick-routing plan\" style=\"display:block;width:100%;height:auto;max-width:735px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Master–slave transmission gate flip-flop stick-routing plan\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"734\" height=\"254\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"66\" y=\"74\" width=\"65\" height=\"35\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"167\" y=\"74\" width=\"67\" height=\"35\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"272\" y=\"74\" width=\"67\" height=\"35\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"376\" y=\"74\" width=\"65\" height=\"35\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"474\" y=\"74\" width=\"66\" height=\"35\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"578\" y=\"74\" width=\"66\" height=\"35\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"174\" y=\"162\" width=\"65\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"481\" y=\"162\" width=\"65\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M43 91 H66 M131 91 H167 M234 91 H272 M339 91 H376 M441 91 H474 M540 91 H578 M644 91 H688 M145 91 V178 H174 M239 178 H354 V91 M454 91 V178 H481 M546 178 H660 V91\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"145\" cy=\"91\" r=\"4\" fill=\"#60a5fa\"/>\u003ccircle cx=\"354\" cy=\"91\" r=\"4\" fill=\"#60a5fa\"/>\u003ccircle cx=\"454\" cy=\"91\" r=\"4\" fill=\"#60a5fa\"/>\u003ccircle cx=\"660\" cy=\"91\" r=\"4\" fill=\"#60a5fa\"/>\u003ctext x=\"29\" y=\"95\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">D\u003c/text>\u003ctext x=\"704\" y=\"95\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Q\u003c/text>\u003ctext x=\"99\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG\u003c/text>\u003ctext x=\"200\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">INV\u003c/text>\u003ctext x=\"306\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">INV\u003c/text>\u003ctext x=\"407\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG\u003c/text>\u003ctext x=\"507\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">INV\u003c/text>\u003ctext x=\"612\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">INV\u003c/text>\u003ctext x=\"207\" y=\"183\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG\u003c/text>\u003ctext x=\"513\" y=\"183\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG\u003c/text>\u003ctext x=\"99\" y=\"59\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">CLK̄\u003c/text>\u003ctext x=\"407\" y=\"59\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">CLK\u003c/text>\u003ctext x=\"209\" y=\"214\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">FB on CLK\u003c/text>\u003ctext x=\"516\" y=\"214\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">FB on CLK̄\u003c/text>\u003ctext x=\"211\" y=\"29\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Master latch\u003c/text>\u003ctext x=\"525\" y=\"29\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Slave latch\u003c/text>\u003ctext x=\"364\" y=\"238\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">The p gate in each TG takes the complement of its enable.\u003c/text>\u003c/svg>"}},{"id":"cmos-u4-q10","subject":"cmos","unit":4,"number":10,"q":"Explain the CMOS enhancement process (twin-tub, SOI). Compare it with the conventional CMOS process.","ans":{"s":"Bulk n-well engineers PMOS well. Twin-tub engineers both wells. SOI has a buried oxide.","m":"Conventional CMOS: NMOS uses a p substrate and PMOS an n-well. Substrate coupling and body constraints remain.\nTwin-tub: Form separate p- and n-wells to tune body doping and threshold behavior independently. Requires additional process complexity and still uses bulk body ties.\nSOI: Build on a thin silicon layer over buried oxide. Reduces junction capacitance, coupling and conventional latch-up, but wafer cost, self-heating and floating-body behavior can matter.","d":"Conventional n-well: NMOS is built in the p-type substrate and PMOS in an n-well. This is a straightforward bulk process, but the original substrate sets the NMOS body doping, and substrate and junction coupling remain concerns.\nTwin-tub structure: Form an n-well for PMOS and a separately implanted p-well for NMOS, often in a common epitaxial layer. Isolation and gates are formed later, followed by separate n+ and p+ source/drain implants and the interconnect stack.\nTwin-tub benefit: Separate well profiles allow the designer and process engineer to adjust threshold, body effect and punch-through behavior for each type more independently. The additional well processing adds masks and process complexity. Proper taps and guard rings still matter in bulk CMOS.\nSOI structure: Place the thin active silicon film above a buried oxide on a handle wafer. Devices form in the upper film and are isolated from each other by isolation oxide. The buried oxide reduces junction capacitance and substrate coupling and interrupts the conventional bulk latch-up path.\nSOI trade-offs: Consider wafer cost and self-heating. Partially depleted SOI may have floating-body effects, while fully depleted SOI offers improved electrostatic control and can support back bias. Choice depends on the design's performance, power and cost targets."}},{"id":"cmos-u4-q11","subject":"cmos","unit":4,"number":11,"q":"Draw the stick diagram of a 2-input CMOS NAND gate and explain the colour-coding convention used.","ans":{"s":"NAND stick: n-active in series, p-active with both ends VDD and center Y.","m":"Legend: Red poly, green n-active, amber p-active, blue metal, violet n-well and marked contacts. Draw A and B poly across both active rows.\nNAND pull-down: Tie the n-active outer ends to Y and VSS and leave the center uncontacted for a series path.\nNAND pull-up: Tie both p-active outer ends to VDD and the center to Y. The p devices are parallel. Add well/body ties and mark all intentional metal contacts.","d":"Layer legend: Mark Metal1 rails in blue, polysilicon in red, n-active in green, p-active in amber, the n-well in violet, and contacts as filled marks. These colors follow the figure's convention and may differ from another course legend.\nActive rows: Draw p-active horizontally inside the n-well and n-active separately beneath it. Cross both rows with vertical poly A and B. Each crossing defines one MOS transistor, giving two NMOS and two PMOS devices.\nNMOS path: Connect one outer n-active endpoint to Y and the other to VSS. Leave the shared center diffusion uncontacted. This forces both n-channel devices on before Y can discharge.\nPMOS paths: Tie both outer p-active endpoints to VDD, and the middle p-active region to Y. Electrically, the two PMOS devices are parallel from VDD to Y. Join the middle p contact and output n endpoint using Y metal.\nCrossing and checks: Only a deliberate contact joins metal to the active layer. Add independent n-well and p-body ties to VDD and VSS. Check that A=B=1 pulls Y low and any 0 input lets its PMOS pull Y high.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 202\" role=\"img\" aria-label=\"NAND2 stick diagram\" style=\"display:block;width:100%;height:auto;max-width:300px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>NAND2 stick diagram\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"299\" height=\"201\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"50\" y=\"40\" width=\"170\" height=\"48\" fill=\"#22203a\" stroke=\"#a78bfa\" rx=\"2\"/>\u003cpath d=\"M37 24 H258 M37 181 H258\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 62 H215\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M57 143 H215\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M104 47 V159 M166 47 V159\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M70 24 V62 M200 24 V62 M135 62 V101 H70 V143 M70 101 H250 M200 143 V181\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"70\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"135\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"62\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"70\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"200\" cy=\"143\" r=\"4\" fill=\"#fff\"/>\u003ctext x=\"252\" y=\"18\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"252\" y=\"196\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"33\" y=\"65\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"33\" y=\"147\" fill=\"#4ade80\" font-size=\"11\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"104\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"166\" y=\"119\" fill=\"#fb7185\" font-size=\"11\" text-anchor=\"middle\">B\u003c/text>\u003ctext x=\"272\" y=\"105\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"142\" y=\"18\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">NAND2\u003c/text>\u003c/svg>"}},{"id":"cmos-u4-q12","subject":"cmos","unit":4,"number":12,"q":"Explain the n-well CMOS fabrication process step by step with neat cross-sectional diagrams.","ans":{"s":"p wafer → n-well/isolation → gate oxide/poly → implants → contacts, metal, passivation.","m":"Well and isolation: Mask and implant an n-well in a p wafer, then use field isolation or STI to define active islands.\nGate and junctions: Form the gate dielectric and pattern the gate. Use separate n+ and p+ implants for NMOS and PMOS source/drain and body taps. The patterned gate aligns the junction edges.\nInterconnect: Deposit dielectric, cut contacts, pattern metal, then add vias and further metal as needed. Draw separate cross-sections for well/isolation, gate, implants and contacted devices.","d":"Starting wafer and well: Begin with a p-type silicon wafer. Pattern the well mask, introduce donor dopant into the exposed areas and anneal to form the n-well for PMOS. NMOS will remain in the p-type body. Draw the wafer and the new well as the first cross-section.\nActive isolation: Define where devices may form. Create isolation, such as shallow trench isolation, to separate adjacent active regions. Draw remaining silicon islands and the insulating trenches or field oxide.\nGate definition: Form the thin gate dielectric and deposit and pattern the gate material. In a teaching polysilicon process, each patterned gate crosses the active region. Add the gate before source/drain implantation so its edges can align the junctions.\nSource and drain implants: With separate masks, implant n+ NMOS source/drain and n+ well taps, then p+ PMOS source/drain and p+ substrate taps. Spacer, anneal and silicide steps depend on the process. Draw the four junctions on either side of the two gates and the body contacts.\nContacts and interconnect: Deposit insulating dielectric, open contact cuts to selected diffusion and gates, then deposit and pattern metal. Repeat dielectric, via and metal layers as required and finish with passivation and pad openings.\nInverter links: Tie n-well and PMOS source to VDD, p-body and NMOS source to VSS, gates to VIN and drains to VOUT.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 95\" role=\"img\" aria-label=\"Planar CMOS fabrication sequence\" style=\"display:block;width:100%;height:auto;max-width:680px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Planar CMOS fabrication sequence\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"679\" height=\"94\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"13\" y=\"32\" width=\"143\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"182\" y=\"32\" width=\"143\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"351\" y=\"32\" width=\"143\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"520\" y=\"32\" width=\"146\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M156 49 H182 l-6 -4 m6 4 -6 4 M325 49 H351 l-6 -4 m6 4 -6 4 M494 49 H520 l-6 -4 m6 4 -6 4\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ctext x=\"84\" y=\"53\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Well &amp; isolation\u003c/text>\u003ctext x=\"252\" y=\"53\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Gate oxide &amp; poly\u003c/text>\u003ctext x=\"421\" y=\"53\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+ and n+ implants\u003c/text>\u003ctext x=\"594\" y=\"53\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Contacts &amp; metal\u003c/text>\u003c/svg>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 700 240\" role=\"img\" aria-label=\"n-well CMOS inverter cross-section\" style=\"display:block;width:100%;height:auto;max-width:700px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>n-well CMOS inverter cross-section\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"699\" height=\"239\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"47\" y=\"122\" width=\"606\" height=\"91\" fill=\"#34283c\" stroke=\"#a78bfa\" rx=\"2\"/>\u003crect x=\"62\" y=\"122\" width=\"318\" height=\"71\" fill=\"#1c3455\" stroke=\"#60a5fa\" rx=\"2\"/>\u003crect x=\"79\" y=\"124\" width=\"44\" height=\"30\" fill=\"#1c4962\" stroke=\"#60a5fa\" rx=\"2\"/>\u003crect x=\"151\" y=\"124\" width=\"46\" height=\"30\" fill=\"#473821\" stroke=\"#fbbf24\" rx=\"2\"/>\u003crect x=\"278\" y=\"124\" width=\"46\" height=\"30\" fill=\"#473821\" stroke=\"#fbbf24\" rx=\"2\"/>\u003crect x=\"416\" y=\"124\" width=\"46\" height=\"30\" fill=\"#14513a\" stroke=\"#4ade80\" rx=\"2\"/>\u003crect x=\"538\" y=\"124\" width=\"46\" height=\"30\" fill=\"#14513a\" stroke=\"#4ade80\" rx=\"2\"/>\u003crect x=\"600\" y=\"124\" width=\"40\" height=\"30\" fill=\"#473821\" stroke=\"#fbbf24\" rx=\"2\"/>\u003crect x=\"200\" y=\"119\" width=\"73\" height=\"5\" fill=\"#165464\" stroke=\"#5eead4\" rx=\"2\"/>\u003crect x=\"465\" y=\"119\" width=\"70\" height=\"5\" fill=\"#165464\" stroke=\"#5eead4\" rx=\"2\"/>\u003crect x=\"200\" y=\"103\" width=\"73\" height=\"16\" fill=\"#482638\" stroke=\"#fb7185\" rx=\"2\"/>\u003crect x=\"465\" y=\"103\" width=\"70\" height=\"16\" fill=\"#482638\" stroke=\"#fb7185\" rx=\"2\"/>\u003cpath d=\"M101 124 V49 H174 V124 M561 124 V49 H620 V124 M301 124 V69 H439 V124\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M236 103 V88 H500 V103\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ctext x=\"137\" y=\"43\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"591\" y=\"43\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"370\" y=\"62\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"367\" y=\"83\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">VIN\u003c/text>\u003ctext x=\"101\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"174\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"301\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"440\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"561\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"620\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"220\" y=\"179\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n-well · PMOS\u003c/text>\u003ctext x=\"510\" y=\"194\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p substrate · NMOS\u003c/text>\u003ctext x=\"101\" y=\"170\" fill=\"#60a5fa\" font-size=\"10\" text-anchor=\"middle\">well tap\u003c/text>\u003ctext x=\"620\" y=\"170\" fill=\"#fbbf24\" font-size=\"10\" text-anchor=\"middle\">body tap\u003c/text>\u003ctext x=\"350\" y=\"229\" fill=\"#94a3b8\" font-size=\"11\" text-anchor=\"middle\">Gate oxide separates the polysilicon and silicon\u003c/text>\u003c/svg>"}},{"id":"cmos-u4-q13","subject":"cmos","unit":4,"number":13,"q":"Explain the λ-based design rules for n-well, contacts and metal layers. Compare λ-based and micron-based design rules.","ans":{"s":"λ rules use kλ, micron rules state process-specific dimensions.","m":"Well: Check minimum width, spacing and enclosure around PMOS active and taps.\nContacts and metal: Enforce cut size/spacing, enclosure by both materials, metal widths/spacing and via enclosures. A 2λ cut with 1λ enclosure on both sides needs a 4λ landing.\nRule styles: λ rules express dimensions as scalable multiples; micron rules specify actual process-specific dimensions. Use the foundry DRC deck for fabrication.","d":"N-well constraints: Check minimum well width and spacing to neighboring wells. The well must enclose PMOS active and well taps by the specified amounts. In modern processes, voltage-domain and well configuration can change which spacing limit applies.\nContact constraints: Specify cut size and cut-to-cut spacing. A cut opening to active or poly needs enclosure by that material underneath and by Metal1 above. If a 2λ cut needs 1λ enclosure on each side, the landing feature needs at least 4λ across it. Keep contacts away from gate edges by the required distance.\nMetal constraints: Apply minimum width and spacing separately for each metal layer. A via between layers requires the prescribed enclosure above and below. Some decks use separate width-dependent spacing and via-array rules.\nLambda versus micron: A λ-based deck uses factors of a common scaling unit, making classroom layouts portable within a compatible family. A micron-based deck states exact dimensions, such as one minimum width in micrometers for a named layer, and can encode individually optimized and context-dependent rules.\nVerification: Real mask layout follows the PDK's rule deck. Run DRC for rule compliance and LVS to check that the contacts and straps create the intended connectivity."}},{"id":"cmos-u4-q14","subject":"cmos","unit":4,"number":14,"q":"Draw the stick diagram of a CMOS 2:1 multiplexer implemented using transmission gates.","ans":{"s":"Y=S̄D0+SD1. Two transmission gates share Y. An inverter generates S̄.","m":"Function: S=0 selects D0 and S=1 selects D1. Both transmission gates meet at Y.\nStick paths: D0 uses p-gate S and n-gate S̄. D1 uses p-gate S̄ and n-gate S. Join the p/n channel terminals for each data path with metal contacts.\nControls: Draw an inverter to create S̄. Use separate active regions for the two data inputs, label rails and taps, and run a single common Y metal connection.","d":"Behavior: The MUX selects D0 when S=0 and D1 when S=1. Its Boolean function is Y=S̄D0+SD1. Two CMOS transmission gates implement the selectable paths, and an inverter generates S̄.\nD0 path: Draw a p-active strip controlled by S and an n-active strip controlled by S̄. Join the two data-side terminals with Metal1 and label D0. Join their opposite terminals to the common output metal Y.\nD1 path: Draw a second p-active strip controlled by S̄ and n-active controlled by S. Contact the two data-side terminals at D1 and join their opposite ends to Y. Keep the D0 and D1 regions separate except through the selected switches.\nStick legend: Mark n-well around p-active, poly for S/S̄, active for the switch channels, Metal1 for data and output straps, and contacts at intended connections. Add the select inverter and standard taps.\nOperation and limits: When S=0, TG0 has its NMOS gate high and PMOS gate low. TG1 is off. S=1 reverses the states. Both signal rails can be passed by the parallel devices. Check select skew and loading if this cell drives long wiring or another MUX.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 242\" role=\"img\" aria-label=\"Transmission gate mux stick diagram\" style=\"display:block;width:100%;height:auto;max-width:680px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Transmission gate mux stick diagram\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"679\" height=\"241\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M65 68 H246 M425 68 H606\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 165 H246 M425 165 H606\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M67 68 V165 M604 68 V165 M245 68 V165 M427 68 V165 M245 115 H427 M337 115 V206\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M153 53 V83 M153 149 V181 M515 53 V83 M515 149 V181\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"67\" cy=\"68\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"67\" cy=\"165\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"245\" cy=\"68\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"245\" cy=\"165\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"427\" cy=\"68\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"427\" cy=\"165\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"604\" cy=\"68\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"604\" cy=\"165\" r=\"4\" fill=\"#fff\"/>\u003ccircle cx=\"245\" cy=\"115\" r=\"4\" fill=\"#60a5fa\"/>\u003ccircle cx=\"427\" cy=\"115\" r=\"4\" fill=\"#60a5fa\"/>\u003ccircle cx=\"337\" cy=\"115\" r=\"4\" fill=\"#60a5fa\"/>\u003ctext x=\"45\" y=\"119\" fill=\"#60a5fa\" font-size=\"13\" text-anchor=\"middle\">D0\u003c/text>\u003ctext x=\"627\" y=\"119\" fill=\"#60a5fa\" font-size=\"13\" text-anchor=\"middle\">D1\u003c/text>\u003ctext x=\"337\" y=\"225\" fill=\"#60a5fa\" font-size=\"13\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"153\" y=\"45\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">S to p\u003c/text>\u003ctext x=\"153\" y=\"203\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">S̄ to n\u003c/text>\u003ctext x=\"515\" y=\"45\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">S̄ to p\u003c/text>\u003ctext x=\"515\" y=\"203\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">S to n\u003c/text>\u003ctext x=\"336\" y=\"30\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG0 on for S=0  ·  TG1 on for S=1\u003c/text>\u003ctext x=\"336\" y=\"61\" fill=\"#fbbf24\" font-size=\"11\" text-anchor=\"middle\">p-active\u003c/text>\u003ctext x=\"336\" y=\"169\" fill=\"#4ade80\" font-size=\"11\" text-anchor=\"middle\">n-active\u003c/text>\u003c/svg>"}}]},{"title":"Delay, Power & Interconnect in CMOS","questions":[{"id":"cmos-u5-q1","subject":"cmos","unit":5,"number":1,"q":"Explain the RC delay model. Show how the delay of a gate is estimated using equivalent resistance and capacitance.","ans":{"s":"Gate ≈ effective Ron driving CL. Delay at 50%≈0.69RonCL. Series paths use Elmore sum.","m":"Model: Approximate the on network by Req and total diffusion, wire and fanout by CL.\nMidpoint result: A lumped RC has exponential charge/discharge. Its 50% time is ln(2)ReqCL, so use Rp for tpLH and Rn for tpHL. With 1.5 kΩ and 60 fF, delay is about 62 ps.\nDistributed load: Estimate the Elmore time constant by summing path resistances times their downstream capacitances. Use timing models for nonlinear drive and finite slew.","d":"Equivalent circuit: Replace an on pull-up or pull-down network by an effective resistance Req, and sum output junction, fanout and interconnect capacitances into CL. Series devices raise effective resistance, so calculate the rise and fall cases for their actual conducting paths.\nCharging: After a falling input step, PMOS charges through Rp. The capacitor equation is CL·dVOUT/dt=(VDD−VOUT)/Rp, giving VOUT=VDD[1−exp(−t/(RpCL))]. At VOUT=VDD/2 the exponential equals 1/2, so tpLH≈0.693RpCL.\nDischarging: After a rising input step, NMOS discharges through Rn. VOUT=VDD exp(−t/(RnCL)), so tpHL≈0.693RnCL. Average delay is the mean of the two propagation delays.\nWorked estimate: Req=1.5 kΩ and CL=60 fF give RC=90 ps and a half-swing delay of approximately 62 ps. Doubling the gate load doubles this estimate while resistance is fixed.\nDistributed extension: For an RC tree, sum Ri·Cdown,i along the path from driver to sink. Capacitance connected through any shared upstream resistance contributes to that branch's Elmore time constant. The 0.693 multiplier is exact for a one-pole step only; finite slew and multiple poles require care.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 670 192\" role=\"img\" aria-label=\"Distributed wire RC ladder driven through effective output resistance\" style=\"display:block;width:100%;height:auto;max-width:670px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Distributed wire RC ladder driven through effective output resistance\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"669\" height=\"191\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"60\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"190\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"325\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"460\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M34 61 H60 M137 61 H190 M267 61 H325 M402 61 H460 M537 61 H626\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M167 61 V109 M304 61 V109 M438 61 V109 M580 61 V109 M155 109 H179 M155 118 H179 M292 109 H316 M292 118 H316 M426 109 H450 M426 118 H450 M568 109 H592 M568 118 H592 M167 118 V143 M304 118 V143 M438 118 V143 M580 118 V143 M144 143 H602\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"167\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"304\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"438\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"580\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"99\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rdriver\u003c/text>\u003ctext x=\"229\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"364\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"497\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"169\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/6\u003c/text>\u003ctext x=\"304\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/3\u003c/text>\u003ctext x=\"438\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/3\u003c/text>\u003ctext x=\"580\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/6 + CL\u003c/text>\u003ctext x=\"606\" y=\"48\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Receiver\u003c/text>\u003ctext x=\"376\" y=\"166\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">Each wire resistance sees the capacitances downstream from it.\u003c/text>\u003c/svg>"}},{"id":"cmos-u5-q2","subject":"cmos","unit":5,"number":2,"q":"Explain the linear delay model. Define logical effort, electrical effort, branching effort and parasitic delay. Calculate the logical effort of an inverter, 2-input NAND and 2-input NOR gate.","ans":{"s":"d=gh+p. h=Cout/Cin. gINV=1, gNAND2=4/3, gNOR2=5/3. b=Ctotal/Con-path.","m":"Equation: d=gh+p using total load, or d=g·b·h_on+p when h_on includes only on-path load.\nDefinitions: g measures intrinsic input cost at equal drive, h measures load relative to input size, b measures branching and p is unloaded delay.\nSizing reference: Inverter n/p widths 1/2 give 3 input units, g=1. NAND2 uses widths 2/2 per input, g=4/3. NOR2 uses 1/4 per input, g=5/3. Stacks must widen to match reference resistance.","d":"Linear model: Write normalized delay d=f+p. The stage effort f=gh when electrical effort h uses all capacitance driven. Physical delay is approximately τd, with τ a process reference time. Parasitic delay p is the unloaded contribution from internal and output diffusion capacitances.\nEfforts: Logical effort g is input capacitance per input divided by that of an inverter providing the same output drive. Electrical effort h=Cload/Cin. When tracking the main path only, let b=(Con+Coff)/Con and h_on=Con/Cin; then use f=g·b·h_on. Do not also use b with an h that already includes branch loads.\nInverter reference: Use relative n-width 1 and p-width 2, so the input capacitance is 3 width-units and g=1. This assumes gate capacitance proportional to width and approximately balanced worst-case rise/fall drives.\nNAND2: Two series NMOS transistors each need width 2 to recover the reference pull-down resistance. Each parallel PMOS uses width 2, sized for one conducting PMOS. One input sees 2+2=4, giving g=4/3.\nNOR2: Two series PMOS transistors each need width 4, while each parallel NMOS uses width 1 for one conducting device. One input sees 1+4=5, giving g=5/3."}},{"id":"cmos-u5-q3","subject":"cmos","unit":5,"number":3,"q":"Explain delay in a multistage logic network. How is the optimum number of stages found?","ans":{"s":"Path effort F=GBH. For N stages size for f=F^(1/N); D≈Nf+P. Evaluate feasible N.","m":"Path effort: F=GBH, combining gate topology, branching and total load relative to the first input.\nOptimal sizing: For fixed N, target equal stage efforts f=F^(1/N). Compute D≈Nf+Σpᵢ and size stages backward from the load.\nStage count: Try neighboring integers and honor output polarity. For F=64 with p=1 per stage, two, three and four stages yield about 18, 15 and 15.3 units, so three is best among those candidates.","d":"Path quantities: For N stages, path logical effort G=∏gᵢ, branching effort B=∏bᵢ and electrical effort H=CL/Cin,first. Thus path effort F=GBH. Let fᵢ=gᵢbᵢhᵢ if hᵢ uses only on-path capacitance; otherwise omit the separate branch factor.\nEqual-stage optimum: The product of the stage efforts is fixed at F for the ideal sizing model. Their sum is minimized when fᵢ=F^(1/N) for all i, by the arithmetic–geometric mean inequality. Total delay is D≈N·F^(1/N)+P, where P=Σpᵢ.\nSizing: Start with the final load and work backward to obtain gate input capacitances. Use Cin,i=gᵢCtotal,i/fᵢ and include side loads when sizing a branch. Re-evaluate B if a newly sized load changes the branch ratio.\nChoosing stage count: Try nearby valid integer N, recomputing logical and parasitic effort if the gate topology changes. A very small N makes stage efforts high, while excess stages add parasitics. In inverter buffer chains, the optimum effort is often roughly 3–4 per stage.\nExample: With F=64 and p=1 per stage, N=2,3,4 give delays of 18, 15 and 15.3 normalized units. If polarity permits, three stages win among these choices."}},{"id":"cmos-u5-q4","subject":"cmos","unit":5,"number":4,"q":"Explain gate diffusion capacitance and its effect on delay.","ans":{"s":"Junction capacitance has area and sidewall terms. Cdiff slows each charged/discharged node. Share diffusion to reduce it.","m":"Junction origin: Source/drain diffusion forms depletion capacitance to its body. Bottom area and sidewall perimeter contribute Cdiff≈A·Cj(V)+P·Cjsw(V).\nDelay: Output-connected diffusion adds to CL and unloaded parasitic delay. Internal stack nodes also add transient delay and charge sharing.\nMitigation: Share compatible diffusion and keep landing regions compact. Junction capacitance is separate from gate overlap and external wire or fanout loading.\nDelay check: Include the driver’s output diffusion capacitance even when fanout and wire load are small.","d":"Physical source: Gate diffusion capacitance in this context refers to source/drain junction capacitance associated with a logic gate. Diffusion and its well or substrate form a pn junction. In normal operation it is typically zero-biased or reverse-biased, so its depletion region stores charge like a capacitor.\nGeometry model: Estimate Cdiff≈A·Cj(V)+P·Cjsw(V), where A is bottom-junction area and P is relevant sidewall perimeter. Cj and Cjsw are bias-dependent capacitance densities. Junction capacitance normally decreases as reverse bias widens the depletion region.\nOutput node: Drains connected to Y contribute even when the gate drives no external load. Additional capacitance increases the charging time and intrinsic parasitic delay p. A 5 fF increase with Req=2 kΩ adds about 0.69·2 kΩ·5 fF=6.9 ps in the lumped model.\nInternal nodes: Junctions between stacked transistors can also switch or redistribute charge. Their initial voltage may depend on the previous input combination, so two transitions with the same output polarity can have different delays.\nLayout choices: Share diffusion where connectivity allows, keep contact regions compact, and avoid oversizing. Include gate overlap, driven gate capacitance and wire capacitance as separate contributions rather than adding them to the diffusion geometry term."}},{"id":"cmos-u5-q5","subject":"cmos","unit":5,"number":5,"q":"Explain dynamic power dissipation in CMOS circuits with its expression. How can it be reduced?","ans":{"s":"Psw=αCVDD²f. Reduce voltage, capacitance, activity or frequency. Overlap current also costs dynamic power.","m":"Expression: Psw=ΣαᵢCᵢVDD²f with αᵢ counting rising transitions per clock. Each full charging event draws CᵢVDD². Short-circuit power adds during input transitions.\nReduction: Lower VDD for a quadratic benefit, use clock gating and operand isolation to lower activity, reduce unnecessary capacitance and choose a suitable f.\nTrade-off: Maintain required performance and memory operating margins and check edge slew after voltage or sizing changes.","d":"Switching mechanism: A full 0→1 event transfers Q=CVDD. The supply provides CVDD², half of which is dissipated in the pull-up while half is stored. On 1→0 the stored half is dissipated. The net switching energy for a complete charge/discharge sequence is CVDD².\nAverage expression: If αᵢ is the average number of 0→1 events per reference clock cycle at node i, Psw=ΣαᵢCᵢVDD²f for nodes sharing a supply. Dynamic power also includes short-circuit current during finite input edges. Glitches and toggling clock networks contribute through their switching activities.\nReduce voltage: Lower VDD reduces switching energy quadratically. At fixed C, α and f, changing 1.0 V to 0.8 V gives 64% of the switching power. Budget for slower devices and memory voltage limits.\nReduce activity or frequency: Integrated clock gating suppresses idle clock-tree toggles; operand isolation blocks unnecessary datapath activity; balancing paths can curtail glitches. Reducing f helps workloads without a tight throughput requirement.\nReduce capacitance and overlap: Limit high-activity wire length, avoid excessive buffering or upsizing and control input slew. Check timing and power together because choices that reduce C can also reduce drive."}},{"id":"cmos-u5-q6","subject":"cmos","unit":5,"number":6,"q":"Explain static (leakage) power. Name the different leakage components.","ans":{"s":"Pstatic≈VDDIleak. Leakage comes from subthreshold conduction, gate tunneling, reverse-biased junctions and GIDL.","m":"Definition: Pstatic≈VDDIleak under stable inputs. Leakage changes with PVT and input state.\nComponents: Off-channel subthreshold current, gate-dielectric tunneling, reverse junction leakage and gate-induced drain leakage are major mechanisms. The last is field-driven near the drain-side gate edge.\nReduction: Favor high-VT cells on slack paths, use power gating for idle domains or apply supported body bias. Recheck timing, retention and wake-up behavior.","d":"Definition: Static power is the average power drawn while a CMOS circuit is held at a stable logic state. Even with no intentional direct DC path, Pstatic≈VDD·Ileak for a single supply. Leakage can depend on the input vector and temperature.\nSubthreshold: A nominally off MOSFET conducts weak-inversion current between drain and source. It depends strongly on threshold, temperature and drain bias. Stacking off devices can reduce it through internal source and drain voltages.\nGate leakage: Carriers can tunnel through thin gate dielectric. Its importance depends on oxide properties, equivalent thickness and terminal voltages. Gate leakage can flow into channel or overlapping source/drain regions.\nJunction and field leakage: Reverse-biased source/body and drain/body junctions have depletion generation and field-induced leakage. High fields near the drain-side gate edge can also produce gate-induced drain leakage, often via band-to-band tunneling. Keep these categories distinct without double-counting the same measured current.\nMitigation: Use high-VT cells on noncritical paths, power-gate idle blocks, or use appropriate body bias where supported. Account for slower devices, startup or retention needs and process-dependent leakage trade-offs."}},{"id":"cmos-u5-q7","subject":"cmos","unit":5,"number":7,"q":"Explain the power-delay trade-off. Define the power-delay product (PDP).","ans":{"s":"PDP=Pavg·tp, in joules. Increasing drive or VDD may improve speed while raising energy or power.","m":"Speed versus power: Wider devices and higher VDD can reduce delay but may increase switched capacitance, switching energy or leakage. Lower VDD saves CVDD² energy at the cost of slower operation.\nPDP: PDP=Pavg·tp with units of joules. For 2 mW and 100 ps, PDP=0.2 pJ.\nComparison: Use the same workload, loading and average-power conditions. A low PDP design can still fail a strict delay target.","d":"Trade-off: Faster logic needs strong current to charge or discharge its load. In the first-order model tp≈0.69ReqCL. Increasing width can reduce Req but also raises diffusion capacitance and loads the preceding stage, so delay gains eventually shrink.\nVoltage effect: Higher VDD generally increases gate overdrive and reduces delay, but increases dynamic energy per charged node in proportion to CVDD². Lowering VDD saves energy but can require a slower clock. Lower-VT devices can improve delay while increasing leakage.\nPower–delay product: PDP=Pavg·tp, measured in joules. State the average-power window, activity, load and delay convention. If power is averaged over precisely the same event interval as tp, this product is the energy in that interval.\nWorked comparison: A gate with Pavg=2 mW and tp=100 ps has PDP=0.2 pJ. A second gate at 1 mW and 160 ps has PDP=0.16 pJ. The second has a lower PDP but misses any deadline below 160 ps.\nDesign method: Apply the timing constraint first, then compare feasible options at the same supply, load and activity assumptions. Use an event-integrated energy calculation when the power-averaging interval differs from the gate delay."}},{"id":"cmos-u5-q8","subject":"cmos","unit":5,"number":8,"q":"Explain wire capacitance and wire resistance. Explain the impact of interconnect on circuit delay.","ans":{"s":"R≈RsheetL/W, C≈cL. Distributed wire-only RC delay scales roughly with L². Coupling changes effective C.","m":"Resistance: Rw=ρL/(Wt)=Rsheet·L/W, so resistance grows with length and shrinks with width or thickness.\nCapacitance: Area, fringe and neighboring-net coupling determine capacitance per unit length c; use Cw≈cL for a uniform wire.\nDelay: The far-end Elmore estimate is Rdriver(Cw+CL)+Rw(Cw/2+CL). The self term scales as L². Opposite-direction neighbor switching can make the effective capacitive load larger.\nCoupling: An adjacent wire switching oppositely can increase effective load, so spacing and switching direction both matter.","d":"Resistance: Uniform metal has Rw=ρL/(Wt)=Rsheet·L/W, where ρ is resistivity, L length, W width and t thickness. Long, narrow lines and vias add series resistance. Actual extraction includes geometry and technology effects beyond the sheet approximation.\nCapacitance: The line couples to substrate, reference conductors and neighboring nets. Area and fringing components along the wire give Cw≈cL when the cross section and neighbors are uniform. Coupling depends on spacing and adjacent activity.\nDistributed model: Model the line as many R–C sections rather than putting all wire capacitance at its far endpoint. A first-order far-end Elmore time constant is Rdriver(Cw+CL)+Rw(Cw/2+CL), for uniform Rw and Cw with terminal load CL.\nLength dependence: The line's self contribution RwCw/2 increases approximately as L². Doubling length at fixed geometry quadruples that term, while the driver term due to the wire load roughly doubles.\nSignal consequences: Neighboring nets switching oppositely can increase effective coupling compared with common-direction switching. Series resistance and capacitance slow output edges and may break timing. Check actual extracted parasitics, crosstalk and arrival windows at signoff.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 670 192\" role=\"img\" aria-label=\"Distributed wire RC ladder driven through effective output resistance\" style=\"display:block;width:100%;height:auto;max-width:670px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Distributed wire RC ladder driven through effective output resistance\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"669\" height=\"191\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"60\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"190\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"325\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"460\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M34 61 H60 M137 61 H190 M267 61 H325 M402 61 H460 M537 61 H626\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-line
