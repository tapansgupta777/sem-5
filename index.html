<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,"Segoe UI",system-ui,sans-serif;line-height:1.6}a{color:inherit;text-underline-offset:3px}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,[tabindex="-1"]:focus-visible{outline:2px solid var(--accent);outline-offset:4px} [hidden]{display:none!important}
.top{position:sticky;top:0;background:#000;z-index:10;border-bottom:1px solid var(--line)}.bar{max-width:var(--width);margin:auto;padding:13px 28px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px}.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;font-weight:760;text-decoration:none;letter-spacing:-.02em}.brand svg{color:var(--accent)}

.results{position:absolute;top:calc(100% + 8px);left:0;right:0;min-width:min(430px,calc(100vw - 34px));background:#101013;border:1px solid #3c3c43;border-radius:10px;box-shadow:0 18px 42px #000d;max-height:min(430px,55vh);overflow:auto}.result-count{padding:8px 12px;color:var(--muted);font-size:.78rem;border-bottom:1px solid var(--line)}.result{display:block;width:100%;border:0;border-bottom:1px solid var(--line);padding:9px 12px;background:none;color:var(--fg);text-align:left;line-height:1.4}.result:last-child{border-bottom:0}.result:hover,.result[aria-selected=true]{background:var(--active)}.result small{color:var(--accent);display:block;font-family:var(--mono);font-size:.69rem;margin-bottom:3px}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;background:var(--panel);width:max-content;max-width:100%}.modes button{background:transparent;color:var(--muted);border:1px solid transparent;border-radius:6px;padding:5px 11px;font-size:.82rem;line-height:1.4;white-space:nowrap}.modes button:hover{color:var(--fg);border-color:#45454b}.modes button[aria-pressed=true]{color:var(--accent);background:var(--active);border-color:#42562d;font-weight:650}
main{max-width:var(--width);min-height:72vh;margin:auto;padding:0 28px 60px}.home{padding:clamp(56px,9vw,113px) 0 30px}.home h1,.subject-head h1{letter-spacing:-.064em;line-height:1.04;margin:0;font-weight:750}.home h1{font-size:clamp(3.2rem,8vw,6.6rem)}.subtitle{color:var(--muted);margin:17px 0 30px;font-size:1.1rem}.home .subtitle{margin-bottom:33px}.subject-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{display:grid;grid-template-columns:48px 1fr auto;align-items:center;text-decoration:none;gap:16px;min-height:126px;padding:19px 21px;background:var(--panel);border:1px solid var(--line);border-radius:13px}.tile:hover{border-color:var(--subject);background:#121214}.tile-icon{display:grid;place-items:center;color:var(--subject);width:46px;height:46px;border:1px solid color-mix(in srgb,var(--subject) 30%,transparent);border-radius:10px;background:color-mix(in srgb,var(--subject) 9%,#070707)}.tile-name{display:block;font-size:clamp(1.1rem,2.1vw,1.48rem);letter-spacing:-.03em;font-weight:670;line-height:1.2}.tile-meta{display:block;margin-top:7px;color:var(--muted);font-size:.81rem}.tile-arrow{color:var(--subject);font-size:1.5rem}.syllabus{margin-top:18px;color:var(--muted);font-size:.86rem}.syllabus a:hover,.refs a:hover{color:var(--accent)}

.reader{display:grid;grid-template-columns:minmax(185px,218px) minmax(0,1fr);gap:27px;align-items:start}.index{position:sticky;top:88px;max-height:calc(100vh - 105px);overflow:auto;scrollbar-width:thin}.index summary{font-weight:650;font-size:.86rem;color:var(--muted);list-style:none;margin:0 0 10px;padding:0 8px;cursor:pointer}.index summary::-webkit-details-marker{display:none}.index summary::after{content:"+";float:right}.index[open] summary::after{content:"−"}.unit-link{padding:8px;margin-bottom:2px;border-radius:6px;display:grid;grid-template-columns:22px 1fr;gap:5px;text-decoration:none;font-size:.82rem;line-height:1.38;color:#ccccd2}.unit-link:hover{background:#151518;color:var(--fg)}.unit-link span{color:var(--subject);font-family:var(--mono);font-size:.76rem}.index .source{display:inline-block;margin:14px 8px 0;font-size:.78rem;color:var(--muted)}
.unit{scroll-margin-top:90px;margin-bottom:34px}.unit-head{display:flex;align-items:baseline;gap:10px;margin:0 0 13px;font-size:1.3rem;line-height:1.28;letter-spacing:-.026em}.unit-head span{font:.75rem var(--mono);color:var(--subject);white-space:nowrap}.question{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 19px;margin-bottom:10px;scroll-margin-top:89px}.question:target,.question:focus{border-color:var(--subject)}.q-top{display:grid;grid-template-columns:53px minmax(0,1fr);gap:8px;align-items:baseline}.q-id{font:.75rem var(--mono);color:var(--subject);text-decoration:none}.q-id:hover{text-decoration:underline}.q-title{font-size:1rem;font-weight:680;line-height:1.43;margin:0}.local{margin:10px 0}.local .modes button{font-size:.73rem;padding:4px 8px}.answer{color:#d7d7dd;font-size:.93rem;overflow-wrap:anywhere}.answer p{white-space:pre-wrap;margin:8px 0}.answer p:last-child{margin-bottom:0}.answer code{font-family:var(--mono)}.answer ol,.answer ul{padding-left:1.4rem}.answer table{border-collapse:collapse;display:block;overflow:auto}.answer th,.answer td{border:1px solid var(--line);padding:5px 8px}
.codebox{margin:12px 0 0;border:1px solid #292932;border-radius:8px;overflow:hidden;background:#111117}.codebar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292932;padding:4px 10px;font: .73rem var(--mono);color:#b7b7c4}.copy{background:none;border:1px solid #3b3b48;border-radius:4px;padding:3px 7px;color:#dedeee}.copy:hover{color:var(--accent);border-color:var(--accent)}pre{margin:0;padding:11px 13px;overflow:auto;font: .84rem/1.55 var(--mono);tab-size:4;color:#e3e7ed}.tok-k{color:#e6a8ff}.tok-n{color:#ffbf83}.tok-s{color:#c6eb98}.tok-c{color:#9295aa}.tok-p{color:#8cdbff}
figure.study{margin:13px 0 0;max-width:720px;overflow:auto}.diagram{background:#080b0b;border:1px solid #29312e;border-radius:8px;padding:8px;overflow:auto}.diagram svg{display:block;width:100%;min-width:330px;max-height:430px}.diagram svg text{font-family:var(--mono)}.study figcaption{font-size:.77rem;color:var(--muted);margin-top:5px}.external-fig img{max-width:100%;max-height:280px;display:block;background:#f1f2f0;border-radius:7px;padding:7px}.external-fig:not(:has(img:not([hidden]))){display:none}
.footer{border-top:1px solid var(--line);color:var(--muted);max-width:var(--width);margin:auto;padding:15px 28px 30px;font-size:.83rem}.refs summary{cursor:pointer}.refs ul{padding-left:1.2rem}.jump{position:fixed;bottom:16px;right:18px;z-index:3;border-radius:7px;border:1px solid var(--line);background:#111;color:var(--fg);padding:4px 10px;text-decoration:none}
@media(max-width:790px){.bar{gap:10px 15px;padding:10px 17px;grid-template-columns:auto auto;justify-content:space-between}.search{grid-column:1/-1;grid-row:2}.global{justify-self:end}.reader{display:block}.index{position:static;max-height:none;margin:0 0 20px;border-bottom:1px solid var(--line);padding-bottom:9px}.index summary{padding-left:0}.index .source{margin:7px 0}.unit,.question{scroll-margin-top:117px}main{padding-left:17px;padding-right:17px}.footer{padding-left:17px;padding-right:17px}}
@media(max-width:575px){.subject-grid{grid-template-columns:1fr}.tile{min-height:87px;padding:14px}.home{padding-top:48px}.bar .modes button{padding:4px 6px;font-size:.73rem}.brand{font-size:.87rem;gap:6px}.brand svg{width:18px}.question{padding:12px}.q-top{grid-template-columns:43px minmax(0,1fr)}.q-id{font-size:.69rem}.unit-head{font-size:1.15rem}}
@media print{.top,.index,.local,.copy,.jump,.crumb,.footer{display:none!important}:root{color-scheme:light}body,main,.question,.codebox{color:black;background:white}.answer,pre{color:black}.reader{display:block}main{padding:0}.question{break-inside:avoid}.diagram{print-color-adjust:exact}}

<script id="study-data" type="application/json">{"subjects":[{"id":"cmos","name":"Analog and Digital CMOS Design","code":"PCC-302-ECV","color":"#c6fa83","source":"https://chatgpt.com/library?account_id=personal&file_id=libfile_35f62f7c281c819193bf2915de0bfdce","count":70,"units":[{"title":"MOS Devices & Analog Building Blocks","questions":[{"id":"cmos-u1-q1","subject":"cmos","unit":1,"number":1,"q":"Explain the structure and working of an n-channel enhancement-type MOSFET with a neat diagram.","ans":{"s":"NMOS has n+ source/drain in a p body. A positive VGS above VT induces an n-channel.","m":"An enhancement NMOS uses an insulated gate over a p-type body between n+ source and drain. Positive VGS depletes holes and, above VT, attracts enough electrons for strong inversion. A positive VDS moves electrons from source to drain, so conventional drain current flows drain to source.","d":"Label the n+ source and drain, p-type bulk, gate electrode, oxide and gate-induced inversion channel. The oxide electrically isolates the gate, giving nearly zero steady gate current in the ideal model. At VGS=0 there is no strong inversion channel. Raising VGS first depletes holes under the oxide. At VGS>VT, an electron inversion layer joins the source and drain. With VDS>0, electrons drift toward the drain and conventional ID flows toward the source. For VDS≥VGS−VT the channel pinches off at its drain end, but electrons still cross the high-field region. Tie the body to the lowest circuit potential, often the source, to keep the junction diodes reverse biased.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 520 205\" role=\"img\" aria-label=\"Enhancement NMOS cross-section under positive inversion bias\" style=\"display:block;width:100%;height:auto;max-width:520px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Enhancement NMOS cross-section under positive inversion bias\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"519\" height=\"204\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"58\" y=\"83\" width=\"404\" height=\"87\" fill=\"#322235\" stroke=\"#ae8caf\" rx=\"2\"/>\u003crect x=\"88\" y=\"84\" width=\"82\" height=\"36\" fill=\"#123548\" stroke=\"#60a5fa\" rx=\"2\"/>\u003crect x=\"350\" y=\"84\" width=\"82\" height=\"36\" fill=\"#123548\" stroke=\"#60a5fa\" rx=\"2\"/>\u003crect x=\"169\" y=\"82\" width=\"182\" height=\"5\" fill=\"#12513b\" stroke=\"#4ade80\" rx=\"2\"/>\u003crect x=\"175\" y=\"72\" width=\"170\" height=\"9\" fill=\"#145258\" stroke=\"#5eead4\" rx=\"2\"/>\u003crect x=\"175\" y=\"49\" width=\"170\" height=\"23\" fill=\"#4c283b\" stroke=\"#fb7185\" rx=\"2\"/>\u003cpath d=\"M129 84 V45 M391 84 V45 M426 170 V187 M260 49 V27\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ctext x=\"129\" y=\"39\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">S\u003c/text>\u003ctext x=\"391\" y=\"39\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">D\u003c/text>\u003ctext x=\"260\" y=\"22\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">G\u003c/text>\u003ctext x=\"260\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Gate electrode\u003c/text>\u003ctext x=\"260\" y=\"103\" fill=\"#86efac\" font-size=\"13\" text-anchor=\"middle\">Inversion channel (n)\u003c/text>\u003ctext x=\"128\" y=\"107\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"392\" y=\"107\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"260\" y=\"149\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p-type body\u003c/text>\u003ctext x=\"426\" y=\"200\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">B\u003c/text>\u003c/svg>"}},{"id":"cmos-u1-q2","subject":"cmos","unit":1,"number":2,"q":"Explain the three operating regions of an NMOS transistor (cut-off, triode and saturation) with the condition for each region.","ans":{"s":"Cutoff: VGS≤VT. Triode: 0≤VDS\u003cVOV. Saturation: VDS≥VOV. VOV=VGS−VT.","m":"For VDS≥0 define VOV=VGS−VT. Cutoff has VOV≤0 and ID≈0. With VOV>0, triode occurs for VDS\u003cVOV and behaves as a gate-controlled resistor at small VDS. Saturation begins at VDS=VOV when inversion vanishes at the drain end.","d":"Assume an enhancement long-channel NMOS, common source/body and positive VDS. Set β=μnCox(W/L) and VOV=VGS−VT.\n• Cutoff, VGS≤VT: strong-inversion ID≈0, with subthreshold current in a real device.\n• Triode, VGS>VT and 0≤VDS\u003cVOV: ID=β(VOV·VDS−VDS²/2). Near VDS=0, Ron≈1/(βVOV).\n• Saturation, VGS>VT and VDS≥VOV: the local gate-to-channel voltage at the drain reaches threshold. Ideal ID=βVOV²/2, approximately independent of VDS. A finite output slope appears with channel-length modulation.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 245\" role=\"img\" aria-label=\"NMOS output characteristics for three gate overdrives\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>NMOS output characteristics for three gate overdrives\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"499\" height=\"244\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M65 199 H465 l-7 -4 m7 4 -7 4 M65 199 V30 l-4 7 m4 -7 4 7\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q100 158 135 151 Q180 145 445 133\" fill=\"none\" stroke=\"#86efac\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q165 82 205 90 Q270 86 445 74\" fill=\"none\" stroke=\"#5eead4\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q150 78 224 52 Q248 44 280 44 L445 33\" fill=\"none\" stroke=\"#93c5fd\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q164 197 280 44\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"5 6\"/>\u003ctext x=\"49\" y=\"25\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">ID\u003c/text>\u003ctext x=\"457\" y=\"224\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDS\u003c/text>\u003ctext x=\"83\" y=\"222\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">0\u003c/text>\u003ctext x=\"119\" y=\"174\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">Triode\u003c/text>\u003ctext x=\"341\" y=\"164\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">Saturation\u003c/text>\u003ctext x=\"385\" y=\"115\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Larger VGS\u003c/text>\u003ctext x=\"365\" y=\"57\" fill=\"#fbbf24\" font-size=\"12\" text-anchor=\"middle\">VDS = VOV boundary\u003c/text>\u003c/svg>"}},{"id":"cmos-u1-q3","subject":"cmos","unit":1,"number":3,"q":"Draw and explain the I–V characteristics of an NMOS transistor. Write the drain current equations and explain channel length modulation.","ans":{"s":"ID rises in triode, flattens in saturation, then slopes upward with λ. ro≈1/(λID).","m":"For each fixed VGS>VT, ID rises with VDS until VDS=VOV, then ideally saturates at βVOV²/2. Channel-length modulation shortens the conducting channel as VDS increases, causing a finite slope and output resistance.","d":"Plot ID versus VDS for several increasing VGS values. Define VOV=VGS−VT and β=μnCoxW/L. Cutoff: ID≈0 for VGS≤VT. Triode: ID=β[VOV·VDS−VDS²/2], for 0≤VDS\u003cVOV. At VDS=VOV, ID=βVOV²/2. Beyond that boundary, a simple first-order saturation model is ID≈(βVOV²/2)(1+λVDS). Higher VGS moves the knee right and raises the current. Increasing VDS expands the drain depletion region toward source, shortening the effective inversion length and increasing current. The small-signal output conductance is gds≈λID and ro≈1/(λID) for small λVDS. A separate transfer plot ID versus VGS at sufficiently large fixed VDS follows an approximate square law above VT.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 245\" role=\"img\" aria-label=\"NMOS output characteristics for three gate overdrives\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>NMOS output characteristics for three gate overdrives\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"499\" height=\"244\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M65 199 H465 l-7 -4 m7 4 -7 4 M65 199 V30 l-4 7 m4 -7 4 7\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q100 158 135 151 Q180 145 445 133\" fill=\"none\" stroke=\"#86efac\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q165 82 205 90 Q270 86 445 74\" fill=\"none\" stroke=\"#5eead4\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q150 78 224 52 Q248 44 280 44 L445 33\" fill=\"none\" stroke=\"#93c5fd\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q164 197 280 44\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"5 6\"/>\u003ctext x=\"49\" y=\"25\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">ID\u003c/text>\u003ctext x=\"457\" y=\"224\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDS\u003c/text>\u003ctext x=\"83\" y=\"222\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">0\u003c/text>\u003ctext x=\"119\" y=\"174\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">Triode\u003c/text>\u003ctext x=\"341\" y=\"164\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">Saturation\u003c/text>\u003ctext x=\"385\" y=\"115\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Larger VGS\u003c/text>\u003ctext x=\"365\" y=\"57\" fill=\"#fbbf24\" font-size=\"12\" text-anchor=\"middle\">VDS = VOV boundary\u003c/text>\u003c/svg>"}},{"id":"cmos-u1-q4","subject":"cmos","unit":1,"number":4,"q":"Draw the low-frequency small-signal model of a MOSFET. Define transconductance (gm) and output resistance (Ro).","ans":{"s":"Gate open. Drain–source: gm·vgs and gmb·vbs in parallel with ro. gm≈2ID/VOV and ro≈1/(λID).","m":"Linearize at the saturation bias point. id=gmvgs+gmbvbs+gdsvds. The gate is open at low frequency. Draw a drain-to-source dependent current source in parallel with ro=1/gds. A source-tied body makes vbs=0.","d":"The incremental model describes small AC variations about the DC bias. The insulated gate and reverse-biased body imply ideally negligible small-signal input current when capacitances are neglected. Put a dependent current source gm·vgs + gmb·vbs directed drain to source, in parallel with ro. Define gm=∂ID/∂VGS at fixed VDS,VBS and gds=∂ID/∂VDS at fixed VGS,VBS. In long-channel strong-inversion saturation gm≈βVOV=2ID/VOV≈√(2βID), and ro≈1/(λID). Body transconductance is gmb=∂ID/∂VBS, often gmb≈gmγ/(2√(2ϕF+VSB)). If body follows source, vbs=0. Valid for signals small enough to preserve the bias region.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 208\" role=\"img\" aria-label=\"Low-frequency NMOS incremental model\" style=\"display:block;width:100%;height:auto;max-width:560px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Low-frequency NMOS incremental model\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"559\" height=\"207\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M338 40 H450 M338 165 H450 M338 40 V81 M338 125 V165 M450 40 V67 l-7 7 14 12 -14 12 14 12 -14 12 14 12 -7 7 V165\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M338 86 V119 l-5 -8 m5 8 5 -8\" fill=\"none\" stroke=\"#67e8f9\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M60 78 H123 M60 133 H123\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M376 40 V24 M376 165 V184\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"338\" cy=\"103\" r=\"24\" fill=\"none\" stroke=\"#67e8f9\"/>\u003ccircle cx=\"376\" cy=\"40\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"376\" cy=\"165\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"377\" y=\"19\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Drain\u003c/text>\u003ctext x=\"377\" y=\"199\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Source\u003c/text>\u003ctext x=\"252\" y=\"107\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">gm·vgs + gmb·vbs\u003c/text>\u003ctext x=\"476\" y=\"108\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">ro\u003c/text>\u003ctext x=\"92\" y=\"70\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Gate (open)\u003c/text>\u003ctext x=\"92\" y=\"125\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Body (open)\u003c/text>\u003c/svg>"}},{"id":"cmos-u1-q5","subject":"cmos","unit":1,"number":5,"q":"Write a short note on capacitors and resistors used in CMOS circuits.","ans":{"s":"Caps: MIM/MOM/MOS. Resistors: poly/diffusion/well or triode MOS. Check matching, parasitics, voltage coefficient.","m":"MIM and MOM capacitors are usually chosen for linearity. MOS capacitors give high density but a bias-dependent C–V curve. Poly, diffusion or well resistance scales approximately with the number of squares. An on-chip triode MOS offers bias-tunable resistance.","d":"MIM uses two dedicated metal plates with insulating dielectric. MOM uses interdigitated conductors and fringe coupling. MOS capacitance uses gate oxide and semiconductor charge, so it can vary with inversion/depletion bias. Include plate, overlap and substrate parasitics. Passive resistors use polysilicon, diffusion or well material, with R≈RsheetL/W plus contact/end contributions. Diffusion/well structures bring junction capacitance and voltage dependence. A triode MOS behaves as a compact tunable resistor near VDS=0, with Ron≈1/[μCox(W/L)VOV]. For precision compare area, matching, temperature and voltage coefficients, parasitics and allowed voltage. Use adjacent matched geometries and suitable dummy elements for ratios."}},{"id":"cmos-u1-q6","subject":"cmos","unit":1,"number":6,"q":"Explain the MOS switch. Compare NMOS switch, PMOS switch and CMOS transmission-gate switch.","ans":{"s":"NMOS passes strong 0, PMOS strong 1. Parallel NMOS+PMOS with complementary control passes both rails.","m":"An NMOS switch turns on with a high gate, but a rising output weakens it near VG−VT. A PMOS uses a low gate and passes a high well, while a falling low can stop near VG+|VTp|. Parallel devices with complementary controls form a full-swing transmission gate.","d":"A MOS analog switch uses the triode region for small terminal voltage difference, so Ron depends on signal and gate overdrive. NMOS with gate at VDD passes GND strongly, but charging a passive node from VDD stops near VDD−VTn, modified by body effect. PMOS with gate at GND passes VDD strongly, but discharging a node toward ground slows and stops near |VTp|. A CMOS transmission gate puts both channels in parallel, gates EN and EN̄ respectively, with body ties to GND and VDD. On, the rail-favored device carries each endpoint and both contribute around midrange. Off, both are open except leakage and parasitics. Tradeoffs are complementary control, extra capacitance, on-resistance variation and charge injection."}},{"id":"cmos-u1-q7","subject":"cmos","unit":1,"number":7,"q":"What is a MOS diode (diode-connected MOSFET)? Explain its working and show that its small-signal resistance is approximately 1/gm.","ans":{"s":"Tie gate to drain. vgs=vds and r≈1/(gm+gds)≈1/gm if body tracks source.","m":"A diode-connected MOSFET with gate shorted to drain operates in saturation when on, because VDS=VGS≥VGS−VT. A small test voltage across the device produces incremental current (gm+gds)v, yielding r=1/(gm+gds).","d":"Connect G and D as one terminal and take S as the other. For an enhancement NMOS, DC conduction starts in strong inversion when VGS>VT and obeys the saturation relationship since VDS=VGS. Apply a small voltage v between the G/D node and a fixed source/body. Both vgs and vds equal v, so the incremental current is i=(gm+gds)v; hence r=ro∥(1/gm)=1/(gm+gds)≈1/gm when gmro≫1. If the measured configuration moves the source against a fixed bulk, account for gmb. The connection appears in current-mirror references and MOS active loads."}},{"id":"cmos-u1-q8","subject":"cmos","unit":1,"number":8,"q":"Explain how a MOSFET is used as a current source and a current sink. Explain the basic NMOS current mirror.","ans":{"s":"NMOS sinks to GND, PMOS sources from VDD. A current mirror copies VGS and scales by W/L.","m":"Set VGS or VSG to fix overdrive and keep the transistor in saturation. An NMOS mirror drives its diode-connected reference with IREF and couples both gates. With similar devices and adequate output voltage, IOUT≈IREF×(W/L)out/(W/L)ref.","d":"Place an NMOS below the load to draw current into GND, or a PMOS above the load to supply current from VDD. In saturation the current is mainly a function of gate overdrive, while finite ro limits ideal behavior. In the NMOS mirror, source/body ties are common and M1 drain is shorted to both gates. IREF forces the required VGS on M1. M2 reproduces current proportional to its W/L for matched threshold, μn and Cox. Require VOUT≥VOV for M2 saturation. For the PMOS source require VSD≥VOVp, equivalently VOUT≤VDD−VOVp. Output-voltage mismatch and channel-length modulation introduce systematic error.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 570 220\" role=\"img\" aria-label=\"Basic NMOS current mirror\" style=\"display:block;width:100%;height:auto;max-width:570px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Basic NMOS current mirror\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"569\" height=\"219\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M150 42 V86 M150 86 V111 M150 147 V181 H400 V147 M400 111 V42 M130 114 V143 M380 114 V143 M150 111 V147 M400 111 V147\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M150 86 H102 V129 H130 M102 129 V96 H355 V129 H380\" fill=\"none\" stroke=\"#93c5fd\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M74 27 H226 M121 181 H433 M284 181 V197\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M150 48 V73 l-4 -6 m4 6 4 -6 M400 48 V73 l-4 -6 m4 6 4 -6\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"150\" cy=\"86\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"102\" cy=\"129\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"284\" cy=\"181\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"150\" y=\"22\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Reference bias\u003c/text>\u003ctext x=\"400\" y=\"34\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT / load\u003c/text>\u003ctext x=\"181\" y=\"62\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">IREF\u003c/text>\u003ctext x=\"434\" y=\"62\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">IOUT\u003c/text>\u003ctext x=\"177\" y=\"137\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M1\u003c/text>\u003ctext x=\"425\" y=\"137\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M2\u003c/text>\u003ctext x=\"214\" y=\"90\" fill=\"#93c5fd\" font-size=\"13\" text-anchor=\"middle\">Shared VGS\u003c/text>\u003ctext x=\"284\" y=\"211\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">GND / bulk ties\u003c/text>\u003c/svg>"}},{"id":"cmos-u1-q9","subject":"cmos","unit":1,"number":9,"q":"Explain source degeneration. How does it affect the effective transconductance and output resistance?","ans":{"s":"Source resistor adds negative feedback. Gm↓, Rout↑. Gm≈gm/(1+gmRS), Rout≈ro(1+gmRS)+RS.","m":"A rise in drain current raises the source voltage and reduces vgs. With body grounded, use Gm=gm/[1+(gm+gmb+gds)RS] when the drain is AC shorted. Looking into the drain gives Rout=ro+[1+(gm+gmb)ro]RS.","d":"Insert an unbypassed RS in the source lead. Neglect gate/body currents so vs=idRS. With drain AC-grounded, vgs=vg−idRS, vbs=−idRS, and vds=−idRS. Substituting in id=gmvgs+gmbvbs+gdsvds gives Gm=id/vg=gm/[1+(gm+gmb+gds)RS]. For drain resistance ground gate and body, apply a test voltage at the drain and obtain Rout=ro+RS+(gm+gmb)roRS. Omit gmb for a source-tied body. With gmro≫1 these reduce to Gm≈gm/(1+gmRS) and Rout≈ro(1+gmRS)+RS. Feedback improves linearity and current-source stiffness while consuming RSID headroom."}},{"id":"cmos-u1-q10","subject":"cmos","unit":1,"number":10,"q":"Explain the steps to simulate the I–V characteristics of an NMOS transistor using PSPICE.","ans":{"s":"DC sweep VDS, step VGS, plot ID. To get transfer curve sweep VGS at fixed VDS.","m":"Build an NMOS test circuit with source/bulk grounded and independent DC gate and drain sources. In a DC Sweep profile set the drain source as primary sweep and gate voltage as secondary sweep. Plot current through the drain with the correct sign.","d":"In PSpice Capture place a four-terminal NMOS, its `.MODEL` or PDK model, two DC sources named VDS and VGS, and reference node 0. Tie source and body to 0, and connect each voltage source from its node to ground. Create a simulation profile with Analysis type DC Sweep. Set VDS as the primary voltage-source sweep, e.g. 0 to 1.8 V in 10 mV increments when permitted by the model. Enable a secondary source or parameter sweep for VGS across several below- and above-threshold values. In Probe plot drain current, or −I(VDS) if source current uses SPICE passive sign. Identify cutoff, the knee near VGS−VT and the saturation slope. Sweep VGS at fixed sufficient VDS for the transfer trace. Extract gm or gds from local slopes at a specified operating point."}},{"id":"cmos-u1-q11","subject":"cmos","unit":1,"number":11,"q":"Explain the operation of an n-channel enhancement MOSFET in the cut-off, triode and saturation regions with neat I–V characteristics.","ans":{"s":"Cutoff: VGS≤VT. Triode: 0≤VDS\u003cVOV. Saturation: VDS≥VOV. VOV=VGS−VT.","m":"For VDS≥0 define VOV=VGS−VT. Cutoff has VOV≤0 and ID≈0. With VOV>0, triode occurs for VDS\u003cVOV and behaves as a gate-controlled resistor at small VDS. Saturation begins at VDS=VOV when inversion vanishes at the drain end.","d":"Assume an enhancement long-channel NMOS, common source/body and positive VDS. Set β=μnCox(W/L) and VOV=VGS−VT.\n• Cutoff, VGS≤VT: strong-inversion ID≈0, with subthreshold current in a real device.\n• Triode, VGS>VT and 0≤VDS\u003cVOV: ID=β(VOV·VDS−VDS²/2). Near VDS=0, Ron≈1/(βVOV).\n• Saturation, VGS>VT and VDS≥VOV: the local gate-to-channel voltage at the drain reaches threshold. Ideal ID=βVOV²/2, approximately independent of VDS. A finite output slope appears with channel-length modulation.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 245\" role=\"img\" aria-label=\"NMOS output characteristics for three gate overdrives\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>NMOS output characteristics for three gate overdrives\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"499\" height=\"244\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M65 199 H465 l-7 -4 m7 4 -7 4 M65 199 V30 l-4 7 m4 -7 4 7\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q100 158 135 151 Q180 145 445 133\" fill=\"none\" stroke=\"#86efac\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q165 82 205 90 Q270 86 445 74\" fill=\"none\" stroke=\"#5eead4\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q150 78 224 52 Q248 44 280 44 L445 33\" fill=\"none\" stroke=\"#93c5fd\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q164 197 280 44\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"5 6\"/>\u003ctext x=\"49\" y=\"25\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">ID\u003c/text>\u003ctext x=\"457\" y=\"224\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDS\u003c/text>\u003ctext x=\"83\" y=\"222\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">0\u003c/text>\u003ctext x=\"119\" y=\"174\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">Triode\u003c/text>\u003ctext x=\"341\" y=\"164\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">Saturation\u003c/text>\u003ctext x=\"385\" y=\"115\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Larger VGS\u003c/text>\u003ctext x=\"365\" y=\"57\" fill=\"#fbbf24\" font-size=\"12\" text-anchor=\"middle\">VDS = VOV boundary\u003c/text>\u003c/svg>"}},{"id":"cmos-u1-q12","subject":"cmos","unit":1,"number":12,"q":"Draw the low-frequency small-signal model of a MOSFET and define the parameters gm and ro. Write their expressions.","ans":{"s":"Gate open. Drain–source: gm·vgs and gmb·vbs in parallel with ro. gm≈2ID/VOV and ro≈1/(λID).","m":"Linearize at the saturation bias point. id=gmvgs+gmbvbs+gdsvds. The gate is open at low frequency. Draw a drain-to-source dependent current source in parallel with ro=1/gds. A source-tied body makes vbs=0.","d":"The incremental model describes small AC variations about the DC bias. The insulated gate and reverse-biased body imply ideally negligible small-signal input current when capacitances are neglected. Put a dependent current source gm·vgs + gmb·vbs directed drain to source, in parallel with ro. Define gm=∂ID/∂VGS at fixed VDS,VBS and gds=∂ID/∂VDS at fixed VGS,VBS. In long-channel strong-inversion saturation gm≈βVOV=2ID/VOV≈√(2βID), and ro≈1/(λID). Body transconductance is gmb=∂ID/∂VBS, often gmb≈gmγ/(2√(2ϕF+VSB)). If body follows source, vbs=0. Valid for signals small enough to preserve the bias region.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 208\" role=\"img\" aria-label=\"Low-frequency NMOS incremental model\" style=\"display:block;width:100%;height:auto;max-width:560px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Low-frequency NMOS incremental model\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"559\" height=\"207\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M338 40 H450 M338 165 H450 M338 40 V81 M338 125 V165 M450 40 V67 l-7 7 14 12 -14 12 14 12 -14 12 14 12 -7 7 V165\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M338 86 V119 l-5 -8 m5 8 5 -8\" fill=\"none\" stroke=\"#67e8f9\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M60 78 H123 M60 133 H123\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M376 40 V24 M376 165 V184\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"338\" cy=\"103\" r=\"24\" fill=\"none\" stroke=\"#67e8f9\"/>\u003ccircle cx=\"376\" cy=\"40\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"376\" cy=\"165\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"377\" y=\"19\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Drain\u003c/text>\u003ctext x=\"377\" y=\"199\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Source\u003c/text>\u003ctext x=\"252\" y=\"107\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">gm·vgs + gmb·vbs\u003c/text>\u003ctext x=\"476\" y=\"108\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">ro\u003c/text>\u003ctext x=\"92\" y=\"70\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Gate (open)\u003c/text>\u003ctext x=\"92\" y=\"125\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Body (open)\u003c/text>\u003c/svg>"}},{"id":"cmos-u1-q13","subject":"cmos","unit":1,"number":13,"q":"Explain source degeneration. How does a source resistor affect the transconductance and the output resistance of a MOS current source?","ans":{"s":"Source resistor adds negative feedback. Gm↓, Rout↑. Gm≈gm/(1+gmRS), Rout≈ro(1+gmRS)+RS.","m":"A rise in drain current raises the source voltage and reduces vgs. With body grounded, use Gm=gm/[1+(gm+gmb+gds)RS] when the drain is AC shorted. Looking into the drain gives Rout=ro+[1+(gm+gmb)ro]RS.","d":"Insert an unbypassed RS in the source lead. Neglect gate/body currents so vs=idRS. With drain AC-grounded, vgs=vg−idRS, vbs=−idRS, and vds=−idRS. Substituting in id=gmvgs+gmbvbs+gdsvds gives Gm=id/vg=gm/[1+(gm+gmb+gds)RS]. For drain resistance ground gate and body, apply a test voltage at the drain and obtain Rout=ro+RS+(gm+gmb)roRS. Omit gmb for a source-tied body. With gmro≫1 these reduce to Gm≈gm/(1+gmRS) and Rout≈ro(1+gmRS)+RS. Feedback improves linearity and current-source stiffness while consuming RSID headroom."}},{"id":"cmos-u1-q14","subject":"cmos","unit":1,"number":14,"q":"Explain the working of a simple NMOS current mirror. Derive the output current in terms of the reference current and discuss the effect of channel-length modulation.","ans":{"s":"IOUT/IREF≈(W/L)2/(W/L)1 × (1+λ2VDS2)/(1+λ1VDS1). Require VOUT≥VOV.","m":"M1 is diode-connected and carries IREF. M2 has the same gate and source potentials. Dividing their saturation equations gives the geometry ratio multiplied by a channel-length-modulation ratio. Unequal VDS values produce current-copy error.","d":"For matched thresholds, common source/body and common VGS, both devices have the same VOV. The diode-connected M1 has VDS1=VGS. Write IREF=(μnCox/2)(W/L)1VOV²(1+λ1VDS1) and IOUT=(μnCox/2)(W/L)2VOV²(1+λ2VDS2). Dividing yields IOUT=IREF[(W/L)2/(W/L)1][(1+λ2VDS2)/(1+λ1VDS1)]. If λ is small and equal, first-order relative error from VDS mismatch is ≈λ(VOUT−VGS). M2 requires VOUT≥VOV and must stay within ratings. Long channels reduce λ. Cascoding improves output resistance at the cost of compliance voltage.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 570 220\" role=\"img\" aria-label=\"Basic NMOS current mirror\" style=\"display:block;width:100%;height:auto;max-width:570px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Basic NMOS current mirror\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"569\" height=\"219\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M150 42 V86 M150 86 V111 M150 147 V181 H400 V147 M400 111 V42 M130 114 V143 M380 114 V143 M150 111 V147 M400 111 V147\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M150 86 H102 V129 H130 M102 129 V96 H355 V129 H380\" fill=\"none\" stroke=\"#93c5fd\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M74 27 H226 M121 181 H433 M284 181 V197\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M150 48 V73 l-4 -6 m4 6 4 -6 M400 48 V73 l-4 -6 m4 6 4 -6\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"150\" cy=\"86\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"102\" cy=\"129\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"284\" cy=\"181\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"150\" y=\"22\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Reference bias\u003c/text>\u003ctext x=\"400\" y=\"34\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT / load\u003c/text>\u003ctext x=\"181\" y=\"62\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">IREF\u003c/text>\u003ctext x=\"434\" y=\"62\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">IOUT\u003c/text>\u003ctext x=\"177\" y=\"137\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M1\u003c/text>\u003ctext x=\"425\" y=\"137\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M2\u003c/text>\u003ctext x=\"214\" y=\"90\" fill=\"#93c5fd\" font-size=\"13\" text-anchor=\"middle\">Shared VGS\u003c/text>\u003ctext x=\"284\" y=\"211\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">GND / bulk ties\u003c/text>\u003c/svg>"}}]},{"title":"CMOS Amplifiers & Op-Amps","questions":[{"id":"cmos-u2-q1","subject":"cmos","unit":2,"number":1,"q":"Explain the CMOS inverter used as a common-source amplifier. Derive its small-signal voltage gain.","ans":{"s":"Bias near inverter transition. Both transconductances add. Av≈−(gmn+gmp)(ron∥rop∥RL).","m":"Bias the common gates around the transition so both transistors conduct and operate in saturation. A rise in input strengthens the NMOS and weakens the PMOS. Both changes pull the output down, giving Av≈−(gmn+gmp)(ron∥rop∥RL).","d":"Connect both gates to VIN and both drains to VOUT, with NMOS and PMOS sources at GND and VDD. Establish an operating point near the steep part of the DC VTC, for example with external bias or a large DC feedback resistor and capacitively coupled input. Choose VOUT in the range where both devices stay saturated over the signal excursion. For small AC signals both supplies are AC ground. The incremental net pull-down current is (gmn+gmp)vin; the total output conductance is gdsn+gdsp+1/RL. KCL yields Av=vout/vin=−(gmn+gmp)/(gdsn+gdsp+1/RL). Device sizes set the bias and balance slew. High gain near the switching point comes with a restricted input swing and process/supply sensitivity.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 192\" role=\"img\" aria-label=\"CMOS inverter biased as an analog common-source amplifier\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>CMOS inverter biased as an analog common-source amplifier\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"499\" height=\"191\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"228\" y=\"39\" width=\"64\" height=\"30\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"228\" y=\"118\" width=\"64\" height=\"30\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M260 20 V39 M260 69 V118 M260 148 V173 M128 57 H228 M128 57 V133 H228 M260 94 H371\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M244 173 H276 M250 179 H270 M256 185 H264\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"128\" cy=\"93\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"260\" cy=\"94\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"260\" y=\"16\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"260\" y=\"59\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">PMOS\u003c/text>\u003ctext x=\"260\" y=\"138\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">NMOS\u003c/text>\u003ctext x=\"80\" y=\"98\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VBIAS + vin\u003c/text>\u003ctext x=\"397\" y=\"100\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">vout\u003c/text>\u003ctext x=\"373\" y=\"144\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">Both devices are on\u003c/text>\u003c/svg>"}},{"id":"cmos-u2-q2","subject":"cmos","unit":2,"number":2,"q":"Explain the working of a CMOS differential amplifier. Define differential-mode gain, common-mode gain and CMRR.","ans":{"s":"Differential pair steers tail current. Ad=vo/vid, Acm=vo/vcm, CMRR=|Ad/Acm|.","m":"The input pair converts vin+−vin− into opposite changes in branch currents around ITAIL/2. Loads convert current to voltage. An ideal symmetric pair with a stiff tail rejects common-mode changes. Use 20log10|Ad/Acm| for CMRR in dB.","d":"Define vid=vin+−vin− and vcm=(vin++vin−)/2. With equal inputs, matched devices carry ITAIL/2 each. With small differential input ±vid/2, an ideal symmetric half circuit has a virtual AC ground at the common source. The branch changes are ±gm·vid/2. Equal load resistances R give differential gain magnitude gmR and single-ended magnitude gmR/2. A mirror load can sum the opposite branch increments into a single output, giving about gmRout in the idealized model. For equal input changes a finite tail resistance lets the total current vary, producing common-mode gain. Define Ad and Acm using the same output convention and CMRR=|Ad/Acm|, or 20log10|Ad/Acm| dB. Mismatch, finite tail resistance and load imbalance lower rejection."}},{"id":"cmos-u2-q3","subject":"cmos","unit":2,"number":3,"q":"Explain the cascode amplifier with a neat circuit diagram. Briefly name the telescopic and folded cascode amplifiers.","ans":{"s":"Stack a common-gate MOS over a common-source MOS. Rout≈gm2ro1ro2 for gmro≫1. Gain rises, headroom falls.","m":"In an NMOS cascode, M1 converts gate voltage to drain current and biased common-gate M2 passes it to the output. M2 limits motion at M1 drain, improving isolation and output resistance. Telescopic stacks devices directly. Folded cascodes redirect the signal into devices of opposite polarity.","d":"Feed VIN to M1 gate. Connect M1 drain to M2 source and bias M2 gate at a fixed DC voltage, making it AC ground. Take VOUT at M2 drain. M2 source has a small impedance ≈1/gm2, so M1's drain moves little, reducing channel-length modulation and Miller multiplication of M1 Cgd. Ignoring body effect, the branch Rout≈ro1+ro2+gm2ro1ro2. The overall gain is approximately −gm1(Rout∥Rload). Include gmb2 with gm2 in the resistance expression when its bulk is AC-fixed. For NMOS devices to remain saturated allow at least VOV1+VOV2 at its output stack, plus any load headroom at the other rail. Telescopic cascodes stack the input and cascode devices in the same branch. Folded cascodes transfer the input signal into a complementary common-gate branch, easing some common-mode constraints at the expense of extra branch current and noise.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 520 265\" role=\"img\" aria-label=\"NMOS common-source/common-gate cascode with current-source load\" style=\"display:block;width:100%;height:auto;max-width:520px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>NMOS common-source/common-gate cascode with current-source load\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"519\" height=\"264\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"230\" y=\"75\" width=\"66\" height=\"32\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"230\" y=\"142\" width=\"66\" height=\"32\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M263 29 V39 M263 62 V75 M263 107 V142 M263 174 V216 M232 216 H294 M239 222 H287 M249 228 H277 M263 68 H378 M230 91 H113 M230 158 H113\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"263\" cy=\"51\" r=\"12\" fill=\"#24465d\"/>\u003ccircle cx=\"263\" cy=\"68\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"263\" cy=\"123\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"263\" y=\"23\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"263\" y=\"55\" fill=\"#dbeafe\" font-size=\"13\" text-anchor=\"middle\">↑\u003c/text>\u003ctext x=\"263\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M2 (CG)\u003c/text>\u003ctext x=\"263\" y=\"163\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M1 (CS)\u003c/text>\u003ctext x=\"96\" y=\"95\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VBIAS\u003c/text>\u003ctext x=\"96\" y=\"162\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN\u003c/text>\u003ctext x=\"403\" y=\"73\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"385\" y=\"53\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">PMOS current-source load\u003c/text>\u003ctext x=\"288\" y=\"128\" fill=\"#93c5fd\" font-size=\"13\" text-anchor=\"middle\">X\u003c/text>\u003c/svg>"}},{"id":"cmos-u2-q4","subject":"cmos","unit":2,"number":4,"q":"Write a short note on CMOS current amplifiers.","ans":{"s":"Current amplifier takes iin and scales iout. Mirror gain ≈ sizing ratio; desirable Rin low, Rout high.","m":"A CMOS current amplifier processes current directly. In a basic mirror, a diode-connected input converts current to VGS and a second MOS reconverts that voltage to proportional output current. Cascoding increases output resistance.","d":"The input current enters a diode-connected MOS with incremental input resistance Rin≈1/(gm1+gds1). Its vgs modulates the output device, giving incremental current gain Ai≈gm2/(gm1+gds1)≈(W/L)2/(W/L)1 for matched bias conditions and gmro≫1. The output appears as a controlled current source with finite Rout≈ro2. A cascode mirror increases Rout and accuracy over changing output voltage, with additional headroom. PMOS and NMOS implementations source and sink respectively. Compliance, matching, bandwidth, noise and the distinction between small-signal gain and DC ratio matter. Applications include current steering, bias distribution, current-mode filters and mirror active loads."}},{"id":"cmos-u2-q5","subject":"cmos","unit":2,"number":5,"q":"Explain the output amplifiers (source follower and class AB output stage) used in CMOS circuits.","ans":{"s":"Source follower buffers with Av\u003c1 and low Rout. Class AB push–pull supplies large load current with small idle current.","m":"The source follower takes input at the gate and output at the source. Its local feedback gives voltage gain slightly below unity and low output resistance. A complementary class AB output stage biases two devices slightly on and sources or sinks strongly as the load demands.","d":"An NMOS common-drain stage keeps drain AC-grounded and takes output from source. With R=ro∥RL∥rBias, Av≈gm/(gm+gmb+1/R) and output resistance near 1/(gm+gmb) when the other conductances are small. DC VOUT is about VIN−VGS and the bias current determines quiescent drive and available swing. A class AB stage adds complementary pull-up and pull-down paths. A bias network keeps modest quiescent current through both devices, limiting crossover distortion. A positive excursion raises sourcing current and a negative excursion raises sinking current. Compared to a fixed-current stage it can charge or discharge larger capacitive loads for the same standby current. Bias tracking, swing, stability and load-drive variation must be checked."}},{"id":"cmos-u2-q6","subject":"cmos","unit":2,"number":6,"q":"Draw the block diagram and circuit of a two-stage CMOS Op-Amp. Explain the function of each stage.","ans":{"s":"NMOS differential pair + PMOS mirror → high-gain CS second stage → output. CC around stage 2 stabilizes.","m":"The first stage uses a differential pair and mirror active load to produce a single-ended signal VX. A second common-source transistor provides additional gain and output drive. Bias current sources set the branch currents. A Miller capacitor connects VOUT to VX.","d":"In the example, NMOS M1 and M2 share a biased tail sink M5. PMOS M3 is diode-connected and drives matched PMOS M4. Their mirror converts the opposite differential branch-current changes to a single-ended incremental current at VX. Its first-stage gain magnitude is approximately gm1(ro2∥ro4) for a matched simple mirror. NMOS M6 takes VX at its gate and drives output against PMOS bias load M7, with stage gain approximately −gm6(ro6∥ro7∥RL). CC connects output to VX to introduce a dominant pole and separate poles. The load capacitance sits at VOUT. At balance the tail splits equally. A higher VIN+ at the right input increases right-branch pull-down and decreases right mirror sourcing, pulling VX down and VOUT up. Headroom, compensation and output current set input common-mode range, stability and slew.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 305\" role=\"img\" aria-label=\"Two-stage CMOS op-amp with PMOS mirror load, NMOS second stage, and Miller capacitor\" style=\"display:block;width:100%;height:auto;max-width:680px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Two-stage CMOS op-amp with PMOS mirror load, NMOS second stage, and Miller capacitor\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"679\" height=\"304\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"141\" y=\"61\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"286\" y=\"61\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"141\" y=\"137\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"286\" y=\"137\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"194\" y=\"218\" width=\"90\" height=\"29\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"508\" y=\"137\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"489\" y=\"61\" width=\"92\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M168 43 H535 M168 43 V61 M313 43 V61 M535 43 V61 M168 87 V137 M313 87 V137 M535 87 V137 M168 163 V194 H313 V163 M239 194 V218 M239 247 V266 M535 163 V266 M221 266 H553 M229 273 H545 M239 280 H535\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M168 107 H115 V74 H141 M195 74 H286 M195 74 V107 H168\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M141 150 H100 M340 150 H373 M489 74 H451 M194 232 H153\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M313 113 H446 V150 H508 M535 113 H607\" fill=\"none\" stroke=\"#86efac\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M446 113 V195 H479 M487 184 V206 M479 184 V206 M487 195 H607 V113\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"168\" cy=\"107\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"313\" cy=\"113\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"446\" cy=\"113\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"535\" cy=\"113\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"239\" cy=\"194\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"352\" y=\"33\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"168\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M3\u003c/text>\u003ctext x=\"313\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M4\u003c/text>\u003ctext x=\"168\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M1\u003c/text>\u003ctext x=\"313\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M2\u003c/text>\u003ctext x=\"85\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN−\u003c/text>\u003ctext x=\"391\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN+\u003c/text>\u003ctext x=\"438\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Vbp\u003c/text>\u003ctext x=\"133\" y=\"237\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Vbn\u003c/text>\u003ctext x=\"239\" y=\"238\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M5 · tail\u003c/text>\u003ctext x=\"535\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M6\u003c/text>\u003ctext x=\"535\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M7 · load\u003c/text>\u003ctext x=\"358\" y=\"107\" fill=\"#86efac\" font-size=\"13\" text-anchor=\"middle\">VX\u003c/text>\u003ctext x=\"622\" y=\"117\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VO\u003c/text>\u003ctext x=\"483\" y=\"222\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">CC\u003c/text>\u003ctext x=\"416\" y=\"296\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VSS\u003c/text>\u003c/svg>"}},{"id":"cmos-u2-q7","subject":"cmos","unit":2,"number":7,"q":"What is the need of compensation in an Op-Amp? Explain Miller compensation.","ans":{"s":"Miller CC splits poles. Dominant pole moves lower. A series nulling resistor may remove the RHP zero.","m":"Two high-impedance amplifier stages introduce poles whose phase shifts can make feedback unstable. A capacitor from the second-stage output to its input is Miller-multiplied at the first-stage node. It creates a lower dominant pole and generally moves the nondominant pole up.","d":"The unity-loop-gain frequency must occur with enough phase margin. Without compensation, poles at the first-stage node and output can contribute almost 180° of lag near crossover. Put CC between VX and VOUT across the inverting stage. Its effective first-node capacitance is ≈CC(1+|A2|), which lowers the dominant pole. The interacting stage also produces pole splitting, often raising the nondominant pole. With dominant-pole assumptions, ωu≈gm1/CC and ωp2≈gm6/CL when CL dominates. The feed-forward capacitor path creates an RHP zero near ωz≈gm6/CC, adding phase lag. A series Rz≈1/gm6 moves that zero to infinity in the simple model. A larger Rz can move it into the left half-plane. Verify phase margin with actual CL, bias and process corners.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 173\" role=\"img\" aria-label=\"Miller compensation between first-stage node and op-amp output\" style=\"display:block;width:100%;height:auto;max-width:620px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Miller compensation between first-stage node and op-amp output\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"619\" height=\"172\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"39\" y=\"70\" width=\"146\" height=\"42\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"271\" y=\"70\" width=\"146\" height=\"42\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"509\" y=\"70\" width=\"72\" height=\"42\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M185 91 H271 M417 91 H509\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M226 91 V40 H337 M337 30 V50 M345 30 V50 M345 40 H462 V91\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"226\" cy=\"91\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"462\" cy=\"91\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"112\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Differential stage\u003c/text>\u003ctext x=\"344\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Inverting stage\u003c/text>\u003ctext x=\"545\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Load CL\u003c/text>\u003ctext x=\"341\" y=\"24\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">Miller CC\u003c/text>\u003ctext x=\"226\" y=\"127\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VX\u003c/text>\u003ctext x=\"462\" y=\"127\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"307\" y=\"152\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">CC bridges the high-impedance first-stage node and output\u003c/text>\u003c/svg>"}},{"id":"cmos-u2-q8","subject":"cmos","unit":2,"number":8,"q":"Write the expressions for the overall gain, unity-gain bandwidth and slew rate of a two- stage Op-Amp.","ans":{"s":"|A0|≈gm1R1·gm6R2. ωu≈gm1/CC, GBW≈gm1/(2πCC). SR≈Iavailable/C.","m":"First- and second-stage gains multiply. The Miller-compensated crossover is set mainly by input-stage transconductance and CC. Slew rate is the limiting charge or discharge current divided by the capacitance that it must move.","d":"Let R1≈ro2∥ro4 at VX and R2≈ro6∥ro7∥RL at VOUT. Then |A0|≈(gm1R1)(gm6R2). For dominant-pole compensation, ωu≈gm1/CC rad/s and GBW≈gm1/(2πCC) Hz. These assume the higher pole and zero are sufficiently separated from crossover. A large input drives the pair fully to one side, leaving roughly ITAIL available to charge or discharge CC in the ideal mirror-loaded first stage. The internal limit is SR≈ITAIL/CC. The output stage can impose a lower limit, about Iavailable/CL for a dominant load. Give positive and negative rates separately when available currents differ."}},{"id":"cmos-u2-q9","subject":"cmos","unit":2,"number":9,"q":"Explain PSRR of a two-stage Op-Amp. Explain how input offset voltage and CMRR of an Op-Amp are measured.","ans":{"s":"PSRR refers supply ripple to the input. Measure Vos by DC null/servo and CMRR by change of input-referred error with VCM.","m":"For PSRR, perturb one rail and find the resulting input-referred offset/ripple, or divide differential gain by supply-to-output gain. For input offset, servo the output to a reference and record the required differential input. Sweep VCM at fixed output to measure CMRR.","d":"PSRR measures rejection of a supply change. With the other rail held fixed, measure Av=ΔVOUT/ΔVID and supply gain As=ΔVOUT/ΔVSUPPLY under the same operating point. Input-referred rejection is PSRR=|Av/As|=|ΔVSUPPLY/ΔVOS,eq|, with 20log10 for dB. Measure positive and negative rails separately because the supply-to-output paths differ. For Vos, a high-loop-gain fixture or DC servo holds output near a target and measures the small input differential voltage that nulls the offset. To measure CMRR, change both inputs together over common-mode range while the servo holds output fixed, measuring slope ΔVOS,eq/ΔVCM. Then CMRR≈|ΔVCM/ΔVOS,eq|. An AC method measures |Ad/Acm| versus frequency."}},{"id":"cmos-u2-q10","subject":"cmos","unit":2,"number":10,"q":"Write the steps to design a two-stage CMOS Op-Amp for a given specification.","ans":{"s":"Set CC and tail current from stability/SR, gm1 from GBW, gm6 from load pole, then size and verify PVT.","m":"Start from gain, GBW, phase margin, slew, CL, input/output swing and power. Choose compensation and bias to meet dynamic targets, then size input, load and output devices for overdrive, DC gain and headroom. Verify AC, transient, noise and corners.","d":"Record VDD, CL, required gain, GBW, phase margin, SR, ICMR, swing and current budget. Select CC alongside a target nondominant pole. Set gm1≈2πGBW·CC, and choose ITAIL≥SR·CC for internal slewing. Check second-stage source/sink current against SR·CL and select gm6 to put its load pole above crossover. Pick overdrives from input common-mode and output-swing headroom. In long-channel sizing use W/L≈2ID/[μCoxVOV²] or choose gm/ID from device data, then use longer channels as needed to improve ro and gain. Bias and match the mirror. Use a series Rz when required for the Miller zero. Simulate operating point, loop gain with representative feedback/load, step response, PSRR, CMRR, noise, PVT, mismatch and extracted parasitics. Iterate to meet current and swing specifications.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 305\" role=\"img\" aria-label=\"Two-stage CMOS op-amp with PMOS mirror load, NMOS second stage, and Miller capacitor\" style=\"display:block;width:100%;height:auto;max-width:680px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Two-stage CMOS op-amp with PMOS mirror load, NMOS second stage, and Miller capacitor\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"679\" height=\"304\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"141\" y=\"61\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"286\" y=\"61\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"141\" y=\"137\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"286\" y=\"137\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"194\" y=\"218\" width=\"90\" height=\"29\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"508\" y=\"137\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"489\" y=\"61\" width=\"92\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M168 43 H535 M168 43 V61 M313 43 V61 M535 43 V61 M168 87 V137 M313 87 V137 M535 87 V137 M168 163 V194 H313 V163 M239 194 V218 M239 247 V266 M535 163 V266 M221 266 H553 M229 273 H545 M239 280 H535\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M168 107 H115 V74 H141 M195 74 H286 M195 74 V107 H168\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M141 150 H100 M340 150 H373 M489 74 H451 M194 232 H153\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M313 113 H446 V150 H508 M535 113 H607\" fill=\"none\" stroke=\"#86efac\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M446 113 V195 H479 M487 184 V206 M479 184 V206 M487 195 H607 V113\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"168\" cy=\"107\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"313\" cy=\"113\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"446\" cy=\"113\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"535\" cy=\"113\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"239\" cy=\"194\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"352\" y=\"33\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"168\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M3\u003c/text>\u003ctext x=\"313\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M4\u003c/text>\u003ctext x=\"168\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M1\u003c/text>\u003ctext x=\"313\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M2\u003c/text>\u003ctext x=\"85\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN−\u003c/text>\u003ctext x=\"391\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN+\u003c/text>\u003ctext x=\"438\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Vbp\u003c/text>\u003ctext x=\"133\" y=\"237\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Vbn\u003c/text>\u003ctext x=\"239\" y=\"238\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M5 · tail\u003c/text>\u003ctext x=\"535\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M6\u003c/text>\u003ctext x=\"535\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M7 · load\u003c/text>\u003ctext x=\"358\" y=\"107\" fill=\"#86efac\" font-size=\"13\" text-anchor=\"middle\">VX\u003c/text>\u003ctext x=\"622\" y=\"117\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VO\u003c/text>\u003ctext x=\"483\" y=\"222\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">CC\u003c/text>\u003ctext x=\"416\" y=\"296\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VSS\u003c/text>\u003c/svg>"}},{"id":"cmos-u2-q11","subject":"cmos","unit":2,"number":11,"q":"Explain how a CMOS inverter can be used as an amplifier. Describe its biasing and voltage gain. Define slew rate and power-supply rejection ratio (PSRR) of a two-stage op-amp.","ans":{"s":"Bias inverter at steep VTC. Av≈−(gmn+gmp)(ron∥rop∥RL). SR=max |dVOUT/dt|. PSRR=|Ad/Asupply|.","m":"Bias the common gate near transition with both transistors on and in saturation. Their incremental currents add at the output resistance, giving an inverting voltage gain. In an op-amp, slew rate is the maximum large-signal output slope and PSRR is the rejection of rail ripple.","d":"At a DC operating point near the inverter switching threshold both MOSFETs can operate in saturation. Use independent DC bias, or a large output-to-input resistor with an AC-coupled signal, and keep the signal small enough for linearity. With the supplies at AC ground, −(gmn+gmp)vin times the parallel small-signal output resistance gives vout. Thus Av≈−(gmn+gmp)(ron∥rop∥RL). Slew rate is the maximum magnitude of output slope during a large-signal transition. Its positive and negative values arise from finite charging currents, often SR≈ITAIL/CC internally, subject to output drive into CL. PSRR=|Ad/Arail|, with Arail=ΔVOUT/ΔVrail. Express in dB with 20log10 and specify the rail and frequency.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 192\" role=\"img\" aria-label=\"CMOS inverter biased as an analog common-source amplifier\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>CMOS inverter biased as an analog common-source amplifier\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"499\" height=\"191\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"228\" y=\"39\" width=\"64\" height=\"30\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"228\" y=\"118\" width=\"64\" height=\"30\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M260 20 V39 M260 69 V118 M260 148 V173 M128 57 H228 M128 57 V133 H228 M260 94 H371\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M244 173 H276 M250 179 H270 M256 185 H264\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"128\" cy=\"93\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"260\" cy=\"94\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"260\" y=\"16\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"260\" y=\"59\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">PMOS\u003c/text>\u003ctext x=\"260\" y=\"138\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">NMOS\u003c/text>\u003ctext x=\"80\" y=\"98\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VBIAS + vin\u003c/text>\u003ctext x=\"397\" y=\"100\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">vout\u003c/text>\u003ctext x=\"373\" y=\"144\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">Both devices are on\u003c/text>\u003c/svg>"}},{"id":"cmos-u2-q12","subject":"cmos","unit":2,"number":12,"q":"Which factors limit the slew rate?","ans":{"s":"SR≈I/C. Tail current/CC and output available current/CL can each set the limit. Positive and negative rates can differ.","m":"A large input step steers available bias current. The compensation and load capacitances can charge only as fast as the current supplied, since dV/dt=I/C. Check both internal and output slew limits.","d":"A large input overdrives the differential pair, saturating its incremental response by steering nearly all tail current to one side. The finite current available to charge/discharge CC limits internal slew to roughly Iavailable/CC. Separately, a finite sourcing or sinking current at the output limits slew into CL plus parasitics to Iout,available/(CL+Cpar). The smaller limit can dominate. Positive and negative current paths may be unequal. Output current limiting, supply headroom, bias condition, parasitic capacitance and load can further reduce measured rate. A larger drive current raises slew at a power cost. A smaller CC improves internal slew while changing unity-gain frequency and stability."}},{"id":"cmos-u2-q13","subject":"cmos","unit":2,"number":13,"q":"Draw and explain a two-stage CMOS operational amplifier with a neat circuit diagram, stating the function of each stage.","ans":{"s":"NMOS differential pair + PMOS mirror → high-gain CS second stage → output. CC around stage 2 stabilizes.","m":"The first stage uses a differential pair and mirror active load to produce a single-ended signal VX. A second common-source transistor provides additional gain and output drive. Bias current sources set the branch currents. A Miller capacitor connects VOUT to VX.","d":"In the example, NMOS M1 and M2 share a biased tail sink M5. PMOS M3 is diode-connected and drives matched PMOS M4. Their mirror converts the opposite differential branch-current changes to a single-ended incremental current at VX. Its first-stage gain magnitude is approximately gm1(ro2∥ro4) for a matched simple mirror. NMOS M6 takes VX at its gate and drives output against PMOS bias load M7, with stage gain approximately −gm6(ro6∥ro7∥RL). CC connects output to VX to introduce a dominant pole and separate poles. The load capacitance sits at VOUT. At balance the tail splits equally. A higher VIN+ at the right input increases right-branch pull-down and decreases right mirror sourcing, pulling VX down and VOUT up. Headroom, compensation and output current set input common-mode range, stability and slew.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 305\" role=\"img\" aria-label=\"Two-stage CMOS op-amp with PMOS mirror load, NMOS second stage, and Miller capacitor\" style=\"display:block;width:100%;height:auto;max-width:680px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Two-stage CMOS op-amp with PMOS mirror load, NMOS second stage, and Miller capacitor\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"679\" height=\"304\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"141\" y=\"61\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"286\" y=\"61\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"141\" y=\"137\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"286\" y=\"137\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"194\" y=\"218\" width=\"90\" height=\"29\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"508\" y=\"137\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"489\" y=\"61\" width=\"92\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M168 43 H535 M168 43 V61 M313 43 V61 M535 43 V61 M168 87 V137 M313 87 V137 M535 87 V137 M168 163 V194 H313 V163 M239 194 V218 M239 247 V266 M535 163 V266 M221 266 H553 M229 273 H545 M239 280 H535\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M168 107 H115 V74 H141 M195 74 H286 M195 74 V107 H168\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M141 150 H100 M340 150 H373 M489 74 H451 M194 232 H153\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M313 113 H446 V150 H508 M535 113 H607\" fill=\"none\" stroke=\"#86efac\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M446 113 V195 H479 M487 184 V206 M479 184 V206 M487 195 H607 V113\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"168\" cy=\"107\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"313\" cy=\"113\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"446\" cy=\"113\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"535\" cy=\"113\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"239\" cy=\"194\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"352\" y=\"33\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"168\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M3\u003c/text>\u003ctext x=\"313\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M4\u003c/text>\u003ctext x=\"168\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M1\u003c/text>\u003ctext x=\"313\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M2\u003c/text>\u003ctext x=\"85\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN−\u003c/text>\u003ctext x=\"391\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN+\u003c/text>\u003ctext x=\"438\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Vbp\u003c/text>\u003ctext x=\"133\" y=\"237\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Vbn\u003c/text>\u003ctext x=\"239\" y=\"238\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M5 · tail\u003c/text>\u003ctext x=\"535\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M6\u003c/text>\u003ctext x=\"535\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M7 · load\u003c/text>\u003ctext x=\"358\" y=\"107\" fill=\"#86efac\" font-size=\"13\" text-anchor=\"middle\">VX\u003c/text>\u003ctext x=\"622\" y=\"117\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VO\u003c/text>\u003ctext x=\"483\" y=\"222\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">CC\u003c/text>\u003ctext x=\"416\" y=\"296\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VSS\u003c/text>\u003c/svg>"}},{"id":"cmos-u2-q14","subject":"cmos","unit":2,"number":14,"q":"Explain the need for Miller compensation in a two-stage op-amp. How does it improve the phase margin?","ans":{"s":"Miller CC splits poles. Dominant pole moves lower. A series nulling resistor may remove the RHP zero.","m":"Two high-impedance amplifier stages introduce poles whose phase shifts can make feedback unstable. A capacitor from the second-stage output to its input is Miller-multiplied at the first-stage node. It creates a lower dominant pole and generally moves the nondominant pole up.","d":"The unity-loop-gain frequency must occur with enough phase margin. Without compensation, poles at the first-stage node and output can contribute almost 180° of lag near crossover. Put CC between VX and VOUT across the inverting stage. Its effective first-node capacitance is ≈CC(1+|A2|), which lowers the dominant pole. The interacting stage also produces pole splitting, often raising the nondominant pole. With dominant-pole assumptions, ωu≈gm1/CC and ωp2≈gm6/CL when CL dominates. The feed-forward capacitor path creates an RHP zero near ωz≈gm6/CC, adding phase lag. A series Rz≈1/gm6 moves that zero to infinity in the simple model. A larger Rz can move it into the left half-plane. Verify phase margin with actual CL, bias and process corners.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 173\" role=\"img\" aria-label=\"Miller compensation between first-stage node and op-amp output\" style=\"display:block;width:100%;height:auto;max-width:620px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Miller compensation between first-stage node and op-amp output\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"619\" height=\"172\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"39\" y=\"70\" width=\"146\" height=\"42\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"271\" y=\"70\" width=\"146\" height=\"42\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"509\" y=\"70\" width=\"72\" height=\"42\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M185 91 H271 M417 91 H509\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u0
