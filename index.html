ck-arrow)\" marker-start=\"url(#mca-u1-q5-mca-51block-arrow)\"/>\u003cpath d=\"M 249 142 V 152\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u1-q5-mca-51block-arrow)\"/>\u003cpath d=\"M 330 141 H 573 V 152\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u1-q5-mca-51block-arrow)\"/>\u003cpath d=\"M 411 142 V 152\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u1-q5-mca-51block-arrow)\"/>\u003crect x=\"18\" y=\"61\" width=\"142\" height=\"54\" rx=\"6\" fill=\"#111820\" stroke=\"#f3c792\"/>\u003ctext x=\"89\" y=\"79\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">Oscillator / reset\u003c/text>\u003ctext x=\"89\" y=\"97\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">Timing\u003c/text>\u003crect x=\"225\" y=\"49\" width=\"210\" height=\"78\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"330\" y=\"70\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">8051 CPU\u003c/text>\u003ctext x=\"330\" y=\"88\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">PC, SP, DPTR, A/B, PSW\u003c/text>\u003ctext x=\"330\" y=\"106\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">8-bit ALU\u003c/text>\u003crect x=\"494\" y=\"61\" width=\"148\" height=\"54\" rx=\"6\" fill=\"#111820\" stroke=\"#f3c792\"/>\u003ctext x=\"568\" y=\"79\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">Interrupt\u003c/text>\u003ctext x=\"568\" y=\"97\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">controller\u003c/text>\u003crect x=\"16\" y=\"156\" width=\"142\" height=\"38\" rx=\"6\" fill=\"#111820\" stroke=\"#a7a6ff\"/>\u003ctext x=\"87\" y=\"175\" fill=\"#a7a6ff\" text-anchor=\"middle\" dominant-baseline=\"central\">4 KiB code ROM\u003c/text>\u003crect x=\"178\" y=\"156\" width=\"142\" height=\"38\" rx=\"6\" fill=\"#111820\" stroke=\"#a7a6ff\"/>\u003ctext x=\"249\" y=\"175\" fill=\"#a7a6ff\" text-anchor=\"middle\" dominant-baseline=\"central\">128 B data RAM\u003c/text>\u003crect x=\"340\" y=\"156\" width=\"142\" height=\"38\" rx=\"6\" fill=\"#111820\" stroke=\"#f3c792\"/>\u003ctext x=\"411\" y=\"175\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">T0, T1 and UART\u003c/text>\u003crect x=\"502\" y=\"156\" width=\"142\" height=\"38\" rx=\"6\" fill=\"#111820\" stroke=\"#f3c792\"/>\u003ctext x=\"573\" y=\"175\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">Ports P0–P3\u003c/text>\u003ctext x=\"225\" y=\"34\" fill=\"#c3cbd4\">Classic 8051 functional blocks\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"mca-u1-q6","subject":"mca","unit":1,"number":6,"q":"Illustrate the programming model of the 8051 microcontroller and explain its overall memory architecture.","ans":{"s":"A/B/PSW, R0–R7 banks, 16-bit PC/DPTR, 8-bit SP. Separate 64 KiB code and external data spaces; 128 B classic internal RAM.","m":"The programmer sees A, B, PSW, four banks of R0–R7, DPTR, PC and SP. Direct internal addresses 00h–7Fh select RAM; direct 80h–FFh selects SFRs. Code fetch/MOVC accesses program space and MOVX accesses XDATA.","d":"Classic 8051 programming model: A is the usual ALU operand, B is used by MUL/DIV, PSW holds flags and bank selection, PC addresses code, and SP locates the rising internal-RAM stack. DPTR holds a 16-bit address. Diagram the memory as distinct spaces: CODE 0000h–FFFFh, with up to 4 KiB on-chip mask ROM on the original 8051, XDATA 0000h–FFFFh accessed with MOVX; internal RAM 00h–7Fh plus direct-addressed SFR space 80h–FFh. Within RAM, 00h–1Fh holds banks, 20h–2Fh is bit-addressable and 30h–7Fh is general storage. The upper indirect RAM present on some derivatives must be distinguished from direct SFR addresses.","fig":"\u003csvg viewBox=\"0 0 660 241\" width=\"660\" height=\"241\" role=\"img\" aria-labelledby=\"mca-u1-q6-mca-51model-title\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\">\u003ctitle id=\"mca-u1-q6-mca-51model-title\">8051 register model and memory address spaces\u003c/title>\u003cdefs>\u003cmarker id=\"mca-u1-q6-mca-51model-arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#9aabbc\"/>\u003c/marker>\u003c/defs>\u003crect x=\"0\" y=\"0\" width=\"660\" height=\"241\" rx=\"9\" fill=\"#070b11\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"14\">\u003cpath d=\"M 227 131 H 251 V 172\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u1-q6-mca-51model-arrow)\"/>\u003crect x=\"18\" y=\"46\" width=\"208\" height=\"50\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"122\" y=\"62\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">CPU registers\u003c/text>\u003ctext x=\"122\" y=\"80\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">A, B, PSW, PC, SP, DPTR\u003c/text>\u003crect x=\"18\" y=\"110\" width=\"208\" height=\"44\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"122\" y=\"123\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">R0–R7\u003c/text>\u003ctext x=\"122\" y=\"141\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">Selected by PSW.RS1:RS0\u003c/text>\u003crect x=\"255\" y=\"46\" width=\"173\" height=\"36\" rx=\"6\" fill=\"#111820\" stroke=\"#f3c792\"/>\u003ctext x=\"341.5\" y=\"64\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">80h–FFh  SFRs\u003c/text>\u003crect x=\"255\" y=\"82\" width=\"173\" height=\"36\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"341.5\" y=\"100\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">30h–7Fh  Scratch\u003c/text>\u003crect x=\"255\" y=\"118\" width=\"173\" height=\"36\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"341.5\" y=\"136\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">20h–2Fh  Bit area\u003c/text>\u003crect x=\"255\" y=\"154\" width=\"173\" height=\"36\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"341.5\" y=\"172\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">00h–1Fh  Banks\u003c/text>\u003crect x=\"455\" y=\"46\" width=\"187\" height=\"55\" rx=\"6\" fill=\"#111820\" stroke=\"#a7a6ff\"/>\u003ctext x=\"548.5\" y=\"64.5\" fill=\"#a7a6ff\" text-anchor=\"middle\" dominant-baseline=\"central\">CODE 0000h–FFFFh\u003c/text>\u003ctext x=\"548.5\" y=\"82.5\" fill=\"#a7a6ff\" text-anchor=\"middle\" dominant-baseline=\"central\">Fetch / MOVC\u003c/text>\u003crect x=\"455\" y=\"119\" width=\"187\" height=\"55\" rx=\"6\" fill=\"#111820\" stroke=\"#f3c792\"/>\u003ctext x=\"548.5\" y=\"137.5\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">XDATA 0000h–FFFFh\u003c/text>\u003ctext x=\"548.5\" y=\"155.5\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">MOVX\u003c/text>\u003ctext x=\"18\" y=\"30\" fill=\"#c3cbd4\">Programming model\u003c/text>\u003ctext x=\"255\" y=\"30\" fill=\"#c3cbd4\">Internal direct addresses\u003c/text>\u003ctext x=\"455\" y=\"30\" fill=\"#c3cbd4\">Separate address spaces\u003c/text>\u003ctext x=\"255\" y=\"213\" fill=\"#c3cbd4\">Upper indirect RAM exists on some derivatives.\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"mca-u1-q7","subject":"mca","unit":1,"number":7,"q":"Explain internal RAM and internal ROM of 8051","ans":{"s":"Classic 8051 uses 128 B internal data RAM and 4 KiB internal code ROM. EA selects internal-first versus external code fetch.","m":"Internal RAM 00h–7Fh comprises register banks, bit-addressable RAM and scratchpad. Original 8051 ROM occupies 0000h–0FFFh when EA is high. External code can extend through FFFFh. Later variants use different capacities or Flash.","d":"RAM holds temporary data and the stack. Addresses 00h–1Fh provide four banks of eight working registers, 20h–2Fh provides 16 byte-addressable and 128 bit-addressable locations, and 30h–7Fh provides 80 general-purpose bytes. SFR space at direct 80h–FFh controls hardware and is distinct from classic RAM. The 8051 has 4 KiB on-chip program ROM. EA high selects on-chip ROM for 0000h–0FFFh and external program memory above it. EA low fetches all code externally via PSEN. Program data access uses MOVC, while data RAM reads/writes use MOV or MOVX according to the address space."}},{"id":"mca-u1-q8","subject":"mca","unit":1,"number":8,"q":"Explain the five Special Function Registers in the 8051 microcontroller .Explain PSW in detail.","ans":{"s":"ACC, B, SP, DPTR and PSW are representative working SFRs. PSW: CY AC F0 RS1 RS0 OV — P.","m":"ACC (E0h) is the main arithmetic register, B (F0h) supports multiplication/division, SP (81h) locates the stack, DPL/DPH (82h/83h) form DPTR, and PSW (D0h) holds status and bank bits. CY is carry, AC is auxiliary carry, OV is signed overflow and P is accumulator parity.","d":"List five functional SFR groups. ACC E0h holds ALU operands and results. B F0h holds the second operand and part of the result for MUL AB and DIV AB. SP 81h points to the current stack top and resets to 07h. DPL 82h and DPH 83h are the low/high bytes of the DPTR address pointer. PSW D0h is the bit-addressable status word. Bits 7:0 are CY (unsigned carry/borrow), AC (carry from bit 3 to 4 for BCD), F0 (software flag), RS1, RS0 (register bank 0–3), OV (signed overflow), bit 1 (unassigned or derivative-specific), and P (1 when A has odd parity)."}},{"id":"mca-u1-q9","subject":"mca","unit":1,"number":9,"q":"Discuss the interrupt handling mechanism and the different interrupt sources supported by the 8051 microcontroller.","ans":{"s":"INT0, Timer0, INT1, Timer1, serial. IE enables, IP prioritizes, ISR ends with RETI.","m":"Classic vectors are 0003h, 000Bh, 0013h, 001Bh and 0023h respectively. IE.EA gates interrupts, while IP selects one of two priority levels. On entry the CPU stacks the return PC, and software saves registers it uses. Clear applicable flags and return with RETI.","d":"Sources and vectors: external INT0 0003h; Timer0 overflow 000Bh; external INT1 0013h; Timer1 overflow 001Bh; serial RI or TI 0023h. Configure IT0/IT1 in TCON for edge or level triggering, enable the desired source in IE and set EA, then use IP for priority. After the current instruction finishes, the core accepts the highest eligible request, pushes the return PC, and jumps to its vector. A high-priority service can preempt a low-priority service. Save/restore affected registers; clear RI or TI explicitly in serial service. In classic 8051, timer overflow flags and edge-triggered external interrupt flags clear on vectoring, whereas a level-triggered external input must be deasserted. RETI restores execution and informs the interrupt controller the ISR finished."}},{"id":"mca-u1-q10","subject":"mca","unit":1,"number":10,"q":"Write a Embedded C program for the 8051 microcontroller to continuously transmit the string \"WELCOME\" .Show calculation for timer assuming standard baud rate of 9600.","ans":{"s":"8N1 at 9600 baud with 11.0592 MHz clock. Timer 1 mode 2, TH1 = TL1 = FDh, SMOD = 0. Poll TI after every byte.","m":"Configure serial mode 1 and Timer 1 mode 2. Timer input is 11.0592 MHz ÷ 12 = 921600 Hz. Baud = 921600 / [32(256 − TH1)], hence TH1 = FDh. Start Timer 1, write each character to SBUF and wait for TI.","d":"On a classic 12-clock 8051 with Fosc = 11.0592 MHz, set SMOD = 0 and select serial mode 1 (asynchronous 8N1). Timer 1 mode 2 reloads TL1 from TH1 on overflow. For a timer input of 921600 Hz and an overflow divider of 32 in the UART, 256 − TH1 = 921600/(32 × 9600) = 3. TH1 = FDh and TL1 starts at FDh. P3.1 carries TXD. Connect it to a compatible RX input and share ground. The outer loop repeats the message; the inner loop sends it one character at a time and waits for completion.","code":{"s":"set UART 8N1; set Timer 1 reload to FDh\nforever:\n  for each character in WELCOME:\n    start transmit; wait for TI; clear TI","m":"TMOD = (TMOD & 0x0F) | 0x20;\nPCON &= 0x7F;\nTH1 = TL1 = 0xFD;\nSCON = 0x50;\nTR1 = 1;\nfor (;;) {\n    for (i = 0; message[i]; ++i) {\n        SBUF = message[i];\n        while (!TI) { }\n        TI = 0;\n    }\n}","d":"#include \u003cREG51.H>\n\nvoid main(void)\n{\n    unsigned char i;\n    static const char code message[] = \"WELCOME\";\n\n    TR1 = 0;\n    TMOD = (TMOD & 0x0F) | 0x20;  /* Preserve Timer 0 settings */\n    PCON &= 0x7F;                /* SMOD = 0 */\n    TH1 = TL1 = 0xFD;\n    SCON = 0x50;                /* UART mode 1; receiver enabled */\n    TR1 = 1;\n    for (;;) {\n        for (i = 0; message[i]; ++i) {\n            SBUF = message[i];\n            while (!TI) { }\n            TI = 0;\n        }\n    }\n}","lang":"c"}}}]},{"title":"Programming with 8-bit Microcontroller (8051)","questions":[{"id":"mca-u2-q1","subject":"mca","unit":2,"number":1,"q":"Discuss the input/output port architecture of the 8051 microcontroller and highlight the secondary functions of Port 3.","ans":{"s":"P0 is open-drain as GPIO. P1, P2 and P3 are quasi-bidirectional with pull-ups. P3 alternate functions cover serial, interrupts, counter and external-memory controls.","m":"Each port has a latch and pin driver. Write a one to release an input; writing a zero actively pulls low. P0 requires external pull-ups in GPIO use. P3.0–P3.7 are RXD, TXD, INT0, INT1, T0, T1, WR and RD.","d":"Typical classic 8051 has four 8-bit ports. P0 is open-drain in GPIO mode and becomes multiplexed AD0–AD7 during external bus cycles. P1 is plain GPIO on the base 8051. P2 is GPIO or the high address A8–A15 on 16-bit external access. P3 pins double as RXD (P3.0), TXD (P3.1), INT0 (P3.2), INT1 (P3.3), T0 (P3.4), T1 (P3.5), WR (P3.6), and RD (P3.7). INT0, INT1, WR and RD are active low. P1–P3 have internal pull-ups; write one to the latch before sampling a pin as an input or allowing its alternate function. Read-modify-write port instructions normally read the latch, while ordinary pin reads can see the actual input."}},{"id":"mca-u2-q2","subject":"mca","unit":2,"number":2,"q":"Explain how Port 0 and Port 2 facilitate external memory interfacing in the 8051, emphasizing the purpose of an address latch.","ans":{"s":"P0 sends A0–A7 then D0–D7. ALE stores the low byte in a latch. P2 provides A8–A15 on 16-bit external accesses.","m":"Connect P0 to memory data and the D inputs of a 74HC573-type latch. ALE allows the low address to pass, then its falling edge holds A0–A7 while P0 becomes data. P2 supplies the upper address, and PSEN or RD/WR selects the transfer type.","d":"At the start of an external 16-bit address cycle, P0 drives the low address and P2 drives the high address. While ALE is high a transparent latch follows P0. When ALE falls, the latch holds A0–A7 at its Q outputs, letting P0 change direction or drive data for the rest of the bus cycle. Use active-low PSEN for external program reads and active-low RD/WR for MOVX data access. The P2 upper-address statement applies to external instruction fetch and MOVX @DPTR; MOVX @Ri leaves P2 at its programmed latch value, which can select a page externally."}},{"id":"mca-u2-q3","subject":"mca","unit":2,"number":3,"q":"Describe the operation of Timer 0 and Timer 1 in the 8051. Determine the initial count value needed to produce a 1 ms delay using Timer 0 in Mode 1 .","ans":{"s":"Mode 1 counts up to FFFFh. For 1 ms at 12 MHz, use 1000 ticks and preload FC18h.","m":"Timer 0 and Timer 1 increment once per machine cycle in classic timer mode; in counter mode they use external edges. At 12 MHz, one tick is 1 µs, so preload 65536 − 1000 = FC18h for a 1 ms Mode 1 delay.","d":"TMOD selects GATE, C/T and mode for each timer. Modes 0, 1 and 2 are 13-bit, 16-bit and 8-bit auto-reload. Timer 0 mode 3 splits TL0 and TH0. TCON provides TRx run control and TFx overflow flags. For a classic 12-clock 8051, f_tick = Fosc/12 and the Mode 1 preload is 65536 − round(t × Fosc/12). With Fosc = 12 MHz, TH0 = FCh and TL0 = 18h. With 11.0592 MHz instead, round 921.6 to 922 and use FC66h. Select timer mode and clear GATE, load both bytes, clear TF0, set TR0, then wait for TF0. Stop and clear the flag before reloading."}},{"id":"mca-u2-q4","subject":"mca","unit":2,"number":4,"q":"Write an Embedded C routine to create a 0.5 ms software delay.Show how to interface an electromagnetic relay with the 8051 microcontroller and write an Embedded C program to toggle a light ON and OFF at 0.5 second intervals","ans":{"s":"Calibrate a software loop for 0.5 ms. Drive the relay through a transistor with a flyback diode. Toggle every 500 ms.","m":"At 12 MHz the classic 8051 machine cycle is 1 µs. Calibrate the compiler’s delay loop to about 500 cycles. Drive a relay coil using a transistor, with a reverse-biased diode across the coil. For stable 500 ms toggles use ten 50 ms timer delays.","d":"Software-loop timing depends on the Keil C51 build and optimization level. The routine below gives a starting point: two NOPs and a typical DJNZ occupy roughly four machine cycles per iteration, so 125 iterations are near 0.5 ms at 12 MHz. Include function overhead and adjust the iteration count against the assembly listing or oscilloscope. Use Timer 0 for the actual relay interval. Drive the low-side coil switch from P1.0 using a current-limiting base resistor or a compatible logic MOSFET. The diode cathode goes to the coil supply, anode to the transistor side. Switch the load using rated isolated contacts. Toggle every ten 50 ms intervals, giving roughly 0.5 s on and 0.5 s off.","code":{"lang":"c","s":"calibrate CPU loop to approximately 0.5 ms\nforever: wait 500 ms; toggle relay output","m":"static void delay_about_500us(void)\n{\n    unsigned char i;\n    for (i = 125; i; --i) { _nop_(); _nop_(); }\n}\nfor (;;) {\n    for (i = 0; i \u003c 10; ++i) delay_us(50000);\n    relay = !relay;\n}","d":"#include \u003cREG51.H>\n#include \u003cintrins.h>\nsbit relay = P1^0;\n\nstatic void delay_about_500us(void)\n{\n    unsigned char i;\n    for (i = 125; i; --i) { _nop_(); _nop_(); }\n}\n\n/* Classic 12-clock 8051 at 12 MHz. 1 timer increment = 1 us. */\nstatic void delay_us(unsigned int us)\n{\n    unsigned int reload = 0u - us;\n    TR0 = 0;\n    TH0 = (unsigned char)(reload >> 8);\n    TL0 = (unsigned char)reload;\n    TF0 = 0;\n    TR0 = 1;\n    while (!TF0) { }\n    TR0 = 0;\n    TF0 = 0;\n}\n\nvoid main(void)\n{\n    unsigned char i;\n    TMOD = (TMOD & 0xF0) | 0x01;  /* Timer 0, 16-bit mode */\n    relay = 0;\n    for (;;) {\n        for (i = 0; i \u003c 10; ++i) delay_us(50000);\n        relay = !relay;\n    }\n}"}}},{"id":"mca-u2-q5","subject":"mca","unit":2,"number":5,"q":"Explain the hardware connection for interfacing a common-cathode 7-segment display with the 8051 and write an Embedded C program to render a digit on it.","ans":{"s":"Connect a–g through resistors to P2.0–P2.6, common cathode to GND. Segment bits are active high; 0x3F shows 0.","m":"Use P2.0 through P2.6 for a through g. Put a resistor per segment and ground the common cathode. Bit 0 is a and bit 6 is g, so 0x6D lights a, c, d, f and g to show 5. Add a driver when the port cannot source the required current.","d":"Connect the common cathode to ground. Drive each segment anode through its own resistor from the corresponding a–g channel, using a noninverting source driver if the 8051’s output-high current rating is insufficient. With a at the least-significant bit and g at bit 6, a one lights the segment. For example, 5 uses a,c,d,f,g, encoded 0x6D. A decimal point on P2.7 is left off. The lookup table has patterns for digits 0 through 9.","code":{"lang":"c","s":"look up active-high segment mask for desired digit\nwrite mask to P2","m":"static const unsigned char code digits[10] =\n    {0x3F,0x06,0x5B,0x4F,0x66,0x6D,0x7D,0x07,0x7F,0x6F};\nP2 = digits[5];","d":"#include \u003cREG51.H>\nstatic const unsigned char code digits[10] =\n    {0x3F,0x06,0x5B,0x4F,0x66,0x6D,0x7D,0x07,0x7F,0x6F};\n\nvoid main(void)\n{\n    P2 = digits[5];\n    while (1) { }\n}"}}},{"id":"mca-u2-q6","subject":"mca","unit":2,"number":6,"q":"Illustrate the interfacing of a buzzer with the 8051 microcontroller and write an Embedded C code snippet to sound the buzzer periodically every 1 ms","ans":{"s":"Use a buzzer driver on GPIO. For a passive piezo, a toggle every 1 ms makes a 500 Hz tone.","m":"Drive a compatible transistor from P2.0 and share ground. Use a Timer 0 delay of 1000 ticks at 12 MHz. Toggling the output every 1 ms makes 500 Hz. An active buzzer has its own oscillator; use the pin as its enable instead.","d":"This example treats the 1 ms requirement as time between output transitions. A passive piezo on a suitable driver receives a 2 ms full period (500 Hz). An active buzzer interprets the same signal as alternating 1 ms enable and disable in place of a tone drive. For an inductive electromagnetic buzzer use a suitable clamp and driver; a plain piezo does not need a coil flyback diode. Set Timer 0 to Mode 1; 1000 ticks at a 1 µs tick give 1 ms.","code":{"lang":"c","s":"configure buzzer output; toggle it every 1 ms","m":"for (;;) {\n    delay_us(1000);\n    buzzer = !buzzer;\n}","d":"#include \u003cREG51.H>\nsbit buzzer = P2^0;\n/* Classic 12-clock 8051 at 12 MHz. 1 timer increment = 1 us. */\nstatic void delay_us(unsigned int us)\n{\n    unsigned int reload = 0u - us;\n    TR0 = 0;\n    TH0 = (unsigned char)(reload >> 8);\n    TL0 = (unsigned char)reload;\n    TF0 = 0;\n    TR0 = 1;\n    while (!TF0) { }\n    TR0 = 0;\n    TF0 = 0;\n}\n\nvoid main(void)\n{\n    TMOD = (TMOD & 0xF0) | 0x01;  /* Timer 0, 16-bit mode */\n    buzzer = 0;\n    for (;;) {\n        delay_us(1000);\n        buzzer = !buzzer;\n    }\n}"}}},{"id":"mca-u2-q7","subject":"mca","unit":2,"number":7,"q":"Draw a circuit diagram connecting a push-button switch to pin P1.0 and a buzzer to pin P2.0 of the 8051, and write an Embedded C program to control the buzzer state based on the switch input.","ans":{"s":"P1.0 input with switch to ground. P2.0 drives the buzzer transistor. Pressed = 0, buzzer output = 1.","m":"Write one to the P1.0 latch to enable input. Its pull-up holds it high until the button grounds it. Feed P2.0 to a compatible active-high buzzer driver. Set the driver high while the sampled input is low.","d":"Connect the momentary button between P1.0 and ground. The quasi-bidirectional input pulls high when its latch is written to one; an external pull-up may be used as needed. P2.0 drives a suitable transistor or buffer for the buzzer, with a common logic reference. An active buzzer is assumed, so a static asserted enable sounds it. If the output chatters during mechanical bounce, sample and confirm a stable transition after a short delay.","code":{"lang":"c","s":"release P1.0 as input\nrepeat: buzzer enable = button is low","m":"button = 1;\nfor (;;) buzzer = !button;","d":"#include \u003cREG51.H>\nsbit button = P1^0;\nsbit buzzer = P2^0;\n\nvoid main(void)\n{\n    button = 1;\n    buzzer = 0;\n    for (;;) buzzer = !button;\n}"}}},{"id":"mca-u2-q8","subject":"mca","unit":2,"number":8,"q":"Explain how LEDs are connected to an 8051 I/O port and write an Embedded C program to blink LEDs on Port 1 at 1 ms intervals.","ans":{"s":"Write 0x00 then 0xFF to active-low LEDs. Change every 1 ms.","m":"Use active-low wiring with LED anodes toward VCC through individual resistors and cathodes at P1. Alternate all-zero and all-one masks with a 1 ms Timer 0 delay after each.","d":"Each LED connects from VCC through its own current-limiting resistor to one P1 pin. The 8051 sinks current when a pin is low. Choose currents within the per-pin and total sink ratings, or use a buffer. Set P1 to 0x00 to light the LEDs and 0xFF to turn them off. 12 MHz divided by 12 gives a 1 µs tick, so 1000 counts give 1 ms. This is a 500 Hz full cycle, usually too fast for the eye to see individual blinks.","code":{"lang":"c","s":"turn LEDs on, wait 1 ms\nturn LEDs off, wait 1 ms\nrepeat","m":"TMOD = (TMOD & 0xF0) | 0x01;  /* Timer 0, 16-bit mode */\n    for (;;) {\n        P1 = 0x00;\n        delay_us(1000);\n        P1 = 0xFF;\n        delay_us(1000);\n    }","d":"#include \u003cREG51.H>\n/* Classic 12-clock 8051 at 12 MHz. 1 timer increment = 1 us. */\nstatic void delay_us(unsigned int us)\n{\n    unsigned int reload = 0u - us;\n    TR0 = 0;\n    TH0 = (unsigned char)(reload >> 8);\n    TL0 = (unsigned char)reload;\n    TF0 = 0;\n    TR0 = 1;\n    while (!TF0) { }\n    TR0 = 0;\n    TF0 = 0;\n}\n\nvoid main(void)\n{\n    TMOD = (TMOD & 0xF0) | 0x01;  /* Timer 0, 16-bit mode */\n    for (;;) {\n        P1 = 0x00;\n        delay_us(1000);\n        P1 = 0xFF;\n        delay_us(1000);\n    }\n}"}}},{"id":"mca-u2-q9","subject":"mca","unit":2,"number":9,"q":"Show how to interface 8 LEDs to Port 1 of the 8051 and write an Embedded C program to toggle alternate LEDs every 1 second .","ans":{"s":"Alternate LED masks 0x55 and 0xAA every 1 s.","m":"Use active-low wiring with LED anodes toward VCC through individual resistors and cathodes at P1. Complement 0x55 every second using twenty 50 ms Timer 0 delays.","d":"Each LED connects from VCC through its own current-limiting resistor to one P1 pin. The 8051 sinks current when a pin is low. Choose currents within the per-pin and total sink ratings, or use a buffer. 0x55 = 01010101 and 0xAA = 10101010; because the LEDs are active low, opposite sets alternate. A classic 12 MHz timer cannot count 1 s in one 16-bit overflow. Repeat a 50,000-count delay twenty times for about 1 s.","code":{"lang":"c","s":"output one alternating mask\nwait 1 s; complement and repeat","m":"unsigned char i, pattern = 0x55;\n    TMOD = (TMOD & 0xF0) | 0x01;  /* Timer 0, 16-bit mode */\n    for (;;) {\n        P1 = pattern;\n        for (i = 0; i \u003c 20; ++i) delay_us(50000);\n        pattern ^= 0xFF;\n    }","d":"#include \u003cREG51.H>\n/* Classic 12-clock 8051 at 12 MHz. 1 timer increment = 1 us. */\nstatic void delay_us(unsigned int us)\n{\n    unsigned int reload = 0u - us;\n    TR0 = 0;\n    TH0 = (unsigned char)(reload >> 8);\n    TL0 = (unsigned char)reload;\n    TF0 = 0;\n    TR0 = 1;\n    while (!TF0) { }\n    TR0 = 0;\n    TF0 = 0;\n}\n\nvoid main(void)\n{\n    unsigned char i, pattern = 0x55;\n    TMOD = (TMOD & 0xF0) | 0x01;  /* Timer 0, 16-bit mode */\n    for (;;) {\n        P1 = pattern;\n        for (i = 0; i \u003c 20; ++i) delay_us(50000);\n        pattern ^= 0xFF;\n    }\n}"}}},{"id":"mca-u2-q10","subject":"mca","unit":2,"number":10,"q":"Sketch the interfacing diagram of a 16×2 LCD with the 8051 and write an Embedded C program to print \"SPPU\" on the screen.","ans":{"s":"HD44780: P2 data, RS chooses command/data, pulse E for each byte. Initialize and send S, P, P, U.","m":"Wire P2 to D0–D7, P3.0 to RS, P3.1 to E, R/W to ground, and a contrast pot to V0. Initialize in 8-bit two-line mode, clear, set DDRAM address 0, and write SPPU with RS high.","d":"Connect D0–D7 to P2, RS to P3.0 and E to P3.1. Ground R/W for write-only operation, and feed V0 from a contrast potentiometer. Match logic and supply levels to the module. Wait for LCD power-up, send the 8-bit wake-up sequence and then 0x38 for 8-bit, two-line operation, 0x0C display on, 0x01 clear, 0x06 increment, and 0x80 to select the first line. RS is low for commands and high for text. Present the byte and pulse E. Since R/W is tied low, use fixed waits long enough for execution, with extra time for clear/home.","code":{"lang":"c","s":"initialize HD44780 in 8-bit mode\nset first DDRAM address\nsend each character in SPPU as data","m":"lcd_cmd(0x38);\nlcd_cmd(0x0C);\nlcd_cmd(0x01);\nlcd_cmd(0x06);\nlcd_cmd(0x80);\nlcd_data('S'); lcd_data('P'); lcd_data('P'); lcd_data('U');","d":"#include \u003cREG51.H>\n#include \u003cintrins.h>\nsbit rs = P3^0;\nsbit en = P3^1;\n\n/* Classic 12-clock 8051 at 12 MHz. 1 timer increment = 1 us. */\nstatic void delay_us(unsigned int us)\n{\n    unsigned int reload = 0u - us;\n    TR0 = 0;\n    TH0 = (unsigned char)(reload >> 8);\n    TL0 = (unsigned char)reload;\n    TF0 = 0;\n    TR0 = 1;\n    while (!TF0) { }\n    TR0 = 0;\n    TF0 = 0;\n}\n\nstatic void lcd_write(unsigned char data_select, unsigned char value)\n{\n    rs = data_select;\n    P2 = value;\n    _nop_();\n    en = 1;\n    _nop_();\n    en = 0;\n    delay_us(60);\n}\n\nvoid main(void)\n{\n    TMOD = (TMOD & 0xF0) | 0x01;  /* Timer 0, 16-bit mode */\n    en = 0;\n    delay_us(20000);\n    lcd_write(0, 0x30); delay_us(5000);\n    lcd_write(0, 0x30); delay_us(200);\n    lcd_write(0, 0x30);\n    lcd_write(0, 0x38);\n    lcd_write(0, 0x0C);\n    lcd_write(0, 0x01); delay_us(2000);\n    lcd_write(0, 0x06);\n    lcd_write(0, 0x80);\n    lcd_write(1, 'S');\n    lcd_write(1, 'P');\n    lcd_write(1, 'P');\n    lcd_write(1, 'U');\n    for (;;) { }\n}"}}},{"id":"mca-u2-q11","subject":"mca","unit":2,"number":11,"q":"Illustrate how an 8-bit DAC0808 is interfaced with the 8051 and write an Embedded C program to generate a 2 kHz square wave using Timer 1 in Mode 0 for timing.","ans":{"s":"Toggle DAC codes 00h and FFh every 250 µs. At 12 MHz, Mode 0 preload gives TH1 = F8h and TL1 = 06h.","m":"For 2 kHz, the half-period is 250 µs. With 12 MHz Fosc and 12 clocks per cycle, Mode 0 needs 250 counts. Load 8192 − 250 = 7942 via TH1 = F8h, TL1 = 06h. Drive DAC inputs from an 8-bit port and convert its current output to voltage.","d":"Connect P1.7 to the DAC0808 MSB A1 through P1.0 to LSB A8, with voltage-level compatibility verified. The DAC needs a specified reference-current network, supply connections and an op-amp current-to-voltage stage. Switch P1 between 00h and FFh. Timer 1 Mode 0 is a 13-bit counter made of TH1 and the low five bits of TL1. With a 12 MHz crystal, 250 timer ticks give 250 µs and the preload is 8192 − 250 = 0x1F06. Pack the 13-bit count as TH1 = preload >> 5 = F8h and TL1 = preload & 1Fh = 06h. This gives nominal 2 kHz; software reload time slows it slightly. Calibrate measured frequency or use an auto-reload timer if precise timing is required.","code":{"lang":"c","s":"set Timer 1 Mode 0\nrepeat: output 00h; wait 250 µs; output FFh; wait 250 µs","m":"TMOD &= 0x0F;\nfor (;;) {\n    P1 = 0x00; delay_half_period();\n    P1 = 0xFF; delay_half_period();\n}","d":"#include \u003cREG51.H>\nstatic void delay_half_period(void)\n{\n    TR1 = 0;\n    TH1 = 0xF8;\n    TL1 = 0x06;\n    TF1 = 0;\n    TR1 = 1;\n    while (!TF1) { }\n    TR1 = 0;\n    TF1 = 0;\n}\n\nvoid main(void)\n{\n    TMOD &= 0x0F;  /* T1 mode 0, internal clock, no gate */\n    for (;;) {\n        P1 = 0x00; delay_half_period();\n        P1 = 0xFF; delay_half_period();\n    }\n}"}}}]},{"title":"ARM7 Processor Fundamentals & Architecture","questions":[{"id":"mca-u3-q1","subject":"mca","unit":3,"number":1,"q":"Provide a comparative analysis of the ARM7, ARM9, and ARM11 processor families.","ans":{"s":"Typical ARM7TDMI / ARM9 / ARM11 cores use 3 / 5 / 8 pipeline stages. Later generations improve throughput and add memory-system or DSP features.","m":"Compare representative cores: ARM7TDMI uses ARMv4T and a three-stage pipeline with a unified core bus. ARM926EJ-S is ARMv5TEJ, five-stage, with separate I/D caches and an MMU. ARM1176JZF-S is ARMv6, eight-stage, with I/D caches, MMU, media instructions and VFP.","d":"ARM7TDMI (ARMv4T) has fetch, decode and execute stages and supports ARM/Thumb instructions. It typically targets small embedded systems such as LPC2148. ARM926EJ-S (ARMv5TEJ) splits execution, memory and write-back in its five-stage pipeline and integrates separate I/D caches and an MMU, suitable for systems running embedded operating systems. ARM1176JZF-S (ARMv6) extends the pipeline to eight stages and adds media-oriented instructions, VFP and a more capable memory system. A deeper pipeline can improve clock frequency but increases the recovery cost of mispredicted branches. These details describe representative family members, so cache, MMU and floating-point support can vary by core."}},{"id":"mca-u3-q2","subject":"mca","unit":3,"number":2,"q":"Contrast the ARM7-based LPC2148 microcontroller with the classic 8051 microcontroller.","ans":{"s":"LPC2148 uses 32-bit ARM7TDMI-S up to 60 MHz with Flash, USB and ADC/DAC. Original 8051 uses an 8-bit CPU with basic GPIO, two timers and one UART.","m":"LPC2148 adds 32-bit ARM and 16-bit Thumb instructions, 512 KiB Flash, 32 KiB main SRAM plus 8 KiB shared USB RAM, and vectored interrupt control. Classic 8051 has 4 KiB ROM, 128 B RAM, separate code/data spaces and two interrupt priority levels.","d":"The LPC2148 is a 32-bit ARMv4T MCU with pipelining, mapped peripherals, a VIC, two 32-bit timers, two UARTs, I²C, SPI/SSP, USB full-speed device capability and on-chip ADC/DAC. It can run up to 60 MHz and has 512 KiB total Flash and 32 KiB main SRAM plus 8 KiB usable by USB DMA or as RAM. A classic 8051 is an 8-bit CISC-style MCU with 4 KiB ROM, 128 B RAM, separate 64 KiB code and external data address spaces, four 8-bit ports, two 16-bit timers, one serial port and two priority levels. LPC2148 suits higher-throughput control and more communication peripherals, while a small 8051 derivative may suit a simple fixed-function board. Clock rates on their own are not comparable performance metrics."}},{"id":"mca-u3-q3","subject":"mca","unit":3,"number":3,"q":"Highlight the core architectural features of ARM7 processors.","ans":{"s":"ARM7TDMI-S: ARMv4T, 32-bit load/store datapath, ARM/Thumb, three-stage pipeline, banked exception registers, barrel shifter and multiply.","m":"ARM7TDMI is a 32-bit in-order RISC core with fetch–decode–execute stages, a 32-bit ARM instruction state and a 16-bit Thumb encoding state. Most ARM instructions are conditional. Banked SP/LR and saved status registers support exceptions.","d":"ARM7TDMI executes ARMv4T instructions with an in-order three-stage fetch/decode/execute pipeline. It has a 32-bit register file and ALU. Load/store instructions transfer operands between memory and registers, and many ARM data-processing operations can shift an operand through the barrel shifter without a separate instruction. Most ARM-state instructions carry a condition code. ARM uses 32-bit encodings, while Thumb provides 16-bit encodings for better code density. Exception modes use banked registers and SPSRs. In TDMI, T refers to Thumb, D to on-chip debug, M to the enhanced multiplier and I to EmbeddedICE. LPC2148 incorporates the synthesizable ARM7TDMI-S variant."}},{"id":"mca-u3-q4","subject":"mca","unit":3,"number":4,"q":"Illustrate and describe the ARM core dataflow model in detail.","ans":{"s":"Registers → operand buses → barrel shifter/ALU or multiplier → write-back. Address path and data buffer connect the core to memory.","m":"The decoder reads source registers through operand buses. One ALU operand may be shifted or rotated. The ALU generates results, flags or effective addresses; loads use the read-data path, and stores use the write-data path. The PC supplies instruction addresses.","d":"Draw PC/address register → address bus → memory → instruction/data input latch → decode/control and register file. Registers feed two operand paths; one can pass through the barrel shifter before entering the ALU. The multiply block uses register operands and writes results back to the register file. Arithmetic results return on the write-back bus and may update CPSR flags. For LDR/STR the ALU forms the effective address, the address path performs the access, and the read or write data buffer moves the data. Branch logic updates the PC and refills the pipeline. On exception entry, control selects banked registers and saves pre-exception CPSR in the mode's SPSR.","fig":"\u003csvg viewBox=\"0 0 660 230\" width=\"660\" height=\"230\" role=\"img\" aria-labelledby=\"mca-u3-q4-mca-armflow-title\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\">\u003ctitle id=\"mca-u3-q4-mca-armflow-title\">ARM7 register, ALU, instruction and memory data flow\u003c/title>\u003cdefs>\u003cmarker id=\"mca-u3-q4-mca-armflow-arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#9aabbc\"/>\u003c/marker>\u003c/defs>\u003crect x=\"0\" y=\"0\" width=\"660\" height=\"230\" rx=\"9\" fill=\"#070b11\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"14\">\u003cpath d=\"M 178 50 H 233\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u3-q4-mca-armflow-arrow)\"/>\u003cpath d=\"M 398 50 H 488\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u3-q4-mca-armflow-arrow)\" marker-start=\"url(#mca-u3-q4-mca-armflow-arrow)\"/>\u003cpath d=\"M 317 77 V 112\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u3-q4-mca-armflow-arrow)\"/>\u003cpath d=\"M 270 77 V 96 H 96 V 112\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u3-q4-mca-armflow-arrow)\"/>\u003cpath d=\"M 179 140 H 233\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u3-q4-mca-armflow-arrow)\"/>\u003cpath d=\"M 399 140 H 488\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u3-q4-mca-armflow-arrow)\"/>\u003cpath d=\"M 470 140 V 50 H 488\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u3-q4-mca-armflow-arrow)\"/>\u003cpath d=\"M 567 167 V 179\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u3-q4-mca-armflow-arrow)\" marker-start=\"url(#mca-u3-q4-mca-armflow-arrow)\"/>\u003crect x=\"17\" y=\"26\" width=\"158\" height=\"49\" rx=\"6\" fill=\"#111820\" stroke=\"#f3c792\"/>\u003ctext x=\"96\" y=\"41.5\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">Instruction decode\u003c/text>\u003ctext x=\"96\" y=\"59.5\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">Control\u003c/text>\u003crect x=\"237\" y=\"26\" width=\"159\" height=\"49\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"316.5\" y=\"41.5\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">Register file\u003c/text>\u003ctext x=\"316.5\" y=\"59.5\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">r0–r15\u003c/text>\u003crect x=\"492\" y=\"26\" width=\"151\" height=\"49\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"567.5\" y=\"41.5\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">Write-back\u003c/text>\u003ctext x=\"567.5\" y=\"59.5\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">ALU / load data\u003c/text>\u003crect x=\"18\" y=\"116\" width=\"158\" height=\"49\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"97\" y=\"140.5\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">Barrel shifter\u003c/text>\u003crect x=\"237\" y=\"116\" width=\"159\" height=\"49\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"316.5\" y=\"131.5\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">32-bit ALU\u003c/text>\u003ctext x=\"316.5\" y=\"149.5\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">Multiply path\u003c/text>\u003crect x=\"492\" y=\"116\" width=\"151\" height=\"49\" rx=\"6\" fill=\"#111820\" stroke=\"#a7a6ff\"/>\u003ctext x=\"567.5\" y=\"131.5\" fill=\"#a7a6ff\" text-anchor=\"middle\" dominant-baseline=\"central\">Address/data\u003c/text>\u003ctext x=\"567.5\" y=\"149.5\" fill=\"#a7a6ff\" text-anchor=\"middle\" dominant-baseline=\"central\">interface\u003c/text>\u003crect x=\"492\" y=\"182\" width=\"151\" height=\"35\" rx=\"6\" fill=\"#111820\" stroke=\"#a7a6ff\"/>\u003ctext x=\"567.5\" y=\"199.5\" fill=\"#a7a6ff\" text-anchor=\"middle\" dominant-baseline=\"central\">Memory\u003c/text>\u003ctext x=\"303\" y=\"199\" fill=\"#c3cbd4\">Flags → CPSR\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"mca-u3-q5","subject":"mca","unit":3,"number":5,"q":"Enumerate the different operating modes supported by ARM processors and LPC2148, and elaborate on any one mode.","ans":{"s":"ARM7 modes: User, FIQ, IRQ, Supervisor, Abort, Undefined and System. FIQ banks r8–r14 for fast service.","m":"User is unprivileged; System is privileged and shares User registers. Supervisor handles reset/SWI, Abort handles memory faults, Undefined handles undefined instructions, IRQ handles normal interrupts, and FIQ handles fast interrupts. The five exception modes have an SPSR.","d":"CPSR M[4:0] selects User 10000, FIQ 10001, IRQ 10010, Supervisor 10011, Abort 10111, Undefined 11011 or System 11111. User and System share a register bank and have no SPSR. Each exception mode has banked r13 (SP), r14 (LR) and an SPSR; FIQ also banks r8–r12. During FIQ entry the core saves CPSR in SPSR_fiq, switches mode, sets interrupt mask bits, saves the return information in LR_fiq, and vectors to 0x1C. Banked registers reduce save/restore overhead. The handler acknowledges the source and performs the appropriate exception return to restore CPSR and resume."}},{"id":"mca-u3-q6","subject":"mca","unit":3,"number":6,"q":"Discuss any four general-purpose or special registers in the ARM architecture along with their specific uses.","ans":{"s":"r0 = general operand/argument; r13 = SP; r14 = LR; r15 = PC. CPSR carries flags, masks, state and mode.","m":"In ARM7, r0–r12 are working registers, r13 conventionally points to the current stack, r14 receives a subroutine return address from BL, and r15 is the PC. r13 and r14 are banked in exception modes.","d":"Example registers: r0 holds scratch operands, the first function argument or a return value under the usual calling convention. r13 (SP) points to the stack and is banked by exception mode. r14 (LR) receives a branch-with-link return address or exception return information and is often saved on the stack for nested calls. r15 (PC) controls instruction sequencing. Normal reading of PC in ARM state reflects architectural pipelining, typically instruction address +8, and in Thumb state typically +4. CPSR holds execution state and condition flags; exception modes have a corresponding SPSR for their saved status."}},{"id":"mca-u3-q7","subject":"mca","unit":3,"number":7,"q":"Draw the bit-level format of the CPSR and SPSR registers in ARM7 and explain the function of their fields.","ans":{"s":"ARM7 CPSR/SPSR: [31:28] NZCV, [27:8] reserved, [7] I, [6] F, [5] T, [4:0] mode.","m":"CPSR records flags, exception masks and processor state. SPSR in an exception mode stores the pre-exception CPSR with the same bit positions, enabling exception return. ARMv4T has no architectural Q flag.","d":"Draw the 32-bit format: [31 N | 30 Z | 29 C | 28 V | 27:8 reserved | 7 I | 6 F | 5 T | 4:0 M]. N means negative result, Z means zero, C means carry/no borrow for arithmetic or shifter carry where applicable, and V means signed overflow. I=1 masks IRQ and F=1 masks FIQ. T selects Thumb (1) or ARM (0) state. M selects the processor mode. CPSR is live state. The exception mode's SPSR saves the previous CPSR on entry and is restored by the proper exception-return instruction. Preserve reserved bits when modifying status.","fig":"\u003csvg viewBox=\"0 0 660 109\" width=\"660\" height=\"109\" role=\"img\" aria-labelledby=\"mca-u3-q7-mca-armpsr-title\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\">\u003ctitle id=\"mca-u3-q7-mca-armpsr-title\">CPSR/SPSR bit positions for ARMv4T\u003c/title>\u003cdefs>\u003cmarker id=\"mca-u3-q7-mca-armpsr-arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#9aabbc\"/>\u003c/marker>\u003c/defs>\u003crect x=\"0\" y=\"0\" width=\"660\" height=\"109\" rx=\"9\" fill=\"#070b11\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"14\">\u003crect x=\"14\" y=\"40\" width=\"40\" height=\"40\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"34\" y=\"60\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">N\u003c/text>\u003crect x=\"54\" y=\"40\" width=\"40\" height=\"40\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"74\" y=\"60\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">Z\u003c/text>\u003crect x=\"94\" y=\"40\" width=\"40\" height=\"40\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"114\" y=\"60\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">C\u003c/text>\u003crect x=\"134\" y=\"40\" width=\"40\" height=\"40\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"154\" y=\"60\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">V\u003c/text>\u003crect x=\"174\" y=\"40\" width=\"264\" height=\"40\" rx=\"6\" fill=\"#111820\" stroke=\"#a7a6ff\"/>\u003ctext x=\"306\" y=\"60\" fill=\"#a7a6ff\" text-anchor=\"middle\" dominant-baseline=\"central\">Reserved\u003c/text>\u003crect x=\"438\" y=\"40\" width=\"45\" height=\"40\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"460.5\" y=\"60\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">I\u003c/text>\u003crect x=\"483\" y=\"40\" width=\"45\" height=\"40\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"505.5\" y=\"60\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">F\u003c/text>\u003crect x=\"528\" y=\"40\" width=\"45\" height=\"40\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"550.5\" y=\"60\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">T\u003c/text>\u003crect x=\"573\" y=\"40\" width=\"72\" height=\"40\" rx=\"6\" fill=\"#111820\" stroke=\"#f3c792\"/>\u003ctext x=\"609\" y=\"60\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">Mode\u003c/text>\u003ctext x=\"24\" y=\"29\" fill=\"#c3cbd4\">31\u003c/text>\u003ctext x=\"65\" y=\"29\" fill=\"#c3cbd4\">30\u003c/text>\u003ctext x=\"105\" y=\"29\" fill=\"#c3cbd4\">29\u003c/text>\u003ctext x=\"145\" y=\"29\" fill=\"#c3cbd4\">28\u003c/text>\u003ctext x=\"288\" y=\"29\" fill=\"#c3cbd4\">27:8\u003c/text>\u003ctext x=\"456\" y=\"29\" fill=\"#c3cbd4\">7\u003c/text>\u003ctext x=\"501\" y=\"29\" fill=\"#c3cbd4\">6\u003c/text>\u003ctext x=\"546\" y=\"29\" fill=\"#c3cbd4\">5\u003c/text>\u003ctext x=\"599\" y=\"29\" fill=\"#c3cbd4\">4:0\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"mca-u3-q8","subject":"mca","unit":3,"number":8,"q":"Draw the functional block diagram of the LPC2148 microcontroller and discuss its prominent features.","ans":{"s":"ARM7TDMI-S → AHB/bridge → Flash, SRAM, VIC, USB, GPIO and APB peripherals. Oscillator/PLLs provide CPU and USB clocks.","m":"LPC2148 combines a 60 MHz ARM7TDMI-S, 512 KiB Flash, 32 KiB SRAM plus 8 KiB shared USB RAM, VIC and fast GPIO. Its interfaces include USB full speed, UART, I²C, SPI/SSP, timers/PWM, 10-bit ADCs and a 10-bit DAC.","d":"Draw oscillator/reset → PLL0/system clock → ARM7TDMI-S → local Flash and SRAM controllers. Show AHB-side blocks such as VIC, USB device and fast GPIO, then draw AHB-to-APB bridge and peripheral clock divider feeding UART0/1, I²C0/1, SPI/SSP, Timer0/1, PWM, RTC/watchdog, ADC and DAC. The 512 KiB Flash interface uses a Memory Accelerator Module. Main SRAM is 32 KiB; 8 KiB additional RAM is shared with USB DMA. PLL1 generates the USB clock. Pin multiplexing assigns peripheral functions to package pins. The device can operate at up to 60 MHz and has a USB full-speed device controller.","fig":"\u003csvg viewBox=\"0 0 660 255\" width=\"660\" height=\"255\" role=\"img\" aria-labelledby=\"mca-u3-q8-mca-lpcblock-title\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\">\u003ctitle id=\"mca-u3-q8-mca-lpcblock-title\">LPC2148 processor, bus, memory and peripherals\u003c/title>\u003cdefs>\u003cmarker id=\"mca-u3-q8-mca-lpcblock-arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#9aabbc\"/>\u003c/marker>\u003c/defs>\u003crect x=\"0\" y=\"0\" width=\"660\" height=\"255\" rx=\"9\" fill=\"#070b11\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"14\">\u003cpath d=\"M 160 52 H 201\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u3-q8-mca-lpcblock-arrow)\"/>\u003cpath d=\"M 457 52 H 495\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u3-q8-mca-lpcblock-arrow)\" marker-start=\"url(#mca-u3-q8-mca-lpcblock-arrow)\"/>\u003cpath d=\"M 330 76 V 112\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u3-q8-mca-lpcblock-arrow)\" marker-start=\"url(#mca-u3-q8-mca-lpcblock-arrow)\"/>\u003cpath d=\"M 202 140 H 162\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u3-q8-mca-lpcblock-arrow)\" marker-start=\"url(#mca-u3-q8-mca-lpcblock-arrow)\"/>\u003cpath d=\"M 457 140 H 495\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u3-q8-mca-lpcblock-arrow)\" marker-start=\"url(#mca-u3-q8-mca-lpcblock-arrow)\"/>\u003cpath d=\"M 330 168 V 192\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u3-q8-mca-lpcblock-arrow)\" marker-start=\"url(#mca-u3-q8-mca-lpcblock-arrow)\"/>\u003cpath d=\"M 202 217 H 162\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u3-q8-mca-lpcblock-arrow)\" marker-start=\"url(#mca-u3-q8-mca-lpcblock-arrow)\"/>\u003cpath d=\"M 457 217 H 495\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u3-q8-mca-lpcblock-arrow)\" marker-start=\"url(#mca-u3-q8-mca-lpcblock-arrow)\"/>\u003crect x=\"17\" y=\"28\" width=\"141\" height=\"47\" rx=\"6\" fill=\"#111820\" stroke=\"#f3c792\"/>\u003ctext x=\"87.5\" y=\"51.5\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">Crystal and PLLs\u003c/text>\u003crect x=\"205\" y=\"28\" width=\"250\" height=\"47\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"330\" y=\"51.5\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">ARM7TDMI-S core\u003c/text>\u003crect x=\"499\" y=\"28\" width=\"143\" height=\"47\" rx=\"6\" fill=\"#111820\" stroke=\"#a7a6ff\"/>\u003ctext x=\"570.5\" y=\"51.5\" fill=\"#a7a6ff\" text-anchor=\"middle\" dominant-baseline=\"central\">Local Flash / RAM\u003c/text>\u003crect x=\"17\" y=\"116\" width=\"141\" height=\"49\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"87.5\" y=\"140.5\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">VIC and fast GPIO\u003c/text>\u003crect x=\"205\" y=\"116\" width=\"250\" height=\"49\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"330\" y=\"140.5\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">AHB / AHB-to-APB bridge\u003c/text>\u003crect x=\"499\" y=\"116\" width=\"143\" height=\"49\" rx=\"6\" fill=\"#111820\" stroke=\"#f3c792\"/>\u003ctext x=\"570.5\" y=\"140.5\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">USB full speed\u003c/text>\u003crect x=\"205\" y=\"196\" width=\"250\" height=\"43\" rx=\"6\" fill=\"#111820\" stroke=\"#a7a6ff\"/>\u003ctext x=\"330\" y=\"217.5\" fill=\"#a7a6ff\" text-anchor=\"middle\" dominant-baseline=\"central\">APB peripheral bus\u003c/text>\u003crect x=\"17\" y=\"196\" width=\"141\" height=\"43\" rx=\"6\" fill=\"#111820\" stroke=\"#f3c792\"/>\u003ctext x=\"87.5\" y=\"217.5\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">Timers / ADC / DAC\u003c/text>\u003crect x=\"499\" y=\"196\" width=\"143\" height=\"43\" rx=\"6\" fill=\"#111820\" stroke=\"#f3c792\"/>\u003ctext x=\"570.5\" y=\"217.5\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">UART / I²C / SPI\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"mca-u3-q9","subject":"mca","unit":3,"number":9,"q":"Describe the memory map and the General Purpose Input/Output architecture of the ARM7-based LPC2148 microcontroller.","ans":{"s":"Flash 0x00000000; main SRAM 0x40000000; APB 0xE0000000 range. GPIO needs pin mux, direction, PIN/SET/CLR.","m":"LPC2148 maps Flash at 0x00000000, 32 KiB main SRAM at 0x40000000, shared 8 KiB USB RAM at 0x7FD00000 and memory-mapped peripherals in APB/AHB regions. PINSEL chooses alternate or GPIO function. IODIR selects direction. IOSET and IOCLR act on written 1 bits.","d":"Show Flash 0x00000000–0x0007FFFF (boot/exception behavior depends on remap), SRAM 0x40000000–0x40007FFF, USB RAM 0x7FD00000–0x7FD01FFF, APB peripherals in the 0xE0000000 region and the VIC at 0xFFFFF000. MEMMAP selects the low-vector mapping. GPIO package pins are shared with peripheral signals. Select GPIO via PINSEL, then use IODIR bit=1 for output and 0 for input. Read levels through IOPIN; write masks to IOSET/IOCLR for bitwise output updates. Select fast GPIO using SCS and access FIODIR, FIOMASK, FIOPIN, FIOSET and FIOCLR. Do not assume every logical port bit is bonded out."}},{"id":"mca-u3-q10","subject":"mca","unit":3,"number":10,"q":"Outline the primary features of the LPC2148 and explain the role of its Pin Connect Block.","ans":{"s":"Pin Connect Block selects GPIO or alternate peripheral function via PINSEL. LPC2148 integrates ARM7, Flash/SRAM, USB and control peripherals.","m":"PINSEL0/1 select Port 0 functions; PINSEL2 controls certain Port 1 functions. Choose the package pin's exact function code before enabling the corresponding peripheral. Reset pin defaults and JTAG options matter.","d":"LPC2148 targets embedded control using ARM7TDMI-S up to 60 MHz, 512 KiB total Flash, 32 KiB main SRAM plus 8 KiB shared USB RAM, VIC, USB full-speed device, UARTs, I²C, SPI/SSP, 32-bit timers, PWM, ADCs and DAC. The Pin Connect Block routes internal signals to shared physical pins. PINSEL0 and PINSEL1 contain two-bit Port 0 fields; use the documented field code and preserve unrelated bits. PINSEL2 provides group selection for some Port 1 functions, including debug/trace selections. For example, P0.0 and P0.1 can be assigned TXD0 and RXD0 with function 01, leaving them available as GPIO when configured 00. After routing a signal, configure GPIO direction or the chosen peripheral separately."}}]},{"title":"ARM7-Based Microcontroller Interfaces","questions":[{"id":"mca-u4-q1","subject":"mca","unit":4,"number":1,"q":"Discuss the importance of System Control and Power Control blocks in the ARM architecture.","ans":{"s":"System Control sets clocks, Flash timing, vector remap and external IRQs. Power Control manages CPU sleep and peripheral clock gating.","m":"In LPC2148, PLL0 and VPBDIV set core and peripheral speed; MAM controls Flash access and MEMMAP controls low-vector mapping. PCON controls Idle/Power-down, while PCONP gates selected peripheral blocks. Wake sources depend on the chosen mode.","d":"Separate ARM7 core behavior from MCU-level registers. System Control configures the oscillator-derived CPU clock (PLL0), USB clock (PLL1), peripheral divider, Memory Accelerator Module, external interrupt edge/level and polarity, and low-vector mapping through MEMMAP. PCON selects Idle or Power-down. In Idle the core clock stops while enabled peripherals can continue and a qualifying interrupt can wake the CPU. Power-down halts the main oscillator and active clock domains, so only supported asynchronous wake paths or reset can resume it. PCONP controls power/clock to selected peripherals, allowing unused modules to be disabled. Reconfigure clock-dependent timing after clock transitions where required."}},{"id":"mca-u4-q2","subject":"mca","unit":4,"number":2,"q":"Explain how the Phase Locked Loop is configured in the LPC2148 to set up the system clock, and clarify the function of the VPB Divider.","ans":{"s":"CCLK = M·Fosc; FCCO = 2·P·CCLK. Enable PLL0, feed AA/55, wait lock, connect, feed. VPBDIV gives PCLK = CCLK / 1, 2 or 4.","m":"Choose integer PLL0 multiplier M and divider P keeping CCLK within the part rating and FCCO within 156–320 MHz. Program MSEL=M−1 and the PSEL code, feed 0xAA then 0x55, wait for PLOCK, connect and feed again. Set VPBDIV for the chosen peripheral clock.","d":"PLL0 multiplies the crystal frequency: CCLK = M·Fosc when connected; the internal oscillator runs at FCCO = 2·P·CCLK. P is 1, 2, 4 or 8 and selects a valid FCCO without changing CCLK. Program PLL0CFG MSEL = M−1 and PSEL (00/01/10/11 for P = 1/2/4/8). Set PLLE in PLL0CON, write PLL0FEED = 0xAA then 0x55 consecutively, wait for PLL0STAT PLOCK bit 10, set PLLE and PLLC, and repeat the feed. Respect the 60 MHz LPC2148 limit and 156–320 MHz FCCO range. Configure Flash timing (MAM) for the chosen speed. VPBDIV bits 1:0 encode 00 for CCLK/4, 01 for CCLK and 10 for CCLK/2; peripheral baud rates and timer periods derive from PCLK."}},{"id":"mca-u4-q3","subject":"mca","unit":4,"number":3,"q":"Illustrate the relationship between the processor clock CCLK and peripheral clock PCLK using the VPB divider. Calculate the required VPB divider configuration to obtain PCLK = 30 MHz from an external oscillator Fosc = 12 MHz.","ans":{"s":"12 MHz × 5 = 60 MHz CCLK. VPBDIV=0x02 divides by two to get 30 MHz PCLK. Choose PLL P=2 for FCCO=240 MHz.","m":"To obtain 30 MHz PCLK, use PLL0 M=5 and VPBDIV=10₂. Choose P=2 so FCCO = 2×2×60 = 240 MHz. MSEL=4, PSEL=01₂, hence PLL0CFG=0x24.","d":"Diagram: Fosc 12 MHz → PLL0 ×5 → CCLK 60 MHz → VPBDIV ÷2 → PCLK 30 MHz. Direct divide-by-1 would require a PLL multiplier of 2.5, and divide-by-4 would require 120 MHz CCLK, beyond the device limit. With M=5 and P=2, FCCO=240 MHz within 156–320 MHz. Encode PLL0CFG as (1\u003c\u003c5)|4 = 0x24, enable and feed PLL0, wait for lock, connect and feed again. Set VPBDIV=0x02. MAM timing should match the new 60 MHz CPU clock.","fig":"\u003csvg viewBox=\"0 0 660 97\" width=\"660\" height=\"97\" role=\"img\" aria-labelledby=\"mca-u4-q3-mca-clock-title\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\">\u003ctitle id=\"mca-u4-q3-mca-clock-title\">12 MHz crystal to 60 MHz core and 30 MHz peripheral clocks\u003c/title>\u003cdefs>\u003cmarker id=\"mca-u4-q3-mca-clock-arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#9aabbc\"/>\u003c/marker>\u003c/defs>\u003crect x=\"0\" y=\"0\" width=\"660\" height=\"97\" rx=\"9\" fill=\"#070b11\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"14\">\u003cpath d=\"M 157 48 H 171\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u4-q3-mca-clock-arrow)\"/>\u003cpath d=\"M 315 48 H 329\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u4-q3-mca-clock-arrow)\"/>\u003cpath d=\"M 473 48 H 487\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u4-q3-mca-clock-arrow)\"/>\u003crect x=\"15\" y=\"24\" width=\"142\" height=\"48\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"86\" y=\"39\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">Crystal\u003c/text>\u003ctext x=\"86\" y=\"57\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">12 MHz\u003c/text>\u003crect x=\"173\" y=\"24\" width=\"142\" height=\"48\" rx=\"6\" fill=\"#111820\" stroke=\"#a7a6ff\"/>\u003ctext x=\"244\" y=\"39\" fill=\"#a7a6ff\" text-anchor=\"middle\" dominant-baseline=\"central\">PLL0 ×5\u003c/text>\u003ctext x=\"244\" y=\"57\" fill=\"#a7a6ff\" text-anchor=\"middle\" dominant-baseline=\"central\">CCLK = 60 MHz\u003c/text>\u003crect x=\"331\" y=\"24\" width=\"142\" height=\"48\" rx=\"6\" fill=\"#111820\" stroke=\"#f3c792\"/>\u003ctext x=\"402\" y=\"39\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">VPBDIV ÷2\u003c/text>\u003ctext x=\"402\" y=\"57\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">setting 0x02\u003c/text>\u003crect x=\"489\" y=\"24\" width=\"156\" height=\"48\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"567\" y=\"39\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">PCLK\u003c/text>\u003ctext x=\"567\" y=\"57\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">30 MHz\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"mca-u4-q4","subject":"mca","unit":4,"number":4,"q":"Describe the interrupt handling architecture of the ARM7-based LPC2148 microcontroller.","ans":{"s":"Peripheral flags → VIC → IRQ/FIQ. Route/enable source, configure IRQ slot, clear flags and acknowledge VIC at ISR end.","m":"The VIC can route requests to FIQ, vectored IRQ or nonvectored IRQ. VICIntSelect assigns FIQ/IRQ and VICIntEnable enables sources. Up to 16 vectored IRQ slots carry ISR addresses and priorities. The handler clears the peripheral flag then writes VICVectAddr to acknowledge.","d":"An LPC2148 peripheral raises its interrupt request to a VIC input. Configure and clear the peripheral, select IRQ or FIQ using VICIntSelect, and enable the source with VICIntEnable. For a vectored IRQ, put the handler in VICVectAddr0–15 and enable the matching source in its VICVectCntl slot. Lower slot number gives higher priority. ARM7 takes IRQ at 0x18 and FIQ at 0x1C. In an IRQ vector stub, read VICVectAddr to obtain the highest ready handler or the default address for an unvectored IRQ. The ISR saves required state, services and clears the peripheral flag, writes VICVectAddr to signal end of service, and returns with ARM exception semantics. FIQ has priority over IRQ and uses banked registers to keep latency low."}},{"id":"mca-u4-q5","subject":"mca","unit":4,"number":5,"q":"List the key features of the 32-bit timers in the LPC2148, explaining the roles of the Prescale and Match registers, and show how they are configured to generate time delays.","ans":{"s":"Timer tick = (PR+1)/PCLK. MR0 sets target count. MCR can interrupt, reset or stop on match; capture registers latch timestamps.","m":"Timer0/1 each include 32-bit TC/PC/PR, match and capture channels. Prescaler PR sets TC's increment period. Match actions are programmed in MCR. For 1 ms at PCLK 30 MHz, set PR=29 for 1 µs/count and MR0=1000.","d":"Timer mode counts PCLK through the prescaler; counter mode can count selected edges on CAP pins via CTCR. TC increments each PR+1 PCLK cycles. A match occurs when TC equals MR0–MR3, and MCR independently controls match interrupt, reset and stop. External match pins can set, clear or toggle through EMR. Capture events store TC in a CR register; CCR configures edge and interrupt. For a periodic 1 ms event at 30 MHz, reset Timer0 with T0TCR, select timer mode, set T0PR=29 and T0MR0=1000, and use T0MCR=3 (interrupt flag and reset on MR0). Clear pending T0IR bit 0 by writing 1, start with T0TCR=1, and poll/clear the flag or enable a VIC ISR. Period = MR0(PR+1)/PCLK for reset-on-match."}},{"id":"mca-u4-q6","subject":"mca","unit":4,"number":6,"q":"Write an Embedded C program to produce a 2 kHz square wave on an output pin of the LPC2148.","ans":{"s":"2 kHz means a 250 µs half-period. Toggle the output at each timer match.","m":"With CCLK and PCLK both 12 MHz, Timer 0 PR = 11 sets a 1 µs timer tick. MR0 = 250 and MCR = 3 make the timer flag and reset every 250 µs. Poll MR0 and toggle P0.10 at each match.","d":"Example uses a 12 MHz crystal with PLL disconnected and VPBDIV = 01, so PCLK = CCLK = 12 MHz. Set P0.10 to GPIO through PINSEL0[21:20] and set IO0DIR[10]. The full period of a 2 kHz wave is 500 µs. Toggle once per 250 µs match to give 50% duty cycle. A 1 µs tick requires PR = PCLK/(1 MHz) − 1 = 11. MR0 = 250; MCR bit 0 sets the match flag and bit 1 resets the counter. After each match, clear IR[0] with a write of one, then change the GPIO state. Polling keeps the example compact; CPU service latency adds slight edge timing error.","code":{"s":"configure 1 µs timer tick\nrepeat every 250 ticks:\n  toggle output","m":"T0PR = 11;\nT0MR0 = 250;\nT0MCR = 3;\nT0TCR = 1;\nfor (;;) {\n    while (!(T0IR & 1u)) { }\n    T0IR = 1;\n    level = !level;\n    if (level) IO0SET = 1u \u003c\u003c 10;\n    else IO0CLR = 1u \u003c\u003c 10;\n}","d":"#include \u003cLPC214x.h>\n#define OUTPUT (1u \u003c\u003c 10)\n\nstatic void timer0_start(unsigned us)\n{\n    PCONP |= (1u \u003c\u003c 1);          /* Timer 0 peripheral clock */\n    T0TCR = 2;                   /* Reset timer and prescaler */\n    T0CTCR = 0;                  /* Timer mode */\n    T0PR = 11;                   /* PCLK = 12 MHz, TC ticks at 1 MHz */\n    T0MR0 = us;\n    T0MCR = 3;                   /* Set match flag and reset TC on MR0 */\n    T0IR = 1;                    /* Clear stale MR0 flag */\n    T0TCR = 1;\n}\n\nstatic void wait_tick(void)\n{\n    while (!(T0IR & 1u)) { }\n    T0IR = 1;                    /* Write one to clear */\n}\n\nint main(void)\n{\n    unsigned level = 0;\n    VPBDIV = 1;                  /* 12 MHz CCLK, no PLL */\n    PINSEL0 &= ~(3u \u003c\u003c 20);\n    IO0DIR |= OUTPUT;\n    IO0CLR = OUTPUT;\n    timer0_start(250);\n    for (;;) {\n        wait_tick();\n        level ^= 1u;\n        if (level) IO0SET = OUTPUT;\n        else IO0CLR = OUTPUT;\n    }\n}","lang":"c"}}},{"id":"mca-u4-q7","subject":"mca","unit":4,"number":7,"q":"Show the interfacing of an LED with the LPC2148 and write an Embedded C program to blink it at 1 ms intervals using Timer 0 assuming Fosc = 12 MHz.","ans":{"s":"At 12 MHz PCLK, PR = 11 gives 1 µs ticks. MR0 = 1000 gives a toggle every 1 ms.","m":"With CCLK and PCLK both 12 MHz, Timer 0 PR = 11 sets a 1 µs timer tick. MR0 = 1000 and MCR = 3 make the timer flag and reset every 1000 µs. Poll MR0 and toggle P0.10 at each match.","d":"Example uses a 12 MHz crystal with PLL disconnected and VPBDIV = 01, so PCLK = CCLK = 12 MHz. Set P0.10 to GPIO through PINSEL0[21:20] and set IO0DIR[10]. Wire P0.10 through a current-limiting resistor to the LED anode and connect the cathode to ground. A 1 ms interval between edges gives a 2 ms full period. A 1 µs tick requires PR = PCLK/(1 MHz) − 1 = 11. MR0 = 1000; MCR bit 0 sets the match flag and bit 1 resets the counter. After each match, clear IR[0] with a write of one, then change the GPIO state. Polling keeps the example compact; CPU service latency adds slight edge timing error.","code":{"s":"configure 1 µs timer tick\nrepeat every 1000 ticks:\n  toggle output","m":"T0PR = 11;\nT0MR0 = 1000;\nT0MCR = 3;\nT0TCR = 1;\nfor (;;) {\n    while (!(T0IR & 1u)) { }\n    T0IR = 1;\n    level = !level;\n    if (level) IO0SET = 1u \u003c\u003c 10;\n    else IO0CLR = 1u \u003c\u003c 10;\n}","d":"#include \u003cLPC214x.h>\n#define OUTPUT (1u \u003c\u003c 10)\n\nstatic void timer0_start(unsigned us)\n{\n    PCONP |= (1u \u003c\u003c 1);          /* Timer 0 peripheral clock */\n    T0TCR = 2;                   /* Reset timer and prescaler */\n    T0CTCR = 0;                  /* Timer mode */\n    T0PR = 11;                   /* PCLK = 12 MHz, TC ticks at 1 MHz */\n    T0MR0 = us;\n    T0MCR = 3;                   /* Set match flag and reset TC on MR0 */\n    T0IR = 1;                    /* Clear stale MR0 flag */\n    T0TCR = 1;\n}\n\nstatic void wait_tick(void)\n{\n    while (!(T0IR & 1u)) { }\n    T0IR = 1;                    /* Write one to clear */\n}\n\nint main(void)\n{\n    unsigned level = 0;\n    VPBDIV = 1;                  /* 12 MHz CCLK, no PLL */\n    PINSEL0 &= ~(3u \u003c\u003c 20);\n    IO0DIR |= OUTPUT;\n    IO0CLR = OUTPUT;\n    timer0_start(1000);\n    for (;;) {\n        wait_tick();\n        level ^= 1u;\n        if (level) IO0SET = OUTPUT;\n        else IO0CLR = OUTPUT;\n    }\n}","lang":"c"}}},{"id":"mca-u4-q8","subject":"mca","unit":4,"number":8,"q":"Draw a neat diagram interfacing diagram illustrating how a 4×4 matrix keypad is interfaced with the LPC2148 and write an algorithm to identify a pressed key.","ans":{"s":"One row low at a time, read active-low columns, debounce, return keymap[row][column].","m":"Wire four row lines and four column inputs to GPIO. Pull columns high with 3.3 V resistors. Drive each row low in turn with the other rows high-impedance. A pressed key pulls its column low. Confirm the same row/column after a debounce delay and wait for release.","d":"Use a 4×4 matrix with rows R0–R3 at P0.4–P0.7 and columns C0–C3 at P0.8–P0.11. Select GPIO and use a pull-up on each column. Keep inactive rows high-impedance to avoid opposing outputs when two keys are pressed. Set the selected row output latch low before setting that row as an output. Read the columns after settling. Map the position to layout rows 123A, 456B, 789C and *0#D. Confirm the same reading after 20 ms. Wait for stable release before reporting a repeat. Multiple pressed keys can ghost without isolation diodes; this routine accepts one key at a time.","code":{"s":"for each row:\n  drive row low; read columns\n  if a column is low: return row, column after debounce","m":"all rows ← high impedance\nscan each row by driving it low, reading columns, and restoring high impedance\nif exactly one position appears twice, 20 ms apart: emit its key\nwait for stable release","d":"function scan_once():\n    candidates = empty list\n    make all rows inputs\n    for row in R0..R3:\n        set row output latch to zero\n        make row output\n        wait for signals to settle\n        for col in C0..C3:\n            if col input == LOW: add (row, col) to candidates\n        make row input\n    return candidates\n\nforever:\n    first = scan_once()\n    if length(first) == 1:\n        wait 20 ms\n        if scan_once() == first:\n            emit keymap[first[0].row][first[0].col]\n            repeat until two scans 20 ms apart both show release","lang":"pseudo"}}},{"id":"mca-u4-q9","subject":"mca","unit":4,"number":9,"q":"With a proper interfacing diagram, explain how a Graphical LCD is connected to the LPC2148 and outline an algorithm to render an image on it.","ans":{"s":"Set page and column, select display half, then write packed pixel bytes on the data bus.","m":"For a KS0108-style 128×64 display, use eight GPIO data lines, CS1/CS2, D/I, R/W, E, and reset. Each byte maps eight vertical pixels in one column. Send commands for page and start column, then stream the data for each half.","d":"Example uses a KS0108-style two-controller 128×64 monochrome LCD. Wire D0–D7 to eight GPIO pins and use separate GPIO for D/I, R/W, E, CS1, CS2 and reset. Confirm supply and I/O levels on the chosen module and use compatible level translation where required. A controller selects one 64-column half. Set display on with 0x3F, start line with 0xC0, page with 0xB8 | page, and column with 0x40 | column. For a write, select the intended half, set R/W = 0, select command or data through D/I, present the byte, then pulse E using the datasheet timing. Use the specified busy check or conservative delay. Each byte contains eight vertically adjacent pixels. Read image bytes in page-major order and send 64 columns to each half for every page.","code":{"s":"initialize LCD\nfor each page and controller:\n  set page and column zero; write pixel bytes","m":"init display and start line\nfor page in 0..7:\n  for half in 0..1:\n    select half; set page; set column 0\n    write its 64 pixel bytes","d":"function write_byte(value, data):\n    R/W = 0; D/I = data\n    place value on D7..D0\n    pulse E using LCD timing; wait until ready\n\nreset display\nfor half in [0, 1]:\n    select only half\n    write_byte(0x3F, COMMAND)\n    write_byte(0xC0, COMMAND)\n    for page in 0..7:\n        write_byte(0xB8 OR page, COMMAND)\n        write_byte(0x40, COMMAND)\n        for local_column in 0..63:\n            x = 64 * half + local_column\n            value = 0\n            for bit in 0..7:\n                value = value OR (pixel(x, 8 * page + bit) \u003c\u003c bit)\n            write_byte(value, DATA)","lang":"pseudo"}}}]},{"title":"Real-World Interfacing with ARM","questions":[{"id":"mca-u5-q1","subject":"mca","unit":5,"number":1,"q":"Discuss the working principles of UART serial communication in detail.","ans":{"s":"UART idles high, then sends a low start bit, LSB-first data, optional parity, and high stop bit(s). Both ends agree on baud and frame format.","m":"UART is asynchronous and uses TX and RX with a shared reference. The receiver finds the start edge and samples near bit centres. In 8N1, one byte uses ten bit times: one start, eight data and one stop. Matching baud and voltage levels is essential.","d":"TX and RX exchange serial frames without a shared clock. A common format is 8N1: idle high → start low → D0 through D7 → stop high. TX holds each bit for 1/baud. RX detects the start transition, checks the start bit and samples near the centre of the successive bits, commonly using oversampling. Optional parity detects some bit errors; a missing valid stop level, a full receive buffer, or bad parity can report framing, overrun or parity error respectively. Cross TX→RX and RX←TX with common ground at compatible logic levels; use a transceiver for RS-232 levels. At 9600 baud one bit takes about 104.17 µs and a continuous 8N1 stream carries at most 960 bytes/s before higher-layer overhead."}},{"id":"mca-u5-q2","subject":"mca","unit":5,"number":2,"q":"Describe the UART communication architecture in the LPC2148 and write an algorithm to send a character via UART0 at 9600 baud given a peripheral clock frequency of 60 MHz.","ans":{"s":"UART0 TX=P0.0 (function 01), 8N1, DLAB during setup. At PCLK=60 MHz choose DLL=391 mod 256=135, DLM=1, FDR=0x10. Poll THRE then write THR.","m":"For 9600 baud, D=60 MHz/(16×9600)=390.625. Use divisor 391, yielding about 9590.79 baud (−0.096%). Set 8N1, write DLL=0x87/DLM=0x01 with DLAB=1, use U0FDR=0x10 for no fractional adjustment, clear DLAB, then wait for U0LSR bit 5 and write U0THR.","d":"UART0 combines a baud-rate generator, transmitter/receiver shift registers, FIFOs, line-control/status and interrupt logic. U0LCR controls framing and DLAB, U0DLL/DLM are the integer divisor latches, and U0FDR controls the fractional factor. U0THR loads transmit data; U0RBR reads received data. Select TXD0 on P0.0 with PINSEL0 field 01, optionally RXD0 on P0.1 with field 01, and set 8N1 (LCR 0x03). Baud = PCLK/[16·(256·DLM+DLL)·(1+DIVADDVAL/MULVAL)]. Choose D=391 for 9590.79 baud at PCLK=60 MHz. Write 0x83 to U0LCR to enable DLAB while setting divisors, then 0x03 to restore normal operation. Enable/reset FIFOs once and transmit after U0LSR.THRE becomes set. If waiting for the final stop bit before changing line direction, poll TEMT bit 6 instead.","code":{"lang":"pseudocode","s":"Route TXD0 → set 8N1 and divisor 391 → wait THRE → write byte","m":"Select P0.0 as TXD0\nSet DLAB and 8N1\nDLM ← 1; DLL ← 0x87; FDR ← 0x10\nClear DLAB\nWait until LSR.THRE = 1\nTHR ← character","d":"Require PCLK = 60 MHz and UART0 enabled\nPINSEL0[1:0] ← 01₂             // P0.0 as TXD0, preserve other pins\nU0LCR ← 0x83                  // DLAB=1, 8 data bits, 1 stop, no parity\nU0DLM ← 0x01                  // divisor high byte\nU0DLL ← 0x87                  // divisor low byte, total = 391\nU0FDR ← 0x10                  // MULVAL=1, DIVADDVAL=0\nU0LCR ← 0x03                  // DLAB=0, THR now accessible\nU0FCR ← 0x07                  // enable FIFO, clear RX and TX FIFOs once\nwhile (U0LSR & 0x20) == 0: wait  // THRE\nU0THR ← character"}}},{"id":"mca-u5-q3","subject":"mca","unit":5,"number":3,"q":"List the specifications of the 10-bit ADC in the LPC2148, describe any two of its control or data registers, and explain how input channel selection works.","ans":{"s":"LPC2148 has two 10-bit SAR ADCs and up to 14 analogue inputs. ADxCR selects channels, clock and start; ADxDRn reports result and DONE.","m":"Use PINSEL to connect the analogue input, then ADxCR.SEL to enable its channel, ADxCR.CLKDIV so fADC≤4.5 MHz, ADxCR.PDN=1 and an appropriate START selection. Wait for DONE in ADxDRn and read result bits [15:6].","d":"LPC2148 ADC0 and ADC1 are 10-bit successive-approximation converters with up to 14 available analogue inputs across the device. A conversion can be as short as about 2.44 µs at maximum ADC clock. Inputs are single-ended and the conversion range is set by the reference and analogue ground. ADxCR uses SEL[7:0] for a channel mask, CLKDIV[15:8] with fADC=PCLK/(CLKDIV+1), BURST for repetitive scanning, PDN to enable operation and START to choose a start event. ADxDRn provides DONE at bit 31, OVERRUN at bit 30 and conversion result at bits 15:6. Configure PINSEL for ADx.n, select a single bit for an immediate software-triggered conversion, then read the corresponding result register. For auto-scanning use the documented burst mode and read each selected channel’s own data register."}},{"id":"mca-u5-q4","subject":"mca","unit":5,"number":4,"q":"Highlight the features of the LPC2148 ADC and draw a circuit diagram showing how to measure ambient temperature and display it on an LCD.","ans":{"s":"TMP36 → AD0.1 (P0.28) → LPC2148 → character LCD. T(°C) ≈ (Vout−0.500 V)/0.010 V per °C.","m":"Power a TMP36 from 3.3 V with bypassing and common ground. Route its output to P0.28/AD0.1; configure PINSEL and the ADC, then convert the 10-bit result to voltage. Display the computed temperature through an LCD data/control interface with compatible logic levels.","d":"Wire TMP36 +VS → 3.3 V, GND → analogue ground and VOUT → P0.28/AD0.1. Bypass supply close to the sensor and use a clean, measured ADC reference. Use common grounds. Attach LCD in write-only four-bit mode: four GPIOs → D4–D7, two GPIOs → RS and E, R/W → GND, and configure contrast/power as specified by the display. Use level translation if its input thresholds are incompatible with 3.3 V. LPC2148's 10-bit SAR ADC uses AD0CR.DIV to keep fADC≤4.5 MHz. Select channel 1, start, wait for DONE and extract N = (AD0DR1 >> 6) & 1023. Estimate Vout ≈ N·VREF/1024 and compute °C ≈ (Vout−0.500)/0.010 for a TMP36. At VREF=3.30 V and 25 °C expect roughly 0.750 V, about 233 counts. Initialize the LCD, format the converted value and update at a modest rate."}},{"id":"mca-u5-q5","subject":"mca","unit":5,"number":5,"q":"Summarize the key characteristics and operation of the Digital-to-Analog Converter integrated into the LPC2148.","ans":{"s":"10-bit DAC on P0.25/AOUT. Write 0–1023 into DACR[15:6]. VOUT ≈ VREF×code/1024; BIAS trades speed for current.","m":"Set PINSEL1 for AOUT on P0.25. DACR.VALUE is bits 15:6; bit 16 selects the bias/settling mode. DAC code 0 gives approximately 0 V, and 1023 gives roughly one LSB below VREF.","d":"The LPC2148 integrates a 10-bit voltage-output DAC. Set P0.25 to its AOUT function using PINSEL1[19:18]=10₂. Write `(value & 0x3FF) \u003c\u003c 6` to DACR, plus the desired setting of BIAS bit 16. For an ideal transfer VOUT=VREF·value/1024; for VREF=3.3 V, one step is about 3.22 mV and code 512 gives ≈1.65 V. BIAS=0 selects faster settling (1 µs maximum specified setting), while BIAS=1 reduces current with a slower settling specification (2.5 µs). Meet reference, output loading and settling requirements. Updating the value at uniform intervals produces a digitally sampled waveform."}},{"id":"mca-u5-q6","subject":"mca","unit":5,"number":6,"q":"Write an Embedded C program utilizing the LPC2148's internal DAC to generate a staircase waveform.","ans":{"s":"P0.25 = AOUT. Send 10-bit values to DACR[15:6], step up, then wrap.","m":"Select AOUT at P0.25 with PINSEL1[19:18] = 10. DACR = code \u003c\u003c 6 for 10-bit codes. Update every 50 µs using the timer; send 0, 64, …, 960, 1023 and then wrap to 0.","d":"P0.25 is multiplexed as AOUT when PINSEL1[19:18] is set to 10. DACR VALUE occupies bits 15:6 and the BIAS bit is 16. BIAS = 0 is used here. The ideal output is code × VREF/1024, so even 1023 is slightly below VREF. With 12 MHz processor and peripheral clocks, Timer 0 PR = 11 and MR0 = 50 provide 50 µs update spacing. Use steps of 64 codes and fin
