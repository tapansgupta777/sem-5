ore rotations and representation changes under an area, wirelength, aspect-ratio and congestion cost.\nPlacement methods include min-cut recursion, in which graph partitions map into smaller regions, analytical optimization with wirelength and density objectives, force-directed spreading and annealing moves. After global coordinates, legalize into row sites and refine local order. Floorplanning avoids large-scale routing bottlenecks. Placement improves local connectivity and timing within that space."}},{"id":"asic-u2-q11","subject":"asic","unit":2,"number":11,"q":"Compare constructive and iterative improvement partitioning techniques.","ans":{"s":"Constructive methods build a partition from scratch. Iterative methods improve one through moves or swaps.","m":"Constructive methods assign unplaced vertices by connectivity, seeds or clustering and produce an initial partition quickly. Iterative methods start with a full partition and reduce cut cost through feasible moves or exchanges. A common workflow uses both.","d":"Constructive partitioning starts with empty sets, selected seeds or coarse clusters and assigns unplaced vertices using connectivity and capacity heuristics. Greedy region growing and clustering are examples. It tends to be quick and yields a feasible start, though early decisions can limit cut quality.\nIterative improvement begins with a complete solution and repeatedly evaluates gains for moving vertices or exchanging them. Kernighan–Lin swaps pairs, and Fiduccia–Mattheyses uses individual moves with balance checks. Pass-based methods can examine temporary negative moves and retain a best improving prefix. Quality can depend on the starting partition and stopping rule. Modern multilevel methods coarsen first, compute an initial solution, then refine it at increasing resolution."}},{"id":"asic-u2-q12","subject":"asic","unit":2,"number":12,"q":"Explain the differences between floor planning and placement. Also discuss design-style-specific issues in floor planning and placement.","ans":{"s":"Floorplanning places major blocks and reserves resources. Placement fits small cells to that structure. The movable elements depend on the design style.","m":"Floorplanning chooses size, macros, pin regions and blockages. Placement positions cells to satisfy timing, density and legal sites. Standard-cell rows, gate-array routing channels, custom matching and fixed FPGA sites impose different constraints.","d":"Floorplanning works at die/core and macro scale. It defines dimensions, macro arrangements, I/O, rows, power reservations and blockages. Placement works at cell scale, finding coordinates and legal row sites to reduce wirelength, congestion and timing cost. An unrouteable placement can trigger an updated floorplan.\nIn standard-cell designs, compatible row/site, rail orientation, macro pin access and routing corridors matter. A channelled gate array fixes both base positions and dedicated channel capacity. Channel-less arrays can use over-the-cell routing. Full-custom or mixed-signal work can require device orientation, symmetry, matching and analog isolation. In an FPGA, fixed CLB, clock, DSP, memory and pin resources constrain both regions and exact placement."}},{"id":"asic-u2-q13","subject":"asic","unit":2,"number":13,"q":"What do you mean by Placement? List the algorithm used for the Placement. Explain any one in detail.","ans":{"s":"Placement assigns legal cell sites. Algorithms include analytical, recursive partitioning, annealing and force-directed methods.","m":"Placement locates cells to reduce wirelength, timing cost and congestion. Global placement estimates coordinates, legalization fits cells into legal sites and detailed placement refines local positions. Analytical methods optimize smooth wirelength and density objectives.","d":"In ASIC placement, choose x–y coordinates and allowed orientations for cells while respecting rows, sites, blockages, cell overlaps, region and technology rules. Representative algorithms are analytical/quadratic, electrostatic, min-cut recursive partitioning, simulated annealing and force-directed placement.\nAnalytical placement minimizes a continuous approximation to wirelength plus a density penalty. A solver moves instances toward connected pins while spreading cells out of overfull bins. Timing weights and congestion estimates can be added. Global placement may permit overlap temporarily. Legalization snaps cells into valid unoccupied sites with limited displacement. Detailed placement applies local shifts or swaps to improve the cost while maintaining legality."}}]},{"title":"Routing and Clocking","questions":[{"id":"asic-u3-q1","subject":"asic","unit":3,"number":1,"q":"Explain Static Timing Analysis (STA). Describe setup and hold checks, timing paths and the concept of slack. Discuss the steps involved in timing closure.","ans":{"s":"STA propagates path delay without test vectors. Setup checks latest arrival. Hold checks earliest arrival. Positive slack meets the constraint.","m":"Build a timing graph with library, constraints and parasitics. Check input-to-register, register-to-register, register-to-output and combinational I/O paths. Setup slack = required latest − latest arrival. Hold slack = earliest arrival − required earliest. Fix negative slack and recheck all corners.","d":"STA computes arrival/required times over a timing graph using a netlist, Liberty cell timing, clock/I/O constraints and interconnect RC. Typical paths are input→register, register→register, register→output and input→output. For a single-clock register path, let skew S = capture arrival − launch arrival and use one period T.\nSetup: slack ≈ T + S − tsetup − Usetup − (tCQ,max + tdata,max). Hold: slack ≈ tCQ,min + tdata,min − (thold + S + Uhold). Include appropriate clock edge relationships, clock variation and delay corners in signoff. Positive skew generally helps setup and hurts hold.\nConstrain all clocks, generated clocks and I/O. Check exceptions and unconstrained paths. Examine WNS (worst negative slack) and TNS (sum of violating endpoint slacks). Fix setup by faster/sized cells, logic restructuring or shortening long nets. Fix hold by inserting delay on fast paths or adjusting clock paths. Re-extract and recheck all relevant modes/corners after changes."}},{"id":"asic-u3-q2","subject":"asic","unit":3,"number":2,"q":"Define Clock Skew, Jitter, Setup Time, Hold Time and Clock-to-Q delay. Explain their causes and impact on circuit performance.","ans":{"s":"Skew is edge time difference across sinks. Jitter is variation over successive edges. Setup/hold straddle capture. tCQ is launch clock-to-output delay.","m":"Skew arises from unequal tree delay and variation across sinks. Clock jitter reduces timing margin through edge uncertainty. Setup requires stable data before capture and hold requires stability after capture. Clock-to-Q sets when new data leaves the launching flip-flop.","d":"Clock skew is the timing difference between related edges arriving at two locations, caused by unequal routing, load, buffering or spatial variation. Positive capture-minus-launch skew can increase setup margin and consume hold margin. Clock jitter is temporal displacement of an edge from its ideal position due to PLL phase noise, interference or supply noise. Its impact is modeled as timing uncertainty with attention to correlation.\nSetup time is the minimum stable-data interval before capture. Hold time is the minimum interval after capture. Violation risks a wrong capture or metastability. Clock-to-Q is time from an active clock edge to the register output response. Latest clock-to-Q contributes to setup timing; earliest clock-to-Q contributes to hold timing. The cell timing library characterizes these quantities with slew/load and operating conditions."}},{"id":"asic-u3-q3","subject":"asic","unit":3,"number":3,"q":"Explain the different types of routing used in ASIC design. Describe the grid models used for routing.","ans":{"s":"Global routing allocates coarse corridors. Detailed routing assigns tracks and vias. Use uniform, nonuniform or gridless geometry on routing layers.","m":"ASIC routing can be classified by stage (global and detailed), function (signal, clock, power and ground), or region (channel, switchbox and over-the-cell). Global routing commonly models G-cell and via capacities. Detailed routing uses track/intersection and rule constraints or gridless geometry.","d":"Global routing partitions the layout into coarse global cells. Graph edges model track/via capacities, blockage and preferred direction. It chooses per-net corridors and layer transitions with congestion awareness. Detailed routing assigns exact tracks, wire lengths, vias and pin access, and repairs design-rule conflicts. Special routing handles power/ground, high-fanout clocks or constrained signals.\nA uniform grid places vertices at equal pitch; a nonuniform grid can align routing lines with pins and blockages. A 3-D graph represents horizontal and vertical moves on available layers and legal vias between layers. Gridless/shape-based routing uses allowed geometric positions instead of one regular grid, while honoring process restrictions. Channels have terminals mainly on two opposite boundaries; switchboxes can have terminals on all four."}},{"id":"asic-u3-q4","subject":"asic","unit":3,"number":4,"q":"Explain Lee's maze routing algorithm (wave propagation and back-trace). State its advantages and limitations.","ans":{"s":"Lee = BFS wavefront from source. Backtrace from target through decreasing distances. Finds a shortest equal-cost grid route.","m":"Label the source 0, enqueue traversable unvisited neighbors and label by increasing distance. On reaching the target, step backward from label k to a neighboring label k−1 until the source. BFS is complete and shortest for unit moves, with potentially large time and memory use.","d":"Initialize a routing grid: mark existing wires or keep-outs as blocked, label source 0 and enqueue it. Pop in FIFO order and explore legal north/south/east/west neighbors. Mark each new cell with parent and distance d+1. The first target visit gives its minimum step count. Backtrace via parents or decreasing labels and record the path. If the queue empties, no allowed route exists in this grid.\nLee routing is complete for the model and finds a shortest unit-cost path, often among many equally short choices. Its worst-case storage and work are linear in the explored grid size, which can be large. Standard BFS treats steps equally, so different via costs or congestion calls for weighted routing such as Dijkstra. Multi-net routing may require rerouting existing nets.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Lee router example showing wave distances and shortest backtrace\" viewBox=\"0 0 720 200\">\u003crect width=\"720\" height=\"200\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cpath d=\"M233 20h200v160H233z M273 20v160 M313 20v160 M353 20v160 M393 20v160 M233 60h200 M233 100h200 M233 140h200\" stroke=\"#697f9f\" fill=\"none\"/>\n\u003cpath d=\"M253 40H333V80H413V160\" stroke=\"#78e4cf\" fill=\"none\" stroke-width=\"3\"/>\u003cpath d=\"M273 60h40v40h-40z M273 100h40v40h-40z M353 100h40v40h-40z\" fill=\"#563344\"/>\n\u003cg text-anchor=\"middle\" fill=\"#e2ebff\">\n\u003ctext x=\"253\" y=\"45\">S\u003c/text>\u003ctext x=\"293\" y=\"45\">1\u003c/text>\u003ctext x=\"333\" y=\"45\">2\u003c/text>\u003ctext x=\"373\" y=\"45\">3\u003c/text>\u003ctext x=\"413\" y=\"45\">4\u003c/text>\n\u003ctext x=\"253\" y=\"85\">1\u003c/text>\u003ctext x=\"293\" y=\"85\">×\u003c/text>\u003ctext x=\"333\" y=\"85\">3\u003c/text>\u003ctext x=\"373\" y=\"85\">4\u003c/text>\u003ctext x=\"413\" y=\"85\">5\u003c/text>\n\u003ctext x=\"253\" y=\"125\">2\u003c/text>\u003ctext x=\"293\" y=\"125\">×\u003c/text>\u003ctext x=\"333\" y=\"125\">4\u003c/text>\u003ctext x=\"373\" y=\"125\">×\u003c/text>\u003ctext x=\"413\" y=\"125\">6\u003c/text>\n\u003ctext x=\"253\" y=\"165\">3\u003c/text>\u003ctext x=\"293\" y=\"165\">4\u003c/text>\u003ctext x=\"333\" y=\"165\">5\u003c/text>\u003ctext x=\"373\" y=\"165\">6\u003c/text>\u003ctext x=\"413\" y=\"165\">T\u003c/text>\u003c/g>\n\u003ctext x=\"26\" y=\"51\">S = source at distance 0\u003c/text>\u003ctext x=\"26\" y=\"74\">T = target at distance 7\u003c/text>\u003ctext x=\"26\" y=\"97\">× = blocked cell\u003c/text>\u003ctext x=\"462\" y=\"51\">Trace 7 → 6 → … → 0.\u003c/text>\u003ctext x=\"462\" y=\"74\">Multiple shortest paths can exist.\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u3-q5","subject":"asic","unit":3,"number":5,"q":"Explain Clock Design and Clock Routing in ASIC design, with the importance of clock distribution.","ans":{"s":"Select topology and clock targets, build buffered paths, route using controlled layers, then verify skew, latency, slew and timing.","m":"Clock design sets the source and generated clocks, sink groups, skew/latency targets and timing uncertainty. CTS places and sizes buffers, then special routing shields or widens critical trunks as needed. Verify extracted timing, skew, pulse width and clock power.","d":"The clock network connects PLL or input clock to registers, gated branches and macro pins. Define clock periods, clock waveforms, generated clock relations, uncertainty, transition and load limits. Account for clock gating, test modes and block interfaces. CTS clusters sinks, chooses a topology and places/sizes buffers or inverters to meet skew, insertion delay, fanout and slew targets.\nRoute trunks on suitable low-resistance layers. Apply wider wires, increased spacing or shielding if needed, and choose reliable vias. After extraction, check arrival spread, slew, latency, duty cycle, pulse width, signal integrity and setup/hold across corners. Repair with resizing, routing changes or useful skew where justified. Clock switching is frequent, so excess buffers and wire capacitance increase power."}},{"id":"asic-u3-q6","subject":"asic","unit":3,"number":6,"q":"Explain H-tree, balanced tree, clock mesh/grid and spine clock distribution topologies with proper diagrams.","ans":{"s":"H-tree uses symmetric equal lengths. Balanced buffered tree adapts to sink/load distribution. Mesh averages via multiple paths. Spine feeds branches from a trunk.","m":"H-tree gives geometric symmetry for regular dies. A balanced tree tunes wire and buffer delay for nonuniform sinks. A mesh cross-connects many paths and resists local variation at substantial power/area. A spine is a long backbone with local taps for elongated chips or regions.","d":"H-tree: recursively branch from the center into symmetric H shapes, making ideal leaf path lengths equal. Load or routing asymmetry still causes skew. Balanced tree: group actual sinks, then adjust branch geometry, buffer depth and sizes for similar delay, or purposeful skew under timing constraints. This is convenient for irregular standard-cell layouts.\nMesh/grid: drive an interconnected wire grid through matched drivers. Each sink taps a nearby grid point, with multiple paths mitigating local variations. Wiring and switching overhead are large and driver timing/current must be controlled. Spine: run one or more strong central trunks and tap local branches. It is simple for elongated blocks but trunk delay and distributed loading can cause arrival gradients.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"H-tree, balanced buffered tree, clock mesh and spine\" viewBox=\"0 0 760 180\">\u003crect width=\"760\" height=\"180\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cg fill=\"#1b2234\" stroke=\"#5b7195\">\u003crect x=\"16\" y=\"17\" width=\"169\" height=\"147\" rx=\"6\"/>\u003crect x=\"201\" y=\"17\" width=\"169\" height=\"147\" rx=\"6\"/>\u003crect x=\"386\" y=\"17\" width=\"169\" height=\"147\" rx=\"6\"/>\u003crect x=\"571\" y=\"17\" width=\"169\" height=\"147\" rx=\"6\"/>\u003c/g>\n\u003cg text-anchor=\"middle\">\u003ctext x=\"100\" y=\"145\">H-tree\u003c/text>\u003ctext x=\"285\" y=\"145\">Balanced tree\u003c/text>\u003ctext x=\"470\" y=\"145\">Mesh / grid\u003c/text>\u003ctext x=\"655\" y=\"145\">Spine\u003c/text>\u003c/g>\n\u003cg fill=\"none\" stroke=\"#83ead4\" stroke-width=\"2\">\u003cpath d=\"M49 56v59M151 56v59M49 86h102\"/>\u003cpath d=\"M285 44v14m-34 0h68m-68 0v24m68-24v24m-50 0h-36m66 0h40m-106 0v29m36-29v29m30-29v29m40-29v29\"/>\u003cpath d=\"M425 54h90m-90 28h90m-90 28h90m-80-65v74m35-74v74m35-74v74\"/>\u003cpath d=\"M598 83h114m-95 0V49m20 34v32m22-32V49m20 34v32m19-32V49\"/>\u003c/g>\u003cg fill=\"#f4d894\">\u003ccircle cx=\"100\" cy=\"86\" r=\"4\"/>\u003ccircle cx=\"49\" cy=\"56\" r=\"3\"/>\u003ccircle cx=\"151\" cy=\"56\" r=\"3\"/>\u003ccircle cx=\"49\" cy=\"115\" r=\"3\"/>\u003ccircle cx=\"151\" cy=\"115\" r=\"3\"/>\u003ccircle cx=\"285\" cy=\"44\" r=\"4\"/>\u003ccircle cx=\"251\" cy=\"58\" r=\"3\"/>\u003ccircle cx=\"319\" cy=\"58\" r=\"3\"/>\u003ccircle cx=\"470\" cy=\"82\" r=\"4\"/>\u003ccircle cx=\"598\" cy=\"83\" r=\"4\"/>\u003c/g>\u003c/g>\u003c/svg>"}},{"id":"asic-u3-q7","subject":"asic","unit":3,"number":7,"q":"Explain Power and Ground Routing in ASIC design.","ans":{"s":"Pads/bumps → upper metal rings and straps/mesh → vias → local rails. Check IR drop, EM and connectivity.","m":"Route VDD and VSS using thick/wide upper metals with parallel straps or meshes, multiple via cuts and local cell rails. Place macro power taps, switch domains and decoupling where needed. Verify static/dynamic IR drop, electromigration, shorts and opens.","d":"Estimate currents and voltage budgets per domain. Connect package bumps or pads to on-chip rings or global straps. Upper-layer orthogonal VDD/VSS straps form a mesh and via stacks connect to lower layers and standard-cell rails. Connect macro power pins with adequate wire and via capacity and preserve separate switched/always-on domains. Ground forms the return path, and supply/return resistances both affect available voltage.\nUse wire width, pitch, layer thickness and via counts to meet resistance/current requirements. Analyze static IR, transient droop, simultaneous switching, electromigration and connectivity with package effects where modeled. Add straps, vias, feed points or decoupling and recheck routing congestion, DRC and power-domain consistency."}},{"id":"asic-u3-q8","subject":"asic","unit":3,"number":8,"q":"Explain layout compaction and its types in detail with necessary diagrams.","ans":{"s":"Compaction closes unused spacing while preserving connectivity and design rules. 1-D moves on one axis. 2-D couples or alternates x/y moves.","m":"Represent minimum spacing, width or enclosure as inequalities. Solve them along x or y for 1-D compaction. Combine both coordinates for 2-D compaction or alternate 1-D passes as an approximation. Shapes and connectivity must stay legal.","d":"Layout compaction reduces width, height or area by moving geometries closer while keeping connectivity, topology and fabrication rules. A 1-D pass fixes y and constrains x coordinates, or fixes x and constrains y. A constraint xⱼ−xᵢ≥dᵢⱼ can express separation or dimension. For an acyclic graph, longest distances from a fixed source give minimum feasible positions. Rigid objects, alignments and anchored pins require corresponding constraints.\nTwo-dimensional compaction considers both axes. It can reduce area beyond one horizontal or vertical pass, but choices can be coupled when objects may clear in either direction. Alternating x/y passes is practical; simultaneous optimization can use more complex constraint models. After compaction, run DRC and check connectivity.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Horizontal layout compaction preserves spacing and feature width\" viewBox=\"0 0 740 165\">\u003crect width=\"740\" height=\"165\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cg fill=\"#293a54\" stroke=\"#93b5ed\">\u003crect x=\"50\" y=\"60\" width=\"70\" height=\"40\"/>\u003crect x=\"168\" y=\"60\" width=\"57\" height=\"40\"/>\u003crect x=\"275\" y=\"60\" width=\"72\" height=\"40\"/>\u003crect x=\"464\" y=\"60\" width=\"70\" height=\"40\"/>\u003crect x=\"543\" y=\"60\" width=\"57\" height=\"40\"/>\u003crect x=\"609\" y=\"60\" width=\"72\" height=\"40\"/>\u003c/g>\n\u003cg text-anchor=\"middle\">\u003ctext x=\"200\" y=\"43\">Before x compaction\u003c/text>\u003ctext x=\"574\" y=\"43\">After x compaction\u003c/text>\u003ctext x=\"85\" y=\"85\">A\u003c/text>\u003ctext x=\"196\" y=\"85\">B\u003c/text>\u003ctext x=\"311\" y=\"85\">C\u003c/text>\u003ctext x=\"498\" y=\"85\">A\u003c/text>\u003ctext x=\"571\" y=\"85\">B\u003c/text>\u003ctext x=\"645\" y=\"85\">C\u003c/text>\u003c/g>\n\u003cpath d=\"M371 80h62m-8-5 8 5-8 5m109 23v11m9-11v11m-9-4h9m57-7v11m9-11v11m-9-4h9\" stroke=\"#83ead4\" fill=\"none\" stroke-width=\"2\"/>\n\u003ctext x=\"464\" y=\"144\">Gaps retain the required minimum spacing.\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u3-q9","subject":"asic","unit":3,"number":9,"q":"Write short notes on: (i) 1-D and 2-D compaction (ii) Constraint graph method in layout compaction iii. Constraint graph method in layout compaction","ans":{"s":"Graph edges enforce xⱼ−xᵢ≥dᵢⱼ. Longest-path coordinates compact one axis. Apply both axes for iterative 2-D compaction.","m":"1-D compaction reduces one dimension while preserving topology. 2-D compaction reduces area by considering both coordinate axes. In a constraint graph, every directed weighted edge expresses a minimum separation or fixed geometric relation after suitable modeling. A feasible longest-path solution gives compact coordinates in the usual DAG model.","d":"One-dimensional compaction moves features along one fixed axis, preserving perpendicular coordinates. Two-dimensional compaction can alternate horizontal and vertical solves or determine both together with geometric constraints. Use vertices for edges or rigid feature coordinates. An edge i→j of weight d encodes xⱼ≥xᵢ+d. Add constraints for minimum width, spacing and enclosures, plus a fixed source and boundary. For example, A→B with weight 4 and B→C with weight 3 gives earliest xB=4 and xC=7 when xA=0. Acyclic longest-path traversal solves this ordering efficiently. Positive-weight cycles in these lower-bound constraints imply infeasibility. A compact result must still preserve connectivity and pass DRC.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Horizontal layout compaction preserves spacing and feature width\" viewBox=\"0 0 740 165\">\u003crect width=\"740\" height=\"165\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cg fill=\"#293a54\" stroke=\"#93b5ed\">\u003crect x=\"50\" y=\"60\" width=\"70\" height=\"40\"/>\u003crect x=\"168\" y=\"60\" width=\"57\" height=\"40\"/>\u003crect x=\"275\" y=\"60\" width=\"72\" height=\"40\"/>\u003crect x=\"464\" y=\"60\" width=\"70\" height=\"40\"/>\u003crect x=\"543\" y=\"60\" width=\"57\" height=\"40\"/>\u003crect x=\"609\" y=\"60\" width=\"72\" height=\"40\"/>\u003c/g>\n\u003cg text-anchor=\"middle\">\u003ctext x=\"200\" y=\"43\">Before x compaction\u003c/text>\u003ctext x=\"574\" y=\"43\">After x compaction\u003c/text>\u003ctext x=\"85\" y=\"85\">A\u003c/text>\u003ctext x=\"196\" y=\"85\">B\u003c/text>\u003ctext x=\"311\" y=\"85\">C\u003c/text>\u003ctext x=\"498\" y=\"85\">A\u003c/text>\u003ctext x=\"571\" y=\"85\">B\u003c/text>\u003ctext x=\"645\" y=\"85\">C\u003c/text>\u003c/g>\n\u003cpath d=\"M371 80h62m-8-5 8 5-8 5m109 23v11m9-11v11m-9-4h9m57-7v11m9-11v11m-9-4h9\" stroke=\"#83ead4\" fill=\"none\" stroke-width=\"2\"/>\n\u003ctext x=\"464\" y=\"144\">Gaps retain the required minimum spacing.\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u3-q10","subject":"asic","unit":3,"number":10,"q":"Explain Interconnect Modeling in detail.","ans":{"s":"Short wires may use lumped C/RC. Long on-chip wires require distributed RC and coupling. Use RLC/transmission lines when inductance or flight time matters.","m":"Extract wire and via R, capacitance to reference and coupling to neighbors. Approximate a short wire by lumped load and longer wires by RC π sections or RC trees. Elmore estimates sink delay from each upstream R times its downstream C. Fast/long nets can require RLC or transmission-line modeling.","d":"Wire resistance is R≈ρL/(wt) or R□·L/w; include vias at layer changes. Extract capacitance to substrate or reference layers and coupling to adjacent conductors using geometry, layer data and process corner. A short low-resistance wire may be a lumped capacitance. Lumped RC or π approximations include total R and endpoint C. For longer interconnect, cascade RC segments or use extracted RC trees/coupling networks. Elmore first moment at a sink sums RₑCdownstream,ₑ over edges on its source path. A uniform unloaded line contributes approximately RwireCwire/2 to that moment, so the wire component scales with L².\nCoupling can cause noise and alter delay depending on aggressor transitions. Include inductance or transmission-line effects for long, fast and low-resistance lines when relevant. Extraction writes a parasitic network, commonly SPEF, for timing, signal-integrity and power analysis."}},{"id":"asic-u3-q11","subject":"asic","unit":3,"number":11,"q":"Explain layout compaction and its type in detail with necessary diagram","ans":{"s":"Compaction closes unused spacing while preserving connectivity and design rules. 1-D moves on one axis. 2-D couples or alternates x/y moves.","m":"Represent minimum spacing, width or enclosure as inequalities. Solve them along x or y for 1-D compaction. Combine both coordinates for 2-D compaction or alternate 1-D passes as an approximation. Shapes and connectivity must stay legal.","d":"Layout compaction reduces width, height or area by moving geometries closer while keeping connectivity, topology and fabrication rules. A 1-D pass fixes y and constrains x coordinates, or fixes x and constrains y. A constraint xⱼ−xᵢ≥dᵢⱼ can express separation or dimension. For an acyclic graph, longest distances from a fixed source give minimum feasible positions. Rigid objects, alignments and anchored pins require corresponding constraints.\nTwo-dimensional compaction considers both axes. It can reduce area beyond one horizontal or vertical pass, but choices can be coupled when objects may clear in either direction. Alternating x/y passes is practical; simultaneous optimization can use more complex constraint models. After compaction, run DRC and check connectivity.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Horizontal layout compaction preserves spacing and feature width\" viewBox=\"0 0 740 165\">\u003crect width=\"740\" height=\"165\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cg fill=\"#293a54\" stroke=\"#93b5ed\">\u003crect x=\"50\" y=\"60\" width=\"70\" height=\"40\"/>\u003crect x=\"168\" y=\"60\" width=\"57\" height=\"40\"/>\u003crect x=\"275\" y=\"60\" width=\"72\" height=\"40\"/>\u003crect x=\"464\" y=\"60\" width=\"70\" height=\"40\"/>\u003crect x=\"543\" y=\"60\" width=\"57\" height=\"40\"/>\u003crect x=\"609\" y=\"60\" width=\"72\" height=\"40\"/>\u003c/g>\n\u003cg text-anchor=\"middle\">\u003ctext x=\"200\" y=\"43\">Before x compaction\u003c/text>\u003ctext x=\"574\" y=\"43\">After x compaction\u003c/text>\u003ctext x=\"85\" y=\"85\">A\u003c/text>\u003ctext x=\"196\" y=\"85\">B\u003c/text>\u003ctext x=\"311\" y=\"85\">C\u003c/text>\u003ctext x=\"498\" y=\"85\">A\u003c/text>\u003ctext x=\"571\" y=\"85\">B\u003c/text>\u003ctext x=\"645\" y=\"85\">C\u003c/text>\u003c/g>\n\u003cpath d=\"M371 80h62m-8-5 8 5-8 5m109 23v11m9-11v11m-9-4h9m57-7v11m9-11v11m-9-4h9\" stroke=\"#83ead4\" fill=\"none\" stroke-width=\"2\"/>\n\u003ctext x=\"464\" y=\"144\">Gaps retain the required minimum spacing.\u003c/text>\u003c/g>\u003c/svg>"}}]},{"title":"Low Power Design Techniques","questions":[{"id":"asic-u4-q1","subject":"asic","unit":4,"number":1,"q":"Explain Clock Gating as a technique for dynamic power reduction.","ans":{"s":"Clock gating lowers clock switching activity. An ICG holds enable stable through the active clock phase.","m":"Gate the clock to an idle register bank with a library integrated clock-gating cell. A latch samples enable during the inactive clock level so the enabled clock passes whole pulses. Use a test enable and verify clock-gating setup/hold.","d":"In a positive-edge system, combine functional enable with a scan/test override, capture it in a low-level transparent latch, then AND the latched value with the clock. The latch closes during the high phase, preventing an enable transition from making a runt pulse. Gate at a suitable hierarchy so inactive clock buffers and flops stop switching; downstream logic fed by the gated registers may also toggle less.\nPsw≈αCeffVDD²f, so lowering effective clock activity or stopping branches saves dynamic power. Synthesis can infer an ICG from shared enables. CTS treats the gated branches as clock paths, and STA checks gating constraints. Measure enable duty cycle and the overhead of added gating cells. The gated domain can still leak while powered.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Glitch-free clock gating using a low-level transparent latch and an AND gate\" viewBox=\"0 0 760 167\">\u003crect width=\"760\" height=\"167\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cpath d=\"M52 52h191 M52 123h509m-389 0v-33h71m151-38h129v28h38m99 19h70\" fill=\"none\" stroke=\"#86a7dc\" stroke-width=\"2\"/>\n\u003crect x=\"243\" y=\"30\" width=\"151\" height=\"81\" rx=\"6\" fill=\"#26334a\" stroke=\"#7a93bd\"/>\u003crect x=\"561\" y=\"68\" width=\"99\" height=\"62\" rx=\"6\" fill=\"#26334a\" stroke=\"#7a93bd\"/>\n\u003ctext x=\"68\" y=\"45\">en | test_en\u003c/text>\u003ctext x=\"80\" y=\"142\">clk\u003c/text>\u003ctext x=\"318\" y=\"57\" text-anchor=\"middle\">Latch enable\u003c/text>\u003ctext x=\"318\" y=\"78\" text-anchor=\"middle\">while clk = 0\u003c/text>\u003ctext x=\"610\" y=\"103\" text-anchor=\"middle\">AND\u003c/text>\u003ctext x=\"672\" y=\"89\">gclk\u003c/text>\u003ccircle cx=\"172\" cy=\"123\" r=\"4\" fill=\"#8be3d2\"/>\u003c/g>\u003c/svg>"}},{"id":"asic-u4-q2","subject":"asic","unit":4,"number":2,"q":"Explain supply voltage reduction as a power-reduction technique. Discuss its effect on delay and the limits to voltage scaling.","ans":{"s":"Psw∝VDD². Lower voltage saves switching energy but reduces drive and increases delay. Check timing and minimum functional voltage.","m":"Reducing VDD cuts switching power approximately quadratically at fixed activity, capacitance and frequency. Reduced overdrive slows gates and may require a lower clock. SRAM retention, noise margins, PVT variation and minimum timing/functional voltage constrain scaling.","d":"With a defined 0→1 activity factor, Psw=αCLVDD²f and energy per charge event supplied by VDD is CLVDD². At fixed α, CL and f, a 10% VDD reduction gives 0.9²=0.81 times the original switching power. But tp≈CLVDD/Ion and Ion falls as VDD−VT shrinks, often sharply near threshold. Clock frequency may need to fall, reducing throughput. Leakage can change, and longer tasks may offset energy savings by accumulating static energy.\nCheck PVT timing and variability, SRAM read/write/retention minimum voltage, noise margin, analog or I/O requirements, IR droop and regulator/transient constraints. For multi-voltage domains, level shifters protect signal crossings. Characterize each approved operating point."}},{"id":"asic-u4-q3","subject":"asic","unit":4,"number":3,"q":"Explain gate-level and architecture-level techniques for low-power VLSI design with suitable examples.","ans":{"s":"Gate level: size, multi-VT, suppress glitches and gate idle clocks. Architecture: gate power, scale V/f, change datapath/memory activity.","m":"At gate level reduce unnecessary switching and capacitance with sizing, buffering, operand isolation, clock gating and balanced paths. Use high-VT cells on slack paths to reduce leakage. At architecture level apply DVFS, domain power gating and locality or parallelism to reduce work and voltage.","d":"Gate-level techniques: use clock-gating cells for groups of idle flops; force inactive functional-unit inputs to constants to prevent useless transitions; balance reconvergent paths to reduce glitches; size noncritical cells to reduce switched capacitance; use high-VT cells on paths with slack. Keep fast/low-VT cells where timing requires them.\nArchitecture-level techniques: segment power domains so idle blocks can be switched off, or apply DVFS to lower voltage/frequency under light load. Reduce memory energy with locality, smaller active banks and fewer off-chip transactions. Right-size arithmetic word widths, specialize accelerators or exploit parallelism/pipelining to meet throughput at lower VDD and clock rate, checking area and leakage overhead. For example, an image accelerator can clock-gate idle lanes and power-gate an entire pipeline between long bursts."}},{"id":"asic-u4-q4","subject":"asic","unit":4,"number":4,"q":"Explain static and dynamic power dissipation with their sources in a CMOS circuit, with mathematical equations.","ans":{"s":"Ptotal≈αCLVDD²f + Pshort-circuit + VDDIleak. Switching and short circuit are dynamic; leakage is static.","m":"Charging/discharging load capacitance gives Psw=αCLVDD²f when α counts low-to-high transitions per cycle. Brief simultaneous PMOS/NMOS conduction adds short-circuit power. Subthreshold, gate and junction leakage give roughly Pstatic=VDDIleak.","d":"Charging a capacitance C from 0 to VDD draws CVDD² from the supply. Half is stored at peak and half dissipates during charging. The stored amount dissipates in the discharge, so energy per complete charge/discharge cycle is CVDD². Across nets, Psw=ΣᵢαᵢCᵢVDD²f with αᵢ defined as expected 0→1 transitions per cycle. During input transitions both pull networks can conduct briefly, giving Psc≈VDD·Isc,avg. Count this as a transition-dependent component.\nEven with settled logic, the MOSFETs have subthreshold conduction, gate dielectric tunneling, junction leakage and field-related effects such as GIDL. For one supply, Pstatic≈VDD·Ileak,avg, with strongly state-, process-, voltage- and temperature-dependent leakage. Distinguish capacitive switching from short-circuit and static contributions when choosing a mitigation."}},{"id":"asic-u4-q5","subject":"asic","unit":4,"number":5,"q":"Explain the need for low power design in detail, with the techniques used.","ans":{"s":"Low power extends battery life, reduces heat/droop and improves reliability. Reduce activity, capacitance, voltage, frequency and leakage.","m":"Power limits mobile runtime, cooling, package current and long-term reliability. Cut switching through gating, capacitance reduction and DVFS. Cut leakage through high-VT cells or switched domains. Analyze energy per task and check thermal, timing and wake-up trade-offs.","d":"Higher dynamic power raises peak current, supply droop and thermal load. Higher leakage drains batteries on standby and can reinforce self-heating. Cooling and package power delivery may set the feasible performance even when transistors are fast enough. Power also affects lifetime and cost through current density and thermal stress.\nEstimate power by operating scenarios and budget active and standby modes. Reduce α using clock gating and operand isolation, C using cell/wire sizing and locality, and VDD or f with DVFS where deadlines allow. Apply high-VT cell selection, retention-backed power gating and process-supported reverse body bias to reduce standby leakage. Trade circuitry, power-state transition energy and delay against the expected duty cycle. Validate across activity traces, PVT and worst-case IR conditions."}},{"id":"asic-u4-q6","subject":"asic","unit":4,"number":6,"q":"Explain different techniques used to reduce dynamic power and static power in ASIC design.","ans":{"s":"Dynamic: clock/operand gating, sizing, DVFS, glitch and wire reduction. Static: high-VT, power-gating, body-bias or stacking.","m":"Dynamic power depends on α, C, VDD² and f. Reduce switching activity, effective capacitance, supply or frequency, while controlling glitches and short-circuit current. Static power depends on leakage. Use high-VT cells, sleep switches and suitable body bias on idle or noncritical regions.","d":"To reduce dynamic power, clock-gate inactive registers, isolate unused operands, remove glitches, reduce load and interconnect capacitance, and apply voltage/frequency scaling to feasible domains. Optimize slew and cell sizing to balance short-circuit current, switching and timing. Memory banking and reduced data movement also reduce toggles.\nTo reduce static power, put high-VT devices or cells on paths with slack, power-gate sufficiently long idle blocks, use process-supported reverse body bias and select low-leakage states where appropriate. Check that power-gated outputs are isolated and needed states are retained. A technique can help one component while increasing another: adding clock-gating or retention logic introduces area and leakage, and lowering frequency can extend execution time."}},{"id":"asic-u4-q7","subject":"asic","unit":4,"number":7,"q":"Explain different leakage reduction techniques.","ans":{"s":"Use high-VT cells, power gating, reverse body bias where supported, and leakage-conscious sizing or input states.","m":"Use multi-VT assignment, switch off idle domains, apply reverse body bias where feasible, and exploit reduced leakage through off-transistor stacking. Validate timing, inrush, retention, isolation and temperature.","d":"High-VT cells reduce subthreshold leakage and are assigned where slack permits. Longer-channel devices or smaller widths may reduce leakage in noncritical logic, with speed or area trade-offs. Stacked off transistors reduce effective VGS and drain-induced barrier lowering in some states; input-vector control can use favorable standby states. Reverse body bias raises effective threshold in supported processes but may introduce junction effects or have limited benefit.\nPower gating inserts header or footer switches to disconnect idle domains from a rail. Provide isolation, optional retention, controlled power-up and sufficient switch sizing for active IR drop. Check inrush, wake-up delay and state-loss implications. Co-optimize temperature and practical low-power mode residency because transition energy reduces the benefit for brief idle times."}},{"id":"asic-u4-q8","subject":"asic","unit":4,"number":8,"q":"Discuss the Dynamic Voltage and Frequency Scaling (DVFS) technique for low power ASIC design.","ans":{"s":"DVFS selects characterized voltage/frequency points. Increase voltage before frequency; lower frequency before voltage.","m":"Use workload, performance and temperature feedback to select an operating point. At light load, reduce frequency and then VDD. At high load, raise and stabilize VDD before increasing clock rate. Respect timing and transition costs.","d":"Dynamic voltage and frequency scaling (DVFS) adjusts a domain to a characterized operating performance point (OPP) using a regulator and a programmable clock generator or divider. Performance counters, deadlines or thermal feedback can choose the lowest OPP meeting current throughput. Dynamic power drops linearly with frequency at fixed VDD and quadratically with VDD at fixed frequency. Lower frequency can lengthen task time, so evaluate total task energy including leakage and overhead.\nFor an upward transition, request the higher voltage, wait for supply readiness, then increase frequency. For downward, lower frequency before lowering VDD. Synchronize clock and reset changes, observe PLL/regulator latency, and apply hysteresis or minimum residence time. Check level shifters, memory Vmin and worst-case delay. DVFS is normally used alongside clock and power gating."}},{"id":"asic-u4-q9","subject":"asic","unit":4,"number":9,"q":"What is Unified Power Format (UPF)? Explain its role and key commands used in low power synthesis.","ans":{"s":"UPF (IEEE 1801) specifies domains, supplies, switches, voltage states, isolation, retention and level shifting.","m":"UPF expresses power intent alongside RTL. It tells synthesis and implementation where to insert switches, isolation, retention and level-shifter cells, and tells verification how powered-off or voltage-crossing logic behaves. Key commands include create_power_domain, set_isolation, set_retention and set_level_shifter.","d":"Unified Power Format is the IEEE 1801 power-intent language used alongside HDL. create_power_domain groups logic instances. create_supply_port, create_supply_net, create_supply_set and connectivity commands describe supplies. create_power_switch describes rail switching and control. set_isolation defines the clamp strategy at boundaries. set_level_shifter handles voltage crossings, set_retention identifies state to preserve, and add_power_state records legal supply/domain states.\nPower-aware synthesis maps strategies to suitable library cells, and physical implementation places, powers and connects them. Verification models loss of state, isolation, save/restore and transitions, and checks signals and states against the intent. The fragment assumes an enclosing design supplies the parent rail and control signals. A complete file also binds domain supplies and adds state definitions appropriate to the tool and UPF version.","fig":null,"code":{"lang":"UPF / Tcl","s":"Define switchable domain → bind its supplies\nDefine legal power states → provide switch control\nClamp outgoing signals while off → retain selected state\nShift voltage levels at domain crossings","m":"create_power_domain PD_DSP -elements {u_dsp}\nset_isolation ISO_DSP -domain PD_DSP -applies_to outputs \\\n    -clamp_value 0 -isolation_signal iso_dsp \\\n    -isolation_sense high -location parent","d":"# Example strategy fragment. The parent supply and controls\n# are provided by the enclosing SoC power intent.\ncreate_power_domain PD_DSP -elements {u_dsp}\ncreate_supply_net VDD_DSP_SW -domain PD_DSP\ncreate_power_switch SW_DSP -domain PD_DSP \\\n    -input_supply_port {VIN VDD_AON} \\\n    -output_supply_port {VOUT VDD_DSP_SW} \\\n    -control_port {EN dsp_on} \\\n    -on_state {ON VIN {EN}}\n\n# A high iso_dsp clamps this domain's outputs to 0.\nset_isolation ISO_DSP -domain PD_DSP -applies_to outputs \\\n    -clamp_value 0 -isolation_signal iso_dsp \\\n    -isolation_sense high -location parent\n\n# Complete intent with supply-set associations, retention,\n# voltage crossing strategies and legal power states."}}},{"id":"asic-u4-q10","subject":"asic","unit":4,"number":10,"q":"Explain clock gating and supply voltage reduction techniques in detail. How do these techniques help in reducing power consumption in ASIC circuits?","ans":{"s":"Clock gating reduces activity α in idle branches. Voltage scaling reduces energy per toggle by VDD² and costs timing margin.","m":"Clock gating pauses full clock pulses to idle storage through an integrated gating latch. Supply scaling reduces energy per transition using a lower VDD, but clock rate and minimum functional voltage must be respected. The methods can be combined.","d":"In clock gating, a low-phase latch holds enable through the active clock phase, and an AND gate emits full positive pulses only for enabled cycles. An integrated gating cell usually provides a test override. This suppresses clock-tree and flop switching for an idle cluster. Check gating timing, area overhead and duty cycle.\nVoltage reduction cuts Psw=αCLVDD²f. For example, moving from 1.0 V to 0.8 V at fixed α, CL and f gives 64% of the prior switching power. Smaller overdrive slows the circuit, so characterize timing, memory Vmin and variation at each voltage and lower frequency if needed. Clock gating reduces α, while voltage scaling reduces the energy spent on each active switch.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Glitch-free clock gating using a low-level transparent latch and an AND gate\" viewBox=\"0 0 760 167\">\u003crect width=\"760\" height=\"167\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cpath d=\"M52 52h191 M52 123h509m-389 0v-33h71m151-38h129v28h38m99 19h70\" fill=\"none\" stroke=\"#86a7dc\" stroke-width=\"2\"/>\n\u003crect x=\"243\" y=\"30\" width=\"151\" height=\"81\" rx=\"6\" fill=\"#26334a\" stroke=\"#7a93bd\"/>\u003crect x=\"561\" y=\"68\" width=\"99\" height=\"62\" rx=\"6\" fill=\"#26334a\" stroke=\"#7a93bd\"/>\n\u003ctext x=\"68\" y=\"45\">en | test_en\u003c/text>\u003ctext x=\"80\" y=\"142\">clk\u003c/text>\u003ctext x=\"318\" y=\"57\" text-anchor=\"middle\">Latch enable\u003c/text>\u003ctext x=\"318\" y=\"78\" text-anchor=\"middle\">while clk = 0\u003c/text>\u003ctext x=\"610\" y=\"103\" text-anchor=\"middle\">AND\u003c/text>\u003ctext x=\"672\" y=\"89\">gclk\u003c/text>\u003ccircle cx=\"172\" cy=\"123\" r=\"4\" fill=\"#8be3d2\"/>\u003c/g>\u003c/svg>"}},{"id":"asic-u4-q11","subject":"asic","unit":4,"number":11,"q":"Explain gate-level and architecture-level techniques for low-power VLSI design with suitable examples.","ans":{"s":"Gate level: size, multi-VT, suppress glitches and gate idle clocks. Architecture: gate power, scale V/f, change datapath/memory activity.","m":"At gate level reduce unnecessary switching and capacitance with sizing, buffering, operand isolation, clock gating and balanced paths. Use high-VT cells on slack paths to reduce leakage. At architecture level apply DVFS, domain power gating and locality or parallelism to reduce work and voltage.","d":"Gate-level techniques: use clock-gating cells for groups of idle flops; force inactive functional-unit inputs to constants to prevent useless transitions; balance reconvergent paths to reduce glitches; size noncritical cells to reduce switched capacitance; use high-VT cells on paths with slack. Keep fast/low-VT cells where timing requires them.\nArchitecture-level techniques: segment power domains so idle blocks can be switched off, or apply DVFS to lower voltage/frequency under light load. Reduce memory energy with locality, smaller active banks and fewer off-chip transactions. Right-size arithmetic word widths, specialize accelerators or exploit parallelism/pipelining to meet throughput at lower VDD and clock rate, checking area and leakage overhead. For example, an image accelerator can clock-gate idle lanes and power-gate an entire pipeline between long bursts."}},{"id":"asic-u4-q12","subject":"asic","unit":4,"number":12,"q":"Explain architecture level low power techniques.","ans":{"s":"Architecture techniques include DVFS, power/clock domains, locality, memory banking, parallelism and right-sized datapaths.","m":"Partition into domains to gate idle units. Use DVFS according to workload, optimize memory traffic, narrow unnecessary datapaths and use parallelism or pipelining to retain throughput at lower voltage where feasible.","d":"Use workload-driven architecture decisions. An accelerator or smaller datapath width reduces operations or capacitance for a repeated task. Bank memory, reuse data in local buffers and minimize off-chip transactions. Request-based clock gating stops idle units, and power gating turns off domains during longer idle periods, with isolation, wake-up and retention as required.\nDVFS selects the lowest viable characterized operating point for the active workload. Parallel lanes or pipeline stages can achieve a required throughput at lower clock frequency and possibly lower supply, with an overhead in registers, area and leakage. Examples include a video processor turning off spare decode lanes on a low-resolution stream, or a controller using an always-on wake block while its application processor sleeps."}},{"id":"asic-u4-q13","subject":"asic","unit":4,"number":13,"q":"Explain supply voltage reduction as a technique for power reduction. Discuss its effect on delay and the limits to voltage scaling.","ans":{"s":"Psw∝VDD². Lower voltage saves switching energy but reduces drive and increases delay. Check timing and minimum functional voltage.","m":"Reducing VDD cuts switching power approximately quadratically at fixed activity, capacitance and frequency. Reduced overdrive slows gates and may require a lower clock. SRAM retention, noise margins, PVT variation and minimum timing/functional voltage constrain scaling.","d":"With a defined 0→1 activity factor, Psw=αCLVDD²f and energy per charge event supplied by VDD is CLVDD². At fixed α, CL and f, a 10% VDD reduction gives 0.9²=0.81 times the original switching power. But tp≈CLVDD/Ion and Ion falls as VDD−VT shrinks, often sharply near threshold. Clock frequency may need to fall, reducing throughput. Leakage can change, and longer tasks may offset energy savings by accumulating static energy.\nCheck PVT timing and variability, SRAM read/write/retention minimum voltage, noise margin, analog or I/O requirements, IR droop and regulator/transient constraints. For multi-voltage domains, level shifters protect signal crossings. Characterize each approved operating point."}}]},{"title":"Physical Design of a Digital Block","questions":[{"id":"asic-u5-q1","subject":"asic","unit":5,"number":1,"q":"Explain the complete physical design flow from Netlist to CIF / layout (GDSII) in detail.","ans":{"s":"Netlist + technology inputs → floorplan/PDN → placement → CTS → route → extraction and signoff → stream-out.","m":"Import netlist, Liberty, technology/cell LEF, SDC and power intent. Floorplan, build a power grid, place and legalize cells, synthesize the clock tree and route. Extract parasitics, close timing, run DRC/LVS and stream out verified layout. CIF is a legacy text geometry format.","d":"1. Import synthesized gate netlist, timing Liberty, technology/physical library abstracts (LEF), SDC, macro views and power intent. Confirm logical hierarchy, design units and placement constraints.\n2. Define die/core, macros, pins, placement rows, power grid and blockages. Place standard cells and legalize, then optimize timing and congestion.\n3. Build the clock tree with buffers and robust routing. Global routing assigns corridors; detailed routing creates legal exact wires/vias. Insert fillers, repair antenna effects and add metal fill as the flow requires.\n4. Extract RC and run multi-corner STA. Verify rule compliance with DRC, connectivity with LVS and reliability with IR/EM and electrical checks. Resolve violations and reverify ECOs.\n5. Merge routed geometry with full library/macro layouts and stream out GDSII/OASIS for modern mask data. A legacy flow may export CIF, a text representation of layer geometry and hierarchical symbol calls.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gate netlist to layout physical design flow\" viewBox=\"0 0 740 154\">\u003crect width=\"740\" height=\"154\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003crect x=\"20\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"90\" y=\"38\" text-anchor=\"middle\">Gate netlist and\u003c/text>\u003ctext x=\"90\" y=\"53\" text-anchor=\"middle\">PDK/library inputs\u003c/text>\u003cpath d=\"M161 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"195\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"265\" y=\"38\" text-anchor=\"middle\">Floorplan and\u003c/text>\u003ctext x=\"265\" y=\"53\" text-anchor=\"middle\">power grid\u003c/text>\u003cpath d=\"M336 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"370\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"440\" y=\"38\" text-anchor=\"middle\">Place and\u003c/text>\u003ctext x=\"440\" y=\"53\" text-anchor=\"middle\">legalize\u003c/text>\u003cpath d=\"M511 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"545\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"615\" y=\"38\" text-anchor=\"middle\">Clock tree\u003c/text>\u003ctext x=\"615\" y=\"53\" text-anchor=\"middle\">synthesis\u003c/text>\u003cpath d=\"M615 67v19m-4-5 4 5 4-5\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"545\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"615\" y=\"108\" text-anchor=\"middle\">Global and\u003c/text>\u003ctext x=\"615\" y=\"123\" text-anchor=\"middle\">detailed route\u003c/text>\u003cpath d=\"M543 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"370\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"440\" y=\"108\" text-anchor=\"middle\">Extract RC and\u003c/text>\u003ctext x=\"440\" y=\"123\" text-anchor=\"middle\">timing closure\u003c/text>\u003cpath d=\"M368 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"195\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"265\" y=\"108\" text-anchor=\"middle\">DRC, LVS and\u003c/text>\u003ctext x=\"265\" y=\"123\" text-anchor=\"middle\">reliability checks\u003c/text>\u003cpath d=\"M193 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"20\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"90\" y=\"108\" text-anchor=\"middle\">GDSII/OASIS\u003c/text>\u003ctext x=\"90\" y=\"123\" text-anchor=\"middle\">or legacy CIF\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u5-q2","subject":"asic","unit":5,"number":2,"q":"Explain Clock Tree Synthesis (CTS) and Buffering in detail, including the goals of CTS.","ans":{"s":"CTS builds the physical clock distribution. Size and place buffers to control skew, insertion delay, slew and load.","m":"Group sinks by location/load, build a buffered tree and choose suitable metal. Buffering isolates downstream capacitance, restores transition quality and helps achieve controlled skew and latency. Verify pulse width, fanout, clocks and end-to-end setup/hold after route.","d":"CTS starts from placed sinks, clock source, clock definitions, target skew/latency, cell models and blockages. Cluster flip-flops and macro clock pins, choose a clock topology, route candidate branches and insert legal buffers/inverters. Place repeaters on long wires to reduce effective RC burden. Balance path delay by matching buffer levels/load or intentional useful skew. Size buffers to meet transition and capacitance limits while controlling power; extra stages can raise insertion delay and clock power.\nUse suitable wire layers, width/spacing rules and via arrays for critical routes. Account for clock gating, generated clocks and test sinks. After extraction, check skew, latency, slew, duty cycle, pulse width, clock power and setup/hold across modes and corners. Resize, reroute or rebalance as needed."}},{"id":"asic-u5-q3","subject":"asic","unit":5,"number":3,"q":"Explain placement, CTS and buffering techniques in ASIC design.","ans":{"s":"Place and legalize cells. Build and buffer the clock tree. Buffer long or high-fanout nets while verifying both maximum and minimum timing.","m":"Placement minimizes wirelength, timing and congestion under legal constraints. CTS distributes the clock with buffered branches and bounded slew/skew. Buffering splits capacitive loads, improves edge rate and shifts delay. Recheck slack, congestion and power.","d":"Global placement assigns approximate positions from net connectivity, density, timing and congestion. Legalization makes sites/orientations and non-overlap valid. Detailed placement refines coordinates with small moves. Placement timing uses estimated RC until routes are available.\nCTS clusters actual clock sinks and synthesizes shared trunks and branch buffers/inverters. The goal is controlled insertion delay/skew, duty cycle, slew and fanout across the clock network. Clock buffers can use dedicated library cells. Data buffering may split a high-fanout branch or long RC wire. A deliberately added data delay can repair hold. Every repair can affect setup, placement density and dynamic power, so reassess timing with extracted clock and data paths."}},{"id":"asic-u5-q4","subject":"asic","unit":5,"number":4,"q":"Explain Foundry Design Rules in detail. Explain the Design Rule Check (DRC) step in physical design.","ans":{"s":"Foundry rules encode manufacturable geometries. DRC checks width, spacing, enclosure, via rules, density, antenna and other deck-specific constraints.","m":"Use the foundry's process-specific rule deck to compare the final layout against geometric and manufacturing constraints. Report coordinates and offending layers/shapes, then edit, reroute or adjust fill and rerun. LVS separately validates connectivity.","d":"Foundry rules define the tolerable layout dimensions and relationships for a technology. Examples are minimum trace width/spacing/area, minimum end-of-line spacing, enclosure/overlap of implants and via cuts, well spacing, via arrays, density, lithography pattern constraints and antenna ratios. A technology can restrict the allowed track orientations or shapes for a layer. The foundry deck and PDK are authoritative for numeric values.\nDRC reads hierarchical final geometry and evaluates the deck using geometric or connectivity-aware checks. A violation report identifies its rule ID, area, affected layers and bounding coordinates. Repair with appropriate geometry edits or ECO routing and rerun. Do final DRC after stream-out and relevant fill. Use LVS to check the extracted circuit against the schematic/netlist and electrical/reliability rules as required for signoff."}},{"id":"asic-u5-q5","subject":"asic","unit":5,"number":5,"q":"Explain global routing and detailed routing in ASIC design (short note).","ans":{"s":"Global routing plans channels and capacities. Detailed routing instantiates exact shapes and vias under DRC.","m":"Global routing predicts congestion and assigns per-net routing guides, layers and coarse corridors. Detailed routing follows the guides where feasible and makes pin access, exact tracks and vias DRC-legal.","d":"Global routing works on a coarse G-cell graph. With net terminals, blockages, track and via capacities, it assigns global paths or Steiner trees and layer corridors, tracking overflow and delay. The guide is an approximate reservation, so it may still need congestion or placement fixes.\nDetailed routing picks exact pin access points, legal tracks, segments, jogs and vias, with technology spacing and geometry rules. Search and rip-up/reroute repair conflicts. The result is physical signal connectivity suitable for extraction and downstream signoff. Performance and manufacturability still require final timing and rule verification."}},{"id":"asic-u5-q6","subject":"asic","unit":5,"number":6,"q":"Explain parasitic extraction and static timing analysis in physical design.","ans":{"s":"Extract R, ground C and coupling C from routed geometry, typically into SPEF. STA combines these with cell timing and constraints.","m":"Use layout and process extraction data to derive wire/via resistance, ground capacitance and coupling. Feed extracted RC into static timing, calculate setup/hold slack over signoff modes/corners, fix failing paths and re-extract after ECOs.","d":"Parasitic extraction converts interconnect geometry, thicknesses, widths, spacings and via stacks into electrical RC networks. Use calibrated process/corner rules, separating ground capacitance from mutual coupling where needed. Store extracted parasitics in a timing exchange format such as SPEF. Long/high-speed effects can call for more detailed signal-integrity analysis.\nSTA reads the netlist, Liberty tables, clocks/constraints and extracted parasitics. It propagates arrivals and computes required times for setup and hold, accounting for the propagated clock network and relevant variation. Inspect worst and total negative slack plus transition/capacitance checks. Make ECOs, update parasitics and rerun timing, physical rules and equivalence as applicable."}},{"id":"asic-u5-q7","subject":"asic","unit":5,"number":7,"q":"Explain power grid design in a digital block step by step.","ans":{"s":"Budget current/drop, plan bumps and domain connections, build mesh and rails, then verify connectivity, IR drop and electromigration.","m":"Estimate load and droop per domain, plan pin/bump feeds, distribute power in upper-layer straps and connect local rails with via arrays. Analyze static/dynamic IR, current density and shorts/opens. Adjust pitch, width, feeds, switches and decoupling.","d":"1. Estimate average and peak currents by domain and function, then allocate static/drop, transient droop and EM limits including the package or upstream domains.\n2. Position VDD/VSS bumps, pads and macro pins; define always-on, switched and multiple-voltage domains. Pick top-layer rings/straps and an orthogonal mesh using suitable width, spacing and pitch.\n3. Connect upper layers through multi-cut vias to cell rails and macro taps. Insert power switches and decoupling where specified. Preserve signal routing and test access.\n4. Verify all grounds and supplies connect to intended loads without crossing domains. Run static IR and EM checks and dynamic droop with representative/worst-case switching.\n5. Add feeds, widen or add straps, increase via count or address load hotspots. Recheck extraction, power, DRC/LVS and signal-routing impact.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Power delivery from package bumps through metal straps down to standard-cell rails\" viewBox=\"0 0 760 180\">\u003crect width=\"760\" height=\"180\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cg fill=\"#25354c\" stroke=\"#7894c2\">\u003crect x=\"51\" y=\"73\" width=\"126\" height=\"63\" rx=\"7\"/>\u003crect x=\"243\" y=\"73\" width=\"126\" height=\"63\" rx=\"7\"/>\u003crect x=\"409\" y=\"73\" width=\"126\" height=\"63\" rx=\"7\"/>\u003crect x=\"583\" y=\"73\" width=\"126\" height=\"63\" rx=\"7\"/>\u003c/g>\u003cg text-anchor=\"middle\">\u003ctext x=\"114\" y=\"98\">VDD/VSS\u003c/text>\u003ctext x=\"114\" y=\"118\">bumps or pads\u003c/text>\u003ctext x=\"306\" y=\"98\">Top metal\u003c/text>\u003ctext x=\"306\" y=\"118\">rings / straps\u003c/text>\u003ctext x=\"472\" y=\"98\">Mesh and\u003c/text>\u003ctext x=\"472\" y=\"118\">via arrays\u003c/text>\u003ctext x=\"646\" y=\"98\">Local rails and\u003c/text>\u003ctext x=\"646\" y=\"118\">macro taps\u003c/text>\u003c/g>\u003cpath d=\"M181 104h58m-8-5 8 5-8 5m142-5h32m-8-5 8 5-8 5m138-5h44m-8-5 8 5-8 5\" fill=\"none\" stroke=\"#8de4d3\" stroke-width=\"2\"/>\u003ctext x=\"380\" y=\"42\" text-anchor=\"middle\">Power delivery path\u003c/text>\u003ctext x=\"380\" y=\"158\" text-anchor=\"middle\">The return network must satisfy its own drop and current limits.\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u5-q8","subject":"asic","unit":5,"number":8,"q":"Write short note on 1. Global routing 2. Detailed routing","ans":{"s":"Global routing plans channels and capacities. Detailed routing instantiates exact shapes and vias under DRC.","m":"Global routing predicts congestion and assigns per-net routing guides, layers and coarse corridors. Detailed routing follows the guides where feasible and makes pin access, exact tracks and vias DRC-legal.","d":"Global routing works on a coarse G-cell graph. With net terminals, blockages, track and via capacities, it assigns global paths or Steiner trees and layer corridors, tracking overflow and delay. The guide is an approximate reservation, so it may still need congestion or placement fixes.\nDetailed routing picks exact pin access points, legal tracks, segments, jogs and vias, with technology spacing and geometry rules. Search and rip-up/reroute repair conflicts. The result is physical signal connectivity suitable for extraction and downstream signoff. Performance and manufacturability still require final timing and rule verification."}},{"id":"asic-u5-q9","subject":"asic","unit":5,"number":9,"q":"Explain Netlist to CIF generation in detail.","ans":{"s":"Implement a gate netlist as placed/routed, verified geometry. Export legacy CIF by writing layers, shapes and hierarchical calls.","m":"Floorplan and route the netlist against technology and physical-library rules. Extract and close timing, run DRC/LVS, then translate complete layer geometry to CIF with layer codes, shape commands and symbol definitions/calls.","d":"The netlist specifies instances and connections. Import logic and timing constraints with cell and macro physical views. Create the floorplan and power grid, assign legal placements, synthesize clock distribution, and route all nets. Merge reference cell geometry with top-level routed shapes. Extract RC and perform timing closure, DRC and LVS before final delivery.\nCaltech Intermediate Form (CIF) is a hierarchical ASCII mask-layout format. The exporter maps each physical layer to a CIF layer name. It emits layer selections (L) and geometric commands such as box (B), polygon (P) and wire (W). Use DS/DF to define a reusable symbol, C to call it with transformations, and E to terminate the file. Coordinate scale and technology layer mapping must agree with the receiving tool. GDSII/OASIS are common modern stream-out formats for the corresponding geometry.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gate netlist to layout physical design flow\" viewBox=\"0 0 740 154\">\u003crect width=\"740\" height=\"154\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003crect x=\"20\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"90\" y=\"38\" text-anchor=\"middle\">Gate netlist and\u003c/text>\u003ctext x=\"90\" y=\"53\" text-anchor=\"middle\">PDK/library inputs\u003c/text>\u003cpath d=\"M161 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"195\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"265\" y=\"38\" text-anchor=\"middle\">Floorplan and\u003c/text>\u003ctext x=\"265\" y=\"53\" text-anchor=\"middle\">power grid\u003c/text>\u003cpath d=\"M336 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"370\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"440\" y=\"38\" text-anchor=\"middle\">Place and\u003c/text>\u003ctext x=\"440\" y=\"53\" text-anchor=\"middle\">legalize\u003c/text>\u003cpath d=\"M511 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"545\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"615\" y=\"38\" text-anchor=\"middle\">Clock tree\u003c/text>\u003ctext x=\"615\" y=\"53\" text-anchor=\"middle\">synthesis\u003c/text>\u003cpath d=\"M615 67v19m-4-5 4 5 4-5\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"545\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"615\" y=\"108\" text-anchor=\"middle\">Global and\u003c/text>\u003ctext x=\"615\" y=\"123\" text-anchor=\"middle\">detailed route\u003c/text>\u003cpath d=\"M543 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"370\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"440\" y=\"108\" text-anchor=\"middle\">Extract RC and\u003c/text>\u003ctext x=\"440\" y=\"123\" text-anchor=\"middle\">timing closure\u003c/text>\u003cpath d=\"M368 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"195\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"265\" y=\"108\" text-anchor=\"middle\">DRC, LVS and\u003c/text>\u003ctext x=\"265\" y=\"123\" text-anchor=\"middle\">reliability checks\u003c/text>\u003cpath d=\"M193 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"20\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"90\" y=\"108\" text-anchor=\"middle\">GDSII/OASIS\u003c/text>\u003ctext x=\"90\" y=\"123\" text-anchor=\"middle\">or legacy CIF\u003c/text>\u003c/g>\u003c/svg>"}}]}]},{"id":"mca","name":"Microcontrollers and Applications","code":"PCC-301-ECV","color":"#ffc493","source":"https://chatgpt.com/library?account_id=personal&file_id=libfile_ab2825159cac81918a11cb5f5f08cd67","count":50,"units":[{"title":"Introduction to Microcontrollers","questions":[{"id":"mca-u1-q1","subject":"mca","unit":1,"number":1,"q":"Distinguish between RISC and CISC processor architectures across key design parameters.","ans":{"s":"RISC favors simple, regular instructions and load/store memory access. CISC provides richer instructions and more addressing forms.","m":"Compare instruction formats, operations, registers and decoding. RISC typically uses regular encodings, register-register ALU operations and explicit loads/stores. CISC often uses variable-length encodings and permits memory operands or several actions in one instruction. ARM and RISC-V are RISC examples, while x86 is CISC.","d":"RISC ISAs aim for regular formats and straightforward decoding. A computation typically loads operands into registers, performs a register-to-register operation, and stores the result. CISC ISAs expose complex addressing and richer individual operations, which can improve code density and reduce architectural instruction count. A CISC processor can translate instructions into simpler internal micro-operations, while a RISC processor can use multiple instruction lengths, complex execution units, or multi-cycle instructions. Compare speed using workload, clock, instruction count and average cycles per instruction. ISA classification alone gives no performance guarantee.\nExample: LOAD A; ADD register, register; STORE B. An x86-style ADD can read a memory operand directly."}},{"id":"mca-u1-q2","subject":"mca","unit":1,"number":2,"q":"Contrast Von Neumann and Harvard computer architectures with suitable structural differences.","ans":{"s":"Von Neumann shares one program/data memory path. Harvard uses separate instruction and data paths, allowing parallel access.","m":"Von Neumann places instruction and data in a common storage/address space and typically shares the transfer bus. Harvard separates instruction and data memories and buses, so an instruction fetch and data access can occur together. A modified Harvard processor may have split instruction/data caches over unified main memory.","d":"Draw two block diagrams. Von Neumann: CPU ↔ shared address/data bus ↔ combined program and data memory. An instruction fetch and a data transfer compete for that bus. Harvard: instruction memory → instruction bus → CPU, and CPU ↔ data bus ↔ data memory. The separate channels can have different widths and allow simultaneous fetch and data transfer, but require more interface hardware. The 8051 separates program and data address spaces and distinguishes code and external data accesses with different instructions and strobes. Modified Harvard designs can use separate internal caches with a unified memory map.","fig":"\u003csvg viewBox=\"0 0 660 211\" width=\"660\" height=\"211\" role=\"img\" aria-labelledby=\"mca-u1-q2-mca-vnh-title\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\">\u003ctitle id=\"mca-u1-q2-mca-vnh-title\">Von Neumann and Harvard architecture\u003c/title>\u003cdefs>\u003cmarker id=\"mca-u1-q2-mca-vnh-arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#9aabbc\"/>\u003c/marker>\u003c/defs>\u003crect x=\"0\" y=\"0\" width=\"660\" height=\"211\" rx=\"9\" fill=\"#070b11\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"14\">\u003cpath d=\"M 143 60 H 405\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u1-q2-mca-vnh-arrow)\" marker-start=\"url(#mca-u1-q2-mca-vnh-arrow)\"/>\u003cpath d=\"M 405 134 H 270 V 151 H 144\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u1-q2-mca-vnh-arrow)\"/>\u003cpath d=\"M 144 170 H 270 V 186 H 405\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u1-q2-mca-vnh-arrow)\" marker-start=\"url(#mca-u1-q2-mca-vnh-arrow)\"/>\u003crect x=\"25\" y=\"40\" width=\"116\" height=\"40\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"83\" y=\"60\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">CPU\u003c/text>\u003crect x=\"409\" y=\"40\" width=\"225\" height=\"40\" rx=\"6\" fill=\"#111820\" stroke=\"#a7a6ff\"/>\u003ctext x=\"521.5\" y=\"60\" fill=\"#a7a6ff\" text-anchor=\"middle\" dominant-baseline=\"central\">Program + data memory\u003c/text>\u003crect x=\"25\" y=\"141\" width=\"116\" height=\"40\" rx=\"6\" fill=\"#111820\" stroke=\"#78ddca\"/>\u003ctext x=\"83\" y=\"161\" fill=\"#78ddca\" text-anchor=\"middle\" dominant-baseline=\"central\">CPU\u003c/text>\u003crect x=\"409\" y=\"118\" width=\"225\" height=\"36\" rx=\"6\" fill=\"#111820\" stroke=\"#a7a6ff\"/>\u003ctext x=\"521.5\" y=\"136\" fill=\"#a7a6ff\" text-anchor=\"middle\" dominant-baseline=\"central\">Instruction memory\u003c/text>\u003crect x=\"409\" y=\"168\" width=\"225\" height=\"36\" rx=\"6\" fill=\"#111820\" stroke=\"#f3c792\"/>\u003ctext x=\"521.5\" y=\"186\" fill=\"#f3c792\" text-anchor=\"middle\" dominant-baseline=\"central\">Data memory\u003c/text>\u003ctext x=\"25\" y=\"24\" fill=\"#c3cbd4\">Von Neumann\u003c/text>\u003ctext x=\"240\" y=\"50\" fill=\"#c3cbd4\">Shared bus\u003c/text>\u003ctext x=\"25\" y=\"122\" fill=\"#c3cbd4\">Harvard\u003c/text>\u003ctext x=\"287\" y=\"125\" fill=\"#c3cbd4\">Code path\u003c/text>\u003ctext x=\"287\" y=\"178\" fill=\"#c3cbd4\">Data path\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"mca-u1-q3","subject":"mca","unit":1,"number":3,"q":"Bring out the major differences between a general-purpose microprocessor and a microcontroller and Justify how microcontrollers are chosen for developing embedded systems.","ans":{"s":"A microprocessor emphasizes CPU throughput and relies on a system of memory and peripherals. An MCU integrates CPU, memory and control peripherals for dedicated tasks.","m":"A general-purpose processor commonly uses external DRAM and rich system software. An MCU integrates Flash, SRAM, GPIO, timers and interfaces, often with sleep modes and predictable peripheral timing. Choose it by deadlines, memory, I/O, communications, power and cost.","d":"A microprocessor normally targets broad computing workloads and delegates more system functions to external memory and support hardware or other parts of its SoC. A microcontroller combines its CPU, program memory, RAM, interrupt controller, timer/counters, GPIO and serial interfaces, commonly adding ADC/PWM and low-power states. Integration shrinks board area, component count and energy use. To select an MCU, budget code/data memory and ISR latency, count pins and required timer/ADC channels, match interfaces and voltage levels, and check active/sleep current, toolchain, availability and unit price. A sensor node might use an MCU with an ADC, timer wake-up and UART for its radio."}},{"id":"mca-u1-q4","subject":"mca","unit":1,"number":4,"q":"Compare 8-bit, 16-bit, and 32-bit microcontrollers.","ans":{"s":"The bit width describes the natural ALU/register operand width. Wider cores help with large numbers and addresses, subject to each MCU's implementation.","m":"8-bit MCUs suit simple GPIO and timing control, 16-bit cores handle wider integer operations efficiently, and 32-bit MCUs suit communication stacks and richer control. Multi-byte arithmetic on a narrow core takes multiple operations. Width alone does not specify flash, power or ADC resolution.","d":"Compare: 8-bit means native 8-bit arithmetic, such as classic 8051 for switches, LED control and basic appliances. 16-bit, such as MSP430, processes 16-bit values directly and can suit battery metering or control. 32-bit, such as ARM Cortex-M or ARM7TDMI-S, operates natively on 32-bit registers, supporting wider counters, larger firmware and more complex real-time algorithms. Actual address capacity depends on the architecture and memory map. Compare the peripherals, IRQ latency, sleep current, memory and toolchain against application requirements before selecting a part."}},{"id":"mca-u1-q5","subject":"mca","unit":1,"number":5,"q":"Sketch the block diagram of the 8051 microcontroller and describe the specific function of the Program Counter, stack pointer, DPTR register and ALU","ans":{"s":"8051 CPU ↔ internal bus ↔ ROM/RAM/SFR/peripherals. PC fetches instructions, SP tracks stack, DPTR points to data/code, ALU computes.","m":"Inside the 8051, CPU registers and the ALU connect to code ROM, data RAM, SFRs, four I/O ports, two timers, serial port and interrupt logic. PC is 16-bit. SP is 8-bit and grows upward. DPTR is a 16-bit pointer formed by DPH and DPL.","d":"Draw oscillator/reset → CPU control and timing; CPU ↔ internal bus ↔ ROM, RAM, interrupt controller, timers T0/T1, UART and P0–P3. Inside CPU draw A/B and PSW around the 8-bit ALU. PC holds the next code address and changes on fetch, branch, call or interrupt. SP resets to 07h and is incremented before a push, so the first stack byte uses RAM 08h by default. DPTR = DPH:DPL, used for MOVX @DPTR and MOVC A,@A+DPTR. ALU adds, subtracts, compares, rotates and applies bitwise operations, updating the relevant PSW flags.","fig":"\u003csvg viewBox=\"0 0 660 210\" width=\"660\" height=\"210\" role=\"img\" aria-labelledby=\"mca-u1-q5-mca-51block-title\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\">\u003ctitle id=\"mca-u1-q5-mca-51block-title\">Classic 8051 CPU and peripheral blocks\u003c/title>\u003cdefs>\u003cmarker id=\"mca-u1-q5-mca-51block-arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#9aabbc\"/>\u003c/marker>\u003c/defs>\u003crect x=\"0\" y=\"0\" width=\"660\" height=\"210\" rx=\"9\" fill=\"#070b11\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"14\">\u003cpath d=\"M 162 88 H 221\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u1-q5-mca-51block-arrow)\"/>\u003cpath d=\"M 437 88 H 490\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u1-q5-mca-51block-arrow)\" marker-start=\"url(#mca-u1-q5-mca-51block-arrow)\"/>\u003cpath d=\"M 330 128 V 141 H 87 V 152\" stroke=\"#9aabbc\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#mca-u1-q5-mca-51blo
