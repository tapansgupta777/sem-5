an change circuit behavior across modes and process corners.\nManufacturing: Layout must meet foundry design rules, density checks and lithography limits. Mixed-signal blocks, embedded memories or specialized transistors can impose process and layout constraints. Larger die area can reduce yield at a given defect rate.\nPackage and test: Package resistance, inductance and thermal properties affect performance. Scan, memory BIST and built-in diagnostics improve test access to buried circuitry before shipping."}},{"id":"soc-u1-q5","subject":"soc","unit":1,"number":5,"q":"Explain Different Components of the SOC.","ans":{"s":"Typical blocks are CPU, memory, interconnect, accelerators, I/O, DMA, interrupt, power/clock/reset, security, debug and DFT.","m":"Compute: CPU cores execute general software. GPU, DSP or NPU blocks accelerate selected tasks.\nStorage and transfer: Boot ROM, SRAM, caches and DRAM interfaces hold code and data. A bus or NoC connects them, while DMA moves blocks independently of the CPU.\nPeripherals: Timers, GPIO, SPI and UART support control, and controllers/PHYs handle fast links.\nSystem support: Interrupt, clock, reset and power logic coordinate operation. Security, debug, scan and BIST support protection and test.","d":"CPU and specialized compute: A CPU executes firmware or operating-system software. GPU, DSP, AI and video accelerators improve efficiency for specific operations such as rendering, filtering and inference.\nMemory blocks: ROM stores boot instructions. SRAM holds low-latency data or scratchpad buffers. Caches exploit locality and a DRAM controller handles access to external memory.\nCommunication fabric: A bus, crossbar or NoC transports data and control transactions. A DMA engine copies or streams memory data with less CPU involvement.\nPeripheral subsystem: Timers, PWM, GPIO, SPI, UART and I²C are common control peripherals. USB, display or PCIe controllers use faster interfaces and suitable physical-layer hardware.\nManagement: Interrupt controllers prioritize events. PLLs and dividers produce clocks, watchdogs recover from hangs, and reset/power controllers isolate or sequence different domains.\nSecurity and test: Secure boot, key storage and privilege checks protect system assets. Debug ports, scan and memory BIST aid verification and fault detection.\nWorked example: A sensor controller can issue a DMA request and fill a RAM buffer, then interrupt the CPU when the block is complete."}},{"id":"soc-u1-q6","subject":"soc","unit":1,"number":6,"q":"Draw & Explain SOC Design Flow.","ans":{"s":"Requirements → architecture/IP → RTL/integration → verification/DFT → synthesis → physical design → sign-off → fabrication/bring-up.","m":"Specification and architecture: Define workload, PPA, IP, interconnect, memory map and domain boundaries.\nFrontend: Integrate RTL and verify functionality and interfaces. Map to technology cells, add test features and check equivalence.\nBackend: Floorplan, place, build the clock tree, route and extract parasitics. Close timing and power and pass DRC/LVS before stream-out.\nSilicon: Fabricate, package, test, characterize and bring up the target firmware and board. The stream-out package also preserves constraints and verification evidence.","d":"Specify: Define the workload, interfaces, throughput, latency, power, area and test goals. Decide which functions belong in software and which need dedicated hardware.\nArchitect: Choose processors, memory hierarchy, accelerators and bus topology. Define the address map, protocols, clocks, resets, voltage domains and verification plan.\nDevelop and verify: Implement or integrate RTL and IP, then exercise functions and system scenarios with simulation and assertions. Use formal or emulation where appropriate and check reset and clock crossings.\nSynthesize and add DFT: Map RTL to technology library cells under constraints. Add scan or BIST according to the test plan. Check logical equivalence and major timing constraints.\nImplement: Plan the die and power network, place and legalize cells, synthesize the clock tree and route wires. Back-annotate extracted RC and iterate on timing and power.\nSign off: Check implementation against DRC/LVS, timing, IR drop, EM and other release requirements. Stream out layout in GDSII or OASIS.\nManufacture: Fabricate and package the chip, run production test and characterize performance, then bring up firmware and validate the system on the board.","fig":"\u003csvg role=\"img\" aria-label=\"Requirements / PPA targets then Architecture, IP selection and HW/SW partition then RTL integration and verification then Technology mapping and DFT then Floorplan, placement, clock tree and routing then Extraction, sign-off and stream-out then Fabrication, packaging, test and bring-up\" viewBox=\"0 0 620 294\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect x=\"45\" y=\"0\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"19\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Requirements / PPA targets\u003c/text>\u003cpath d=\"M310 29 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"42\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"61\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Architecture, IP selection and HW/SW partition\u003c/text>\u003cpath d=\"M310 71 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"84\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"103\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">RTL integration and verification\u003c/text>\u003cpath d=\"M310 113 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"126\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"145\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Technology mapping and DFT\u003c/text>\u003cpath d=\"M310 155 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"168\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"187\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Floorplan, placement, clock tree and routing\u003c/text>\u003cpath d=\"M310 197 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"210\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"229\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Extraction, sign-off and stream-out\u003c/text>\u003cpath d=\"M310 239 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"252\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"271\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Fabrication, packaging, test and bring-up\u003c/text>\u003c/svg>"}},{"id":"soc-u1-q7","subject":"soc","unit":1,"number":7,"q":"Explain Advantages and challenges of SoC.","ans":{"s":"Benefits: size, energy, bandwidth, fewer board parts. Challenges: up-front cost, verification, thermal/power integrity, IP integration, yield and reduced replaceability.","m":"Benefits: Integration reduces board area, packages and external data transfers. Short on-chip links can improve bandwidth and lower energy, and workload-specific accelerators improve efficiency.\nChallenges: Up-front design and mask costs, integration verification, clock/power crossings, thermal behavior and yield can dominate development.\nExample: A camera-to-NPU data path can share an internal fabric, while arbitration, shared memory visibility and worst-case power still require verification. Consider those costs alongside the projected production volume.","d":"Area and part count: Bringing many functions onto one die reduces board connections, packages and PCB footprint. Fewer external parts can simplify assembly and product integration.\nPower and performance: On-chip wires and interfaces usually demand less switching energy than package pins. Dedicated accelerators can deliver higher throughput or lower energy on repeated tasks.\nCost profile: High volume can amortize mask and engineering costs. Low volume may make a large chip hard to justify, especially when the systems can share existing components.\nVerification: Multiple IP blocks and firmware interact across buses, clock and power domains. Arbitration, coherent memory and reset order require integration checks beyond individual block tests.\nPhysical design: Dense, simultaneously active blocks can cause hotspots, voltage droop and noise. Power grid, package and cooling must support worst-case activity.\nYield and repair: A defect or a late functional error can affect the value of the entire die. DFT and reusable IP reduce some risks, while prototype and sign-off steps reduce the chance of a costly respin.\nExample: An imaging SoC moves camera frames from ISP to accelerator and memory on chip, eliminating off-chip data hops between separate chips."}},{"id":"soc-u1-q8","subject":"soc","unit":1,"number":8,"q":"Explain Applications of SoC in mobiles & Automobiles.","ans":{"s":"Mobile: CPU/GPU/NPU/ISP/modem. Automotive: ADAS perception, vehicle networking, infotainment and safety control.","m":"Mobile: CPU, GPU, NPU, ISP, codec and modem share data for apps, graphics, capture and communications. Dedicated blocks and DVFS help stay within battery and thermal limits.\nAutomotive: SoCs support ADAS perception, sensor fusion, displays, infotainment and vehicle networks. Safety-related systems may add ECC, watchdogs, lockstep and diagnostics.\nExample: Both process camera streams, but an ADAS pipeline also needs system-defined deadlines and fault handling. Integration details depend on vehicle and phone requirements.","d":"Mobile computing: A phone’s CPU runs the OS and apps. GPU renders the interface and games, while DSP or NPU accelerates audio processing, vision and machine-learning tasks.\nCapture and communication: An ISP converts and processes camera sensor data, video codecs encode or decode streams, and a modem subsystem may handle cellular data. Memory and I/O controllers exchange data with external devices.\nMobile constraints: High peak throughput must fit a battery and skin-temperature budget. DVFS, clock/power gating and specialized accelerators reduce energy use.\nAutomotive workloads: ADAS SoCs process camera, radar or lidar data and run fusion or perception. Other SoCs handle vehicle networks, infotainment, displays and gateways.\nAutomotive constraints: Some workloads require deterministic response, temperature tolerance and diagnostics. Safety-related designs may use watchdogs, ECC, lockstep or supervised partitioning according to system safety goals.\nExample paths: A phone sends camera frames from ISP to video codec. An ADAS subsystem compares perception and diagnostic results before sharing an output with the vehicle control network.\nDesign priorities: Mobile prioritizes user experience per watt. Automotive choices depend on the use case, durability, service lifetime and fault response."}}]},{"title":"SoC Architecture and IP Design","questions":[{"id":"soc-u2-q1","subject":"soc","unit":2,"number":1,"q":"Explain processor architecture with its microarchitecture.","ans":{"s":"ISA is the software contract. Microarchitecture implements it with a datapath, control, registers, pipeline and memory hierarchy.","m":"Architecture: The ISA specifies visible instructions, registers, memory accesses, privilege and exception behavior.\nMicroarchitecture: A core implements the same contract through a chosen datapath, control logic, cache organization and issue strategy.\nExample: A five-stage core overlaps fetch, decode, execute, memory and write-back. It stalls or forwards for dependencies and flushes on a mispredicted branch. A wider out-of-order core can implement the same ISA differently. Performance and power depend on the chosen implementation.","d":"ISA contract: Processor architecture defines instructions, registers, supported data types, addressing, privilege and exception behavior that compilers and software can assume.\nMicroarchitecture: The implementation chooses pipeline depth, execution units, issue width, registers and cache organization. Two cores can run the same binaries while using very different organization and consuming different power.\nDatapath: The program counter selects instruction memory. A decoder generates control and extracts register indices and immediates. The register file, ALU, load/store unit and result buses execute operations.\nPipeline example: Split execution into instruction fetch, decode and operand read, execute, memory access and write-back. Overlap independent instructions to increase throughput even though each instruction still spans several stages.\nHazards: Forward ALU results to dependent instructions where possible and stall when a load result is late. Resource contention needs arbitration. A wrong branch prediction redirects fetch and flushes wrong-path work.\nAdvanced core: An out-of-order processor can rename registers and schedule ready instructions early, while in-order retirement preserves predictable software-visible state and supports precise exceptions.\nTrade-off: Deeper, wider pipelines can improve performance but increase clocking, control and speculation costs."}},{"id":"soc-u2-q2","subject":"soc","unit":2,"number":2,"q":"Compare ARM , RISC-V and DSP for processor core selection.","ans":{"s":"Arm: mature cores and tools. RISC-V: open modular ISA. DSP: MAC/SIMD and deterministic streaming. Select for workload, ecosystem, cost and PPA.","m":"Arm: Mature processor IP and software support suit many control and OS workloads. Select the profile and core for latency, performance and real-time needs.\nRISC-V: An open modular ISA supports varied implementations and customization. Check extension support, tools, software and licensing of the implementation.\nDSP: Fast MAC, packed operations and efficient buffering suit filters, FFTs and codecs. A SoC can pair a CPU with a DSP when control and signal-processing workloads differ.","d":"Arm choices: Arm offers licensed architectures and processor IP, with compiler, OS, debug and ecosystem support. Cortex-M targets many microcontrollers, Cortex-A supports rich operating systems and Cortex-R targets many real-time uses.\nRISC-V choices: RISC-V provides an open standard ISA with a base and ratified optional extensions. Implementations can be open-source or commercially licensed, so assess both the ISA profile and the delivered core.\nRISC-V flexibility: Custom extensions can accelerate an application but add software, verification and portability work. Check OS and toolchain support for the required extensions.\nDSP profile: A DSP targets arithmetic streams such as filters, FFTs and codecs. It may offer fast multiply-accumulate, fixed-point saturation, packed SIMD and special addressing for circular buffers.\nWorkload comparison: General application code benefits from software ecosystem and operating-system support. Deterministic control depends on interrupt and memory behavior. Signal processing benefits from arithmetic throughput and efficient data movement.\nSelection method: Benchmark latency, throughput, power and timing predictability. Check licensing, tools, verification collateral, security, memory interfaces and integration effort.\nExample: A robot controller can pair a general-purpose control CPU with a DSP for filtering sensor streams."}},{"id":"soc-u2-q3","subject":"soc","unit":2,"number":3,"q":"Explain different basic elements in Instruction Handling.","ans":{"s":"Fetch → decode → read operands → execute → memory → write-back/retire. Handle stalls, forwarding, branches and precise exceptions.","m":"Fetch and decode: The PC selects the instruction. Decode extracts opcode, registers and immediate values and generates control.\nExecute and memory: Read or forward operands, then compute the result, branch or address. A load/store accesses memory, and a register result writes back.\nHazards and exceptions: Stall for unavailable operands, resolve structural conflicts and flush wrong-path work. On an exception, preserve the state specified by the ISA and transfer to its handler.","d":"Fetch: The program counter selects an instruction from memory or instruction cache. Sequential addressing or branch prediction chooses a candidate next PC.\nDecode: Identify the opcode, register fields, immediates and addressing mode. Generate controls for the ALU, branch logic, load/store unit and register write-back.\nOperand access: Read the register file and select either register or immediate operands. Forward a recently produced value around the register file when dependencies permit.\nExecute: Perform arithmetic or logic, compare branch operands or calculate the effective data address. A mispredicted branch redirects fetch and discards younger wrong-path operations.\nMemory and commit: Loads read data and stores write it via the cache or memory interface. Write-back updates destination registers, while some designs distinguish producing a result from retiring it in architectural order.\nPipeline hazards: An unresolved dependency stalls an instruction. Two stages needing the same resource require arbitration. Control hazards can introduce bubbles or flushes.\nException example: If a load faults, the processor saves the required instruction address and cause, restores precise state according to its ISA and invokes the handler."}},{"id":"soc-u2-q4","subject":"soc","unit":2,"number":4,"q":"Explain in brief different Intellectual Property cores (IP Cores) like Hard IP, Soft IP, Reusable IP and Firm IP.","ans":{"s":"Soft = synthesizable RTL. Firm = partly implemented/technology constrained. Hard = fixed physical macro. Reusable = designed and packaged for multiple integrations.","m":"Soft IP: Synthesizable RTL is flexible and portable but needs mapping and physical closure by the integrator.\nFirm IP: Intermediate implementation such as a mapped netlist, often with constraints. Portability depends on the underlying library.\nHard IP: Fixed process-specific layout or macro with physical and timing views, typical for SRAM, PLLs and PHYs.\nReusable IP: A property of any delivery form. Stable interfaces, documentation and verification collateral support repeat integration.","d":"Soft IP: Synthesizable RTL is delivered with interfaces, configuration options and verification information. It can be mapped to several technologies, while implementers must close target timing, area and power.\nFirm IP: Suppliers deliver an intermediate logical or physical view such as a technology-mapped netlist and implementation constraints. It offers more predictable implementation than raw RTL, with portability limited by library and process assumptions.\nHard IP: A process-specific physical macro arrives with layout and abstracts. Integration commonly requires a GDSII/OASIS view, LEF boundary and pins, timing/power models and applicable restrictions.\nHard IP examples: A foundry SRAM macro, PLL or PHY may depend on transistor characteristics, well structures or metal stack. Design teams must use compatible process options and sign-off views.\nReusable IP: Any delivery form can be reusable. Clear interface contracts, parameterization, versioning, documentation and verification assets reduce integration effort in later products.\nSelection: Balance portability, implementation predictability, permitted modification, schedule, licensing and delivered test collateral.\nComparison example: A common UART may ship as RTL, a tuned accelerator as a mapped netlist, and a memory array as a fixed macro."}},{"id":"soc-u2-q5","subject":"soc","unit":2,"number":5,"q":"Explain in brief different bus architecture like AMBA, AXI, AHB and APB.","ans":{"s":"AMBA is the family. AXI serves high-performance masters, AHB supports pipelined system transfers, APB serves low-bandwidth register access.","m":"AMBA: Arm protocol family for on-chip communication.\nAXI: Five independent VALID/READY channels permit burst and outstanding transfers. Typical users include CPUs, DMA and memory controllers.\nAHB: Address/control and data phases are pipelined. HREADY indicates completion or wait states.\nAPB: Simple setup and access phases use PSEL and PENABLE, with PREADY for wait states. An AXI/AHB bridge connects slow register peripherals such as GPIO and timers.","d":"AMBA: This is Arm’s family of on-chip interface standards. AXI, AHB and APB are different protocols inside the family, selected according to bandwidth and complexity.\nAXI interfaces: Five independent channels carry write addresses, write data, write responses, read addresses and read data. Each uses a VALID/READY handshake to handle backpressure.\nAXI performance: Burst transfers amortize address overhead. Multiple outstanding operations and response IDs can increase throughput where supported. CPU, DMA and memory controllers can use AXI.\nAHB structure: An address/control phase can overlap a preceding transfer’s data phase. HREADY indicates progress and can add wait states. AHB-Lite uses one bus master per segment.\nAPB structure: A register-oriented transfer has setup (PSEL asserted) then access (PENABLE asserted). PREADY extends the access when low. An APB peripheral commonly handles a UART, timer or GPIO register map.\nIntegration example: CPU traffic arrives on AXI or AHB. A bridge decodes peripheral addresses, performs the required APB setup/access sequence and returns status or data.\nComparison: AXI offers greater concurrency. AHB provides a simpler pipelined system bus. APB favors low-complexity control transfers."}},{"id":"soc-u2-q6","subject":"soc","unit":2,"number":6,"q":"Explain Network on Chip (NOC) basics.","ans":{"s":"NoC = packetized links between routers and endpoints. Choose topology, routing, buffering, flow control and deadlock avoidance.","m":"Structure: Network interfaces packetize requests, routers select hops and arbitrate, and links transport flits between routers.\nTopology and routing: Rings are simple. Meshes support many concurrent paths and can use deterministic XY routing. Buffers or credits manage backpressure.\nTrade-offs: NoC scalability comes with additional router area, per-hop latency and verification work. Validate bandwidth, ordering, deadlock freedom and quality of service using realistic traffic. Arbitration and congestion also influence worst-case delay.","d":"Concept: A network on chip uses routers and point-to-point links to transport on-chip transactions between initiators and targets. It replaces or supplements centralized wiring where many nodes share traffic.\nNetwork interface: Convert a bus request and its address/data into packets, add routing information and split packets into flow-control units called flits when required. The receiving interface reconstructs the transaction.\nRouter: Select an output direction, arbitrate competing inputs and buffer waiting traffic. Credit-based control is one way to prevent upstream links from overrunning downstream buffers.\nTopology: Rings use simple neighbor links. A mesh supports many simultaneous routes and can map naturally onto regular layouts, with latency increasing for distant destinations.\nRouting: In deterministic XY routing, packets reach the destination column before traversing rows. Channel dependency rules or suitable virtual channels and policies help avoid deadlock and reduce blocking.\nDesign trade-offs: Compare latency, saturation throughput, wiring, area and energy using realistic traffic. Select arbitration policies for bandwidth or priority needs.\nSystem integration: Define ordering, coherency and clock/power crossings explicitly. Example traffic from two accelerators can converge on one shared memory port."}},{"id":"soc-u2-q7","subject":"soc","unit":2,"number":7,"q":"Explain in brief different memory subsystem in processors Like L1, L2, L3 cache memory etc.","ans":{"s":"L1 is small and fast, often split I/D. L2 is larger, L3 is often shared, and DRAM is largest/slowest. Hits exploit locality. Misses fetch the next level.","m":"L1: Small, fast and usually private. Many processors split instruction and data caches.\nL2/L3 and DRAM: L2 is larger and private or shared. L3 is often shared, followed by external DRAM. Each level trades access time for capacity.\nBehavior: Tags identify cached lines. A miss fetches the next level and may evict a line. Average time ≈ hit time + miss rate × miss penalty. Coherence handles shared writable data.","d":"Hierarchy: Fast small storage is close to the processor, while larger slower storage backs it. Caches exploit spatial locality within a line and temporal locality when recently used data is reused.\nL1: Usually private to one core and often split into instruction and data caches to serve simultaneous accesses. It has tight latency and area limits.\nL2 and L3: L2 is larger and may be private or shared. L3 is commonly a shared last-level cache. A hit there can avoid external memory traffic.\nCache access: Index bits select a set, tags identify the block and a valid bit confirms presence. A miss fetches from a lower level and may evict a victim. A dirty write-back victim must be written to the next level.\nOther memory: A DRAM controller arbitrates external memory requests. On-chip SRAM can also serve as a scratchpad with predictable, explicitly managed locations.\nCoherence: Shared writable data needs a consistency mechanism among participating caches. Noncoherent DMA may require cache maintenance and synchronization.\nExample: A 1 ns hit time, 5% miss rate and 20 ns extra miss penalty give a 2 ns average access time."}},{"id":"soc-u2-q8","subject":"soc","unit":2,"number":8,"q":"Explain different robust processor like Vector, VLIW and superscalar.","ans":{"s":"Vector: one operation over multiple lanes. VLIW: compiler packs independent operations. Superscalar: hardware issues several instructions in a cycle.","m":"Vector: One instruction applies an operation across data elements, using lanes efficiently for arrays, filters and ML kernels.\nVLIW: A compiler packs independent operations into one wide instruction. Hardware scheduling is simpler, while compiler quality and available parallelism limit slot use.\nSuperscalar: Hardware issues multiple instructions per cycle and resolves dependencies. Dynamic scheduling can suit irregular general-purpose code. Vector and superscalar execution can coexist in one core.","d":"Vector processor: An instruction expresses an operation over many elements. Vector lanes perform groups of additions or multiply-accumulates, with vector-length and masks controlling active elements.\nVector use case: An array addition applies one vector operation across pairs of input elements. Throughput depends on lane count, vector length, layout of data and available memory bandwidth.\nVLIW processor: A long instruction word contains operations assigned to several units. The compiler schedules independent operations together and must respect dependencies and resource constraints.\nVLIW trade-off: Simple hardware scheduling can save power and control area, but code quality depends heavily on compilation and slot utilization. Changing issue resources can affect binary compatibility.\nSuperscalar processor: Hardware fetches, decodes and issues multiple instructions per cycle when operands and units are available. Implementations can issue in order or schedule dynamically out of order.\nSuperscalar trade-off: Dynamic dependency tracking and scheduling exploit irregular instruction mixes at the cost of larger control structures and power.\nCompare by parallelism: Vector exploits data-level parallelism. VLIW exposes instruction-level parallelism in software. Superscalar identifies instruction-level parallelism in hardware, and a superscalar core can also include vector units."}}]},{"title":"RTL Design and Integration","questions":[{"id":"soc-u3-q1","subject":"soc","unit":3,"number":1,"q":"Write Verilog code for UART Transmitter.","ans":{"s":"UART 8N1 = idle 1, start 0, eight data bits LSB first, stop 1. Hold each bit for CLKS_PER_BIT. Accept only when ready.","m":"Format: In 8N1, TX idles high and sends start 0, eight data bits LSB first and stop 1.\nTiming: CLKS_PER_BIT rounds fclk/baud. At 50 MHz and 9600 baud, use 5208. Hold every frame bit for that interval.\nHandshake: Capture data on valid and ready, shift through the packed frame index and return to idle after stop.\nChecks: Confirm bit order, stop duration, ignored busy requests and reset handling.","d":"Frame and interface: UART 8N1 sends an idle high line, a low start bit, eight data bits in LSB-first order and one high stop bit. This module assumes a shared baud convention and no parity or hardware flow control.\nBaud divider: Choose CLKS_PER_BIT ≈ fclk / baud and round to a positive integer. At 50 MHz, 5208 clocks per bit gives 9600.61 baud, an error of about +0.0064% from 9600.\nHandshake: tx_ready is high when idle. On tx_valid and tx_ready, capture the byte and load {stop, data, start}. Hold tx_valid and tx_data stable until acceptance.\nSequencing: Begin with frame index zero. The interval counter advances the index after exactly CLKS_PER_BIT clocks. Indices 1 to 8 transmit the data bits, and index 9 transmits stop.\nCompletion and reset: Clear busy only after the complete stop interval. A reset returns TX to the idle-high line and cancels an active frame.\nVerification: Test 0x00, 0xFF and 0xA5, check bit boundaries and bit order, verify that busy requests are not accepted and exercise reset mid-frame.\nAdjacent frames: Allow the next byte when ready returns after the stop interval. In a testbench, hold valid with the next byte until the handshake, then check that the start edge follows a full high stop bit.","code":{"lang":"verilog","s":"IDLE: TX = 1\nOn valid AND ready: record data, enter START\nSend 0, then data[0] through data[7], then 1\nHold each bit for CLKS_PER_BIT ticks\nReturn to IDLE after the stop bit","m":"// Core sequence inside a clocked process.\n// Reset clears busy, tick and bit_no. TX is busy ? frame[bit_no] : 1'b1.\nif (!busy && tx_valid) begin\n  frame \u003c= {1'b1, tx_data, 1'b0};\n  busy \u003c= 1'b1;\n  tick \u003c= 0;\n  bit_no \u003c= 0;\nend else if (busy) begin\n  if (tick == CLKS_PER_BIT - 1) begin\n    tick \u003c= 0;\n    if (bit_no == 9) busy \u003c= 1'b0;\n    else bit_no \u003c= bit_no + 1'b1;\n  end else tick \u003c= tick + 1;\nend","d":"module uart_tx #(\n  parameter integer CLKS_PER_BIT = 5208 // Must be >= 1.\n)(\n  input wire clk,\n  input wire rst_n,\n  input wire tx_valid,\n  input wire [7:0] tx_data,\n  output wire tx_ready,\n  output wire tx\n);\n  reg busy;\n  reg [9:0] frame;\n  reg [3:0] bit_no;\n  integer tick;\n\n  assign tx_ready = !busy;\n  assign tx = busy ? frame[bit_no] : 1'b1;\n\n  always @(posedge clk or negedge rst_n) begin\n    if (!rst_n) begin\n      busy   \u003c= 1'b0;\n      frame  \u003c= 10'h3ff;\n      bit_no \u003c= 4'd0;\n      tick   \u003c= 0;\n    end else if (!busy) begin\n      if (tx_valid) begin\n        frame  \u003c= {1'b1, tx_data, 1'b0};\n        bit_no \u003c= 4'd0;\n        tick   \u003c= 0;\n        busy   \u003c= 1'b1;\n      end\n    end else if (tick == CLKS_PER_BIT - 1) begin\n      tick \u003c= 0;\n      if (bit_no == 4'd9)\n        busy \u003c= 1'b0;\n      else\n        bit_no \u003c= bit_no + 1'b1;\n    end else begin\n      tick \u003c= tick + 1;\n    end\n  end\nendmodule"}}},{"id":"soc-u3-q2","subject":"soc","unit":3,"number":2,"q":"Write Verilog code for SPI Controller.","ans":{"s":"SPI mode 0 idles SCLK low. Select slave, present MOSI MSB first, sample MISO on each rising edge and advance MOSI on falling edges.","m":"Mode 0: SCLK idles low, CS asserts low, and the master sends bit 7 first. MOSI must be valid before the first rising edge.\nTransfer: Sample MISO on each rising edge and advance MOSI on each falling edge. Half-period timing gives fSCLK=fclk/(2×HALF_DIV).\nFinish: Latch the byte after eight samples, complete the last falling edge and release CS after the hold interval. Pulse done once. Check slave setup and hold specifications.","d":"Mode and pins: The example is an 8-bit full-duplex SPI master in mode 0. CPOL=0 sets SCLK low when idle, and CPHA=0 samples on the first rising edge. CS is active low.\nStart: When idle, accept a start strobe, latch tx_data, drive MOSI with bit 7 and pull CS low. This presents the first data bit before the first sample edge.\nTiming: Toggle SCLK after HALF_DIV system clock cycles, so fSCLK=fclk/(2×HALF_DIV). If fclk is 48 MHz and HALF_DIV is 4, SCLK is 6 MHz.\nRising edge: Sample MISO into rx_shift and increment the number of received bits. Sampling is synchronous to the controller’s source clock and depends on slave timing relative to SCLK.\nFalling edge: Shift the transmit register and present the next MOSI bit. Once eight samples exist, capture rx_data on the final falling edge instead of shifting again.\nFinish: Keep CS low through the programmed half-period hold, then raise CS and pulse done. Observe the slave’s CS high time before starting again.\nVerification: Test known transmit/receive data, count eight rising edges and inspect CS, SCLK and MOSI setup and hold intervals.","code":{"lang":"verilog","s":"When idle and start: CS low, SCLK low, MOSI = TX bit 7\nEvery half-period: toggle SCLK\nRising edge: capture MISO\nFalling edge: advance MOSI or finish after eight samples\nAfter the final CS hold interval: CS high and done","m":"// Mode 0 transfer tick. Start logic already lowered CS and preloaded MOSI.\nif (busy && half_tick) begin\n  if (ending) begin\n    cs_n \u003c= 1'b1; busy \u003c= 1'b0; done \u003c= 1'b1;\n  end else if (!sclk) begin\n    sclk \u003c= 1'b1;\n    rx_shift \u003c= {rx_shift[6:0], miso};\n    samples \u003c= samples + 1'b1;\n  end else begin\n    sclk \u003c= 1'b0;\n    if (samples == 8) begin\n      rx_data \u003c= rx_shift;\n      ending \u003c= 1'b1;\n    end else begin\n      tx_shift \u003c= {tx_shift[6:0], 1'b0};\n      mosi \u003c= tx_shift[6];\n    end\n  end\nend","d":"module spi_master_mode0 #(\n  parameter integer HALF_DIV = 4 // Must be >= 1.\n)(\n  input wire clk,\n  input wire rst_n,\n  input wire start,\n  input wire [7:0] tx_data,\n  input wire miso,\n  output reg cs_n,\n  output reg sclk,\n  output reg mosi,\n  output reg busy,\n  output reg done,\n  output reg [7:0] rx_data\n);\n  reg [7:0] tx_shift, rx_shift;\n  reg [3:0] samples;\n  reg ending;\n  integer half_count;\n\n  always @(posedge clk or negedge rst_n) begin\n    if (!rst_n) begin\n      cs_n \u003c= 1'b1;\n      sclk \u003c= 1'b0;\n      mosi \u003c= 1'b0;\n      busy \u003c= 1'b0;\n      done \u003c= 1'b0;\n      ending \u003c= 1'b0;\n      tx_shift \u003c= 8'd0;\n      rx_shift \u003c= 8'd0;\n      rx_data \u003c= 8'd0;\n      samples \u003c= 4'd0;\n      half_count \u003c= 0;\n    end else begin\n      done \u003c= 1'b0;\n      if (!busy) begin\n        if (start) begin\n          cs_n \u003c= 1'b0;\n          busy \u003c= 1'b1;\n          ending \u003c= 1'b0;\n          tx_shift \u003c= tx_data;\n          rx_shift \u003c= 8'd0;\n          mosi \u003c= tx_data[7];\n          samples \u003c= 4'd0;\n          half_count \u003c= 0;\n        end\n      end else if (half_count == HALF_DIV - 1) begin\n        half_count \u003c= 0;\n        if (ending) begin\n          cs_n \u003c= 1'b1;\n          busy \u003c= 1'b0;\n          done \u003c= 1'b1;\n        end else if (!sclk) begin\n          sclk \u003c= 1'b1;\n          rx_shift \u003c= {rx_shift[6:0], miso};\n          samples \u003c= samples + 1'b1;\n        end else begin\n          sclk \u003c= 1'b0;\n          if (samples == 4'd8) begin\n            rx_data \u003c= rx_shift;\n            ending \u003c= 1'b1;\n          end else begin\n            tx_shift \u003c= {tx_shift[6:0], 1'b0};\n            mosi \u003c= tx_shift[6];\n          end\n        end\n      end else begin\n        half_count \u003c= half_count + 1;\n      end\n    end\n  end\nendmodule"}}},{"id":"soc-u3-q3","subject":"soc","unit":3,"number":3,"q":"Write Verilog for Clocking and Timing Peripheral.","ans":{"s":"Prescale the clock into a synchronous enable. Count enable ticks, emit a one-clock match pulse and reload.","m":"Prescaler: Every PRESCALE enabled source clocks, clear the prescale count and assert tick for one clock.\nTimer: Advance only on prescale expiry. At PERIOD_TICKS, clear the timer and pulse irq. The interval is PRESCALE × PERIOD_TICKS / fclk.\nExample and control: At 50 MHz, divide by 50 and count 1000 ticks for 1 ms. Disable freezes counters, and reset clears them. A register-mapped version can add sticky status.","d":"Purpose: A synchronous timing peripheral produces a periodic tick and a slower match/interrupt pulse. Both counters use the same source clock to avoid creating an unnecessary clock domain.\nPrescale: The prescaler runs from zero to PRESCALE−1 and then clears. A terminal count generates one tick every PRESCALE source cycles while enabled.\nTimer count: At each prescaler expiration, the second counter advances. When it reaches PERIOD_TICKS−1 at that tick, clear it and pulse irq. Both output pulses default low on other clock cycles.\nRate example: At 50 MHz with PRESCALE=50, the prescaled tick is 1 MHz. PERIOD_TICKS=1000 gives a match every 1 ms, corresponding to 1 kHz.\nControl and reset: While enable is low, both counts freeze. A reset clears them and both pulse outputs. Parameters must be positive.\nSoC integration: Replace constants with writable registers if a memory-mapped design needs reconfiguration. Add sticky flag and interrupt enable registers for firmware. Safely cross the pulse or use a handshake if the consumer is in another clock domain.\nVerification: Check exact intervals, enable pause/resume and reset. Exercise both parameters equal to one.","code":{"lang":"verilog","s":"On reset: clear prescaler and timer\nWhile enabled: increment prescaler\nAt prescaler terminal count: issue tick and clear it\nOn each tick: increment timer\nAt timer terminal count: issue IRQ and clear timer","m":"// In the clocked process, tick and irq default low each cycle.\nif (enable) begin\n  if (pre == PRESCALE - 1) begin\n    pre \u003c= 0;\n    tick \u003c= 1'b1;\n    if (elapsed == PERIOD_TICKS - 1) begin\n      elapsed \u003c= 0;\n      irq \u003c= 1'b1;\n    end else elapsed \u003c= elapsed + 1;\n  end else pre \u003c= pre + 1;\nend","d":"module periodic_timer #(\n  parameter integer PRESCALE = 50,       // >= 1\n  parameter integer PERIOD_TICKS = 1000  // >= 1\n)(\n  input wire clk,\n  input wire rst_n,\n  input wire enable,\n  output reg tick,\n  output reg irq\n);\n  integer pre;\n  integer elapsed;\n\n  always @(posedge clk or negedge rst_n) begin\n    if (!rst_n) begin\n      pre \u003c= 0;\n      elapsed \u003c= 0;\n      tick \u003c= 1'b0;\n      irq \u003c= 1'b0;\n    end else begin\n      tick \u003c= 1'b0;\n      irq \u003c= 1'b0;\n      if (enable) begin\n        if (pre == PRESCALE - 1) begin\n          pre \u003c= 0;\n          tick \u003c= 1'b1;\n          if (elapsed == PERIOD_TICKS - 1) begin\n            elapsed \u003c= 0;\n            irq \u003c= 1'b1;\n          end else begin\n            elapsed \u003c= elapsed + 1;\n          end\n        end else begin\n          pre \u003c= pre + 1;\n        end\n      end\n    end\n  end\nendmodule"}}},{"id":"soc-u3-q4","subject":"soc","unit":3,"number":4,"q":"Write assertion based verification code for FSM based Traffic Light controller.","ans":{"s":"SVA checks reset, legal states, conflict-free lamps, correct sequence and hold-until-timeout. Cover one full state cycle.","m":"States: Verify NS green, NS yellow, all-red, EW green, EW yellow, all-red and return. Use separate codes for the two all-red phases.\nSafety: Assert legal states, one known lamp per direction, correct lamp decoding and no simultaneous active directions.\nTransitions: A timeout must advance to the specified successor at the next clock. Without timeout, the state holds.\nCoverage: Check reset separately and cover a full cycle with the intended timeout configuration.","d":"Assumptions: A clocked six-state controller uses NS_G → NS_Y → AR_NE → EW_G → EW_Y → AR_EN → NS_G. The two all-red states preserve direction. Lamps are encoded as {red, yellow, green}. The example checker assumes the DUT resets to NS_G.\nSampling: Assertions use the rising edge of clk. Disable normal operating checks during active-low reset and separately verify the reset-state contract.\nSafety properties: Check legal state values, known lamp vectors and exactly one asserted lamp per direction. Ensure neither direction shows green or yellow while the other direction is also active.\nOutput decode: Overlapping implication checks lamps on the same sample as state. In an all-red state, both lamp vectors must be red.\nTransitions: Nonoverlapping implication checks the successor at the next sample after timeout. With no timeout, the next sample must show the same state.\nCoverage: Cover a complete cycle including both all-red states and a return to NS_G. Match any bounded coverage window to the configured timeouts.\nIntegration: Bind or instantiate the checker with the DUT’s exact encoding. Use an SVA-capable simulator or formal tool. Adapt reset behavior if the design specifies an all-red startup.","code":{"lang":"systemverilog","s":"Assert reset drives the default state\nAssert legal states and exactly one lamp per direction\nAssert each lamp output matches the state\nAssert two directions never show green/yellow simultaneously\nAssert timeout advances to the legal successor, otherwise hold\nCover one full traffic-light cycle","m":"// Requires default clocking and reset disable in the checker.\nassert property (state == NS_G && timeout |=> state == NS_Y);\nassert property (state == NS_Y && timeout |=> state == AR_NE);\nassert property (state == AR_NE && timeout |=> state == EW_G);\nassert property (!timeout |=> $stable(state));\nassert property (!(ns_lamp[1:0] != 2'b00 &&\n                   ew_lamp[1:0] != 2'b00));","d":"module traffic_light_sva (\n  input logic clk, rst_n, timeout,\n  input logic [2:0] state,\n  input logic [2:0] ns_lamp, ew_lamp // {red, yellow, green}\n);\n  localparam logic [2:0] NS_G  = 3'd0, NS_Y  = 3'd1,\n                         AR_NE = 3'd2, EW_G  = 3'd3,\n                         EW_Y  = 3'd4, AR_EN = 3'd5;\n  localparam logic [2:0] R = 3'b100, Y = 3'b010, G = 3'b001;\n\n  default clocking cb @(posedge clk);\n  endclocking\n\n  assert property (!rst_n |=> state == NS_G);\n\n  assert property (disable iff (!rst_n)\n    state inside {NS_G, NS_Y, AR_NE, EW_G, EW_Y, AR_EN});\n  assert property (disable iff (!rst_n)\n    !$isunknown({ns_lamp, ew_lamp}) &&\n    $onehot(ns_lamp) && $onehot(ew_lamp));\n  assert property (disable iff (!rst_n)\n    !(ns_lamp[1:0] != 2'b00 && ew_lamp[1:0] != 2'b00));\n\n  assert property (disable iff (!rst_n)\n    state == NS_G |-> ns_lamp == G && ew_lamp == R);\n  assert property (disable iff (!rst_n)\n    state == NS_Y |-> ns_lamp == Y && ew_lamp == R);\n  assert property (disable iff (!rst_n)\n    state == EW_G |-> ns_lamp == R && ew_lamp == G);\n  assert property (disable iff (!rst_n)\n    state == EW_Y |-> ns_lamp == R && ew_lamp == Y);\n  assert property (disable iff (!rst_n)\n    (state == AR_NE || state == AR_EN) |->\n      ns_lamp == R && ew_lamp == R);\n\n  assert property (disable iff (!rst_n) !timeout |=> $stable(state));\n  assert property (disable iff (!rst_n)\n    state == NS_G && timeout |=> state == NS_Y);\n  assert property (disable iff (!rst_n)\n    state == NS_Y && timeout |=> state == AR_NE);\n  assert property (disable iff (!rst_n)\n    state == AR_NE && timeout |=> state == EW_G);\n  assert property (disable iff (!rst_n)\n    state == EW_G && timeout |=> state == EW_Y);\n  assert property (disable iff (!rst_n)\n    state == EW_Y && timeout |=> state == AR_EN);\n  assert property (disable iff (!rst_n)\n    state == AR_EN && timeout |=> state == NS_G);\n\n  cover property (disable iff (!rst_n)\n    (state == NS_G && timeout) ##1\n    (state == NS_Y) ##[0:1000] (state == NS_Y && timeout) ##1\n    (state == AR_NE) ##[0:1000] (state == AR_NE && timeout) ##1\n    (state == EW_G) ##[0:1000] (state == EW_G && timeout) ##1\n    (state == EW_Y) ##[0:1000] (state == EW_Y && timeout) ##1\n    (state == AR_EN) ##[0:1000] (state == AR_EN && timeout) ##1\n    (state == NS_G));\nendmodule"}}},{"id":"soc-u3-q5","subject":"soc","unit":3,"number":5,"q":"Explain BIST concept for testing.","ans":{"s":"BIST generates stimulus and checks responses on chip. Logic BIST uses PRPG, scan and MISR. Memory BIST uses read/write sequences such as March tests.","m":"Definition: BIST generates and checks test operations on the chip. A controller starts the test and reports pass or fail.\nLBIST: A PRPG supplies scan patterns. A MISR compacts responses into a signature compared with a known good value.\nMBIST: A March sequence performs ordered memory writes and reads to detect targeted faults.\nTrade-off: BIST reduces external tester data and can run at speed, while adding hardware and test power.","d":"Principle: Built-in self-test (BIST) adds stimulus generation, response checking and test control to the chip. A controller selects test mode, runs patterns and reports completion and status.\nLogic BIST setup: A pseudorandom pattern generator, commonly based on an LFSR, supplies test bits to internal scan chains. Scan shifting loads the state and a capture cycle observes the logic response.\nLogic response: A multiple-input signature register compresses captured responses. Compare the final signature with the known good signature. Unknown responses and aliasing need consideration.\nMemory BIST: A state machine writes specified patterns and reads them back in an ordered address sweep. A March test alternates read/write operations and ascending or descending traversal.\nFault example: Writing zero then one to each cell and checking the stored values can reveal stuck-at faults. More comprehensive March sequences target selected transition and coupling faults.\nBenefits: Internal patterns reduce tester data volume and can support at-speed or in-field diagnostics where allowed.\nLimits: BIST adds area and test power. Coverage depends on pattern count and selected fault models, so additional production tests may still be needed."}},{"id":"soc-u3-q6","subject":"soc","unit":3,"number":6,"q":"Explain different challenges in SOC testing and verification.","ans":{"s":"Verify intended behavior and test manufactured silicon. Use simulation/formal/CDC, then scan/ATPG, MBIST, boundary scan and silicon diagnostics.","m":"Verification: Exercise IP integration, firmware, shared buses, clock/reset crossings and voltage transitions. Use simulation, assertions, formal tools, emulation and coverage.\nManufacturing test: Improve internal access with scan, ATPG and MBIST. Boundary scan helps test chip-to-board connections, while analog blocks may need specialized routines.\nClosure: Track functional coverage separately from fault coverage. Balance test time, power and diagnosis, especially for at-speed patterns. Use the remaining coverage gaps to guide additional tests.","d":"Different goals: Verification checks whether RTL and integration implement the specification. Manufacturing test seeks physical defects in fabricated parts using well-defined fault models.\nVerification scale: Multiple IP blocks, firmware, concurrent bus traffic, cache sharing and interrupts create interleavings that isolated block tests miss. Detect deadlocks, data ordering errors and incorrect access control.\nDomain challenges: Clock and reset crossings can cause metastability or incoherent data. Power sequencing introduces states that need isolation, retention and correct wake-up behavior.\nVerification methods: Combine directed tests, constrained-random stimulus, assertions, formal checks and CDC/RDC analysis. Use emulation or FPGA prototypes for long software workloads and track functional and code coverage.\nManufacturing access: Embedded logic and memory are hard to observe at device pins. Scan chains expose internal state, ATPG targets stuck-at or transition faults, and MBIST exercises dense memory arrays.\nProduction trade-offs: At-speed patterns and many simultaneous toggles can stress the power grid. Test compression, power-aware ATPG and dedicated macro test modes manage test time, power and diagnosis.\nResult evaluation: Report verification coverage for intended behavior and separate fault coverage for modeled manufacturing defects. Review remaining holes in both."}}]},{"title":"Floor Planning","questions":[{"id":"soc-u4-q1","subject":"soc","unit":4,"number":1,"q":"Compare Abutted and Non-abutted floorplan techniques.","ans":{"s":"Abutted blocks touch and align terminals, which supports dense layouts. Non-abutted blocks reserve channels for routing, buffers and access.","m":"Abutted: Adjacent blocks share an edge with aligned boundary pins or short routes. It saves channel area and suits repeated tiles, but limits pin escape and late interconnect changes.\nNon-abutted: A reserved channel supports routing, buffers, power straps and pin access. It handles less regular layouts at the cost of area and potentially longer links.\nChoice: Check pin alignment, routing tracks, timing, power and physical rules.","d":"Abutted geometry: Neighboring block outlines touch or share a planned boundary, subject to legal boundary rules. Aligned pins can connect directly or with short top-level wires, and repeated tile designs fit compactly.\nAbutted benefits: Short links and no reserved channels can save die area and inter-block wire delay. The scheme is attractive for regular tiles with boundary pin alignment and well-defined top-level metal use.\nAbutted limitations: Poor pin alignment or pin access can create severe local congestion. It is harder to change pin order or fit extra buffers, feedthroughs and power connections after block implementation.\nNon-abutted geometry: Physical channels separate blocks. Their widths are planned from routing tracks, power straps, buffer requirements and keep-out distances.\nNon-abutted benefits: Channels give room for pin escape, engineering changes and top-level routes. A clear path can simplify integration of irregular macros and many cross-block nets.\nNon-abutted costs: Wider channels increase area and can lengthen wire paths or add delay. Over-the-block routing can still be permitted on selected layers in either approach.\nDecision criteria: Compare pin alignment, available layers, DRC spacing, timing, channel overflow and macro or package constraints.","fig":"\u003csvg role=\"img\" aria-label=\"Abutted and non-abutted floorplans\" viewBox=\"0 0 620 130\" xmlns=\"http://www.w3.org/2000/svg\">\u003cg fill=\"#152637\" stroke=\"#547697\">\u003crect x=\"30\" y=\"25\" width=\"110\" height=\"56\"/>\u003crect x=\"140\" y=\"25\" width=\"110\" height=\"56\"/>\u003crect x=\"330\" y=\"25\" width=\"110\" height=\"56\"/>\u003crect x=\"490\" y=\"25\" width=\"110\" height=\"56\"/>\u003c/g>\u003cg text-anchor=\"middle\" fill=\"#e9f5ff\" font-size=\"14\">\u003ctext x=\"85\" y=\"57\">Block A\u003c/text>\u003ctext x=\"195\" y=\"57\">Block B\u003c/text>\u003ctext x=\"385\" y=\"57\">Block A\u003c/text>\u003ctext x=\"545\" y=\"57\">Block B\u003c/text>\u003ctext x=\"140\" y=\"111\">Abutted: shared edge\u003c/text>\u003ctext x=\"465\" y=\"111\">Non-abutted: channel\u003c/text>\u003c/g>\u003cpath d=\"M440 52h50m-43-5l-7 5 7 5m36-10 7 5-7 5\" fill=\"none\" stroke=\"#8ed5ff\"/>\u003c/svg>"}},{"id":"soc-u4-q2","subject":"soc","unit":4,"number":2,"q":"Explain different floorplan control parameters.","ans":{"s":"Control die/core size, aspect ratio, utilization, rows/tracks, macro locations, I/O pins, halos, blockages, channels and power grid.","m":"Geometry: Set die/core limits, aspect ratio, target utilization and whitespace. Define cell sites and routing tracks.\nPlacement: Fix macro orientations and pin positions, and use halos and blockages to reserve access and routes.\nPower and package: Align I/O with package constraints and plan power domains, rings and straps.\nReview: Evaluate estimated wire length, congestion, pin access, timing and IR drop before freezing the floorplan. Adjust macro spacing before detailed placement.","d":"Outline controls: Die and core dimensions, setbacks and aspect ratio set geometry. Cell utilization and whitespace targets reserve room for placement, buffers, growth and routability.\nMacro controls: Choose linked macro positions and orientations so pins face communicating logic. Halos clear congested edges, and channels separate blocks when routes need more tracks.\nPlaceable grid: Rows follow legal cell sites and compatible orientations. Routing uses technology-layer tracks and via rules. I/O pin placements must align with legal access points and package constraints.\nReserved regions: Placement blockages prevent or limit cell placement, while routing blockages reserve layers or protect fixed geometry. Voltage areas restrict cells to an assigned power domain.\nPower plan: Identify pad or bump positions, supply domains and routes to macro pins and cell rows. Reserve space and metal for straps, rings and via arrays.\nEvaluation: Estimate half-perimeter wire length, placement density, routing overflow, pin accessibility, timing and power-grid voltage drop. Adjust parameters before placement is locked.\nExample: If two SRAMs face a narrow shared channel, rotate or separate them and reserve upper-layer access where allowed to relieve congestion."}},{"id":"soc-u4-q3","subject":"soc","unit":4,"number":3,"q":"What is Partitioning? Explain need of partitioning & briefly explain rules of partitioning","ans":{"s":"Partition into manageable blocks with balanced resources and few cross-block nets. Keep related/critical logic together, define clear interfaces and respect hierarchy, timing and power.","m":"Purpose: Partition a large design into blocks that can be implemented and verified independently.\nRules: Keep tightly connected and critical logic together, minimize weighted crossing nets, balance area and pin demand, and respect power domains, hierarchy and test access.\nInterface: Specify clocks, resets, protocol and timing budgets. Add CDC or isolation circuitry where required.\nValidation: Review top-level timing, connectivity, congestion and power after the split.","d":"Definition: Partitioning divides a circuit or system into implementable groups. A hypergraph models instances as vertices and multi-pin nets as hyperedges to represent connectivity.\nWhy partition: Large designs are easier to verify, synthesize, place and route in blocks. Teams can work independently, reusable IP stays isolated, and timing and power can be budgeted per interface.\nMinimize crossing cost: Group strongly connected units. Assign greater cut cost to timing-critical, high-fanout or wide nets where appropriate. Avoid splitting dense logic merely to form equal block counts.\nBalance resources: Meet cell area, macro count, pin count and power budgets. A small low-area block can still be unusable if it receives far more crossings than its boundary permits.\nRespect constraints: Keep required hierarchy and hard macros, honor clock and voltage domains, and define isolation, CDC or reset synchronizers if a crossing is required.\nClean interfaces: Define protocol, widths, timing budgets, clocks and resets. Register an interface where architecture and latency allow, and preserve scan/test access.\nRefinement: Use graph-based search and refinement, then check timing, congestion, connectivity and power at chip level. An example is clustering a processor core with its closely coupled cache."}},{"id":"soc-u4-q4","subject":"soc","unit":4,"number":4,"q":"Explain different Inputs and Outputs of Floorplan.","ans":{"s":"Inputs: netlist, constraints, tech/cell LEF, macro shapes and connectivity, package/I/O and power constraints. Outputs: die/core, rows, macro/pin coordinates, blockages and power plan.","m":"Inputs: Mapped netlist, SDC, Liberty, technology and macro LEF, package/I/O requirements, power intent and utilization targets.\nOutputs: Die/core boundaries, rows and tracks, fixed macro locations, I/O pin positions, halos, blockages and the initial power network.\nHandoff: Export a physical database or DEF for placement and routing. Review utilization, routing supply, congestion and macro pin access before using the floorplan downstream. Confirm that planned power entry is compatible with packaging.","d":"Logical and timing inputs: A mapped netlist specifies hierarchy and connectivity. SDC supplies clocks and timing requirements. Timing/power libraries help estimate path delay, cell load and energy.\nPhysical inputs: Technology LEF supplies layers, vias and sites. Cell/macro LEF defines sizes, pin shapes and obstructions. Fixed macro restrictions, bump maps and package requirements constrain locations.\nPower and design targets: Supply-domain boundaries, UPF, power/ground access and expected current guide the power grid. Target die size, core utilization, routing layers and aspect ratio bound the first implementation.\nOutline outputs: The floorplan chooses core and die boundaries, row positions and routing track grids. I/O pins or pads receive legal locations and layers.\nPlacement outputs: Macros have positions and orientations. Halos, channel reservations, blockages and voltage areas constrain the downstream placer and router.\nPower outputs: The initial plan specifies supply entry, strap or ring geometry and rail connectivity, along with preliminary power estimates.\nExchange: Export physical information through DEF or a tool database. Review area, utilization, wire-length and congestion reports before placement continues."}},{"id":"soc-u4-q5","subject":"soc","unit":4,"number":5,"q":"Explain different placement aspects in brief like Die size estimation, Core area calculation and Aspect ratio determination.","ans":{"s":"Estimate core ≈ usable cell area budget / target utilization + fixed exclusions. With r=W/H, W=√(rA), H=√(A/r). Add edge/pad margins for die size.","m":"Area: Estimate placeable core area as standard-cell area divided by utilization. Add disjoint fixed and blocked area. At 0.60 mm² of cells, 60% utilization and 0.25 mm² exclusions, Acore≈1.25 mm².\nShape: For W/H=r, use W=√(rAcore) and H=√(Acore/r). A square core is about 1.118 mm per side.\nDie: Add I/O and edge margins, snap to legal grids, and verify congestion and package limits. Include seal-ring and pad clearances where required.","d":"Cell demand: Sum the mapped standard-cell area and reserve space for buffers, clock-tree insertion, spare cells and future changes. Assess hard-macro footprints and placement blockages separately.\nUtilization convention: When utilization U is defined over placeable area, estimate Acore ≈ Astd/U + Amacro + Ablocked. Exclusion terms must be disjoint or corrected for overlap to avoid counting the same area twice.\nWorked estimate: For Astd=0.60 mm² and U=0.60, placeable area is 1.00 mm². Adding 0.25 mm² for disjoint nonplaceable space gives a 1.25 mm² core.\nAspect ratio: With r = W/H, W = √(rAcore) and H = √(Acore/r). A square 1.25 mm² core has sides about 1.118 mm. A wider rectangle may align better with a row of macros.\nDie size: Add core-to-die setbacks, pad/bump access, seal ring and package allowances. Snap dimensions to legal grids and check package and reticle constraints.\nIterate: Estimate congestion, timing, pin access and power-grid space. Equal-area floorplans can route differently because track capacity and crossing demand depend on shape."}},{"id":"soc-u4-q6","subject":"soc","unit":4,"number":6,"q":"Explain different placement aspects in brief like coarse placement, I/O pad placement, legalization, placement blockage and keep-out margin.","ans":{"s":"Coarse placement optimizes approximate positions. Legalization aligns cells without overlaps. I/O pads connect package, blockages reserve areas and halos keep macro edges clear.","m":"Coarse placement: Assign provisional positions to meet wire length, density, congestion and timing goals.\nLegalization: Snap to legal rows and sites, resolve overlap and preserve macro keep-outs. Detailed placement performs local improvements.\nI/O placement: Account for package pinout, signal grouping, supply and ESD needs.\nBlockage and halo: A blockage excludes or limits cells in a defined region. A macro halo reserves edge clearance for routing or power access.","d":"Global placement: Find approximate coordinates minimizing estimated wire length, density, congestion and critical-path delay. This stage can temporarily allow off-grid and overlapping cell positions.\nLegalization: Move cells to compatible rows and discrete sites, resolve all overlaps and respect fixed macros and placement constraints. Keep displacement small to preserve global-placement quality.\nDetailed placement: Reorder or swap cells locally to improve wire length and timing while preserving legality. Check pin access and avoid creating congestion hotspots.\nI/O pad planning: Choose physical pad or bump positions based on package pin order, signal groups, supply entries, ESD structures and differential pairs. Pin-order choices can shorten internal routes.\nPlacement blockages: Reserve an area for future resources or sensitive geometry. Hard blockages prevent placement, soft restrictions can allow specific purposes, and partial blockages limit density according to the tool.\nKeep-out margin: A macro halo leaves clearance around its edges for routing access, noise isolation, clearance rules or robust power connections.\nExample: Insert a halo around an SRAM and place its data bus on the facing side, then verify blockage legality and post-placement congestion."}},{"id":"soc-u4-q7","subject":"soc","unit":4,"number":7,"q":"Explain fixed-die routing and variable-die routing and Pin Planning.","ans":{"s":"Fixed-die routing fits within known outlines. Variable-die routing can grow channels/die. Pin planning sets layer, side, order, spacing and alignment.","m":"Fixed die: Route within established boundaries and track capacity. Resolve congestion through legal layers, rerouting or placement changes.\nVariable die: Allow channels or outline to grow. More room improves routing capacity at the cost of area and possible delay.\nPin planning: Set side, position, layer and pitch. Align neighboring pins and keep bus order to reduce crossings. Check package constraints, pin escape, timing and congestion.","d":"Fixed-die routing: Die/core and block geometry are known and remain fixed. Routing must fit allowed metal layers and tracks, around obstacles, while satisfying spacing and other rules.\nFixed-die detail: A global router estimates demand by region before detailed routing assigns specific tracks and vias. If regions overflow, try rerouting, changing placement or revising allowed resources within the fixed outline.\nVariable-die routing: Outline or channel widths are allowed to change to fit required routes. Expanding a channel improves track availability and pin access but consumes more die area and can add wire capacitance.\nChoice: Package, reticle and area constraints favor a fixed-die approach. An early study with adjustable dimensions can use variable-die planning to establish a feasible route budget.\nPin planning: Assign boundary side, layer, location and geometry for each interface pin. Include package order, clock needs, power entry, macro obstructions and layer availability.\nPin alignment: Face communicating blocks and preserve bus bit order to reduce crossings. Provide adequate pitch and legal vias so detailed pin escape works.\nValidation: Check estimated congestion and timing with logical connectivity and actual physical pin shapes."}}]},{"title":"Physical Design and Implementation","questions":[{"id":"soc-u5-q1","subject":"soc","unit":5,"number":1,"q":"Draw and explain in brief Synthesis flow.","ans":{"s":"RTL + libraries + constraints → elaborate → derive and optimize logic → map to cells → verify → netlist/reports.","m":"Elaboration: Read RTL and constraints, resolve hierarchy and generate logic, and infer registers, arithmetic and control.\nMapping: Optimize generic logic and map it into the target standard-cell library under timing, area and power goals.\nChecks: Check equivalence, clock and path coverage, timing and area. Add scan or preserve test logic as required by the methodology.\nHandoff: Export the mapped netlist, updated constraints and reports. These files are inputs to physical implementation.","d":"Inputs: Provide synthesizable RTL, top module and parameters, technology libraries and SDC. Compile for the intended operating conditions and record any macros treated as black boxes.\nRead and elaborate: Resolve hierarchy, parameters, generate branches and signal widths. Diagnose unresolved references, accidental latches and conflicting drivers before mapping.\nInfer hardware: Convert the procedural code to logic for registers, muxes, arithmetic, memories or state machines. Simplify constants, remove unused logic and share equivalent hardware where allowed.\nTechnology mapping: Choose standard cells and sequential elements from the target library under timing, area and power objectives. Re-structure logic, adjust drive strengths and optimize high-fanout paths.\nDFT and equivalence: Integrate or preserve scan/BIST structures according to the flow. Prove mapped logic equivalent to the validated design under appropriate mode and black-box assumptions.\nReview: Inspect setup timing, unconstrained paths, utilization estimates and power. Iterate timing constraints or RTL when targets cannot be met.\nOutputs: Export mapped netlist, implementation constraints and optimization/timing/area reports for physical design. Accurate routing and parasitic effects are addressed downstream.","fig":"\u003csvg role=\"img\" aria-label=\"RTL + Liberty + SDC then Read / elaborate design then Infer registers, arithmetic and logic then Technology mapping and optimization then Equivalence, timing and area checks then Mapped netlist and implementation constraints\" viewBox=\"0 0 620 252\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect x=\"45\" y=\"0\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"19\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">RTL + Liberty + SDC\u003c/text>\u003cpath d=\"M310 29 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"42\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"61\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Read / elaborate design\u003c/text>\u003cpath d=\"M310 71 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"84\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"103\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Infer registers, arithmetic and logic\u003c/text>\u003cpath d=\"M310 113 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"126\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"145\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Technology mapping and optimization\u003c/text>\u003cpath d=\"M310 155 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"168\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"187\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Equivalence, timing and area checks\u003c/text>\u003cpath d=\"M310 197 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"210\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"229\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Mapped netlist and implementation constraints\u003c/text>\u003c/svg>"}},{"id":"soc-u5-q2","subject":"soc","unit":5,"number":2,"q":"Draw and explain overview of backend VLSI Design Flow.","ans":{"s":"Backend: floorplan/PG → place → CTS → route → extraction → timing, power and layout sign-off → GDSII.","m":"Inputs and plan: Load netlist, constraints and physical libraries. Set die/core, macros, I/O, rows and power grid.\nImplement: Place and legalize cells, synthesize the clock tree, and globally then detail-route signals.\nClose: Extract RC, analyze setup/hold and power integrity, and repair violations with ECOs.\nDeliver: Check DRC/LVS and process-specific rules and stream out GDSII or OASIS with sign-off reports. Check that the final reports cover all required operating corners.","d":"Handoff: Import a technology-mapped netlist, SDC, Liberty views, LEF abstracts, power intent and process information. Verify that clocks, library cells and power connections are recognized.\nFloorplan: Choose die/core geometry, macro and I/O locations, rows and blockages. Build the initial power grid to support VDD and VSS connections.\nPlacement: Optimize estimated timing, density and wire length with global placement. Legalize cells to rows and sites and refine positions with detailed placement.\nClock tree: Insert clock buffers or inverters, route and balance sinks, and evaluate insertion delay, skew and transition. Adopt propagated clocks for later timing checks.\nRouting: Use global routing for capacity and route guides, then detailed routing for specific metal/via geometry. Repair physical and antenna issues.\nAnalysis and closure: Extract parasitic RC and analyze modes and corners for setup, hold, power integrity and reliability. Use ECOs to fix final issues without unnecessarily disrupting closed paths.\nSign-off: Run DRC/LVS and applicable density/fill checks. Export GDSII/OASIS and sign-off evidence for manufacturing. Confirm that exports match the sign-off revision.","fig":"\u003csvg role=\"img\" aria-label=\"Mapped netlist + libraries + constraints then Floorplan, I/O, macros and power grid then Global placement, legalization and refinement then Clock Tree Synthesis then Global and detailed signal routing then Parasitic extraction, timing and physical checks then GDSII / OASIS and sign-off reports\" viewBox=\"0 0 620 294\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect x=\"45\" y=\"0\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"19\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Mapped netlist + libraries + constraints\u003c/text>\u003cpath d=\"M310 29 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"42\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"61\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Floorplan, I/O, macros and power grid\u003c/text>\u003cpath d=\"M310 71 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"84\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"103\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Global placement, legalization and refinement\u003c/text>\u003cpath d=\"M310 113 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"126\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"145\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Clock Tree Synthesis\u003c/text>\u003cpath d=\"M310 155 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"168\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"187\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Global and detailed signal routing\u003c/text>\u003cpath d=\"M310 197 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"210\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"229\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Parasitic extraction, timing and physical checks\u003c/text>\u003cpath d=\"M310 239 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"252\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"271\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">GDSII / OASIS and sign-off reports\u003c/text>\u003c/svg>"}},{"id":"soc-u5-q3","subject":"soc","unit":5,"number":3,"q":"Compare Frontend & Backend SOC design.","ans":{"s":"Frontend specifies and verifies logical behavior. Backend meets timing/routing/power and creates physical mask geometry. Both iterate around constraints.","m":"Frontend: Define architecture and RTL, integrate IP, verify behavior and synthesize a technology-mapped netlist. Track functional coverage, equivalence and early PPA.\nBackend: Use the mapped netlist and constraints to floorplan, place, build clocks, route, extract and sign off a manufacturable layout. Track actual timing, power integrity and physical checks.\nFeedback: Layout can reveal the need to restructure RTL or revise constraints. Check equivalence after affected changes.","d":"Frontend objective: Translate requirements into logically correct hardware. Define interfaces, memory map, clock and reset behavior and hardware/software partitioning.\nFrontend activities: Design and integrate RTL, write testbenches, assert properties and analyze CDC/RDC. Synthesize a mapped netlist and integrate test features at the appropriate stage.\nFrontend measures: Functional coverage, simulation and formal results, testability and early estimates of timing, power and area drive progress. Substantial layout parasitics are still only approximated.\nBackend objective: Implement actual geometry that meets manufacturability, physical timing and power goals using the mapped netlist and design constraints.\nBackend activities: Floorplan, plan supplies, place, build the clock tree, route, extract RC and fix timing, congestion and layout violations. Check IR/EM, DRC and LVS before tapeout.\nBackend measures: Post-route setup and hold slack, skew, congestion, IR drop, EM, DRC/LVS, final area and physical layout quality.\nConnection: Constraints and equivalence link the stages. An infeasible layout may require a revised partition or RTL pipeline, while the resulting netlist must continue to meet the logical intent."}},{"id":"soc-u5-q4","subject":"soc","unit":5,"number":4,"q":"Draw and explain in brief Netlist to GDSII layout flow.","ans":{"s":"Netlist + LEF/Liberty/SDC → floorplan → placement → CTS → global/detailed routing → sign-off → GDSII.","m":"Import and floorplan: Load the mapped netlist, timing, LEF and power data. Set die/core, macros, I/O and the supply grid.\nConstruct: Place standard cells, build the clock tree, then globally and detail-route the design.\nVerify: Extract RC, repair timing, run IR/EM and physical checks including DRC/LVS.\nStream-out: Merge approved layout views and use the process layer map to export GDSII. Sign-off reports accompany the geometry.","d":"Read physical inputs: Import the gate-level netlist, technology and macro LEF, timing corners, SDC, power intent and extraction technology. Validate connectivity and units.\nPlan the core: Set macro placement, rows, pin locations and die outline. Build power straps, rings and standard-cell rails connected to supply pads or bumps.\nPlace and clock: Optimize and legalize cell coordinates, then insert a clock tree to control slew, insertion delay and skew. Recheck timing using propagated clocks.\nRoute signals: Global routing finds guides and estimates capacity. Detailed routing assigns tracks, vias and legal metal shapes. Fix pin-access, antenna and short/spacing issues.\nExtract and repair: Extract wire resistance and capacitance and close setup/hold timing across the required modes and corners. Check IR drop and EM, and rerun checks after ECOs.\nSign off geometry: Apply required density/fill procedures and verify DRC/LVS. Merge approved standard-cell/macro GDS views and use the foundry layer map for final stream-out.\nOutput: GDSII represents layout shapes and hierarchy. STA, physical-check reports and netlists accompany it as separate items.","fig":"\u003csvg role=\"img\" aria-label=\"Mapped netlist + libraries + constraints then Floorplan, I/O, macros and power grid then Global placement, legalization and refinement then Clock Tree Synthesis then Global and detailed signal routing then Parasitic extraction, timing and physical checks then GDSII / OASIS and sign-off reports\" viewBox=\"0 0 620 294\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect x=\"45\" y=\"0\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"19\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Mapped netlist + libraries + constraints\u003c/text>\u003cpath d=\"M310 29 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"42\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"61\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Floorplan, I/O, macros and power grid\u003c/text>\u003cpath d=\"M310 71 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"84\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"103\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Global placement, legalization and refinement\u003c/text>\u003cpath d=\"M310 113 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"126\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"145\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Clock Tree Synthesis\u003c/text>\u003cpath d=\"M310 155 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"168\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"187\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Global and detailed signal routing\u003c/text>\u003cpath d=\"M310 197 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"210\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"229\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">Parasitic extraction, timing and physical checks\u003c/text>\u003cpath d=\"M310 239 v11 m-4 -4 l4 4 4 -4\" stroke=\"#8ed5ff\" fill=\"none\"/>\u003crect x=\"45\" y=\"252\" width=\"530\" height=\"28\" rx=\"6\" fill=\"#152637\" stroke=\"#547697\"/>\u003ctext x=\"310\" y=\"271\" fill=\"#e9f5ff\" font-size=\"14\" text-anchor=\"middle\">GDSII / OASIS and sign-off reports\u003c/text>\u003c/svg>"}},{"id":"soc-u5-q5","subject":"soc","unit":5,"number":5,"q":"What are the different roles of Physical design engineer?","ans":{"s":"Physical design engineers own floorplan, placement/CTS/routing, PPA closure, sign-off, ECOs and handoff.","m":"Planning: Maintain inputs and scripts, estimate die geometry, and plan macro, I/O and power resources.\nImplementation: Drive placement, legalization, clock tree synthesis and routing while monitoring timing and congestion.\nClosure: Analyze STA, IR/EM and physical checks. Implement and validate ECOs.\nHandoff: Coordinate with design, test, packaging and manu
