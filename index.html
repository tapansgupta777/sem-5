 gates, analog and test macros as needed. Preserve software-visible address maps and interfaces, bridge off-board devices, synthesize, place/route and program the FPGA. Run boot code, drivers and long software workloads, inspect buses and state using embedded logic analyzers, and record any prototype-only timing differences. FPGA execution gives higher throughput than typical RTL simulation and helps detect HW/SW issues. It cannot validate foundry parasitics, analog behavior, ASIC timing sign-off, die area or final power."}},{"id":"soc-u5-q11","subject":"soc","unit":5,"number":11,"q":"Discuss in brief various Low Power SOC Techniques.","ans":{"s":"Dynamic: clock gating, activity reduction and DVFS. Leakage: power gating, multi-Vt and memory sleep. UPF describes isolation, retention and level shifting.","m":"Cut switching by gating idle clocks, reducing toggles and controlling voltage/frequency. Reduce leakage with shutoff domains and high-threshold cells. Multi-voltage/power domains need level shifters, isolation, retention and safe ordered transitions.","d":"Switching power is approximately αCV²f, with α defined as the rate of charging events per cycle. Clock gating removes needless register/clock transitions, operand isolation prevents useless datapath activity, and DVFS reduces supply or frequency to fit workload. Voltage scaling gives a quadratic dynamic power benefit but reduces timing margin, so safe operating points must be characterized. Multi-Vt libraries reserve fast low-Vt cells for critical paths and use high-Vt elsewhere to reduce leakage. Power gating switches off an idle domain, and SRAM sleep modes save standby power. Use isolation when an off domain could drive active logic, retention when state must survive, and level shifters at incompatible voltage boundaries. Capture domains and strategies in UPF and verify sequencing, functional and timing behavior across all power states."}}]}]}],"figures":{"cmos-u1-q1":"\u003cfigure class=\"study external-fig -width=\"1.5\"/>\u003cpath d=\"M480.03,28.34 L486,32 L480.03,35.66\" fill=\"none\" stroke=\"#8eb09e\" stroke-width=\"1.5\"/>\u003ctext x=\"311\" y=\"59\" text-anchor=\"middle\" fill=\"#dce9dc\" font-size=\"11\">\u003ctspan x=\"311\" dy=\"0\">Firmware converts ADC count to °C\u003c/tspan>\u003c/text>\u003cpath d=\"M136,64 L486,64\" fill=\"none\" stroke=\"#8eb09e\" stroke-width=\"1.5\"/>\u003ctext x=\"311\" y=\"91\" text-anchor=\"middle\" fill=\"#dce9dc\" font-size=\"11\">\u003ctspan x=\"311\" dy=\"0\">GPIO or serial display bus → LCD\u003c/tspan>\u003c/text>\u003cpath d=\"M136,96 L486,96\" fill=\"none\" stroke=\"#8eb09e\" stroke-width=\"1.5\"/>\u003c/svg>\u003c/div>\u003cfigcaption>Temperature sensing and LCD display\u003c/figcaption>\u003c/figure>"},"syllabus":"https://chatgpt.com/library?account_id=personal&file_id=libfile_a659c1ec12e48191a306963406fe3fbf","refs":[["SPPU 2024-pattern syllabus","https://chatgpt.com/library?account_id=personal&file_id=libfile_a659c1ec12e48191a306963406fe3fbf"],["NXP UM10139 · LPC214x user manual","https://www.nxp.com/docs/en/user-guide/UM10139.pdf"],["Arm · ARM7TDMI technical reference manual","https://documentation-service.arm.com/static/5e8e1323fd977155116a3129"],["Intel · 1985 Microcontroller Handbook","https://www.bitsavers.org/components/intel/_dataBooks/1985_Intel_Microcontroller_Handbook.pdf"],["Microchip · AT89S52 product documentation","https://www.microchip.com/en-us/product/at89s52"],["Arm · AMBA protocol specifications","https://www.arm.com/architecture/system-architectures/amba/amba-specifications"],["OpenROAD · RTL-to-GDS flow tutorial","https://openroad-flow-scripts.readthedocs.io/en/latest/tutorials/FlowTutorial.html"],["AMD · FPGA configurable logic block resources","https://docs.amd.com/r/en-US/ug574-ultrascale-clb/CLB-Resources"],["Accellera · Unified Power Format and low-power design","https://www.accellera.org/images/resources/videos/UPF_for_Low_Power_2014.pdf"],["Sutherland, Sproull and Harris · Logical Effort","https://web.stanford.edu/class/archive/ee/ee371/ee371.1066/handouts/logicalEffort.pdf"],["MOSFET cross-section · Wikimedia Commons","https://commons.wikimedia.org/wiki/File:MOSFET_Structure.svg"],["NMOS I–V characteristics · Wikimedia Commons","https://commons.wikimedia.org/wiki/File:MOSFET_enhancement-mode_n-channel.svg"]]}</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById("study-data").textContent);
const subjects=data.subjects;
const modes={d:"Detailed",m:"Medium",s:"Abstracted"};
let globalMode="m";
const overrides=new Map();
const items=subjects.flatMap(subject=>subject.units.flatMap(unit=>unit.questions));
const byId=new Map(items.map(item=>[item.id,item]));
const subjectById=new Map(subjects.map(subject=>[subject.id,subject]));
const app=document.getElementById("app");
const global=document.getElementById("global");
const query=document.getElementById("search");
const clear=document.getElementById("clear");
const results=document.getElementById("results");
const resultCount=document.getElementById("result-count");
const list=document.getElementById("search-list");
const jump=document.getElementById("jump");
let visibleSubject="", matches=[], activeMatch=-1;
const icon={cmos:'<path d="M2 13h5l2-6 4 12 2-6h7"/>',asic:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 1v5m6-5v5M9 18v5m6-5v5M1 9h5m-5 6h5m12-6h5m-5 6h5"/>',mca:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m7 9 3 3-3 3m6 0h4"/>',soc:'<rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M9 6h6M6 9v6m12-6v6m-9 3h6"/>'};
const esc=value=>String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const normalize=value=>String(value).normalize("NFKD").toLowerCase().replace(/[\u0300-\u036f]/g,"").replace(/[–—−]/g,"-");
const searchIndex=items.map(item=>{
 const subject=subjectById.get(item.subject);
 const unit=subject.units[item.unit-1];
 const question=normalize(item.q);
 return {item, question, text:normalize([item.q,item.number,item.id,subject.name,subject.code,subject.id,unit.title,item.ans.s,item.ans.m,item.ans.d,...Object.values(item.ans.code||{})].join(" "))};
});
function buttons(mode,label,scope){
 return '<div class="modes" role="group" aria-label="'+esc(label)+'">'+Object.entries(modes).map(([key,name])=>'<button type="button" data-'+scope+'="'+key+'" aria-pressed="'+(key===mode)+'">'+name+'</button>').join("")+'</div>';
}
function updateButtons(element,key,scope){
 element.querySelectorAll("[data-"+scope+"]").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset[scope]===key)));
}
const keywords=new Set("auto bit break case char const continue default do else enum extern for goto if inline int long register return sbit short signed sizeof static struct switch typedef union unsigned void volatile while always assign begin end endmodule module parameter localparam input output inout integer wire reg logic posedge negedge endcase generate endgenerate initial property endproperty assert disable iff sequence endsequence repeat forever wait task endtask function endfunction set create_clock set_input_delay set_output_delay set_false_path set_multicycle_path set_clock_uncertainty setup hold then send read write loop until configure when repeat".split(" "));
const tokenPattern=/(\/\*[\s\S]*?\*\/|\/\/[^\n]*|^[ \t]*#[ \t]*(?:include|define|ifdef|ifndef|endif)[^\n]*|"(?:\\.|[^"\\])*"|(?:\d+)?'[sS]?[bBdDhHoO][\da-fA-FxXzZ?_]+|'(?:\\.|[^'\\])*'|\b(?:0[xX][\da-fA-F]+|\d+(?:\.\d+)?)[uUlL]*\b|\b[a-zA-Z_][\w$]*\b)/gm;
function highlight(raw){
 let out="",start=0;
 for(const token of raw.matchAll(tokenPattern)){
  const value=token[0];
  out+=esc(raw.slice(start,token.index));
  const cls=/^\/[/*]/.test(value)?"c":value.trimStart().startsWith("#")?"p":/^\d|^'[sS]?[bBdDhHoO]/.test(value)?"n":/^['"]/.test(value)?"s":keywords.has(value.toLowerCase())?"k":"";
  out+=cls?'<span class="tok-'+cls+'">'+esc(value)+'</span>':esc(value);
  start=token.index+value.length;
 }
 return out+esc(raw.slice(start));
}
function formatText(value){
 return value.trim().split(/\n\s*\n/).map(paragraph=>'<p>'+esc(paragraph)+'</p>').join("");
}
function getMode(item){return overrides.get(item.id)||globalMode;}
function renderAnswer(item){
 const mode=getMode(item);
 const ans=item.ans;
 const lang=mode==="s"?"Pseudocode":({c:"Embedded C",verilog:"Verilog",systemverilog:"SystemVerilog",tcl:"Tcl / SDC",upf:"UPF",text:"Algorithm",pseudo:"Algorithm"}[String(ans.code?.lang).toLowerCase()]||ans.code?.lang||"Code");
 const raw=ans.code?.[mode];
 const figures=mode==="s"?"":((ans.fig?'<figure class="study"><div class="diagram">'+ans.fig+'</div></figure>':"")+(data.figures[item.id]||''));
 return formatText(ans[mode])+(raw?'<div class="codebox"><div class="codebar"><span>'+esc(lang)+'</span><button type="button" class="copy" data-copy>Copy</button></div><pre><code>'+highlight(raw)+'</code></pre></div>':"")+figures;
}
function tile(subject){
 return '<a class="tile" style="--subject:'+subject.color+'" href="#'+subject.id+'"><span class="tile-icon"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">'+icon[subject.id]+'</svg></span><span><span class="tile-name">'+esc(subject.name)+'</span><span class="tile-meta">'+subject.units.length+' units · '+subject.count+' questions</span></span><span class="tile-arrow" aria-hidden="true">→</span></a>';
}
function home(){
 app.innerHTML='<section class="home"><h1>Sem 5 study guide</h1><p class="subtitle">'+items.length+' questions across '+subjects.length+' subjects. Choose a subject to begin.</p><div class="subject-grid">'+subjects.map(tile).join("")+'</div><p class="syllabus">SPPU · 2024 pattern · <a href="'+esc(data.syllabus)+'" target="_blank" rel="noopener">View syllabus ↗</a></p></section>';
}
function card(item){
 return '<article class="question" id="'+item.id+'" tabindex="-1"><div class="q-top"><a class="q-id" href="#'+item.id+'" aria-label="Link to Unit '+item.unit+' Question '+item.number+'">U'+item.unit+' · Q'+item.number+'</a><h3 class="q-title">'+esc(item.q)+'</h3></div><div class="local">'+buttons(getMode(item),"Answer level for Unit "+item.unit+" Question "+item.number,"local")+'</div><div class="answer">'+renderAnswer(item)+'</div></article>';
}
function subjectPage(subject){
 const unitLink=(unit,index)=>'<a class="unit-link" href="#'+subject.id+'-u'+(index+1)+'"><span>0'+(index+1)+'</span>'+esc(unit.title)+'</a>';
 app.innerHTML='<div style="--subject:'+subject.color+'"><a class="crumb" href="#home">← All subjects</a><section class="subject-head"><p class="course">'+esc(subject.code)+'</p><h1>'+esc(subject.name)+'</h1><p class="subtitle">'+subject.units.length+' syllabus units · '+subject.count+' question-bank entries</p></section><div class="reader"><details class="index" '+(matchMedia("(min-width: 791px)").matches?"open":"")+'><summary>Unit index</summary>'+subject.units.map(unitLink).join("")+'<a class="source" href="'+esc(subject.source)+'" target="_blank" rel="noopener">Original question bank ↗</a></details><div>'+subject.units.map((unit,index)=>'<section class="unit" id="'+subject.id+'-u'+(index+1)+'"><h2 class="unit-head"><span>UNIT '+(index+1)+'</span>'+esc(unit.title)+'</h2>'+unit.questions.map(card).join("")+'</section>').join("")+'</div></div></div>';
}
function route(){
 const hash=location.hash.slice(1);
 if(hash==="top"){if(!visibleSubject){home();visibleSubject="home";}window.scrollTo(0,0);return;}
 const id=hash.split("-")[0];
 const subject=subjectById.get(id);
 if(!subject){
  if(visibleSubject!=="home"){home();visibleSubject="home";}
  window.scrollTo(0,0);return;
 }
 if(visibleSubject!==id){subjectPage(subject);visibleSubject=id;}
 if(hash===id){window.scrollTo(0,0);return;}
 const target=document.getElementById(hash);
 if(target){
  target.scrollIntoView({block:"start"});
  if(byId.has(hash))target.focus({preventScroll:true});
 }
}
function swap(cardEl,item){
 updateButtons(cardEl,getMode(item),"local");
 cardEl.querySelector(".answer").innerHTML=renderAnswer(item);
}
function setGlobal(mode){
 globalMode=mode;
 overrides.clear();
 updateButtons(global,mode,"global");
 for(const cardEl of app.querySelectorAll(".question"))swap(cardEl,byId.get(cardEl.id));
}
function closeSearch(){results.hidden=true;query.setAttribute("aria-expanded","false");query.removeAttribute("aria-activedescendant");activeMatch=-1;}
function runSearch(){
 const typed=normalize(query.value).trim();
 clear.hidden=!typed;
 if(!typed){matches=[];closeSearch();return;}
 const terms=typed.split(/\s+/);
 const hits=searchIndex.filter(entry=>terms.every(term=>entry.text.includes(term)));
 const rank=entry=>entry.question.includes(typed)?2:terms.every(term=>entry.question.includes(term))?1:0;
 hits.sort((a,b)=>rank(b)-rank(a)||Number(b.item.subject===visibleSubject)-Number(a.item.subject===visibleSubject));
 matches=hits;
 activeMatch=-1;
 query.removeAttribute("aria-activedescendant");
 resultCount.textContent=hits.length?hits.length+" "+(hits.length===1?"match":"matches"):"No questions found";
 list.innerHTML=matches.map(({item},index)=>'<button class="result" type="button" tabindex="-1" role="option" aria-selected="false" id="result-'+index+'" data-result="'+index+'"><small>'+esc(subjectById.get(item.subject).code)+' · U'+item.unit+' Q'+item.number+'</small>'+esc(item.q)+'</button>').join("");
 results.hidden=false;
 query.setAttribute("aria-expanded","true");
}
function choose(index){
 const item=matches[index]?.item;
 if(!item)return;
 query.value="";
 clear.hidden=true;
 closeSearch();
 query.blur();
 if(location.hash==="#"+item.id)route();
 else location.hash="#"+item.id;
}
function navigateResults(delta){
 if(!matches.length)return;
 activeMatch=activeMatch<0?(delta>0?0:matches.length-1):(activeMatch+delta+matches.length)%matches.length;
 const current=list.children[activeMatch];
 for(const element of list.children)element.setAttribute("aria-selected",String(element===current));
 query.setAttribute("aria-activedescendant",current.id);
 current.scrollIntoView({block:"nearest"});
}
async function copyCode(button,raw){
 try {
  if(!navigator.clipboard)throw new Error("Clipboard API unavailable");
  await navigator.clipboard.writeText(raw);
 } catch {
  const field=document.createElement("textarea");
  field.value=raw;field.style.position="fixed";field.style.opacity="0";document.body.append(field);field.select();
  const ok=document.execCommand("copy");field.remove();button.focus();
  if(!ok){button.textContent="Select code to copy";return;}
 }
 button.textContent="Copied";
 setTimeout(()=>button.textContent="Copy",1200);
}
global.innerHTML=buttons(globalMode,"Answer level for all questions","global");
global.addEventListener("click",event=>{const mode=event.target.closest("[data-global]")?.dataset.global;if(mode)setGlobal(mode);});
app.addEventListener("click",event=>{
 const local=event.target.closest("[data-local]");
 if(local){const cardEl=local.closest(".question");overrides.set(cardEl.id,local.dataset.local);swap(cardEl,byId.get(cardEl.id));}
 const copy=event.target.closest("[data-copy]");
 if(copy){const item=byId.get(copy.closest(".question").id);copyCode(copy,item.ans.code[getMode(item)]);}
});
app.addEventListener("error",event=>{if(event.target.matches(".external-fig img"))event.target.hidden=true;},true);
query.addEventListener("input",runSearch);
query.addEventListener("focus",()=>{if(query.value.trim())runSearch();});
query.addEventListener("keydown",event=>{
 if(event.key==="Escape"){closeSearch();return;}
 if(event.key==="ArrowDown"||event.key==="ArrowUp"){
  event.preventDefault();if(results.hidden)runSearch();navigateResults(event.key==="ArrowDown"?1:-1);
 }
 if(event.key==="Enter"&&!results.hidden){event.preventDefault();choose(Math.max(0,activeMatch));}
});
clear.addEventListener("click",()=>{query.value="";runSearch();query.focus();});
list.addEventListener("mousedown",event=>event.preventDefault());
list.addEventListener("click",event=>{const hit=event.target.closest("[data-result]");if(hit)choose(Number(hit.dataset.result));});
document.addEventListener("click",event=>{if(!event.target.closest("#search-area"))closeSearch();});
document.addEventListener("focusin",event=>{if(!event.target.closest("#search-area"))closeSearch();});
document.addEventListener("keydown",event=>{
 if(event.key==="/"&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&!event.target.closest("input,textarea,[contenteditable]")){event.preventDefault();query.focus();}
});
jump.addEventListener("click",event=>{event.preventDefault();window.scrollTo(0,0);});
window.addEventListener("scroll",()=>{jump.hidden=scrollY<700;},{passive:true});
window.addEventListener("hashchange",route);
document.getElementById("refs").innerHTML=data.refs.map(([name,link])=>'<li><a href="'+esc(link)+'" target="_blank" rel="noopener">'+esc(name)+'</a></li>').join("");
route();
</script>
</body>
</html>
