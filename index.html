{"id":"cmos-u2-q8","subject":"cmos","unit":2,"number":8,"q":"Write the expressions for the overall gain, unity-gain bandwidth and slew rate of a two- stage Op-Amp.","ans":{"s":"|A0|≈gm1R1·gm6R2. ωu≈gm1/CC, GBW≈gm1/(2πCC). SR≈Iavailable/C.","m":"Gain · |A0|≈(gm1R1)(gm6R2), where R1 and R2 include the parallel output resistances and applicable loading of each stage.\nBandwidth · With dominant-pole compensation and adequate pole separation, ωu≈gm1/CC and GBW≈gm1/(2πCC).\nLarge-signal slope · Internal SR is approximately ITAIL/CC. The output may be limited by its source or sink current into CL. Use the lower limit and report positive and negative slew rates separately where they differ.","d":"Low-frequency gain · Call the first-stage output resistance R1≈ro2∥ro4 and second-stage output resistance R2≈ro6∥ro7∥RL. With a matched differential pair and mirror load the first-stage gain magnitude is roughly gm1R1, and the common-source gain is about gm6R2.\nOverall expression · Cascading the stages gives |A0|≈(gm1R1)(gm6R2). Keep the selected input and output sign convention when quoting signed open-loop gain. To express gain in dB, use 20log10|A0|.\nUnity-gain frequency · With a dominant pole and the higher pole and zero reasonably separated, ωu≈gm1/CC rad/s. Then GBW≈gm1/(2πCC) Hz. This follows from |A(jω)|≈A0ωp1/ω above the dominant pole and A0ωp1≈gm1/CC.\nSlew rate · A large differential step steers the tail current to one side. An ideal mirror-loaded first stage can charge CC at about ITAIL, giving SRinternal≈ITAIL/CC. Output drive can impose a separate limit of about Iout,available/CL.\nNumerical check · For gm1=120 µS, CC=2 pF and ITAIL=20 µA, the approximate GBW is 9.55 MHz and internal slew rate is 10 V/µs. Check both output polarities and load limits separately. Both calculations assume that the other loading and compensation poles do not dominate the response."}},{"id":"cmos-u2-q9","subject":"cmos","unit":2,"number":9,"q":"Explain PSRR of a two-stage Op-Amp. Explain how input offset voltage and CMRR of an Op-Amp are measured.","ans":{"s":"PSRR refers supply ripple to the input. Measure Vos by DC null/servo and CMRR by change of input-referred error with VCM.","m":"Supply rejection · Change one rail at a time and measure its output gain As. Input-referred PSRR=|Ad/As|, or 20log10 of this ratio in dB. Specify rail and frequency.\nInput offset · A servo holds output at a reference. The small differential input required at a fixed common-mode voltage gives the offset.\nCommon-mode rejection · Change both inputs together and record the change in required offset. CMRR≈|ΔVCM/ΔVos,eq|, equivalent to |Ad/Acm| in a small-signal gain measurement.","d":"Power-supply response · Perturb one supply rail at a time while holding the other fixed. At a chosen bias and frequency measure the output supply gain As=ΔVOUT/ΔVsupply. Keep the output convention consistent with the differential gain Ad measured at the same operating point.\nPSRR definition · Refer supply response to the input using PSRR=|Ad/As|=|ΔVsupply/ΔVos,eq|. Report PSRR+ and PSRR− when both rails matter, and compute dB with 20log10. The two-stage circuit has rail coupling through its bias network and stage load devices, so positive and negative rejection may differ.\nOffset measurement · Hold input common-mode voltage and bias fixed. Use a DC servo or high closed-loop gain fixture to keep VOUT near a reference. Measure the small differential input required to null the output error. That required input, with stated sign, gives the input offset.\nCMRR measurement · Vary both input voltages together and measure the change in the differential voltage required to hold the same VOUT. Then CMRR≈|ΔVCM/ΔVos,eq|. An AC alternative measures |Ad/Acm| at the same frequency.\nInterpretation · Quote the common-mode range, load, supply, and measurement frequency. The input-referred offsets can vary substantially across operating conditions."}},{"id":"cmos-u2-q10","subject":"cmos","unit":2,"number":10,"q":"Write the steps to design a two-stage CMOS Op-Amp for a given specification.","ans":{"s":"Set CC and tail current from stability/SR, gm1 from GBW, gm6 from load pole, then size and verify PVT.","m":"Targets · Start from VDD, load, gain, GBW, phase margin, slew, input/output range and power.\nDimensioning · Choose CC, set gm1≈2πGBW·CC, and choose tail current at least SR·CC. Size the second stage for the load pole and enough current into CL. Check overdrive and channel lengths for DC headroom and gain.\nChecks · Verify operating point, loop gain, transient settling and slew, noise, offset, rejection and corners. Adjust compensation and device geometry with the actual load.","d":"Specifications · Record supply voltage, output and input common-mode ranges, DC gain, GBW, phase margin, load capacitance, slew rate and power. Choose a concrete differential input topology and an output-stage bias approach consistent with the ranges.\nCompensation target · Pick CC and set gm1≈2π·GBW·CC. Choose gm6 and output bias so the nondominant pole remains above crossover for the largest intended CL. If the feed-forward zero is limiting, consider a series resistor near 1/gm6.\nCurrent sizing · Allow ITAIL≥SR·CC for internal slew and sufficient output source/sink current for SR·CL. Set overdrive voltages from available headroom. Strong-inversion sizing starts from W/L≈2ID/[μCoxVOV²]. Use process gm/ID curves where short-channel accuracy matters.\nGain and swing · Estimate |A0|≈gm1R1gm6R2. Increase appropriate channel lengths to raise output resistance, subject to bandwidth and area. Check that devices remain saturated at input and output extremes and that mirror current and bias settle correctly.\nVerification · Simulate bias and supply current, loop gain and phase margin with realistic feedback, gain and PSRR/CMRR, full-swing transient slew and settling, noise, and relevant process and mismatch corners. Recheck with extracted load and layout parasitics.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 305\" role=\"img\" aria-label=\"Two-stage CMOS op-amp with PMOS mirror load, NMOS second stage, and Miller capacitor\" style=\"display:block;width:100%;height:auto;max-width:680px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Two-stage CMOS op-amp with PMOS mirror load, NMOS second stage, and Miller capacitor\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"679\" height=\"304\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"141\" y=\"61\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"286\" y=\"61\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"141\" y=\"137\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"286\" y=\"137\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"194\" y=\"218\" width=\"90\" height=\"29\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"508\" y=\"137\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"489\" y=\"61\" width=\"92\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M168 43 H535 M168 43 V61 M313 43 V61 M535 43 V61 M168 87 V137 M313 87 V137 M535 87 V137 M168 163 V194 H313 V163 M239 194 V218 M239 247 V266 M535 163 V266 M221 266 H553 M229 273 H545 M239 280 H535\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M168 107 H115 V74 H141 M195 74 H286 M195 74 V107 H168\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M141 150 H100 M340 150 H373 M489 74 H451 M194 232 H153\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M313 113 H446 V150 H508 M535 113 H607\" fill=\"none\" stroke=\"#86efac\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M446 113 V195 H479 M487 184 V206 M479 184 V206 M487 195 H607 V113\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"168\" cy=\"107\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"313\" cy=\"113\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"446\" cy=\"113\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"535\" cy=\"113\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"239\" cy=\"194\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"352\" y=\"33\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"168\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M3\u003c/text>\u003ctext x=\"313\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M4\u003c/text>\u003ctext x=\"168\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M1\u003c/text>\u003ctext x=\"313\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M2\u003c/text>\u003ctext x=\"85\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN−\u003c/text>\u003ctext x=\"391\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN+\u003c/text>\u003ctext x=\"438\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Vbp\u003c/text>\u003ctext x=\"133\" y=\"237\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Vbn\u003c/text>\u003ctext x=\"239\" y=\"238\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M5 · tail\u003c/text>\u003ctext x=\"535\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M6\u003c/text>\u003ctext x=\"535\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M7 · load\u003c/text>\u003ctext x=\"358\" y=\"107\" fill=\"#86efac\" font-size=\"13\" text-anchor=\"middle\">VX\u003c/text>\u003ctext x=\"622\" y=\"117\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VO\u003c/text>\u003ctext x=\"483\" y=\"222\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">CC\u003c/text>\u003ctext x=\"416\" y=\"296\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VSS\u003c/text>\u003c/svg>"}},{"id":"cmos-u2-q11","subject":"cmos","unit":2,"number":11,"q":"Explain how a CMOS inverter can be used as an amplifier. Describe its biasing and voltage gain. Define slew rate and power-supply rejection ratio (PSRR) of a two-stage op-amp.","ans":{"s":"Bias inverter at steep VTC. Av≈−(gmn+gmp)(ron∥rop∥RL). SR=max |dVOUT/dt|. PSRR=|Ad/Asupply|.","m":"Inverter bias · Set the gates near the steep VTC region with both MOSFETs conducting. The combined transconductance gives Av≈−(gmn+gmp)(ron∥rop∥RL).\nSlew rate · SR is the largest output slope under a large-signal step. Internal and load limits are approximately ITAIL/CC and Iavailable/CL.\nPSRR · Refer the rail-to-output change to the equivalent input using PSRR=|Ad/Asupply|. Specify the rail and frequency, and use 20log10 for dB. Positive and negative supply rails can have different responses.","d":"Circuit and DC bias · Tie the nMOS and pMOS gates as the input and their drains as the output. Bias the inverter at the steep VTC near its switching voltage so both devices conduct. An external bias supply or high-value output-to-input resistor with an AC-coupled signal can establish that point.\nVoltage-gain derivation · Both positive nMOS transconductance and reduction in pMOS pull-up contribute to net downward incremental output current (gmn+gmp)vin. The supply rails are AC ground, so KCL gives Av≈−(gmn+gmp)(ron∥rop∥RL), assuming both devices remain saturated.\nSlew rate definition · SR is the maximum slope |dVOUT/dt| during a large signal step. Give rising and falling results separately if output currents differ. For a Miller-compensated two-stage op-amp, an internal estimate is ITAIL/CC. The external load can impose Iavailable/CL.\nPSRR definition · Power-supply rejection quantifies output or equivalent input response to supply ripple. Using input-referred units, PSRR=|Ad/Asupply| where Asupply=ΔVOUT/ΔVrail. Convert to dB by 20log10.\nMeasurement context · Use a small AC input for gain and PSRR around a fixed operating point. Measure slew using a sufficiently large step to enter a current-limited region.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 192\" role=\"img\" aria-label=\"CMOS inverter biased as an analog common-source amplifier\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>CMOS inverter biased as an analog common-source amplifier\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"499\" height=\"191\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"228\" y=\"39\" width=\"64\" height=\"30\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"228\" y=\"118\" width=\"64\" height=\"30\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M260 20 V39 M260 69 V118 M260 148 V173 M128 57 H228 M128 57 V133 H228 M260 94 H371\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M244 173 H276 M250 179 H270 M256 185 H264\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"128\" cy=\"93\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"260\" cy=\"94\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"260\" y=\"16\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"260\" y=\"59\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">PMOS\u003c/text>\u003ctext x=\"260\" y=\"138\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">NMOS\u003c/text>\u003ctext x=\"80\" y=\"98\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VBIAS + vin\u003c/text>\u003ctext x=\"397\" y=\"100\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">vout\u003c/text>\u003ctext x=\"373\" y=\"144\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">Both devices are on\u003c/text>\u003c/svg>"}},{"id":"cmos-u2-q12","subject":"cmos","unit":2,"number":12,"q":"Which factors limit the slew rate?","ans":{"s":"SR≈I/C. Tail current/CC and output available current/CL can each set the limit. Positive and negative rates can differ.","m":"Current limit · A large input step steers the available bias current. The charging relation dV/dt=I/C sets the maximum slope.\nInternal limit · Tail or mirror current charges Miller CC, so SRinternal is often near ITAIL/CC. Bias asymmetry can make positive and negative rates unequal.\nOutput limit · The output branch supplies CL and parasitics. Its source or sink current determines another limit, approximately Iavailable/(CL+Cpar). Headroom and external loading may reduce available current.","d":"Large-signal origin · A large input step drives most tail current through one side of the differential input pair. The stage stops responding according to its small-signal transconductance, and the available charging current approaches a limit.\nInternal capacitance · The first stage must charge or discharge Miller compensation CC and associated node parasitics. Since I=C·dV/dt, the simple mirror-loaded estimate is SRinternal≈ITAIL/CC. Bias and mirror asymmetry can change this current for each direction.\nOutput capacitance · The second stage also must move CL and local parasitic capacitance. Its maximum source or sink current can set SRout≈Iavailable/(CL+Cpar). Use the more restrictive rate and check both polarities.\nOperating conditions · Bias-current limits, output transistor overdrive, proximity to rails, external resistive loading and current limiting can all lower the observed slope. Compensation extra poles affect recovery from the slewing interval and subsequent settling.\nPractical example · If internal slew is 10 V/µs while only 15 µA is available to charge a 3 pF load, the positive output limit is approximately 5 V/µs before additional parasitics. Increasing current or reducing capacitance improves slew at power or stability cost."}},{"id":"cmos-u2-q13","subject":"cmos","unit":2,"number":13,"q":"Draw and explain a two-stage CMOS operational amplifier with a neat circuit diagram, stating the function of each stage.","ans":{"s":"NMOS differential pair + PMOS mirror → high-gain CS second stage → output. CC around stage 2 stabilizes.","m":"First-stage circuit · M1/M2 form the differential pair and M5 supplies their tail current. Diode-connected M3 and mirror M4 convert branch current differences into one output node VX.\nSecond stage · VX drives common-source M6 against PMOS current-source M7, increasing gain and driving VOUT. The inverting nature of this stage determines the input-to-output polarity.\nStability · Connect Miller CC between VOUT and VX and show CL at VOUT. Bias currents determine transconductance, slew and headroom.","d":"Circuit layout on paper · Draw M1 and M2 as an NMOS differential pair, M5 as their shared tail current sink, and M3 and M4 as a PMOS mirror load. Mark M3 gate shorted to drain and its gate tied to M4. Take first-stage output VX at the M2–M4 drain junction.\nInput-stage function · The tail sets the total bias current. A differential input increases one drain current while decreasing the other. The mirror combines these changes at VX, giving a single-ended voltage and first-stage gain magnitude approximately gm1(ro2∥ro4).\nOutput-stage connection · Drive NMOS M6 gate from VX. Take VOUT at its drain with a PMOS current-source load M7. This common-source stage contributes negative gain and delivers charging/discharging current to CL.\nPolarity check · An increase at the right-hand input increases M2 drain current and reduces the mirrored pull-up relative to it. VX falls, M6 conducts less, and VOUT rises. Thus that input is noninverting for the shown circuit.\nCompensation and bias · Connect CC from VOUT to VX for Miller compensation. Label bias voltages for tail and PMOS output load. Overall DC gain is the product of the stage gains, while bias and saturation headroom set swing and current.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 305\" role=\"img\" aria-label=\"Two-stage CMOS op-amp with PMOS mirror load, NMOS second stage, and Miller capacitor\" style=\"display:block;width:100%;height:auto;max-width:680px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Two-stage CMOS op-amp with PMOS mirror load, NMOS second stage, and Miller capacitor\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"679\" height=\"304\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"141\" y=\"61\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"286\" y=\"61\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"141\" y=\"137\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"286\" y=\"137\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"194\" y=\"218\" width=\"90\" height=\"29\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"508\" y=\"137\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"489\" y=\"61\" width=\"92\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M168 43 H535 M168 43 V61 M313 43 V61 M535 43 V61 M168 87 V137 M313 87 V137 M535 87 V137 M168 163 V194 H313 V163 M239 194 V218 M239 247 V266 M535 163 V266 M221 266 H553 M229 273 H545 M239 280 H535\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M168 107 H115 V74 H141 M195 74 H286 M195 74 V107 H168\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M141 150 H100 M340 150 H373 M489 74 H451 M194 232 H153\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M313 113 H446 V150 H508 M535 113 H607\" fill=\"none\" stroke=\"#86efac\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M446 113 V195 H479 M487 184 V206 M479 184 V206 M487 195 H607 V113\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"168\" cy=\"107\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"313\" cy=\"113\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"446\" cy=\"113\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"535\" cy=\"113\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"239\" cy=\"194\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"352\" y=\"33\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"168\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M3\u003c/text>\u003ctext x=\"313\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M4\u003c/text>\u003ctext x=\"168\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M1\u003c/text>\u003ctext x=\"313\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M2\u003c/text>\u003ctext x=\"85\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN−\u003c/text>\u003ctext x=\"391\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN+\u003c/text>\u003ctext x=\"438\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Vbp\u003c/text>\u003ctext x=\"133\" y=\"237\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Vbn\u003c/text>\u003ctext x=\"239\" y=\"238\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M5 · tail\u003c/text>\u003ctext x=\"535\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M6\u003c/text>\u003ctext x=\"535\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M7 · load\u003c/text>\u003ctext x=\"358\" y=\"107\" fill=\"#86efac\" font-size=\"13\" text-anchor=\"middle\">VX\u003c/text>\u003ctext x=\"622\" y=\"117\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VO\u003c/text>\u003ctext x=\"483\" y=\"222\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">CC\u003c/text>\u003ctext x=\"416\" y=\"296\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VSS\u003c/text>\u003c/svg>"}},{"id":"cmos-u2-q14","subject":"cmos","unit":2,"number":14,"q":"Explain the need for Miller compensation in a two-stage op-amp. How does it improve the phase margin?","ans":{"s":"Miller CC splits poles. Dominant pole moves lower. A series nulling resistor may remove the RHP zero.","m":"Stability need · Two high-impedance stages can accumulate phase lag near unity loop gain, reducing phase margin.\nMiller effect · CC from second-stage input to output is effectively multiplied at the first node. The dominant pole moves lower, so crossover occurs when the other pole contributes less phase lag.\nReal circuit · Feed-forward through CC can add a right-half-plane zero. A suitable series resistor reduces its effect. Verify phase margin at the actual feedback factor and load.","d":"Phase-margin definition · In a negative-feedback system, measure loop phase at the frequency where the loop-gain magnitude is one. Phase margin is 180° plus that phase angle. Two closely spaced poles can bring phase near −180° at crossover, resulting in ringing or oscillation.\nCompensating capacitor · Connect CC across the inverting second stage from VOUT to VX. The first node sees an increased equivalent capacitance near CC(1+|A2|). This lowers the dominant pole and allows gain to roll off before the second pole adds substantial phase lag.\nPole splitting · In the conventional two-stage circuit, the interacting stage dynamics also tend to push the nondominant pole higher. If crossover approximately equals gm1/CC and only one additional pole matters, phase margin is roughly 90°−arctan(ωu/ωp2).\nZero correction · A feed-forward path through CC can produce an RHP zero around gm6/CC, adding phase lag. Set a series nulling resistor near 1/gm6 to remove it from the relevant range under the basic model.\nDesign validation · For the simple two-pole model, approximately 60° phase margin requires ωp2≈1.73ωu or higher. Verify actual loop-gain margins at the intended feedback factor and load, including parasitic poles and the zero.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 173\" role=\"img\" aria-label=\"Miller compensation between first-stage node and op-amp output\" style=\"display:block;width:100%;height:auto;max-width:620px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Miller compensation between first-stage node and op-amp output\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"619\" height=\"172\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"39\" y=\"70\" width=\"146\" height=\"42\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"271\" y=\"70\" width=\"146\" height=\"42\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"509\" y=\"70\" width=\"72\" height=\"42\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M185 91 H271 M417 91 H509\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M226 91 V40 H337 M337 30 V50 M345 30 V50 M345 40 H462 V91\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"226\" cy=\"91\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"462\" cy=\"91\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"112\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Differential stage\u003c/text>\u003ctext x=\"344\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Inverting stage\u003c/text>\u003ctext x=\"545\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Load CL\u003c/text>\u003ctext x=\"341\" y=\"24\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">Miller CC\u003c/text>\u003ctext x=\"226\" y=\"127\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VX\u003c/text>\u003ctext x=\"462\" y=\"127\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"307\" y=\"152\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">CC bridges the high-impedance first-stage node and output\u003c/text>\u003c/svg>"}}]},{"title":"Digital CMOS Logic & Circuit Design","questions":[{"id":"cmos-u3-q1","subject":"cmos","unit":3,"number":1,"q":"Explain the structure and operation of a CMOS inverter with a neat diagram.","ans":{"s":"PMOS up, NMOS down. Gates share VIN and drains share VOUT. 0→1, 1→0.","m":"Circuit: PMOS connects VDD to VOUT, NMOS connects VOUT to ground, and both gates take VIN. Tie each bulk to its supply rail.\nLow input: PMOS on and NMOS off, so CL charges to VDD.\nHigh input: NMOS on and PMOS off, so CL discharges to ground.\nTransition: Output delay comes from charging or discharging CL. Both devices can briefly conduct, adding short-circuit current. After settling, the remaining supply current is leakage.","d":"Circuit: Connect PMOS source and n-well to VDD and NMOS source and p-body to VSS. Join the gates at VIN and the drains at VOUT. The PMOS forms the pull-up network, the NMOS forms the pull-down network, and CL represents output diffusion, wiring and fanout loads.\nInput low: VIN=0 gives PMOS VSG=VDD and NMOS VGS=0. PMOS charges CL to VDD, while the NMOS is off. At steady state the output remains high and the PMOS carries essentially no current into a purely capacitive load.\nInput high: VIN=VDD turns the PMOS off and turns the NMOS on. NMOS discharges CL to ground. Thus the truth table is 0→1 and 1→0.\nDuring switching: There is a VIN range where both devices conduct. One current component charges or discharges CL, and a separate direct supply-to-ground component produces short-circuit power. Finite pull-up and pull-down resistances make transitions take time.\nWhy complementary: Each network actively restores its own output rail, giving full output swing and good noise margins. In the ideal steady-state model one device is off, so there is no direct DC path. Real devices still leak. Draw and label the four nodes and both bulk ties.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 550 205\" role=\"img\" aria-label=\"Static CMOS inverter\" style=\"display:block;width:100%;height:auto;max-width:550px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Static CMOS inverter\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"549\" height=\"204\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"254\" y=\"46\" width=\"67\" height=\"30\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"254\" y=\"121\" width=\"67\" height=\"30\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M287 24 V46 M287 76 V121 M287 151 V177 M264 177 H311 M272 184 H303 M279 191 H296 M128 100 H214 M214 61 V136 M214 61 H245 M214 136 H254 M287 100 H426\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"214\" cy=\"100\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"287\" cy=\"100\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"249\" cy=\"61\" r=\"4\" fill=\"#fb7185\"/>\u003ctext x=\"287\" y=\"19\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"287\" y=\"66\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">PMOS\u003c/text>\u003ctext x=\"287\" y=\"141\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">NMOS\u003c/text>\u003ctext x=\"105\" y=\"105\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN\u003c/text>\u003ctext x=\"449\" y=\"104\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"399\" y=\"149\" fill=\"#94a3b8\" font-size=\"11\" text-anchor=\"middle\">Body ties: PMOS→VDD\u003c/text>\u003ctext x=\"402\" y=\"166\" fill=\"#94a3b8\" font-size=\"11\" text-anchor=\"middle\">NMOS→GND\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q2","subject":"cmos","unit":3,"number":2,"q":"Explain the voltage transfer characteristic (VTC) of a CMOS inverter. Define the switching threshold (VM).","ans":{"s":"VTC is DC VOUT vs VIN. VM is the intersection VOUT=VIN. Matched devices center it near VDD/2.","m":"VTC: Plot the settled output versus DC input. It starts near VDD, falls quickly in the switching region and ends near zero.\nThreshold: VM is the point where VIN=VOUT, read from the diagonal intersection.\nModel: In saturation, equate βn(VM−VTn)² and βp(VDD−VM−|VTp|)². With r=√(βp/βn), VM=[VTn+r(VDD−|VTp|)]/(1+r).\nSizing: Symmetric effective strengths and thresholds place VM near VDD/2. A stronger PMOS raises VM.\nReading the plot: Use the point where the falling VTC crosses the line VOUT = VIN to read VM.","d":"Plot: Sweep VIN from 0 to VDD with sufficient settling time and plot VOUT against VIN. The output stays near VDD at small input, drops steeply through the transition, and approaches ground at large input. In the transition the net output current is zero, so pull-up and pull-down currents balance.\nSwitching threshold: VM is defined by VIN=VOUT=VM. Find it graphically by intersecting the falling VTC with the rising line VOUT=VIN. It is different from either individual MOS threshold and from the two −1-slope noise-margin points.\nSquare-law derivation: With both devices on and saturated at VM and channel-length modulation ignored, equate βn(VM−VTn)² and βp(VDD−VM−|VTp|)². Here β=μCoxW/L. The positive square root gives VM=[VTn+r(VDD−|VTp|)]/(1+r), where r=√(βp/βn).\nDesign consequence: Equal β and equal threshold magnitudes place VM at VDD/2. Strengthening the PMOS shifts the intersection toward higher VIN because the NMOS needs more input drive to balance it. A wider PMOS can compensate for lower hole mobility.\nExam sketch: Mark VOH and VOL, the VIN and VOUT axes, the diagonal intersection and the steep negative-slope region.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 580 285\" role=\"img\" aria-label=\"CMOS inverter voltage transfer characteristic and switching/noise points\" style=\"display:block;width:100%;height:auto;max-width:580px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>CMOS inverter voltage transfer characteristic and switching/noise points\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"579\" height=\"284\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M73 226 H530 l-7 -4 m7 4 -7 4 M73 226 V33 l-4 7 m4 -7 4 7\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M73 48 H203 Q245 48 262 83 Q275 114 287 142 Q310 204 369 218 H508\" fill=\"none\" stroke=\"#5eead4\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M73 226 L507 47\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/>\u003cpath d=\"M247 69 V226 M322 191 V226 M286 140 V226\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"4 5\"/>\u003ccircle cx=\"247\" cy=\"68\" r=\"4\" fill=\"#fb7185\"/>\u003ccircle cx=\"322\" cy=\"192\" r=\"4\" fill=\"#fb7185\"/>\u003ccircle cx=\"286\" cy=\"140\" r=\"4\" fill=\"#93c5fd\"/>\u003ctext x=\"49\" y=\"32\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"528\" y=\"250\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN\u003c/text>\u003ctext x=\"123\" y=\"35\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOH≈VDD\u003c/text>\u003ctext x=\"461\" y=\"207\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOL≈0\u003c/text>\u003ctext x=\"246\" y=\"249\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIL\u003c/text>\u003ctext x=\"287\" y=\"248\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VM\u003c/text>\u003ctext x=\"325\" y=\"249\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIH\u003c/text>\u003ctext x=\"487\" y=\"68\" fill=\"#94a3b8\" font-size=\"13\" text-anchor=\"middle\">VOUT = VIN\u003c/text>\u003ctext x=\"246\" y=\"269\" fill=\"#fb7185\" font-size=\"10\" text-anchor=\"middle\">slope = −1\u003c/text>\u003ctext x=\"326\" y=\"269\" fill=\"#fb7185\" font-size=\"10\" text-anchor=\"middle\">slope = −1\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q3","subject":"cmos","unit":3,"number":3,"q":"Define noise margins NML and NMH. Explain how they are obtained from the VTC.","ans":{"s":"NML=VIL−VOL, NMH=VOH−VIH. VIL and VIH are VTC points with slope −1.","m":"Boundaries: Find the two −1-slope points on the VTC. The lower input is VIL and the higher is VIH. Mark the worst-case output levels VOL,max and VOH,min.\nEquations: NML=VIL,max−VOL,max and NMH=VOH,min−VIH,min. Unloaded ideal CMOS is often approximated by VOL≈0 and VOH≈VDD.\nMeaning: Each margin is the tolerated disturbance on one logic level. Use minimum margins over relevant operating conditions when assessing cascaded gates.","d":"Purpose: Noise margins quantify how far interconnect or circuit disturbances can move the output of one gate before the next gate misreads it. Evaluate the low and high states separately because an inverter can have an asymmetric VTC.\nInput boundaries: VIL,max is the largest input accepted as a logic 0; VIH,min is the smallest accepted as a logic 1. On the textbook VTC, label the two possible locations where dVOUT/dVIN=−1. The lower input value is VIL and the higher is VIH. The intermediate band has no guaranteed digital interpretation.\nOutput guarantees: VOL,max is the worst-case upper limit of a low output. VOH,min is the worst-case lower limit of a high output. Read the limits using the permitted input bands and load conditions, or take VOL≈0 and VOH≈VDD for unloaded ideal CMOS.\nCalculations: NML=VIL,max−VOL,max and NMH=VOH,min−VIH,min. For VIL=0.55 V, VIH=1.15 V, VOL=0.10 V and VOH=1.72 V, NML=0.45 V and NMH=0.57 V.\nInterpretation: Both margins must be positive for reliable cascading. Compare minimum margins over PVT and loading, and mark VIL and VIH separately from the switching intersection VM.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 580 285\" role=\"img\" aria-label=\"CMOS inverter voltage transfer characteristic and switching/noise points\" style=\"display:block;width:100%;height:auto;max-width:580px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>CMOS inverter voltage transfer characteristic and switching/noise points\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"579\" height=\"284\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M73 226 H530 l-7 -4 m7 4 -7 4 M73 226 V33 l-4 7 m4 -7 4 7\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M73 48 H203 Q245 48 262 83 Q275 114 287 142 Q310 204 369 218 H508\" fill=\"none\" stroke=\"#5eead4\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M73 226 L507 47\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/>\u003cpath d=\"M247 69 V226 M322 191 V226 M286 140 V226\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"4 5\"/>\u003ccircle cx=\"247\" cy=\"68\" r=\"4\" fill=\"#fb7185\"/>\u003ccircle cx=\"322\" cy=\"192\" r=\"4\" fill=\"#fb7185\"/>\u003ccircle cx=\"286\" cy=\"140\" r=\"4\" fill=\"#93c5fd\"/>\u003ctext x=\"49\" y=\"32\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"528\" y=\"250\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN\u003c/text>\u003ctext x=\"123\" y=\"35\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOH≈VDD\u003c/text>\u003ctext x=\"461\" y=\"207\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOL≈0\u003c/text>\u003ctext x=\"246\" y=\"249\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIL\u003c/text>\u003ctext x=\"287\" y=\"248\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VM\u003c/text>\u003ctext x=\"325\" y=\"249\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIH\u003c/text>\u003ctext x=\"487\" y=\"68\" fill=\"#94a3b8\" font-size=\"13\" text-anchor=\"middle\">VOUT = VIN\u003c/text>\u003ctext x=\"246\" y=\"269\" fill=\"#fb7185\" font-size=\"10\" text-anchor=\"middle\">slope = −1\u003c/text>\u003ctext x=\"326\" y=\"269\" fill=\"#fb7185\" font-size=\"10\" text-anchor=\"middle\">slope = −1\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q4","subject":"cmos","unit":3,"number":4,"q":"Explain static and dynamic power dissipation in a CMOS inverter. Write the expression for dynamic power.","ans":{"s":"Psw=αCLVDD²f. Transition overlap adds short-circuit power. Static power≈VDDIleak.","m":"Dynamic power: Charging and discharging CL dissipates CLVDD² per complete cycle. With α counting rising edges per clock, Psw=αCLVDD²f.\nShort-circuit term: Finite input transition time can turn both devices on briefly; Psc=VDD times average overlap current.\nStatic term: Pstatic≈VDDIleak even with a stable input. Subthreshold, gate-oxide and junction leakage contribute.\nDesign implication: Reduce supply, capacitance or activity and recheck delay and signal slew.","d":"Power components: Total average supply power is switching plus short-circuit plus static leakage. A stable ideal CMOS inverter has one transistor off, but its real off-state currents are nonzero.\nCharging energy: On a full low-to-high transition, the supply delivers VDD·Q=CLVDD² because Q=CLVDD. Half is stored in CL and half is dissipated in the PMOS. On the following high-to-low transition the stored energy is dissipated in the NMOS, making the total loss per full cycle CLVDD².\nActivity convention: Let α count average rising events per reference clock cycle. Then Psw=αCLVDD²f. If an activity factor counts both edges, take half that rate for a stationary full-swing signal whose rising and falling counts balance.\nShort-circuit power: While VIN traverses the overlap region, PMOS and NMOS may both conduct. This creates a direct current whose average multiplied by VDD gives Psc. Input slew and loading affect that current.\nStatic power: Pstatic≈VDDIleak. Important mechanisms include subthreshold channel leakage, gate tunneling and reverse-biased junction leakage.\nReducing power: Lowering VDD has a quadratic switching benefit at fixed C, α and f, but may violate timing. Lower CL or eliminate unnecessary toggles when possible."}},{"id":"cmos-u3-q5","subject":"cmos","unit":3,"number":5,"q":"Explain delay analysis of a CMOS inverter. Define propagation delays tpHL and tpLH.","ans":{"s":"tpHL and tpLH are input/output 50% delays. First-order estimates: 0.69RnCL and 0.69RpCL.","m":"Timing points: tpHL is the input-to-output midpoint time for a falling output; tpLH is the corresponding time for a rising output.\nRC estimates: With output capacitance CL and conducting resistances Rn and Rp, tpHL≈0.69RnCL and tpLH≈0.69RpCL. Mean delay is their average.\nLoading: Diffusion, wiring and fanout raise CL. PMOS sizing can balance the edges, but transistor nonlinearity and finite input slew require simulation for accuracy.","d":"Definitions: tpHL measures from the input rising through 50% VDD to the output falling through 50%. tpLH measures from the input falling through 50% to the output rising through 50%. Average propagation delay is tp=(tpHL+tpLH)/2.\nOutput load: Model the load as CL=Cdiff+Cwire+ΣCin, where the last term comes from the gates that the inverter drives. Replace the on NMOS or PMOS by an effective resistance Rn or Rp for a first-order estimate.\nFalling output: After a rising input step, the NMOS discharges CL. VOUT(t)=VDD·e^(−t/(RnCL)). Setting VOUT=VDD/2 gives tpHL≈ln(2)RnCL=0.69RnCL.\nRising output: After a falling input step, PMOS charges CL. VOUT(t)=VDD[1−e^(−t/(RpCL))]. The same midpoint calculation gives tpLH≈0.69RpCL.\nExample: CL=20 fF, Rn=2 kΩ and Rp=3 kΩ give about 28 ps falling and 41 ps rising. Broaden the PMOS if a more balanced output is required, then account for the higher input capacitance it presents upstream.\nModel limit: Input slew and nonlinear transistor current change delay. Rise and fall time measure an output transition between two output levels, typically 10% and 90%."}},{"id":"cmos-u3-q6","subject":"cmos","unit":3,"number":6,"q":"Design 2-input CMOS NAND and NOR gates with truth tables. Explain pull-up and pull-down network duality.","ans":{"s":"NAND: n series, p parallel. NOR: n parallel, p series. 00/01/10/11 gives NAND 1110 and NOR 1000.","m":"NAND: Series NMOS and parallel PMOS. Output is low only at A=B=1.\nNOR: Parallel NMOS and series PMOS. Output is high only at A=B=0.\nTruth table: For 00, 01, 10 and 11, NAND yields 1,1,1,0 and NOR yields 1,0,0,0.\nDuality: Exchange series and parallel when moving between the NMOS pull-down and PMOS pull-up. PMOS devices conduct for a low gate input, so the paths select opposite output states.","d":"NAND topology: Place nA and nB in series from Y to ground, so both inputs must be high to discharge Y. Put pA and pB in parallel from VDD to Y, so either low input pulls Y high. The function is ¬(AB).\nNOR topology: Place nA and nB in parallel from Y to ground, so a high input on either branch discharges Y. Put pA and pB in series from VDD to Y, so both inputs must be low to pull Y high. The function is ¬(A+B).\nTruth table: For A B=00 the NAND/NOR outputs are 1/1; for 01 they are 1/0; for 10 they are 1/0; for 11 they are 0/0. Each input controls the corresponding NMOS and PMOS gates.\nNetwork duality: Use the NMOS network to realize the condition under which Y is low. Obtain the PMOS network by exchanging series with parallel and using PMOS switches, whose low gate voltages enable them. De Morgan's laws make the two conduction conditions complementary.\nImplementation: Tie n-body to ground and p-well to VDD. In both gates, stacks add resistance in the slow path, so device width may be increased to recover drive at the cost of input capacitance.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 650 193\" role=\"img\" aria-label=\"Complementary CMOS networks for NAND and NOR\" style=\"display:block;width:100%;height:auto;max-width:650px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Complementary CMOS networks for NAND and NOR\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"649\" height=\"192\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"61\" y=\"49\" width=\"228\" height=\"35\" fill=\"#3a2b19\" stroke=\"#d69d47\" rx=\"2\"/>\u003crect x=\"61\" y=\"116\" width=\"228\" height=\"35\" fill=\"#103329\" stroke=\"#62bc91\" rx=\"2\"/>\u003crect x=\"361\" y=\"49\" width=\"228\" height=\"35\" fill=\"#3a2b19\" stroke=\"#d69d47\" rx=\"2\"/>\u003crect x=\"361\" y=\"116\" width=\"228\" height=\"35\" fill=\"#103329\" stroke=\"#62bc91\" rx=\"2\"/>\u003cpath d=\"M175 35 V49 M175 84 V116 M175 151 V168 M175 100 H268\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M475 35 V49 M475 84 V116 M475 151 V168 M475 100 H568\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"175\" cy=\"100\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"475\" cy=\"100\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"175\" y=\"22\" fill=\"#dbeafe\" font-size=\"14\" text-anchor=\"middle\">NAND\u003c/text>\u003ctext x=\"175\" y=\"34\" fill=\"#fbbf24\" font-size=\"10\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"175\" y=\"71\" fill=\"#fde8bc\" font-size=\"13\" text-anchor=\"middle\">PUN: pA ∥ pB\u003c/text>\u003ctext x=\"175\" y=\"138\" fill=\"#d1fae5\" font-size=\"13\" text-anchor=\"middle\">PDN: nA — nB\u003c/text>\u003ctext x=\"287\" y=\"105\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"175\" y=\"179\" fill=\"#86efac\" font-size=\"10\" text-anchor=\"middle\">GND\u003c/text>\u003ctext x=\"475\" y=\"22\" fill=\"#dbeafe\" font-size=\"14\" text-anchor=\"middle\">NOR\u003c/text>\u003ctext x=\"475\" y=\"34\" fill=\"#fbbf24\" font-size=\"10\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"475\" y=\"71\" fill=\"#fde8bc\" font-size=\"13\" text-anchor=\"middle\">PUN: pA — pB\u003c/text>\u003ctext x=\"475\" y=\"138\" fill=\"#d1fae5\" font-size=\"13\" text-anchor=\"middle\">PDN: nA ∥ nB\u003c/text>\u003ctext x=\"587\" y=\"105\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"475\" y=\"179\" fill=\"#86efac\" font-size=\"10\" text-anchor=\"middle\">GND\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q7","subject":"cmos","unit":3,"number":7,"q":"Realize the Boolean function F = (A·B + C)' using static CMOS logic. Draw the pull-up and pull-down networks.","ans":{"s":"AOI21: PDN=(nA series nB) ∥ nC. PUN=(pA ∥ pB) series pC.","m":"Pull-down: Implement AB+C as series nA–nB in parallel with nC from F to ground.\nPull-up: Implement the dual as pC in series with parallel pA and pB from VDD to F.\nOperation: C=1 always forces F low. At C=0 the gate reduces to NAND of A and B. The six-transistor AOI21 needs ordinary well and body connections.\nLayout check: Keep the series A–B junction internal. Connect both branches of the NMOS network at F and ground.","d":"Function: The low-output condition is AB+C=1. This six-transistor gate is commonly called an AOI21 because it performs an AND followed by OR and inversion in one static stage.\nPull-down drawing: From F to ground draw two branches in parallel. One is nA in series with nB, and the other is the single device nC. A series NMOS pair needs both high inputs, while a single high C can discharge F independently.\nPull-up drawing: From VDD to F draw pC in series with a parallel pA/pB pair. PMOS devices conduct for zero gate inputs, so the topology implements ¬C(¬A+¬B), the exact complement of the pull-down condition.\nCase check: With C=1, nC is on and pC is off, so F=0 regardless of A and B. With C=0, F=0 only for A=B=1. If either A or B is low, the corresponding PMOS completes the pull-up path.\nConnections and delays: Each input connects to the gates of its named n/p pair. Add correct body ties and label the output at the common network node. The resistance of the A/B series discharge differs from the single C branch and can motivate stack sizing.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 650 193\" role=\"img\" aria-label=\"AOI21 complementary CMOS network\" style=\"display:block;width:100%;height:auto;max-width:650px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>AOI21 complementary CMOS network\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"649\" height=\"192\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"211\" y=\"49\" width=\"228\" height=\"35\" fill=\"#3a2b19\" stroke=\"#d69d47\" rx=\"2\"/>\u003crect x=\"211\" y=\"116\" width=\"228\" height=\"35\" fill=\"#103329\" stroke=\"#62bc91\" rx=\"2\"/>\u003cpath d=\"M325 35 V49 M325 84 V116 M325 151 V168 M325 100 H418\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"325\" cy=\"100\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"325\" y=\"22\" fill=\"#dbeafe\" font-size=\"14\" text-anchor=\"middle\">AOI21\u003c/text>\u003ctext x=\"325\" y=\"34\" fill=\"#fbbf24\" font-size=\"10\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"325\" y=\"71\" fill=\"#fde8bc\" font-size=\"13\" text-anchor=\"middle\">PUN: (pA ∥ pB) — pC\u003c/text>\u003ctext x=\"325\" y=\"138\" fill=\"#d1fae5\" font-size=\"13\" text-anchor=\"middle\">PDN: (nA — nB) ∥ nC\u003c/text>\u003ctext x=\"437\" y=\"105\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"325\" y=\"179\" fill=\"#86efac\" font-size=\"10\" text-anchor=\"middle\">GND\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q8","subject":"cmos","unit":3,"number":8,"q":"Explain pass transistor logic. What is the problem of threshold voltage drop?","ans":{"s":"A pass NMOS passes a good 0 and a weak 1 ≈VDD−VT. A PMOS does the reverse. A parallel TG restores both rails.","m":"Operation: An enabled pass transistor passes a data signal through its channel. NMOS passes a strong 0 and a weak 1, while PMOS passes a strong 1 and a weak 0.\nThreshold loss: For NMOS passing high, VGS falls as VOUT rises, limiting the logic high to roughly VDD−VTn. Body effect can make this limit worse.\nRemedy: Restore the level or use a complementary transmission gate.","d":"Basic switch: A pass transistor routes a logic voltage from one channel terminal to the other under gate control. An NMOS is enabled by a high gate voltage; in a bilateral path the effective NMOS source is the lower-voltage terminal.\nPassing zero: With the NMOS gate at VDD, a falling receiving node increases gate overdrive. The node can settle essentially to ground. This is called a strong zero.\nPassing one: As the receiving node rises, VGS=VDD−VOUT falls. Charging becomes weak and the usual threshold-stop estimate is VOUT≈VDD−VTn. With a grounded body and rising source voltage, body effect raises VTn and makes the high level worse. The threshold-stop model ignores slow subthreshold effects.\nPMOS complement: A PMOS whose gate is at zero passes a strong one. As it passes a low voltage, its source-to-gate voltage shrinks and the receiving node may stop near |VTp| above ground.\nConsequences: Degraded levels shrink noise margins, slow the next stage and can make both devices in a following inverter conduct. Restore logic levels with a buffer or parallel the NMOS and PMOS with complementary controls to form a transmission gate."}},{"id":"cmos-u3-q9","subject":"cmos","unit":3,"number":9,"q":"Explain the transmission gate. Implement a 2:1 multiplexer using transmission gates.","ans":{"s":"Two TGs share Y. TG0 enabled by S̄, TG1 by S. Y=D0S̄+D1S.","m":"Switch: A transmission gate uses parallel NMOS and PMOS with complementary enables. NMOS carries a strong zero and PMOS a strong one.\nMUX wiring: Route D0 through TG0 enabled by S̄ and D1 through TG1 enabled by S. Generate S̄ with a CMOS inverter. Both outputs meet at Y.\nResult: S=0 selects D0 and S=1 selects D1. Y=S̄D0+SD1. The six-transistor design can use an output buffer for a large load.","d":"Transmission gate: Put one NMOS and one PMOS in parallel between the two signal terminals. For an enable E, connect E to the NMOS gate and Ē to the PMOS gate. Both are enabled when E=1 and off when E=0.\nRail behavior: NMOS carries low voltages strongly and PMOS carries high voltages strongly. Their parallel combination transfers either rail even as one device weakens near an extreme. The isolated terminal can become high impedance when both devices are off.\nMUX connections: Place TG0 from D0 to Y and TG1 from D1 to Y. For TG0 wire the NMOS gate to S̄ and PMOS gate to S. For TG1 wire the NMOS gate to S and PMOS gate to S̄. One CMOS inverter creates S̄ from S.\nSelection: S=0 enables TG0 only, so Y=D0. S=1 enables TG1 only, so Y=D1. The equation is Y=S̄D0+SD1. The two transmission gates and select inverter use six transistors.\nPractical checks: Size the pass devices for output load and consider restoring or buffering long chains. Select inverter skew can temporarily make both paths partially on or leave a brief high-impedance interval.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 590 203\" role=\"img\" aria-label=\"Two-input multiplexer using two CMOS transmission gates\" style=\"display:block;width:100%;height:auto;max-width:590px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Two-input multiplexer using two CMOS transmission gates\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"589\" height=\"202\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"153\" y=\"48\" width=\"132\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"153\" y=\"120\" width=\"132\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M89 65 H153 M89 137 H153 M285 65 H383 V137 H285 M383 101 H482\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M219 48 V28 M219 120 V99\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"383\" cy=\"101\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"68\" y=\"70\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">D0\u003c/text>\u003ctext x=\"68\" y=\"142\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">D1\u003c/text>\u003ctext x=\"219\" y=\"70\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG0: N ∥ P\u003c/text>\u003ctext x=\"219\" y=\"142\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG1: N ∥ P\u003c/text>\u003ctext x=\"219\" y=\"23\" fill=\"#fda4af\" font-size=\"13\" text-anchor=\"middle\">N: S̄  ·  P: S\u003c/text>\u003ctext x=\"219\" y=\"96\" fill=\"#fda4af\" font-size=\"13\" text-anchor=\"middle\">N: S  ·  P: S̄\u003c/text>\u003ctext x=\"503\" y=\"107\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"293\" y=\"181\" fill=\"#94a3b8\" font-size=\"13\" text-anchor=\"middle\">S = 0 selects D0.   S = 1 selects D1.\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q10","subject":"cmos","unit":3,"number":10,"q":"Design an XOR gate using CMOS logic and explain its working.","ans":{"s":"XOR high on 01 and 10. Build PDN for AB+ĀB̄, dual PUN for XOR. Invert A and B locally.","m":"Logic: XOR is ĀB+AB̄ and is high for 01 and 10.\nPull-down: Implement AB+ĀB̄ as two parallel series stacks. It conducts for 11 or 00.\nPull-up: Connect pA parallel pB in series with pĀ parallel pB̄. For unequal inputs, both parallel groups have a conducting branch.\nCount: Two input inverters provide the complements. Eight core devices plus four inverter devices give 12 transistors.","d":"Boolean target: XOR gives Y=ĀB+AB̄, so the output is high when A and B differ. Its complement is Ȳ=AB+ĀB̄, which is the low condition used to design a static pull-down.\nNMOS network: Draw one branch nA–nB in series and another branch nĀ–nB̄ in series. Put these branches in parallel from Y to ground. A=B=1 enables the first branch and A=B=0 enables the second.\nPMOS network: Use the dual. From VDD to Y put the parallel group pA,pB in series with the parallel group pĀ,pB̄. For unequal inputs one PMOS in each group is on, providing a complete charging path.\nTruth check: At 00 the output is 0; at 01 it is 1; at 10 it is 1; at 11 it is 0. For equal inputs a pull-down branch turns on and at least one entire PMOS group is off.\nImplementation: A and B each drive an inverter to generate their complements. The core uses eight transistors and the inverters use four, for 12 total. Include the well and body ties and show the complement nets explicitly in the diagram.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 650 193\" role=\"img\" aria-label=\"Static CMOS XOR complementary networks\" style=\"display:block;width:100%;height:auto;max-width:650px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Static CMOS XOR complementary networks\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"649\" height=\"192\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"211\" y=\"49\" width=\"228\" height=\"35\" fill=\"#3a2b19\" stroke=\"#d69d47\" rx=\"2\"/>\u003crect x=\"211\" y=\"116\" width=\"228\" height=\"35\" fill=\"#103329\" stroke=\"#62bc91\" rx=\"2\"/>\u003cpath d=\"M325 35 V49 M325 84 V116 M325 151 V168 M325 100 H418\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"325\" cy=\"100\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"325\" y=\"22\" fill=\"#dbeafe\" font-size=\"14\" text-anchor=\"middle\">XOR\u003c/text>\u003ctext x=\"325\" y=\"34\" fill=\"#fbbf24\" font-size=\"10\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"325\" y=\"71\" fill=\"#fde8bc\" font-size=\"13\" text-anchor=\"middle\">PUN: (pA ∥ pB) — (pĀ ∥ pB̄)\u003c/text>\u003ctext x=\"325\" y=\"138\" fill=\"#d1fae5\" font-size=\"13\" text-anchor=\"middle\">PDN: (nA — nB) ∥ (nĀ — nB̄)\u003c/text>\u003ctext x=\"437\" y=\"105\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"325\" y=\"179\" fill=\"#86efac\" font-size=\"10\" text-anchor=\"middle\">GND\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q11","subject":"cmos","unit":3,"number":11,"q":"Explain the DC transfer characteristics of a CMOS inverter. Describe the regions of operation of the nMOS and pMOS transistors with a neat voltage transfer characteristic (VTC).","ans":{"s":"Typical VTC: NMOS off/PMOS triode → N sat/P triode → both sat → N triode/P sat → N triode/P off.","m":"Sweep: Plot equilibrium VOUT versus VIN. The curve falls from about VDD to about ground and crosses VOUT=VIN at VM.\nRegion order: As VIN rises, NMOS/PMOS pass through off/triode, saturation/triode, saturation/saturation, triode/saturation and triode/off in the usual sufficient-headroom model.\nCriteria: When on, NMOS saturates if VOUT≥VIN−VTn and PMOS saturates if VDD−VOUT≥VDD−VIN−|VTp|. Mark these regions and the two rails.\nPlot labels: Mark VIN on the horizontal axis, VOUT on the vertical axis, and the switching threshold on the falling edge.","d":"DC equilibrium: For each VIN, solve the pull-up and pull-down current balance at the output and plot VOUT. Define NMOS VGS=VIN, VDS=VOUT; PMOS VSG=VDD−VIN, VSD=VDD−VOUT.\nRegion 1: For VIN≤VTn the NMOS is cut off. PMOS is on, VSD is near zero and VOUT≈VDD. Mark the high plateau.\nRegion 2: Once VIN just exceeds VTn, the NMOS is saturated because VOUT≥VIN−VTn. The PMOS remains in triode while VSD\u003cVSG−|VTp|.\nRegion 3: Both can saturate across the main transition if VDD is large enough that both are on. The switching point VM lies at the intersection with VOUT=VIN under the standard long-channel model.\nRegion 4: As output falls, NMOS enters triode when VOUT\u003cVIN−VTn, while PMOS remains saturated when VSD≥VSG−|VTp|.\nRegion 5: Near VIN=VDD, PMOS is cut off, NMOS is in triode and VOUT approaches ground. Sketch the falling VTC with each region annotated. The idealized region sequence assumes sufficient supply headroom.\nHow to label the drawing: Sweep VIN from zero to VDD. Mark the two rail plateaus, the transition region and the intersection with VOUT = VIN.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 580 285\" role=\"img\" aria-label=\"CMOS inverter voltage transfer characteristic and switching/noise points\" style=\"display:block;width:100%;height:auto;max-width:580px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>CMOS inverter voltage transfer characteristic and switching/noise points\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"579\" height=\"284\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M73 226 H530 l-7 -4 m7 4 -7 4 M73 226 V33 l-4 7 m4 -7 4 7\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M73 48 H203 Q245 48 262 83 Q275 114 287 142 Q310 204 369 218 H508\" fill=\"none\" stroke=\"#5eead4\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M73 226 L507 47\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/>\u003cpath d=\"M247 69 V226 M322 191 V226 M286 140 V226\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"4 5\"/>\u003ccircle cx=\"247\" cy=\"68\" r=\"4\" fill=\"#fb7185\"/>\u003ccircle cx=\"322\" cy=\"192\" r=\"4\" fill=\"#fb7185\"/>\u003ccircle cx=\"286\" cy=\"140\" r=\"4\" fill=\"#93c5fd\"/>\u003ctext x=\"49\" y=\"32\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"528\" y=\"250\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN\u003c/text>\u003ctext x=\"123\" y=\"35\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOH≈VDD\u003c/text>\u003ctext x=\"461\" y=\"207\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOL≈0\u003c/text>\u003ctext x=\"246\" y=\"249\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIL\u003c/text>\u003ctext x=\"287\" y=\"248\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VM\u003c/text>\u003ctext x=\"325\" y=\"249\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIH\u003c/text>\u003ctext x=\"487\" y=\"68\" fill=\"#94a3b8\" font-size=\"13\" text-anchor=\"middle\">VOUT = VIN\u003c/text>\u003ctext x=\"246\" y=\"269\" fill=\"#fb7185\" font-size=\"10\" text-anchor=\"middle\">slope = −1\u003c/text>\u003ctext x=\"326\" y=\"269\" fill=\"#fb7185\" font-size=\"10\" text-anchor=\"middle\">slope = −1\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q12","subject":"cmos","unit":3,"number":12,"q":"Design a static CMOS gate for the Boolean function Y = [(A + B)·C]. Draw the pull-up and pull-down networks.","ans":{"s":"Make OAI21 node X=¬[(A+B)C], then invert X for Y. PDN=(nA∥nB)–nC. PUN=(pA–pB)∥pC.","m":"First stage: Create X=¬[(A+B)C] with (nA parallel nB) in series with nC for the pull-down. The pull-up is pC parallel to the series pA–pB branch.\nSecond stage: A CMOS inverter gives Y=¬X=(A+B)C.\nCheck: C=0 forces Y low. C=1 makes Y=A+B. Include both stages and their body ties for eight transistors.\nComplementary paths: The pull-up is the dual of the pull-down, keeping X driven to a rail for every stable input combination.","d":"Polarity: The requested function Y=(A+B)C is non-inverting. Build an inverting complex gate with node X=¬[(A+B)C], then invert X. This yields the requested polarity with one OAI21 core and one inverter.\nPull-down network at X: From X to ground draw the parallel nA and nB pair in series with nC. The pull-down conducts only when C=1 and at least one of A and B is high.\nPull-up network at X: Put a series pA–pB branch in parallel with pC between VDD and X. The conduction condition is (¬A¬B)+¬C, the complement of the pull-down condition.\nVerify C=0: The NMOS series path is blocked, pC is on and X=1, so Y=0 regardless of A or B.\nVerify C=1: X is high only when A=B=0, because then pA and pB make the only conducting pull-up branch. Therefore Y=A+B when C=1.\nDrawing and count: Place the output inverter after X and label both X and Y. The core uses six transistors and the inverter adds two. Mark input labels and standard rail body ties.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 650 193\" role=\"img\" aria-label=\"OAI21 internal complementary CMOS network feeding an inverter\" style=\"display:block;width:100%;height:auto;max-width:650px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>OAI21 internal complementary CMOS network feeding an inverter\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"649\" height=\"192\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"211\" y=\"49\" width=\"228\" height=\"35\" fill=\"#3a2b19\" stroke=\"#d69d47\" rx=\"2\"/>\u003crect x=\"211\" y=\"116\" width=\"228\" height=\"35\" fill=\"#103329\" stroke=\"#62bc91\" rx=\"2\"/>\u003cpath d=\"M325 35 V49 M325 84 V116 M325 151 V168 M325 100 H418\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"325\" cy=\"100\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"325\" y=\"22\" fill=\"#dbeafe\" font-size=\"14\" text-anchor=\"middle\">OAI21: X = (A+B)C complemented\u003c/text>\u003ctext x=\"325\" y=\"34\" fill=\"#fbbf24\" font-size=\"10\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"325\" y=\"71\" fill=\"#fde8bc\" font-size=\"13\" text-anchor=\"middle\">PUN: (pA — pB) ∥ pC\u003c/text>\u003ctext x=\"325\" y=\"138\" fill=\"#d1fae5\" font-size=\"13\" text-anchor=\"middle\">PDN: (nA ∥ nB) — nC\u003c/text>\u003ctext x=\"437\" y=\"105\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">X → INV → Y\u003c/text>\u003ctext x=\"325\" y=\"179\" fill=\"#86efac\" font-size=\"10\" text-anchor=\"middle\">GND\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q13","subject":"cmos","unit":3,"number":13,"q":"Explain the transmission gate and implement a 2:1 multiplexer using transmission gates.","ans":{"s":"Two TGs share Y. TG0 enabled by S̄, TG1 by S. Y=D0S̄+D1S.","m":"Switch: A transmission gate uses parallel NMOS and PMOS with complementary enables. NMOS carries a strong zero and PMOS a strong one.\nMUX wiring: Route D0 through TG0 enabled by S̄ and D1 through TG1 enabled by S. Generate S̄ with a CMOS inverter. Both outputs meet at Y.\nResult: S=0 selects D0 and S=1 selects D1. Y=S̄D0+SD1. The six-transistor design can use an output buffer for a large load.","d":"Transmission gate: Put one NMOS and one PMOS in parallel between the two signal terminals. For an enable E, connect E to the NMOS gate and Ē to the PMOS gate. Both are enabled when E=1 and off when E=0.\nRail behavior: NMOS carries low voltages strongly and PMOS carries high voltages strongly. Their parallel combination transfers either rail even as one device weakens near an extreme. The isolated terminal can become high impedance when both devices are off.\nMUX connections: Place TG0 from D0 to Y and TG1 from D1 to Y. For TG0 wire the NMOS gate to S̄ and PMOS gate to S. For TG1 wire the NMOS gate to S and PMOS gate to S̄. One CMOS inverter creates S̄ from S.\nSelection: S=0 enables TG0 only, so Y=D0. S=1 enables TG1 only, so Y=D1. The equation is Y=S̄D0+SD1. The two transmission gates and select inverter use six transistors.\nPractical checks: Size the pass devices for output load and consider restoring or buffering long chains. Select inverter skew can temporarily make both paths partially on or leave a brief high-impedance interval.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 590 203\" role=\"img\" aria-label=\"Two-input multiplexer using two CMOS transmission gates\" style=\"display:block;width:100%;height:auto;max-width:590px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Two-input multiplexer using two CMOS transmission gates\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"589\" height=\"202\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"153\" y=\"48\" width=\"132\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"153\" y=\"120\" width=\"132\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M89 65 H153 M89 137 H153 M285 65 H383 V137 H285 M383 101 H482\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M219 48 V28 M219 120 V99\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"383\" cy=\"101\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"68\" y=\"70\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">D0\u003c/text>\u003ctext x=\"68\" y=\"142\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">D1\u003c/text>\u003ctext x=\"219\" y=\"70\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG0: N ∥ P\u003c/text>\u003ctext x=\"219\" y=\"142\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">TG1: N ∥ P\u003c/text>\u003ctext x=\"219\" y=\"23\" fill=\"#fda4af\" font-size=\"13\" text-anchor=\"middle\">N: S̄  ·  P: S\u003c/text>\u003ctext x=\"219\" y=\"96\" fill=\"#fda4af\" font-size=\"13\" text-anchor=\"middle\">N: S  ·  P: S̄\u003c/text>\u003ctext x=\"503\" y=\"107\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Y\u003c/text>\u003ctext x=\"293\" y=\"181\" fill=\"#94a3b8\" font-size=\"13\" text-anchor=\"middle\">S = 0 selects D0.   S = 1 selects D1.\u003c/text>\u003c/svg>"}},{"id":"cmos-u3-q14","subject":"cmos","unit":3,"number":14,"q":"Explain pass-transistor logic. What are its drawbacks? How does a transmission gate overcome them?","ans":{"s":"A pass NMOS passes a good 0 and a weak 1 ≈VDD−VT. A PMOS does the reverse. A parallel TG restores both rails.","m":"Drawbacks: A single NMOS degrades high levels and a single PMOS degrades low levels. Lower swing leads to weak noise margins, slower downstream switching and possible static current. Disabled paths leave high-impedance nodes.\nTransmission gate: Use parallel NMOS and PMOS with complementary gate controls. NMOS carries the low rail strongly while PMOS carries the high rail strongly.\nRemaining checks: Size for on-resistance and load. An output can still float if all paths are disabled.","d":"Single-transistor pass logic: Gates route data using their drain–source paths. This can save transistors for selection circuits, but an NMOS passes zero strongly and a PMOS passes one strongly. The other rail is degraded by the device threshold.\nVoltage loss: When NMOS passes a high with its gate at VDD, VGS falls as the output rises. Strong conduction ends near VOUT≈VDD−VTn. Body effect may raise VTn. A PMOS passing low exhibits the complementary weak-zero behavior.\nCircuit drawbacks: Reduced voltage swing cuts noise margins. Driving a static inverter with an intermediate level can increase DC current and delay. Disabled pass paths leave nodes floating; leakage, capacitive coupling and charge sharing can then corrupt their voltages. Cascades add series resistance.\nTransmission-gate remedy: Parallel an NMOS and PMOS with complementary controls so they turn on and off together. Near ground the NMOS is effective; near VDD the PMOS is effective. This restores full static swing and usually lowers midrange path resistance.\nLimits: Controls need both polarities, and two devices raise switch area and control loading. The output is still floating if every transmission path is disabled. Add storage, a keeper or a buffer where the topology calls for it."}}]},{"title":"CMOS Technologies and CMOS Design Rules","questions":[{"id":"cmos-u4-q1","subject":"cmos","unit":4,"number":1,"q":"Explain the n-well CMOS fabrication process step by step with neat diagrams.","ans":{"s":"p wafer → n-well/isolation → gate oxide/poly → implants → contacts, metal, passivation.","m":"Well and isolation: Mask and implant an n-well in a p wafer, then use field isolation or STI to define active islands.\nGate and junctions: Form the gate dielectric and pattern the gate. Use separate n+ and p+ implants for NMOS and PMOS source/drain and body taps. The patterned gate aligns the junction edges.\nInterconnect: Deposit dielectric, cut contacts, pattern metal, then add vias and further metal as needed. Draw separate cross-sections for well/isolation, gate, implants and contacted devices.","d":"Starting wafer and well: Begin with a p-type silicon wafer. Pattern the well mask, introduce donor dopant into the exposed areas and anneal to form the n-well for PMOS. NMOS will remain in the p-type body. Draw the wafer and the new well as the first cross-section.\nActive isolation: Define where devices may form. Create isolation, such as shallow trench isolation, to separate adjacent active regions. Draw remaining silicon islands and the insulating trenches or field oxide.\nGate definition: Form the thin gate dielectric and deposit and pattern the gate material. In a teaching polysilicon process, each patterned gate crosses the active region. Add the gate before source/drain implantation so its edges can align the junctions.\nSource and drain implants: With separate masks, implant n+ NMOS source/drain and n+ well taps, then p+ PMOS source/drain and p+ substrate taps. Spacer, anneal and silicide steps depend on the process. Draw the four junctions on either side of the two gates and the body contacts.\nContacts and interconnect: Deposit insulating dielectric, open contact cuts to selected diffusion and gates, then deposit and pattern metal. Repeat dielectric, via and metal layers as required and finish with passivation and pad openings.\nInverter links: Tie n-well and PMOS source to VDD, p-body and NMOS source to VSS, gates to VIN and drains to VOUT.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 95\" role=\"img\" aria-label=\"Planar CMOS fabrication sequence\" style=\"display:block;width:100%;height:auto;max-width:680px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Planar CMOS fabrication sequence\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"679\" height=\"94\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"13\" y=\"32\" width=\"143\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"182\" y=\"32\" width=\"143\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"351\" y=\"32\" width=\"143\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"520\" y=\"32\" width=\"146\" height=\"33\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M156 49 H182 l-6 -4 m6 4 -6 4 M325 49 H351 l-6 -4 m6 4 -6 4 M494 49 H520 l-6 -4 m6 4 -6 4\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ctext x=\"84\" y=\"53\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Well &amp; isolation\u003c/text>\u003ctext x=\"252\" y=\"53\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Gate oxide &amp; poly\u003c/text>\u003ctext x=\"421\" y=\"53\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+ and n+ implants\u003c/text>\u003ctext x=\"594\" y=\"53\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Contacts &amp; metal\u003c/text>\u003c/svg>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 700 240\" role=\"img\" aria-label=\"n-well CMOS inverter cross-section\" style=\"display:block;width:100%;height:auto;max-width:700px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>n-well CMOS inverter cross-section\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"699\" height=\"239\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"47\" y=\"122\" width=\"606\" height=\"91\" fill=\"#34283c\" stroke=\"#a78bfa\" rx=\"2\"/>\u003crect x=\"62\" y=\"122\" width=\"318\" height=\"71\" fill=\"#1c3455\" stroke=\"#60a5fa\" rx=\"2\"/>\u003crect x=\"79\" y=\"124\" width=\"44\" height=\"30\" fill=\"#1c4962\" stroke=\"#60a5fa\" rx=\"2\"/>\u003crect x=\"151\" y=\"124\" width=\"46\" height=\"30\" fill=\"#473821\" stroke=\"#fbbf24\" rx=\"2\"/>\u003crect x=\"278\" y=\"124\" width=\"46\" height=\"30\" fill=\"#473821\" stroke=\"#fbbf24\" rx=\"2\"/>\u003crect x=\"416\" y=\"124\" width=\"46\" height=\"30\" fill=\"#14513a\" stroke=\"#4ade80\" rx=\"2\"/>\u003crect x=\"538\" y=\"124\" width=\"46\" height=\"30\" fill=\"#14513a\" stroke=\"#4ade80\" rx=\"2\"/>\u003crect x=\"600\" y=\"124\" width=\"40\" height=\"30\" fill=\"#473821\" stroke=\"#fbbf24\" rx=\"2\"/>\u003crect x=\"200\" y=\"119\" width=\"73\" height=\"5\" fill=\"#165464\" stroke=\"#5eead4\" rx=\"2\"/>\u003crect x=\"465\" y=\"119\" width=\"70\" height=\"5\" fill=\"#165464\" stroke=\"#5eead4\" rx=\"2\"/>\u003crect x=\"200\" y=\"103\" width=\"73\" height=\"16\" fill=\"#482638\" stroke=\"#fb7185\" rx=\"2\"/>\u003crect x=\"465\" y=\"103\" width=\"70\" height=\"16\" fill=\"#482638\" stroke=\"#fb7185\" rx=\"2\"/>\u003cpath d=\"M101 124 V49 H174 V124 M561 124 V49 H620 V124 M301 124 V69 H439 V124\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M236 103 V88 H500 V103\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ctext x=\"137\" y=\"43\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"591\" y=\"43\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VSS\u003c/text>\u003ctext x=\"370\" y=\"62\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"367\" y=\"83\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">VIN\u003c/text>\u003ctext x=\"101\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"174\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"301\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"440\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"561\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"620\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p+\u003c/text>\u003ctext x=\"220\" y=\"179\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n-well · PMOS\u003c/text>\u003ctext x=\"510\" y=\"194\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p substrate · NMOS\u003c/text>\u003ctext x=\"101\" y=\"170\" fill=\"#60a5fa\" font-size=\"10\" text-anchor=\"middle\">well tap\u003c/text>\u003ctext x=\"620\" y=\"170\" fill=\"#fbbf24\" font-size=\"10\" text-anchor=\"middle\">body tap\u003c/text>\u003ctext x=\"350\" y=\"229\" fill=\"#94a3b8\" font-size=\"11\" text-anchor=\"middle\">Gate oxide separates the polysilicon and silicon\u003c/text>\u003c/svg>"}},{"id":"cmos-u4-q2","subject":"cmos","unit":4,"number":2,"q":"Draw and explain the cross-section of a CMOS inverter.","ans":{"s":"PMOS p+ in n-well at VDD. NMOS n+ in p substrate at VSS. Gates common, drains common.","m":"Substrate: NMOS n+ junctions sit in p-type silicon. PMOS p+ junctions sit in an n-well. Isolation separates the active regions.\nInputs and output: Connect insulated gates to VIN and the drains through contacts and metal to VOUT.\nBody ties: PMOS source and n+ well
