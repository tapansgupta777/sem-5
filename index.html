cap=\"round\"/>\u003cpath d=\"M167 61 V109 M304 61 V109 M438 61 V109 M580 61 V109 M155 109 H179 M155 118 H179 M292 109 H316 M292 118 H316 M426 109 H450 M426 118 H450 M568 109 H592 M568 118 H592 M167 118 V143 M304 118 V143 M438 118 V143 M580 118 V143 M144 143 H602\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"167\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"304\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"438\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"580\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"99\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rdriver\u003c/text>\u003ctext x=\"229\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"364\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"497\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"169\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/6\u003c/text>\u003ctext x=\"304\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/3\u003c/text>\u003ctext x=\"438\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/3\u003c/text>\u003ctext x=\"580\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/6 + CL\u003c/text>\u003ctext x=\"606\" y=\"48\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Receiver\u003c/text>\u003ctext x=\"376\" y=\"166\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">Each wire resistance sees the capacitances downstream from it.\u003c/text>\u003c/svg>"}},{"id":"cmos-u5-q9","subject":"cmos","unit":5,"number":9,"q":"Explain interconnect engineering methods (wire sizing, repeaters, layer selection). Explain logical effort with wires.","ans":{"s":"Widen or use upper layers to lower R, add repeaters, space neighbors. Include wire C in effort and separately account for distributed R.","m":"Geometry: Widen the route or choose a lower-R layer, checking added capacitance, track usage and vias. Space or shield sensitive routes when coupling dominates.\nRepeaters: Divide long wires into shorter RC sections to reduce the quadratic self-delay. Optimize against added buffer delay and power.\nLogical effort: Include short-wire capacitance in h=Ctotal/Cin. Add distributed wire delay separately for long runs and iterate the combined gate and routing sizes.","d":"Wire sizing: Widen a high-resistance route to reduce Rw=RsheetL/W. Wider wire consumes routing tracks and can add area capacitance. If sidewall coupling dominates, increasing spacing or shielding can improve crosstalk, with area or extra ground-capacitance costs.\nLayer selection: Use a thicker or less resistive upper metal for long runs when available. Compare per-unit resistance and capacitance, extra via resistance and the available direction and routing pitch. A nominally better layer can lose its benefit on short segments.\nRepeaters: Divide a long wire into k comparable sections with buffers. The sum of the wire self terms ideally scales as k·(Rw/k)(Cw/k)/2=RwCw/(2k). Each inserted buffer adds intrinsic delay, loading, power and area, so optimize number and size instead of maximizing them.\nLogical effort: For a short route that can be treated as a lumped capacitor, use h=(Cnext+Cwire+Cside)/Cin in d=gh+p. If branch effort accounts for off-path loads explicitly, do not count those loads again in h.\nDistributed correction: Long-wire resistance produces delay beyond the gate effort model. Add an RC estimate per segment or use extraction, then iterate gate and repeater sizes under timing and slew limits.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 670 192\" role=\"img\" aria-label=\"Distributed wire RC ladder driven through effective output resistance\" style=\"display:block;width:100%;height:auto;max-width:670px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Distributed wire RC ladder driven through effective output resistance\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"669\" height=\"191\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"60\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"190\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"325\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"460\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M34 61 H60 M137 61 H190 M267 61 H325 M402 61 H460 M537 61 H626\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M167 61 V109 M304 61 V109 M438 61 V109 M580 61 V109 M155 109 H179 M155 118 H179 M292 109 H316 M292 118 H316 M426 109 H450 M426 118 H450 M568 109 H592 M568 118 H592 M167 118 V143 M304 118 V143 M438 118 V143 M580 118 V143 M144 143 H602\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"167\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"304\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"438\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"580\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"99\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rdriver\u003c/text>\u003ctext x=\"229\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"364\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"497\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"169\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/6\u003c/text>\u003ctext x=\"304\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/3\u003c/text>\u003ctext x=\"438\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/3\u003c/text>\u003ctext x=\"580\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/6 + CL\u003c/text>\u003ctext x=\"606\" y=\"48\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Receiver\u003c/text>\u003ctext x=\"376\" y=\"166\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">Each wire resistance sees the capacitances downstream from it.\u003c/text>\u003c/svg>"}},{"id":"cmos-u5-q10","subject":"cmos","unit":5,"number":10,"q":"Write short notes on scaling challenges, CAD and manufacturing concerns, and pitfalls in CMOS design.","ans":{"s":"Scaling stresses leakage, variation, wire RC and reliability. Use PDK-aware CAD and signoff across corners.","m":"Scaling: Short-channel effects, leakage and variation complicate device design. Narrow lines worsen interconnect RC, coupling, IR drop and reliability concerns.\nCAD: Use PDK models, accurate constraints, extracted parasitics, multi-corner STA, DRC and LVS. Check activity and supplies realistically.\nManufacturing: Satisfy foundry density, spacing, antenna and via rules. Inspect slow setup and fast hold separately, and avoid floating bodies or loads omitted from schematic-only estimates.","d":"Device scaling: Smaller geometry enables more devices and can lower capacitance, but lower supply and threshold do not scale proportionately. Short-channel effects, leakage and threshold variation make timing and noise margin more sensitive to process and voltage. Lower-voltage circuits also have less absolute voltage headroom.\nInterconnect and power: Narrower metal increases resistance. RC delay and coupling can limit global paths, while IR drop means local devices may see less than nominal VDD. Electromigration and heat constrain how current is distributed.\nCAD concerns: Use the process device models, library corners and extracted layout parasitics. Constrain clocks and I/O, run multi-corner timing, check switching activity and verify the design under realistic loading. Incorrect or incomplete constraints can hide failures.\nManufacturing concerns: Check foundry width, spacing, enclosure, pattern density, antenna and via requirements. Use DRC for geometry and LVS for schematic equivalence. Consider yield and reliability rather than relying only on a nominal functional run.\nCommon pitfalls: Avoid unintended floating internal or body nodes, idealized clocks or power rails, and drawing conclusions from schematic delay alone. A slow setup corner and a fast hold corner may need different fixes. Validate setup, hold, power integrity and extracted timing independently."}},{"id":"cmos-u5-q11","subject":"cmos","unit":5,"number":11,"q":"Define logical effort, electrical effort and parasitic delay. Write the delay equation of a logic gate in terms of these quantities.","ans":{"s":"d=gh+p. g=relative input cost for equal drive. h=Cload/Cin. p=intrinsic normalized delay.","m":"Logical effort: g compares input capacitance at equal drive to the reference inverter.\nElectrical effort: h=Cload/Cin gives the load-to-input ratio. Larger fanout gives larger h for fixed gate size.\nParasitic delay: p is the unloaded delay caused by internal and diffusion capacitances.\nModel: d=gh+p and t≈τd. For g=4/3, h=3, p=2, the delay is 6 normalized units. Include a branch factor only when h excludes side loads.","d":"Normalized delay: Write d=gh+p. The first term is the effort delay due to the load. The intercept p is the parasitic delay. Multiply by the process reference time τ to estimate a physical propagation delay, t≈τd.\nLogical effort: g is the input capacitance per input of the candidate gate divided by that of a reference inverter with the same output drive. An inverter has g=1 by definition. A stacked gate generally needs wider devices per input to match drive, so its g is usually larger.\nElectrical effort: h=Cload/Cin, with Cload including the capacitance driven by the output and Cin the input capacitance of the stage being analyzed. It increases when a fixed-size gate drives more fanout or wire capacitance.\nParasitic delay: p represents unloaded delay due primarily to internal capacitance and output diffusion. It remains even if external Cload is zero.\nExample and branching: With g=4/3, h=3 and p=2, d=6. If h_on includes only on-path load, use b=Ctotal/Con and d=g·b·h_on+p. Avoid applying b if h already includes total capacitance."}},{"id":"cmos-u5-q12","subject":"cmos","unit":5,"number":12,"q":"Differentiate between dynamic and static power dissipation in CMOS circuits. Write the expression for dynamic power.","ans":{"s":"Dynamic: switching plus short circuit. Static: leakage at steady logic. Psw=αCVDD²f, Pstatic≈VDDIleak.","m":"Dynamic: Psw=αCVDD²f, with α counting low-to-high events per cycle. Finite edges can add short-circuit current while both networks conduct. Switching power falls when activity or clock frequency falls.\nStatic: Pstatic≈VDDIleak even while inputs are stable. Off-channel, gate, junction and field-driven leakage contribute, with temperature and input-state dependence.\nDesign measures: Reduce capacitance, activity or supply for dynamic power. Use suitable high-VT cells or power gating to target leakage.","d":"Dynamic power: Power consumed as circuits switch has a capacitive component and a short-circuit component. For one node, a full low-to-high output event draws charge CVDD and energy CVDD² from the supply. The stored half is dissipated later as the node falls.\nExpression: Psw=αCVDD²f for α average 0→1 transitions per reference cycle. Sum over nodes to estimate the circuit total. With C=20 fF, α=0.1, VDD=1 V and f=100 MHz, Psw=0.2 µW for that node.\nShort-circuit component: During a finite input edge, NMOS and PMOS may conduct simultaneously, creating a temporary supply-to-ground path. Its average current times VDD is additional dynamic power.\nStatic power: Pstatic≈VDDIleak is present with held inputs. Sources include off-state channel conduction, gate tunneling, reverse junction leakage and field-induced leakage. Input state, process and temperature affect this term.\nComparison: If clock and data activity stop, the capacitive switching term approaches zero but leakage persists. Lower VDD and switching activity cut dynamic power, while higher VT on slack paths or power gating idle domains primarily limit leakage."}},{"id":"cmos-u5-q13","subject":"cmos","unit":5,"number":13,"q":"Explain the effect of interconnect resistance and capacitance on circuit delay. List any two interconnect engineering techniques.","ans":{"s":"Wire R and C slow switching, with self-delay ∝L². Use repeaters and lower-resistance layers.","m":"RC effect: Rw grows with length and shrinks with width, while Cw grows with length. The far-end estimate includes driver charging delay and a wire term Rw(Cw/2+CL). The self-delay grows roughly as length squared.\nTechnique 1: Insert repeaters to shorten each RC segment, balancing improvement against buffer delay and power.\nTechnique 2: Widen the route or move to lower-resistance metal. Recheck capacitance, vias and actual timing.","d":"Resistance and capacitance: A uniform line has Rw≈RsheetL/W and Cw≈cL. Its resistance impedes charging current, while capacitance stores charge and also loads the driving gate. More capacitance is possible when opposite-switching neighbors increase effective coupling.\nDelay mechanism: Use a distributed RC line. With driver resistance Rdriver and a far-end load CL, a first approximation to the far-end Elmore time constant is Rdriver(Cw+CL)+Rw(Cw/2+CL). The wire self term RwCw/2 grows as L² for fixed line geometry.\nTechnique 1, repeater insertion: Split a long wire into shorter sections. Each section's resistance and capacitance fall with its length, reducing the sum of the wire self delays. Buffer delays, power and routing area eventually limit the benefit.\nTechnique 2, lower-resistance routing: Increase conductor width or choose a lower-R metal layer. Check added capacitance, available tracks and via overhead. The best choice depends on extracted resistance and capacitance, not width alone.\nTiming check: Compare full path delay and output slew before and after the change, including the driver and terminal load. Sign off with actual extracted parasitics.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 670 192\" role=\"img\" aria-label=\"Distributed wire RC ladder driven through effective output resistance\" style=\"display:block;width:100%;height:auto;max-width:670px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Distributed wire RC ladder driven through effective output resistance\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"669\" height=\"191\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"60\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"190\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"325\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"460\" y=\"44\" width=\"77\" height=\"34\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M34 61 H60 M137 61 H190 M267 61 H325 M402 61 H460 M537 61 H626\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M167 61 V109 M304 61 V109 M438 61 V109 M580 61 V109 M155 109 H179 M155 118 H179 M292 109 H316 M292 118 H316 M426 109 H450 M426 118 H450 M568 109 H592 M568 118 H592 M167 118 V143 M304 118 V143 M438 118 V143 M580 118 V143 M144 143 H602\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"167\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"304\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"438\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"580\" cy=\"61\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"99\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rdriver\u003c/text>\u003ctext x=\"229\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"364\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"497\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Rw/3\u003c/text>\u003ctext x=\"169\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/6\u003c/text>\u003ctext x=\"304\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/3\u003c/text>\u003ctext x=\"438\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/3\u003c/text>\u003ctext x=\"580\" y=\"102\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Cw/6 + CL\u003c/text>\u003ctext x=\"606\" y=\"48\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Receiver\u003c/text>\u003ctext x=\"376\" y=\"166\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">Each wire resistance sees the capacitances downstream from it.\u003c/text>\u003c/svg>"}},{"id":"cmos-u5-q14","subject":"cmos","unit":5,"number":14,"q":"Explain the power–delay trade-off in CMOS circuits. Define power–delay product (PDP) and energy–delay product (EDP).","ans":{"s":"PDP=Pavg·tp [J]. EDP=Eop·tp [J·s]. Higher drive or VDD often speeds logic at higher energy.","m":"Trade-off: Larger devices or higher VDD can reduce delay but increase switching power, capacitance or leakage.\nPDP: Pavg·tp in joules. It equals event energy when the power window is precisely tp.\nEDP: Eop·tp in joule-seconds for a specified operation. It penalizes slow operation even if energy is low. For 0.2 pJ at 100 ps versus 0.16 pJ at 160 ps, EDP is 20 versus 25.6 pJ·ps.","d":"Circuit trade-off: Faster edges generally need higher current. Increasing transistor width can lower effective on-resistance, but it raises input and diffusion capacitance. Higher VDD increases overdrive and often reduces delay, while dynamic energy grows as CVDD² for fixed capacitance.\nPDP: Power–delay product is Pavg·tp, in joules. Specify average-power and propagation-delay conventions. It equals the energy over tp only if Pavg is averaged over that same interval.\nEDP: Energy–delay product is Eop·tp, in joule-seconds, where Eop is energy for a defined operation. EDP weights speed in addition to energy. If Eop=Pavg·tp for the chosen interval, EDP=Pavg·tp².\nIllustration: Suppose A uses 0.2 pJ per operation at 100 ps, and B uses 0.16 pJ at 160 ps. B uses 20% less energy, but EDP is 25.6 pJ·ps versus A's 20 pJ·ps. Thus EDP favors A for this comparison.\nFair comparison: Measure both alternatives with equal functional work, load and activity assumptions. Apply throughput and delay limits before optimizing energy, PDP or EDP, since one aggregate metric cannot enforce a timing deadline."}}]}]},{"id":"asic","name":"ASIC Design","code":"PCC-303-ECV","color":"#9cbfff","source":"https://chatgpt.com/library?account_id=personal&file_id=libfile_cff9ab80dc608191a3fd5bce53afd84e","count":58,"units":[{"title":"Introduction to ASIC","questions":[{"id":"asic-u1-q1","subject":"asic","unit":1,"number":1,"q":"Illustrate / draw and explain the ASIC design flow with a neat block diagram, stating the function of each step.","ans":{"s":"Specification → RTL → verification → synthesis and DFT → physical implementation → signoff → tape-out → silicon test.","m":"Design: Convert interface, performance, power and area requirements into an architecture and synthesizable RTL. Verify functionality and clock/reset crossings.\nLogical implementation: Synthesize RTL into characterized cells, insert test logic and check equivalence.\nPhysical implementation: Floorplan and build power, place and legalize cells, synthesize the clock tree, and route signals.\nSignoff and manufacture: Extract parasitics and pass timing, DRC and LVS. Export GDSII/OASIS for fabrication and package, test and validate the manufactured die.","d":"Specification: Define functions, interfaces, operating modes and quantitative power, performance and area targets. Record functional and timing requirements as measurable acceptance criteria.\nArchitecture and RTL: Partition the system into control, datapaths, memories and reusable IP. Establish clock, reset and power domains. Describe the hardware in synthesizable RTL and write design constraints for clocks and interfaces.\nFunctional verification: Use simulation, assertions or formal checks to exercise expected and corner cases. Check clock-domain and reset-domain crossings before committing to implementation.\nLogic synthesis and DFT: Map RTL to technology-library cells under timing and area constraints. Add scan or other test structures as required. Use equivalence checking to confirm the implementation preserves RTL behavior and generate manufacturing test patterns.\nPhysical implementation: Choose the die and core dimensions, place macros and pins, and plan power. Place and legalize cells, build the clock tree, and route wires and vias.\nSignoff: Extract parasitic resistances and capacitances. Check timing, power integrity, design rules and layout-versus-schematic connectivity. Revise the implementation with engineering change orders and rerun affected checks.\nTape-out and test: Release verified GDSII or OASIS for mask generation. Fabricate, package, and apply automatic test equipment patterns to screen defects. Validate initial silicon in the intended system.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"ASIC design flow\" viewBox=\"0 0 740 154\">\u003crect width=\"740\" height=\"154\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003crect x=\"20\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"90\" y=\"47\" text-anchor=\"middle\">Specification\u003c/text>\u003cpath d=\"M161 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"195\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"265\" y=\"47\" text-anchor=\"middle\">Architecture and RTL\u003c/text>\u003cpath d=\"M336 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"370\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"440\" y=\"47\" text-anchor=\"middle\">Functional verification\u003c/text>\u003cpath d=\"M511 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"545\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"615\" y=\"47\" text-anchor=\"middle\">Synthesis and DFT\u003c/text>\u003cpath d=\"M615 67v19m-4-5 4 5 4-5\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"545\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"615\" y=\"117\" text-anchor=\"middle\">Floorplan and placement\u003c/text>\u003cpath d=\"M543 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"370\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"440\" y=\"117\" text-anchor=\"middle\">CTS and routing\u003c/text>\u003cpath d=\"M368 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"195\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"265\" y=\"117\" text-anchor=\"middle\">Extraction and signoff\u003c/text>\u003cpath d=\"M193 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"20\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"90\" y=\"117\" text-anchor=\"middle\">Tape-out and test\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u1-q2","subject":"asic","unit":1,"number":2,"q":"Explain different types of ASICs in detail.","ans":{"s":"Full-custom uses custom layout. Semi-custom uses standard cells or gate arrays. Programmable devices are configured after fabrication.","m":"Full-custom: The designer chooses transistor sizes, circuit topology and layout, giving strong optimization potential with high development effort.\nStandard-cell: RTL is mapped to characterized cells and customer-specific wiring. Reuse enables automated implementation.\nGate array: A prefabricated base is connected using selected custom metal/via masks, shortening manufacture.\nProgrammable logic: FPGAs and CPLDs have field-configurable logic and routing. They avoid custom mask costs for a user design. The course groups them under programmable ASICs.","d":"Classifying principle: Categorize a design by which device and wiring structures the designer customizes. Mask-programmed chips customize manufacturing data, while field-programmable devices configure completed fabric.\nFull-custom: Design the transistor network, device dimensions and mask geometry for the application. Designers can optimize cell topology, matching and parasitics for high density or precise analog behavior. SRAM bitcells and sensitive analog blocks are common examples. Manual layout, characterization and verification raise development time and non-recurring engineering cost.\nStandard-cell semi-custom: Synthesize RTL into a library of characterized gates, flip-flops and other cells. Place and route those cells and integrate hard macros such as SRAM. The design uses a chip-specific layout and masks, with more automation and less cell-level work than full-custom.\nGate-array semi-custom: Begin from prefabricated transistor or base-cell patterns. Customer-specific metal and via layers define the circuit. Channelled arrays reserve wiring gaps. Channel-less arrays use over-the-cell routing where the technology permits it.\nProgrammable logic: An FPGA maps functions into configurable lookup tables and flip-flops. A CPLD typically uses connected macrocells. After fabrication, configuration programs logic and interconnect. The approach suits prototypes and products needing field updates, with added configuration and routing overhead."}},{"id":"asic-u1-q3","subject":"asic","unit":1,"number":3,"q":"Compare Full-Custom, Semi-Custom and Programmable ASICs with respect to design time / complexity, flexibility, cost, performance and density.","ans":{"s":"Full-custom maximizes optimization. Semi-custom trades some optimization for reusable cells. Programmable logic minimizes up-front cost and lead time.","m":"Development: Full-custom needs device and layout work. Semi-custom reuses cells or a base array. Programmable logic compiles into existing fabric and usually has the shortest lead time.\nFlexibility: Full-custom offers transistor/layout freedom. An FPGA offers field reconfiguration after fabrication.\nCost and quality: Mask NRE typically falls from full-custom to programmable. Full-custom and standard cells generally achieve higher density and lower routing overhead, while programmable hard blocks can improve the result for supported functions.","d":"Design time and complexity: Full-custom requires transistor design, layout, extraction and verification of custom structures. Semi-custom automates much of synthesis and physical implementation using a library or base array. Programmable logic uses an existing FPGA or CPLD and typically reaches working hardware fastest.\nPre-fabrication flexibility: Full-custom provides the most control over geometry, devices and circuit topology. Standard-cell designs depend on the library, while gate arrays depend on the fixed base fabric.\nPost-fabrication flexibility: Field-reprogrammable FPGA fabrics can change function after deployment. A mask-programmed ASIC generally requires redesigned masks and new fabrication to change hardware.\nCost: Full-custom generally has the largest development and mask non-recurring engineering cost. Semi-custom reduces engineering effort and a gate array can reuse base layers. Programmable logic avoids custom mask NRE, but often carries a higher unit cost at high volume.\nPerformance and power: Optimized custom devices and wires can improve critical-path delay and energy. Standard cells provide predictable characterized performance. FPGA switches, LUTs and long programmable routes generally incur delay and energy overhead.\nDensity and selection: Full-custom can pack many devices into a small area. Standard-cell density is often higher than FPGA logic density for comparable functions. Hard RAM/DSP blocks can reduce FPGA overhead on matching workloads. Select with volume, update requirements and performance targets in mind."}},{"id":"asic-u1-q4","subject":"asic","unit":1,"number":4,"q":"Explain Programmable Logic Devices (PLDs) and FPGA architecture with a neat block diagram.","ans":{"s":"A PLD realizes programmed logic. CPLDs use macrocells. FPGAs use LUT/flip-flop blocks, I/O blocks and programmable routing.","m":"PLD families: PLA and PAL map sum-of-products logic. CPLDs group programmable macrocells. FPGAs use an array of configurable logic blocks.\nFabric: CLBs combine LUTs, flip-flops and carry resources. I/O blocks connect to external pins. Switch matrices and tracks connect internal blocks and I/O.\nProgram flow: Map HDL to these resources, place and route, then load configuration. Dedicated clocks, DSP blocks and memories complement the programmable logic.","d":"PLD classification: A programmable logic device implements configured digital functions. A programmable logic array typically has programmable AND and OR planes. A programmable array logic device typically has a programmable AND plane and fixed OR plane. A CPLD links several macrocell groups through programmable interconnect.\nFPGA organization: Draw a matrix of configurable logic blocks surrounded by I/O blocks. Show horizontal and vertical routing channels between blocks and mark the switches that connect their segments.\nLogic resources: A lookup table implements combinational logic by indexing stored truth-table bits. Flip-flops implement sequential state. Local multiplexers and fast carry chains support data selection, counters and adders.\nI/O interface: I/O blocks provide input buffers, output drivers and bidirectional/tri-state control at pins. Register and electrical-standard options depend on the family.\nInterconnect and dedicated blocks: Connection boxes link pins to tracks, while switch matrices join wire segments. Dedicated clock networks distribute clocks with controlled skew. Block RAM, DSP and clock managers handle common high-performance functions.\nConfiguration: Synthesize HDL, map to fabric resources, place and route, then program the generated configuration. For example, map a counter into carry logic and flip-flops, route its output to an I/O block and set the required pin standard.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"FPGA architecture with input output blocks, connection boxes, switch matrices and logic blocks\" viewBox=\"0 0 760 226\">\u003crect width=\"760\" height=\"226\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cpath d=\"M95 67H664M95 117H664M95 167H664M152 33V193M332 33V193M512 33V193M644 33V193\" fill=\"none\" stroke=\"#8066b5\" stroke-width=\"2\"/>\u003crect x=\"175\" y=\"55\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"210\" y=\"71\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"148\" y=\"63\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"355\" y=\"55\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"390\" y=\"71\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"328\" y=\"63\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"535\" y=\"55\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"570\" y=\"71\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"508\" y=\"63\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"175\" y=\"105\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"210\" y=\"121\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"148\" y=\"113\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"355\" y=\"105\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"390\" y=\"121\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"328\" y=\"113\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"535\" y=\"105\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"570\" y=\"121\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"508\" y=\"113\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"175\" y=\"155\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"210\" y=\"171\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"148\" y=\"163\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"355\" y=\"155\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"390\" y=\"171\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"328\" y=\"163\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"535\" y=\"155\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"570\" y=\"171\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"508\" y=\"163\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\n\u003cg fill=\"#334258\" stroke=\"#a8b9dd\">\u003crect x=\"42\" y=\"54\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"42\" y=\"104\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"42\" y=\"154\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"664\" y=\"54\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"664\" y=\"104\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"664\" y=\"154\" width=\"53\" height=\"26\" rx=\"4\"/>\u003c/g>\u003ctext x=\"55\" y=\"71\">IOB\u003c/text>\u003ctext x=\"55\" y=\"121\">IOB\u003c/text>\u003ctext x=\"55\" y=\"171\">IOB\u003c/text>\u003ctext x=\"677\" y=\"71\">IOB\u003c/text>\u003ctext x=\"677\" y=\"121\">IOB\u003c/text>\u003ctext x=\"677\" y=\"171\">IOB\u003c/text>\u003ctext x=\"93\" y=\"211\">Teal: programmable switch\u003c/text>\u003ctext x=\"473\" y=\"211\">Purple: routing track\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u1-q5","subject":"asic","unit":1,"number":5,"q":"Explain the architecture of an FPGA (CLB, IOB and programmable interconnect) with a neat diagram.","ans":{"s":"CLB = LUTs and registers. IOB = pin interface. Switch matrices and tracks join internal blocks and IOBs.","m":"CLBs: Implement Boolean functions in LUTs and store state in flip-flops. Multiplexers and dedicated carry resources handle selection and arithmetic.\nIOBs: Set the direction, electrical standard and buffering at each package pin. Optional registers capture or launch signals at the boundary.\nRouting: Programmable switches link block pins and track segments. Dedicated paths serve clocks and selected hard blocks. A configured route carries the IOB input to the selected CLB.","d":"Block diagram: Draw CLBs as a repeated matrix, surround the fabric with I/O blocks, and connect the rows and columns through programmable tracks and switch boxes. Clock networks and hard blocks may be drawn separately.\nConfigurable logic blocks: A k-input LUT represents up to 2ᵏ truth-table bits, so its input value addresses the stored Boolean output. A CLB contains LUTs, flip-flops and local multiplexers. Dedicated carry chains accelerate arithmetic and some LUTs can be configured as small distributed memories.\nInput/output blocks: An IOB links the circuit to a physical pin. Select input, output or bidirectional operation, then configure buffers, optional registers, pin electrical standards and tri-state enable where applicable.\nProgrammable interconnect: Connection boxes attach block pins to nearby tracks. Switch matrices join track segments. Local wires serve neighboring cells and long lines cover larger distances. The implementation tool picks legal routes that meet delay and capacity constraints.\nClock and hard resources: Low-skew dedicated clocks feed sequential blocks. Many devices also include block RAM, multipliers, DSP slices or serial blocks.\nWorking example: A one-bit registered XOR can be implemented with a LUT, a flip-flop and two input IOBs. Switch settings route the pins to the LUT and send its registered output to an output IOB.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"FPGA architecture with input output blocks, connection boxes, switch matrices and logic blocks\" viewBox=\"0 0 760 226\">\u003crect width=\"760\" height=\"226\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003cpath d=\"M95 67H664M95 117H664M95 167H664M152 33V193M332 33V193M512 33V193M644 33V193\" fill=\"none\" stroke=\"#8066b5\" stroke-width=\"2\"/>\u003crect x=\"175\" y=\"55\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"210\" y=\"71\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"148\" y=\"63\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"355\" y=\"55\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"390\" y=\"71\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"328\" y=\"63\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"535\" y=\"55\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"570\" y=\"71\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"508\" y=\"63\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"175\" y=\"105\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"210\" y=\"121\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"148\" y=\"113\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"355\" y=\"105\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"390\" y=\"121\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"328\" y=\"113\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"535\" y=\"105\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"570\" y=\"121\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"508\" y=\"113\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"175\" y=\"155\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"210\" y=\"171\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"148\" y=\"163\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"355\" y=\"155\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"390\" y=\"171\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"328\" y=\"163\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\u003crect x=\"535\" y=\"155\" width=\"71\" height=\"24\" rx=\"4\" fill=\"#222c42\" stroke=\"#8198c0\"/>\u003ctext x=\"570\" y=\"171\" text-anchor=\"middle\">CLB\u003c/text>\u003crect x=\"508\" y=\"163\" width=\"8\" height=\"8\" fill=\"#75dbc9\"/>\n\u003cg fill=\"#334258\" stroke=\"#a8b9dd\">\u003crect x=\"42\" y=\"54\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"42\" y=\"104\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"42\" y=\"154\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"664\" y=\"54\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"664\" y=\"104\" width=\"53\" height=\"26\" rx=\"4\"/>\u003crect x=\"664\" y=\"154\" width=\"53\" height=\"26\" rx=\"4\"/>\u003c/g>\u003ctext x=\"55\" y=\"71\">IOB\u003c/text>\u003ctext x=\"55\" y=\"121\">IOB\u003c/text>\u003ctext x=\"55\" y=\"171\">IOB\u003c/text>\u003ctext x=\"677\" y=\"71\">IOB\u003c/text>\u003ctext x=\"677\" y=\"121\">IOB\u003c/text>\u003ctext x=\"677\" y=\"171\">IOB\u003c/text>\u003ctext x=\"93\" y=\"211\">Teal: programmable switch\u003c/text>\u003ctext x=\"473\" y=\"211\">Purple: routing track\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u1-q6","subject":"asic","unit":1,"number":6,"q":"Explain the programming technologies used in programmable ASICs.","ans":{"s":"SRAM is volatile and reprogrammable. Flash/EEPROM is nonvolatile and rewritable. Antifuse permanently forms a conductive link.","m":"SRAM: Volatile reprogrammable bits configure LUTs and switches. Reload the bitstream after power-up.\nFlash or EEPROM: Charge storage retains bits through power loss and supports erase/reprogram within device endurance limits.\nAntifuse and fuse: An antifuse forms a permanent conductive link. A traditional fuse permanently opens an existing link.\nSelection: Compare field update needs, boot requirements and configuration reliability before choosing a technology.","d":"Purpose: FPGA or CPLD configuration defines the logic functions, interconnect switch selections and I/O options. Technologies differ in how they store state and whether a connection can be changed.\nSRAM configuration: Configuration bits in volatile static cells control multiplexers or pass devices. The field can be rewritten repeatedly and some devices support partial reconfiguration. Configuration has to be loaded after power-up, commonly from an external nonvolatile memory. Bit upsets and configuration-area overhead are design considerations.\nFlash or EEPROM: Floating-gate or charge-storage cells retain programmed data without power. Where the device implements nonvolatile configuration directly, the design can start without first fetching an external image. Erasure and rewriting are possible, with finite endurance and programming requirements.\nAntifuse: An initially insulating element is programmed into a permanent conducting link. It starts open and ends closed. The permanent connection is nonvolatile and compact, but a mistaken configuration requires another device.\nFuse: A traditional fuse starts conducting and is opened irreversibly by programming, giving the opposite connection behavior from an antifuse. It appears in historical programmable technologies and one-time configuration.\nSelection: Choose SRAM for repeated updates, nonvolatile rewritable fabric for boot persistence, or one-time programming when permanently fixed configuration is preferred. Evaluate device-specific power, boot time, area and environmental requirements."}},{"id":"asic-u1-q7","subject":"asic","unit":1,"number":7,"q":"Write short notes on: (i) Gate Array based ASIC (ii) Channelled gate array (iii) Channel-less gate array","ans":{"s":"Gate arrays customize wires on a prefabricated base. Channelled reserves gaps. Channel-less routes over the gate fabric.","m":"Gate-array base: Reuse a fabricated transistor or cell pattern and create application-specific connections with selected metal and via masks.\nChannelled: Reserve fixed routing tracks between gate rows. Routing is regular, but channels consume area and may become full.\nChannel-less: Use a sea of base sites and route across them on upper metal. Density can improve when layer capacity and pin access are sufficient.\nTrade-off: Evaluate actual usable gates against wiring capacity, not capacity alone.","d":"Gate array: A foundry fabricates base wafers with regular uncommitted transistors or base cells. The application specifies how to connect those devices through a subset of customized metal and via masks. Reusing base layers lowers the number of customized steps and can reduce manufacturing lead time.\nCircuit mapping: Place the logic functions on the available sites, then connect them within the layers and site access rules. A complex function may need several base sites. The number of usable gates depends on routability and gate mix as well as the advertised array size.\nChannelled organization: Device cells are arranged in rows with dedicated horizontal wiring gaps. The router uses tracks within each channel and connects channels where the array permits. The regular structure simplifies region modeling, while fixed channel area consumes silicon and can limit congested designs.\nChannel-less organization: A sea-of-gates occupies much of the substrate. Routing crosses over cells on available metal layers instead of using only dedicated gaps. This can improve density and flexibility. Limited pin access and congested upper layers can still leave some sites unused.\nComparison: Choose the organization using expected track demand, utilization, available metal layers and turnaround. Channelled arrays provide predictable wiring regions. Channel-less designs trade that regularity for more over-cell capacity."}},{"id":"asic-u1-q8","subject":"asic","unit":1,"number":8,"q":"Numerical: A 100 K-gate IC contains the equivalent of 100,000 two-input NAND gates, each made of 4 transistors. Calculate: (i) Total number of two-input NAND gate equivalents. (ii) Total number of transistors required to implement the IC. (iii) Number of transistors if the capacity is increased to 250 K gates. (iv) Number of transistors for a 500 K gate IC.","ans":{"s":"100,000 NAND2 equivalents → 400,000 transistors. 250 K → 1,000,000. 500 K → 2,000,000.","m":"Assumption: A static CMOS NAND2 uses four transistors. Use Nₜ = 4NGE and take K = 1,000 as stated.\n(i) and (ii): 100 K corresponds to 100,000 NAND2 equivalents and 100,000 × 4 = 400,000 transistors.\n(iii) and (iv): 250 K gives 1,000,000 transistors, and 500 K gives 2,000,000.\nInterpretation: This is the stipulated NAND-only equivalence model. An actual ASIC can contain cells, memories and analog blocks with different transistor-to-area relationships.","d":"Given model: Each gate equivalent is one two-input NAND. In static CMOS, NAND2 uses two series NMOS transistors in the pull-down and two parallel PMOS transistors in the pull-up. Thus one gate equivalent corresponds to four transistors under the stated assumption.\n(i) Number of gate equivalents: The problem defines 100 K as 100,000. The IC therefore has exactly 100,000 two-input NAND equivalents.\n(ii) Transistors for 100 K: Multiply the number of gates by four. Nₜ = 100,000 × 4 = 400,000 transistors.\n(iii) Transistors for 250 K: Nₜ = 250,000 × 4 = 1,000,000 transistors.\n(iv) Transistors for 500 K: Nₜ = 500,000 × 4 = 2,000,000 transistors.\nInterpretation: The proportional relation is Nₜ = 4NGE. A useful sanity check is that 500 K is twice 250 K, so the assumed transistor count also doubles. The estimates apply to the exercise's all-NAND model. A real ASIC's NAND2 gate-equivalent rating is often an area normalization. Flip-flops, logic with different drive strengths, SRAM and mixed-signal IP change the relationship between that rating and its actual transistor count."}},{"id":"asic-u1-q9","subject":"asic","unit":1,"number":9,"q":"Compare Programmable, Semi-Custom and Full Custom ASIC.","ans":{"s":"Full-custom maximizes optimization. Semi-custom trades some optimization for reusable cells. Programmable logic minimizes up-front cost and lead time.","m":"Development: Full-custom needs device and layout work. Semi-custom reuses cells or a base array. Programmable logic compiles into existing fabric and usually has the shortest lead time.\nFlexibility: Full-custom offers transistor/layout freedom. An FPGA offers field reconfiguration after fabrication.\nCost and quality: Mask NRE typically falls from full-custom to programmable. Full-custom and standard cells generally achieve higher density and lower routing overhead, while programmable hard blocks can improve the result for supported functions.","d":"Design time and complexity: Full-custom requires transistor design, layout, extraction and verification of custom structures. Semi-custom automates much of synthesis and physical implementation using a library or base array. Programmable logic uses an existing FPGA or CPLD and typically reaches working hardware fastest.\nPre-fabrication flexibility: Full-custom provides the most control over geometry, devices and circuit topology. Standard-cell designs depend on the library, while gate arrays depend on the fixed base fabric.\nPost-fabrication flexibility: Field-reprogrammable FPGA fabrics can change function after deployment. A mask-programmed ASIC generally requires redesigned masks and new fabrication to change hardware.\nCost: Full-custom generally has the largest development and mask non-recurring engineering cost. Semi-custom reduces engineering effort and a gate array can reuse base layers. Programmable logic avoids custom mask NRE, but often carries a higher unit cost at high volume.\nPerformance and power: Optimized custom devices and wires can improve critical-path delay and energy. Standard cells provide predictable characterized performance. FPGA switches, LUTs and long programmable routes generally incur delay and energy overhead.\nDensity and selection: Full-custom can pack many devices into a small area. Standard-cell density is often higher than FPGA logic density for comparable functions. Hard RAM/DSP blocks can reduce FPGA overhead on matching workloads. Select with volume, update requirements and performance targets in mind."}},{"id":"asic-u1-q10","subject":"asic","unit":1,"number":10,"q":"Explain different types of ASICs. Compare Full-Custom, Semi-Custom and Programmable ASICs with respect to design complexity, flexibility, cost and performance.","ans":{"s":"Full-custom optimizes devices, semi-custom builds from library or base cells, and programmable logic configures prefabricated LUT or macrocell fabrics.","m":"Development: Full-custom needs device and layout work. Semi-custom reuses cells or a base array. Programmable logic compiles into existing fabric and usually has the shortest lead time.\nFlexibility: Full-custom offers transistor/layout freedom. An FPGA offers field reconfiguration after fabrication.\nCost and quality: Mask NRE typically falls from full-custom to programmable. Full-custom and standard cells generally achieve higher density and lower routing overhead, while programmable hard blocks can improve the result for supported functions.","d":"Design time and complexity: Full-custom requires transistor design, layout, extraction and verification of custom structures. Semi-custom automates much of synthesis and physical implementation using a library or base array. Programmable logic uses an existing FPGA or CPLD and typically reaches working hardware fastest.\nPre-fabrication flexibility: Full-custom provides the most control over geometry, devices and circuit topology. Standard-cell designs depend on the library, while gate arrays depend on the fixed base fabric.\nPost-fabrication flexibility: Field-reprogrammable FPGA fabrics can change function after deployment. A mask-programmed ASIC generally requires redesigned masks and new fabrication to change hardware.\nCost: Full-custom generally has the largest development and mask non-recurring engineering cost. Semi-custom reduces engineering effort and a gate array can reuse base layers. Programmable logic avoids custom mask NRE, but often carries a higher unit cost at high volume.\nPerformance and power: Optimized custom devices and wires can improve critical-path delay and energy. Standard cells provide predictable characterized performance. FPGA switches, LUTs and long programmable routes generally incur delay and energy overhead.\nDensity and selection: Full-custom can pack many devices into a small area. Standard-cell density is often higher than FPGA logic density for comparable functions. Hard RAM/DSP blocks can reduce FPGA overhead on matching workloads. Select with volume, update requirements and performance targets in mind."}},{"id":"asic-u1-q11","subject":"asic","unit":1,"number":11,"q":"Draw and explain the ASIC design flow stating function of each step.","ans":{"s":"Specification → RTL → verification → synthesis and DFT → physical implementation → signoff → tape-out → silicon test.","m":"Design: Convert interface, performance, power and area requirements into an architecture and synthesizable RTL. Verify functionality and clock/reset crossings.\nLogical implementation: Synthesize RTL into characterized cells, insert test logic and check equivalence.\nPhysical implementation: Floorplan and build power, place and legalize cells, synthesize the clock tree, and route signals.\nSignoff and manufacture: Extract parasitics and pass timing, DRC and LVS. Export GDSII/OASIS for fabrication and package, test and validate the manufactured die.","d":"Specification: Define functions, interfaces, operating modes and quantitative power, performance and area targets. Record functional and timing requirements as measurable acceptance criteria.\nArchitecture and RTL: Partition the system into control, datapaths, memories and reusable IP. Establish clock, reset and power domains. Describe the hardware in synthesizable RTL and write design constraints for clocks and interfaces.\nFunctional verification: Use simulation, assertions or formal checks to exercise expected and corner cases. Check clock-domain and reset-domain crossings before committing to implementation.\nLogic synthesis and DFT: Map RTL to technology-library cells under timing and area constraints. Add scan or other test structures as required. Use equivalence checking to confirm the implementation preserves RTL behavior and generate manufacturing test patterns.\nPhysical implementation: Choose the die and core dimensions, place macros and pins, and plan power. Place and legalize cells, build the clock tree, and route wires and vias.\nSignoff: Extract parasitic resistances and capacitances. Check timing, power integrity, design rules and layout-versus-schematic connectivity. Revise the implementation with engineering change orders and rerun affected checks.\nTape-out and test: Release verified GDSII or OASIS for mask generation. Fabricate, package, and apply automatic test equipment patterns to screen defects. Validate initial silicon in the intended system.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"ASIC design flow\" viewBox=\"0 0 740 154\">\u003crect width=\"740\" height=\"154\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003crect x=\"20\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"90\" y=\"47\" text-anchor=\"middle\">Specification\u003c/text>\u003cpath d=\"M161 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"195\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"265\" y=\"47\" text-anchor=\"middle\">Architecture and RTL\u003c/text>\u003cpath d=\"M336 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"370\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"440\" y=\"47\" text-anchor=\"middle\">Functional verification\u003c/text>\u003cpath d=\"M511 42h32m-5-4 5 4-5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"545\" y=\"18\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"615\" y=\"47\" text-anchor=\"middle\">Synthesis and DFT\u003c/text>\u003cpath d=\"M615 67v19m-4-5 4 5 4-5\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"545\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"615\" y=\"117\" text-anchor=\"middle\">Floorplan and placement\u003c/text>\u003cpath d=\"M543 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"370\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"440\" y=\"117\" text-anchor=\"middle\">CTS and routing\u003c/text>\u003cpath d=\"M368 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"195\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"265\" y=\"117\" text-anchor=\"middle\">Extraction and signoff\u003c/text>\u003cpath d=\"M193 112h-31m5-4-5 4 5 4\" fill=\"none\" stroke=\"#74e6ce\" stroke-width=\"2\"/>\u003crect x=\"20\" y=\"88\" width=\"140\" height=\"48\" rx=\"6\" fill=\"#20283a\" stroke=\"#6681ae\"/>\u003ctext x=\"90\" y=\"117\" text-anchor=\"middle\">Tape-out and test\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u1-q12","subject":"asic","unit":1,"number":12,"q":"Explain the programming technologies used in programmable ASICs.","ans":{"s":"SRAM is volatile and reprogrammable. Flash/EEPROM is nonvolatile and rewritable. Antifuse permanently forms a conductive link.","m":"SRAM: Volatile reprogrammable bits configure LUTs and switches. Reload the bitstream after power-up.\nFlash or EEPROM: Charge storage retains bits through power loss and supports erase/reprogram within device endurance limits.\nAntifuse and fuse: An antifuse forms a permanent conductive link. A traditional fuse permanently opens an existing link.\nSelection: Compare field update needs, boot requirements and configuration reliability before choosing a technology.","d":"Purpose: FPGA or CPLD configuration defines the logic functions, interconnect switch selections and I/O options. Technologies differ in how they store state and whether a connection can be changed.\nSRAM configuration: Configuration bits in volatile static cells control multiplexers or pass devices. The field can be rewritten repeatedly and some devices support partial reconfiguration. Configuration has to be loaded after power-up, commonly from an external nonvolatile memory. Bit upsets and configuration-area overhead are design considerations.\nFlash or EEPROM: Floating-gate or charge-storage cells retain programmed data without power. Where the device implements nonvolatile configuration directly, the design can start without first fetching an external image. Erasure and rewriting are possible, with finite endurance and programming requirements.\nAntifuse: An initially insulating element is programmed into a permanent conducting link. It starts open and ends closed. The permanent connection is nonvolatile and compact, but a mistaken configuration requires another device.\nFuse: A traditional fuse starts conducting and is opened irreversibly by programming, giving the opposite connection behavior from an antifuse. It appears in historical programmable technologies and one-time configuration.\nSelection: Choose SRAM for repeated updates, nonvolatile rewritable fabric for boot persistence, or one-time programming when permanently fixed configuration is preferred. Evaluate device-specific power, boot time, area and environmental requirements."}}]},{"title":"Partitioning, Floor Planning and Placement","questions":[{"id":"asic-u2-q1","subject":"asic","unit":2,"number":1,"q":"Explain partitioning at system, board and chip levels with suitable examples. State the need, goals and objectives of partitioning.","ans":{"s":"Hierarchy: system → boards → chip blocks. Balance resources and keep interpartition traffic low.","m":"Need: Divide a complex design into manageable units with testable interfaces and limit expensive cross-boundary connections.\nLevels: System partitioning separates major hardware and software functions, as in CPU versus accelerator. Board partitioning assigns circuits to PCBs, such as sensing and computation. Chip partitioning groups cells or IP into physical and logical blocks.\nObjectives: Minimize weighted cut nets, preserve timing and locality, and balance capacity, area, power and interface resources.","d":"Purpose: Partitioning divides a circuit or system into units small enough to implement, verify and test independently. Good boundaries preserve locality and limit bandwidth, delay, power and pin cost across partitions.\nSystem level: Partition major responsibilities among hardware, software, processors, modules or chiplets. For example, a vision system can put pixel filters on an accelerator while leaving configuration and fault recovery on a CPU. Estimate compute, memory traffic and latency at the boundary.\nBoard level: Allocate components or circuits to different printed circuit boards. A sensor board can hold low-noise amplifiers and an ADC, while a separate control board holds the MCU and network interface. Connector count, signal integrity, test access and mechanical size constrain that allocation.\nChip level: Group standard cells and IP into blocks or physical regions. A DMA engine, memories and a processor might form separate blocks with explicit timing budgets. Balance area, power and interconnect resources.\nOptimization model: Vertices represent components with weights such as area. Nets are graph edges or hyperedges. Minimize weighted cut cost while respecting partition capacities, critical connections, clock/power boundaries and I/O limitations.\nEvaluation: Compare cut size, balance and critical-path effects. A partition with few cuts can still be poor if one cut carries a time-critical or very wide interface."}},{"id":"asic-u2-q2","subject":"asic","unit":2,"number":2,"q":"Explain the K-L (Kernighan–Lin) algorithm with a neat diagram.","ans":{"s":"Compute D = external − internal. Swap unlocked a,b with maximum g = D(a)+D(b)−2w(a,b). Commit the best positive prefix.","m":"Setup: Model the design as a weighted graph with equally sized partitions A and B. Compute D(v) as external minus internal edge weight.\nSwaps: Rank unlocked pairs by g(a,b) = D(a) + D(b) − 2w(a,b). Lock each provisional pair and update gains for remaining vertices.\nCommit: Choose the prefix having maximum positive cumulative gain. Repeat with unlocked vertices and stop when no pass improves the cut.","d":"Problem model: Kernighan–Lin is an iterative improvement method for graph bipartitioning. Let A and B be equally sized vertex sets. Each edge has a weight w(a,b), with zero for a missing edge. The objective is to reduce total cut weight.\nCompute D values: For each vertex v, calculate D(v) = E(v) − I(v). E sums edge weights to the opposite set and I sums weights to the same set.\nPair gain: For each unlocked a∈A and b∈B, compute g(a,b) = D(a) + D(b) − 2w(a,b). The edge connecting a and b stays across the cut after swapping, so the last term removes double counting.\nOne pass: Choose the available pair with maximum gain. Swap it provisionally, lock both vertices, update remaining D values, then continue selecting pairs. Permit negative individual gains.\nCommit rule: Form prefix sums Gₖ = g₁ + ··· + gₖ. Commit only the prefix with the greatest positive Gₖ. For gains +4, −2 and +3, the largest prefix gain is +5 after all three swaps. Restore uncommitted pairs.\nStop: Unlock vertices and start a new pass. Terminate when no positive prefix remains. Swapping preserves the set sizes and yields a locally improved cut.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Kernighan–Lin swap across two equal-sized blocks\" viewBox=\"0 0 760 180\">\u003crect width=\"760\" height=\"180\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003crect x=\"43\" y=\"31\" width=\"193\" height=\"106\" rx=\"12\" fill=\"#26344b\" stroke=\"#8db1fa\"/>\u003crect x=\"521\" y=\"31\" width=\"193\" height=\"106\" rx=\"12\" fill=\"#314138\" stroke=\"#7ee0b1\"/>\n\u003ctext x=\"74\" y=\"58\">Partition A\u003c/text>\u003ctext x=\"545\" y=\"58\">Partition B\u003c/text>\u003ctext x=\"73\" y=\"113\">a₂, a₃, …\u003c/text>\u003ctext x=\"627\" y=\"113\">b₂, b₃, …\u003c/text>\n\u003cg fill=\"#10131b\" stroke=\"#9baad1\">\u003ccircle cx=\"199\" cy=\"94\" r=\"19\"/>\u003ccircle cx=\"557\" cy=\"94\" r=\"19\"/>\u003c/g>\u003ctext x=\"199\" y=\"99\" text-anchor=\"middle\">a\u003c/text>\u003ctext x=\"557\" y=\"99\" text-anchor=\"middle\">b\u003c/text>\n\u003cpath d=\"M220 86h313m-7-5 7 5-7 5M536 102H222m7-5-7 5 7 5\" fill=\"none\" stroke=\"#8be3d2\" stroke-width=\"2\"/>\n\u003ctext x=\"378\" y=\"69\" text-anchor=\"middle\">g(a,b) = D(a) + D(b) − 2w(a,b)\u003c/text>\u003ctext x=\"378\" y=\"155\" text-anchor=\"middle\">Lock each trial pair. Commit the best positive cumulative swap prefix.\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u2-q3","subject":"asic","unit":2,"number":3,"q":"Compare constructive and iterative improvement partitioning techniques.","ans":{"s":"Constructive methods build a partition from scratch. Iterative methods improve one through moves or swaps.","m":"Constructive: Grow groups from seeds or coarsened clusters by assigning unplaced vertices within capacity. This is efficient for finding a starting partition, though early choices can constrain cut quality.\nIterative improvement: Begin with a partition and reduce cut cost using feasible moves or swaps. Kernighan–Lin swaps pairs and Fiduccia–Mattheyses moves single vertices.\nCombined workflow: Construct a balanced solution quickly, then refine it at one or more resolutions.","d":"Starting point: Constructive partitioning starts from unassigned vertices, seeds or small graph clusters. Iterative improvement requires a complete candidate partition, which can come from a constructive method.\nConstructive workflow: Select a seed and add nearby vertices based on connectivity and available capacity. Greedy region growing and connectivity clustering are examples. Early choices are inexpensive, but can strand highly connected logic or create an unbalanced residual region. Apply capacity checks during assignments.\nIterative workflow: Evaluate the cut gain of moving a vertex or exchanging a pair, while maintaining or restoring balance. Kernighan–Lin uses pair swaps and Fiduccia–Mattheyses uses individual moves. Lock tentative changes during a pass and retain the best improving prefix where supported.\nTime and solution quality: Constructive heuristics usually create a feasible starting solution quickly. Improvement can reduce expensive crossings, but often costs more work and can stall near a local optimum. Temporary non-improving moves help the procedure investigate alternative arrangements.\nExample and combination: Group a strongly connected controller and registers during construction. During refinement, move a decode node from a crossing-heavy partition if this reduces the weighted cut and fits area. Multilevel partitioning uses coarsening, an initial solution and refinement together."}},{"id":"asic-u2-q4","subject":"asic","unit":2,"number":4,"q":"What do you mean by Placement? List the algorithms used for placement and explain any one in detail.","ans":{"s":"Placement assigns legal cell sites. Algorithms include analytical, recursive partitioning, annealing and force-directed methods.","m":"Definition: Place standard cells at coordinates and allowed orientations, keeping rows, blockages and density constraints in view. Typical methods include analytical, force-directed, min-cut and annealing.\nAnalytical placement: Minimize a smooth wirelength model plus a penalty for overfilled bins. Optionally emphasize timing-critical nets.\nFinalization: Legalize overlapped cells into valid row sites and refine by local moves or swaps. Check congestion and estimated timing before clock-tree synthesis.","d":"Definition: Placement assigns legal positions and orientations to netlist cells after the die, core, macro arrangement and technology sites have been defined. Inputs include cell dimensions, nets, timing constraints, rows, region boundaries and blockages.\nObjectives: Minimize estimated wirelength and congestion, improve timing and meet density goals. Preserve fixed objects, spacing and power-rail compatibility. One net estimate is HPWL = (xmax − xmin) + (ymax − ymin).\nAlgorithm families: Analytical or quadratic placement, electrostatic placement, recursive min-cut partitioning, force-directed placement and simulated annealing are representative examples. Modern flows commonly combine global optimization, legalization and local search.\nAnalytical global placement: Approximate wirelength as a continuous cost and divide available area into bins. Minimize wirelength plus a density penalty so short connections and spreading compete. Give critical nets higher weights when timing matters. Global cells may temporarily overlap.\nLegalization: Move standard cells to nonoverlapping legal row sites with compatible orientations and limited displacement. Honor fixed blockages and region constraints. Detailed placement then applies small shifts or swaps to improve the cost while preserving legality.\nValidation: Check timing estimates, local density, pin access and routability. For example, placing a driver closer to several sinks can shorten wires, but packing all cells too close may overfill the local routing channels."}},{"id":"asic-u2-q5","subject":"asic","unit":2,"number":5,"q":"Explain the simulated annealing algorithm for placement of cells.","ans":{"s":"Random move → cost change Δ. Accept Δ≤0. Accept uphill with probability exp(−Δ/T). Cool and repeat.","m":"Cost: Define a weighted placement cost, then propose random swaps, shifts or rotations. Compute Δ as the new cost minus the current cost.\nAcceptance: Keep all improving moves. Keep a worse move with probability exp(−Δ/T), allowing early escape from local minima.\nCooling: Run repeated trials, lower T gradually and stop at low temperature or negligible improvement. Retain the best legal result and verify timing and congestion.","d":"Model and initial state: Start with an admissible placement or a candidate whose violations have penalty costs. Set a high temperature and define C, for example a weighted sum of total HPWL, density overflow, timing penalties and congestion.\nGenerate neighbors: Randomly propose a cell shift, a swap of cell locations or a macro rotation. Evaluate the cost change Δ = Cnew − Cold, preferably using only affected cells and nets. Reject moves that violate any hard constraint.\nAcceptance rule: Accept Δ≤0. For Δ>0, accept if a uniform random sample lies below exp(−Δ/T). For Δ=2 at T=10 the probability is exp(−0.2) ≈ 0.819, while at T=1 it is about 0.135. Early uphill moves can escape a local minimum.\nCooling: Make multiple trials per temperature, then apply a rule such as T ← 0.90T. Stop after a low-temperature threshold, an iteration limit or little progress. Keep the best feasible placement seen during the search.\nResult and trade-off: Slow cooling explores more layouts and raises runtime. Very rapid cooling behaves more like greedy descent. Legalize if overlaps were permitted and verify final timing and congestion. The heuristic can find good layouts without guaranteeing a global optimum."}},{"id":"asic-u2-q6","subject":"asic","unit":2,"number":6,"q":"Explain Floor Planning. List the algorithms used for floor planning and explain any one in detail.","ans":{"s":"Floorplanning shapes the die/core and locates macros, pins, reserved regions and power resources.","m":"Floorplanning: Choose the core dimensions and place macros, I/O regions, power structures and reserved areas. Minimize area, congestion and delay while keeping routes and pins accessible.\nAlgorithms: Slicing trees, sequence pairs, B*-trees, constraint graphs and annealing are common approaches.\nSlicing: Encode blocks as leaves and directions as internal cuts. Side-by-side packing adds widths and takes maximum height. Stacking adds heights and takes maximum width. Compute size bottom-up and assign locations top-down.","d":"Definition: Floorplanning fixes the die and core outline and assigns the major blocks, macros and I/O regions. It reserves space for channels, rows, power structures, halos and routing blockages before fine placement.\nObjectives and inputs: Use the netlist, macro sizes and pins, package constraints, utilization targets and technology rules. Seek low area and congestion with feasible timing, pin access and power distribution. Select a core aspect ratio compatible with the package and placement area.\nAlgorithms: Slicing trees represent recursive cuts. Sequence pairs, B*-trees and constraint graphs support nonslicing arrangements. Simulated annealing can optimize a packing by varying block ordering, rotations, cut directions and representations.\nSlicing example: A leaf represents a macro. For a vertical cut, blocks lie left and right, giving W = W₁ + W₂ and H = max(H₁,H₂). For a horizontal cut, H = H₁ + H₂ and W = max(W₁,W₂). Apply dimensions bottom-up and assign coordinates top-down.\nWorked packing: Two 8-by-4 and 6-by-5 blocks placed side by side yield 14-by-5. Stacking them gives 8-by-9. The former uses slightly less enclosing area, while the latter may fit a narrow die better.\nTrade-off: Slicing is simple to encode and evaluate, but cannot express every nonslicing macro arrangement. Compare geometry with routing and timing estimates.","fig":"\u003csvg class=\"study-diagram\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Slicing tree and its floorplan\" viewBox=\"0 0 740 170\">\u003crect width=\"740\" height=\"170\" rx=\"12\" fill=\"#10131b\"/>\u003cg font-family=\"system-ui,sans-serif\" font-size=\"13\" fill=\"#eef2ff\">\u003ctext x=\"67\" y=\"21\">Slicing tree\u003c/text>\u003ctext x=\"440\" y=\"21\">One realized arrangement\u003c/text>\u003cpath d=\"M151 47L96 84M151 47l64 37m0 0-30 35m30-35 30 35\" fill=\"none\" stroke=\"#91acdc\" stroke-width=\"2\"/>\u003cg fill=\"#293952\" stroke=\"#91acdc\">\u003ccircle cx=\"151\" cy=\"47\" r=\"14\"/>\u003ccircle cx=\"96\" cy=\"84\" r=\"14\"/>\u003ccircle cx=\"215\" cy=\"84\" r=\"14\"/>\u003ccircle cx=\"185\" cy=\"119\" r=\"14\"/>\u003ccircle cx=\"245\" cy=\"119\" r=\"14\"/>\u003crect x=\"430\" y=\"34\" width=\"86\" height=\"101\"/>\u003crect x=\"516\" y=\"34\" width=\"145\" height=\"51\"/>\u003crect x=\"516\" y=\"85\" width=\"145\" height=\"50\"/>\u003c/g>\u003cg text-anchor=\"middle\">\u003ctext x=\"151\" y=\"52\">V\u003c/text>\u003ctext x=\"96\" y=\"89\">A\u003c/text>\u003ctext x=\"215\" y=\"89\">H\u003c/text>\u003ctext x=\"185\" y=\"124\">B\u003c/text>\u003ctext x=\"245\" y=\"124\">C\u003c/text>\u003ctext x=\"475\" y=\"88\">A\u003c/text>\u003ctext x=\"587\" y=\"63\">B\u003c/text>\u003ctext x=\"587\" y=\"114\">C\u003c/text>\u003c/g>\u003ctext x=\"93\" y=\"154\">V divides left/right. H divides top/bottom.\u003c/text>\u003c/g>\u003c/svg>"}},{"id":"asic-u2-q7","subject":"asic","unit":2,"number":7,"q":"State the goals and objectives of floor planning. Explain the measures used to judge the quality of a floorplan.","ans":{"s":"Judge floorplans by area/utilization, aspect ratio, congestion, timing, wirelength, power and physical feasibility.","m":"Geometry: Compare die/core area, W/H, utilization and dead space. Ensure legal macro and I/O locations plus room for rails, clock routes and ECOs.\nTiming and routing: Estimate wirelength, critical slack, per-tile congestion and macro pin access. Check that channels have enough tracks.\nPower and choice: Review estimated IR drop, current density and package feeds. Judge candidates jointly, since minimizing the core area can make the chip harder to route.","d":"Primary goal: Define a feasible die/core outline, then arrange macros, I/O and major regions so later placement and routing can meet performance, area and power budgets. Reserve power straps, clock resources, blockages, halos and ECO space.\nArea and utilization: Measure die and core area, aspect ratio W/H, available row area and standard-cell utilization. For 60,000 µm² of cells in 80,000 µm² of available rows, utilization is 75%. Exclude unavailable sites when estimating usable area.\nConnectivity and timing: Estimate per-net half-perimeter wirelength and examine shortest feasible locations for critical macros. Early worst negative slack and total negative slack can reveal an unfavorable timing budget or data movement distance.\nRoutability: Compare routing demand against capacity by layer and region. Inspect congested channels, macro edge pin access, route detours and blockage overlap. Verify practical channels between macros.\nPower and thermal quality: Confirm an adequate path from pads or bumps to rails and macros, enough via capacity and tolerable predicted IR drop. Check high-current or hot regions and the package constraints.\nComparison: Score multiple floorplan candidates against all objectives. A smaller core can raise density, create local routing overflow and worsen timing. Use early placement and trial routing feedback."}},{"id":"asic-u2-q8","subject":"asic","unit":2,"number":8,"q":"Differentiate between Floor Planning and Placement.","ans":{"s":"Floorplan fixes the outline and major resources. Placement assigns individual standard-cell locations inside those bounds.","m":"Floorplanning: Set the physical outline, macro and pin regions, channels, rows and reservations. It works at block scale and provides constraints for fine placement.\nPlacement: Assign standard cells to detailed legal sites and orientations. Minimize wirelength and congestion while preserving timing and density.\nRelationship: Floorplanning precedes global placement and legalization. A trial placement that exposes poor macro pin access or timing may require a floorplan change.","d":"Scope: Floorplanning defines die/core dimensions, aspect ratio and the coarse arrangement of large macros, pins and functional regions. Placement selects coordinates and allowed orientations for individual cells using that physical framework.\nInputs: Floorplanning uses architectural groupings, macro dimensions and pins, packaging, technology and utilization requirements. Placement also uses detailed connectivity, standard-cell dimensions, timing constraints, row sites, orientations, fixed blockages and boundary rules.\nOutputs: Floorplanning passes fixed macros, rows, regions, power structure information and I/O assignments to downstream tools. Placement produces specific cell positions, legality status and geometry for clock-tree synthesis and routing.\nObjectives: Floorplanning must avoid high-level congestion and disconnected power access before individual cells are located. Placement shortens nets and critical routes and balances local density without overlaps. Analytical spreading and local refinement are common placement methods.\nSequence and feedback: Floorplan first, perform global placement, legalize the cells, then refine local placements. Trial routing or timing feedback can drive another floorplanning iteration.\nExample: A floorplan locates a large SRAM along the edge with a routing keep-out and controller region nearby. Placement positions the controller's gates in nearby legal rows to shorten the highest-fanout nets."}},{"id":"asic-u2-q9","subject":"asic","unit":2,"number":9,"q":"Discuss the design-style-specific issues considered during floor planning and placement.","ans":{"s":"Standard cells need rows and routing access. Gate arrays have fixed sites. Full-custom adds device and matching constraints. FPGAs have fixed resource columns.","m":"Standard cells: Preserve rows and rail orientation, place macros with halos and allow routing capacity.\nGate arrays: Base sites are fixed. Channelled arrays have dedicated tracks. Channel-less arrays use upper metal over the gate fabric.\nFull-custom: Handle matching, symmetry, orientation and analog isolation. An FPGA instead matches functions to fixed CLB, DSP, memory and I/O sites.\nTrade-off: What can move and where wires can go depend on the available fabric.","d":"Standard cells: Build legal rows, rails and sites, account for multi
