/* Reading view */
:root{--width:1440px;--reading-font:"Atkinson Hyperlegible Next","Segoe UI",system-ui,sans-serif;--math-font:"Cambria Math","STIX Two Math",serif}
body{font-family:var(--reading-font);line-height:1.65}
.bar{grid-template-columns:auto minmax(0,1fr) auto;gap:20px}
.controls{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.focus-toggle{display:inline-grid;place-items:center;width:37px;height:37px;flex:none;color:var(--muted);background:#0c0c0d;border:1px solid var(--line);border-radius:8px;padding:0}
.focus-toggle:hover,.focus-toggle[aria-pressed=true]{color:var(--accent);border-color:#42562d;background:var(--active)}
.focus-toggle svg{width:17px;height:17px}
.focus-toggle .exit-icon,.focus-mode .focus-toggle .enter-icon{display:none}
.focus-mode .focus-toggle .exit-icon{display:block}
.focus-mode .brand,.focus-mode .search,.focus-mode .global,.focus-mode .crumb,.focus-mode .subject-head,.focus-mode .index,.focus-mode .unit-head,.focus-mode .footer,.focus-mode .jump{display:none}
.focus-mode .bar{display:flex;justify-content:flex-end;padding-block:5px}
.focus-mode main{max-width:1680px;padding-top:13px;padding-inline:clamp(9px,2.5vw,36px)}
.focus-mode .reader{display:block}
.focus-mode .unit,.focus-mode .question{scroll-margin-top:58px}
.focus-mode .unit{margin-bottom:14px}
.question{padding:17px 22px;margin-bottom:13px}
.q-top{display:block}
.q-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px}
.q-id{font-size:.81rem}
.q-title{font-size:clamp(1.21rem,1.15rem + .43vw,1.56rem);font-weight:760;line-height:1.31;letter-spacing:-.014em;overflow-wrap:anywhere;text-wrap:pretty}
.q-title .symbol{letter-spacing:normal}
.local{margin:0;flex:none}
.local .modes{gap:2px;padding:2px}
.local .modes button{width:33px;height:32px;padding:0;font-size:.8rem;font-weight:700}
.answer{color:#dedee3;font-size:clamp(1.03rem,.99rem + .17vw,1.16rem);line-height:1.69;margin-top:11px}
.answer p{margin:0 0 .68em}
.answer p:last-child{margin:0}
.symbol{font-family:var(--math-font);font-size:1.07em;color:#eef4e6;white-space:nowrap}
.symbol var{font-style:italic}
.symbol sub{font-size:.7em;line-height:0;vertical-align:-.24em}
.math-line{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0 12px}
.math-line math{display:block;max-width:100%;overflow-x:auto;padding:7px 12px;border:1px solid #2c382c;border-radius:7px;background:#0f1610;color:#e8f3de;font-family:var(--math-font);font-size:1.06em}
pre{font-size:.94rem}
.codebar{font-size:.83rem}
.study figcaption{font-size:.86rem}
.external-fig img{max-height:390px}
.external-fig:not(:has(img:not([hidden]))){display:block}
.external-fig img[hidden]+figcaption{opacity:.76}
@media(max-width:790px){.bar{grid-template-columns:auto auto;gap:8px 12px}.controls{justify-self:end}.focus-mode .bar{padding-inline:12px}.search{grid-column:1/-1;grid-row:2}}
@media(max-width:575px){main{padding-inline:10px}.bar{padding-inline:10px}.question{padding:12px}.local .modes button{width:34px;height:34px}.q-title{font-size:1.25rem}.answer{line-height:1.64}.focus-toggle{width:32px;height:34px}.controls{gap:5px}.focus-mode main{padding-inline:8px}.diagram svg{min-width:0}.diagram svg[viewBox]{min-width:min(100%,320px)}}
@media(max-width:400px){.bar .modes button{padding-inline:4px;font-size:.67rem}.brand{font-size:.79rem}.brand svg{display:none}.controls{gap:4px}}
@media print{.symbol,.math-line math{color:#111}.math-line math{background:#fff}.focus-mode .unit-head,.focus-mode .subject-head{display:flex}}


/* Unit navigation and answer layout */
:root{--nav-height:65px;--answer-ink:#baeaff}
.bar{grid-template-columns:auto minmax(160px,1fr) auto auto}
@media(min-width:1041px){.bar:has(.unit-nav[hidden]){grid-template-columns:auto minmax(160px,1fr) auto}}
.unit-nav{display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.unit-chip{display:inline-grid;place-items:center;min-width:35px;min-height:36px;border:1px solid var(--line);border-radius:7px;padding:4px 7px;color:#c7ccd2;text-decoration:none;font:600 .81rem var(--mono)}
.unit-chip:hover,.unit-chip[aria-current=location]{color:var(--subject);background:#111613;border-color:#3c4d43}
.reader{display:block}
.q-title{color:#f6f7f8}
.answer{margin-top:13px;margin-left:clamp(5px,1.1vw,16px);padding-left:clamp(11px,1.35vw,20px);border-left:1px solid #283b45;color:var(--answer-ink)}
.answer strong{font-weight:750;color:#e0f5ff}
.answer .symbol{color:inherit}
.answer p{margin:0 0 .74em}
.answer .answer-points{margin:0 0 .8em;padding-left:1.18em}
.answer .answer-points:last-child{margin-bottom:0}
.answer-points li{padding-left:.16em;margin:0 0 .4em;white-space:pre-wrap;overflow-wrap:anywhere}
.answer-points li:last-child{margin-bottom:0}
.answer-points li::marker{color:#7dabbc}
.answer-points .subhead{margin-right:.15em}
.bank-link{display:inline-block;color:var(--muted);font-size:.85rem;margin-top:8px}
.bank-link:hover{color:var(--subject)}
.unit,.question{scroll-margin-top:calc(var(--nav-height) + 13px)}
.focus-mode .unit-nav{display:none}
.focus-mode .unit,.focus-mode .question{scroll-margin-top:calc(var(--nav-height) + 10px)}
@media(max-width:1040px){.bar{gap:8px 12px;grid-template-columns:auto minmax(150px,1fr) auto}.unit-nav{grid-column:1/-1;grid-row:2;justify-content:flex-start}.unit-chip{min-height:32px}}
@media(max-width:790px){.bar{grid-template-columns:auto auto}.search{grid-row:2;grid-column:1/-1}.unit-nav{grid-row:3}}
@media(max-width:575px){.answer{margin-left:4px;padding-left:10px}.unit-nav{gap:5px}.unit-chip{min-width:39px;min-height:32px}}
@media print{.answer,.answer strong{color:#111}.answer{border-color:#aaa}}


/* Longer answer layout */
.answer{
 max-inline-size:75ch;
 padding-inline-end:clamp(12px,3vw,42px);
}
.answer-points li{
 line-height:1.76;
 margin-block-end:.66em;
}
.answer-points li:last-child{margin-block-end:0}
.answer p{line-height:1.73}
@media(max-width:575px){
 .answer{padding-inline-end:10px}
 .answer-points li{line-height:1.72;margin-block-end:.58em}
}
@media print{.answer{max-inline-size:none;padding-inline-end:0}}


/* Low-glare spotlight backgrounds and comparison tables */
:root{
 --bg:#111317;
 --panel:#1a1d22;
 --line:#3a3e43;
 --fg:#e4e5e2;
 --muted:#adb5ba;
 --answer-ink:#bfced3;
 --accent:#dfc39b;
 --active:#443228;
 --glow:124 67 33;
 --halo:74 47 36;
 --card:#191c21;
}
:root[data-spotlight="teal"]{--glow:37 93 85;--halo:29 57 60;--accent:#aed7c8;--active:#283d39}
:root[data-spotlight="indigo"]{--glow:65 71 131;--halo:44 45 84;--accent:#c7c9e7;--active:#33354a}
:root[data-spotlight="rose"]{--glow:108 57 78;--halo:71 40 59;--accent:#e2bdc9;--active:#44313b}
:root[data-spotlight="slate"]{--glow:61 81 98;--halo:38 48 64;--accent:#c1d2de;--active:#2a3b47}
body{isolation:isolate}
body::before{
 content:"";
 position:fixed;
 inset:0;
 z-index:-1;
 pointer-events:none;
 background:
  radial-gradient(ellipse 81% 96% at 50% 12%,rgb(var(--glow)/.63) 0%,rgb(var(--glow)/.30) 35%,transparent 75%),
  radial-gradient(ellipse 105% 90% at 50% 35%,rgb(var(--halo)/.42),transparent 78%);
}
.top{background:rgb(22 24 29/.94);border-color:#38393d}
.question,.tile{
 background:var(--card);
 background:color-mix(in srgb,var(--card) 91%,transparent);
 border-color:#383b41;
}
.tile:hover{background:#23262c}
.q-title{color:var(--fg)}
.answer{color:var(--answer-ink);border-left-color:#35434b}
.answer strong{color:#e0e5e6}
.answer-points li::marker{color:#91aab4}
.q-id,.course,.unit-head span{color:color-mix(in srgb,var(--subject) 66%,var(--muted))}
.modes button[aria-pressed=true],.focus-toggle[aria-pressed=true]{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
.focus-toggle,.theme-summary{background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.searchbox:focus-within{border-color:var(--accent)}
.results{background:#1b1e23;border-color:var(--line)}
.codebox,.diagram{background:#1a1d22;border-color:#3b4148}
.math-line math{background:#252b2b;color:#d7e5df;border-color:#3d4748}
.theme-picker{position:relative;flex:none}
.theme-summary{
 list-style:none;
 display:grid;
 place-items:center;
 width:37px;
 height:37px;
 border-radius:8px;
 cursor:pointer;
}
.theme-summary::-webkit-details-marker{display:none}
.theme-summary:hover,.theme-picker[open] .theme-summary{border-color:var(--accent);color:var(--accent)}
.theme-panel{
 position:absolute;
 z-index:20;
 inset-inline-end:0;
 inset-block-start:calc(100% + 9px);
 width:180px;
 padding:9px;
 border:1px solid #43464d;
 border-radius:10px;
 background:#23262d;
 box-shadow:0 12px 30px #0007;
}
.theme-panel fieldset{display:grid;gap:3px;margin:0;padding:0;border:0;min-inline-size:0}
.theme-panel legend{padding:2px 7px 6px;color:var(--fg);font-weight:650;font-size:.82rem}
.theme-option{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:6px;color:var(--fg);font-size:.82rem;cursor:pointer}
.theme-option:hover,.theme-option:has(input:checked){background:var(--active)}
.theme-option input{margin:0;accent-color:var(--accent)}
.theme-swatch{width:12px;height:12px;border:1px solid #ffffff30;border-radius:50%;background:var(--swatch)}
.answer-table-wrap{
 overflow-x:auto;
 max-inline-size:100%;
 margin:0 0 .95em;
 border:1px solid #3b444b;
 border-radius:8px;
 scrollbar-width:thin;
}
.answer .answer-table{display:table;width:100%;border-collapse:separate;border-spacing:0;font-size:.91em;line-height:1.55}
.answer-table caption{
 text-align:left;
 padding:.55em .7em;

 color:#e2e6e7;
 font-weight:700;
}
.answer .answer-table :is(th,td){
 border:0;
 border-block-start:1px solid #394149;
 border-inline-end:1px solid #394149;
 padding:.54em .66em;
 text-align:left;
 vertical-align:top;
 min-inline-size:6.1em;
}
.answer .answer-table :is(th,td):last-child{border-inline-end:0}
.answer-table thead{background:#263039;color:#dae4e8}
.answer-table tbody{background:#1d2229;color:var(--answer-ink)}
.answer-table tbody tr:nth-child(even){background:#242a31}
.answer-table tbody th{color:#dbe3e7;font-weight:680}
.answer .answer-table.is-truth :is(th,td){text-align:center;min-inline-size:3.1em}
@media(max-width:575px){
 .theme-summary{width:32px;height:34px}
 .answer .answer-table{font-size:.88em}
}
@media(max-width:355px){
 .bar{grid-template-columns:minmax(0,1fr) auto;column-gap:5px}
 .bar .brand{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
 .bar .modes button{padding-inline:3px}
}
@media print{
 body::before{display:none}
 .answer-table-wrap{overflow:visible}
 .answer .answer-table{break-inside:auto}
 .answer-table tr{break-inside:avoid}
 .answer-table :is(caption,thead,tbody,tbody tr:nth-child(even),tbody th){background:white;color:black}
}

</style>

<script id="study-data" type="application/json">{"subjects":[{"id":"cmos","name":"Analog and Digital CMOS Design","code":"PCC-302-ECV","color":"#c6fa83","source":"https://chatgpt.com/library?account_id=personal&file_id=libfile_35f62f7c281c819193bf2915de0bfdce","count":70,"units":[{"title":"MOS Devices & Analog Building Blocks","questions":[{"id":"cmos-u1-q1","subject":"cmos","unit":1,"number":1,"q":"Explain the structure and working of an n-channel enhancement-type MOSFET with a neat diagram.","ans":{"s":"NMOS has n+ source/drain in a p body. A positive VGS above VT induces an n-channel.","m":"Cross-section · n+ source and drain lie in a p-type body. A thin oxide isolates the gate over the channel. The body is usually tied to the lowest potential to reverse-bias the body junctions.\nChannel creation · A positive gate voltage first repels holes, then attracts electrons. Strong inversion connects source and drain when VGS>VT.\nCurrent flow · A positive VDS moves electrons toward the drain and conventional current toward the source. At VDS≈VGS−VT the drain end pinches off while current continues.","d":"Device structure · Sketch a p-type body with heavily doped n+ source and drain separated by the channel region. Show the gate electrode above a thin oxide, and mark all four terminals G, D, S, and B. The oxide prevents steady gate-to-channel conduction in the ideal model.\nZero bias · At VGS=0, the p body separates the n+ regions. With the body tied to the source and a positive VDS, the drain–body junction is reverse biased and the drain current is approximately zero apart from leakage.\nChannel formation · Positive gate bias first repels holes, leaving fixed ionized acceptors in depletion. When VGS exceeds VT, electrons accumulate at the surface into a strong-inversion n-channel linking source and drain.\nDrain bias · Positive VDS drives electrons toward the drain while conventional ID flows toward the source. The channel gets thinner near the drain as the local gate overdrive there falls to VGS−VT−VDS.\nPinch-off · At VDS≈VGS−VT, inversion vanishes at the drain end. Electrons still cross the depletion region, sustaining saturation current. A greater VDS can shorten the effective channel and slightly raise ID.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 520 205\" role=\"img\" aria-label=\"Enhancement NMOS cross-section under positive inversion bias\" style=\"display:block;width:100%;height:auto;max-width:520px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Enhancement NMOS cross-section under positive inversion bias\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"519\" height=\"204\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"58\" y=\"83\" width=\"404\" height=\"87\" fill=\"#322235\" stroke=\"#ae8caf\" rx=\"2\"/>\u003crect x=\"88\" y=\"84\" width=\"82\" height=\"36\" fill=\"#123548\" stroke=\"#60a5fa\" rx=\"2\"/>\u003crect x=\"350\" y=\"84\" width=\"82\" height=\"36\" fill=\"#123548\" stroke=\"#60a5fa\" rx=\"2\"/>\u003crect x=\"169\" y=\"82\" width=\"182\" height=\"5\" fill=\"#12513b\" stroke=\"#4ade80\" rx=\"2\"/>\u003crect x=\"175\" y=\"72\" width=\"170\" height=\"9\" fill=\"#145258\" stroke=\"#5eead4\" rx=\"2\"/>\u003crect x=\"175\" y=\"49\" width=\"170\" height=\"23\" fill=\"#4c283b\" stroke=\"#fb7185\" rx=\"2\"/>\u003cpath d=\"M129 84 V45 M391 84 V45 M426 170 V187 M260 49 V27\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ctext x=\"129\" y=\"39\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">S\u003c/text>\u003ctext x=\"391\" y=\"39\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">D\u003c/text>\u003ctext x=\"260\" y=\"22\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">G\u003c/text>\u003ctext x=\"260\" y=\"65\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Gate electrode\u003c/text>\u003ctext x=\"260\" y=\"103\" fill=\"#86efac\" font-size=\"13\" text-anchor=\"middle\">Inversion channel (n)\u003c/text>\u003ctext x=\"128\" y=\"107\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"392\" y=\"107\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">n+\u003c/text>\u003ctext x=\"260\" y=\"149\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">p-type body\u003c/text>\u003ctext x=\"426\" y=\"200\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">B\u003c/text>\u003c/svg>"}},{"id":"cmos-u1-q2","subject":"cmos","unit":1,"number":2,"q":"Explain the three operating regions of an NMOS transistor (cut-off, triode and saturation) with the condition for each region.","ans":{"s":"Cutoff: VGS≤VT. Triode: 0≤VDS\u003cVOV. Saturation: VDS≥VOV. VOV=VGS−VT.","m":"Setup · Define VOV=VGS−VT and β=μnCoxW/L, assuming positive VDS and a source-tied body.\nCutoff · For VOV≤0 use ID≈0. A real transistor still has subthreshold leakage.\nTriode · For VOV>0 and VDS\u003cVOV, use ID=β(VOVVDS−VDS²/2). At small VDS, the resistance is approximately 1/(βVOV).\nSaturation · For VOV>0 and VDS≥VOV, the channel pinches off at the drain. Ideal ID=βVOV²/2. Substituting the boundary voltage into the triode law gives the same current.","d":"Model and notation · Take VDS≥0 and assume an enhancement NMOS with source and body at the same voltage. Let VOV=VGS−VT and β=μnCox(W/L). These expressions describe the ideal long-channel strong-inversion model.\nCutoff · For VGS≤VT there is insufficient gate voltage to form a strong inversion channel. Use ID≈0 for first-pass circuit calculations. Real MOSFETs still carry weak-inversion current near or below threshold.\nTriode · When VOV>0 and 0≤VDS\u003cVOV, the full channel is inverted. The current is ID=β(VOVVDS−VDS²/2). For very small VDS, the square term is small and the device behaves as a resistor Ron≈1/(βVOV).\nSaturation · For VOV>0 and VDS≥VOV, the drain-end channel pinches off. The ideal current is ID=βVOV²/2. In practice, channel-length modulation gives the saturation trace a small positive slope.\nBoundary check · With VT=0.5 V and VGS=1.2 V, VOV is 0.7 V. A VDS of 0.2 V places the device in triode, 0.7 V is the knee, and 1.0 V places it in saturation. Substituting VDS=VOV into the triode law gives βVOV²/2, matching the saturation law at the knee.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 245\" role=\"img\" aria-label=\"NMOS output characteristics for three gate overdrives\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>NMOS output characteristics for three gate overdrives\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"499\" height=\"244\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M65 199 H465 l-7 -4 m7 4 -7 4 M65 199 V30 l-4 7 m4 -7 4 7\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q100 158 135 151 Q180 145 445 133\" fill=\"none\" stroke=\"#86efac\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q165 82 205 90 Q270 86 445 74\" fill=\"none\" stroke=\"#5eead4\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q150 78 224 52 Q248 44 280 44 L445 33\" fill=\"none\" stroke=\"#93c5fd\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q164 197 280 44\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"5 6\"/>\u003ctext x=\"49\" y=\"25\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">ID\u003c/text>\u003ctext x=\"457\" y=\"224\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDS\u003c/text>\u003ctext x=\"83\" y=\"222\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">0\u003c/text>\u003ctext x=\"119\" y=\"174\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">Triode\u003c/text>\u003ctext x=\"341\" y=\"164\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">Saturation\u003c/text>\u003ctext x=\"385\" y=\"115\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Larger VGS\u003c/text>\u003ctext x=\"365\" y=\"57\" fill=\"#fbbf24\" font-size=\"12\" text-anchor=\"middle\">VDS = VOV boundary\u003c/text>\u003c/svg>"}},{"id":"cmos-u1-q3","subject":"cmos","unit":1,"number":3,"q":"Draw and explain the I–V characteristics of an NMOS transistor. Write the drain current equations and explain channel length modulation.","ans":{"s":"ID rises in triode, flattens in saturation, then slopes upward with λ. ro≈1/(λID).","m":"Output family · Plot ID against VDS at several fixed VGS settings. Larger VGS means more current and a higher knee voltage VOV=VGS−VT.\nEquations · With β=μnCoxW/L, cutoff current is approximately zero. Triode current is β(VOVVDS−VDS²/2). Ideal saturation current is βVOV²/2.\nFinite slope · Increasing VDS beyond the knee shortens the inversion channel. The factor (1+λVDS) models the added saturation slope and gives ro≈1/(λID) near the operating point.","d":"Plot construction · Put VDS on the horizontal axis and ID on the vertical axis. Draw several traces at fixed gate voltages. A larger VGS raises the curve and shifts the triode-to-saturation knee to the right.\nCurrent equations · Set VOV=VGS−VT and β=μnCoxW/L. For VGS≤VT, ID≈0. For VGS>VT and VDS\u003cVOV, ID=β(VOVVDS−VDS²/2). For VDS≥VOV, the ideal model gives ID=βVOV²/2.\nShape and boundary · In triode the initial slope is βVOV and decreases as VDS rises. At VDS=VOV, the local drain-side overdrive becomes zero and the ideal curve reaches a horizontal saturation plateau. Both equations yield the same current there.\nChannel-length modulation · After pinch-off, increasing VDS expands the drain depletion region toward the source. The effective channel shortens, leading to a positive saturation slope modeled by ID≈(βVOV²/2)(1+λVDS).\nOutput resistance · At the chosen saturation bias, gds=∂ID/∂VDS≈λID for small λVDS, giving ro≈1/(λID). This is the slope at fixed VGS and body bias. In a transfer measurement, sweep VGS at fixed VDS and check that saturation remains valid.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 245\" role=\"img\" aria-label=\"NMOS output characteristics for three gate overdrives\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>NMOS output characteristics for three gate overdrives\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"499\" height=\"244\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M65 199 H465 l-7 -4 m7 4 -7 4 M65 199 V30 l-4 7 m4 -7 4 7\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q100 158 135 151 Q180 145 445 133\" fill=\"none\" stroke=\"#86efac\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q165 82 205 90 Q270 86 445 74\" fill=\"none\" stroke=\"#5eead4\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q150 78 224 52 Q248 44 280 44 L445 33\" fill=\"none\" stroke=\"#93c5fd\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q164 197 280 44\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"5 6\"/>\u003ctext x=\"49\" y=\"25\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">ID\u003c/text>\u003ctext x=\"457\" y=\"224\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDS\u003c/text>\u003ctext x=\"83\" y=\"222\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">0\u003c/text>\u003ctext x=\"119\" y=\"174\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">Triode\u003c/text>\u003ctext x=\"341\" y=\"164\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">Saturation\u003c/text>\u003ctext x=\"385\" y=\"115\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Larger VGS\u003c/text>\u003ctext x=\"365\" y=\"57\" fill=\"#fbbf24\" font-size=\"12\" text-anchor=\"middle\">VDS = VOV boundary\u003c/text>\u003c/svg>"}},{"id":"cmos-u1-q4","subject":"cmos","unit":1,"number":4,"q":"Draw the low-frequency small-signal model of a MOSFET. Define transconductance (gm) and output resistance (Ro).","ans":{"s":"Gate open. Drain–source: gm·vgs and gmb·vbs in parallel with ro. gm≈2ID/VOV and ro≈1/(λID).","m":"Equivalent circuit · At a saturation bias, draw a drain-to-source dependent current gm·vgs+gmb·vbs in parallel with ro. The gate and body draw negligible incremental current at low frequency.\nGate sensitivity · gm=∂ID/∂VGS at fixed VDS and VBS. In the long-channel model gm≈2ID/VOV.\nDrain sensitivity · gds=∂ID/∂VDS and ro=1/gds≈1/(λID). Omit the body term when body and source move together, making vbs=0. The incremental model assumes a fixed DC bias.","d":"Bias and purpose · Linearize the device around a DC saturation operating point with drain current ID. Use small incremental voltages and currents. Assumptions are low frequency, negligible gate current and junction currents, and signal swings small enough to stay in saturation.\nModel sketch · Leave the gate and body terminals open as current inputs. Between drain and source draw ro in parallel with a controlled current source pointing from drain to source. Label its value gm·vgs+gmb·vbs with vbs=vb−vs.\nTransconductance · Define gm=∂ID/∂VGS at fixed VDS and VBS. Differentiating ID≈βVOV²/2 yields gm≈βVOV=2ID/VOV=√(2βID). A larger gm produces more incremental drain current for the same gate signal.\nOutput resistance · Define gds=∂ID/∂VDS at fixed VGS and VBS, and ro=1/gds. For first-order channel-length modulation and small λVDS, ro≈1/(λID).\nBody term · If the body follows source, vbs=0. With a fixed body and moving source, vbs contributes to the current. At a finite reverse body bias VSB, gmb≈gmγ/[2√(2ϕF+VSB)] in the classical model.\nLinearized current · For given vgs, vds and vbs, add the three current contributions algebraically. Their signs follow the drain-to-source reference direction.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 208\" role=\"img\" aria-label=\"Low-frequency NMOS incremental model\" style=\"display:block;width:100%;height:auto;max-width:560px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Low-frequency NMOS incremental model\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"559\" height=\"207\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M338 40 H450 M338 165 H450 M338 40 V81 M338 125 V165 M450 40 V67 l-7 7 14 12 -14 12 14 12 -14 12 14 12 -7 7 V165\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M338 86 V119 l-5 -8 m5 8 5 -8\" fill=\"none\" stroke=\"#67e8f9\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M60 78 H123 M60 133 H123\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M376 40 V24 M376 165 V184\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"338\" cy=\"103\" r=\"24\" fill=\"none\" stroke=\"#67e8f9\"/>\u003ccircle cx=\"376\" cy=\"40\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"376\" cy=\"165\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"377\" y=\"19\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Drain\u003c/text>\u003ctext x=\"377\" y=\"199\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Source\u003c/text>\u003ctext x=\"252\" y=\"107\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">gm·vgs + gmb·vbs\u003c/text>\u003ctext x=\"476\" y=\"108\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">ro\u003c/text>\u003ctext x=\"92\" y=\"70\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Gate (open)\u003c/text>\u003ctext x=\"92\" y=\"125\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Body (open)\u003c/text>\u003c/svg>"}},{"id":"cmos-u1-q5","subject":"cmos","unit":1,"number":5,"q":"Write a short note on capacitors and resistors used in CMOS circuits.","ans":{"s":"Caps: MIM/MOM/MOS. Resistors: poly/diffusion/well or triode MOS. Check matching, parasitics, voltage coefficient.","m":"Capacitors · MIM uses dedicated metal plates and MOM uses interdigitated fingers. Both suit relatively linear analog capacitors. MOS capacitors can be dense but their capacitance depends on bias and frequency.\nResistors · Poly, diffusion and well resistors follow R≈RsheetL/W plus contact/end terms. Diffusion and well types add junction parasitics.\nTunable option · Bias a MOSFET in triode for a compact voltage-controlled resistance. Choose parts using area, parasitics, matching and linearity requirements.","d":"MIM and MOM capacitance · A metal–insulator–metal capacitor uses dedicated plates and dielectric. A metal–oxide–metal capacitor uses interdigitated interconnect fingers and fringe fields. Both are useful for analog ratios, sampling and filtering when the process offers adequate density and matching.\nMOS capacitor · The gate electrode and semiconductor act as the plates, with the gate oxide as dielectric. The capacitance changes with accumulation, depletion and inversion and also depends on measurement frequency. Choose a bias region that suits the required linearity.\nPassive resistors · Polysilicon, diffusion and well layers provide integrated resistance. Estimate R≈Rsheet·L/W plus end and contact terms. Diffusion and well resistors have junction capacitance and can show appreciable voltage coefficients.\nMOS channel resistor · A transistor biased in triode behaves approximately as a resistor for small VDS. Near zero drain bias Ron≈1/[μCox(W/L)VOV]. A gate bias tunes this resistance, but changing terminal voltage also changes overdrive and distorts large signals.\nLayout trade-offs · Compare area, linearity, voltage and temperature coefficients, matching, parasitics and allowed terminal voltages. For precision ratios use matched geometry, symmetric surroundings, adequate segmentation and dummy elements when appropriate."}},{"id":"cmos-u1-q6","subject":"cmos","unit":1,"number":6,"q":"Explain the MOS switch. Compare NMOS switch, PMOS switch and CMOS transmission-gate switch.","ans":{"s":"NMOS passes strong 0, PMOS strong 1. Parallel NMOS+PMOS with complementary control passes both rails.","m":"Switch action · The enabled MOS channel is a voltage-dependent resistance. The switch becomes weaker as the signal reduces gate overdrive.\nSingle devices · NMOS with its gate high passes a strong low and a weak high around VDD−VTn. PMOS with its gate low passes a strong high and a weak low around |VTp|.\nTransmission gate · Put the devices in parallel and apply complementary gate controls. Each covers the other device’s weak rail, giving full-swing transfer and additional capacitance.","d":"Switch model · Use a MOS channel as a controlled bidirectional connection. Its ON resistance depends on gate overdrive and terminal voltage. For a small channel drop, Ron≈1/[μCox(W/L)VOV] at the chosen signal level.\nNMOS choice · With its gate at VDD, an NMOS passes a ground-level signal strongly. When it charges a receiving node high, VGS falls as the node rises. Charging becomes weak near VDD−VTn, with body effect increasing threshold for a raised source.\nPMOS choice · A PMOS enabled by a low gate passes VDD strongly. While pulling a floating node low its VSG falls and conduction weakens near |VTp|. Tie the n-well to VDD to maintain normal junction bias.\nTransmission gate · Place NMOS and PMOS channels in parallel and drive their gates with EN and EN̄, respectively. The NMOS maintains low-level conduction and the PMOS maintains high-level conduction. Both carry signal in the middle of the rail range.\nComparison · A lone device uses less area and simpler control. The transmission gate passes both rails and usually improves resistance uniformity. Check extra gate capacitance, complementary clock timing, charge injection, off leakage and permitted terminal voltages in analog use."}},{"id":"cmos-u1-q7","subject":"cmos","unit":1,"number":7,"q":"What is a MOS diode (diode-connected MOSFET)? Explain its working and show that its small-signal resistance is approximately 1/gm.","ans":{"s":"Tie gate to drain. vgs=vds and r≈1/(gm+gds)≈1/gm if body tracks source.","m":"Bias condition · Short the gate to the drain so VDS=VGS. Once VGS>VT, the saturation inequality VDS≥VGS−VT is always satisfied.\nTest signal · Hold source and body fixed and apply v to the gate–drain terminal. Then vgs=vds=v, so i=(gm+gds)v.\nResistance · r=1/(gm+gds)=ro∥(1/gm). It approaches 1/gm when gmro≫1. Diode-connected devices establish mirror bias and serve as active loads. The result describes the local slope of the two-terminal I–V curve.","d":"Connection · Short the MOS gate to its drain and treat that common node and the source as the two external terminals. For an NMOS with enhancement threshold, increasing the terminal voltage from drain to source increases gate overdrive at the same time.\nDC region · The tie imposes VDS=VGS. When VGS>VT, VDS≥VGS−VT automatically holds, so the transistor conducts in saturation under the long-channel approximation. Its current behaves approximately as ID=(β/2)(VGS−VT)², with a channel-length-modulation factor if needed.\nSmall-signal test · Apply a voltage increment v at the gate–drain node while holding the source and body fixed. Both vgs and vds equal v and vbs=0. The incremental drain current is i=gmv+gdsv.\nResistance derivation · The incremental two-terminal resistance is r=v/i=1/(gm+gds)=(1/gm)∥ro. When the intrinsic gain gmro is much larger than one, gds is much smaller than gm and r≈1/gm.\nUse and assumption · The diode connection converts a reference current into a bias voltage for mirrors and gives an active load with low incremental resistance. If testing between source and gate–drain with body held at a different fixed potential, include the body-effect term."}},{"id":"cmos-u1-q8","subject":"cmos","unit":1,"number":8,"q":"Explain how a MOSFET is used as a current source and a current sink. Explain the basic NMOS current mirror.","ans":{"s":"NMOS sinks to GND, PMOS sources from VDD. A current mirror copies VGS and scales by W/L.","m":"Current direction · A saturated NMOS below the load sinks current to ground. A saturated PMOS above the load supplies current from VDD.\nMirror operation · IREF in diode-connected M1 fixes the shared gate voltage. M2 reproduces the overdrive and the current scales by (W/L)2/(W/L)1 for matched devices.\nCompliance · The NMOS output needs VOUT≥VOV. Different drain voltages cause mirror error through finite output resistance.","d":"NMOS sink · Put the NMOS below the load, with its source and body at the low rail. Bias the gate at a fixed voltage. With VDS≥VOV, drain current is mainly set by VGS and geometry, so it draws approximately constant current from the load.\nPMOS source · Put the PMOS between VDD and the load, with source and well at VDD. Bias VSG and maintain VSD≥VOVp. The PMOS supplies approximately constant current to the node while it remains in saturation.\nReference branch · In the NMOS mirror, short M1 gate and drain and force the reference current through that node. M1 automatically develops the VGS needed for IREF. Connect M2 gate to M1 gate and tie both sources and bodies to ground.\nMirroring relation · For matched thresholds and negligible channel-length modulation, both devices share VOV. The saturation law gives IOUT/IREF≈(W/L)2/(W/L)1. Equal geometry ideally copies the reference current.\nOutput compliance · Keep VOUT≥VOV for the NMOS output device. A lower output drives it into triode and reduces the available sink current. Finite ro and different drain voltages cause ratio error. Longer channels or cascoding improve accuracy, with extra headroom required for a cascode.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 570 220\" role=\"img\" aria-label=\"Basic NMOS current mirror\" style=\"display:block;width:100%;height:auto;max-width:570px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Basic NMOS current mirror\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"569\" height=\"219\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M150 42 V86 M150 86 V111 M150 147 V181 H400 V147 M400 111 V42 M130 114 V143 M380 114 V143 M150 111 V147 M400 111 V147\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M150 86 H102 V129 H130 M102 129 V96 H355 V129 H380\" fill=\"none\" stroke=\"#93c5fd\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M74 27 H226 M121 181 H433 M284 181 V197\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M150 48 V73 l-4 -6 m4 6 4 -6 M400 48 V73 l-4 -6 m4 6 4 -6\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"150\" cy=\"86\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"102\" cy=\"129\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"284\" cy=\"181\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"150\" y=\"22\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Reference bias\u003c/text>\u003ctext x=\"400\" y=\"34\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT / load\u003c/text>\u003ctext x=\"181\" y=\"62\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">IREF\u003c/text>\u003ctext x=\"434\" y=\"62\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">IOUT\u003c/text>\u003ctext x=\"177\" y=\"137\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M1\u003c/text>\u003ctext x=\"425\" y=\"137\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M2\u003c/text>\u003ctext x=\"214\" y=\"90\" fill=\"#93c5fd\" font-size=\"13\" text-anchor=\"middle\">Shared VGS\u003c/text>\u003ctext x=\"284\" y=\"211\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">GND / bulk ties\u003c/text>\u003c/svg>"}},{"id":"cmos-u1-q9","subject":"cmos","unit":1,"number":9,"q":"Explain source degeneration. How does it affect the effective transconductance and output resistance?","ans":{"s":"Source resistor adds negative feedback. Gm↓, Rout↑. Gm≈gm/(1+gmRS), Rout≈ro(1+gmRS)+RS.","m":"Local feedback · A larger current raises the source voltage by idRS, reducing vgs and opposing the increase.\nEffective transconductance · With AC-grounded drain, Gm=gm/[1+(gm+gmb+gds)RS] for fixed bulk. This is often approximated as gm/(1+gmRS).\nDrain resistance · With gate AC-grounded, Rout=ro+[1+(gm+gmb)ro]RS. Omit gmb for a source-tied body. RS improves linearity and current stiffness while using IDRS of DC headroom. A source bypass capacitor changes the frequency range over which this feedback applies.","d":"Feedback mechanism · Insert an unbypassed resistance RS in the source lead of a biased NMOS. When the drain current rises, the source voltage rises by approximately idRS. That lowers vgs for the same gate voltage and feeds back against the current increase.\nTransconductance definition · To obtain effective Gm, AC-ground the drain and body. Then vgs=vg−idRS and both vds and vbs equal −idRS. Substitute into id=gmvgs+gmbvbs+gdsvds.\nGm result · Rearranging gives Gm=gm/[1+(gm+gmb+gds)RS]. For a source-tied body and gds≪gm, this reduces to gm/(1+gmRS).\nOutput resistance test · AC-ground the gate and body and force an incremental drain current it. The same current raises the source by itRS. Solving the small-signal equation gives vtest/it=ro+[1+(gm+gmb)ro]RS. Omit gmb when body follows source.\nDesign effects · The source resistor reduces gain and makes the input-to-current law more linear. It also increases output resistance and improves current stiffness. DC source voltage rises by IDRS, which must be included in gate bias and saturation headroom. A bypass capacitor across RS can preserve the DC drop while reducing degeneration at higher frequencies."}},{"id":"cmos-u1-q10","subject":"cmos","unit":1,"number":10,"q":"Explain the steps to simulate the I–V characteristics of an NMOS transistor using PSPICE.","ans":{"s":"DC sweep VDS, step VGS, plot ID. To get transfer curve sweep VGS at fixed VDS.","m":"Circuit · Ground the NMOS source and body. Drive the gate and drain from named DC voltage sources VGS and VDS. Include the correct model and geometry.\nSweep · In a DC Sweep profile vary VDS as the primary sweep and VGS as a secondary stepped source. Choose a safe range for the technology.\nReadout · Plot ID or −I(VDS), depending on sign convention. Mark the knee and saturation slope. For a transfer curve sweep VGS at fixed VDS.","d":"Test schematic · In Capture place the desired NMOS model, two independent VDC sources and global ground 0. Connect one source between gate and ground and name it VGS. Connect a second between drain and ground and name it VDS. Tie the source and body to ground.\nModel check · Use the process library or an explicit model appropriate to the device. Verify device dimensions and terminal order. Pick voltage limits compatible with that technology before running the sweep.\nSimulation setup · Create a DC Sweep profile. Use VDS for the primary voltage-source sweep. A 0 to 1.8 V sweep in small steps is suitable only for a model and device rated for that range. Add a secondary sweep of VGS at several fixed increments above and below threshold.\nCurrent plot · In Probe trace the drain terminal current or negate I(VDS) when the voltage-source convention reports the opposite polarity. Put VDS on the x-axis and identify the separate gate-bias traces by their values.\nExamination of results · Mark the cutoff trace, triode knee around VDS≈VGS−VT, and small saturation slope. Use a second profile sweeping VGS at fixed VDS to obtain the transfer curve, checking the desired bias region. Local slopes estimate gm or gds."}},{"id":"cmos-u1-q11","subject":"cmos","unit":1,"number":11,"q":"Explain the operation of an n-channel enhancement MOSFET in the cut-off, triode and saturation regions with neat I–V characteristics.","ans":{"s":"Cutoff: VGS≤VT. Triode: 0≤VDS\u003cVOV. Saturation: VDS≥VOV. VOV=VGS−VT.","m":"Cutoff and inversion · VGS≤VT gives ID≈0. Above threshold an n-channel forms between source and drain.\nTriode · For VDS\u003cVOV=VGS−VT, the whole channel is inverted and ID=β(VOVVDS−VDS²/2). The trace starts approximately linear.\nSaturation · For VDS≥VOV the drain end pinches off and ID≈βVOV²/2. On the ID–VDS plot larger VGS raises each curve and shifts the knee right. Channel-length modulation gives a slight upward slope after the knee.","d":"Device operation · The enhancement NMOS has no strong conducting channel at VGS=0. Raising VGS past VT induces an n-type inversion layer joining the source and drain. A positive VDS lowers the gate overdrive near the drain.\nCutoff · If VGS≤VT, strong-inversion current is approximately zero, though a real device draws weak-inversion leakage. On an ID–VDS sketch this trace stays near the horizontal axis.\nTriode · Let VOV=VGS−VT and β=μnCoxW/L. For VGS>VT and 0≤VDS\u003cVOV, inversion extends to the drain. Use ID=β(VOVVDS−VDS²/2). The initial slope βVOV makes the MOSFET look resistive near the origin.\nSaturation · At the knee VDS=VOV, the inversion layer pinches off at the drain. For larger VDS use the ideal law ID=βVOV²/2. A real curve rises gently with VDS because its effective channel shortens.\nI–V diagram · Plot drain current vertically and drain voltage horizontally. Draw a family of fixed-VGS curves and mark the VDS=VOV knees. Higher VGS produces both a larger saturation current and a knee farther right. The two region equations give the same current at every knee.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 245\" role=\"img\" aria-label=\"NMOS output characteristics for three gate overdrives\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>NMOS output characteristics for three gate overdrives\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"499\" height=\"244\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M65 199 H465 l-7 -4 m7 4 -7 4 M65 199 V30 l-4 7 m4 -7 4 7\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q100 158 135 151 Q180 145 445 133\" fill=\"none\" stroke=\"#86efac\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q165 82 205 90 Q270 86 445 74\" fill=\"none\" stroke=\"#5eead4\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q150 78 224 52 Q248 44 280 44 L445 33\" fill=\"none\" stroke=\"#93c5fd\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M65 199 Q164 197 280 44\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"5 6\"/>\u003ctext x=\"49\" y=\"25\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">ID\u003c/text>\u003ctext x=\"457\" y=\"224\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDS\u003c/text>\u003ctext x=\"83\" y=\"222\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">0\u003c/text>\u003ctext x=\"119\" y=\"174\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">Triode\u003c/text>\u003ctext x=\"341\" y=\"164\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">Saturation\u003c/text>\u003ctext x=\"385\" y=\"115\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Larger VGS\u003c/text>\u003ctext x=\"365\" y=\"57\" fill=\"#fbbf24\" font-size=\"12\" text-anchor=\"middle\">VDS = VOV boundary\u003c/text>\u003c/svg>"}},{"id":"cmos-u1-q12","subject":"cmos","unit":1,"number":12,"q":"Draw the low-frequency small-signal model of a MOSFET and define the parameters gm and ro. Write their expressions.","ans":{"s":"Gate open. Drain–source: gm·vgs and gmb·vbs in parallel with ro. gm≈2ID/VOV and ro≈1/(λID).","m":"Sketch · Draw a drain-to-source current source gm·vgs+gmb·vbs in parallel with ro. The gate draws negligible incremental current at low frequency.\nExpressions · gm=∂ID/∂VGS≈βVOV=2ID/VOV in long-channel saturation. Output conductance is gds=∂ID/∂VDS, giving ro=1/gds≈1/(λID).\nBody term · A source-tied body gives vbs=0. All derivatives are taken about a fixed bias point with the other terminal voltage differences held constant. Gate and drain slopes are local slopes.","d":"Model drawing · Represent the saturated transistor by an open gate at low frequency and a dependent current source between drain and source. Its positive direction is drain to source and its value is gm·vgs+gmb·vbs. Place ro in parallel with the source.\nDefinition of gm · At a given DC operating point, gm=(∂ID/∂VGS) at constant VDS and VBS. Under the ideal square-law approximation, β=μnCox(W/L) and ID=βVOV²/2. Differentiation gives gm=βVOV=2ID/VOV=√(2βID).\nDefinition of ro · Output conductance is gds=(∂ID/∂VDS) at constant VGS and VBS. The resistance ro=vds/id for a drain test with vgs=vbs=0 equals 1/gds.\nFinite slope · With ID≈ID0(1+λVDS), gds≈λID0 and ro≈1/(λID) when λVDS is small. The ideal saturation limit λ→0 gives infinite ro.\nBody effect and check · A source-tied bulk makes vbs=0, so retain gm·vgs alone in the dependent source. For ID=100 µA, VOV=0.2 V and λ=0.02 V⁻¹, the approximate values are gm=1 mS and ro=500 kΩ.\nParameter extraction · On simulated I–V data, estimate gm from the local slope of a transfer curve and gds from the local slope of an output curve.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 208\" role=\"img\" aria-label=\"Low-frequency NMOS incremental model\" style=\"display:block;width:100%;height:auto;max-width:560px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Low-frequency NMOS incremental model\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"559\" height=\"207\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M338 40 H450 M338 165 H450 M338 40 V81 M338 125 V165 M450 40 V67 l-7 7 14 12 -14 12 14 12 -14 12 14 12 -7 7 V165\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M338 86 V119 l-5 -8 m5 8 5 -8\" fill=\"none\" stroke=\"#67e8f9\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M60 78 H123 M60 133 H123\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M376 40 V24 M376 165 V184\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"338\" cy=\"103\" r=\"24\" fill=\"none\" stroke=\"#67e8f9\"/>\u003ccircle cx=\"376\" cy=\"40\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"376\" cy=\"165\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"377\" y=\"19\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Drain\u003c/text>\u003ctext x=\"377\" y=\"199\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Source\u003c/text>\u003ctext x=\"252\" y=\"107\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">gm·vgs + gmb·vbs\u003c/text>\u003ctext x=\"476\" y=\"108\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">ro\u003c/text>\u003ctext x=\"92\" y=\"70\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Gate (open)\u003c/text>\u003ctext x=\"92\" y=\"125\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Body (open)\u003c/text>\u003c/svg>"}},{"id":"cmos-u1-q13","subject":"cmos","unit":1,"number":13,"q":"Explain source degeneration. How does a source resistor affect the transconductance and the output resistance of a MOS current source?","ans":{"s":"Source resistor adds negative feedback. Gm↓, Rout↑. Gm≈gm/(1+gmRS), Rout≈ro(1+gmRS)+RS.","m":"Mechanism · A source resistor introduces negative current feedback: a positive id raises source voltage and reduces the gate overdrive.\nGain · With fixed bulk, Gm=gm/[1+(gm+gmb+gds)RS] for a drain AC short. Neglecting body effect and gds gives gm/(1+gmRS).\nCurrent-source result · Rout=ro+[1+(gm+gmb)ro]RS. The output current becomes less sensitive to drain voltage, while the minimum output voltage rises by approximately IDRS. This reduces the available output swing.","d":"Circuit · Place RS between the source of a saturated NMOS current sink and ground. Give the gate a fixed bias and choose it to supply the required overdrive after the DC drop IDRS. Treat the gate as AC-grounded when calculating drain output resistance.\nSource feedback · An increase in drain current raises vs by idRS. For a fixed gate that lowers vgs and opposes the current change. A fixed body also gives vbs=−vs and raises the DC threshold through body effect.\nGate-controlled current · With drain AC-grounded, insert vgs=vg−idRS and vds=vbs=−idRS into the incremental current equation. This gives Gm=gm/[1+(gm+gmb+gds)RS].\nOutput resistance · Apply a test current it at the drain with gate and body fixed. Rearranging gives vtest/it=ro+(1+(gm+gmb)ro)RS. The source resistor appears multiplied by an intrinsic gain term.\nPractical consequence · With gm=1 mS, ro=100 kΩ and RS=1 kΩ, neglecting body effect, the approximate Gm is 0.5 mS and Rout is 201 kΩ. This stiffens the current sink while consuming IDRS of DC headroom. The required external drain voltage is at least VOV+IDRS."}},{"id":"cmos-u1-q14","subject":"cmos","unit":1,"number":14,"q":"Explain the working of a simple NMOS current mirror. Derive the output current in terms of the reference current and discuss the effect of channel-length modulation.","ans":{"s":"IOUT/IREF≈(W/L)2/(W/L)1 × (1+λ2VDS2)/(1+λ1VDS1). Require VOUT≥VOV.","m":"Bias · IREF through diode-connected M1 establishes the gate voltage shared by M2. Both devices share VOV for matched thresholds and source/body ties.\nRatio · In saturation, IOUT/IREF≈[(W/L)2/(W/L)1][(1+λ2VOUT)/(1+λ1VGS)]. The second factor is unity in the ideal model.\nError and compliance · For equal λ, the approximate fractional output error is λ(VOUT−VGS). Keep VOUT≥VOV and use longer channels or cascoding to reduce drain-voltage sensitivity. Matching the drain voltages also helps.","d":"Set the reference · Short M1 gate to its drain and force IREF through it. Since VDS1=VGS, M1 is saturated when conducting. Connect the gates together and use equal source and body potentials for M1 and M2.\nIdeal derivation · For matched process parameters and thresholds, VOV is common. Use Ii=(μnCox/2)(W/L)iVOV² for each device and divide the two equations. The result IOUT=IREF[(W/L)2/(W/L)1] sets the geometry-dependent current ratio.\nInclude channel-length modulation · Write Ii≈(μnCox/2)(W/L)iVOV²(1+λiVDSi). Division gives IOUT/IREF≈[(W/L)2/(W/L)1][(1+λ2VOUT)/(1+λ1VGS)]. Equal λ and equal drain voltages cancel the first-order effect.\nError estimate · For matched geometries and small λVDS, fractional error is about λ(VOUT−VGS). For λ=0.02 V⁻¹ and a 0.5 V excess drain voltage, IOUT is approximately 1% above the ideal copy.\nCompliance and remedies · Maintain VOUT≥VOV so M2 remains saturated. Below that limit the equation must be replaced by the triode model. Use longer channels, matched drain voltages or cascoding to reduce sensitivity to VOUT, accounting for headroom. A compliance failure typically produces a much larger error than the first-order finite-slope estimate.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 570 220\" role=\"img\" aria-label=\"Basic NMOS current mirror\" style=\"display:block;width:100%;height:auto;max-width:570px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Basic NMOS current mirror\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"569\" height=\"219\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003cpath d=\"M150 42 V86 M150 86 V111 M150 147 V181 H400 V147 M400 111 V42 M130 114 V143 M380 114 V143 M150 111 V147 M400 111 V147\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M150 86 H102 V129 H130 M102 129 V96 H355 V129 H380\" fill=\"none\" stroke=\"#93c5fd\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M74 27 H226 M121 181 H433 M284 181 V197\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M150 48 V73 l-4 -6 m4 6 4 -6 M400 48 V73 l-4 -6 m4 6 4 -6\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"150\" cy=\"86\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"102\" cy=\"129\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"284\" cy=\"181\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"150\" y=\"22\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Reference bias\u003c/text>\u003ctext x=\"400\" y=\"34\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT / load\u003c/text>\u003ctext x=\"181\" y=\"62\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">IREF\u003c/text>\u003ctext x=\"434\" y=\"62\" fill=\"#fbbf24\" font-size=\"13\" text-anchor=\"middle\">IOUT\u003c/text>\u003ctext x=\"177\" y=\"137\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M1\u003c/text>\u003ctext x=\"425\" y=\"137\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M2\u003c/text>\u003ctext x=\"214\" y=\"90\" fill=\"#93c5fd\" font-size=\"13\" text-anchor=\"middle\">Shared VGS\u003c/text>\u003ctext x=\"284\" y=\"211\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">GND / bulk ties\u003c/text>\u003c/svg>"}}]},{"title":"CMOS Amplifiers & Op-Amps","questions":[{"id":"cmos-u2-q1","subject":"cmos","unit":2,"number":1,"q":"Explain the CMOS inverter used as a common-source amplifier. Derive its small-signal voltage gain.","ans":{"s":"Bias near inverter transition. Both transconductances add. Av≈−(gmn+gmp)(ron∥rop∥RL).","m":"Biasing · Tie the gates and drains of the complementary MOSFETs. Bias near the steep VTC region so both devices conduct in saturation. A high-value output-to-input resistor can establish DC self-bias with AC-coupled input.\nGain derivation · A rising vin raises nMOS current and lowers pMOS sourcing. Thus incremental pull-down is (gmn+gmp)vin. With both rails AC-grounded, Av≈−(gmn+gmp)(ron∥rop∥RL).\nLimit · The relation holds for small signals near the selected bias point.","d":"Analog bias point · Connect pMOS and nMOS gates as VIN and drains as VOUT. Tie pMOS source and well to VDD and nMOS source and body to ground. Set VIN near the steep inverter transition so both devices conduct and can remain saturated over the intended small swing.\nBiasing methods · Set an external DC gate voltage, or connect a high-value resistor from output to input and AC-couple the signal. With negligible gate DC current the feedback resistor makes VIN≈VOUT at the switching point.\nSmall-signal action · Treat the supply rails as AC ground. Increasing vin strengthens the nMOS pull-down and reduces the pMOS pull-up. Both changes increase net incremental current leaving the output node by (gmn+gmp)vin.\nDerivation · At the output, gdsn, gdsp and the load conductance 1/RL are in parallel. KCL gives (gdsn+gdsp+1/RL)vout+(gmn+gmp)vin=0. Thus Av≈−(gmn+gmp)(ron∥rop∥RL).\nInterpretation · The negative sign shows inversion. Large combined gm and large output resistance produce gain. Lower RL reduces gain, and large input motion can push one MOSFET into triode or cutoff. Process shifts move the switching point.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 192\" role=\"img\" aria-label=\"CMOS inverter biased as an analog common-source amplifier\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>CMOS inverter biased as an analog common-source amplifier\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"499\" height=\"191\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"228\" y=\"39\" width=\"64\" height=\"30\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"228\" y=\"118\" width=\"64\" height=\"30\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M260 20 V39 M260 69 V118 M260 148 V173 M128 57 H228 M128 57 V133 H228 M260 94 H371\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M244 173 H276 M250 179 H270 M256 185 H264\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"128\" cy=\"93\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"260\" cy=\"94\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"260\" y=\"16\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"260\" y=\"59\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">PMOS\u003c/text>\u003ctext x=\"260\" y=\"138\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">NMOS\u003c/text>\u003ctext x=\"80\" y=\"98\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VBIAS + vin\u003c/text>\u003ctext x=\"397\" y=\"100\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">vout\u003c/text>\u003ctext x=\"373\" y=\"144\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">Both devices are on\u003c/text>\u003c/svg>"}},{"id":"cmos-u2-q2","subject":"cmos","unit":2,"number":2,"q":"Explain the working of a CMOS differential amplifier. Define differential-mode gain, common-mode gain and CMRR.","ans":{"s":"Differential pair steers tail current. Ad=vo/vid, Acm=vo/vcm, CMRR=|Ad/Acm|.","m":"Differential action · Two matched input MOSFETs split the tail current equally at balance. Inputs ±vid/2 produce opposite current increments ±gmvid/2, which the loads turn into voltage.\nGain · For equal resistive loads, differential gain magnitude is gmR and single-ended magnitude is gmR/2. A mirror load can combine both current changes at one output.\nRejection · Acm=vo/vcm under equal-input drive. With identical output conventions, CMRR=|Ad/Acm| or 20log10 of that ratio in dB.","d":"Input and bias · Define vid=vin+−vin− and vcm=(vin++vin−)/2. Two matched input MOSFETs share a tail current source. With vid=0 and enough headroom, each branch carries ITAIL/2.\nDifferential steering · Drive the gates by +vid/2 and −vid/2 about their common bias. Symmetry holds the common source near AC ground for this excitation. The branch currents move by +gm·vid/2 and −gm·vid/2, preserving their sum to first order.\nDifferential gain · With two equal resistive loads R, a single branch voltage changes by ∓gmR·vid/2. Their difference has gain magnitude gmR. An ideal matched current-mirror active load adds the two branch changes at one output, giving single-ended gain magnitude about gmRout.\nCommon-mode gain · Apply the same incremental voltage to both inputs. The two currents tend to change together, and finite tail resistance allows a change in their sum. Mismatch and unequal load resistance also convert common-mode input into output.\nCMRR · Define Ad=vo/vid and Acm=vo/vcm with the same output convention. CMRR=|Ad/Acm| and CMRR(dB)=20log10|Ad/Acm|. For an ideal symmetric pair with a stiff tail, common-mode conversion approaches zero."}},{"id":"cmos-u2-q3","subject":"cmos","unit":2,"number":3,"q":"Explain the cascode amplifier with a neat circuit diagram. Briefly name the telescopic and folded cascode amplifiers.","ans":{"s":"Stack a common-gate MOS over a common-source MOS. Rout≈gm2ro1ro2 for gmro≫1. Gain rises, headroom falls.","m":"Structure · Drive the lower common-source MOSFET and hold the upper common-gate MOSFET at a fixed gate bias. Take output from the upper drain. The internal node swings little, improving isolation and reducing Miller multiplication.\nGain · Rout≈ro1+ro2+gm2ro1ro2 and Av≈−gm1(Rout∥Rload), neglecting body effect. Reserve headroom for both transistors.\nVariants · A telescopic cascode stacks its stages directly. A folded cascode steers signal into an opposite-polarity common-gate branch.","d":"Circuit · Stack a common-gate transistor M2 above a common-source transistor M1. Apply VIN to M1 gate, fix M2 gate at VBIAS, and take output at M2 drain against a load connected to VDD. Mark the internal junction X as M1 drain and M2 source.\nSignal transfer · M1 converts input voltage into drain current. Looking into M2 source gives a low small-signal resistance of order 1/gm2 under suitable output loading. The cascode limits movement at X, reducing modulation of M1 current and the Miller effect of M1 Cgd.\nResistance derivation · Ground the input and M2 gate for an incremental drain test. Ignoring bulk effect, the boosted branch resistance is Rout=ro1+ro2+gm2ro1ro2. If M2 has a fixed bulk, use gm2+gmb2 in the gain product.\nVoltage gain · The approximate gain is −gm1(Rout∥Rload). To maintain saturation across the nMOS stack, allow at least VOV1+VOV2 above its source rail, plus load headroom from the opposite rail.\nVariants · A telescopic cascode stacks input and common-gate devices in the same branches. A folded cascode redirects the input differential current into a complementary common-gate branch, changing common-mode limits and usually adding bias current.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 520 265\" role=\"img\" aria-label=\"NMOS common-source/common-gate cascode with current-source load\" style=\"display:block;width:100%;height:auto;max-width:520px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>NMOS common-source/common-gate cascode with current-source load\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"519\" height=\"264\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"230\" y=\"75\" width=\"66\" height=\"32\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"230\" y=\"142\" width=\"66\" height=\"32\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M263 29 V39 M263 62 V75 M263 107 V142 M263 174 V216 M232 216 H294 M239 222 H287 M249 228 H277 M263 68 H378 M230 91 H113 M230 158 H113\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"263\" cy=\"51\" r=\"12\" fill=\"#24465d\"/>\u003ccircle cx=\"263\" cy=\"68\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"263\" cy=\"123\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"263\" y=\"23\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"263\" y=\"55\" fill=\"#dbeafe\" font-size=\"13\" text-anchor=\"middle\">↑\u003c/text>\u003ctext x=\"263\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M2 (CG)\u003c/text>\u003ctext x=\"263\" y=\"163\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M1 (CS)\u003c/text>\u003ctext x=\"96\" y=\"95\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VBIAS\u003c/text>\u003ctext x=\"96\" y=\"162\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN\u003c/text>\u003ctext x=\"403\" y=\"73\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"385\" y=\"53\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">PMOS current-source load\u003c/text>\u003ctext x=\"288\" y=\"128\" fill=\"#93c5fd\" font-size=\"13\" text-anchor=\"middle\">X\u003c/text>\u003c/svg>"}},{"id":"cmos-u2-q4","subject":"cmos","unit":2,"number":4,"q":"Write a short note on CMOS current amplifiers.","ans":{"s":"Current amplifier takes iin and scales iout. Mirror gain ≈ sizing ratio; desirable Rin low, Rout high.","m":"Current mirror · A diode-connected input MOSFET converts iin to a gate voltage, and its mirror transistor converts that voltage to iout. Its small-signal input resistance is approximately 1/(gm1+gds1).\nGain · Ai≈gm2/(gm1+gds1), close to the sizing ratio for matched devices. A simple mirror has finite output resistance ro2.\nDesign use · A cascode raises output resistance at a headroom cost. Current amplification supports bias distribution, active loads and current-mode circuits.","d":"Definition · A current amplifier senses an input current and provides a scaled output current. An ideal current-mode input accepts current with low input resistance, while a high output resistance keeps the output current stable as the load voltage changes.\nMOS mirror implementation · Inject input current into a diode-connected M1. Its gate voltage goes to M2, which converts that voltage back to an output current. Tie sources together and select NMOS as sink or PMOS as source with appropriate mirror polarity.\nSmall-signal gain · With source and body fixed, Rin≈1/(gm1+gds1). Ignoring output-voltage change, iout≈gm2·vin, so Ai≈gm2/(gm1+gds1). For matched thresholds, common overdrive and gmro≫1, this approaches the aspect-ratio ratio (W/L)2/(W/L)1.\nOutput limits · A simple mirror has Rout≈ro2. Cascoding increases Rout and improves current copying over output-voltage changes, but requires extra saturation headroom. Matching, noise, device capacitances and the input-node impedance limit accuracy and bandwidth.\nApplications · Use current amplifiers for bias fanout, active loads in differential amplifiers, current steering and current-mode signal processing. Keep both devices in their intended bias regions when specifying gain."}},{"id":"cmos-u2-q5","subject":"cmos","unit":2,"number":5,"q":"Explain the output amplifiers (source follower and class AB output stage) used in CMOS circuits.","ans":{"s":"Source follower buffers with Av\u003c1 and low Rout. Class AB push–pull supplies large load current with small idle current.","m":"Source follower · Take output from the source and use the drain as AC ground. Local feedback gives gain slightly below one and low output resistance near 1/(gm+gmb). An nMOS follower shifts DC output down by approximately VGS.\nClass AB · Bias a complementary pull-up/pull-down pair slightly on at idle. The output devices deliver larger sourcing or sinking current on demand, with crossover behavior depending on bias.\nComparison · The follower buffers a voltage. Class AB is useful for stronger load drive at moderate idle power.","d":"Source-follower topology · Drive the MOS gate and take output from its source while its drain is at AC ground. A bias source establishes DC current. A rising gate first increases current and the source follows, reducing the change in vgs through local feedback.\nFollower equations · Let R=ro∥RL∥rBias. With a fixed bulk, Av≈gm/(gm+gmb+1/R), which is slightly below one for a light load. Looking into the source with its gate AC-grounded gives output resistance around 1/(gm+gmb) when other conductances are small.\nFollower use · The output is shifted in DC by VGS for an nMOS. Limited headroom and finite bias current restrict swing and capacitive-load drive. The low output resistance makes it a useful buffer.\nClass AB topology · A complementary output stage has an active pull-up and pull-down. Bias both near slight conduction at idle. Under signal one path conducts strongly to source or sink current while the other path backs off.\nClass AB trade-off · A suitable bias limits crossover distortion while keeping quiescent current modest. Large output currents charge and discharge CL quickly. Verify positive and negative drive, output swing, bias tracking and feedback stability under representative loads."}},{"id":"cmos-u2-q6","subject":"cmos","unit":2,"number":6,"q":"Draw the block diagram and circuit of a two-stage CMOS Op-Amp. Explain the function of each stage.","ans":{"s":"NMOS differential pair + PMOS mirror → high-gain CS second stage → output. CC around stage 2 stabilizes.","m":"Signal chain · An NMOS differential pair with a PMOS mirror load converts differential input to a single-ended voltage VX. The tail current sets the operating point and transconductance.\nGain stage · VX drives an NMOS common-source stage with a PMOS current-source load. It adds gain and drives the output capacitance. The two stage gains multiply.\nCompensation · Connect Miller CC between VX and VOUT. It lowers the first-node pole and shapes closed-loop stability.","d":"Block diagram · Show a differential input stage and active load feeding a high-impedance node VX. Feed VX into a common-source second gain stage and into the output load. Connect Miller CC from VOUT back to VX and show bias current paths for both stages.\nFirst stage · M1 and M2 are NMOS input devices sharing tail sink M5. PMOS M3 is diode-connected and mirrors current into M4. The active load combines the differential branch current variations into a single-ended signal at VX. The first-stage gain magnitude is roughly gm1(ro2∥ro4).\nSecond stage · NMOS M6 has its gate at VX and is loaded by biased PMOS M7. It adds gain near −gm6(ro6∥ro7∥RL) and provides output current to the load capacitor. A higher noninverting input at the right-hand device pulls VX lower, which raises VOUT.\nCompensation · CC across the inverting second stage increases the effective capacitance at VX, lowering the dominant pole. This supports stable closed-loop operation. Check the nondominant pole and feed-forward zero.\nBias and limiting conditions · Tail current establishes first-stage transconductance and internal slew capability. Output branch bias and headroom set available current and voltage swing. Overall low-frequency gain is the product of the two stage gains.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 305\" role=\"img\" aria-label=\"Two-stage CMOS op-amp with PMOS mirror load, NMOS second stage, and Miller capacitor\" style=\"display:block;width:100%;height:auto;max-width:680px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Two-stage CMOS op-amp with PMOS mirror load, NMOS second stage, and Miller capacitor\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"679\" height=\"304\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"141\" y=\"61\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"286\" y=\"61\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"141\" y=\"137\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"286\" y=\"137\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"194\" y=\"218\" width=\"90\" height=\"29\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"508\" y=\"137\" width=\"54\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"489\" y=\"61\" width=\"92\" height=\"26\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M168 43 H535 M168 43 V61 M313 43 V61 M535 43 V61 M168 87 V137 M313 87 V137 M535 87 V137 M168 163 V194 H313 V163 M239 194 V218 M239 247 V266 M535 163 V266 M221 266 H553 M229 273 H545 M239 280 H535\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M168 107 H115 V74 H141 M195 74 H286 M195 74 V107 H168\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M141 150 H100 M340 150 H373 M489 74 H451 M194 232 H153\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M313 113 H446 V150 H508 M535 113 H607\" fill=\"none\" stroke=\"#86efac\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M446 113 V195 H479 M487 184 V206 M479 184 V206 M487 195 H607 V113\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"168\" cy=\"107\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"313\" cy=\"113\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"446\" cy=\"113\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"535\" cy=\"113\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"239\" cy=\"194\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"352\" y=\"33\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VDD\u003c/text>\u003ctext x=\"168\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M3\u003c/text>\u003ctext x=\"313\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M4\u003c/text>\u003ctext x=\"168\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M1\u003c/text>\u003ctext x=\"313\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M2\u003c/text>\u003ctext x=\"85\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN−\u003c/text>\u003ctext x=\"391\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VIN+\u003c/text>\u003ctext x=\"438\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Vbp\u003c/text>\u003ctext x=\"133\" y=\"237\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Vbn\u003c/text>\u003ctext x=\"239\" y=\"238\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M5 · tail\u003c/text>\u003ctext x=\"535\" y=\"155\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M6\u003c/text>\u003ctext x=\"535\" y=\"79\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">M7 · load\u003c/text>\u003ctext x=\"358\" y=\"107\" fill=\"#86efac\" font-size=\"13\" text-anchor=\"middle\">VX\u003c/text>\u003ctext x=\"622\" y=\"117\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VO\u003c/text>\u003ctext x=\"483\" y=\"222\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">CC\u003c/text>\u003ctext x=\"416\" y=\"296\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VSS\u003c/text>\u003c/svg>"}},{"id":"cmos-u2-q7","subject":"cmos","unit":2,"number":7,"q":"What is the need of compensation in an Op-Amp? Explain Miller compensation.","ans":{"s":"Miller CC splits poles. Dominant pole moves lower. A series nulling resistor may remove the RHP zero.","m":"Uncompensated poles · The two high-impedance gain nodes can give enough phase lag for closed-loop ringing or oscillation.\nMiller effect · Connect CC across the inverting second stage. Its input capacitance appears about CC(1+|A2|), moving the dominant pole lower and separating it from the other pole.\nPractical limit · ωu≈gm1/CC under dominant-pole assumptions. The feed-forward RHP zero adds lag, so use a suitable nulling resistor if needed and verify phase margin for the intended load.","d":"Reason for compensation · Both gain stages contain high-impedance nodes with parasitic capacitance. Their poles can contribute substantial phase lag near the loop-gain crossover. A negative-feedback connection then rings or can oscillate if phase margin is insufficient.\nMiller connection · Place CC between the first-stage node VX and VOUT, across the inverting second stage. If the latter has gain A2\u003c0, the capacitor looks approximately like CC(1+|A2|) at VX over the band where that gain approximation holds.\nPole splitting · The added effective capacitance lowers the first-node dominant pole. In a conventional design the other pole moves upward relative to crossover. Under dominant-pole and output-load assumptions, ωu≈gm1/CC and ωp2≈gm6/CL.\nFeed-forward zero · Current through CC can reach VOUT in parallel with the second stage, creating a right-half-plane zero roughly at ωz≈gm6/CC. This adds phase lag. A series nulling resistor near 1/gm6 can move the zero out of the relevant band in the simple model.\nDesign check · Select CC and output transconductance for the actual CL and feedback factor. Check phase margin at |loop gain|=1 over process, voltage and temperature, and verify transient settling and slew.","fig":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 173\" role=\"img\" aria-label=\"Miller compensation between first-stage node and op-amp output\" style=\"display:block;width:100%;height:auto;max-width:620px;margin:8px auto;font-family:system-ui,sans-serif\">\u003ctitle>Miller compensation between first-stage node and op-amp output\u003c/title>\u003crect x=\".5\" y=\".5\" width=\"619\" height=\"172\" rx=\"10\" fill=\"#090d14\" stroke=\"#334155\"/>\u003crect x=\"39\" y=\"70\" width=\"146\" height=\"42\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"271\" y=\"70\" width=\"146\" height=\"42\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003crect x=\"509\" y=\"70\" width=\"72\" height=\"42\" fill=\"#10243a\" stroke=\"#48739a\" rx=\"2\"/>\u003cpath d=\"M185 91 H271 M417 91 H509\" fill=\"none\" stroke=\"#9edad7\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003cpath d=\"M226 91 V40 H337 M337 30 V50 M345 30 V50 M345 40 H462 V91\" fill=\"none\" stroke=\"#fb7185\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003ccircle cx=\"226\" cy=\"91\" r=\"3\" fill=\"#9edad7\"/>\u003ccircle cx=\"462\" cy=\"91\" r=\"3\" fill=\"#9edad7\"/>\u003ctext x=\"112\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Differential stage\u003c/text>\u003ctext x=\"344\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Inverting stage\u003c/text>\u003ctext x=\"545\" y=\"96\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">Load CL\u003c/text>\u003ctext x=\"341\" y=\"24\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">Miller CC\u003c/text>\u003ctext x=\"226\" y=\"127\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VX\u003c/text>\u003ctext x=\"462\" y=\"127\" fill=\"#e2e8f0\" font-size=\"13\" text-anchor=\"middle\">VOUT\u003c/text>\u003ctext x=\"307\" y=\"152\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\">CC bridges the high-impedance first-stage node and output\u003c/text>\u003c/svg>"}},
